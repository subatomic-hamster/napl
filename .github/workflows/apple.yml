name: napple (Apple Silicon) wheel

# Builds the arm64 wheel with tools/napple_release.sh on a GitHub-hosted macOS 26 runner (the pinned slangc needs a
# macOS 26 build host), then installs and qualifies it on macOS 14 (the wheel's deployment floor, M1-class runner) and
# macOS 26. Standard GitHub-hosted runners are free for public repositories. The macOS 14 runner's paravirtual GPU
# lacks Metal argument encoders MoltenVK needs, so rendering is only qualified on macOS 26 (and on real hardware).
# Publishing stays manual: download the artifacts and run `tools/napple_release.sh publish`.
on:
  workflow_dispatch:
  push:
    branches: [napple]
    tags: ['napple-*']

concurrency:
  group: napple-${{ github.ref }}
  cancel-in-progress: true

env:
  NAPL_RELEASE_QOS: default # dedicated runner: no need to yield to an interactive user
  NAPL_RELEASE_JOBS: '3'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # No dependency cache: FetchContent re-applies MuJoCo's qhull patch to a restored, already patched tree and fails.
      # A cold build takes ~4 min.
      - name: Set paths
        run: |
          echo "OUT=$RUNNER_TEMP/napple" >> "$GITHUB_ENV"
          echo "NAPL_DEPS_CACHE=$RUNNER_TEMP/napple-deps" >> "$GITHUB_ENV"
      - name: Build wheel from the exported commit
        run: tools/napple_release.sh build "$GITHUB_SHA" "$OUT"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: napple-build-log-${{ github.sha }}
          path: ${{ env.OUT }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: napple-build-${{ github.sha }}
          path: |
            ${{ env.OUT }}/dist/
            ${{ env.OUT }}/build-metadata.json
            ${{ env.OUT }}/shm-smoke-client
            ${{ env.OUT }}/apple_wheel_smoke.py
          retention-days: 30

  qualify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: echo "OUT=$RUNNER_TEMP/napple" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: napple-build-${{ github.sha }}
          path: ${{ env.OUT }}
      - name: Qualify installed wheel with the checkout unreadable and the package read-only
        run: |
          chmod +x "$OUT/shm-smoke-client"
          if [ "${{ matrix.os }}" = macos-14 ]; then
            mode=(--no-render "macos-14 runner: AppleParavirtDevice lacks newArgumentEncoderWithLayout (MoltenVK vkCreateInstance)")
          elif [ "${{ matrix.python }}" = 3.12 ]; then
            mode=(--visible)
          else
            mode=()
          fi
          tools/napple_release.sh qualify "$OUT" "${{ matrix.python }}" ${mode[@]+"${mode[@]}"}
      - name: Upload qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: napple-qual-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: |
            ${{ env.OUT }}/dist/qualification-*.json
            ${{ env.OUT }}/qual${{ matrix.python }}.log
          retention-days: 30
