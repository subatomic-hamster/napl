# napl program examples/dog/missions/coverage_rubble_20k/coverage_rubble_20k.scenario.toml --runs-dir <dir>
# The headline map-quality run: coverage_rubble at the real Mid-360 point rate (20k rays / frame), scored at the map's own 5 cm
# (pool 1). Background job only (`remote.sh bg`).
name = "dog-auto-coverage-rubble-20k"

[auto]
kind = "rubble"
size = { value = 100.0, unit = "m", fidelity = "design", rationale = "Spec section 7 field." }
patch = { value = 5.0, unit = "m", fidelity = "measured", rationale = "5 m patches are 1.4x faster than 10 m on rubble (tools/bench_autonomy.py, docs/dog/autonomy.md)." }
rays = { value = 20000, unit = "1", fidelity = "datasheet", rationale = "Mid-360 point rate / frame rate." }
pool = { value = 1, unit = "1", fidelity = "design", rationale = "Full density: score 5 cm cells." }
t_budget = { value = 1200.0, unit = "s", fidelity = "design", rationale = "Spec section 7: 20 min." }
start_x = { value = -46.0, unit = "m", fidelity = "design", rationale = "South-west corner, 4 m inside, on the first lane's start." }
start_y = { value = -46.0, unit = "m", fidelity = "design", rationale = "South-west corner, 4 m inside." }
start_yaw = { value = 0.0, unit = "rad", fidelity = "design", rationale = "Facing east, along the first lane." }
lane_m = { value = 9.0, unit = "m", fidelity = "measured", rationale = "Same tuning as coverage_rubble (training seeds 1-8, 5k rays); the 20k run is the map-quality headline." }
return_margin = { value = 22.0, unit = "s", fidelity = "measured", rationale = "Same as coverage_rubble." }

[model]
script = "coverage_rubble_20k.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/../../automission.py", "{dir}/coverage_rubble_20k.scenario.toml"]

[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the terrain, the lidar / GNSS noise, the odometry drift and the initial pose error: one seed, one run."

[limits]
wall_s = 7200            # ~30-70 min expected at 20k (docs/dog/autonomy.md)
cpu_s = 7200
address_space_mb = 16384

[[monitors]]
name = "map_rms_within_5cm"   # spec section 7
column = "rms"
op = "final"
hi = 0.05

[[monitors]]
name = "localized_within_30cm"  # design: 6x the RTK 1 sigma; the map budget assumes ~2 cm
column = "err_xy"
op = "always"
hi = 0.3

[[monitors]]
name = "covers_95_percent"      # spec section 7
column = "coverage"
op = "final"
lo = 0.95

[[monitors]]
name = "returns_home"           # phase 4 = DONE
column = "phase"
op = "final"
lo = 4
hi = 4
