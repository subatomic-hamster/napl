# napl program examples/dog/missions/coverage_rubble_dog/coverage_rubble_dog.scenario.toml --runs-dir <dir>
# coverage_rubble on the legged robot (SP4's controller instead of the carrier): same field, same 20 min budget, same criteria. Long run:
# `remote.sh bg`. Measured sim speed with the C++ WBC is ~0.2 sim-s per wall-s, so ~1.5-2 h wall for the full budget
# (docs/dog/autonomy.md "On the dog"); SP4's rubble no-fall rate is 0-10 %, so a full run is not expected to survive.
name = "dog-auto-coverage-rubble-dog"

[auto]
body = "dog"
kind = "rubble"
size = { value = 100.0, unit = "m", fidelity = "design", rationale = "Spec section 7 field." }
patch = { value = 5.0, unit = "m", fidelity = "measured", rationale = "5 m patches are 1.4x faster than 10 m on rubble (tools/bench_autonomy.py, docs/dog/autonomy.md)." }
rays = { value = 5000, unit = "1", fidelity = "design", rationale = "Mission ray count (autonomy.toml lidar.rays_mission)." }
pool = { value = 2, unit = "1", fidelity = "design", rationale = "5k rays: 10 cm scoring cells (Task 10 density equivalence)." }
t_budget = { value = 1200.0, unit = "s", fidelity = "design", rationale = "Spec section 7: 20 min." }
start_x = { value = -46.0, unit = "m", fidelity = "design", rationale = "South-west corner, 4 m inside, on the first lane's start." }
start_y = { value = -46.0, unit = "m", fidelity = "design", rationale = "South-west corner, 4 m inside." }
start_yaw = { value = 0.0, unit = "rad", fidelity = "design", rationale = "Facing east, along the first lane." }
lane_m = { value = 9.0, unit = "m", fidelity = "measured", rationale = "As coverage_rubble (tuned on the carrier, training seeds 1-8)." }
return_margin = { value = 18.0, unit = "s", fidelity = "measured", rationale = "As coverage_rubble (tuned on the carrier); the dog at 0.8 m/s needs far more, so this run reports how far it gets, not a pass." }

[model]
script = "coverage_rubble_dog.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/../../automission.py", "{dir}/coverage_rubble_dog.scenario.toml"]

[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the terrain, the lidar / GNSS noise and the initial pose error: one seed, one run."

[limits]
wall_s = 7200            # ~1.5-2 h expected on the dog at 5k (measured 0.2 sim-s per wall-s)
cpu_s = 7200
address_space_mb = 16384

[[monitors]]
name = "map_rms_within_5cm"   # spec section 7
column = "rms"
op = "final"
hi = 0.05

[[monitors]]
name = "localized_within_30cm"  # design: 6x the RTK 1 sigma; the map budget assumes ~2 cm
column = "err_xy"
op = "always"
hi = 0.3

[[monitors]]
name = "covers_95_percent"      # spec section 7
column = "coverage"
op = "final"
lo = 0.95

[[monitors]]
name = "returns_home"           # phase 4 = DONE
column = "phase"
op = "final"
lo = 4
hi = 4

[[monitors]]
name = "never_falls"
column = "fallen"
op = "always"
hi = 0
