# napl program examples/dog/missions/fam_ruins/fam_ruins.scenario.toml --runs-dir <dir>
# SP6 full-stack family Monte Carlo: 30 x 30 m ruins (6 x 6 cells of 5 m, 0.8-1.6 m doors) on the dog. Seeds from examples/dog/missionmc.py.
name = "dog-fam-ruins"

[auto]
body = "dog"
kind = "ruins"
size = { value = 30.0, unit = "m", fidelity = "design", rationale = "SP6 family MC: ~11x fewer lidar-hit cells than 100 m (docs/dog/missions.md budget)." }
patch = { value = 10.0, unit = "m", fidelity = "measured", rationale = "10 m and 5 m patches cost the same on ruins (docs/dog/autonomy.md); 10 m kept." }
rays = { value = 5000, unit = "1", fidelity = "design", rationale = "Mission ray count (autonomy.toml lidar.rays_mission)." }
pool = { value = 2, unit = "1", fidelity = "design", rationale = "5k rays: 10 cm scoring cells (SP5 Task 10 density equivalence)." }
t_budget = { value = 700.0, unit = "s", fidelity = "measured", rationale = "Tuning round 1 (docs/dog/missions.md): at 420 s the ruins runs that did not fall were still at 70 % coverage when the return trigger fired (seeds 5001, 5006: 146-161 m walked, 0.34 m/s); the maze path is ~1.7x the 140 m of the open-field estimate." }
start_x = { value = -12.5, unit = "m", fidelity = "design", rationale = "A ruins cell centre: walls lie on the 5 m grid from -15, so the cell centre next to the south-west corner is -12.5 (3 m rule of the other 30 m fields, snapped to the cell)." }
start_y = { value = -12.5, unit = "m", fidelity = "design", rationale = "A ruins cell centre." }
start_yaw = { value = 0.0, unit = "rad", fidelity = "design", rationale = "Facing east." }
block = { value = 0.3, unit = "m", fidelity = "measured", rationale = "autonomy.md: 0.5 m blocks read 0.8-1.6 m doors closed (the robot's reachable set stayed inside its first rooms); 0.3 m blocks: 108515 of 110889 reachable." }
near_lethal = { value = 6.0, unit = "1", fidelity = "estimated", rationale = "As coverage_ruins: cost of a block next to a wall so the body keeps off walls." }
near_wall_speed = { value = 0.8, unit = "m/s", fidelity = "estimated", rationale = "As coverage_ruins: speed cap within 0.6 m of a wall (above the dog's [dog] limit of 0.4 m/s, which clamps it anyway)." }
return_margin = { value = 60.0, unit = "s", fidelity = "estimated", rationale = "Head home with a minute in hand; the 30 m maze way home is a fifth of the 100 m one (coverage_ruins uses 120 s)." }
near_wall_lookahead = { value = 0.45, unit = "m", fidelity = "estimated", rationale = "As coverage_ruins: short lookahead next to walls." }
edge_margin = { value = 0.30, unit = "m", fidelity = "measured", rationale = "As coverage_ruins: map RMS scored on floor cells at least 0.30 m from a wall (docs/dog/autonomy.md Coverage, ruins)." }

[model]
script = "fam_ruins.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/../../automission.py", "{dir}/fam_ruins.scenario.toml"]

[[parameters]]
name = "seed"
type = "int"
default = 5001
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the terrain, the lidar / GNSS noise, the odometry drift and the initial pose error: one seed, one run."

[limits]
wall_s = 3600            # 420 s mission at 0.34 sim-s per wall-s on the flat ruins floor (ruins probe, docs/dog/missions.md Budget) = ~21 min
cpu_s = 3600
address_space_mb = 16384

[[monitors]]
name = "map_rms_within_5cm"   # spec section 7
column = "rms"
op = "final"
hi = 0.05

[[monitors]]
name = "localized_within_30cm"  # design: 6x the RTK 1 sigma; the map budget assumes ~2 cm
column = "err_xy"
op = "always"
hi = 0.3

[[monitors]]
name = "covers_95_percent"      # spec section 7
column = "coverage"
op = "final"
lo = 0.95

[[monitors]]
name = "returns_home"           # phase 4 = DONE
column = "phase"
op = "final"
lo = 4
hi = 4

[[monitors]]
name = "never_falls"
column = "fallen"
op = "always"
hi = 0
