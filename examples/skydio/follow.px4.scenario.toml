# napl program examples/skydio/follow.px4.scenario.toml --runs-dir <dir>      (needs PX4 SITL, napl-px4-bridge and mavsdk; see python/napl/px4.py)
# Mission (b) of follow.scenario.toml, but PX4 SITL flies the airframe: the Skydio autonomy (px4_fly.py) is a COMPANION COMPUTER. It sends PX4 the VIO
# estimate as MAVLink ODOMETRY (EKF2 external-vision fusion, GPS disabled), the depth map as OBSTACLE_DISTANCE, and the planner's trajectory as offboard
# position / velocity / acceleration set-points; PX4's own controllers fly. Same monitors, same thresholds as the native scenario (not widened).
# PX4 is not lockstep-deterministic in its timing: each run replays to ITS OWN hash (result.json replay.match checks that, not a fixed number). See README.md "On PX4".
name = "skydio-follow-px4"

[model]
script = "scene_follow.py"

[interfaces.px4]
bridge = "../../px4/bridge_skydio.toml"            # no gnss: GPS-denied; the scene comes from [model] above
ctl = true                                         # the companion reads its sensors (IMU history, barometer, depth) on the bridge's ctl socket: env NAPL_CTL
monitor_trace = "companion.csv"                    # monitors are judged on the companion's trace (truth clearance, contacts, follow distance); trace.csv is the bridge's
# PX4 v1.17.0 parameters on top of px4/params/napl_sitl.params (names checked against the PX4 tree the bridge runs):
[interfaces.px4.params]
EKF2_GPS_CTRL = 0               # GPS-denied: HIL_GPS is not even sent (bridge_skydio.toml has no gnss), and EKF2 would ignore it
EKF2_EV_CTRL = 15               # external vision: horizontal position (1) + vertical position (2) + 3D velocity (4) + yaw (8)
EKF2_HGT_REF = 3                # height reference = vision (the companion's estimate already fuses the barometer)
EKF2_MAG_TYPE = 5               # no magnetometer fusion: under a canopy / near a regulator the heading is the VIO's
EKF2_EV_DELAY = 20              # ms: ESKF output to EKF2 (MAVLink over UDP + Python)
EKF2_EV_NOISE_MD = 1            # use the EKF2_EV*_NOISE below, not the message covariance (the ESKF's grows without bound: it has no absolute fix)
EKF2_EVP_NOISE = 0.1            # m
EKF2_EVV_NOISE = 0.1            # m/s
EKF2_EVA_NOISE = 0.05           # rad
SYS_HAS_MAG = 0
SYS_HAS_GPS = 0
MPC_TILTMAX_AIR = 26            # deg: the native controller's max tilt is 0.45 rad = 25.8 deg
CP_DIST = 1.0                   # m: PX4 collision prevention (consumes OBSTACLE_DISTANCE); v1.17 applies it in Position mode only, not offboard (README)

[program]
cmd = ["python", "{dir}/px4_fly.py"]
env = { SKYDIO_MISSION = "follow" }            # the seed comes from the `seed` parameter below (NAPL_PARAMS='{"seed": 111}'), for the model script and px4_fly.py alike

[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the forest and the subject's route, the wind turbulence, the IMU / VIO / baro noise and the detector miss pattern. PX4's timing makes the flight itself not repeatable from the seed (the native scenario is)."

[limits]
wall_s = 900                                  # ~60-90 s PX4 boot + estimator settle, ~60 s flight at real time, tail
cpu_s = 900
address_space_mb = 16384

# monitors: columns of <run dir>/companion.csv, one row per 16 ms of sim time from take-off (t = 0) on; identical to follow.scenario.toml
[[monitors]]
name = "no_collision"                        # airframe vs obstacles and vs the subject (both contact sensors)
column = "contact_steps"
op = "always"
hi = 0

[[monitors]]
name = "clearance_positive"
column = "clearance_m"
op = "always"
lo = 0.05

[[monitors]]
name = "follow_distance_band"                # horizontal drone-subject distance once the walk is under way
column = "follow_dist"
op = "always"
from = 10
lo = 3.0
hi = 8.0

[[monitors]]
name = "subject_tracked"                     # the detector/tracker has the subject in view at the end
column = "subject_seen"
op = "eventually"
from = 20
lo = 1

[[monitors]]
name = "stays_upright"
column = "tilt_deg"
op = "always"
hi = 45
