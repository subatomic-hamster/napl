# napl program examples/cuas-lite/s7_fault_deadman.scenario.toml --runs-dir <dir>
# cuas-lite SAFETY scenario (spec 3.2 row 6): three hung balloons, ARM at t = 8 s, and at the first moment a pusher cycle is in progress (FIRE accepted, ball not yet fed)
# the web dead-man stops (the operator lets go). The dead-man is fresh for 0.5 s: no ball may be fed later than 0.62 s after the lapse, the flywheel must be off after 1 s.
# The verdict is in lite.json ("checks", Referee windows) and the trace column viol_cut.
name = "cuas-lite-s7-deadman"

[model]
script = "scene.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/run.py"]
env = { CUAS_SCENARIO = "s7_fault_deadman", CUAS_SEED = "1" }

[limits]
wall_s = 900
cpu_s = 900
address_space_mb = 16384

[[monitors]]
name = "no_launcher_refusal"
column = "fires_unauthorized"
op = "always"
hi = 0

[[monitors]]
name = "projectiles_stay_in_range_box"
column = "pellet_range_m"
op = "always"
hi = 400

[[monitors]]
name = "no_ball_after_the_cut"
column = "viol_cut"
op = "always"
hi = 0

[[monitors]]
name = "no_safety_violation"
column = "violations"
op = "always"
hi = 0
