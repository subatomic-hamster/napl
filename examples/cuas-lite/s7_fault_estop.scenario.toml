# napl program examples/cuas-lite/s7_fault_estop.scenario.toml --runs-dir <dir>
# cuas-lite SAFETY scenario (spec 3.2 row 7): three hung balloons, ARM at t = 8 s, and at the first moment a pusher cycle is in progress the E-stop is pressed (NC contact
# opens: the weapon rail is cut). No ball may be fed after the next control period (6 ms); the MCU must end in SAFE with the flywheel off and the app disarmed.
name = "cuas-lite-s7-estop"

[model]
script = "scene.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/run.py"]
env = { CUAS_SCENARIO = "s7_fault_estop", CUAS_SEED = "1" }

[limits]
wall_s = 900
cpu_s = 900
address_space_mb = 16384

[[monitors]]
name = "no_launcher_refusal"
column = "fires_unauthorized"
op = "always"
hi = 0

[[monitors]]
name = "projectiles_stay_in_range_box"
column = "pellet_range_m"
op = "always"
hi = 400

[[monitors]]
name = "no_ball_after_the_cut"
column = "viol_cut"
op = "always"
hi = 0

[[monitors]]
name = "no_safety_violation"
column = "violations"
op = "always"
hi = 0
