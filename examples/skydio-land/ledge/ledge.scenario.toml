# napl program examples/skydio-land/ledge/ledge.scenario.toml --runs-dir <dir>
# Ledge landing at ~3000 m: take off from the crest of a seeded ridge, cross to the steep lee face and land on a ledge pad cut into it (3.5 m radius, 8 m blend: the
# ground falls away on the lower side) in the lee of the crest: the cross-ridge wind separates there, the terrain wind field adds lee turbulence and a downdraft on top of
# the Dryden turbulence. In ~35 % of the seeds the ledge holds three boulders and the vehicle lands on the second ledge, 32 m along the contour.
name = "skyland-ledge"

[land]
family = "ledge"
rtk = true
terrain_following = true
origin_alt = 3000.0            # m MSL of the take-off pad
wind_az_deg = 0.0              # toward +x: over the crest, onto the steep (lee) face
wind_jitter_deg = 20.0
cruise_h = 3.0
band_hi = 12.0
map_z_lo = -22.0
map_z_hi = 26.0

[land.wind_field]
z0 = 0.01
ridge_gain = 1.0
lee_turb = 3.0                 # m/s RMS turbulence added in the lee (windfield.cpp)
lee_down = 0.3                 # downdraft per unit of mean wind in the lee

[model]
script = "ledge.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/../land_fly.py", "{dir}/ledge.scenario.toml"]

[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the terrain, the wind azimuth, the turbulence, the hazard draw and the sensor noise: one seed, one flight."

[[parameters]]
name = "wind_ms"
type = "float"
default = 6.0
min = 0.0
max = 14.0
unit = "m/s"
group = "environment"
label = "Mean wind (10 m)"

[[parameters]]
name = "turbulence_ms"
type = "float"
default = 2.5
min = 0.0
max = 8.0
unit = "m/s"
group = "environment"
label = "Dryden level W20"
doc = "MIL-F-8785C turbulence intensity parameter: wind speed at 6.1 m."

[[parameters]]
name = "gust_ms"
type = "float"
default = 0.0
min = 0.0
max = 12.0
unit = "m/s"
group = "environment"
label = "Gust front"
doc = "Peak of a 1-cos gust front moving with the mean wind; 0 = none."

[[parameters]]
name = "gust_t_s"
type = "float"
default = 80.0
min = 0.0
max = 400.0
unit = "s"
group = "environment"
label = "Gust front time"

[[parameters]]
name = "hazard"
type = "choice"
choices = ["auto", "yes", "no"]
default = "auto"
group = "mission"
label = "Boulders on the ledge"
doc = "auto: drawn from the seed (about 35 %); yes / no force it."

[[parameters]]
name = "t_max_s"
type = "float"
default = 360.0
min = 60.0
max = 600.0
unit = "s"
group = "run"
label = "Longest flight"

[limits]
wall_s = 1200
cpu_s = 1200
address_space_mb = 16384

[[monitors]]
name = "no_collision"
column = "contact_steps"
op = "always"
hi = 0

[[monitors]]
name = "no_crash"
column = "crash"
op = "always"
hi = 0

[[monitors]]
name = "clearance_positive"
column = "clearance_m"
op = "always"
lo = 0.05

[[monitors]]
name = "lands_within_300s"
column = "landed"
op = "eventually"
lo = 1
to = 300

[[monitors]]
name = "touchdown_vertical_speed"
column = "td_speed_ms"
op = "final"
hi = 1.0

[[monitors]]
name = "touchdown_tilt"
column = "td_tilt_deg"
op = "final"
hi = 12

[[monitors]]
name = "on_a_safe_zone"
column = "td_dist_m"
op = "final"
hi = 5.0

[[monitors]]
name = "on_a_safe_spot"                      # TRUTH: the detector's thresholds (slope, roughness, rises, drop-offs) on the exact surface at the touchdown point
column = "td_safe"
op = "final"
lo = 1

[[monitors]]
name = "stays_upright"
column = "tilt_deg"
op = "always"
hi = 45
