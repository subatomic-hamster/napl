# napl program examples/asv/asv-patrol.scenario.toml --runs-dir <dir>
# Patrol in waves: the ASV flies a 100 m x 18 m rectangle (5 waypoints, 1.5 m/s, LOS guidance) with two floating obstacles (0.35 m buoys, 0.5 m high) on the route legs. It sees
# them only as lidar returns, keeps 6 m off them (planner D_STATIC) and returns to the route. No traffic. asv/run.py OWNS the Sim, runs the autonomy (asv.estimator ->
# perception -> planner -> control), and writes trace.csv / replay.naplog / native.json / telemetry.jsonl; the runner judges the monitors on trace.csv (columns from TRUE tracks)
# and re-runs replay.naplog through napl-replay for the state hash. See examples/asv/README.md.
name = "asv-patrol"

[model]
script = "model.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/run.py", "patrol"]

[limits]
wall_s = 900
cpu_s = 900

# ---- parameters & telemetry (napl.params) --------------------------------------------------------------------------------------------------------------
[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the sensor noise (every device), the JONSWAP phases and the wave direction: the same seed and parameters replay to the same state hash."

[[parameters]]
name = "hs"
type = "float"
default = 0.4
min = 0.0
max = 1.0
unit = "m"
group = "environment"
label = "Significant wave height"
doc = "Hm0 of the JONSWAP sea (gamma 3.3, 24 components, unidirectional). The Monte Carlo draws 0.2 - 0.8 m; the peak period follows the steepness limit (examples/asv/encounters.py peak_period)."

[[parameters]]
name = "jitter"
type = "float"
default = 0.0
min = 0.0
max = 1.0
group = "scenario"
label = "Geometry scatter"
doc = "0 = the fixed course (waves from 15 degrees off the bow); 1 = the wave direction is drawn from the seed within +-60 degrees of the bow."

[[parameters]]
name = "ais"
type = "bool"
default = true
group = "scenario"
label = "Traffic carries AIS"
doc = "Unused in the patrol (no traffic)."

[[parameters]]
name = "traffic_complies"
type = "bool"
default = true
group = "scenario"
label = "Traffic obeys the Rules"
doc = "Unused in the patrol (no traffic)."

[[parameters]]
name = "visual"
type = "bool"
default = false
group = "run"
label = "Build visual meshes"
doc = "Generate the part visuals for rendering; the physics and the lidar are the same either way."

[[telemetry]]
name = "pose.x_m"
unit = "m"
group = "truth"
label = "East (truth)"

[[telemetry]]
name = "pose.y_m"
unit = "m"
group = "truth"
label = "North (truth)"

[[telemetry]]
name = "pose.heading_deg"
unit = "deg"
group = "truth"
label = "Heading (truth, clockwise from North)"

[[telemetry]]
name = "pose.sog_ms"
unit = "m/s"
group = "truth"
label = "Speed over ground (truth)"
min = 0
max = 2.5

[[telemetry]]
name = "est.x_m"
unit = "m"
group = "navigation"
label = "East (estimate)"

[[telemetry]]
name = "est.y_m"
unit = "m"
group = "navigation"
label = "North (estimate)"

[[telemetry]]
name = "est.heading_deg"
unit = "deg"
group = "navigation"
label = "Heading (estimate)"

[[telemetry]]
name = "est.sog_ms"
unit = "m/s"
group = "navigation"
label = "Speed over ground (estimate)"
min = 0
max = 2.5

[[telemetry]]
name = "sp.heading_deg"
unit = "deg"
group = "control"
label = "Heading setpoint"

[[telemetry]]
name = "sp.speed_ms"
unit = "m/s"
group = "control"
label = "Speed setpoint"
min = 0
max = 2.5

[[telemetry]]
name = "sp.thr_port"
unit = "1"
group = "control"
label = "Port thruster throttle"
min = -1
max = 1

[[telemetry]]
name = "sp.thr_stbd"
unit = "1"
group = "control"
label = "Starboard thruster throttle"
min = -1
max = 1

[[telemetry]]
name = "mission.xte_m"
unit = "m"
group = "mission"
label = "Cross-track error (estimate, + left of the leg)"

[[telemetry]]
name = "mission.dist_to_wp_m"
unit = "m"
group = "mission"
label = "Distance to the next waypoint"

[[telemetry]]
name = "rule"
kind = "string"
group = "colreg"
label = "Rule in effect"
doc = "none (no traffic in the patrol)."

[[telemetry]]
name = "emergency"
kind = "bool"
group = "colreg"
label = "Stand-on vessel acting (Rule 17)"

# ---- monitors (judged on trace.csv; the distances come from the TRUE tracks) -----------------------------------------------------------------------------
[[monitors]]
name = "no_collision"                  # hull centre >= 0.75 m from any static object
column = "collision"
op = "always"
hi = 0.5

[[monitors]]
name = "clear_of_fixed_objects"        # closest approach of the hull centre to a float, shoreline or pier: at least 2 m (the planner aims at 6 m)
column = "static_clear_m"
op = "final"
lo = 2.0

[[monitors]]
name = "mission_complete"              # the last waypoint reached (estimate) and the true position within 8 m of it
column = "mission_done"
op = "final"
lo = 0.5

[[monitors]]
name = "estimate_position"             # the GNSS error (2.5 m CEP, slowly varying) bounds this; nothing else is expected to
column = "est_pos_err_m"
op = "always"
from = 6.0
hi = 8.0

[[monitors]]
name = "estimate_heading"
column = "est_hdg_err_deg"
op = "always"
from = 6.0
lo = -15
hi = 15
