# napl program examples/hopper/gusts.scenario.toml --runs-dir <dir>
# Mission (c): the EDF hopper hops to 15 m, crosses 6 m, hovers 4 s and lands on a second pad in a 5 m/s wind with Dryden gusts (MIL-F-8785C, W20 = 5 m/s) and two faults on the way: at t = 14 s one of the four
# vane servos (drawn from the seed) loses 65 % of its torque and half of its stiffness, 3 s later the pack's open-circuit voltage steps down by 1.5 V (a cell going bad / a cold pack). The flight software
# does not know about either: it sees the voltage in its battery monitor and the vane it cannot steer in the attitude error. hopper/hop.py OWNS the Sim; see examples/hopper/README.md.
# One flight is not the claim: the claim is the success rate over the scatter (examples/hopper/mc.py --scenario gusts).
name = "hopper-gusts"

[model]
script = "scene.py"

[interfaces.native]

[program]
cmd = ["python", "{dir}/hop.py", "gusts.scenario.toml"]

[limits]
wall_s = 900
cpu_s = 900

[[parameters]]
name = "seed"
type = "int"
default = 1
min = 1
max = 1000000
group = "run"
label = "Seed"
doc = "Seeds the sensor noise, the Dryden turbulence, every scatter draw and the choice of the degraded servo: the same seed and parameters replay to the same state hash."

[[parameters]]
name = "max_s"
type = "float"
default = 90.0
min = 10.0
max = 200.0
unit = "s"
group = "run"
label = "Longest flight"

[[parameters]]
name = "alt_m"
type = "float"
default = 15.0
min = 2.0
max = 40.0
unit = "m"
group = "mission"
label = "Cruise height"

[[parameters]]
name = "hold_s"
type = "float"
default = 4.0
min = 0.0
max = 30.0
unit = "s"
group = "mission"
label = "Hover time above the second pad"

[[parameters]]
name = "dx_m"
type = "float"
default = 6.0
min = -30.0
max = 30.0
unit = "m"
group = "mission"
label = "Second pad east of the first"

[[parameters]]
name = "dy_m"
type = "float"
default = 0.0
min = -30.0
max = 30.0
unit = "m"
group = "mission"
label = "Second pad north of the first"

[[parameters]]
name = "t_launch"
type = "float"
default = 3.0
min = 2.5
max = 10.0
unit = "s"
group = "mission"
label = "Spool-up time"

[[parameters]]
name = "vmax_xy"
type = "float"
default = 2.5
min = 0.5
max = 5.0
unit = "m/s"
group = "flight"
label = "Largest transit speed"

[[parameters]]
name = "vmax_up"
type = "float"
default = 3.5
min = 0.5
max = 6.0
unit = "m/s"
group = "flight"
label = "Largest climb speed"

[[parameters]]
name = "vmax_down"
type = "float"
default = 3.0
min = 0.5
max = 6.0
unit = "m/s"
group = "flight"
label = "Largest descent speed (above the final approach)"

[[parameters]]
name = "v_sink_min"
type = "float"
default = 0.25
min = 0.1
max = 0.6
unit = "m/s"
group = "flight"
label = "Touchdown sink rate"

[[parameters]]
name = "wn_att"
type = "float"
default = 9.0
min = 4.0
max = 20.0
unit = "rad/s"
group = "flight"
label = "Roll / pitch loop bandwidth"

[[parameters]]
name = "kp_xy"
type = "float"
default = 2.5
min = 0.2
max = 3.0
unit = "1/s^2"
group = "flight"
label = "Horizontal position gain"

[[parameters]]
name = "kd_xy"
type = "float"
default = 3.3
min = 0.5
max = 5.0
unit = "1/s"
group = "flight"
label = "Horizontal velocity gain"

[[parameters]]
name = "ki_xy"
type = "float"
default = 1.0
min = 0.0
max = 2.0
unit = "1/s^3"
group = "flight"
label = "Horizontal position integral gain"

[[parameters]]
name = "tilt_max_deg"
type = "float"
default = 20.0
min = 5.0
max = 30.0
unit = "deg"
group = "flight"
label = "Largest commanded lean"

[[parameters]]
name = "wind_ms"
type = "float"
default = 5.0
min = 0.0
max = 8.0
unit = "m/s"
group = "environment"
label = "Wind (upper bound or fixed value)"
doc = "Steady horizontal wind; the Dryden turbulence intensity follows it (w20 = this) unless w20_ms is set. With wind_fixed off, the speed of a flight is uniform in 0.4..1 x this."

[[parameters]]
name = "wind_fixed"
type = "bool"
default = true
group = "environment"
label = "Wind speed fixed"

[[parameters]]
name = "wind_dir_deg"
type = "float"
default = 200.0
min = -1.0
max = 360.0
unit = "deg"
group = "environment"
label = "Wind direction"
doc = "Direction the wind blows towards, from world +x towards +y; -1 = drawn from the seed."

[[parameters]]
name = "w20_ms"
type = "float"
default = -1.0
min = -1.0
max = 12.0
unit = "m/s"
group = "environment"
label = "Gust reference wind"
doc = "W20 of the Dryden model (MIL-F-8785C); -1 = equal to the mean wind."

[[parameters]]
name = "disperse"
type = "bool"
default = true
group = "scatter"
label = "Vehicle and sensor scatter on"
doc = "Off: the nominal vehicle (the numbers of the parts); on: the scatter below, drawn from the seed."

[[parameters]]
name = "thrust_tol"
type = "float"
default = 0.05
min = 0.0
max = 0.15
group = "scatter"
label = "Fan thrust (uniform +-)"
doc = "Relative error of the fan's thrust and torque coefficients against the part's table: uniform within this bound."

[[parameters]]
name = "mass_tol"
type = "float"
default = 0.03
min = 0.0
max = 0.1
group = "scatter"
label = "Mass (uniform +-)"
doc = "Every part's mass scaled by the same factor; the flight computer still believes the design's mass."

[[parameters]]
name = "cg_tol_m"
type = "float"
default = 0.004
min = 0.0
max = 0.02
unit = "m"
group = "scatter"
label = "Centre-of-mass offset (uniform +-, each axis)"
doc = "Realised as a battery shift of 4 x this (the pack is 25 % of the mass)."

[[parameters]]
name = "soc_drop"
type = "float"
default = 0.3
min = 0.0
max = 0.6
group = "scatter"
label = "Battery charge at start: 1 - U(0, this)"

[[parameters]]
name = "noise_extra"
type = "float"
default = 0.5
min = 0.0
max = 2.0
group = "scatter"
label = "Sensor noise: x (1 + U(0, this)) the datasheet value"
doc = "Applied to the IMU, barometer and lidar noise separately."

[[parameters]]
name = "backlash_deg"
type = "float"
default = 0.5
min = 0.0
max = 3.0
unit = "deg"
group = "scatter"
label = "Servo backlash (half width, upper bound)"
doc = "Play of the vane servos' gear trains: uniform in 0..this per flight."

[[parameters]]
name = "servo_p_drop"
type = "float"
default = 0.3
min = 0.0
max = 0.8
group = "scatter"
label = "Servo stiffness: x (1 - U(0, this))"
doc = "Position gain of all four servos scaled down per flight (slower, softer vanes: the lag dispersion)."

[[parameters]]
name = "gyro_bias_dps"
type = "float"
default = 0.25
min = 0.0
max = 1.0
unit = "deg/s"
group = "scatter"
label = "Gyro zero-rate offset (1 sigma)"

[[parameters]]
name = "accel_bias_ms2"
type = "float"
default = 0.1
min = 0.0
max = 0.5
unit = "m/s^2"
group = "scatter"
label = "Accelerometer offset (1 sigma)"

[[parameters]]
name = "gnss_rtk"
type = "bool"
default = true
group = "scatter"
label = "RTK GNSS (off: the NEO-M8N of the lander)"

[[parameters]]
name = "fault_servo"
type = "bool"
default = true
group = "faults"
label = "Degrade one servo"
doc = "At t_fault one of the four vane servos (drawn from the seed) loses its torque limit (35 %) and half its stiffness."

[[parameters]]
name = "fault_torque"
type = "float"
default = 0.35
min = 0.1
max = 1.0
group = "faults"
label = "Faulty servo torque limit (share)"

[[parameters]]
name = "fault_p"
type = "float"
default = 0.5
min = 0.1
max = 1.0
group = "faults"
label = "Faulty servo stiffness (share)"

[[parameters]]
name = "fault_batt_v"
type = "float"
default = 1.5
min = 0.0
max = 5.0
unit = "V"
group = "faults"
label = "Battery voltage step"
doc = "3 s after t_fault the pack's open-circuit voltage drops by this much; 0 = none."

[[parameters]]
name = "t_fault"
type = "float"
default = 14.0
min = 5.0
max = 60.0
unit = "s"
group = "faults"
label = "Time of the servo fault"

[[telemetry]]
name = "state"
kind = "string"
group = "flight"
label = "Flight state"
doc = "PAD, READY, SPOOL, CLIMB, TRANSIT, HOVER, DESCENT, FINAL, TOUCHDOWN, LANDED, ABORT_LAND or FAULT."

[[telemetry]]
name = "est.alt_m"
unit = "m"
group = "navigation"
label = "Height (estimate)"
min = 0
max = 30

[[telemetry]]
name = "est.vz_ms"
unit = "m/s"
group = "navigation"
label = "Vertical speed (estimate)"
