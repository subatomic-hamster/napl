# ---- monitors (judged on trace.csv) ----------------------------------------------------------------------------------------------------------------------
[[monitors]]
name = "stands_on_the_pad"
column = "tilt_deg"
op = "always"
from = 0.1
to = 2.9
hi = 0.5

[[monitors]]
name = "reaches_cruise_height"         # 15 m
column = "z_m"
op = "eventually"
lo = 14.0

[[monitors]]
name = "crosses_six_metres"
column = "range_m"
op = "eventually"
lo = 5.5

[[monitors]]
name = "no_abort"
column = "abort"
op = "final"
hi = 0.5

[[monitors]]
name = "touchdown_speed"               # < 0.5 m/s (the hardest ground contact counts)
column = "td_speed_ms"
op = "final"
hi = 0.5

[[monitors]]
name = "touchdown_tilt"                # < 5 deg
column = "td_tilt_deg"
op = "final"
hi = 5

[[monitors]]
name = "lands_on_the_second_pad"       # within 0.3 m of its centre
column = "td_dist_m"
op = "final"
hi = 0.3

[[monitors]]
name = "battery_voltage"               # 3.0 V per cell is the pack's cut-off
column = "vbat_v"
op = "always"
lo = 18.0

[[monitors]]
name = "battery_charge"
column = "soc"
op = "final"
lo = 0.15

[[monitors]]
name = "stays_upright"
column = "tilt_deg"
op = "final"
hi = 5

[[monitors]]
name = "vane_saturation"               # < 10 % of the powered time with a roll / pitch vane command at the 17 deg limit
column = "sat_frac"
op = "final"
hi = 0.10
