# napl program examples/car4/square.scenario.toml
# The 4-wheel skid-steer car (assemblies/car4.toml: 4 x Pololu 37D 4751 gearmotors, 2 x RoboClaw 2x7A, 3S LiPo; built from an empty design,
# docs/showcase/car/README.md) on two RoboClaw Packet Serial ptys (left 0x80 -> NAPL_SERIAL, right 0x81 -> NAPL_SERIAL_2); square.py (the unmodified
# official `basicmicro` library) drives a 1 m square by encoder odometry. Needs the `rover` extra (pip install -e ".[rover]").
name = "car4-square"

[model]
assembly = "../../assemblies/car4.toml"   # the free-base car on the floor plane

[interfaces.roboclaw]
motors = { 1 = "/devices/wheel_fl", 2 = "/devices/wheel_rl" }   # left controller: M1 = front-left, M2 = rear-left
address = 128                                                    # 0x80
baud = 38400                                                     # the library default
controllers = [{ address = 129, motors = { 1 = "/devices/wheel_fr", 2 = "/devices/wheel_rr" } }]   # right controller 0x81

[program]
cmd = ["python", "{dir}/square.py"]

[limits]
wall_s = 200
sim_s = 150
cpu_s = 200

# Columns of trace.csv for the replay renderer / the tests (always inside their wide limits: not checks)
[[monitors]]
name = "x"
path = "/world/plate"
attr = "pos"
index = 0
op = "always"
lo = -10
hi = 10

[[monitors]]
name = "y"
path = "/world/plate"
attr = "pos"
index = 1
op = "always"
lo = -10
hi = 10

[[monitors]]
name = "z"
path = "/world/plate"
attr = "pos"
index = 2
op = "always"
lo = 0.016
hi = 0.028     # plate height stays 21.7 mm +- 6 mm: no tipping

[[monitors]]
name = "qw"
path = "/world/plate"
attr = "quat"
index = 0
op = "always"
lo = -1.01
hi = 1.01

[[monitors]]
name = "qz"
path = "/world/plate"
attr = "quat"
index = 3
op = "always"
lo = -1.01
hi = 1.01

[[monitors]]
name = "back_at_start"                 # final position within 12 cm of the start (4 scrubbing turns; measured 3.4 - 9.0 cm over 10 runs)
path = "/world/plate"
attr = "pos"
indices = [0, 1]
ref = [0.0, 0.0]
op = "final"
hi = 0.12

[[monitors]]
name = "corner_1_0"                    # the three other corners were visited (within 12 cm)
path = "/world/plate"
attr = "pos"
indices = [0, 1]
ref = [1.0, 0.0]
op = "eventually"
hi = 0.12

[[monitors]]
name = "corner_1_1"
path = "/world/plate"
attr = "pos"
indices = [0, 1]
ref = [1.0, 1.0]
op = "eventually"
hi = 0.12

[[monitors]]
name = "corner_0_1"
path = "/world/plate"
attr = "pos"
indices = [0, 1]
ref = [0.0, 1.0]
op = "eventually"
hi = 0.12

[[monitors]]
name = "no_motor_alarm"
paths = ["/devices/wheel_fl", "/devices/wheel_rl", "/devices/wheel_fr", "/devices/wheel_rr"]
attr = "alarm"
op = "always"
hi = 0

[[monitors]]
name = "pack_above_cutoff"             # 3S pack never below 9.0 V (3.0 V / cell)
path = "/devices/battery"
attr = "voltage"
op = "always"
lo = 9.0
