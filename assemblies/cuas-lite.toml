# ================================================================ device maps =====================================================================================================
[device_maps.psu]
voltage = "v_out_nominal"
r_series = "r_out"
i_limit = "current_limit"

# NEMA 17 + TMC2209 as a position servo: the kernel's servo device (DC motor + belt reduction + PID). The motor is the stepper's equivalent brushed-DC plant of its part file
# (kv_equivalent, winding resistance, current limit sqrt(2) x rated = holding torque as the torque ceiling); the stepper's speed-torque roll-off and step loss are not modelled by the kernel.
[device_maps.stepper_servo]
"motor.kv" = "motor:kv_equivalent"
"motor.r20" = "motor:phase_resistance"
"motor.rotor_inertia" = "motor:rotor_inertia"
i_limit = "motor:current_limit_equivalent"

[device_maps.foam_launcher]
muzzle_velocity = "muzzle_velocity"
v_std = "muzzle_velocity_std"
spread_std = "spread_std"
pellet_mass = "pellet:mass"
diameter = "pellet:caliber"
cd = "pellet:cd"

[device_maps.brio_cam]
fov_v = "fov_vertical"

# ================================================================ devices (names become /devices/turret_pan, _tilt, _gun, _cam) ======================================================
[[devices]]
type = "psu"
name = "psu"
instance = "psu"
port = "power_out"
map = "psu"

[[devices]]
type = "servo"
name = "pan"
instance = "tmc_pan"
port = "vmot"
motor = "nema_pan"
joint = "pan_joint"
map = "stepper_servo"
set = { "motor.c_th" = { value = 126.0, unit = "J/K", fidelity = "estimated", rationale = "No published winding thermal capacity: 0.28 kg motor x about 450 J/(kg K) (steel / copper average)." }, "motor.r_th" = { value = 9.2, unit = "K/W", fidelity = "derived", derivation = "Datasheet temperature rise 80 K at rated current (17hs4401s temp_rise_max) over the rated dissipation 2 phases x (1.7 A)^2 x 1.5 ohm = 8.67 W: 80 / 8.67 = 9.2 K/W." }, gear_ratio = { value = 5.0, unit = "1", fidelity = "derived", derivation = "100T pan pulley (cad/cuas-lite) over the 20T motor pulley = 5.0 (closed GT2 loop, no slip)." }, efficiency = { value = 0.95, unit = "1", fidelity = "estimated", rationale = "A GT2 belt stage is 0.93-0.98 efficient; 0.95 taken." }, encoder_cpr = { value = 16000, unit = "counts/rev", fidelity = "derived", derivation = "200 full steps x 16 microsteps x gear 5 = 16000 steps per output revolution (the twin counts microsteps as the position unit)." }, firmware_hz = { value = 1000, unit = "Hz", fidelity = "estimated", rationale = "The RP2040 planner / step generator runs at 1 kHz (firmware spec); the kernel firmware step is matched to it." }, pid_scale = { value = 889000, unit = "1", fidelity = "estimated", rationale = "Tuning constant of the stand-in position loop: duty = p e / pid_scale with the harness p = 10000: full duty at 2 deg of error (89 counts). Tuned against the lockstep scenario, not a hardware figure." }, max_torque = { value = 1000, unit = "0.1 %", fidelity = "derived", derivation = "Full duty allowed (the current limit i_limit is the torque ceiling)." }, p = { value = 10000, unit = "count", fidelity = "estimated", rationale = "Overwritten by the harness at start (NaplPlant p_gain 10000)." }, i = { value = 0, unit = "count", fidelity = "estimated", rationale = "No integral term." }, d = { value = 0, unit = "count", fidelity = "estimated", rationale = "No derivative term: the motor's back-EMF damps the loop." }, deadband = { value = 0, unit = "count", fidelity = "estimated", rationale = "No dead band." } }

[[devices]]
type = "servo"
name = "tilt"
instance = "tmc_tilt"
port = "vmot"
motor = "nema_tilt"
joint = "tilt_joint"
map = "stepper_servo"
set = { "motor.c_th" = { value = 126.0, unit = "J/K", fidelity = "estimated", rationale = "As the pan motor." }, "motor.r_th" = { value = 9.2, unit = "K/W", fidelity = "derived", derivation = "As the pan motor (80 K / 8.67 W)." }, gear_ratio = { value = 4.0, unit = "1", fidelity = "derived", derivation = "80T tilt pulley (cad/cuas-lite) over the 20T motor pulley = 4.0." }, efficiency = { value = 0.95, unit = "1", fidelity = "estimated", rationale = "As the pan stage." }, encoder_cpr = { value = 12800, unit = "counts/rev", fidelity = "derived", derivation = "200 full steps x 16 microsteps x gear 4 = 12800 steps per output revolution." }, firmware_hz = { value = 1000, unit = "Hz", fidelity = "estimated", rationale = "As the pan axis." }, pid_scale = { value = 711000, unit = "1", fidelity = "estimated", rationale = "As the pan axis: full duty at 2 deg of error (71 counts) with p = 10000. Tuned, not a hardware figure." }, max_torque = { value = 1000, unit = "0.1 %", fidelity = "derived", derivation = "Full duty allowed." }, p = { value = 10000, unit = "count", fidelity = "estimated", rationale = "Overwritten by the harness at start." }, i = { value = 0, unit = "count", fidelity = "estimated", rationale = "No integral term." }, d = { value = 0, unit = "count", fidelity = "estimated", rationale = "No derivative term." }, deadband = { value = 0, unit = "count", fidelity = "estimated", rationale = "No dead band." } }

# Launcher: the muzzle site = the launcher marker's `muzzle` port (site +z = barrel axis). Constants from the launcher part (spec 5.3 estimates); ball data from the Nerf round part.
[[devices]]
type = "launcher"
name = "gun"
instance = "launcher"
site = "launcher"
site_port = "muzzle"
pellet = "ball"
map = "foam_launcher"

# Camera: site = the Brio's `lens` port (site +z = optical axis, site +x = image up). The lockstep harness delivers frames itself; the device only carries the pose / field of view.
[[devices]]
type = "camera"
name = "cam"
instance = "brio"
site = "brio"
site_port = "lens"
map = "brio_cam"
set = { width = { value = 1280, unit = "px", fidelity = "estimated", rationale = "Program frame size of the detector pipeline (16:9)." }, height = { value = 720, unit = "px", fidelity = "estimated", rationale = "As width." }, rate_hz = { value = 60, unit = "Hz", fidelity = "estimated", rationale = "The lockstep camera samples at 60 fps (python/napl/lite/sim_io.py SimCamera)." } }
