# cuas-lite: the whole pan-tilt foam-ball turret as a design: 3D-printed frame from cad/cuas-lite (meshes of the CAD build, per-part mass from the STL), bought parts from the library, full pin-level wiring.
#
# FRAMES (cad/cuas-lite manifest.json `interface`, mm in the CAD, m here). B = origin at the centre of the stator-plate top face on the pan axis, x forward at pan 0, y left, z up: the ROOT (the stator plate) IS
# frame B, every static part is placed in it. The pan group (rotor plate, yokes, tilt motor, hopper, feed elbow, lazy susan ...) is mated to the stator through `pan_joint` (axis +z, +-170 deg). H = the tilt axis,
# origin (0, 0, 202 mm) in B, x along the barrel, y left, z up at tilt 0. The tilt group (launcher chassis, barrel, trunnion beam, flywheels, pusher, camera, ...) is mated to yoke_left through `tilt_joint`
# (axis -y_H: positive tilt raises the muzzle, -15 .. +70 deg). Every printed mesh is already in its group frame, so a seat port's pose IS the child's part frame in the group root (single mate per part:
# to move a part, change the one `[[mates]]` line, or the seat port in the group root's part file).
#
# Pan group = parts in frame B above the stator; HOPPER, HOPPER LID and FEED ELBOW are in it (CAD 987985b: the hopper no longer tilts, balls enter the head through the hollow right trunnion).
# ELECTRICAL (spec 6.x, firmware pins.h): XT60 inlet -> 10 A fuse -> 12 V bus (Jetson barrel, two TMC2209 VM, key, relay contact). WEAPON RAIL: key (COM-NO) -> E-stop NC -> 12 V relay coil (30 mA): the
# key (1 A rated) and E-stop carry only the coil current; the relay's NO contact feeds the LM2596 (5 V) which feeds both flywheel motors (MOSFET low side, flyback diode) and the pusher servo. Open key, pressed
# E-stop or a broken wire de-energises the coil and cuts the weapon rail whatever the Pico does. The Pico (USB from the Jetson, 5 V from the header) reads the key / E-stop nodes through 33k/10k dividers.
# CABLE LOOP: the flex loop that carries the pan-group leads (tilt motor, tilt hall, Brio USB, flywheel / servo leads) through the turntable opening is sized for +-178 deg pan, not the +-170 deg software range:
# the pan hard stop (printed rotor tab + one M3 stud in the stator, CAD 8fa7ecc) engages at +-177.9 deg and the homing search can drive to it. The joint range here (+-170 deg) is the software limit.
# NOT WIRED (no library part yet, no kernel effect): status LEDs and buzzer (GP15-17), TMC DIAG (GP22: the BTT module's header has no DIAG pin), tach (GP13, unused by the firmware), the Jetson's
# own USB-A / network / DisplayPort, the belts (closed GT2 loops) and the cable clips / camera shims of the CAD.

[assembly]
name = "cuas-lite"
description = "cuas-lite pan-tilt foam-ball turret: printed frame (CAD meshes), NEMA 17 belt-driven pan / tilt, flywheel launcher, Brio camera, Jetson Orin Nano + RP2040 + 2 x TMC2209, relay weapon rail"
base = "fixed"
timestep = 0.001

