# ---- resistors (13): values set per instance. Placed in a row on the tray floor (they have no collision geometry). ------------------------------------------------------------------------
[[instances]]
id = "r_en_pan"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.024, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "Pull-up of the pan driver's active-low EN pin to 3V3: the BTT TMC2209 V1.3 part file documents no EN pull-up, and with the GPIO floating at reset the driver would otherwise be enabled. 10 kohm is the usual value (about 0.3 mA through the Pico pin when it drives low)." } }

[[instances]]
id = "r_en_tilt"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.029, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "As r_en_pan, for the tilt driver." } }

[[instances]]
id = "r_ms_pan"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.034, -0.010, -0.079]
params = { resistance = { value = 1000.0, unit = "ohm", fidelity = "estimated", rationale = "Strap of MS1 and MS2 (both pins) to VIO: 16 microsteps and UART address 3. The module's own pull-downs on these pins are not documented in the part file; 1 kohm wins against any plausible 10-100 kohm pull-down (divider ratio above 0.9 of VIO)." } }

[[instances]]
id = "r_ms_tilt"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.039, -0.010, -0.079]
params = { resistance = { value = 1000.0, unit = "ohm", fidelity = "estimated", rationale = "As r_ms_pan, for the tilt driver (the same strap gives it the same address 3: each driver has its own UART)." } }

[[instances]]
id = "r_su_pan"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.044, -0.010, -0.079]
params = { resistance = { value = 1000.0, unit = "ohm", fidelity = "estimated", rationale = "Series resistor between the Pico's UART TX and the driver's single-wire PDN_UART pin (the Pico RX joins the driver side): the standard 1 kohm single-wire UART interface of the TMC2209 data sheet." } }

[[instances]]
id = "r_su_tilt"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.049, -0.010, -0.079]
params = { resistance = { value = 1000.0, unit = "ohm", fidelity = "estimated", rationale = "As r_su_pan, for the tilt driver." } }

[[instances]]
id = "r_hp"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.054, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "Pull-up of the A3144's open-collector output to the Pico's 3V3 (the sensor is powered from 5 V, so its output swings 0 .. 3.3 V into the GPIO, which is not 5 V tolerant)." } }

[[instances]]
id = "r_ht"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.059, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "As r_hp, for the tilt hall sensor." } }

[[instances]]
id = "r_kt"
part = "generic-resistor-axial-quarter-w-rail"
group = "electronics"
pos = [0.064, -0.010, -0.079]
params = { resistance = { value = 33000.0, unit = "ohm", fidelity = "derived", derivation = "Top resistor of the key-sense divider 33 k / 10 k: 12 V x 10 / 43 = 2.79 V at the GPIO (RP2040 VIH min 0.7 x 3.3 V = 2.31 V; at a 13 V bus 3.02 V, below 3.3 V + 0.3 V). 12 V and the thresholds are the source's; the divider ratio is the choice." } }

[[instances]]
id = "r_kb"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.069, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "Bottom resistor of the key-sense divider (see r_kt); it also holds the input low when the key is off." } }

[[instances]]
id = "r_et"
part = "generic-resistor-axial-quarter-w-rail"
group = "electronics"
pos = [0.074, -0.010, -0.079]
params = { resistance = { value = 33000.0, unit = "ohm", fidelity = "derived", derivation = "As r_kt: 33 k / 10 k divider of the relay-coil node (12 V when key on and E-stop closed) to 2.79 V." } }

[[instances]]
id = "r_eb"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.079, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "Bottom resistor of the E-stop-sense divider (see r_et)." } }

[[instances]]
id = "r_gate"
part = "generic-resistor-axial-quarter-w"
group = "electronics"
pos = [0.084, -0.010, -0.079]
params = { resistance = { value = 10000.0, unit = "ohm", fidelity = "estimated", rationale = "Gate pull-down of both flywheel MOSFETs: the gates stay low while the Pico pin floats (reset, firmware not running)." } }

