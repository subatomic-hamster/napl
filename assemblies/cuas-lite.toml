# together, so their contact / insert-and-lip overlap is not an INTERFERENCE.
[[mates]]
name = "cam_mount--barrel_a"
a = "barrel_a.frame_up"
b = "cam_mount.origin"
closure = true

[[mates]]
name = "cam_mount--barrel_b"
a = "barrel_b.frame_up"
b = "cam_mount.origin"
closure = true

[[mates]]
name = "feed_elbow--yoke_r"
a = "yoke_r.frame_up"
b = "feed_elbow.origin"
closure = true

[[mates]]
name = "hopper_lid--hopper"
a = "hopper.frame_up"
b = "hopper_lid.origin"
closure = true

[[mates]]
name = "pan_hall_mount--stator"
a = "stator.seat_pan_hall_mount"
b = "pan_hall_mount.origin"

[[mates]]
name = "tilt_motor_mount--yoke_l"
a = "yoke_l.frame_up"
b = "tilt_motor_mount.origin"
closure = true

