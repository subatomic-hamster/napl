length = { value = 0.08, unit = "m", fidelity = "estimated", rationale = "Estimated: Pico GP0 (UART0 TX, pin 1) to the series resistor." }

[[wires]]
name = "tilt_uart_line"
from = "r_su_tilt.ser_b"
to = "tmc_tilt.uart"
from_pins = ["SS.2"]
to_pins = ["CTL.4"]
part = "awg-26-silicone-wire"
length = { value = 0.06, unit = "m", fidelity = "estimated", rationale = "Estimated: series resistor to the driver's PDN_UART pad." }

[[wires]]
