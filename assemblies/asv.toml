# ---- devices ---------------------------------------------------------------------------------------------------------------------------
[[devices]]
type = "sea"
name = "sea"
instance = "hull"
set = { rho = { value = 998.2, unit = "kg/m^3", fidelity = "estimated", rationale = "Fresh water at 20 degC (the design-draft derivation of the hull part uses the same value); set 1025 for sea water." }, level = { value = 0.0, unit = "m", fidelity = "estimated", rationale = "Still-water surface at world z = 0; the scene lowers the seabed." }, depth = { value = 0.0, unit = "m", fidelity = "estimated", rationale = "0 = deep water for the wave dispersion relation." } }

[[devices]]
type = "vessel"
name = "vessel"
instance = "hull"
body = "hull"
map = "hull_hydro"

[[devices]]
type = "battery"
name = "battery1"
instance = "bat1"
port = "power_out"
ocv = "lipo-cell-ocv-chen2006"
map = "pack"

[[devices]]
type = "battery"
name = "battery2"
instance = "bat2"
port = "power_out"
ocv = "lipo-cell-ocv-chen2006"
map = "pack"

[[devices]]
type = "esc"
name = "esc1"
instance = "esc1"
port = "power_in"
motor = "thr1"
joint = "spin1"
map = "basic_esc_t200"
bidirectional = true

[[devices]]
type = "esc"
name = "esc2"
instance = "esc2"
port = "power_in"
motor = "thr2"
joint = "spin2"
map = "basic_esc_t200"
bidirectional = true

[[devices]]
type = "rotor"
name = "rotor1"
instance = "prop1"
body = "prop1"
joint = "spin1"
map = "t200_prop"
dir = -1
water = true

[[devices]]
type = "rotor"
name = "rotor2"
instance = "prop2"
body = "prop2"
joint = "spin2"
map = "t200_prop"
dir = -1
water = true

[[devices]]
type = "load"
name = "load_avionics"
instance = "reg"
port = "vin"
set = { i0 = { value = -1.41, unit = "A", fidelity = "derived", derivation = "Pi 5 under full CPU load 9.8 W (raspberry-pi-5 power_stress_ng_8gb, measured) + RPLIDAR S2 2.0 W (S2 'Power consumption > 2W') + Pixhawk 6C, M8N GNSS and SiK radio 1.5 W (ESTIMATED, order of magnitude of their typical supply currents) = 13.3 W on the 5 V rail, over the regulator efficiency 0.85 (pololu-d24v50f5 efficiency_min) x 11.1 V nominal pack = 1.41 A out of pack 1 (a constant-current sink: the pack voltage sags and recovers by a few percent over the discharge, which a constant-power load would follow)." } }

[[devices]]
type = "imu"
name = "imu"
instance = "icm"
site = "fc"
map = "icm42688"
set = { rate_hz = { value = 250.0, unit = "Hz", fidelity = "estimated", rationale = "Simulation tick is 2 ms, so 500 Hz is the fastest representable rate; 250 Hz = every 2nd tick, inside the ICM-42688-P output-data-rate range (12.5-32000 Hz datasheet). The rate at which the flight firmware consumes samples is not modelled here." } }

[[devices]]
type = "mag"
name = "mag"
instance = "mag_chip"
site = "gps"
map = "ist8310"
set = { rate_hz = { value = 50.0, unit = "Hz", fidelity = "estimated", rationale = "IST8310 output data rate is 1-200 Hz (datasheet); 50 Hz (every 10th tick of the 2 ms step) is a mid value." }, earth_field = { value = [1.294e-6, 2.1756e-5, -4.3027e-5], unit = "T", fidelity = "derived", derivation = "The field PX4 itself assumes at 47.3769 N, 8.5417 E (World Magnetic Model 2020 via PX4's geo_mag_declination tables): declination 3.4038 deg, inclination 63.1360 deg, F = 48231.8 nT; H = F cos(inc) = 21.795 uT, B_E = H sin(dec) = 1.294e-6 T, B_N = H cos(dec) = 2.1756e-5 T, B_U = -F sin(inc) = -4.3027e-5 T; derived in assemblies/x500v2.toml (same site, same numbers). The harbour scene sits at that origin." } }

[[devices]]
type = "gnss"
name = "gnss"
instance = "gnss_chip"
site = "gps"
map = "m8n"
set = { latency_s = { value = 0.2, unit = "s", fidelity = "estimated", rationale = "No part publishes the receiver's output latency. PX4's EKF2_GPS_DELAY default is 110 ms (v1.17.0), px4/params/napl_sitl.params sets 200 ms to match this device; the device lags by round(latency_s x rate_hz) samples, and at the datasheet 5 Hz one sample is 0.2 s, the smallest non-zero lag." }, lat0 = { value = 47.3769, unit = "deg", fidelity = "estimated", rationale = "Arbitrary simulation origin, the same site as the repo's test model tests/data/devices/all.xml (Zurich); not a claim about where the vessel sails. The scene's local East-North-Up frame has its origin here." }, lon0 = { value = 8.5417, unit = "deg", fidelity = "estimated", rationale = "As lat0." }, alt0 = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "As lat0 (all.xml uses 408 m): the altitude of the origin above the ellipsoid, unused by the ASV (which is at the water surface)." }, horiz_std = { value = 2.1233, unit = "m", fidelity = "derived", derivation = "u-blox NEO-M8N horizontal position accuracy 2.5 m CEP (ublox_neo_m8n horizontal_accuracy_cep_gps, datasheet, 50 % radius) converted to a per-coordinate sigma of a circular normal distribution: sigma = CEP / 1.17741 = 2.1233 m." }, vert_std = { value = 3.185, unit = "m", fidelity = "derived", derivation = "1.5 x horiz_std (2.1233 m) = 3.185 m: the ratio 3.75 m / 2.5 m of the part's vertical_accuracy_cep (itself an estimate) to its horizontal CEP, applied to sigma." }, corr_time_s = { value = 600.0, unit = "s", fidelity = "estimated", rationale = "Time constant of the slowly varying part of the position error (ionosphere, orbit / clock residuals, multipath geometry). Published stand-alone GPS data (Banachowicz, GPS / DGPS position coordinates) finds the errors 'significantly correlated' with a mean correlation time 'within the range of a couple or more minutes'; 600 s sits inside that range; no receiver-specific value is published (docs/research/px4-sitl.md, N5c section)." }, corr_frac = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "Share of the position VARIANCE that is the Gauss-Markov part (the rest is white per-fix scatter); total sigma stays the datasheet-derived horiz_std / vert_std. 0.9 gives a white scatter of 0.67 m horizontal and a Gauss-Markov sigma of 2.01 m. No source splits the M8N error budget; chosen so that the fast scatter is of the order of a metre, as seen on static consumer-GNSS tracks, while the 2.5 m CEP is reached over the long run. Estimate." } }

# Obstacle lidar. The beam plane is 360 degrees about the optical port's z (the 0 degree azimuth = the boat's bow, positive to port); n_v = 1.
# ray_groups 59: every geom group but 2 (the drawn water plane) is visible to the beam, including group 4 (the design builder's vehicle geoms).
[[devices]]
type = "rangefinder"
name = "lidar"
instance = "lidar"
site = "lidar"
site_port = "optical"
map = "s2"
projection = "spherical"
set = { ray_groups = { value = 59, unit = "bitmask", fidelity = "estimated", rationale = "Geom groups 0, 1, 3, 4, 5 are visible to the beam, including group 4 (the design builder's vehicle geoms: other vessels are made of them); group 2 holds the scene's drawn water plane, which must not be hit by a tilted beam (the real water surface is not a solid for a lidar at this angle; sea clutter is not modelled); the lidar's own body is excluded by the device. The default mask (47) would hide every vessel." }, n_h = { value = 1600, unit = "px", fidelity = "estimated", rationale = "Every 2nd of the 3200 samples of a revolution (32 kSa/s at 10 Hz, S2): 0.225 degree steps, 0.12 m between neighbouring returns at 30 m, to keep the CPU ray cast cheap (the real unit resolves 0.1125 degrees)." }, n_v = { value = 1, unit = "px", fidelity = "estimated", rationale = "The S2 is a single-plane (2-D) scanner: one row of returns per revolution. The specification page lists a 'scan field flatness' of +-1.5 degrees, not a vertical field of view." }, fov_v = { value = 0.01, unit = "rad", fidelity = "estimated", rationale = "The device needs a non-zero vertical field; with one row only the centre ray (elevation 0) is cast, so the value is unused." }, rate_hz = { value = 10, unit = "Hz", fidelity = "datasheet", src = "https://www.slamtec.com/en/s2/spec", quote = "Scan rate 10Hz" } }
