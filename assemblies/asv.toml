# ---- wires -----------------------------------------------------------------------------------------------------------------------------
# included_in: every lead is already inside the datasheet mass of the part it ships on (battery 406 g incl. its 100 mm lead; thruster 427 g incl. 1 m cable).
[[wires]]
name = "bat1-to-esc1"
from = "bat1.power_out"
to = "esc1.power_in"
part = "awg-14-silicone-wire"
length = "bat1.discharge_wire_length"
conductors = 2
included_in = "bat1"

[[wires]]
name = "bat2-to-esc2"
from = "bat2.power_out"
to = "esc2.power_in"
part = "awg-14-silicone-wire"
length = "bat2.discharge_wire_length"
conductors = 2
included_in = "bat2"

[[wires]]
name = "esc1-to-thr1"
from = "esc1.motor_out"
to = "thr1.phase"
part = "awg-14-silicone-wire"
length = "thr1.cable_length"
conductors = 3
included_in = "thr1"

[[wires]]
name = "esc2-to-thr2"
from = "esc2.motor_out"
to = "thr2.phase"
part = "awg-14-silicone-wire"
length = "thr2.cable_length"
conductors = 3
included_in = "thr2"

[[wires]]
name = "bat1-to-reg"
from = "bat1.power_out"
to = "reg.vin"
part = "awg-18-silicone-wire"
length = { value = 0.3, unit = "m", fidelity = "estimated", rationale = "The regulator sits on the port deck 0.2 m aft of the pack; its input is soldered to a tap on the pack lead: 0.3 m with slack." }
conductors = 2

[[wires]]
name = "reg-to-pi"
from = "reg.vout"
to = "pi.power_in"
part = "awg-18-silicone-wire"
length = { value = 0.9, unit = "m", fidelity = "estimated", rationale = "Regulator on the port aft deck, Pi 5 on the starboard forward deck: 0.5 m along the hull plus 0.76 m across the cross-member, routed 0.9 m." }
conductors = 2

[[wires]]
name = "reg-to-fc"
from = "reg.vout"
to = "fc.power1"
part = "awg-18-silicone-wire"
length = { value = 0.6, unit = "m", fidelity = "estimated", rationale = "Regulator and Pixhawk are on the port hull, 0.5 m apart along the deck: 0.6 m." }
conductors = 2

[[wires]]
name = "reg-to-lidar"
from = "reg.vout"
to = "lidar.power_in"
part = "awg-18-silicone-wire"
length = { value = 1.0, unit = "m", fidelity = "estimated", rationale = "Regulator on the port deck (0.20 m high), lidar on the 0.45 m mast above the centreline: 0.45 m up and 0.5 m across and forward, 1.0 m with slack." }
conductors = 2

[[wires]]
name = "fc-pwm1"
from = "fc.pwm1"
to = "esc1.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc1"

[[wires]]
name = "fc-pwm2"
from = "fc.pwm2"
to = "esc2.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc2"

[[wires]]
name = "gps-to-fc"
from = "gps.gps_out"
to = "fc.gps1"
part = "awg-18-silicone-wire"
length = "gps.cable_length"
included_in = "gps"

[[wires]]
name = "sik-to-fc"
from = "sik.telem"
to = "fc.telem1"
part = "awg-18-silicone-wire"
length = "sik.telem_cable_length"
included_in = "sik"

[[wires]]
name = "pi-to-fc"
from = "pi.gpio_uart"
to = "fc.telem2"
part = "awg-18-silicone-wire"
length = { value = 0.9, unit = "m", fidelity = "estimated", rationale = "Pi 5 GPIO UART (TX / RX / GND) to the Pixhawk 6C TELEM2 (MAVLink companion link): the Pi is on the starboard and the Pixhawk on the port forward deck, 0.76 m apart across the cross-member: 0.9 m with slack." }

[[wires]]
name = "lidar-to-pi"
from = "lidar.uart"
to = "pi.usb"
part = "awg-18-silicone-wire"
length = { value = 0.9, unit = "m", fidelity = "estimated", rationale = "The lidar's 1 Mbaud UART goes through its USB-serial adapter board to a Pi USB port: 0.45 m down the mast, 0.45 m across to the starboard deck, 0.9 m." }

