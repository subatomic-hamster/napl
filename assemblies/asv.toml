# ASV: a BlueBoat-class autonomous surface vessel from open / catalogue hardware. The 1.2 m twin-hull catamaran of assemblies/boat-cat.toml with
#   - two Blue Robotics T200 thrusters on BIDIRECTIONAL Blue Robotics Basic ESCs (differential thrust steers; reverse is available),
#   - a fixed skeg under each hull (the directional-stability fix, parts/marine/generic-catamaran-hull-1200-skeg.toml),
#   - a Pixhawk 6C autopilot, a Raspberry Pi 5 companion computer, a u-blox M8N GNSS + compass puck on a 0.3 m mast, a SiK telemetry radio,
#   - a Slamtec RPLIDAR S2 (IP65, 30 m, 360 degrees) on a 0.45 m mast as the obstacle sensor,
#   - one 3S 5300 mAh pack per hull; the 5 V regulator for the avionics hangs on pack 1.
# Prices and the parts list: examples/asv/README.md. The autopilot / planner code is examples/asv/ (it reads the sensor devices below, never the true state).
#
# FRAME. The hull's part frame is the vehicle's body frame: origin mid-length on the centreline at the keel level, x forward, y to port, z up.
# Still water is at the sea device's `level` (world z); the scene (examples/asv/scene.py) puts the boat in the water and composes the harbour.
# THRUSTERS. Each T200 points AFT (pusher, shaft +z = world -x) so the rotor binding uses dir = -1: positive ESC drive pushes the boat forward.

[assembly]
name = "asv"
description = "BlueBoat-class ASV: 1.2 m catamaran with skegs, 2 x T200 on Basic ESCs, Pixhawk 6C + Pi 5, M8N GNSS, RPLIDAR S2, SiK radio, 2 x 3S 5300 mAh"
base = "free"
timestep = 0.002
seed = 11

[[instances]]
id = "hull"
part = "generic-catamaran-hull-1200-skeg"
root = true
group = "hull"

[[instances]]
id = "thr1"
part = "bluerobotics-t200-thruster"
group = "propulsion"

[[instances]]
id = "thr2"
part = "bluerobotics-t200-thruster"
group = "propulsion"

[[instances]]
id = "prop1"
part = "bluerobotics-t200-propeller"
group = "propulsion"

[[instances]]
id = "prop2"
part = "bluerobotics-t200-propeller"
group = "propulsion"

[[instances]]
id = "esc1"
part = "bluerobotics-basic-esc"
group = "power"

[[instances]]
id = "esc2"
part = "bluerobotics-basic-esc"
group = "power"

[[instances]]
id = "bat1"
part = "gensace-5300mah-3s-60c-ec5"
group = "power"
pos = [0.0, 0.38, 0.21925]
rpy = [0.0, 0.0, 0.0]

[[instances]]
id = "bat2"
part = "gensace-5300mah-3s-60c-ec5"
group = "power"
pos = [0.0, -0.38, 0.21925]
rpy = [0.0, 0.0, 0.0]

[[instances]]
id = "reg"
part = "pololu-d24v50f5"
group = "power"
pos = [-0.20, 0.38, 0.20]
rpy = [0.0, 0.0, 0.0]
params = { mass = { value = 0.003, unit = "kg", fidelity = "datasheet", src = "https://www.pololu.com/product/2851/specs", quote = "Size: 0.7\" x 0.8\" x 0.35\" Weight: 3.0 g" } }

[[instances]]
id = "fc"
part = "holybro-pixhawk-6c"
group = "avionics"
params = { pwm_lead_length = { value = 0.5, unit = "m", fidelity = "estimated", rationale = "Length of each ESC signal lead from the Pixhawk FMU PWM Out to the ESC signal plug is not published. The flight controller sits on the forward deck of the port hull, the ESCs on the aft decks 0.7 m away, and the lead is routed along the hull: 0.5 m is a short run. Signal wires carry no current in the model: only the BOM / mass bookkeeping (and that is included in the ESC datasheet mass)." } }

[[instances]]
id = "pi"
part = "raspberry-pi-5"
group = "compute"
pos = [0.30, -0.38, 0.20]
rpy = [0.0, 0.0, 0.0]
params = { mass = { value = 0.046, unit = "kg", fidelity = "estimated", rationale = "The Raspberry Pi 5 product brief publishes no mass; a bare Pi 5 board weighs about 45-50 g (retailer listings of 50-62 g include packaging), 46 g taken as in assemblies/turret.toml and assemblies/skydio.toml." } }

[[instances]]
id = "sik"
part = "holybro-sik-telemetry-radio-v3"
group = "avionics"
params = { telem_cable_length = { value = 0.8, unit = "m", fidelity = "estimated", rationale = "Length of the SiK-to-TELEM1 JST-GH cable is not published (the radio part file folds the cable into its port). The radio sits on the starboard aft deck, the Pixhawk on the port forward deck: about 0.7 m across and along the hulls, so 0.8 m with slack." } }

[[instances]]
