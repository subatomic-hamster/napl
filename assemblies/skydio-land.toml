map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 0.962, unit = "K/W", fidelity = "derived", derivation = "napl bench thrust holybro-2216-kv920 (docs/validation/thrust-stands.md, thermal section; tests/python/test_bench.py asserts this number equals the bench calibration): r_th = (80 degC vendor surface temperature at 100 % throttle - 25 degC ambient) / (I_m^2 R(80 degC)) with I_m of the stand model fitted on the vendor table at the 100 % row and R(T) = R20 (1 + 0.00393 (T - 20)) = 0.962 K/W (the stand fit now carries the ESC loss model, which lowers the fitted I_m at the 100 % row; 0.927 K/W without it). Surface, not winding, temperature, so a lower bound for winding-to-ambient; at hover the pack current is ~2.9 A per motor but the winding carries ~6.2-6.8 A (pack current / duty 0.43, the device model's i_m), so r_th puts the winding ~4 K above ambient (4.4 W copper loss; DRC THERMAL); a surface-temperature lower bound, so the real rise is somewhat higher." } }

