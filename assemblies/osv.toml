[[devices]]
type = "gnss"
name = "gnss"
instance = "gnss_chip"
site = "gps"
map = "m8n"
set = { latency_s = { value = 0.2, unit = "s", fidelity = "estimated", rationale = "No part publishes the receiver's output latency. PX4's EKF2_GPS_DELAY default is 110 ms (v1.17.0), px4/params/napl_sitl.params sets 200 ms to match this device; the device lags by round(latency_s x rate_hz) samples, and at the datasheet 5 Hz one sample is 0.2 s, the smallest non-zero lag." }, lat0 = { value = 47.3769, unit = "deg", fidelity = "estimated", rationale = "Arbitrary simulation origin, the same site as the repo's test model tests/data/devices/all.xml (Zurich); not a claim about where the vessel sails. The scene's local East-North-Up frame has its origin here." }, lon0 = { value = 8.5417, unit = "deg", fidelity = "estimated", rationale = "As lat0." }, alt0 = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "As lat0 (all.xml uses 408 m): the altitude of the origin above the ellipsoid, unused by the ASV (which is at the water surface)." }, horiz_std = { value = 2.1233, unit = "m", fidelity = "derived", derivation = "u-blox NEO-M8N horizontal position accuracy 2.5 m CEP (ublox_neo_m8n horizontal_accuracy_cep_gps, datasheet, 50 % radius) converted to a per-coordinate sigma of a circular normal distribution: sigma = CEP / 1.17741 = 2.1233 m." }, vert_std = { value = 3.185, unit = "m", fidelity = "derived", derivation = "1.5 x horiz_std (2.1233 m) = 3.185 m: the ratio 3.75 m / 2.5 m of the part's vertical_accuracy_cep (itself an estimate) to its horizontal CEP, applied to sigma." }, corr_time_s = { value = 600.0, unit = "s", fidelity = "estimated", rationale = "Time constant of the slowly varying part of the position error (ionosphere, orbit / clock residuals, multipath geometry). Published stand-alone GPS data (Banachowicz, GPS / DGPS position coordinates) finds the errors 'significantly correlated' with a mean correlation time 'within the range of a couple or more minutes'; 600 s sits inside that range; no receiver-specific value is published (docs/research/px4-sitl.md, N5c section)." }, corr_frac = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "Share of the position VARIANCE that is the Gauss-Markov part (the rest is white per-fix scatter); total sigma stays the datasheet-derived horiz_std / vert_std. 0.9 gives a white scatter of 0.67 m horizontal and a Gauss-Markov sigma of 2.01 m. No source splits the M8N error budget; chosen so that the fast scatter is of the order of a metre, as seen on static consumer-GNSS tracks, while the 2.5 m CEP is reached over the long run. Estimate." } }

