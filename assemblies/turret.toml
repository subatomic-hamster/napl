# Counter-UAS pan-tilt turret (demo): a generic .177 pneumatic pellet launcher (parts/cuas/generic-pcp-pellet-launcher-177, point-mass ballistics, an
# illustrative placeholder, NOT a real weapon system) on a two-axis mount built from library parts: 2 x Dynamixel XL430-W250-T (pan, tilt; 12 V,
# 1.5 N*m stall), a custom-machined aluminium base plate and yoke, a Raspberry Pi Camera Module 3 co-aligned with the barrel and a Raspberry Pi 5
# compute board. The turret proposes, an operator authorizes: that gate lives in the program (examples/cuas/turret.py), not in the model.
#
# FRAME. World = base plate top-face centre, z up. Pan axis = world z, positive = counter-clockwise seen from above (azimuth from +x towards
# +y). Tilt axis = world y at the zero pose (tilt servo output +y, reverse = true): positive tilt raises the muzzle. At the zero pose the barrel
# points along +x, level; the camera looks along +x, 4 cm above the barrel axis. Joint ranges are the mount's design limits (estimated).
# ELECTRICAL. 12 V 5 A supply -> Waveshare servo adapter -> pan -> tilt (daisy chain), as the Koch arm (assemblies/koch.toml). The Pi 5 and its
# 5 V supply are not wired (the Pi's 5 V supply is not in the library as a USB-C PD part); the camera is read through the Pi in the demo.
# Both servos are the ONLY actuators; the launcher's `fire` input is a device attribute the program sets (logged, replayed).

[assembly]
name = "turret"
description = "Counter-UAS demo turret: pan-tilt (2 x XL430-W250-T) with a generic .177 pellet launcher, Pi Camera Module 3 and Raspberry Pi 5"
base = "fixed"
timestep = 0.001

[[instances]]
id = "base"
part = "cuas-turret-base-plate"
root = true
group = "mount"

[[instances]]
id = "yoke"
part = "cuas-turret-yoke"
group = "mount"

[[instances]]
id = "pan"
part = "robotis-xl430-w250-t"
group = "mount"
params = { servo_id = { value = 1, unit = "1", fidelity = "estimated", rationale = "Bus ID chosen by the builder: pan 1, tilt 2." } }

[[instances]]
id = "tilt"
part = "robotis-xl430-w250-t"
group = "mount"
params = { servo_id = { value = 2, unit = "1", fidelity = "estimated", rationale = "Bus ID chosen by the builder: pan 1, tilt 2." } }

[[instances]]
id = "launcher"
part = "generic-pcp-pellet-launcher-177"
group = "effector"

[[instances]]
id = "camera"
part = "raspberry-pi-camera-module-3"
group = "sensing"

[[instances]]
id = "pi"
part = "raspberry-pi-5"
group = "sensing"
params = { mass = { value = 0.046, unit = "kg", fidelity = "estimated", rationale = "The Raspberry Pi 5 product brief publishes no mass; a bare Pi 5 board weighs about 45-50 g, 46 g taken. Only its inertia on the base plate depends on it." } }

# The Pi rests on four M2.5 brass standoffs (14 mm body: the plate's compute_seat plane is 14 mm above its top face). They stand at the board's
# four holes (58 x 49 mm pattern, turned so the 85 mm side runs along y), welded to the plate; the stud end passes through the board.
[[instances]]
id = "pi_so1"
part = "ettinger-05-12-143-m2.5-standoff"
group = "sensing"
pos = [-0.0375, 0.029, 0.0]

[[instances]]
id = "pi_so2"
part = "ettinger-05-12-143-m2.5-standoff"
group = "sensing"
pos = [-0.0375, -0.029, 0.0]

[[instances]]
id = "pi_so3"
part = "ettinger-05-12-143-m2.5-standoff"
group = "sensing"
pos = [-0.0865, 0.029, 0.0]

[[instances]]
id = "pi_so4"
part = "ettinger-05-12-143-m2.5-standoff"
group = "sensing"
pos = [-0.0865, -0.029, 0.0]

# The pellet is the launcher device's ammunition (mass, calibre, drag); no body.
[[instances]]
id = "pellet"
part = "hn-field-target-trophy-177"
group = "effector"
offboard = true

[[instances]]
id = "adapter"
part = "waveshare-bus-servo-adapter-a"
group = "bench"
offboard = true

[[instances]]
id = "psu"
part = "facmogu-12v-5a-psu"
group = "bench"
offboard = true

[[instances]]
id = "psu5"
part = "facmogu-5v-4a-psu"
group = "bench"
offboard = true

[[instances]]
id = "cable"
part = "robotis-robot-cable-x3p-180mm"
group = "bench"
offboard = true

[[instances]]
id = "lead"
part = "awg-22-silicone-wire"
group = "bench"
offboard = true

# ---- mechanics ----------------------------------------------------------------------------------------------------------------------------
[[mates]]
name = "base--pan"
a = "base.servo_seat"
b = "pan.base"

[[mates]]
name = "pan_joint"
a = "pan.output"
b = "yoke.horn_seat"
joint = { type = "hinge", range = { value = [-3.1, 3.1], unit = "rad", fidelity = "estimated", rationale = "Design limit just inside a full turn so the cable run is not wound up; the XL430 itself turns freely (position mode covers one revolution of the encoder)." } }

[[mates]]
name = "yoke--tilt"
a = "yoke.servo_seat"
b = "tilt.base"

[[mates]]
name = "tilt_joint"
a = "tilt.output"
b = "launcher.horn_seat"
joint = { type = "hinge", reverse = true, range = { value = [-0.35, 1.35], unit = "rad", fidelity = "estimated", rationale = "Design limits: 20 deg depression to 77 deg elevation (the launcher's action box meets the turntable below about -20 deg)." } }

[[mates]]
name = "launcher--camera"
a = "launcher.camera_seat"
b = "camera.seat"

[[mates]]
name = "base--pi"
a = "base.compute_seat"
b = "pi.base"

# ---- power wiring (as assemblies/koch.toml: supply -> adapter -> servo chain) -----------------------------------------------------------------
[[wires]]
name = "psu_cord"
from = "psu.power_out"
to = "adapter.power_in"
part = "awg-22-silicone-wire"
length = "psu.cable_length"
conductors = 2
included_in = "psu"
from_pins = ["OUT.1", "OUT.2"]   # DC+, DC-
to_pins = ["DC.1", "DC.2"]

[[wires]]
name = "lead_adapter_pan"
from = "adapter.servo_bus"
to = "pan.port_a"
from_pins = ["BUS.1", "BUS.2", "BUS.3"]   # GND, VCC, SIG
to_pins = ["J1.1", "J1.2", "J1.3"]        # GND, VDD, DATA
part = "awg-22-silicone-wire"
length = { value = 0.15, unit = "m", fidelity = "estimated", rationale = "Not published. The adapter sits beside the base plate: 0.15 m, as the SO-101 and Koch board-to-servo leads." }
conductors = 2

# Pi 5: a 5 V 4 A supply (the library has no USB-C PD source) through a bare lead, as assemblies/koch.toml bridges unlike connector families.
[[wires]]
name = "lead_psu5_pi"
from = "psu5.power_out"
to = "pi.power_in"
part = "awg-22-silicone-wire"
length = { value = 0.5, unit = "m", fidelity = "estimated", rationale = "Not published; a short lead from a bench supply beside the base plate." }
conductors = 2
from_pins = ["OUT.1", "OUT.2"]
to_pins = ["PWR.A4", "PWR.A1"]   # VBUS, GND of the Pi's USB-C power connector

# Pi 5 <-> servo adapter: 3.3 V UART0 crossed (Pi TX -> adapter RXD, Pi RX -> adapter TXD) plus ground. The lead's few grams are left out of
# the mass budget (included_in) so the turret's mass, and the cuas scenario built on it, stay exactly as before this wire existed.
[[wires]]
name = "pi_uart_adapter"
from = "pi.gpio_uart"
to = "adapter.bus"
from_pins = ["J8.8", "J8.10", "J8.6"]
to_pins = ["UART.2", "UART.1", "UART.3"]
part = "awg-26-silicone-wire"
length = { value = 0.25, unit = "m", fidelity = "estimated", rationale = "Not published. Pi header to adapter UART pads across the base plate, about 0.25 m of hook-up wire." }
conductors = 3
included_in = "pi"

# Pi 5 <-> camera: the Pi camera cable (15-pin camera end to the Pi 5's 22-pin CAM/DISP 0, the cable ships with the camera, so no mass here).
[[wires]]
name = "pi_camera_ribbon"
from = "camera.csi"
to = "pi.cam0"
from_pins = ["FPC.1", "FPC.2", "FPC.3", "FPC.4", "FPC.5", "FPC.6", "FPC.7", "FPC.8", "FPC.9", "FPC.10", "FPC.11", "FPC.12", "FPC.13", "FPC.14", "FPC.15"]
to_pins = ["CAM0.1", "CAM0.2", "CAM0.3", "CAM0.4", "CAM0.5", "CAM0.6", "CAM0.7", "CAM0.8", "CAM0.9", "CAM0.10", "CAM0.17", "CAM0.18", "CAM0.20", "CAM0.21", "CAM0.22"]
part = "awg-28-silicone-wire"
length = { value = 0.2, unit = "m", fidelity = "estimated", rationale = "Camera Module 3 ships a 200 mm ribbon (S1 of raspberry-pi-camera-module-3); the Pi 5 end adapts 15 to 22 pins." }
conductors = 15
included_in = "camera"

[[wires]]
name = "cable_pan_tilt"
from = "pan.port_b"
to = "tilt.port_a"
from_pins = ["J2.1", "J2.2", "J2.3"]
to_pins = ["J1.1", "J1.2", "J1.3"]
part = "robotis-robot-cable-x3p-180mm"
length = "cable.length_default"
conductors = 2

# ---- device maps (XL430-W250-T at 12 V, as assemblies/koch.toml) ---------------------------------------------------------------------------
[device_maps.psu]
voltage = "v_out_nominal"
r_series = "r_out"
i_limit = "current_limit"

[device_maps.xl430_w250]
"motor.kv" = "kv_equivalent"
"motor.r20" = "r_effective"
"motor.i0" = "no_load_current_12v"
"motor.i0_w" = "omega_noload_motor_12v"
"motor.i0_visc" = "i0_visc"
"motor.rotor_inertia" = "rotor_inertia_motor"
gear_ratio = "gear_ratio"
efficiency = "gear_efficiency"
encoder_cpr = "encoder_resolution"
firmware_hz = "firmware_hz"
p = "device_p_default"
i = "device_i_default"
d = "device_d_default"
pid_scale = "pid_scale"
d_scale = "d_scale"
deadband = "dead_zone_default"
max_torque = "device_max_torque_default"
min_voltage = "reg_min_voltage_limit_default"
max_voltage = "reg_max_voltage_limit_default"
max_temp = "reg_temperature_limit_default"
unload_mask = "reg_shutdown_default"

[device_maps.pellet_launcher]
muzzle_velocity = "muzzle_velocity"
v_std = "muzzle_velocity_std"
spread_std = "spread_std"
pellet_mass = "pellet:mass"
diameter = "pellet:caliber"
cd = "pellet:cd"

[device_maps.rpi_cam3]
fov_v = "fov_vertical"

# ---- devices ---------------------------------------------------------------------------------------------------------------------------------
[[devices]]
type = "psu"
name = "psu"
instance = "psu"
port = "power_out"
map = "psu"

[[devices]]
type = "psu"
name = "psu5"
instance = "psu5"
port = "power_out"
map = "psu"

[[devices]]
type = "wire"
name = "adapter_board"
instance = "adapter"
a = "power_in"
b = "servo_bus"
set = { resistance = { value = 0.02, unit = "ohm", fidelity = "estimated", rationale = "As assemblies/koch.toml: the part publishes no series resistance; 20 mohm = the DC jack contact pair plus a short trace, and a zero-resistance edge would be singular." } }

[[devices]]
type = "servo"
name = "pan"
instance = "pan"
port = "port_a"
joint = "pan_joint"
map = "xl430_w250"
set = { "motor.c_th" = { value = 10.0, unit = "J/K", fidelity = "estimated", rationale = "No published winding thermal capacity for the XL430; 10 J/K as assemblies/koch.toml (same servo)." }, "motor.r_th" = { value = 15.0, unit = "K/W", fidelity = "estimated", rationale = "As assemblies/koch.toml (same servo)." } }

[[devices]]
type = "servo"
name = "tilt"
instance = "tilt"
port = "port_a"
joint = "tilt_joint"
map = "xl430_w250"
set = { "motor.c_th" = { value = 10.0, unit = "J/K", fidelity = "estimated", rationale = "As the pan servo." }, "motor.r_th" = { value = 15.0, unit = "K/W", fidelity = "estimated", rationale = "As the pan servo." } }

# Launcher: the muzzle site = the launcher's `muzzle` port (site +z = barrel axis). Pellet data from the pellet part.
[[devices]]
type = "launcher"
name = "gun"
instance = "launcher"
site = "launcher"
site_port = "muzzle"
pellet = "pellet"
map = "pellet_launcher"

# Camera: the site = the camera's `lens` port (site +z = optical axis, site +x = image up). 1280 x 720 at 15 Hz is the program's frame
# format (the module's 16:9 field of view is used whole); the sensor itself is 4608 x 2592.
[[devices]]
type = "camera"
name = "cam"
instance = "camera"
site = "camera"
site_port = "lens"
map = "rpi_cam3"
set = { width = { value = 1280, unit = "px", fidelity = "estimated", rationale = "Program frame size: 1280 x 720 has the sensor's 16:9 aspect (4608 x 2592), so the field of view is used whole; chosen for the tracker's compute budget, not a sensor mode of record." }, height = { value = 720, unit = "px", fidelity = "estimated", rationale = "As width." }, rate_hz = { value = 15, unit = "Hz", fidelity = "estimated", rationale = "Program frame rate: the tracker's compute budget, not a sensor mode of record." } }
