# ---- mates ---------------------------------------------------------------------------------------------------------------------------
# Arm clamps: bottom plate seat -> connector (k = 0 puts each arm on its diagonal). The kit's 16 x M3x38 + flange locknut (4 per arm,
# airframe doc step 5) run through the whole 2 + 28 + 2 mm plate stack (holybro-x500v2 iso4762-m3x38 port note), so they are counted
# ONCE per arm, on this (bottom) mate; the top-plate mates below carry no fasteners. At the bottom mate alone the stack is 19.9 mm
# (plate 2 mm + lower clamp half 17.9 mm), so M3x38 is never short here (no FASTENER_SHORT).
[[mates]]
name = "clamp1"
a = "bottom.arm4"
b = "con1.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp2"
a = "bottom.arm2"
b = "con2.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp3"
a = "bottom.arm1"
b = "con3.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp4"
a = "bottom.arm3"
b = "con4.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

# Top plate: placed by one connector (con1 -> top.arm4); the other three seats are loop closures (checked to 1e-6 m / rad).
[[mates]]
name = "top-seat1"
a = "con1.plate_hi"
b = "top.arm4"
rotation = 0

[[mates]]
name = "top-seat2"
a = "con2.plate_hi"
b = "top.arm2"
rotation = 0
closure = true

[[mates]]
name = "top-seat3"
a = "con3.plate_hi"
b = "top.arm1"
rotation = 0
closure = true

[[mates]]
name = "top-seat4"
a = "con4.plate_hi"
b = "top.arm3"
rotation = 0
closure = true

# Arm tubes: body-side clamp places the tube, the arm-end clamp is a closure.
[[mates]]
name = "tube-body1"
a = "con1.tube_body"
b = "tube1.body_clamp"

[[mates]]
name = "tube-body2"
a = "con2.tube_body"
b = "tube2.body_clamp"

[[mates]]
name = "tube-body3"
a = "con3.tube_body"
b = "tube3.body_clamp"

[[mates]]
name = "tube-body4"
a = "con4.tube_body"
b = "tube4.body_clamp"

[[mates]]
name = "tube-end1"
a = "con1.tube_end"
b = "tube1.end_clamp"
closure = true

[[mates]]
name = "tube-end2"
a = "con2.tube_end"
b = "tube2.end_clamp"
closure = true

[[mates]]
name = "tube-end3"
a = "con3.tube_end"
b = "tube3.end_clamp"
closure = true

[[mates]]
name = "tube-end4"
a = "con4.tube_end"
b = "tube4.end_clamp"
closure = true

# Motors: 4 x M3x6 per motor into the motor's tapped holes through the 2 mm motor base (airframe doc: iso4762-m3x6, 16 = 4 per arm).
# Tapped depth 4 mm + base 2 mm = L_min 6 mm = the screw length (exact fit; no warning).
[[mates]]
name = "motor1"
a = "con1.motor"
b = "mot1.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor2"
a = "con2.motor"
b = "mot2.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor3"
a = "con3.motor"
b = "mot3.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor4"
a = "con4.motor"
b = "mot4.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

# Props on the motor shafts (shaft.3 male <-> bore.3 female). Spinning hinge, joint axis = motor shaft axis. CCW props (m1, m2) use the
# shaft axis +z; CW props (m3, m4) reverse it (-z) so the ESC's positive drive is clockwise and the rotor device uses dir = -1 (see the
# rotor bindings). The prop retainer is not modelled.
[[mates]]
name = "spin1"
a = "mot1.shaft"
b = "prop1.hub"
joint = { type = "hinge", spin = true }

[[mates]]
name = "spin2"
a = "mot2.shaft"
b = "prop2.hub"
joint = { type = "hinge", spin = true }

[[mates]]
name = "spin3"
a = "mot3.shaft"
b = "prop3.hub"
joint = { type = "hinge", spin = true, reverse = true }

[[mates]]
name = "spin4"
a = "mot4.shaft"
b = "prop4.hub"
joint = { type = "hinge", spin = true, reverse = true }

# ESCs sit on their arm tubes (zip tie / heat shrink not modelled).
[[mates]]
name = "esc-seat1"
a = "tube1.esc"
b = "esc1.base"

[[mates]]
name = "esc-seat2"
a = "tube2.esc"
b = "esc2.base"

[[mates]]
name = "esc-seat3"
a = "tube3.esc"
b = "esc3.base"

[[mates]]
name = "esc-seat4"
a = "tube4.esc"
b = "esc4.base"

# PDB on the bottom plate. 4 x M3x14 + M3 locknut: the research (airframe doc, guide step 3) lists 4 x M3x14, 4 x locknut M3 and 4 nylon
# standoffs M3x5 for the bottom-plate spacers, which the bottom-plate 'pdb' port already assumes carry the PDB. The tie of these
# screws to the PDB is an inference (the guide does not label it). M3x14 = PDB 1.6 + standoff 5 + plate 2 + nut 4 + protrusion.
[[mates]]
name = "pdb-mount"
a = "bottom.pdb"
b = "pdb.base"
rotation = 0
fasteners = { part = "iso7045-m3x14", count = 4, nut = "din985-m3-locknut" }

# PM02, Pixhawk, GPS, SiK: flat seats (tape / foam / strap; no hole pattern published) -> no fasteners.
[[mates]]
name = "pm02-seat"
a = "bottom.pm02"
b = "pm02.base"

[[mates]]
name = "fc-seat"
a = "top.fc"
b = "fc.base"

[[mates]]
name = "gps-seat"
a = "top.gps_mast"
b = "gps.base"

[[mates]]
name = "sik-seat"
a = "top.sik"
b = "sik.base"

# Landing gear (the tee connectors / clamps are not modelled: placeholder interface).
[[mates]]
name = "leg-front"
a = "bottom.leg_front"
b = "leg_f.plate"

[[mates]]
name = "leg-rear"
a = "bottom.leg_rear"
b = "leg_r.plate"

# Rail rods under the bottom plate; the battery hangs on both rods (left rod places it, right rod is a closure).
[[mates]]
name = "rod-l"
a = "bottom.rail_l"
b = "rod_l.hanger"

[[mates]]
name = "rod-r"
a = "bottom.rail_r"
b = "rod_r.hanger"

[[mates]]
name = "battery-l"
a = "rod_l.slide"
b = "bat.rail_l"

[[mates]]
name = "battery-r"
a = "rod_r.slide"
b = "bat.rail_r"
closure = true

# ---- wires ---------------------------------------------------------------------------------------------------------------------------
# Power chain: battery -> PM02 -> PDB -> 4 ESCs (round trip, conductors = 2). included_in: the lead is already inside that part's
# datasheet mass (battery 436.5 g incl. 120 mm leads; PM02 20 g; ESC 21 g "incl. cable"; motor 64 g "incl. cable").
[[wires]]
name = "bat-to-pm02"
from = "bat.power_out"
to = "pm02.power_in"
part = "awg-10-silicone-wire"
length = "bat.discharge_wire_length"
conductors = 2
included_in = "bat"

[[wires]]
name = "pm02-to-pdb"
from = "pm02.power_out"
to = "pdb.power_in"
part = "awg-12-silicone-wire"
length = "pm02.out_lead_length"
conductors = 2
included_in = "pm02"

# ESC input pigtails: gauge is NOT published. ESTIMATED 16 AWG (awg-16-silicone-wire): a 20 A continuous ESC (30 A peak, XT30 plug
# rated for it) is normally wired with 16-18 AWG; 16 is the heavier of the two, i.e. the lower-resistance estimate.
[[wires]]
name = "pdb-to-esc1"
from = "pdb.out1"
to = "esc1.power_in"
part = "awg-16-silicone-wire"
length = "pdb.esc_lead_length"
conductors = 2
included_in = "esc1"

[[wires]]
name = "pdb-to-esc2"
from = "pdb.out2"
to = "esc2.power_in"
part = "awg-16-silicone-wire"
length = "pdb.esc_lead_length"
conductors = 2
included_in = "esc2"

[[wires]]
name = "pdb-to-esc3"
from = "pdb.out3"
to = "esc3.power_in"
part = "awg-16-silicone-wire"
length = "pdb.esc_lead_length"
conductors = 2
included_in = "esc3"

[[wires]]
name = "pdb-to-esc4"
from = "pdb.out4"
to = "esc4.power_in"
part = "awg-16-silicone-wire"
length = "pdb.esc_lead_length"
conductors = 2
included_in = "esc4"

# Motor phase leads: length = the motor's 150 mm datasheet cable; gauge NOT published, ESTIMATED 18 AWG (awg-18-silicone-wire; typical
# for a 17 A peak 920 kV 2216 motor). conductors = 3 phase leads. NOTE: the Esc device models the motor internally (r20 is the
# line-to-line winding resistance), so these Wire devices sit between two ports no other device uses (electrically dangling).
[[wires]]
name = "esc1-to-mot1"
from = "esc1.motor_out"
to = "mot1.phase"
part = "awg-18-silicone-wire"
length = "mot1.cable_length"
conductors = 3
included_in = "mot1"

[[wires]]
name = "esc2-to-mot2"
from = "esc2.motor_out"
to = "mot2.phase"
part = "awg-18-silicone-wire"
length = "mot2.cable_length"
conductors = 3
included_in = "mot2"

[[wires]]
name = "esc3-to-mot3"
from = "esc3.motor_out"
to = "mot3.phase"
part = "awg-18-silicone-wire"
length = "mot3.cable_length"
conductors = 3
included_in = "mot3"

[[wires]]
name = "esc4-to-mot4"
from = "esc4.motor_out"
to = "mot4.phase"
part = "awg-18-silicone-wire"
length = "mot4.cable_length"
conductors = 3
included_in = "mot4"

# Signal / low-power cables (awg-18 is the thinnest wire part in the library and stands in for the real small-gauge signal cable; mass is
# already inside the device datasheet mass, so included_in everywhere): PM02 5.2 V cable (ships with the PM02), ESC signal leads (ship
# with the ESCs), GPS cable (pre-attached, 26 cm datasheet), SiK telemetry cable (the radio part file folds the cable into its port).
[[wires]]
name = "pm02-to-fc"
from = "pm02.fc_power"
to = "fc.power1"
part = "awg-18-silicone-wire"
length = "pm02.fc_cable_length"
conductors = 2
included_in = "pm02"

[[wires]]
name = "fc-pwm1"
from = "fc.pwm1"
to = "esc1.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc1"

[[wires]]
name = "fc-pwm2"
from = "fc.pwm2"
to = "esc2.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc2"

[[wires]]
name = "fc-pwm3"
from = "fc.pwm3"
to = "esc3.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc3"

[[wires]]
name = "fc-pwm4"
from = "fc.pwm4"
to = "esc4.signal"
part = "awg-18-silicone-wire"
length = "fc.pwm_lead_length"
included_in = "esc4"

[[wires]]
name = "gps-to-fc"
from = "gps.gps_out"
to = "fc.gps1"
part = "awg-18-silicone-wire"
length = "gps.cable_length"
included_in = "gps"

[[wires]]
name = "sik-to-fc"
from = "sik.telem"
to = "fc.telem1"
part = "awg-18-silicone-wire"
length = "sik.telem_cable_length"
included_in = "sik"

