# Rotors: body = the prop instance, joint = its spin mate. Thrust direction = dir x (world joint axis) = +z for all four: CCW props
# (m1, m2) have axis +z and dir = +1, CW props (m3, m4) have the reversed axis -z and dir = -1 (same convention as tests/data/devices/all.xml).
# reynolds = true: the builder adds the pooled UIUC Reynolds factor tables and re-references ct / cq to x = 4.5 m^2/s (the validated N4b
# model of docs/validation/thrust-stands.md; napl.design.reynolds). k_h = 0 (H-force off): no data for this prop; its moment-free in-plane force is second order next to thrust at hover.
[[devices]]
type = "rotor"
name = "rotor1"
instance = "prop1"
body = "prop1"
joint = "spin1"
map = "prop1045"
dir = 1
ground_effect = true
reynolds = true
cq_ref = { value = 0.005794, unit = "1", fidelity = "derived", derivation = "C_Q(J=0) at x = 4.5 m^2/s of the T1045II prop = C_Q0 of the 2216 thrust-stand fit with the ESC loss modelled separately (napl bench thrust holybro-2216-kv920; docs/validation/thrust-stands.md; 3 training rows; tests/python/test_bench.py asserts this number equals the bench's). Replaces the prop part's torque-column-derived 0.00526: the vendor prints torque to 0.01 N m, and 0.00526 leaves 16 % of the vendor's own electrical input power (47.8 W) unexplained at the hover thrust (docs/validation/x500-hover.md). Independent cross-check: the UIUC static tables of APC 9x4.5 E (C_T 0.098) and 10x4.7 SF (C_T 0.12) give C_Q / C_T = 0.062 .. 0.064, i.e. C_Q 0.0057 .. 0.0058 at this prop's C_T 0.0908." }
set = { k_h = { value = 0.0, unit = "kg", fidelity = "estimated", rationale = "No H-force (blade flapping / in-plane drag) data exists for the T1045II; 0 switches the term off rather than inventing a coefficient (all.xml's 5e-5 is a test value)." } }

