# Power. The `params` overrides on pdb / pm02 / fc / sik hold the cable lengths nobody publishes; wires refer to them as "<inst>.<param>".
[[instances]]
id = "bat"
part = "tattu-4s-5200mah-35c"
group = "power"

[[instances]]
id = "pm02"
part = "holybro-pm02-v3"
group = "power"
params = { out_lead_length = { value = 0.10, unit = "m", fidelity = "estimated", rationale = "The PM02 V3 pre-soldered XT60 + 12 AWG output lead to the PDB has no published length (Holybro pages give only the 12 AWG gauge). In this assembly the PM02 seat (0, -0.045) and the PDB (0, 0) are 45 mm apart on the bottom plate; 0.10 m = that distance plus about one hand-width of slack. Electrical effect: 12 AWG 5.211 mOhm/m x 0.10 m x 2 conductors = 1.0 mOhm." }, fc_cable_length = { value = 0.15, unit = "m", fidelity = "estimated", rationale = "Length of the PM02 6-pin JST-GH power/sense cable to the Pixhawk POWER1 is not published. The PM02 seat is ~45 mm from the plate centre and the Pixhawk sits on the top plate 28 mm higher, so the straight-line distance is ~0.06 m; 0.15 m allows routing and slack." } }

[[instances]]
id = "pdb"
part = "holybro-pdb-60a"
group = "power"
params = { esc_lead_length = { value = 0.20, unit = "m", fidelity = "estimated", rationale = "Length of the ESC input pigtail (XT30) from the PDB output to the ESC is not published. In this assembly the ESC sits on its tube at radius 0.148 m from the plate centre (holybro-x500v2-arm-tube esc seat) and the PDB is at the centre, 0.148 m horizontal plus ~0.02 m of height; 0.20 m allows slack. Electrical effect: 16 AWG 13.17 mOhm/m x 0.20 m x 2 = 5 mOhm per ESC." } }

# Avionics
[[instances]]
id = "fc"
part = "holybro-pixhawk-6c"
group = "avionics"
params = { pwm_lead_length = { value = 0.30, unit = "m", fidelity = "estimated", rationale = "Length of each ESC signal lead from the Pixhawk FMU PWM Out to the ESC signal plug is not published. The ESC is 0.148 m out on the arm (+ ~0.03 m up from the top-plate to the tube level, + the Pixhawk header position); 0.30 m allows routing along the arm. Signal wires carry no current in the model: only the BOM / mass bookkeeping (and that is included in the ESC datasheet mass)." } }

[[instances]]
