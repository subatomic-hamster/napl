# Holybro X500 V2 quad (PX4 Development Kit X500 v2 build + Tattu 4S 5200 mAh 35C battery) assembled from parts/drone + parts/common.
# Syntax: assemblies/README.md. Every number below is a part-param reference or a provenance table (the loader enforces it).
#
# Frame: +x = vehicle forward, +y = left, +z up (right-handed, bottom-plate centre at the origin). The bottom plate seats arm1..arm4 sit on
# the 45 deg diagonals: arm1 (+x,+y) front-left, arm2 (-x,+y) rear-left, arm3 (-x,-y) rear-right, arm4 (+x,-y) front-right.
# Motor/ESC/prop numbering follows PX4's quad-X motor order (FMU PWM Out channel K drives motor K):
#   m1 = front-right (arm4), CCW     m2 = rear-left (arm2), CCW     m3 = front-left (arm1), CW     m4 = rear-right (arm3), CW
# (CCW/CW seen from above). Instances: conK / tubeK / motK / propK / escK all belong to motor K.
#
# Groups (for mass budgets / the published-weight target): frame = plates, arm connectors, arm tubes, landing gear (legs incl. tee
# connectors, foam grips, end caps), rail rods, hangers, platform board, battery mount (board, clips, pad, straps), GPS mast, the arm-clamp
# and landing-gear bolts and the lumped leftover-screw kit; propulsion = motors, props, ESCs and the motor screws; power = battery, PM02,
# PDB (+ their screws, wires); avionics = Pixhawk 6C, GPS, SiK radio.
#
# Frame-kit items modelled as mass-only seats (STEP positions, see the bottom-plate ports): 8 hangers (clamp + rubber ring), platform
# board (#31109), battery mount (#31108 board + 2 slide-bar clips + pad + 2 straps), GPS mast, and the kit screws the guide counts
# but this file does not tie to a mate (M2.5 x52 in several lengths, GPS-mount M3x10 + locknut, the 4 nylon standoffs under the PDB:
# part holybro-x500v2-hardware-kit, one lumped mass).
# NOT modelled: XT60 holder (guide part 22: no part file, STEP solids X500-TAO-XT60 / TOU-XT60H-M-14AWG exist), the optional
# depth-camera mount, prop retainers, zip ties / heat shrink, XT60/XT30 connector contact resistance, the receiver (not in the kit),
# the IMU heater power.
# GPS: the real mast stands on the platform board 99 mm AFT of the plate centre (STEP), so the GPS now sits at x = -0.099 m (was an
# estimated -0.040 m on the top-plate 'gps_mast' port, which is no longer used).

[assembly]
name = "x500v2"
description = "Holybro X500 V2 quadrotor (Pixhawk 6C, M8N GPS, SiK radio, 4x 2216 KV920 + BLHeli_S 20A + 1045 props, PM02 V3 + PDB, Tattu 4S 5200 mAh) in the PX4 X500 v2 kit configuration"
base = "free"
timestep = 0.001
seed = 3

