# Sensors. IMU and barometer sit on the Pixhawk site (instance origin = its mounting face; the 6C's internal sensors are a few mm higher,
# ignored). Magnetometer and GNSS sit on the GPS site (the kit's external compass is in the GPS module, away from the power wiring).
# The IMU gets no bias / random walk: the part publishes only initial-offset tolerances (a tolerance is not a bias) and no in-run
# stability (airframe doc gap 4). Accel noise uses the X/Y density (65 ug/rtHz); Z is 70 ug/rtHz.
# Rates must be 1 / (rate dt) integers at dt = 1 ms.
[[devices]]
type = "imu"
name = "imu"
instance = "icm"
site = "fc"
map = "icm42688"
set = { rate_hz = { value = 500.0, unit = "Hz", fidelity = "estimated", rationale = "Simulation tick is 1 ms, so 1000 Hz is the fastest representable rate; 500 Hz = every 2nd tick, inside the ICM-42688-P output-data-rate range (12.5-32000 Hz datasheet). The rate at which the flight firmware consumes samples is not modelled here." } }

[[devices]]
type = "baro"
name = "baro"
instance = "baro_chip"
site = "fc"
map = "ms5611"
set = { rate_hz = { value = 50.0, unit = "Hz", fidelity = "estimated", rationale = "MS5611 pressure + temperature conversions take 8.22 ms each at OSR 4096 (datasheet response time), i.e. at most ~60 Hz alternating; 50 Hz (every 20th tick) is chosen. Noise is the OSR 4096 RMS figure, assuming the driver runs that oversampling." } }

[[devices]]
type = "mag"
name = "mag"
instance = "mag_chip"
site = "gps"
map = "ist8310"
set = { rate_hz = { value = 100.0, unit = "Hz", fidelity = "estimated", rationale = "IST8310 output data rate is 1-200 Hz (datasheet); 100 Hz (every 10th tick) is a mid value. The rate the firmware polls it at is not modelled." }, earth_field = { value = [1.1e-6, 2.15e-5, -4.29e-5], unit = "T", fidelity = "estimated", rationale = "Local geomagnetic field in the world frame (x East, y North, z Up) for the GNSS origin below (~47.4 N, 8.5 E): about 21.5 uT horizontal pointing north, 1.1 uT east (declination ~3 deg) and 42.9 uT downward (inclination ~63 deg), total ~48 uT. Recalled approximate values for central Europe, NOT looked up in IGRF/WMM for this site or date; good to ~10 %. Replace with a WMM evaluation if the heading matters." } }

[[devices]]
type = "gnss"
name = "gnss"
instance = "gnss_chip"
site = "gps"
map = "m8n"
set = { lat0 = { value = 47.3769, unit = "deg", fidelity = "estimated", rationale = "Arbitrary simulation origin, the same site as the repo's test model tests/data/devices/all.xml (Zurich); not a claim about where the vehicle flies." }, lon0 = { value = 8.5417, unit = "deg", fidelity = "estimated", rationale = "As lat0." }, alt0 = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "As lat0 (all.xml uses 408 m). The environment device below carries the same value as origin_alt, so the barometer's ISA pressure and the GNSS altitude agree." }, horiz_std = { value = 2.1233, unit = "m", fidelity = "derived", derivation = "u-blox NEO-M8N horizontal position accuracy 2.5 m CEP (ublox_neo_m8n horizontal_accuracy_cep_gps, datasheet, 50 % radius) converted to a per-coordinate sigma of a circular normal distribution: sigma = CEP / 1.17741 = 2.1233 m." }, vert_std = { value = 3.185, unit = "m", fidelity = "derived", derivation = "1.5 x horiz_std (2.1233 m) = 3.185 m: the ratio 3.75 m / 2.5 m of the part's vertical_accuracy_cep (itself an estimate: 1.5 x horizontal CEP) to its horizontal CEP, applied to sigma." } }

# Environment: calm air, world z = 0 at the same altitude as the GNSS origin (alt0 above), so the ISA barometer and GNSS agree. The two
# values are duplicated with identical rationale (one provenance, two keys). Air density for the rotors is evaluated at origin_alt + z.
[[devices]]
type = "environment"
name = "environment"
instance = "gnss_chip"   # provenance only: origin_alt follows the GNSS origin of this part's binding
set ={ origin_alt = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "Same value as the GNSS alt0 above: arbitrary simulation origin at the repo's test-model site (Zurich, tests/data/devices/all.xml uses 408 m); not a claim about where the vehicle flies." }, w20 = { value = 0.0, unit = "m/s", fidelity = "estimated", rationale = "Calm air: no wind source exists for this assembly, so turbulence is switched off (w20 = 0) and the steady wind is left empty." } }

# ---- targets ---------------------------------------------------------------------------------------------------------------------
# Holybro's "Weight: 610g" is listed under "Mechanical Specification" on https://docs.holybro.com/drone-development-kit/px4-development-kit-x500v2.md
# and on https://holybro.com/products/x500-v2-kits. Evidence for its scope (fetched 2026-10-07):
#  * docs page, order of sections: "Development Kit Includes" (... "Preinstalled Items: Motors ... ESCs ... 1045 Propellers (6 pcs) ...
#    Power Distribution Board ...") -> "### X500 V2 Frame Kit Details (SKU30120):" (Body plates, Arm tubes + nylon connectors, Landing
#    gear, Platform board, Dual 10mm rod x 250 mm rail mounting system, Battery mount with two Battery Straps, Hand tools for installation)
#    -> "### Mechanical Specification:" (Wheelbase 500mm, Motor mount pattern 16x16mm, Frame Body 144x144mm 2mm thick, Landing gear height
#    215mm, Space between top and bottom plates 28mm, "Weight: 610g", Flight time ~18 minutes hover, Max payload ~1kg). The Frame Kit Details
#    heading links to the frame-kit product page (SKU 30120) and is the section immediately above the specification; every other line of
#    the specification (wheelbase, plates, gear height, plate spacing, motor pattern) describes the frame.
#  * shop page: the same list appears after "X500 V2 ARF Kit (SKU30125): X500 V2 Frame Kit With Preinstalled Items: Motors, ESCs, 1045
#    Propellers, Power Distribution Board" and after "X500 V2 Frame Kit Details (SKU30120)". Neither page states what the 610 g covers.
# Scope chosen from that evidence: the FRAME KIT contents (plates, arms, landing gear, rail rods; group "frame"), not the preinstalled
# motors / ESCs / props / PDB, which the kit pages list separately as "Preinstalled Items" of the ARF kit. This is an interpretation: the
# vendor never says "frame kit weight". The modelled frame group omits the platform board, battery mounting board and straps, hangers,
# tee connectors, foam grips and most hardware (see the header), so a model BELOW the target is expected; the gap is reported, not tuned.
[[targets]]
name = "frame kit published weight (Holybro 'Weight: 610g')"
groups = ["frame"]
value = "kit.published_weight"
