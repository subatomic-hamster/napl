map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 1.8, unit = "K/W", fidelity = "estimated", rationale = "(80 degC surface at 100 % throttle after 10 min, vendor thrust-test note - 25 degC assumed ambient) / (16.37 A^2 x 0.115 ohm = 30.8 W) = 1.8 K/W; surface, not winding, temperature, so a lower bound for winding-to-ambient." } }

# Rotors: body = the prop instance, joint = its spin mate. Thrust direction = dir x (world joint axis) = +z for all four: CCW props
# (m1, m2) have axis +z and dir = +1, CW props (m3, m4) have the reversed axis -z and dir = -1 (same convention as tests/data/devices/all.xml).
# k_h = 0 (H-force off): no data for this prop; its moment-free in-plane force is second order next to thrust at hover.
[[devices]]
type = "rotor"
name = "rotor1"
instance = "prop1"
body = "prop1"
joint = "spin1"
map = "prop1045"
dir = 1
ground_effect = true
set = { k_h = { value = 0.0, unit = "kg", fidelity = "estimated", rationale = "No H-force (blade flapping / in-plane drag) data exists for the T1045II; 0 switches the term off rather than inventing a coefficient (all.xml's 5e-5 is a test value)." } }

[[devices]]
