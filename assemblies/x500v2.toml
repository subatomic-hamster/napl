# Motors: 4 x M3x6 per motor into the motor's tapped holes through the 2 mm motor base (airframe doc: iso4762-m3x6, 16 = 4 per arm).
# Tapped depth 4 mm + base 2 mm = L_min 6 mm = the screw length (exact fit; no warning).
[[mates]]
name = "motor1"
a = "con1.motor"
b = "mot1.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor2"
a = "con2.motor"
b = "mot2.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor3"
a = "con3.motor"
b = "mot3.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

[[mates]]
name = "motor4"
a = "con4.motor"
b = "mot4.base"
rotation = 0
fasteners = { part = "iso4762-m3x6", count = 4 }

# Props on the motor shafts (shaft.3 male <-> bore.3 female). Spinning hinge, joint axis = motor shaft axis. CCW props (m1, m2) use the
# shaft axis +z; CW props (m3, m4) reverse it (-z) so the ESC's positive drive is clockwise and the rotor device uses dir = -1 (see the
# rotor bindings). The prop retainer is not modelled.
[[mates]]
name = "spin1"
a = "mot1.shaft"
b = "prop1.hub"
joint = { type = "hinge", spin = true }

[[mates]]
name = "spin2"
a = "mot2.shaft"
b = "prop2.hub"
joint = { type = "hinge", spin = true }

[[mates]]
name = "spin3"
a = "mot3.shaft"
b = "prop3.hub"
joint = { type = "hinge", spin = true, reverse = true }

[[mates]]
name = "spin4"
a = "mot4.shaft"
b = "prop4.hub"
joint = { type = "hinge", spin = true, reverse = true }

# ESCs sit on their arm tubes (zip tie / heat shrink not modelled).
[[mates]]
name = "esc-seat1"
a = "tube1.esc"
b = "esc1.base"

[[mates]]
name = "esc-seat2"
a = "tube2.esc"
b = "esc2.base"

[[mates]]
name = "esc-seat3"
a = "tube3.esc"
b = "esc3.base"

[[mates]]
name = "esc-seat4"
a = "tube4.esc"
b = "esc4.base"

# PDB on the bottom plate. 4 x M3x14 + M3 locknut: the research (airframe doc, guide step 3) lists 4 x M3x14, 4 x locknut M3 and 4 nylon
# standoffs M3x5 for the bottom-plate spacers, which the bottom-plate 'pdb' port already assumes carry the PDB. The tie of these
# screws to the PDB is an inference (the guide does not label it). M3x14 = PDB 1.6 + standoff 5 + plate 2 + nut 4 + protrusion.
[[mates]]
name = "pdb-mount"
a = "bottom.pdb"
b = "pdb.base"
rotation = 0
fasteners = { part = "iso7045-m3x14", count = 4, nut = "din985-m3-locknut" }

# PM02, Pixhawk, GPS, SiK: flat seats (tape / foam / strap; no hole pattern published) -> no fasteners.
[[mates]]
name = "pm02-seat"
a = "bottom.pm02"
b = "pm02.base"

[[mates]]
name = "fc-seat"
a = "top.fc"
b = "fc.base"

[[mates]]
name = "gps-seat"
a = "mast.tray"
b = "gps.base"

[[mates]]
name = "sik-seat"
a = "top.sik"
b = "sik.base"

# Landing gear: pole top end 6.5 mm below the plate underside inside the upper clamp, 4 x M3x8 per leg (guide step 4 'Socket Cap Screw
