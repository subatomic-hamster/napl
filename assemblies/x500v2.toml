# ---- mates ---------------------------------------------------------------------------------------------------------------------------
# Arm clamps: bottom plate seat -> connector (k = 0 puts each arm on its diagonal). The kit's 16 x M3x38 + flange locknut (4 per arm,
# airframe doc step 5) run through the whole 2 + 28 + 2 mm plate stack (holybro-x500v2 iso4762-m3x38 port note), so they are counted
# ONCE per arm, on this (bottom) mate; the top-plate mates below carry no fasteners. At the bottom mate alone the stack is 19.9 mm
# (plate 2 mm + lower clamp half 17.9 mm), so M3x38 is never short here (no FASTENER_SHORT).
[[mates]]
name = "clamp1"
a = "bottom.arm4"
b = "con1.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp2"
a = "bottom.arm2"
b = "con2.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp3"
a = "bottom.arm1"
b = "con3.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

[[mates]]
name = "clamp4"
a = "bottom.arm3"
b = "con4.plate_lo"
rotation = 0
fasteners = { part = "iso4762-m3x38", count = 4, nut = "m3-flange-locknut" }

# Top plate: placed by one connector (con1 -> top.arm4); the other three seats are loop closures (checked to 1e-6 m / rad).
