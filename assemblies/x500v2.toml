# ---- devices -----------------------------------------------------------------------------------------------------------------------
# Battery: OCV = lipo-cell-ocv-chen2006 (measured, literature: Chen & Rincon-Mora 2006) x 4 series cells; soc0 = 1 (default, full pack).
# CAVEAT: Chen's cells were charged to 4.1 V (not 4.2 V), so the full-pack OCV is 4 x 4.103 = 16.41 V, not 16.8 V; a real 4.2 V pack
# reads ~0.4 V higher at the top. r_internal_pack (20 mOhm, kept) is unchanged. r0 / r1 are the
# part's estimated pack resistances. c1 = thevenin_tau / r1 (the part publishes the RC time constant 3.3 s, literature, Bauersfeld).
[[devices]]
type = "battery"
name = "battery"
instance = "bat"
port = "power_out"
ocv = "lipo-cell-ocv-chen2006"
map = "tattu"
set = { c1 = { value = 412.5, unit = "F", fidelity = "estimated", rationale = "c1 = tau_RC / r1 = 3.3 s (tattu thevenin_tau, literature, Bauersfeld & Scaramuzza Table I) / 0.008 ohm (tattu thevenin_r1, itself estimated) = 412.5 F. Estimated because r1 is." } }

# Internal board / shunt resistance of the PM02 (r_series, estimated in the part) and of the PDB copper path (r_path, estimated). Naming
# the ports in an internal `wire` binding makes them separate electrical nodes, so each is a real resistor in the chain.
[[devices]]
type = "wire"
name = "pm02_board"
instance = "pm02"
a = "power_in"
b = "power_out"
map = "pm02_board"

[[devices]]
type = "wire"
name = "pdb_path1"
instance = "pdb"
a = "power_in"
b = "out1"
map = "pdb_path"

