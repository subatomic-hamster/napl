[device_maps.prop1045]
"diameter" = "diameter"
"j" = "@ct_cq_j.j"
"ct" = "@ct_cq_j.ct"
"cq" = "@ct_cq_j.cq"

[device_maps.tattu]
"capacity_ah" = "capacity_ah"
"r0" = "r_internal_pack"
"r1" = "thevenin_r1"

[device_maps.pm02_board]
"resistance" = "r_series"

[device_maps.pdb_path]
