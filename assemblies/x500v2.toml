# Sensors. IMU and barometer sit on the Pixhawk site (instance origin = its mounting face; the 6C's internal sensors are a few mm higher,
# ignored). Magnetometer and GNSS sit on the GPS site (the kit's external compass is in the GPS module, away from the power wiring).
# The IMU gets no bias / random walk: the part publishes only initial-offset tolerances (a tolerance is not a bias) and no in-run
# stability (airframe doc gap 4). Accel noise uses the X/Y density (65 ug/rtHz); Z is 70 ug/rtHz.
# Rates must be 1 / (rate dt) integers at dt = 1 ms.
[[devices]]
type = "imu"
name = "imu"
instance = "icm"
site = "fc"
map = "icm42688"
set = { rate_hz = { value = 500.0, unit = "Hz", fidelity = "estimated", rationale = "Simulation tick is 1 ms, so 1000 Hz is the fastest representable rate; 500 Hz = every 2nd tick, inside the ICM-42688-P output-data-rate range (12.5-32000 Hz datasheet). The rate at which the flight firmware consumes samples is not modelled here." } }

[[devices]]
type = "baro"
name = "baro"
instance = "baro_chip"
site = "fc"
map = "ms5611"
set = { rate_hz = { value = 50.0, unit = "Hz", fidelity = "estimated", rationale = "MS5611 pressure + temperature conversions take 8.22 ms each at OSR 4096 (datasheet response time), i.e. at most ~60 Hz alternating; 50 Hz (every 20th tick) is chosen. Noise is the OSR 4096 RMS figure, assuming the driver runs that oversampling." } }

[[devices]]
type = "mag"
name = "mag"
instance = "mag_chip"
site = "gps"
map = "ist8310"
set = { rate_hz = { value = 100.0, unit = "Hz", fidelity = "estimated", rationale = "IST8310 output data rate is 1-200 Hz (datasheet); 100 Hz (every 10th tick) is a mid value. The rate the firmware polls it at is not modelled." }, earth_field = { value = [1.294e-6, 2.1756e-5, -4.3027e-5], unit = "T", fidelity = "derived", derivation = "The field PX4 itself assumes at the GNSS origin (47.3769 N, 8.5417 E), so the EKF's mag declination matches the simulated field: PX4 v1.17.0 src/lib/world_magnetic_model/geo_mag_declination.cpp (bilinear lookup in the WMM-2020 tables of geo_magnetic_tables.hpp, 10 deg grid), same corners as tests/data/px4/x500_fixture.xml (decl raw 252 629 719 193 x 0.00545143529, incl 20340 20695 24404 24176 x 0.00269892697, intensity 22117 22515 24073 23819 x 2.04183477 nT) with weights lat 0.73769, lon 0.85417: declination 3.4038 deg, inclination 63.1360 deg (down), F = 48231.8 nT; H = F cos(inc) = 21.795 uT, B_E = H sin(dec) = 1.294e-6 T, B_N = H cos(dec) = 2.1756e-5 T, B_U = -F sin(inc) = -4.3027e-5 T. (Replaces the earlier recalled 1.1e-6 / 2.15e-5 / -4.29e-5, 0.5 deg off in declination; the ULog yaw error did not change measurably, docs/research/px4-sitl.md N5c.)" } }

[[devices]]
type = "gnss"
name = "gnss"
instance = "gnss_chip"
site = "gps"
map = "m8n"
set = { latency_s = { value = 0.2, unit = "s", fidelity = "estimated", rationale = "No part publishes the receiver's output latency. PX4's EKF2_GPS_DELAY default is 110 ms (v1.17.0), px4/params/napl_sitl.params sets 200 ms to match this device; the device lags by round(latency_s x rate_hz) samples, and at the datasheet 5 Hz one sample is 0.2 s, the smallest non-zero lag." }, lat0 = { value = 47.3769, unit = "deg", fidelity = "estimated", rationale = "Arbitrary simulation origin, the same site as the repo's test model tests/data/devices/all.xml (Zurich); not a claim about where the vehicle flies." }, lon0 = { value = 8.5417, unit = "deg", fidelity = "estimated", rationale = "As lat0." }, alt0 = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "As lat0 (all.xml uses 408 m). The environment device below carries the same value as origin_alt, so the barometer's ISA pressure and the GNSS altitude agree." }, horiz_std = { value = 2.1233, unit = "m", fidelity = "derived", derivation = "u-blox NEO-M8N horizontal position accuracy 2.5 m CEP (ublox_neo_m8n horizontal_accuracy_cep_gps, datasheet, 50 % radius) converted to a per-coordinate sigma of a circular normal distribution: sigma = CEP / 1.17741 = 2.1233 m." }, vert_std = { value = 3.185, unit = "m", fidelity = "derived", derivation = "1.5 x horiz_std (2.1233 m) = 3.185 m: the ratio 3.75 m / 2.5 m of the part's vertical_accuracy_cep (itself an estimate: 1.5 x horizontal CEP) to its horizontal CEP, applied to sigma." }, corr_time_s = { value = 600.0, unit = "s", fidelity = "estimated", rationale = "Time constant of the slowly varying part of the position error (ionosphere, orbit / clock residuals, multipath geometry). The u-blox figure is a 24 h static CEP, i.e. mostly slow error, not per-fix scatter. Published stand-alone GPS data: Banachowicz (GPS / DGPS position coordinates, https://yadda.icm.edu.pl/baztech/element/bwmeta1.element.baztech-article-PWAB-0002-0006) finds them 'significantly correlated' with a mean correlation time 'within the range of a couple or more minutes'; Beard and McLain's textbook sUAS GPS model uses k_GPS = 1/1100 s (recalled, not re-fetched). 600 s sits inside that range; no receiver-specific value is published, so this is an estimate (docs/research/px4-sitl.md, N5c section)." }, corr_frac = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "Share of the position VARIANCE that is the Gauss-Markov part (the rest is white per-fix scatter); total sigma stays the datasheet-derived horiz_std / vert_std. 0.9 gives a white scatter of 0.32 x sigma = 0.67 m horizontal / 1.0 m vertical and a Gauss-Markov sigma of 2.01 m / 3.02 m. No source splits the M8N error budget; chosen so that the fast scatter is of the order of a metre, as seen on static consumer-GNSS tracks, while the 2.5 m CEP is reached over the long run. Estimate." } }

# Environment: calm air, world z = 0 at the same altitude as the GNSS origin (alt0 above), so the ISA barometer and GNSS agree. The two
# values are duplicated with identical rationale (one provenance, two keys). Air density for the rotors is evaluated at origin_alt + z.
[[devices]]
type = "environment"
name = "environment"
instance = "gnss_chip"   # provenance only: origin_alt follows the GNSS origin of this part's binding
set ={ origin_alt = { value = 408.0, unit = "m", fidelity = "estimated", rationale = "Same value as the GNSS alt0 above: arbitrary simulation origin at the repo's test-model site (Zurich, tests/data/devices/all.xml uses 408 m); not a claim about where the vehicle flies." }, w20 = { value = 0.0, unit = "m/s", fidelity = "estimated", rationale = "Calm air: no wind source exists for this assembly, so turbulence is switched off (w20 = 0) and the steady wind is left empty." } }

# ---- targets ---------------------------------------------------------------------------------------------------------------------
# Holybro's "Weight: 610g" is listed under "Mechanical Specification" on https://docs.holybro.com/drone-development-kit/px4-development-kit-x500v2.md
# and on https://holybro.com/products/x500-v2-kits. Evidence for its scope (fetched 2026-10-07):
#  * docs page, order of sections: "Development Kit Includes" (... "Preinstalled Items: Motors ... ESCs ... 1045 Propellers (6 pcs) ...
#    Power Distribution Board ...") -> "### X500 V2 Frame Kit Details (SKU30120):" (Body plates, Arm tubes + nylon connectors, Landing
#    gear, Platform board, Dual 10mm rod x 250 mm rail mounting system, Battery mount with two Battery Straps, Hand tools for installation)
#    -> "### Mechanical Specification:" (Wheelbase 500mm, Motor mount pattern 16x16mm, Frame Body 144x144mm 2mm thick, Landing gear height
#    215mm, Space between top and bottom plates 28mm, "Weight: 610g", Flight time ~18 minutes hover, Max payload ~1kg). The Frame Kit Details
#    heading links to the frame-kit product page (SKU 30120) and is the section immediately above the specification; every other line of
#    the specification (wheelbase, plates, gear height, plate spacing, motor pattern) describes the frame.
#  * shop page: the same list appears after "X500 V2 ARF Kit (SKU30125): X500 V2 Frame Kit With Preinstalled Items: Motors, ESCs, 1045
#    Propellers, Power Distribution Board" and after "X500 V2 Frame Kit Details (SKU30120)". Neither page states what the 610 g covers.
# Scope chosen from that evidence: the FRAME KIT contents (plates, arms, landing gear, rail rods, hangers, platform and battery boards,
# mast, hardware; group "frame"), not the preinstalled motors / ESCs / props / PDB, which the kit pages list separately as "Preinstalled
# Items" of the ARF kit. The vendor never says "frame kit weight" (an aggregator, air-rc.com, even prints 'Weight: 610 g' for the ARF kit
# from the same copied text), so the scope is decided by a mass check against the CAD (P1e, 2026-10-07), not by wording:
#  * frame-kit content, CAD volumes x estimated densities (this file's frame group): 0.553 kg +- 0.106 (all estimates, nothing weighed);
#  * the same plus 4 motors (4 x 64 g datasheet, holybro-2216-kv920): 0.809 kg = 33 % ABOVE 610 g, the ESCs (4 x 21 g) and the PDB would
#    add 0.10 kg more. With the frame group at 0.379 kg (the N3' state, missing ~0.17 kg of hardware) the 'frame + motors' sum was
#    0.635 kg, which only looked like a match because the frame was incomplete.
#  * the kit's shipping weights (Shopify variant weights on the shop page: frame kit 800 g, ARF kit 1500 g) leave 190 g for packaging,
#    tools and manual on top of 610 g for the frame kit, and the ARF's 1500 g minus its 800 g frame kit shipping weight is the
#    ~700 g of motors, ESCs, props and PDB (+ packaging) added on top.
# So 610 g is consistent with the frame kit (modelled 0.553 kg, gap -57 g = -9.3 %, inside the model's own tolerance) and not with a
# scope that includes the motors. The gap is reported, not tuned: the largest remaining uncertainties are the foam grips (density
# unknown: 14.6 g carried at 200 kg/m3, +-100 %), the battery straps (not in the STEP, 12 g estimated) and the unknown density / material of the platform and battery
# boards and the plastics.
[[targets]]
name = "frame kit published weight (Holybro 'Weight: 610g')"
groups = ["frame"]
value = "kit.published_weight"
