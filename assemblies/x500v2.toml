# ---- devices -----------------------------------------------------------------------------------------------------------------------
# Battery: OCV = lipo-cell-ocv-chen2006 (measured, literature: Chen & Rincon-Mora 2006) x 4 series cells; soc0 = 1 (default, full pack).
# CAVEAT: Chen's cells were charged to 4.1 V (not 4.2 V), so the full-pack OCV is 4 x 4.103 = 16.41 V, not 16.8 V; a real 4.2 V pack
# reads ~0.4 V higher at the top. r_internal_pack (20 mOhm, kept) is unchanged. r0 / r1 are the
# part's estimated pack resistances. c1 = thevenin_tau / r1 (the part publishes the RC time constant 3.3 s, literature, Bauersfeld).
[[devices]]
type = "battery"
name = "battery"
instance = "bat"
port = "power_out"
ocv = "lipo-cell-ocv-chen2006"
map = "tattu"
set = { c1 = { value = 412.5, unit = "F", fidelity = "estimated", rationale = "c1 = tau_RC / r1 = 3.3 s (tattu thevenin_tau, literature, Bauersfeld & Scaramuzza Table I) / 0.008 ohm (tattu thevenin_r1, itself estimated) = 412.5 F. Estimated because r1 is." } }

# Internal board / shunt resistance of the PM02 (r_series, estimated in the part) and of the PDB copper path (r_path, estimated). Naming
# the ports in an internal `wire` binding makes them separate electrical nodes, so each is a real resistor in the chain.
[[devices]]
type = "wire"
name = "pm02_board"
instance = "pm02"
a = "power_in"
b = "power_out"
map = "pm02_board"

[[devices]]
type = "wire"
name = "pdb_path1"
instance = "pdb"
a = "power_in"
b = "out1"
map = "pdb_path"

[[devices]]
type = "wire"
name = "pdb_path2"
instance = "pdb"
a = "power_in"
b = "out2"
map = "pdb_path"

[[devices]]
type = "wire"
name = "pdb_path3"
instance = "pdb"
a = "power_in"
b = "out3"
map = "pdb_path"

[[devices]]
type = "wire"
name = "pdb_path4"
instance = "pdb"
a = "power_in"
b = "out4"
map = "pdb_path"

# ESCs. Thermal: c_th / r_th are unpublished. Only data: the vendor thrust table note "Motor temperature is motor surface temperature
# @100% throttle running 10mins" = 80 degC (holybro-2216-kv920 [tables.thrust_test]); at that row the motor draws 16.37 A through
# 0.115 ohm = 30.8 W of copper loss, so (80 - 25) K / 30.8 W = 1.8 K/W surface-to-ambient (ambient not stated; 25 degC = the model's
# t_amb default). The winding is hotter than the surface, so r_th is a LOWER bound; c_th = 64 g x ~0.4 J/(g K) (copper 0.385, steel 0.45,
# aluminium 0.9 J/(g K), generic textbook values) gives a 46 s time constant, consistent with the vendor reaching steady state in 10 min.
# complementary is left at its schema default (false: diode freewheel; BLHeli_S damped-light behaviour is not published).
[[devices]]
type = "esc"
name = "esc1"
instance = "esc1"
port = "power_in"
motor = "mot1"
joint = "spin1"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 1.8, unit = "K/W", fidelity = "estimated", rationale = "(80 degC surface at 100 % throttle after 10 min, vendor thrust-test note - 25 degC assumed ambient) / (16.37 A^2 x 0.115 ohm = 30.8 W) = 1.8 K/W; surface, not winding, temperature, so a lower bound for winding-to-ambient." } }

[[devices]]
type = "esc"
name = "esc2"
instance = "esc2"
port = "power_in"
motor = "mot2"
joint = "spin2"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 1.8, unit = "K/W", fidelity = "estimated", rationale = "(80 degC surface at 100 % throttle after 10 min, vendor thrust-test note - 25 degC assumed ambient) / (16.37 A^2 x 0.115 ohm = 30.8 W) = 1.8 K/W; surface, not winding, temperature, so a lower bound for winding-to-ambient." } }

[[devices]]
type = "esc"
name = "esc3"
instance = "esc3"
port = "power_in"
motor = "mot3"
joint = "spin3"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 1.8, unit = "K/W", fidelity = "estimated", rationale = "(80 degC surface at 100 % throttle after 10 min, vendor thrust-test note - 25 degC assumed ambient) / (16.37 A^2 x 0.115 ohm = 30.8 W) = 1.8 K/W; surface, not winding, temperature, so a lower bound for winding-to-ambient." } }

[[devices]]
type = "esc"
name = "esc4"
instance = "esc4"
port = "power_in"
motor = "mot4"
