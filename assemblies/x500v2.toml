name = "pdb_path4"
instance = "pdb"
a = "power_in"
b = "out4"
map = "pdb_path"

# Avionics load, seen by the battery through the PM02 5.2 V BEC. The schema's Load is I = g V - i0 (constant conductance and/or constant
# current); there is no constant-power or BEC-converter device, and the 5 V rail is not a node of this model (pm02.fc_power is a source port
# no battery path reaches). So each avionics item is a CONSTANT-CURRENT sink on the battery side of the PM02 (node pm02.power_in, i.e. the
# pack voltage minus the XT60 lead drop), of the value I_bat = 5.2 V x I_5V / (eta x V_nom): rail voltage x the item's 5 V current (part
# params) over the BEC efficiency (pm02 bec_efficiency 0.85, estimated) and the pack nominal voltage (tattu v_nominal 14.8 V). Error
# introduced: a real regulated load is constant POWER, so its battery current rises as the pack sags (+/- 10 % at 16.4 V full / 14.8 V
# nominal, +23 % at 12 V empty); with the load only ~0.15 A against 15-20 A of motor current at hover this is a < 0.03 A effect.
# NOT included: IMU heater resistors (power unpublished), the PM02's own quiescent current, signal-rail currents of the ESC PWM outputs.
# The three terms (Pixhawk 6C derived from chip datasheets, M8N from the u-blox datasheet, SiK 50 % TX duty) are in the part params
# supply_current_typ / supply_current_typ / supply_current_avg; each `set` below spells the arithmetic.
[[devices]]
type = "load"
name = "load_fc"
instance = "pm02"
port = "power_in"
set = { i0 = { value = -0.1083, unit = "A", fidelity = "derived", derivation = "Pixhawk 6C: 5.2 V (pm02 bec_voltage) x 0.26203 A (fc supply_current_typ: STM32H743 226 mA + F103 30 mA + ICM-42688-P 0.88 mA + BMI088 5.15 mA, chip datasheets) / (0.85 (pm02 bec_efficiency, estimated) x 14.8 V (tattu v_nominal)) = 0.10831 A out of the battery. Negative i0 = a constant-current sink of that size." } }

[[devices]]
type = "load"
name = "load_gps"
instance = "pm02"
port = "power_in"
set = { i0 = { value = -0.0124, unit = "A", fidelity = "derived", derivation = "M8N GPS: 5.2 V x 0.030 A (gps supply_current_typ: u-blox NEO-M8N tracking, continuous, GPS + GLONASS, 30 mA @ 3 V) / (0.85 x 14.8 V) = 0.01240 A out of the battery. Holybro's ceiling 'Less than 200mA @ 5V' would give 0.0827 A." } }

[[devices]]
type = "load"
name = "load_sik"
instance = "pm02"
port = "power_in"
set = { i0 = { value = -0.0258, unit = "A", fidelity = "derived", derivation = "SiK radio V3: 5.2 V x 0.0625 A (sik supply_current_avg = (25 mA receive + 100 mA transmit at 20 dBm) / 2, 50 % TX duty assumed) / (0.85 x 14.8 V) = 0.02583 A out of the battery." } }

# ESC losses (map esc2216: r_on, sw_loss, i_q from the ESC part): FET conduction resistance in series with the winding, switching +
# dead-time fraction and quiescent current of the BLHeli_S 20A ESC, all estimated in the part with rationale (BLHeli_S manual: complementary
# "damped light" PWM, so no body-diode freewheel loss). Hover: ~0.45 W + 0.14 W + 0.24 W of 40 W per motor; docs/validation/x500-hover.md.
# ESCs. Thermal: c_th / r_th are unpublished. Only data: the vendor thrust table note "Motor temperature is motor surface temperature
# @100% throttle running 10mins" = 80 degC (holybro-2216-kv920 [tables.thrust_test]). r_th is the thrust-stand bench's calibration
# (0.962 K/W: the winding of the fitted stand model sits at 80 degC at that row, ambient 25 degC = the model's t_amb default; the
# earlier hand figure 1.8 K/W used the table's 16.37 A at a cold 0.115 ohm and ignored R(T)). The winding is hotter than the
# surface, so r_th is a LOWER bound; c_th = 64 g x ~0.4 J/(g K) (copper 0.385, steel 0.45,
# aluminium 0.9 J/(g K), generic textbook values) gives a 46 s time constant, consistent with the vendor reaching steady state in 10 min.
# complementary is left at its schema default (false: diode freewheel; BLHeli_S damped-light behaviour is not published).
[[devices]]
type = "esc"
name = "esc1"
instance = "esc1"
port = "power_in"
motor = "mot1"
joint = "spin1"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 0.962, unit = "K/W", fidelity = "derived", derivation = "napl bench thrust holybro-2216-kv920 (docs/validation/thrust-stands.md, thermal section; tests/python/test_bench.py asserts this number equals the bench calibration): r_th = (80 degC vendor surface temperature at 100 % throttle - 25 degC ambient) / (I_m^2 R(80 degC)) with I_m of the stand model fitted on the vendor table at the 100 % row and R(T) = R20 (1 + 0.00393 (T - 20)) = 0.962 K/W (the stand fit now carries the ESC loss model, which lowers the fitted I_m at the 100 % row; 0.927 K/W without it). Surface, not winding, temperature, so a lower bound for winding-to-ambient; at hover (~3 A) it moves the winding by ~1 K." } }

[[devices]]
type = "esc"
name = "esc2"
instance = "esc2"
port = "power_in"
motor = "mot2"
joint = "spin2"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 0.962, unit = "K/W", fidelity = "derived", derivation = "napl bench thrust holybro-2216-kv920 (docs/validation/thrust-stands.md, thermal section; tests/python/test_bench.py asserts this number equals the bench calibration): r_th = (80 degC vendor surface temperature at 100 % throttle - 25 degC ambient) / (I_m^2 R(80 degC)) with I_m of the stand model fitted on the vendor table at the 100 % row and R(T) = R20 (1 + 0.00393 (T - 20)) = 0.962 K/W (the stand fit now carries the ESC loss model, which lowers the fitted I_m at the 100 % row; 0.927 K/W without it). Surface, not winding, temperature, so a lower bound for winding-to-ambient; at hover (~3 A) it moves the winding by ~1 K." } }

[[devices]]
type = "esc"
name = "esc3"
instance = "esc3"
port = "power_in"
motor = "mot3"
joint = "spin3"
map = "esc2216"
set = { "motor.c_th" = { value = 25.6, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the whole 64 g motor at ~0.4 J/(g K) (generic copper/steel/aluminium mix); no vendor value." }, "motor.r_th" = { value = 0.962, unit = "K/W", fidelity = "derived", derivation = "napl bench thrust holybro-2216-kv920 (docs/validation/thrust-stands.md, thermal section; tests/python/test_bench.py asserts this number equals the bench calibration): r_th = (80 degC vendor surface temperature at 100 % throttle - 25 degC ambient) / (I_m^2 R(80 degC)) with I_m of the stand model fitted on the vendor table at the 100 % row and R(T) = R20 (1 + 0.00393 (T - 20)) = 0.962 K/W (the stand fit now carries the ESC loss model, which lowers the fitted I_m at the 100 % row; 0.927 K/W without it). Surface, not winding, temperature, so a lower bound for winding-to-ambient; at hover (~3 A) it moves the winding by ~1 K." } }

[[devices]]
