[[mates]]
name = "leg-rear"
a = "bottom.leg_rear"
b = "leg_r.plate"
fasteners = { part = "iso4762-m3x8", count = 4 }

# Hangers (guide parts 13 + 14, x8), platform board (#31109), battery mount (#31108 board + clips + pad + straps), GPS mast, leftover
