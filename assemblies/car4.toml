part = "pololu-wheel-90x10mm-1436"
group = "drive"

[[instances]]
id = "tire_fr"
part = "pololu-wheel-90x10mm-1436"
group = "drive"

[[instances]]
id = "tire_rl"
part = "pololu-wheel-90x10mm-1436"
group = "drive"

[[instances]]
id = "tire_rr"
part = "pololu-wheel-90x10mm-1436"
group = "drive"

[[instances]]
