# cuas2: the modular foam-ball turret as a design: 3D-printed frame from cad/cuas2 (meshes of the CAD build, per-part mass from the STL), bought parts from the library, full pin-level wiring.
#
# FRAMES (cad/cuas2 manifest.json, mm in the CAD, m here). B = origin on the pan axis at the datum of the base plate, x forward at pan 0, y left, z up: the ROOT (base plate) IS frame B, every static part is
# placed in it. The pan group (rotor plate, yokes, lazy susan, tilt motor, bearings) is mated to the base plate through `pan_joint` (axis +z, +-170 deg). H = the tilt axis, origin (0, 0, 200 mm) in B, x along the
# barrel, y left, z up at tilt 0. The tilt group (cradle, cartridge, feeder, sensor bar, flywheels, beams, camera) is mated to yoke_left through `tilt_joint` (axis -y_H: positive tilt raises the muzzle, -15..+70 deg).
# Every printed mesh is already in its group frame, so a seat port's pose IS the child's part frame in the group root.
# NOT MODELLED HERE (left to the integration / model steps): the gate-plug hinge and the pusher slider as joints (the plug is shown at BORE, the rod retracted), the foam rounds, the launcher / camera / servo
# devices, the belts (closed GT2 loops), the buzzer on GP17 and the unused DIAG pin GP22 (no library part, no kernel effect), the 20 A fuse cartridge itself, the optional TF-Luna.
#
# ELECTRICAL (docs/cuas2/wiring.md; spec 6.5 pins). XT60 inlet -> 20 A fuse -> 12 V bus (Jetson barrel, two TMC2209 VM, key, relay contact 30). WEAPON RAIL: key (COM-NO) -> E-stop NC -> 40 A relay coil (86) -> relay coil (85)
# -> IRLB8721 supervisor MOSFET -> GND. The MOSFET gate is driven by the 74HCT123 supervisor (kept alive only by the Pico's 100 Hz KICK on GP28) through 1 k and is held low by a 2N3904 when the
# 74HCT4017 hardware shot counter has seen N = 10 balls on the muzzle beam. Reset of the counter = key power cycle only. The relay contact (87) feeds both ESCs and the LM2596 buck (5 V for the gate servo and, through the
# 74HCT123 shot limiter and an IRF9540N high-side switch, for the pusher servo). The 74HCT ICs run from an L7805 on the key-switched 12 V. The Pico reads the key / E-stop nodes through 33k/10k dividers.

[assembly]
name = "cuas2"
description = "cuas2 modular pan-tilt foam-ball turret: printed frame (CAD meshes), NEMA 17 belt-driven pan / tilt, dual brushless flywheel launcher with a one-ball plug-valve feeder, Brio camera, Jetson Orin Nano + RP2040, relay weapon rail with hardware limiter, supervisor and shot counter"
base = "fixed"
timestep = 0.001

