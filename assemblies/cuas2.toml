# ================================================================ device maps ====================================================================================================
[device_maps.psu]
voltage = "v_out_nominal"
r_series = "r_out"
i_limit = "current_limit"

# ================================================================ devices ========================================================================================================
[[devices]]
type = "psu"
name = "psu"
instance = "psu"
port = "power_out"
map = "psu"

[[instances]]
id = "ball"
part = "nerf-rival-accu-round"
group = "ammo"
offboard = true

[[instances]]
id = "launcher"
part = "cuas2-foam-launcher"
group = "tilt"

[[mates]]
name = "launcher--cradle"
a = "cradle.seat_launcher"
b = "launcher.origin"

# Launcher device (spec 7.3): the muzzle site = the marker's `muzzle` port (barrel axis +x of the marker, ref up: site x = up, site z = barrel, spin axis = site_x x site_z). Per-shot speed / spin are
# written by python/napl/cuas2/launcher.py; cl_k and spin_tau switch the Magnus model on.
[device_maps.foam_launcher]
muzzle_velocity = "muzzle_velocity"
v_std = "muzzle_velocity_std"
spread_std = "spread_std"
pellet_mass = "pellet:mass"
diameter = "pellet:caliber"
cd = "pellet:cd"
cl_k = "cl_k"
spin_tau = "spin_tau"

[[devices]]
type = "launcher"
name = "gun"
instance = "launcher"
site = "launcher"
site_port = "muzzle"
pellet = "ball"
map = "foam_launcher"
