# ================================================================ wiring =========================================================================================================
# ---- 12 V supply: brick -> XT60 -> 20 A fuse -> bus; returns to the XT60 minus ---------------------------------------------------------------------------------------------------
[[wires]]
name = "psu_cord"
from = "psu.power_out"
to = "xt60.wire_female"
from_pins = ["OUT.1", "OUT.2"]
to_pins = ["WF.1", "WF.2"]
part = "awg-18-silicone-wire"
length = "psu.cable_length"
conductors = 2
included_in = "psu"

[[wires]]
name = "xt60_fuse"
from = "xt60.wire_male"
to = "fuse.line"
from_pins = ["WM.1"]
to_pins = ["F.1"]
part = "awg-18-silicone-wire"
length = { value = 0.15, unit = "m", fidelity = "estimated", rationale = "Estimated: inlet to the fuse holder on the lower deck." }

[[wires]]
name = "fuse_jetson"
from = "fuse.line"
to = "jetson.power_in"
from_pins = ["F.2"]
to_pins = ["J16.1"]
part = "awg-18-silicone-wire"
length = { value = 0.25, unit = "m", fidelity = "estimated", rationale = "Estimated: fuse to the Jetson DC jack across the lower deck." }

[[wires]]
name = "gnd_jetson"
from = "jetson.power_in"
to = "xt60.wire_male"
from_pins = ["J16.2"]
to_pins = ["WM.2"]
part = "awg-18-silicone-wire"
length = { value = 0.25, unit = "m", fidelity = "estimated", rationale = "Estimated: Jetson DC jack back to the inlet minus." }

[[wires]]
name = "fuse_tmc_pan"
from = "fuse.line"
to = "tmc_pan.vmot"
from_pins = ["F.2"]
to_pins = ["PWR.1"]
part = "awg-18-silicone-wire"
length = { value = 0.60, unit = "m", fidelity = "estimated", rationale = "Estimated: lower deck up the leg into the power box." }

[[wires]]
name = "gnd_tmc_pan"
from = "tmc_pan.vmot"
to = "xt60.wire_male"
from_pins = ["PWR.2"]
to_pins = ["WM.2"]
part = "awg-18-silicone-wire"
length = { value = 0.60, unit = "m", fidelity = "estimated", rationale = "Estimated: as fuse_tmc_pan." }

[[wires]]
name = "fuse_tmc_tilt"
from = "fuse.line"
to = "tmc_tilt.vmot"
from_pins = ["F.2"]
to_pins = ["PWR.1"]
part = "awg-18-silicone-wire"
length = { value = 0.62, unit = "m", fidelity = "estimated", rationale = "Estimated: as fuse_tmc_pan." }

[[wires]]
name = "gnd_tmc_tilt"
from = "tmc_tilt.vmot"
to = "xt60.wire_male"
from_pins = ["PWR.2"]
to_pins = ["WM.2"]
part = "awg-18-silicone-wire"
length = { value = 0.62, unit = "m", fidelity = "estimated", rationale = "Estimated: as fuse_tmc_pan." }

