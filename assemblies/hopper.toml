# ---- wiring -------------------------------------------------------------------------------------------------------------------------------
# Pack -> ESC (leads ship on the ESC, mass in its 150.4 g; 10 AWG estimated for a 120 A ESC), ESC -> motor (leads ship on the motor), pack -> the two regulators, regulators -> servos (daisy chain per
# regulator) and flight computer / lidar.
[[wires]]
name = "batt_esc"
from = "batt.power_out"
to = "esc.power_in"
part = "awg-10-silicone-wire"
length = { value = 0.12, unit = "m", fidelity = "estimated", rationale = "Battery beside the duct to the ESC across it: about 0.12 m including the connector pigtails." }
conductors = 2
included_in = "esc"

[[wires]]
name = "esc_motor"
from = "esc.motor_out"
to = "motor.phase"
part = "awg-10-silicone-wire"
length = { value = 0.10, unit = "m", fidelity = "estimated", rationale = "ESC beside the housing to the motor in its rear cage: about 0.10 m." }
conductors = 3
included_in = "motor"

[[wires]]
name = "batt_reg1"
from = "batt.power_out"
to = "reg1.vin"
part = "awg-18-silicone-wire"
length = { value = 0.12, unit = "m", fidelity = "estimated", rationale = "Battery to the +y regulator, 0.1 m plus slack." }
conductors = 2

[[wires]]
name = "batt_reg2"
from = "batt.power_out"
to = "reg2.vin"
part = "awg-18-silicone-wire"
length = { value = 0.12, unit = "m", fidelity = "estimated", rationale = "Battery to the -y regulator, 0.1 m plus slack." }
conductors = 2

[[wires]]
name = "reg1_sv1"
from = "reg1.vout"
to = "sv1.port_a"
part = "awg-22-silicone-wire"
length = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Regulator on the +y strip down the +x bracket to servo 1: 0.15 m run plus slack." }
conductors = 2

[[wires]]
name = "sv1_sv2"
from = "sv1.port_b"
to = "sv2.port_a"
part = "robotis-robot-cable-x3p-180mm"
length = "cable.length_default"
conductors = 2

[[wires]]
name = "reg2_sv3"
from = "reg2.vout"
to = "sv3.port_a"
part = "awg-22-silicone-wire"
length = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Regulator on the -y strip to servo 3 on the -x bracket: 0.15 m run plus slack." }
conductors = 2

[[wires]]
name = "sv3_sv4"
from = "sv3.port_b"
to = "sv4.port_a"
part = "robotis-robot-cable-x3p-180mm"
length = "cable.length_default"
conductors = 2

[[wires]]
name = "reg1_fc"
from = "reg1.vout"
to = "fc.vin"
part = "awg-26-silicone-wire"
length = { value = 0.10, unit = "m", fidelity = "estimated", rationale = "Regulator to the flight computer on the same strip, 0.05 m apart: 0.10 m with a service loop." }
conductors = 2

[[wires]]
name = "reg1_lidar"
from = "reg1.vout"
to = "lidar.power_in"
part = "awg-26-silicone-wire"
length = { value = 0.20, unit = "m", fidelity = "estimated", rationale = "Regulator across the deck edge to the underside lidar: 0.2 m." }
conductors = 2

