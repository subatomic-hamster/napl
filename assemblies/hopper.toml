# ---- devices -----------------------------------------------------------------------------------------------------------------------------
[[devices]]
type = "battery"
name = "battery"
instance = "batt"
port = "power_out"
ocv = "lipo-cell-ocv-chen2006"
map = "pack6s"

[[devices]]
type = "psu"
name = "reducer1"
instance = "reg1"
port = "vout"
map = "reg5v"
set = { r_series = { value = 0.05, unit = "ohm", fidelity = "estimated", rationale = "Output impedance of a small buck module: not published for the D24V50F5; 0.05 ohm as assemblies/tvc-lander.toml." } }

[[devices]]
type = "psu"
name = "reducer2"
instance = "reg2"
port = "vout"
map = "reg5v"
set = { r_series = { value = 0.05, unit = "ohm", fidelity = "estimated", rationale = "As reducer1." } }

[[devices]]
type = "environment"
name = "air"
instance = "frame"
set = { origin_alt = { value = 0.0, unit = "m", fidelity = "estimated", rationale = "World z = 0 is sea level (ISA density 1.225 kg/m3 at the pad); not a claim about a flight site." }, w20 = { value = 0.0, unit = "m/s", fidelity = "estimated", rationale = "Calm by default; examples/hopper/scene.py rebuilds the model with the scenario's Dryden intensity (w20 = mean wind at 6.1 m) and sets the mean wind with the `wind` attribute." } }

[[devices]]
type = "esc"
name = "esc"
instance = "esc"
port = "power_in"
motor = "motor"
joint = "spin"
map = "esc_edf"
set = { "motor.c_th" = { value = 134.0, unit = "J/K", fidelity = "estimated", rationale = "Lumped thermal capacity of the 335 g motor at ~0.4 J/(g K) (copper / steel / aluminium mix); no vendor value." }, "motor.r_th" = { value = 0.5, unit = "K/W", fidelity = "estimated", rationale = "No vendor value. 0.5 K/W: 60 K winding rise at the 108 W copper loss of the 105 A full-throttle row, air-cooled by the fan's own flow; only the temperature readout depends on it (a 60 s hop at about 25 A average loses 6 W)." } }

[[devices]]
type = "rotor"
name = "rotor"
instance = "fan"
body = "fan"
joint = "spin"
stator_body = "duct"
map = "edf80"
dir = 1
set = { swirl_recovery = { value = 0.8, unit = "1", fidelity = "estimated", rationale = "Share of the fan's reaction torque returned by the stator vanes. Not published for this fan. A stator that straightens the swirl returns the whole swirl momentum to the housing (value 1); real straighteners recover 70-90 % of it (estimate, no source). The hopper's yaw authority depends on it: the full Q at hover (0.17 N m) against about 0.14 N m of vane yaw authority." } }

[[devices]]
type = "body_drag"
name = "drag"
instance = "frame"
body = "frame"
set = { cd = { value = 1.0, unit = "1", fidelity = "estimated", rationale = "A bluff stack of deck, battery and housing seen side-on: Cd of order 1." }, area = { value = 0.045, unit = "m^2", fidelity = "estimated", rationale = "Side projection of the housing (0.083 x 0.10 m), battery (0.116 x 0.0385 m) and deck edge (0.2 x 0.004 m), the legs excluded: 0.0083 + 0.0045 + 0.0008 m2 plus the legs' frontal area, taken 0.045 m2 (+-50 %)." } }

[[devices]]
type = "jet_vane"
name = "vane1"
instance = "vane1"
body = "vane1"
site = "vane1"
site_port = "aero"
rotor = "rotor"
duct = "duct"
map = "vane"
set = { exit_area = { value = 0.0034, unit = "m^2", fidelity = "derived", derivation = "Duct exit tube inner radius 0.0329 m (parts/propulsion/qx-80mm-12-blade-edf-duct exit_area)." }, cn_alpha = { value = 1.9, unit = "1/rad", fidelity = "derived", derivation = "Helmbold low-aspect-ratio wing slope a = 2 pi AR / (2 + sqrt(4 + AR^2)) per rad with the effective aspect ratio 1.33 (2 x immersed span 0.030 m / chord 0.045 m: the root plane reflects the plate): 1.90 per rad. Textbook (not looked up here); the plate is thin and stalls early." }, cn_max = { value = 1.16, unit = "1", fidelity = "estimated", rationale = "Normal-force coefficient of a stalled flat plate of aspect ratio about 1 (Hoerner's figure for a square plate is about 1.15; from memory, not re-read)." }, cd0 = { value = 0.05, unit = "1", fidelity = "estimated", rationale = "Skin friction of both faces of the plate, 2 x 0.0035 in the 5.8 kPa jet plus the edges: 0.03-0.06." }, jet_factor = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "The plate sits 4 mm under the nozzle exit in a jet that has a hub wake (the 35 mm motor behind the fan) and a boundary layer: its mean dynamic pressure at the plate is below momentum theory's; 0.9 on the speed = 0.81 on q. No measurement exists for this fan." } }

[[devices]]
type = "jet_vane"
name = "vane2"
instance = "vane2"
body = "vane2"
site = "vane2"
site_port = "aero"
rotor = "rotor"
duct = "duct"
map = "vane"
set = { exit_area = { value = 0.0034, unit = "m^2", fidelity = "derived", derivation = "As vane1." }, cn_alpha = { value = 1.9, unit = "1/rad", fidelity = "derived", derivation = "As vane1." }, cn_max = { value = 1.16, unit = "1", fidelity = "estimated", rationale = "As vane1." }, cd0 = { value = 0.05, unit = "1", fidelity = "estimated", rationale = "As vane1." }, jet_factor = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "As vane1." } }

[[devices]]
type = "jet_vane"
name = "vane3"
instance = "vane3"
body = "vane3"
site = "vane3"
site_port = "aero"
rotor = "rotor"
duct = "duct"
map = "vane"
set = { exit_area = { value = 0.0034, unit = "m^2", fidelity = "derived", derivation = "As vane1." }, cn_alpha = { value = 1.9, unit = "1/rad", fidelity = "derived", derivation = "As vane1." }, cn_max = { value = 1.16, unit = "1", fidelity = "estimated", rationale = "As vane1." }, cd0 = { value = 0.05, unit = "1", fidelity = "estimated", rationale = "As vane1." }, jet_factor = { value = 0.9, unit = "1", fidelity = "estimated", rationale = "As vane1." } }

[[devices]]
