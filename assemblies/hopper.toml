# GNSS: a ZED-F9P RTK rover (data-only chip instance) with corrections from a base station: the second pad is 10 m from the first and the landing must be within 0.3 m of it, which the stand-alone GNSS of the
# lander (2.5 m CEP, error drifting by ~1 m over a minute) cannot do. examples/hopper/mc.py has a sensitivity run with the M8N's accuracy to show how much of the result rests on this.
[[devices]]
type = "gnss"
name = "gnss"
instance = "gnss_chip"
site = "fc"
map = "f9p"
set = { rate_hz = { value = 10.0, unit = "Hz", fidelity = "estimated", rationale = "ZED-F9P RTK navigation rate is up to 20 Hz (datasheet); 10 Hz taken (every 100th tick), a usual setting." }, latency_s = { value = 0.1, unit = "s", fidelity = "estimated", rationale = "No part publishes the receiver's output latency; 0.1 s = one sample at 10 Hz." }, lat0 = { value = 47.3769, unit = "deg", fidelity = "estimated", rationale = "Arbitrary simulation origin (the repo's test-model site); not a claim about where the vehicle flies." }, lon0 = { value = 8.5417, unit = "deg", fidelity = "estimated", rationale = "As lat0." }, alt0 = { value = 0.0, unit = "m", fidelity = "estimated", rationale = "World z = 0 at sea level, matching the environment device's origin_alt so the barometer and GNSS agree." }, horiz_std = { value = 0.02, unit = "m", fidelity = "estimated", rationale = "The ZED-F9P RTK accuracy is 0.01 m + 1 ppm CEP (parts/electronics/ublox-zed-f9p, datasheet, static; CEP 0.01 m = per-axis sigma 0.0085 m). 0.02 m (x 2.4) covers antenna motion, multipath and a float / fix mix in flight; the datasheet gives no dynamic figure." }, vert_std = { value = 0.03, unit = "m", fidelity = "estimated", rationale = "1.5 x horiz_std, as assemblies/x500v2.toml (the part publishes no vertical figure)." }, corr_time_s = { value = 20.0, unit = "s", fidelity = "estimated", rationale = "Time constant of the slowly varying part of an RTK position error (atmospheric residual, multipath): tens of seconds; no source." }, corr_frac = { value = 0.5, unit = "1", fidelity = "estimated", rationale = "Share of the position variance that is the Gauss-Markov part: half; no source." } }

[[devices]]
type = "baro"
name = "baro"
instance = "baro_chip"
site = "fc"
map = "ms5611"
set = { rate_hz = { value = 50.0, unit = "Hz", fidelity = "estimated", rationale = "MS5611 pressure + temperature conversions take 8.22 ms each at OSR 4096 (datasheet response time), i.e. at most ~60 Hz alternating; 50 Hz (every 20th tick) is chosen. Noise is the OSR 4096 RMS figure." } }

# Downward single-point lidar: a 1 x 1 pinhole rangefinder of the TF-Luna's 2 degree field. Accuracy: the datasheet gives +-6 cm to 3 m and +-2 % beyond (taken as 2 sigma). Reads 0 outside 0.2 - 8 m (the 90 % reflectivity range).
[[devices]]
type = "rangefinder"
name = "lidar"
instance = "lidar"
site = "lidar"
map = "tfluna"
set = { n_h = { value = 1, unit = "px", fidelity = "estimated", rationale = "Single-point sensor: a 1 x 1 grid." }, n_v = { value = 1, unit = "px", fidelity = "estimated", rationale = "Single-point sensor: a 1 x 1 grid." }, sigma0 = { value = 0.03, unit = "m", fidelity = "derived", derivation = "Datasheet accuracy +-6 cm (S1 of benewake-tf-luna, 0.2-3 m) taken as the 2-sigma bound: sigma 0.03 m." }, sigma1 = { value = 0.01, unit = "1", fidelity = "derived", derivation = "Datasheet accuracy +-2 % beyond 3 m taken as the 2-sigma bound: sigma 1 % of the range." } }
