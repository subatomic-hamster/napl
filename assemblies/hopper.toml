# EDF hopper: a throttleable, thrust-vectored VTVL "Grasshopper in a shoebox", built from cheap open parts. One QX-Motor 80 mm 12-blade ducted fan (QF3538 2000 KV, 6S) on a printed PETG deck,
# a Hobbywing Platinum 120 A ESC, a Tattu 2200 mAh 6S pack, four flat aluminium JET VANES in the exhaust (one per XL330-M288-T servo, 90 degrees apart) for pitch / roll / yaw, a Teensy 4.0 flight
# computer with an ICM-42688-P IMU, an MS5611 barometer, a GNSS module and a downward TF-Luna lidar, four splayed skid legs (the lander's). Flight software: examples/hopper/.
# Unlike the solid-motor TVC lander (assemblies/tvc-lander.toml) the thrust is throttled (the ESC duty), so it can hover, climb, divert and land with the same propellant.
#
# FRAME. Origin on the vehicle axis in the TOP face of the deck, +z up. The exit tube of the duct passes through the deck opening (exit plane 0.030 m under the deck), the fan plane is 0.045 m above the
# deck, the vane hinges 0.100 m under it (vane top edge 0.0505 m under the exit plane: inside the jet's potential core, 0.10 m lever arm to the centre of mass), the feet 0.239 m under it. The battery (+x), the ESC (-x), two regulators (+-y), the flight computer and the sensor sled are on the
# deck; the lidar is on the underside at x = +0.095 m looking down.
# JET VANES. Vane k (k = 1..4: +x, +y, -x, -y) turns about its radial hinge; its normal force is along the tangential direction: vane +x / -x force along y (roll about x with the lever arm below the centre of mass,
# yaw with +-r), vane +y / -y force along x (pitch about y, yaw). The allocation is in examples/hopper/control.py (docstring). The jet_vane device is the plate's force model (schema/devices.fbs).
# ROTOR. The fan is a Rotor device: C_T, C_Q from the QX-Motor throttle table (parts/propulsion/qx-80mm-12-blade-edf-fan), ESC + motor + battery modelled with the kernel's own devices. swirl_recovery 0.8: the stator
# vanes take back that share of the fan's reaction torque (ESTIMATED: without a stator the vanes could not hold yaw).
# NOT MODELLED: jet impingement on the ground (no ground effect for a ducted fan: ground_effect = false), hub-wake deficit of the jet, inlet distortion, thermal limits of the vanes, battery connector voltage drops
# beyond the wire resistances, servo cable data bus (power only, as the lander), the ESC's BEC (unused), the Teensy / lidar supply current (about 0.2 A at 5 V = 0.05 A on the pack).

[assembly]
name = "hopper"
description = "EDF VTVL hopper: 80 mm 12-blade ducted fan on 6S, four aluminium jet vanes on XL330 servos, Teensy 4.0 flight computer, lidar + baro + GNSS + IMU, four skid legs"
base = "free"
timestep = 0.001
seed = 7

