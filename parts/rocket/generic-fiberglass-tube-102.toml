name = "Generic filament-wound fiberglass airframe tube, 4.0 in (101.6 mm) OD, 0.45 m (illustrative, not a product)"
category = "rocket.body-tube"
vendor = "generic"
part_number = "n/a (placeholder for a 4 in fiberglass rocketry tube)"
url = "https://www.rocketreviews.com/"

# NOT a catalogue part: every number is an estimate of a typical 4.0 in high-power rocketry tube (nominal 4.0 in OD is the trade size). 4 in is the
# smallest airframe in which two Dynamixel XL330 servos can drive a gimbal ring around a 29 mm motor directly (servo body span 26 mm + ring + motor).
# Part frame: origin at the aft end on the axis, +z towards the nose. The thin wall is eight flat plates around the axis (an octagonal shell of the
# same wall mass), so the roll and pitch inertia are those of a hollow tube (a solid cylinder of the same mass would be ~2x too low in roll).
[params]
outer_diameter = { value = 0.1016, unit = "m", fidelity = "estimated", rationale = "Trade size 4.0 in = 101.6 mm; real tubes differ by a fraction of a millimetre between makers." }
inner_diameter = { value = 0.0991, unit = "m", fidelity = "derived", derivation = "outer_diameter - 2 x wall_thickness = 0.1016 - 2 x 0.00125 = 0.0991 m." }
wall_thickness = { value = 0.00125, unit = "m", fidelity = "estimated", rationale = "Design choice: ~1.25 mm, the order of a light filament-wound 4 in tube (commercial walls run 1.2-2 mm); not measured." }
length         = { value = 0.45, unit = "m", fidelity = "estimated", rationale = "Design choice: servos and gimbal at the aft end, avionics and battery above." }
mass           = { value = 0.319, unit = "kg", fidelity = "derived", derivation = "Wall volume pi (0.0508^2 - 0.04955^2) x 0.45 m = 1.774e-4 m3 times an assumed 1800 kg/m3 for glass-epoxy laminate = 0.319 kg; the density is a typical figure (E-glass fibre ~2550, epoxy ~1200 at ~50 % volume fraction), not sourced, so the mass is +-30 %: weigh the real tube." }

