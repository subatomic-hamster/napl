url = "https://www.thrustcurve.org/simfiles/5f4294d20002e900000007b0/"
title = "thrustcurve.org: Estes G40 (G40W) RASP simulation file (certification data), the .eng file as downloaded"
accessed = "2026-10-08"
quote = ";ESTES G40W [Relabeled Aerotech] ... G40W 29 124 7 0.0538 0.123 AeroTech 0.024 74.325 0.057 67.005 0.252 65.879 0.500 63.063 0.765 60.248 1.000 54.054 ... 2.121 3.941 2.300 0 (RASP header: name, diameter mm, length mm, delays, propellant kg, loaded kg)"

