symmetry = 1
thickness = 0.004
fidelity = "estimated"
rationale = "Deck top face at the opening; the housing's shoulder rests here (zip ties / two printed straps are not modelled)."

[[ports]]
name = "deck_esc"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [-0.085, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [0.0, 1.0, 0.0]
