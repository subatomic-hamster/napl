id = "hopper-deck-frame-edf80"
name = "EDF hopper deck frame: 0.20 m printed PETG deck with duct hole, four leg arms and four servo brackets (design of this repo)"
category = "rocket.frame"
vendor = "custom (FDM printed)"
part_number = "n/a"
url = "https://www.3dprintergear.com.au/assets/files/technical-data-sheet%20(1).pdf"

# The structure of the EDF hopper (examples/hopper): one printed plate that carries everything. Part frame: origin on the vehicle axis in the TOP face of the deck,
# +z up. A 0.20 m square deck (4 mm thick) with a 75 mm square opening for the exit tube of the EDF (the housing's 41.5 mm shoulder rests on the strips
# around it), four diagonal arms out to the leg hinges at 0.145 m from the axis, and four servo brackets hanging 0.1125 m from the deck underside at 0.0674 m from the axis on the x / y axes
# (3 mm PETG plates 32 mm wide: flimsy for their height, a rib or a carbon strip would be added), one per jet vane. Top face: battery (+x), ESC (-x), two regulators (+y, -y), flight computer, sensor sled. Underside: lidar and the legs.
# The deck and strips are modelled as boxes so that the exit tube and vanes pass through the opening without touching the plastic.

[params]
side        = { value = 0.20, unit = "m", fidelity = "estimated", rationale = "Design choice: the battery (116 x 34 mm) and the ESC (83 x 37 mm) go either side of the 83 mm duct, the regulators and the flight computer in the gaps." }
thickness   = { value = 0.004, unit = "m", fidelity = "estimated", rationale = "Design choice: 4 mm PETG deck, stiff enough for 100 N leg loads at the arm roots when ribbed." }
duct_hole_radius = { value = 0.0375, unit = "m", fidelity = "estimated", rationale = "Design choice: 1.6 mm over the exit tube's outer radius (35.9 mm)." }
volume      = { value = 1.975e-4, unit = "m^3", fidelity = "derived", derivation = "Deck 0.20 x 0.20 m minus the 0.075 x 0.075 m opening = 0.034375 m2 x 4 mm = 1.375e-4 m3; four arms 0.057 x 0.02 x 0.004 m = 1.82e-5 m3; four brackets 0.003 x 0.032 x 0.1085 m = 4.17e-5 m3 (sum 1.975e-4 m3)." }
infill_equivalent = { value = 0.40, unit = "1", fidelity = "estimated", rationale = "Solid-material fraction of an FDM part with 3 perimeters, 20 % gyroid infill and lightening holes (not modelled): 0.35-0.5." }
mass        = { value = 0.100, unit = "kg", fidelity = "derived", derivation = "PETG 1270 kg/m3 (parts/common/petg, S1 of that part) x volume 1.975e-4 m3 x equivalent solid fraction 0.40 = 0.1003 kg." }

