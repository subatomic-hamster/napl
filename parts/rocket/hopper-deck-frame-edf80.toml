# ---- four servo seats (one per jet vane): inner face of each bracket, hub on the vane hinge 0.045 m below the deck top ----
[[ports]]
name = "servo_xp"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [0.0659, 0.0, -0.0925]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 2
thickness = 0.003
fidelity = "estimated"
rationale = "Inner face of the +x bracket (0.0674 - 0.0015 m); the XL330's base centre is 0.0259 m from the horn plane and 7.5 mm off the horn axis along the servo's x: the horn hub lands at r = 0.040 m, z = -0.100 m below the deck top: the vane's top edge is 0.0505 m below the 0.030 m exit tube (about 0.77 exit diameters downstream, inside the free jet's potential core, which is several diameters long), which puts the lever arm to the centre of mass at about 0.10 m instead of 0.04 m: 2.3 times the roll / pitch authority per newton."

