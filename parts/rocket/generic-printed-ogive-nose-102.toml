id = "generic-printed-ogive-nose-102"
name = "3D-printed tangent-ogive nose cone for a 4 in (101.6 mm) tube, 0.30 m long, 1.2 mm PLA shell (design of this repo)"
category = "rocket.nose-cone"
vendor = "custom (FDM printed)"
part_number = "n/a"
url = "https://cdn.shopify.com/s/files/1/1223/5992/files/PLA_4043D_TDS.pdf"

# Part frame: origin on the axis at the base plane (the tube's forward end), +z towards the tip. A design of this repo, not a product: the dimensions
# are choices, the mass is derived from the PLA datasheet density. The collision / mass shape is four stacked solid cylinders following the ogive
# radius at each slice's mid-height (a shell split by solid volume gives the lower slices ~10 % too little mass: negligible for a 90 g part).
[params]
base_diameter  = { value = 0.1016, unit = "m", fidelity = "estimated", rationale = "Design choice: the outside diameter of parts/rocket/generic-fiberglass-tube-102 it caps." }
length         = { value = 0.30, unit = "m", fidelity = "estimated", rationale = "Design choice: fineness ratio 3 (length / base diameter), a common model-rocket nose." }
wall_thickness = { value = 0.0012, unit = "m", fidelity = "estimated", rationale = "Design choice: three perimeters of a 0.4 mm FDM nozzle." }
mass = { value = 0.0918, unit = "kg", fidelity = "derived", derivation = "Tangent ogive radius profile r(x) = sqrt(rho^2 - (L - x)^2) + R - rho, rho = (R^2 + L^2) / (2R), R = 0.0508 m, L = 0.30 m; shell area 2 pi int r ds = 0.06493 m2 (numeric); mass = area x wall 0.0012 m x PLA density 1240 kg/m3 (parts/common/pla, src S1) x printed factor 0.95 (estimated in that part) = 0.0918 kg. The base lip / shoulder is not counted." }

