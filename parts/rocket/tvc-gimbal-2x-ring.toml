# Pitch servo output hub (the servo's output port mates here with a hinge about y).
[[ports]]
name = "pitch_horn_seat"
kind = "mech"
type = "servo-horn.dynamixel-xl330"
gender = "female"
pos = [0.0, 0.039, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
thickness = 0.003
fidelity = "estimated"
rationale = "Ring's +y outer surface on the pitch axis; the horn thickness is the XL330 hub's 3 mm (parts/arm/robotis-xl330-m077-t)."

# Yaw servo base seat on the +x arm.
[[ports]]
name = "yaw_servo_seat"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [0.0649, 0.0, 0.0075]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 2
thickness = 0.0027
fidelity = "estimated"
rationale = "Inner face of the +x servo arm (0.0649 m = hub plane 0.039 + 0.0259 servo height), centred 7.5 mm along z so that the servo's output hub lands on the yaw axis."

