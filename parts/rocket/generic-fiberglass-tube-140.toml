id = "generic-fiberglass-tube-140"
name = "Generic filament-wound fiberglass airframe tube, 5.5 in (139.7 mm) OD, 0.40 m, 1.0 mm wall (illustrative, not a product)"
category = "rocket.body-tube"
vendor = "generic"
part_number = "n/a (placeholder for a 5.5 in fiberglass rocketry tube)"
url = "https://www.rocketreviews.com/"

# NOT a catalogue part: every number is an estimate of a typical 5.5 in high-power rocketry tube (nominal 5.5 in OD is the trade size). 5.5 in is the smallest
# trade size in which two 29 mm motors side by side plus two direct-drive Dynamixel XL330 gimbal servos fit (cradle 0.065 m + ring + servo bodies span 0.130 m).
# Part frame: origin at the aft end on the axis, +z towards the nose. The thin wall is eight flat plates around the axis (an octagonal shell of the same wall
# mass) so that roll and pitch inertia are those of a hollow tube. Used by assemblies/tvc-lander.toml.
[params]
outer_diameter = { value = 0.1397, unit = "m", fidelity = "estimated", rationale = "Trade size 5.5 in = 139.7 mm; real tubes differ by a fraction of a millimetre between makers." }
inner_diameter = { value = 0.1377, unit = "m", fidelity = "derived", derivation = "outer_diameter - 2 x wall_thickness = 0.1397 - 2 x 0.001 = 0.1377 m." }
wall_thickness = { value = 0.001, unit = "m", fidelity = "estimated", rationale = "Design choice: 1.0 mm, a light filament-wound wall (commercial 5.5 in tubes run 1.0-2.0 mm); not measured." }
length         = { value = 0.40, unit = "m", fidelity = "estimated", rationale = "Design choice: gimbal at the aft end, avionics sled and battery above, legs at 0.10 m." }
mass           = { value = 0.3138, unit = "kg", fidelity = "derived", derivation = "Wall volume pi (0.06985^2 - 0.06885^2) x 0.40 m = 1.743e-4 m3 times an assumed 1800 kg/m3 for glass-epoxy laminate = 0.3138 kg; the density is a typical figure (E-glass fibre ~2550, epoxy ~1200 at ~50 % volume fraction), not sourced, so the mass is +-30 %: weigh the real tube." }

