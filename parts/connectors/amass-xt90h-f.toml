id = "amass-xt90h-f"
name = "Amass XT90H-F connector (XT90 family, female, wire-solder)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "XT90H-F"
url = "https://www.electrokit.com/en/stromkontakt-2-pol-xt90-40a-hona"

# Plain (non anti-spark) XT90 female; the electrokit title reads '45(90)A'. Mass is not given on the page. Contact resistance is the page value
# (0.3 mOhm), well below the 1.2 mOhm maximum on the Amass pages of the same family (amass-xt90s-f, amass-xt90h-m): typical vs maximum.
[params]
current_rated       = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 500, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance  = { value = 0.0003, unit = "ohm", src = "S1", fidelity = "datasheet" }
current_burst_family = { value = 90, unit = "A", src = "S2", fidelity = "datasheet" }

[[ports]]
name = "female"
pins = ["MATE.1", "MATE.2"]
kind = "power"
type = "xt90"
gender = "female"
v_max = { value = 500, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst = { value = 90, unit = "A", src = "S2", fidelity = "datasheet" }
role = "passthrough"
note = "45 A max current (page), 90 A burst (Holybro XT90 table)"

[[ports]]
name = "wire"
pins = ["WIRE.1", "WIRE.2"]
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Solder cup, 10 AWG class"

# Pin level (estimated): 2-pole connector; contacts numbered 1..2 in a line, solder cup n belongs to mating contact n.
[[connectors]]
id = "MATE"
name = "mating contacts (2-pole)"
type = "xt90"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.010
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the title (XT90 power connector 2-pin); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, cable side opposite."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

[[connectors]]
id = "WIRE"
name = "solder cups (2)"
type = "wire-lead"
gender = "neutral"
pos = [0.0, 0.0, -0.02]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.010
src = "S1"
fidelity = "estimated"
rationale = "One solder cup per contact; cup n joins contact n. Spacing follows the mating contacts (not published)."
pose_rationale = "Cable side of the body at z = -20 mm (positional estimate)."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

