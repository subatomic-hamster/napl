# Generic hobby part, no manufacturer datasheet. Vetco gives only a burst-type rating (120 A, short bursts). A continuous rating is not published for the
# 5.5 mm size: i_max is ESTIMATED as the 4 mm figure (70 A, Oscar Liang rule, see bullet-4mm-gold), a lower bound because a 5.5 mm pin has a larger
# contact area. No mass or contact resistance published.
