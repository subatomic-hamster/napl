# Generic hobby part, no manufacturer datasheet. i_max is the conservative Oscar Liang figure (4 mm up to 70 A); Flying Tech lists 'rated up to 80amps',
# kept as i_burst-class vendor maximum. No mass or contact resistance published.
[params]
current_rated       = { value = 70, unit = "A", src = "S2", fidelity = "literature" }
