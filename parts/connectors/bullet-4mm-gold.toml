i_burst = { value = 80, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Pin 4 mm. 70 A: Oscar Liang rule of thumb; 80 A: vendor 'rated up to'."

[[ports]]
