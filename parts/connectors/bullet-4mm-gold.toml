name = "male bullet pin"
type = "bullet.4"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 1
src = "S1"
fidelity = "derived"
derivation = "A bullet connector pair is one single-conductor contact per half (S1 lists a pin diameter, not a pin count); no other pins exist."
pose_rationale = "Mating face at the origin (the part has no geometry)."
pins = [
  { number = 1, name = "1", kind = "power" },
]

