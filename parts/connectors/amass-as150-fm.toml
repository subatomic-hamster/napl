id = "amass-as150-fm"
name = "Amass AS150 anti-spark connector pair (AS150-F / AS150-M)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "AS150-F/M"
url = "https://www.china-amass.net/as150-f-product/"

# The AS150 has a built-in anti-spark pin. Amass page: 65 A on 8 AWG at <= 85 K rise; Holybro's table (S2) says 75 A continuous (4 h, < 60 K) /
# 150 A burst (1 min) for AS150 on 8 AWG: i_max uses the lower Amass value, the Holybro figures are kept as params. No mass published.
[params]
current_rated       = { value = 65, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 150, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0008, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }
recommended_wire    = { value = "8 AWG", unit = "text", src = "S1", fidelity = "datasheet" }
current_cont_holybro = { value = 75, unit = "A", src = "S2", fidelity = "datasheet" }
current_burst_holybro = { value = 150, unit = "A", src = "S2", fidelity = "datasheet" }

[[ports]]
name = "male"
kind = "power"
type = "as150"
gender = "male"
v_max = { value = 150, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 65, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst = { value = 150, unit = "A", src = "S2", fidelity = "datasheet" }
role = "passthrough"
note = "AS150-M half; 65 A on 8 AWG (85 K rise). 150 A burst (1 min) from the Holybro table."

