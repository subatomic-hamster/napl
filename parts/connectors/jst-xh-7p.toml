id = "jst-xh-7p"
name = "JST XH 2.5 mm wire-to-board connector, 7 positions (6S LiPo balance lead)"
category = "connector"
vendor = "JST"
part_number = "XHP-7 housing / B7B-XH-A header (series ratings)"
url = "https://www.jst-mfg.com/product/pdf/eng/eXH.pdf"

# Series datasheet: ratings apply to every XH position count (see jst-xh-3p). A 6S LiPo balance lead is XH with n = cells + 1 = 7 pins.
# No mass in the datasheet text.
[params]
pitch               = { value = 2.5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
current_rated       = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 250, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_initial_max = { value = 0.010, unit = "ohm", src = "S1", fidelity = "datasheet" }
contact_resistance_after_test_max = { value = 0.020, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 1e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 248.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 358.15, unit = "K", src = "S1", fidelity = "datasheet" }
wire_awg_min        = { value = 30, unit = "AWG", src = "S1", fidelity = "datasheet" }
wire_awg_max        = { value = 22, unit = "AWG", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "housing"
kind = "power"
type = "jst-xh.7"
gender = "female"
v_max = { value = 250, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Cable-side crimp housing; the 3 A rating is for AWG #22 wire"

[[ports]]
