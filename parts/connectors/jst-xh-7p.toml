kind = "power"
type = "jst-xh.7"
gender = "male"
v_max = { value = 250, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"

[[sources]]
id = "S1"
url = "https://www.jst-mfg.com/product/pdf/eng/eXH.pdf"
title = "XH CONNECTOR 2.5 mm pitch Wire-to-Board connectors (JST datasheet)"
accessed = "2026-10-07"
quote = "Current rating: 3 A AC/DC (AWG #22) • Voltage rating: 250 V AC/DC • Temperature range: -25°C to +85°C (including temperature rise in applying electrical current) • Contact resistance: Initial value/ 10 mΩ max. After environmental tests/ 20 mΩ max. • Insulation resistance: 1,000 MΩ min. • Applicable wire range: Conductor size/ AWG #30 to AWG #22"
