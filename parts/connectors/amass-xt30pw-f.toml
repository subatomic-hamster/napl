ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the family (XT30, 2-pole); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, board side opposite."
