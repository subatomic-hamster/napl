# Amass lists several XT30 variants (XT30PW/XT30UPB/XT30APW) with different ratings; only the APW-M page was
# fetched, so only its ratings are recorded. Retail listings of XT30PW-M quote 15 A / 30 A peak instead.
[params]
current_rated       = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 0.0007
unit = "kg"
fidelity = "estimated"
rationale = "Amass publishes no mass on the XT30APW-M page (fetched 2026-10-07: electrical and mechanical SPEC table has no weight). The only figure found is a retailer listing of 'Original AMASS XT30' wire-solder connectors (vetco.net VUPN645, S2): 0.7 g male. That is the XT30 plug/receptacle family, not the exact APW-M variant (a right-angle PCB-style part), so it is tagged estimated; XT30 connectors are all about 1 g."

[params.mass_tol]
value = 0.0003
unit = "kg"
fidelity = "estimated"
rationale = "0.3 g (~+-40 %): the retailer figure is for a different XT30 variant, and the listing's own numbers do not add up exactly (0.7 g male + 0.9 g female against '1.7g (complete set)')."

