id = "amass-xt30uw-f"
name = "Amass XT30UW-F connector (XT30 family, female, wire-solder, low-cycle)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "XT30UW-F"
url = "https://www.china-amass.net/xt30uw-f-product/"

# The page states a plug life of only 30 times (vs 100 for the XT30U-F). No mass published.
[params]
current_rated       = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 30, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }
recommended_wire    = { value = "16 AWG", unit = "text", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 0.0009
unit = "kg"
fidelity = "estimated"
rationale = "Amass publishes no mass. Retailer listing of 'Original AMASS XT30' connectors (vetco.net VUPN645, S2): 0.9 g female (same figure used for amass-xt30u-f). XT30 family housing; XT30UW variant assumed equal. Estimated because a retailer figure is not an Amass datasheet value."

[params.mass_tol]
value = 0.0003
unit = "kg"
fidelity = "estimated"
rationale = "0.3 g (~+-35 %): retailer figure for a sibling variant."

[[ports]]
name = "female"
pins = ["MATE.1", "MATE.2"]
kind = "power"
type = "xt30"
gender = "female"
v_max = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "20 A on 16 AWG at a temperature rise <= 85 K"

[[ports]]
name = "wire"
pins = ["WIRE.1", "WIRE.2"]
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Solder cup, 16 AWG"

[[sources]]
id = "S2"
url = "https://vetco.net/products/vupn645_xt30_connector_male-female_pair"
title = "XT30 connector male/female pair, 'Original AMASS XT30 design' (Vetco retailer listing VUPN645)"
accessed = "2026-10-07"
quote = "Weight: | 0.7g (male), 0.9g (female), 1.7g (complete set)"

# Pin level (estimated): 2-pole connector; contacts numbered 1..2 in a line, solder cup n belongs to mating contact n.
[[connectors]]
id = "MATE"
name = "mating contacts (2-pole)"
type = "xt30"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the family (XT30, 2-pole); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, cable side opposite."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

[[connectors]]
id = "WIRE"
name = "solder cups (2)"
type = "wire-lead"
gender = "neutral"
pos = [0.0, 0.0, -0.02]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "One solder cup per contact; cup n joins contact n. Spacing follows the mating contacts (not published)."
pose_rationale = "Cable side of the body at z = -20 mm (positional estimate)."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

