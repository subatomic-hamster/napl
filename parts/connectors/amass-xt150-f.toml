id = "amass-xt150-f"
name = "Amass XT150-F connector (XT150 family, female, wire-solder)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "XT150-F"
url = "https://www.china-amass.net/xt150-f-2-product/"

# The page gives two ratings for 8 AWG: 57 A at a 30 K temperature rise and 75 A at 55 K. i_max uses the 57 A (smaller rise), 75 A is kept as a param.
# No mass published.
[params]
current_rated       = { value = 57, unit = "A", src = "S1", fidelity = "datasheet" }
current_rated_55k_rise = { value = 75, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 150, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }
recommended_wire    = { value = "8 AWG", unit = "text", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "female"
pins = ["MATE.1", "MATE.2"]
kind = "power"
type = "xt150"
gender = "female"
v_max = { value = 150, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 57, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "57 A on 8 AWG at a temperature rise <= 30 K (75 A at <= 55 K)"

[[ports]]
name = "wire"
pins = ["WIRE.1", "WIRE.2"]
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 57, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Solder cup, 8 AWG"

# Pin level (estimated): 2-pole connector; contacts numbered 1..2 in a line, solder cup n belongs to mating contact n.
[[connectors]]
id = "MATE"
name = "mating contacts (2-pole)"
type = "xt150"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.012
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the family (XT150, 2-pole); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, cable side opposite."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

[[connectors]]
id = "WIRE"
name = "solder cups (2)"
type = "wire-lead"
gender = "neutral"
pos = [0.0, 0.0, -0.02]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.012
src = "S1"
fidelity = "estimated"
rationale = "One solder cup per contact; cup n joins contact n. Spacing follows the mating contacts (not published)."
pose_rationale = "Cable side of the body at z = -20 mm (positional estimate)."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

