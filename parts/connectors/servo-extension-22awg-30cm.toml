id = "servo-extension-22awg-30cm"
name = "Servo extension cable 30 cm, 3 x 22 AWG (60-strand), male Futaba J to female JR"
category = "wire"
vendor = "Kitronik"
part_number = "4157"
url = "https://kitronik.co.uk/products/4157-30cm-male-to-female-servo-extension-cable"

# 3-conductor servo lead (signal / +V / GND), 0.1 in (2.54 mm) connector spacing. Kitronik publishes gauge, strand count and length only: no mass, no
# current rating, no voltage rating. The per-conductor ampacity is taken from the 22 AWG table value (parts/connectors/awg-22-silicone-wire.toml, Wikipedia
# AWG table 60 C column: 3 A) as a conservative literature figure; it is not a Kitronik rating.

[params]
awg             = { value = 22, unit = "AWG", src = "S1", fidelity = "datasheet" }
conductors      = { value = 3, unit = "1", src = "S1", fidelity = "datasheet" }
strands_per_conductor = { value = 60, unit = "1", src = "S1", fidelity = "datasheet" }
length          = { value = 0.30, unit = "m", src = "S1", fidelity = "datasheet" }
pitch           = { value = 2.54e-3, unit = "m", src = "S1", fidelity = "datasheet" }        # "0.1 inch spacing"
resistance_per_m = { value = 0.05296, unit = "ohm/m", src = "S2", fidelity = "literature" }   # 22 AWG solid copper, per conductor
ampacity_per_conductor = { value = 3, unit = "A", src = "S2", fidelity = "literature" }       # Wikipedia 60 C column for 22 AWG
resistance_loop = { value = 0.0318, unit = "ohm", fidelity = "derived", derivation = "Supply + return conductor, 2 x 0.30 m x 0.05296 ohm/m (S2) = 0.0318 ohm; stranded 60-strand wire is a few percent higher." }

[[ports]]
name = "plug"
pins = ["PLUG.1", "PLUG.2", "PLUG.3"]
kind = "power"
type = "servo-3pin"
gender = "male"
i_max = { value = 3, unit = "A", src = "S2", fidelity = "literature" }
role = "passthrough"
note = "Male Futaba J connector end (S1); power and signal share the 3-pin connector"

[[ports]]
name = "socket"
pins = ["SOCK.1", "SOCK.2", "SOCK.3"]
kind = "power"
type = "servo-3pin"
gender = "female"
i_max = { value = 3, unit = "A", src = "S2", fidelity = "literature" }
role = "passthrough"
note = "Female JR connector end (S1)"

# Pin level: straight-through 3-wire extension, pin n to pin n (an extension cable maps pins 1:1 by construction). Kitronik does not state the pin order;
# GND / V+ / signal in positions 1 / 2 / 3 is the order of the Hitec/JR servo leads in this library, so the pin names are estimated.
[[connectors]]
id = "PLUG"
name = "male Futaba J plug (3-pin, 0.1 in)"
type = "servo-lead-3"
port_type = "servo-3pin"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S1"
fidelity = "estimated"
rationale = "S1 states connector type, count and 0.1 in spacing but not which conductor is ground, supply or signal; order GND, V+, SIGNAL assumed from the servo leads in this library."
pose_rationale = "A cable has no geometry; the wire router places the ends on the mated connectors."
pins = [
  { number = 1, name = "GND", kind = "ground", i_max = 3.0 },
  { number = 2, name = "V+", kind = "power", dir = "io", i_max = 3.0 },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "io" },
]

[[connectors]]
id = "SOCK"
name = "female JR socket (3-pin, 0.1 in)"
type = "servo-lead-3"
port_type = "servo-3pin"
gender = "female"
pos = [0.30, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S1"
fidelity = "estimated"
rationale = "As PLUG: pin order assumed, mapped straight through."
pose_rationale = "As PLUG."
pins = [
  { number = 1, name = "GND", kind = "ground", i_max = 3.0 },
  { number = 2, name = "V+", kind = "power", dir = "io", i_max = 3.0 },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "io" },
]

