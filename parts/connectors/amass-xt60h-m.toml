# Ratings are the Amass product-page values (35 A at 12 AWG, 85 K rise), higher than the 30 A of the XT60 datasheet used in amass-xt60 and than
# the Holybro 30 A figure: both are vendor statements; the DRC takes i_max of the port, so pick the part whose source you trust. No mass published.
[params]
current_rated       = { value = 35, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }
recommended_wire    = { value = "12 AWG", unit = "text", src = "S1", fidelity = "datasheet" }

