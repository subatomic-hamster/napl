# Panel-mount male XT90 (flange); mounting pattern not recorded. Mass not given on the page.
[params]
current_rated       = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 500, unit = "V", src = "S1", fidelity = "datasheet" }
