url = "https://www.robotshop.com/products/ak-v30-replacement-cable-for-cubemars-motors"

# Per-actuator lead of the dog: mates the XT30PW(2+2)-M on a CubeMars / SteadyWin-class QDD. The retail set also carries the 3-pin UART lead; only the power + CAN lead is modelled (pins as in the CubeMars AK54 V3 driver manual, same connector P/N).
# Length is not stated in the retrieved text: 0.30 m is an estimate for the daisy-chain hop between two joints of one leg (the leg builder overrides it with the routed length).

[params]
length  = { value = 0.30, unit = "m", fidelity = "estimated", rationale = "Not retrieved (the set is sold in fixed lengths; the page text found says nothing). 0.30 m is the typical hop between adjacent joints of a 0.22 m leg." }
awg_power = { value = 18, unit = "AWG", src = "S2", fidelity = "literature" }  # reseller note for the XT30(2+2)-F: 18 AWG power, 24 AWG signal
awg_signal = { value = 24, unit = "AWG", src = "S2", fidelity = "literature" }
mass_per_m = { value = 0.025, unit = "kg/m", fidelity = "estimated", rationale = "4 conductors (2 x 18 AWG ~ 6 g/m each with insulation, 2 x 24 AWG ~ 2 g/m each, jacket) ~ 25 g/m; two connectors add ~3 g each (not included)." }
resistance_per_m = { value = 0.02095, unit = "ohm/m", fidelity = "derived", derivation = "Per power conductor: 18 AWG (awg_power, reseller note) copper at 20 degC = 20.95 mOhm/m, the value of parts/drone/awg-18-silicone-wire.toml. The 24 AWG signal pair is not used for the supply drop." }

