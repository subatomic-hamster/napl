# Ratings are the Amass product-page values (35 A at 12 AWG, 85 K rise); see amass-xt60h-m for the difference to the 30 A figures. No mass published.
[params]
current_rated       = { value = 35, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
