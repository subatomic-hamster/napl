note = "Solder cup, 12 AWG"

# Pin level (estimated): 2-pole connector; contacts numbered 1..2 in a line, solder cup n belongs to mating contact n.
[[connectors]]
id = "MATE"
name = "mating contacts (2-pole)"
type = "xt60"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the family (XT60, 2-pole); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, cable side opposite."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

[[connectors]]
id = "WIRE"
name = "solder cups (2)"
type = "wire-lead"
gender = "neutral"
pos = [0.0, 0.0, -0.02]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "One solder cup per contact; cup n joins contact n. Spacing follows the mating contacts (not published)."
pose_rationale = "Cable side of the body at z = -20 mm (positional estimate)."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

