id = "wurth-wr-phd-socket-header-3p"
name = "Wurth WR-PHD 2.54 mm socket header, 3 positions (servo/Dupont female socket)"
category = "connector"
vendor = "Wurth Elektronik"
part_number = "61300311821"
url = "https://www.we-online.com/components/products/datasheet/61300311821.pdf"

# Mates with the 3-pin header wurth-wr-phd-pin-header-3p (same 2.54 mm pitch); modelled with port type servo-3pin.
# Wurth does not state a part mass in the datasheet.
[params]
pitch               = { value = 2.54e-3, unit = "m", src = "S1", fidelity = "datasheet" }
current_rated       = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_working     = { value = 250, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.020, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 30, unit = "1", src = "S1", fidelity = "datasheet" }
length              = { value = 8.12e-3, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "socket"
pins = ["SOCK.1", "SOCK.2", "SOCK.3"]
kind = "power"
type = "servo-3pin"
gender = "female"
v_max = { value = 250, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"

# Pin level (derived): 3 sockets in one row at the S1 pitch; function of each socket is set by the board or servo lead it is used with.
[[connectors]]
id = "SOCK"
name = "socket header (3 positions)"
type = "servo-3pin"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S1"
fidelity = "derived"
derivation = "Position count is the part designation (3-position socket); pitch is the S1 value (2.54 mm); numbering 1..3 along the row is assumed."
pose_rationale = "A catalogue part has no board frame: mating face at the origin."
pins = [
  { number = 1, name = "1", kind = "power" }, { number = 2, name = "2", kind = "power" }, { number = 3, name = "3", kind = "power" },
]

