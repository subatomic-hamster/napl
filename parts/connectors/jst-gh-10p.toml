id = "jst-gh-10p"
name = "JST GH 1.25 mm wire-to-board connector, 10 positions (Pixhawk GPS1 port)"
category = "connector"
vendor = "JST"
part_number = "GHR-10V-S housing / SM10B-GHS-TB header (series ratings)"
url = "https://www.jst-mfg.com/product/pdf/eng/eGH.pdf"

# Same series datasheet as jst-gh-6p: the ratings apply to every GH position count; jst-gh.<n> is the port family name. Needed by
# holybro-m8n-gps / holybro-pixhawk-6c (GPS1 is a 10-pin GH port per the Holybro ports page, see those parts). The SM10B-GHS-TB header
# part number is the series naming pattern and was not separately checked.
[params]
pitch               = { value = 1.25e-3, unit = "m", src = "S1", fidelity = "datasheet" }
current_rated       = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 50, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_initial_max = { value = 0.030, unit = "ohm", src = "S1", fidelity = "datasheet" }
contact_resistance_after_test_max = { value = 0.050, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 1e8, unit = "ohm", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 233.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 378.15, unit = "K", src = "S1", fidelity = "datasheet" }
wire_awg_min        = { value = 30, unit = "AWG", src = "S1", fidelity = "datasheet" }
wire_awg_max        = { value = 26, unit = "AWG", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 0.00022
unit = "kg"
fidelity = "estimated"
rationale = "JST publishes no mass. Cable-side plug = housing GHR-10V-S + 10 crimp contacts SSHL-002T-P0.2. Same method as jst-gh-6p: housing envelope 13.75 (B, 'GHR-10V-S 11.25 13.75') x 4.15 x 5.7 mm = 325 mm3, assumed ~35 % solid PA (1140 kg/m3) = 0.13 g, plus ten contacts of about 9 mg (assumed size) = 0.09 g: 0.22 g. Solid fraction and contact size are assumptions."

[params.mass_tol]
value = 0.00015
unit = "kg"
fidelity = "estimated"
rationale = "+-0.15 g (about +-65 %): the solid fraction of the housing and the contact volume are assumptions; negligible against the airframe budget."

[[ports]]
name = "housing"
pins = ["HOUSING.1", "HOUSING.2", "HOUSING.3", "HOUSING.4", "HOUSING.5", "HOUSING.6", "HOUSING.7", "HOUSING.8", "HOUSING.9", "HOUSING.10"]
kind = "signal"
type = "jst-gh.10"
gender = "female"
note = "Cable-side crimp housing, 10 circuits. Signal kind: the Pixhawk GPS1 / M8N cable carries UART, I2C, safety switch and the 5 V supply on one GH-10 plug (Holybro ports page, see holybro-pixhawk-6c); the ratings are the series 1.0 A per contact (AWG #26)."

[[ports]]
name = "header"
pins = ["HEADER.1", "HEADER.2", "HEADER.3", "HEADER.4", "HEADER.5", "HEADER.6", "HEADER.7", "HEADER.8", "HEADER.9", "HEADER.10"]
kind = "signal"
type = "jst-gh.10"
gender = "male"
note = "Board-side header, 10 circuits."

# Pin level (derived): 10 circuits in one row, numbered 1..10; the function of each contact is defined by the board that uses it, not by the connector.
[[connectors]]
id = "HOUSING"
name = "cable-side crimp housing (10 circuits)"
type = "jst-gh.10"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.00125
src = "S1"
fidelity = "derived"
derivation = "Contact count is the part designation (10 positions); pitch is the S1 series value (1.25 mm); numbering 1..10 along the row is assumed."
pose_rationale = "A catalogue connector has no board frame: mating face at the origin."
pins = [
  { number = 1, name = "1", kind = "signal" }, { number = 2, name = "2", kind = "signal" }, { number = 3, name = "3", kind = "signal" },
  { number = 4, name = "4", kind = "signal" }, { number = 5, name = "5", kind = "signal" }, { number = 6, name = "6", kind = "signal" },
  { number = 7, name = "7", kind = "signal" }, { number = 8, name = "8", kind = "signal" }, { number = 9, name = "9", kind = "signal" },
  { number = 10, name = "10", kind = "signal" },
]

[[connectors]]
id = "HEADER"
name = "board-side header (10 circuits)"
type = "jst-gh.10"
gender = "male"
pos = [0.03, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.00125
src = "S1"
fidelity = "derived"
derivation = "As HOUSING."
pose_rationale = "Placed 30 mm to the side of the housing so the halves do not overlap."
pins = [
  { number = 1, name = "1", kind = "signal" }, { number = 2, name = "2", kind = "signal" }, { number = 3, name = "3", kind = "signal" },
  { number = 4, name = "4", kind = "signal" }, { number = 5, name = "5", kind = "signal" }, { number = 6, name = "6", kind = "signal" },
  { number = 7, name = "7", kind = "signal" }, { number = 8, name = "8", kind = "signal" }, { number = 9, name = "9", kind = "signal" },
  { number = 10, name = "10", kind = "signal" },
]

[[sources]]
id = "S1"
url = "https://www.jst-mfg.com/product/pdf/eng/eGH.pdf"
title = "GH CONNECTOR 1.25 mm pitch Wire-to-Board connectors (JST datasheet)"
accessed = "2026-10-07"
quote = "Current rating: 1.0 A AC/DC（AWG #26） Voltage rating: 50 V AC/DC Temperature range: ‑40 ℃ to +105 ℃ (including temperature rise in applying electrical current) Contact resistance: Initial value/ 30 mΩ max. After test/ 50 mΩ max. Insulation resistance: 100 MΩ min. ... Conductor size/ AWG #30 to AWG #26 ... 10 GHR-10V-S 11.25 13.75 3,500"
