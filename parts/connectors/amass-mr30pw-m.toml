id = "amass-mr30pw-m"
name = "Amass MR30PW-M 3-pole connector (male, 3 x 20 A)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "MR30PW-M30"
url = "https://www.china-amass.net/mr30pw-m-product/"

# MR30 carries three phases (e.g. brushless motor leads); the rating is per contact.
[params]
current_rated       = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "male"
pins = ["MATE.1", "MATE.2", "MATE.3"]
kind = "power"
type = "mr30"
gender = "male"
v_max = { value = 80, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 20, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "20 A per contact at a temperature rise <= 85 K"

# Pin level (estimated): 3-pole connector; contacts numbered 1..3 in a line.
[[connectors]]
id = "MATE"
name = "mating contacts (3-pole)"
type = "mr30"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.004
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the part title (3-pole); S1 gives no contact numbering or pole spacing, so the contacts are numbered 1..3 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
  { number = 3, name = "3", kind = "power" },
]

