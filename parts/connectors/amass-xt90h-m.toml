id = "amass-xt90h-m"
name = "Amass XT90H-M connector (XT90 family, male, wire-solder)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "XT90H-M"
url = "https://www.china-amass.net/xt90h-m-product/"

# Plain XT90 (no anti-spark resistor, unlike amass-xt90s-f). Burst 90 A on 10 AWG is the XT90 family figure of the Holybro connector table
# already used in amass-xt90s-f (1 min, < 60 K rise); the Amass product page itself states only the continuous 45 A. No mass published.
[params]
current_rated       = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
voltage_rated       = { value = 1500, unit = "V", src = "S1", fidelity = "datasheet" }
contact_resistance_max = { value = 0.0012, unit = "ohm", src = "S1", fidelity = "datasheet" }
insulation_resistance_min = { value = 2e9, unit = "ohm", src = "S1", fidelity = "datasheet" }
mating_cycles       = { value = 100, unit = "1", src = "S1", fidelity = "datasheet" }
temp_min            = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
temp_max            = { value = 393.15, unit = "K", src = "S1", fidelity = "datasheet" }
recommended_wire    = { value = "10 AWG", unit = "text", src = "S1", fidelity = "datasheet" }
current_burst_family = { value = 90, unit = "A", src = "S2", fidelity = "datasheet" }

[[ports]]
name = "male"
pins = ["MATE.1", "MATE.2"]
kind = "power"
type = "xt90"
gender = "male"
v_max = { value = 1500, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst = { value = 90, unit = "A", src = "S2", fidelity = "datasheet" }
role = "passthrough"
note = "45 A on 10 AWG at a temperature rise <= 85 K; 90 A burst is the Holybro table figure for the XT90 family"

[[ports]]
name = "wire"
pins = ["WIRE.1", "WIRE.2"]
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 45, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Solder cup, 10 AWG"

# Pin level (estimated): 2-pole connector; contacts numbered 1..2 in a line, solder cup n belongs to mating contact n.
[[connectors]]
id = "MATE"
name = "mating contacts (2-pole)"
type = "xt90"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.010
src = "S1"
fidelity = "estimated"
rationale = "Pole count is the family (XT90, 2-pole); S1 gives no contact numbering, polarity marking or pole spacing, so the contacts are numbered 1..2 and the spacing is a typical value for the family."
pose_rationale = "Connector body geometry is not in S1: contacts on the mating face at the origin, cable side opposite."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

[[connectors]]
id = "WIRE"
name = "solder cups (2)"
type = "wire-lead"
gender = "neutral"
pos = [0.0, 0.0, -0.02]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.010
src = "S1"
fidelity = "estimated"
rationale = "One solder cup per contact; cup n joins contact n. Spacing follows the mating contacts (not published)."
pose_rationale = "Cable side of the body at z = -20 mm (positional estimate)."
pins = [
  { number = 1, name = "1", kind = "power" },
  { number = 2, name = "2", kind = "power" },
]

