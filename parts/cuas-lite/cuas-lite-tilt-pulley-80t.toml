id = "cuas-lite-tilt-pulley-80t"
name = "cuas-lite tilt_pulley_80t (3D printed PETG, group tilt)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "tilt_pulley_80t"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (12.38 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (head frame H for the tilt group): the part frame IS that frame.
# The 80T GT2 pulley is printed (the 102-tooth, 204 mm closed belt wraps it and the 20T motor pulley).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
