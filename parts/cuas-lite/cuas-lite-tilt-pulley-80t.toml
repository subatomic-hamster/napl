nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/tilt_pulley_80t.stl"
material = "petg"
bbox_min = [-0.0266838, 0.0765, -0.0266838]
bbox_max = [0.0266838, 0.0915, 0.0266838]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
