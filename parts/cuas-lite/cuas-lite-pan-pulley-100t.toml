id = "cuas-lite-pan-pulley-100t"
name = "cuas-lite pan_pulley_100t (3D printed PETG, group pan)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "pan_pulley_100t"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (24.49 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (B static/pan, head frame H tilt): the part frame IS that frame.
# The 100T GT2 pulley is printed (the 126-tooth, 252 mm closed belt wraps it and the 20T motor pulley).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/pan_pulley_100t.stl"
material = "petg"
bbox_min = [-0.03305, -0.03305, 0.0015]
bbox_max = [0.03305, 0.03305, 0.027]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port: the rotor plate's seat port mates here."
