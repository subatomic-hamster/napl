id = "cuas-lite-pusher-arm"
name = "cuas-lite pusher_arm (3D printed PETG, group tilt)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "pusher_arm"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (1.3 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (head frame H for the tilt group): the part frame IS that frame.
# Placed at the stroke middle (the CAD's lever zero); the servo's rotation is not modelled.

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/pusher_arm.stl"
material = "petg"
bbox_min = [-0.0749977, -0.0254948, -0.0566]
bbox_max = [-0.0600023, 0.0154253, -0.0536]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port: the chassis's seat port mates here."
