id = "cuas-lite-pan-rotor-plate"
name = "cuas-lite pan_rotor_plate (3D printed PETG, group pan, root of the pan group)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "pan_rotor_plate"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (121.74 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame B (the part frame IS frame B at pan = 0).
# Root of the pan group: every other part that turns with the pan axis (and every bought part of that group) is seated on it by a `seat_*` port. A seat port's pose is the child's part-frame pose in
# frame B (cad/cuas-lite manifest.json `interface`: frames, mounts, instances); mating the child's `origin` port (axis -z, ref x) reproduces that pose exactly (T_b = T_a P_a Rx(pi) P_b^-1 with P_b = Rx(pi)).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/pan_rotor_plate.stl"
