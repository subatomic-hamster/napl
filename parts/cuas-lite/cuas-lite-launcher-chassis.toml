id = "cuas-lite-launcher-chassis"
name = "cuas-lite launcher_chassis (3D printed PETG, group tilt, root of the tilt group)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "launcher_chassis"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (184.08 g, supports: minor). The mesh is the CAD's napl mesh (m), already in the head frame H: origin on the tilt axis (frame B (0, 0, 202 mm)), x along the barrel,
# y left, z up at tilt = 0. The part frame IS H.
# `hinge` is the b-side of the tilt joint (axis -y = manifest interface.frames.tilt_joint axis_H; the mate with yoke_left.tilt_axis carries reverse = true: positive tilt raises the muzzle).
# Every other part that tilts (and every bought part of the head) is seated on this chassis by a `seat_*` port. A seat port's pose is the child's part-frame pose in H (manifest `interface`: frames, mounts,
# barrel, flywheels, camera); mating the child's `origin` port (axis -z, ref x) reproduces it exactly. The hopper, hopper_lid and feed_elbow are PAN-group parts since CAD 987985b (seats on the rotor plate); the tilt group carries the
# trunnion_beam (hollow 35 mm tube through the right cheek) instead.

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/launcher_chassis.stl"
material = "petg"
bbox_min = [-0.133, -0.05, -0.0685]
bbox_max = [0.02, 0.05, -0.0194609]

[[ports]]
name = "hinge"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
fidelity = "derived"
derivation = "Tilt axis H, axis -y_H (manifest interface.frames.tilt_joint). With yoke_left.tilt_axis (axis +y, ref x) the mated chassis frame equals frame H exactly."

