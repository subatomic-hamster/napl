id = "cuas-lite-hopper-lid"
name = "cuas-lite hopper_lid (3D printed PLA, group tilt)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "hopper_lid"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (17.82 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (head frame H for the tilt group): the part frame IS that frame.
# Moves with the hopper (see cuas-lite-hopper).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/hopper_lid.stl"
material = "pla"
bbox_min = [-0.0963688, -0.0443738, 0.123524]
bbox_max = [0.0044, 0.0443738, 0.130524]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port: the chassis's (later the rotor plate's) seat port mates here."
