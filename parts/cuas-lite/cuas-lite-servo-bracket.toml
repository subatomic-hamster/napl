id = "cuas-lite-servo-bracket"
name = "cuas-lite servo_bracket (3D printed PETG, group tilt)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "servo_bracket"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (10.3 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (head frame H for the tilt group): the part frame IS that frame.

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/servo_bracket.stl"
material = "petg"
bbox_min = [-0.1035, -0.042, -0.065]
bbox_max = [-0.0315, 0.01, -0.05]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port: the chassis's seat port mates here."
