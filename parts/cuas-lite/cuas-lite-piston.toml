id = "cuas-lite-piston"
name = "cuas-lite piston (3D printed PETG, group tilt)"
category = "frame.printed"
vendor = "napl cuas-lite (own design)"
part_number = "piston"
url = "cad/cuas-lite/parts.py"

# Printed from cad/cuas-lite/parts.py (8.06 g, supports: none). The mesh is the CAD's napl mesh (m), already in its group frame (head frame H for the tilt group): the part frame IS that frame.
# Placed at its home (retracted) position; the 44 mm stroke along x is not modelled (the launcher device fires on command).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: spec 6.4, cad/cuas-lite/params.py." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas-lite/piston.stl"
material = "petg"
bbox_min = [-0.1265, -0.0111, -0.0626]
bbox_max = [-0.0785, 0.0111, -0.0404]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port: the chassis's seat port mates here."
