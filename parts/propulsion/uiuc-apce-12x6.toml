part_number = "apce_12x6"
url = "https://m-selig.ae.illinois.edu/props/volume-4/propDB-volume-4.html"

# Literature reference for C_T(J)/C_P(J) of a 12 in x 6 in APC Thin Electric prop (pitch/D = 0.50). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 14 rows) and one advancing run at about 5007 rpm (all 16 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

[params]
diameter  = { value = 0.3048, unit = "m", src = "S1", fidelity = "literature" }      # 12 in (list value)
pitch     = { value = 0.1524, unit = "m", src = "S1", fidelity = "literature" }      # 6 in per revolution
rpm_static_min = { value = 1047, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 7547, unit = "rpm", src = "S2", fidelity = "literature" }
ct_static_at_max_rpm = { value = 0.1055, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_max_rpm = { value = 0.0336, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.702, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.424 in the 5007 rpm run

