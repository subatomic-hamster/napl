# Literature reference for C_T(J)/C_P(J) shape of a 17 in thin-electric prop (pitch/D = 0.71; the largest size in this reference set, for
# T-Motor 17-18 in class props). Tables transcribed from the UIUC .txt data files: static (J = 0, all 16 rows) and one advancing run at
# about 3001 rpm (all 15 rows). Shape reference only. No ports (reference data only).

