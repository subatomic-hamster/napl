quote = "using the white 10-pin and 8-pin ESC connectors ... F55A LUX F7: TX ----> R6; CURT --> Curr; 1 -----> S1; 2 -----> S2; 3 -----> S3; 4 -----> S4; + -----> Leave disconnected as this is +5v; + -----> Vbat; GND ---> G; GND ---> Leave disconnected ... the T-Motor F55A Pro II has exactly the same pinout as the Pro (v1). The only difference is that the 5V output pin on the Pro is now a 10V output on the Pro II"

