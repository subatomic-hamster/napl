url = "https://rcdrone.top/products/t-motor-f55a-pro-ii-4in1-32bits-esc"

# Part frame: origin at the centre of the board underside, z up, +x toward the signal-connector edge (assumed). Mount pattern 30.5 x 30.5 mm.
# The listing gives per-ESC maximum current (55 A), the 6S rating, firmware (BLHeli_32), a 5 V / 2 A BEC and the 30.5 mm interface; it publishes no mass,
# no burst rating and no board dimensions (the "45mm x 41mm x 7.3mm" text is the listing's 'mounting hole size', garbled: not used for geometry).
# Board envelope below is ESTIMATED from the sibling F55A Pro III (44 x 40 x 7.5 mm).

[params]
cells_max       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
v_max           = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell = 25.2 V (listing title/size field '6S')." }
i_cont_per_ch   = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }
channels        = { value = 4, unit = "1", fidelity = "derived", derivation = "Product is a '4IN1' ESC (S1): four motor channels." }
bec_voltage     = { value = 5.0, unit = "V", src = "S1", fidelity = "datasheet" }
bec_current     = { value = 2.0, unit = "A", src = "S1", fidelity = "datasheet" }
firmware        = { value = "BLHeli_32", unit = "text", src = "S1", fidelity = "datasheet" }
length          = { value = 0.044, unit = "m", fidelity = "estimated", rationale = "Not published for the Pro II. Taken from the sibling F55A Pro III (44 x 40 x 7.5 mm, parts/propulsion/tmotor-f55a-pro-iii-4in1.toml) which shares the 30.5 stack pattern and 55 A rating." }
width           = { value = 0.040, unit = "m", fidelity = "estimated", rationale = "Same as length: sibling F55A Pro III value." }

[geometry]
shape = "box"
size = [0.022, 0.020, 0.00375]

