id = "tmotor-mn2212-v2-kv920"
name = "T-Motor MN2212 V2.0 KV920 multirotor motor"
category = "motor.bldc"
vendor = "T-Motor"
part_number = "MN2212 V2.0 KV920"
url = "https://store.tmotor.com/product/mn2212-v2-motor-navigator-type.html"

# Part frame: origin at the centre of the stator mounting face, +z along the shaft towards the prop.
# Ports as a top-level inline-table array (TOML requires it before the first [table] header).
ports = [
  { name = "base", kind = "mech", type = "bolt-pattern.16x19.m2.5", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 4, holes = 4 },
  { name = "shaft", kind = "mech", type = "shaft.4", gender = "male", pos = [0.0, 0.0, 0.03], axis = [0.0, 0.0, 1.0], ref = [1.0, 0.0, 0.0], symmetry = 360, note = "Derived: tip height = 32.6 mm overall drawing length minus 2.6 mm rear stub = 30.0 mm (S2 drawing; inference, the drawing does not say which 2.x label is the rear stub). Shaft dia from S1." },
  { name = "prop_adapter", kind = "mech", type = "shaft.5", gender = "male", pos = [0.0, 0.0, 0.03], axis = [0.0, 0.0, 1.0], ref = [1.0, 0.0, 0.0], symmetry = 360, note = "Derived: supplied M5 prop adapter (S2 drawing); shaft.5 is the library family for it; tip height as port 'shaft'." },
  { name = "phase", pins = ["PH.1", "PH.2", "PH.3"], kind = "power", type = "motor-3phase", gender = "neutral", role = "sink", v_max = { value = 16.8, unit = "V", fidelity = "derived", derivation = "4S x 4.2 V/cell = 16.8 V (upper end of the 2-4S range, S1)." }, i_max = { value = 15.0, unit = "A", src = "S1", fidelity = "datasheet" }, note = "i_max is the 180 s current rating ('Max Continuous Current 180S'); cable is part of the motor" },
]

[params]
mass = { value = 0.065, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Including Cables
mass_no_cable = { value = 0.054, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Excluding Cables
kv = { value = 920, unit = "rpm/V", src = "S1", fidelity = "datasheet" }  # from the model name
r_winding = { value = 0.142, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Internal Resistance (mOhm on page)
i0 = { value = 0.5, unit = "A", src = "S1", fidelity = "datasheet" }  # Idle Current@10v
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }  # test voltage from the 'Idle Current@10v' label
i_peak = { value = 15.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Max Continuous Current 180S
p_max = { value = 220.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Max Power (180S)
configuration = { value = "9N12P", unit = "text", src = "S1", fidelity = "datasheet" }
cells_min = { value = 2, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
diameter = { value = 0.0275, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
length_body = { value = 0.0265, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
stator_diameter = { value = 0.022, unit = "m", src = "S1", fidelity = "datasheet" }
stator_height = { value = 0.013, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
lead_length = { value = 0.4, unit = "m", src = "S1", fidelity = "datasheet" }  # 20# AWG
kt = { value = 0.01038, unit = "N*m/A", fidelity = "derived", derivation = "60 / (2*pi*Kv) with Kv = 920 rpm/V." }

[tables.thrust_test]
# VALIDATION TARGET. Vendor bench test, prop 'T-MOTOR 9545B', 11.1 V. All printed rows. thrust_N = thrust_g*0.00980665; vendor temp at 100 % throttle: not printed.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "efficiency_g_per_W"]
rows = [
  [50, 11.1, 1.6, 17.76, 4400, 1.726, 176, 9.91],
  [65, 11.1, 3, 33.3, 5500, 2.8341, 289, 8.68],
  [75, 11.1, 4.3, 47.73, 6400, 3.7756, 385, 8.07],
  [85, 11.1, 5.8, 64.38, 7000, 4.6582, 475, 7.38],
  [100, 11.1, 8.1, 89.91, 7800, 6.0507, 617, 6.86],
]
prop_label = "T-MOTOR 9545B"
src = "S1"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.01375, 0.015]
pos = [0.0, 0.0, 0.015]   # spans z = 0 .. tip height

# Pin level: three 20 AWG phase leads, 400 mm (S1 'Cable Length|400mm|AWG|20#'; the listing names no connector, so they are bare / solder ends).
# Lead exit and phase naming are conventions, as for the other outrunners in the library (no drawing carries them).
[[connectors]]
id = "PH"
name = "phase leads (3 x 20 AWG, 400 mm)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.01375, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the cable length and gauge (400mm, 20#), not a connector, lead positions or phase labels: leads drawn side by side at the base, 3 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 15.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 15.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 15.0 },
]

