  { number = 1, name = "A", kind = "power", dir = "out", i_max = 55.0 },
  { number = 2, name = "B", kind = "power", dir = "out", i_max = 55.0 },
  { number = 3, name = "C", kind = "power", dir = "out", i_max = 55.0 },
