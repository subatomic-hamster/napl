ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "Derived: tip height = 37.1 mm overall drawing length minus 2.6 mm rear stub (mount-face side) = 34.5 mm; assumes the 2.6 is the rear stub below the mounting face (S2 drawing; inference, the drawing does not say which 2.x label is the rear stub). Shaft dia from S1."

[[ports]]
name = "prop_adapter"
kind = "mech"
type = "shaft.6"
gender = "male"
