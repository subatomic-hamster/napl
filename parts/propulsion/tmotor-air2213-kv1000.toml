# rows 30/40/50/60/70/80/90/100 % transcribed. Operating temperature 47 C at 100 % for 10 min.
# Vendor columns: Thrust(g), Torque(N*m), Current(A), RPM, Power(W), Efficiency(g/W); thrust_N = thrust_g * 0.00980665.
