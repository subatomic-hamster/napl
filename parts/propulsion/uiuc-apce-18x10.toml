id = "uiuc-apce-18x10"
name = "APC Thin Electric 18x10 propeller - UIUC wind-tunnel C_T/C_P data (reference)"
category = "prop.reference"
vendor = "APC (propeller); data: UIUC Propeller Data Site (Selig et al.)"
part_number = "apce_18x10"
url = "https://m-selig.ae.illinois.edu/props/volume-4/propDB-volume-4.html"

# Literature reference for C_T(J)/C_P(J) of a 18 in x 10 in APC Thin Electric prop (pitch/D = 0.56). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 10 rows) and one advancing run at about 3961 rpm (all 14 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

[params]
diameter  = { value = 0.4572, unit = "m", src = "S1", fidelity = "literature" }      # 18 in (list value)
pitch     = { value = 0.254, unit = "m", src = "S1", fidelity = "literature" }      # 10 in per revolution
rpm_static_min = { value = 1047, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 5467, unit = "rpm", src = "S2", fidelity = "literature" }
ct_static_at_max_rpm = { value = 0.1108, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_max_rpm = { value = 0.0361, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.759, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.390 in the 3961 rpm run

