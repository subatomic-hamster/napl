# Literature reference for C_T(J)/C_P(J) of a 10 in x 7 in Master Airscrew Scimitar prop (pitch/D = 0.70). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 16 rows) and one advancing run at about 5004 rpm (all 13 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only).

