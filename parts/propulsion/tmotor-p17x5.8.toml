thrust_limit = { value = 73.55, unit = "N", fidelity = "derived", derivation = "'Thrust Limitation 7.5kg' (S1) x 9.80665 m/s^2 = 73.55 N." }
rpm_opt_min = { value = 3500, unit = "rpm", src = "S1", fidelity = "datasheet" }
