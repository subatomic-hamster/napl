j_prop      = { value = 4.12e-4, unit = "kg*m^2", fidelity = "derived", derivation = "Slender uniform rod about its midpoint: J = m*L^2/12 = 0.0265*0.4318^2/12 = 4.12e-4 kg*m^2. Upper bound (real blades have mass nearer the hub)." }

