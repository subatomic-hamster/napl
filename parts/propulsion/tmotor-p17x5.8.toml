# Part frame: origin at the hub centre on the blade mid-plane, z up (thrust direction). The bore faces down (-z) toward the motor.
# Prop used in the T-Motor MN5006-KV300 bench test (prop_label "T-MOTOR P17*5.8 CF", parts/propulsion/tmotor-mn5006-kv300.toml). Mass: "Weight 26.5+1.5g ...
# (Single Blade)" read as one propeller (inference; see tmotor-p18x6.1). The listing text prints "Zblades-integrated" (an OCR of "2blades"), so blade_count
# is estimated. No C_T/C_P curve: use uiuc-apce-* reference parts for J-shape.

[params]
diameter    = { value = 0.4318, unit = "m", fidelity = "derived", derivation = "Part name 'P17x5.8' / listing 'Size 17 inch': 17 in x 0.0254 m/in = 0.4318 m." }
pitch       = { value = 0.14732, unit = "m", fidelity = "derived", derivation = "Listing model number '17*5.8\"': 5.8 in x 0.0254 m/in = 0.14732 m." }
blade_count = { value = 2, unit = "1", fidelity = "estimated", rationale = "Listing text reads 'Zblades-integrated' (OCR of the T-Motor series line '2blades-integrated' that all sibling P/NS pages carry) and the product is sold as CW+CCW pairs." }
mass        = { value = 0.0265, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_tol    = { value = 0.0015, unit = "kg", src = "S1", fidelity = "datasheet" }
