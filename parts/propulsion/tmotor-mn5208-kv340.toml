id = "tmotor-mn5208-kv340"
name = "T-Motor MN5208 KV340 multirotor motor"
category = "motor.bldc"
vendor = "T-Motor"
part_number = "MN5208 KV340"
url = "https://store.tmotor.com/product/mn5208-motor-navigator-type.html"

# Part frame: origin at the centre of the stator mounting face, +z along the shaft towards the prop.
# Ports as a top-level inline-table array (TOML requires it before the first [table] header). No prop adapter is drawn on the S2 drawing.
ports = [
  { name = "base", kind = "mech", type = "bolt-circle.25.4.m3", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 4, holes = 4 },
  { name = "base_32", kind = "mech", type = "bolt-circle.32.3.m2.5", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 3, holes = 3 },
  { name = "shaft", kind = "mech", type = "shaft.4", gender = "male", pos = [0.0, 0.0, 0.0355], axis = [0.0, 0.0, 1.0], ref = [1.0, 0.0, 0.0], symmetry = 360, note = "Derived: tip height = 38.5 mm overall drawing length minus 3 mm rear stub = 35.5 mm (S2 drawing; inference, the drawing does not say which label is the rear stub). Shaft dia from S1." },
  { name = "phase", pins = ["PH.1", "PH.2", "PH.3"], kind = "power", type = "motor-3phase", gender = "neutral", role = "sink", v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell = 25.2 V (upper end of the 4-6S range, S1)." }, i_max = { value = 35.0, unit = "A", src = "S1", fidelity = "datasheet" }, note = "i_max is the 180 s current rating ('Max Continuous Current 180S'); cable is part of the motor" },
]

[params]
mass = { value = 0.196, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Including Cables
mass_no_cable = { value = 0.145, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Excluding Cables
kv = { value = 340, unit = "rpm/V", src = "S1", fidelity = "datasheet" }  # from the model name
r_winding = { value = 0.093, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Internal Resistance (mOhm on page)
i0 = { value = 0.9, unit = "A", src = "S1", fidelity = "datasheet" }  # Idle Current@10v
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }  # test voltage from the 'Idle Current@10v' label
i_peak = { value = 35.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Max Continuous Current 180S
p_max = { value = 850.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Max Power (180S)
configuration = { value = "24N22P", unit = "text", src = "S1", fidelity = "datasheet" }
cells_min = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
diameter = { value = 0.059, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
length_body = { value = 0.0295, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
stator_diameter = { value = 0.052, unit = "m", src = "S1", fidelity = "datasheet" }
stator_height = { value = 0.008, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
lead_length = { value = 0.6, unit = "m", src = "S1", fidelity = "datasheet" }  # 16# AWG
kt = { value = 0.028086, unit = "N*m/A", fidelity = "derived", derivation = "60 / (2*pi*Kv) with Kv = 340 rpm/V." }

[tables.thrust_test]
# VALIDATION TARGET. Vendor bench test, prop 'T-MOTOR 15*5CF', 24 V. All printed rows (7). thrust_N = thrust_g*0.00980665; vendor temp at 100 % throttle: 53 C.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "efficiency_g_per_W", "torque_Nm"]
rows = [
  [50, 24.0, 3.4, 80.6, 3972, 7.5021, 765, 9.49, 0.149],
  [55, 24.0, 4.3, 103.4, 4383, 9.2673, 945, 9.14, 0.18],
  [60, 24.0, 5.5, 130.8, 4762, 11.0129, 1123, 8.59, 0.214],
  [65, 24.0, 6.6, 157.2, 5108, 12.729, 1298, 8.26, 0.243],
  [75, 24.0, 9.5, 227.5, 5862, 16.5634, 1689, 7.42, 0.318],
  [85, 24.0, 12.8, 306.5, 6484, 20.3488, 2075, 6.77, 0.386],
  [100, 24.0, 18.1, 433.4, 7497, 26.1739, 2669, 6.16, 0.493],
]
prop_label = "T-MOTOR 15*5CF"
src = "S1"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.0295, 0.01775]
pos = [0.0, 0.0, 0.01775]   # spans z = 0 .. tip height

# Pin level: three 16 AWG phase leads, 600 mm (S1 'AWG|16#|Cable Length|600mm'; the listing names no connector, so they are bare / solder ends).
# Lead exit and phase naming are conventions, as for the other outrunners in the library (no drawing carries them).
[[connectors]]
id = "PH"
name = "phase leads (3 x 16 AWG, 600 mm)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.0295, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.004
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the cable length and gauge (600mm, 16#), not a connector, lead positions or phase labels: leads drawn side by side at the base, 4 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 35.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 35.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 35.0 },
]

