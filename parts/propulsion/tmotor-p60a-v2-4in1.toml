type = "dshot"
gender = "neutral"

# ---- Connectors (pin level). P2 (retailer page) lists an XT60 power lead, a capacitor and 'Dual Side' / 'Single Side Silicone Cable' signal harnesses and says
# the ESC reports voltage, temperature and current by telemetry; it gives no pin table. The signal pins are those of T-Motor's earlier F55A Pro /
# Pro II 10-pin ESC connector (P1, a forum wiring answer: TX, CURT, 1-4, two '+', two GND), assumed to be the family layout; the P60A V2 has no
# BEC listed (S1), so the BEC position is listed as not connected. Everything here is estimated.
[[connectors]]
id = "SIG"
name = "ESC signal connector (10 positions)"
type = "jst-sh-10"
gender = "male"
pos = [0.0, 0.0165, 0.0072]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.001
src = "P1"
fidelity = "estimated"
rationale = "P2 shows silicone signal cables but no pin count or table. The ten positions and their order follow the T-Motor F55A Pro / Pro II connector (P1) as a family assumption; housing, pitch and position are assumed too."
pins = [
  { number = 1, name = "TX", kind = "signal", dir = "out", note = "ESC telemetry (P2: 'Telemetry data transmission')" },
  { number = 2, name = "CURT", kind = "signal", dir = "out", note = "current sensor (P2: real-time current readings)" },
  { number = 3, name = "1", kind = "signal", dir = "in", note = "motor 1 signal" },
  { number = 4, name = "2", kind = "signal", dir = "in", note = "motor 2 signal" },
  { number = 5, name = "3", kind = "signal", dir = "in", note = "motor 3 signal" },
  { number = 6, name = "4", kind = "signal", dir = "in", note = "motor 4 signal" },
  { number = 7, name = "NC", kind = "nc", note = "the BEC '+' position of the Pro / Pro II; no BEC is listed for this ESC (S1)" },
  { number = 8, name = "VBAT", kind = "power", dir = "out", v_max = 25.2, note = "battery voltage to the FC (P1: '+ -> Vbat'); v_max 6S x 4.2 V (S1 3-6S)" },
  { number = 9, name = "GND", kind = "ground" },
  { number = 10, name = "GND", kind = "ground" },
]

[[connectors]]
id = "BAT"
name = "battery solder pads (BAT+ / BAT-), XT60 power lead included"
type = "solder-pad-1x2"
gender = "neutral"
joinable = true
pos = [0.0, -0.0225, 0.0036]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.008
src = "S1"
fidelity = "estimated"
rationale = "S1 lists 'XT60 Power Cable*1' in the box (a separate lead to solder on), the 3-6S rating and 60 A per channel; the pad layout is not published: two pads, + then -, 8 mm apart on the edge opposite the signal connector."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", v_max = 25.2, i_max = 240.0, fidelity = "derived", derivation = "v_max 6S x 4.2 V (S1 3-6S); i_max 4 x 60 A continuous (S1)." },
  { number = 2, name = "BAT-", kind = "ground", i_max = 240.0, fidelity = "derived", derivation = "4 x 60 A continuous (S1)." },
]

