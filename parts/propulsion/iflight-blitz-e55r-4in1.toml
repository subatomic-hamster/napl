id = "iflight-blitz-e55r-4in1"
name = "iFlight BLITZ E55R 4-in-1 2-6S ESC (G2, BLHeli32), 20x20 stack"
category = "esc"
vendor = "iFlight"
part_number = "BLITZ E55R 4-IN-1 (G2)"
url = "https://rcdrone.top/products/iflight-blitz-e55r-4-in-1-esc"

# Part frame: origin at the centre of the board underside, z up, +x toward the signal-connector edge (assumed). Mount pattern 20 x 20 mm,
# listed as "20 x20 mm/Φ4mm"; the bolt-pattern type uses m3 as an inference (a 4 mm hole fits an M3 screw). The listing does not state the
# thread, so it is a modelling choice. Board outline and thickness are not published (assumed 27 x 27 x 6 mm box); pad positions unpublished.

[params]
mass            = { value = 0.0113, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.027, unit = "m", fidelity = "estimated", rationale = "Board outline not published in the E55R listing; 27 mm assumed from the 20 mm hole pattern plus ~3.5 mm edge margin per side (typical 20x20 stack boards are about 25-28 mm)." }
width           = { value = 0.027, unit = "m", fidelity = "estimated", rationale = "Board outline not published in the E55R listing; 27 mm assumed from the 20 mm hole pattern plus ~3.5 mm edge margin per side (typical 20x20 stack boards are about 25-28 mm)." }
height          = { value = 0.006, unit = "m", fidelity = "estimated", rationale = "Board thickness not published; ~6 mm taken from the Holybro Tekko32 4-in-1 spec (6 mm) as same-class comparable." }
cells_min       = { value = 2, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
i_cont_per_ch   = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst_per_ch  = { value = 65.0, unit = "A", src = "S1", fidelity = "datasheet" }
channels        = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
mcu             = { value = "G071", unit = "text", src = "S1", fidelity = "datasheet" }
bec             = { value = "none", unit = "text", src = "S1", fidelity = "datasheet" }
firmware        = { value = "BLHeli32", unit = "text", src = "S1", fidelity = "datasheet" }
current_rate    = { value = 200, unit = "1", src = "S1", fidelity = "datasheet" }

[geometry]
shape = "box"
size = [0.0135, 0.0135, 0.003]

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.20x20.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "20 x 20 mm per S1 (4 mm hole); thread class m3 is an inference, M2 is also common for this pitch"

[[ports]]
name = "power_in"
pins = ["BAT.1", "BAT.2"]
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell = 25.2 V (upper end of 'Input Voltage: 2-6S', S1)." }
i_max = { value = 220.0, unit = "A", fidelity = "derived", derivation = "4 channels x 55 A continuous per channel (S1) = 220 A; no total-input rating is published." }

[[ports]]
name = "motor_out_1"
pins = ["M1.1", "M1.2", "M1.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_2"
pins = ["M2.1", "M2.2", "M2.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_3"
pins = ["M3.1", "M3.2", "M3.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_4"
pins = ["M4.1", "M4.2", "M4.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "signal"
pins = ["FC.5", "FC.6", "FC.7", "FC.8", "FC.9", "FC.1"]   # M1 .. M4 DShot, CUR current sense, GND
kind = "signal"
type = "dshot"
gender = "neutral"

# ---- Connectors (pin level). The only pinout published for this ESC family is the sibling BLITZ E55's ten-position FC connector (P1, a hands-on review
# quoting the board). E55R is the same G2 generation (S1: 'Target: IFLIGHT_BLITZ_G2', current sensor, DShot), so the sibling's pinout is used for it
# (parts/propulsion/iflight-blitz-e55-4in1.toml); S1 lists only 'Power cables & ESC signal wires'. Battery pads, motor pads and poses are estimates.
[[connectors]]
id = "FC"
name = "FC connector (10 positions)"
type = "header-1x10"
gender = "male"
pos = [0.0, 0.0105, 0.006]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.00125
src = "P1"
fidelity = "estimated"
rationale = "P1 describes the sibling BLITZ E55 (same G2 target / current sensor as this E55R, S1); the E55R's own connector pinout is not published, so the sibling's is assumed. Housing type, pitch and position are assumptions."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "GND", kind = "ground" },
  { number = 3, name = "VBAT", kind = "power", dir = "out", v_max = 25.2, note = "battery rail passed to the FC; 2-6S (S1)" },
  { number = 4, name = "VBAT", kind = "power", dir = "out", v_max = 25.2 },
  { number = 5, name = "M1", kind = "signal", dir = "in", note = "DShot150/300/600 motor 1 signal (S1)" },
  { number = 6, name = "M2", kind = "signal", dir = "in" },
  { number = 7, name = "M3", kind = "signal", dir = "in" },
  { number = 8, name = "M4", kind = "signal", dir = "in" },
  { number = 9, name = "CUR", kind = "signal", dir = "out", note = "current sensor output ('Current Sensor: Yes', S1)" },
  { number = 10, name = "NC", kind = "nc" },
]

[[connectors]]
id = "BAT"
name = "battery solder pads (BAT+ / BAT-)"
type = "solder-pad-1x2"
gender = "neutral"
joinable = true
pos = [0.0, -0.0105, 0.003]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.006
src = "S1"
fidelity = "estimated"
rationale = "S1 states the supply range and 'Power cables' in the box, nothing on the pad layout: two pads, + then -, 6 mm apart on the edge opposite the FC connector."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", v_max = 25.2, i_max = 220.0, fidelity = "derived", derivation = "v_max 6S x 4.2 V (S1 'Input Voltage: 2-6S'); i_max 4 x 55 A continuous (S1)." },
  { number = 2, name = "BAT-", kind = "ground", i_max = 220.0, fidelity = "derived", derivation = "4 x 55 A continuous (S1)." },
]

