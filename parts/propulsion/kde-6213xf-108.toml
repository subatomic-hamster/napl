size = [0.035, 0.02375]
pos = [0.0, 0.0, 0.02375]

# Pin level: three phase leads. S1 mentions only 'wires/bullets' in the listing mass: no gauge, length, connector or phase labels.
[[connectors]]
id = "PH"
name = "phase leads (3)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.035, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "S1 only says the listed mass includes 'wires/bullets': no gauge, length, connector or phase labels. Three phase leads drawn side by side at the base, 5 mm apart (large frame), phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 20.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 20.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 20.0 },
]

