  [50.0, 50.4, 5.34, 269.0, 2800, 24.4, 2487, 0.72, 9.25],
  [62.5, 50.4, 8.64, 435.0, 3295, 34.09, 3475, 1.0, 7.99],
  [75.0, 50.4, 12.35, 622.0, 3740, 44.0, 4485, 1.28, 7.21],
  [87.5, 50.4, 16.2, 816.0, 4095, 53.05, 5408, 1.57, 6.63],
