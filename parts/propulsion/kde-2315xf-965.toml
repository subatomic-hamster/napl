id = "kde-2315xf-965"
name = "KDE Direct KDE2315XF-965 brushless motor"
category = "motor.bldc"
vendor = "KDE Direct"
part_number = "KDE2315XF-965"
url = "https://www.kdedirect.com/products/kde2315xf-965"

# Part frame: origin at the centre of the mounting face, +z along the shaft towards the prop.
# Ports: see the [[ports]] tables after [geometry].

[params]
mass = { value = 0.075, unit = "kg", src = "S1", fidelity = "datasheet" }  # with wires/bullets
mass_no_cable = { value = 0.064, unit = "kg", src = "S1", fidelity = "datasheet" }  # motor only
kv = { value = 965, unit = "rpm/V", src = "S1", fidelity = "datasheet" }
kt = { value = 0.0099, unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # Kt (Motor Torque Constant)
km = { value = 0.031, unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }  # Km (Motor Constant)
r_winding = { value = 0.102, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Rm phase-to-phase, delta wound
i0 = { value = 0.5, unit = "A", src = "S1", fidelity = "datasheet" }  # Io (@10V)
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 26.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Current (180 s)
p_max = { value = 385.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Power (180 s)
cells_min = { value = 3, unit = "S", src = "S1", fidelity = "datasheet" }  # 11.1 V (3S LiPo) - 17.4 V (4S LiHV)
cells_max = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
configuration = { value = "12 (12S14P) / 14 (12S14P)", unit = "text", src = "S1", fidelity = "datasheet" }  # stator poles / magnet poles
diameter = { value = 0.0283, unit = "m", src = "S1", fidelity = "datasheet" }
length_body = { value = 0.0285, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
j_rotor_bell = { value = 4.1e-06, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # Motor Rotor Inertia, kg*cm^2 x 1e-4

[tables.thrust_test]
# VALIDATION TARGET. KDE performance data sheet (xlsx), prop '11" x 3.7', 16.8V supply. All printed rows; thrust 'Thrust Output' columns in g and N as printed.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "torque_Nm", "efficiency_g_per_W"]
rows = [
  [25.0, 16.8, 2.1, 35.3, 4542, 2.91, 297, 0.042, 8.42],
  [37.5, 16.8, 3.8, 63.8, 5725, 4.51, 460, 0.068, 7.21],
  [50.0, 16.8, 6.6, 110.9, 6982, 7.05, 719, 0.1, 6.48],
  [62.5, 16.8, 10.4, 174.7, 8148, 9.84, 1003, 0.139, 5.74],
  [75.0, 16.8, 15.3, 257.0, 9236, 12.67, 1292, 0.18, 5.03],
  [87.5, 16.8, 21.2, 356.2, 10220, 15.6, 1591, 0.221, 4.47],
  [100.0, 16.8, 26.0, 436.8, 10880, 17.68, 1803, 0.25, 4.13],
]
prop_label = "KDE 11 in x 3.7"
src = "S2"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.01415, 0.016]
pos = [0.0, 0.0, 0.016]

[[ports]]
name = "base_19_m3"
kind = "mech"
type = "bolt-circle.19.4.m3"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
holes = 4
thread = "m3"
fidelity = "estimated"
src = "S1"
rationale = "S1 lists only 'M3 x ф 19 mm'; hole count 4 assumed (same circle on T-Motor drawings)."

[[ports]]
name = "base_16_m2.5"
kind = "mech"
type = "bolt-circle.16.4.m2.5"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
holes = 4
thread = "m2.5"
fidelity = "estimated"
src = "S1"
rationale = "S1 lists only 'M2.5 x ф 16 mm'; hole count 4 assumed (same circle on T-Motor drawings)."

# Family naming: the 16 mm / 19 mm M3 pair of '2xxx / 22xx-class' motors is the rectangle `bolt-pattern.16x19.m3`, the same type the T-Motor
# MN2212 / MN3110 and the Holybro 2216 drawing ('16, 19') use, so the pattern mates the same seats.
[[ports]]
name = "base_16x19_m3"
kind = "mech"
type = "bolt-pattern.16x19.m3"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
holes = 4
thread = "m3"
fidelity = "estimated"
src = "S1"
rationale = "S1 lists 'M3 x ф 16/19 mm' (a 16 mm and a 19 mm hole spacing, no hole count or shape). Read as the 16 x 19 mm rectangle of 4 M3 holes that the same-class T-Motor MN2212 / MN3110 drawings show; not confirmed against a KDE drawing."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.4"
gender = "male"
pos = [0.0, 0.0, 0.032]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
fidelity = "estimated"
src = "S1"
rationale = "Tip height = Motor Length 28.5 mm + Shaft Length 3.5 mm (S1); assumes the listed Motor Length excludes the protruding shaft."

[[ports]]
name = "prop_adapter"
kind = "mech"
type = "shaft.6"
gender = "male"
pos = [0.0, 0.0, 0.032]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
fidelity = "estimated"
src = "S3"
rationale = "The motor ships with an M6 x 12 mm propeller adapter (S3); shaft.6 is the library family for an M6 prop adapter (as the T-Motor MN parts). Tip height as port 'shaft' (adapter stack height not modelled)."

[[ports]]
name = "phase"
pins = ["PH.1", "PH.2", "PH.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "sink"
v_max = { value = 17.4, unit = "V", fidelity = "derived", derivation = "4S x 4.35 V/cell (LiHV) = 17.4 V from the Voltage Range '11.1 V (3S LiPo) - 17.4 V (4S LiHV)' (S1)." }
i_max = { value = 26.0, unit = "A", src = "S1", fidelity = "datasheet" }
note = "i_max is the 180 s continuous current ('Maximum Continuous Current'); the motor needs 5 mph+ airflow for it (vendor footnote). The 75 g mass includes the wires / bullets; the lead length is not published (flag only: autowire uses the routed run)."
lead = {}

# Pin level: three phase leads. S1 mentions only 'wires/bullets' in the listing mass: no gauge, length, connector or phase labels.
[[connectors]]
id = "PH"
name = "phase leads (3)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.01415, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 only says the listed mass includes 'wires/bullets': no gauge, length, connector or phase labels. Three phase leads drawn side by side at the base, 3 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 26.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 26.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 26.0 },
]

