pins = ["SIG.3", "SIG.4", "SIG.5", "SIG.6", "SIG.2", "SIG.9"]   # 1 .. 4 DShot inputs, CURT current sense, GND
kind = "signal"
type = "dshot"
gender = "neutral"

# ---- Connectors (pin level). P2 (retailer page) states a 'SH1.0-10P' signal cable that plugs into the T-Motor F7 flight controllers. The pin functions
# are those of the earlier F55A Pro / Pro II 10-pin connector (P1, a forum wiring answer: TX, CURT, 1-4, two '+', two GND), assumed to carry over to
# the Pro III; the Pro III has no BEC (S1), so the BEC position is listed as not connected. The physical order is not published (estimated).
# Battery, motor pads and poses are estimates (S1 gives none).
[[connectors]]
id = "SIG"
name = "ESC signal connector (SH1.0, 10 positions)"
type = "jst-sh-10"
gender = "male"
pos = [0.0, 0.016, 0.0075]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.001
src = "P1"
fidelity = "estimated"
rationale = "P2 gives the 10-position SH1.0 cable; the pin functions and order are those of the predecessor's connector (P1), whose physical order is itself not stated (wiring-table order)."
pins = [
  { number = 1, name = "TX", kind = "signal", dir = "out", note = "ESC telemetry (P1: TX -> FC R6; S1: 'Telemetry Support')" },
  { number = 2, name = "CURT", kind = "signal", dir = "out", note = "current sensor (P1: CURT -> Curr; S1: 'Amperage meter 200')" },
  { number = 3, name = "1", kind = "signal", dir = "in", note = "motor 1 signal" },
  { number = 4, name = "2", kind = "signal", dir = "in", note = "motor 2 signal" },
  { number = 5, name = "3", kind = "signal", dir = "in", note = "motor 3 signal" },
  { number = 6, name = "4", kind = "signal", dir = "in", note = "motor 4 signal" },
  { number = 7, name = "NC", kind = "nc", note = "the BEC '+' position of the Pro / Pro II; this ESC has 'BEC: No' (S1)" },
  { number = 8, name = "VBAT", kind = "power", dir = "out", v_max = 33.6, note = "battery voltage to the FC (P1: '+ -> Vbat'); v_max 8S x 4.2 V (S1 3S-8S)" },
  { number = 9, name = "GND", kind = "ground" },
  { number = 10, name = "GND", kind = "ground" },
]

[[connectors]]
id = "BAT"
name = "battery solder pads (BAT+ / BAT-)"
type = "solder-pad-1x2"
gender = "neutral"
joinable = true
pos = [0.0, -0.02, 0.00375]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.008
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the 3S-8S rating and 55 A per channel, nothing on the pad layout: two pads, + then -, 8 mm apart on the edge opposite the signal connector."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", v_max = 33.6, i_max = 220.0, fidelity = "derived", derivation = "v_max 8S x 4.2 V (S1 3S-8S); i_max 4 x 55 A continuous (S1)." },
  { number = 2, name = "BAT-", kind = "ground", i_max = 220.0, fidelity = "derived", derivation = "4 x 55 A continuous (S1)." },
]

