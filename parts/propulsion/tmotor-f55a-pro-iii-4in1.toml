id = "tmotor-f55a-pro-iii-4in1"
name = "T-Motor F55A Pro III 4-in-1 ESC 55A 3S-8S (AM32), 30.5x30.5 stack"
category = "esc"
vendor = "T-Motor"
part_number = "F55A Pro III"
url = "https://rcdrone.top/products/t-motor-f55a-pro-iii-55a-3-8s-tphr8504-mos-4-in-1-esc"

# Part frame: origin at the centre of the board underside, z up, +x toward the signal-connector edge (assumed). Mount pattern 30.5 x 30.5 mm M3.
# Motor pad / battery pad positions are not published, so those ports carry no pos. Peak current is rated 65 A for 10 s.

