cells_max       = { value = 8, unit = "S", src = "S1", fidelity = "datasheet" }
v_max           = { value = 33.6, unit = "V", fidelity = "derived", derivation = "8S x 4.2 V/cell = 33.6 V (S1 'Voltage 3S-8S Lipo')." }
i_cont_per_ch   = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst_per_ch  = { value = 65.0, unit = "A", src = "S1", fidelity = "datasheet" }
burst_duration  = { value = 10.0, unit = "s", src = "S1", fidelity = "datasheet" }
channels        = { value = 4, unit = "1", fidelity = "derived", derivation = "Product is a '4-in-1' ESC (S1): four motor channels." }
pwm_freq_min    = { value = 16000, unit = "Hz", src = "S1", fidelity = "datasheet" }
pwm_freq_max    = { value = 128000, unit = "Hz", src = "S1", fidelity = "datasheet" }
current_scale   = { value = 200, unit = "1", src = "S1", fidelity = "datasheet" }             # "Amperage meter | 200"
bec             = { value = "none", unit = "text", src = "S1", fidelity = "datasheet" }
firmware        = { value = "AM32", unit = "text", src = "S1", fidelity = "datasheet" }

