# ---- Connectors (pin level). S1 states the 14 AWG x 100 mm red/black input wires and 'No wires (solder tabs)' for the outputs. The signal
# harness is not documented for this 20x20 board; the pin names and order are those of the sibling XRotor Micro 45A manual (P1: GND, BAT,
# CRT, GND, S1-S4, minus its 5 V / 10 V BEC pins, which this board has none of: 'BEC output N/A', S1). Positions are estimates.
