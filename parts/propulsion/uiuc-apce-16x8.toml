id = "uiuc-apce-16x8"
name = "APC Thin Electric 16x8 propeller - UIUC wind-tunnel C_T/C_P data (reference)"
category = "prop.reference"
vendor = "APC (propeller); data: UIUC Propeller Data Site (Selig et al.)"
part_number = "apce_16x8"
url = "https://m-selig.ae.illinois.edu/props/volume-4/propDB-volume-4.html"

# Literature reference for C_T(J)/C_P(J) of a 16 in x 8 in APC Thin Electric prop (pitch/D = 0.50). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 13 rows) and one advancing run at about 4968 rpm (all 15 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

[params]
diameter  = { value = 0.4064, unit = "m", src = "S1", fidelity = "literature" }      # 16 in (list value)
pitch     = { value = 0.2032, unit = "m", src = "S1", fidelity = "literature" }      # 8 in per revolution
rpm_static_min = { value = 980, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 6953, unit = "rpm", src = "S2", fidelity = "literature" }
ct_static_at_max_rpm = { value = 0.1018, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_max_rpm = { value = 0.0308, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.730, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.353 in the 4968 rpm run

