id = "tmotor-mn3510-kv630"
name = "T-Motor MN3510 KV630 multirotor motor"
category = "motor.bldc"
vendor = "T-Motor"
part_number = "MN3510 KV630"
url = "https://store.tmotor.com/product/mn3510-motor-navigator-type.html"

# Part frame: origin at the centre of the stator mounting face, +z along the shaft towards the prop.
# Vendor page lists several KV variants; the values below are this variant's own spec column and test table.

[params]
mass = { value = 0.119, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Including Cables
mass_no_cable = { value = 0.097, unit = "kg", src = "S1", fidelity = "datasheet" }  # Weight Excluding Cables
kv = { value = 630, unit = "rpm/V", src = "S1", fidelity = "datasheet" }  # from the model name
r_winding = { value = 0.065, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Internal Resistance (mOhm on page)
i0 = { value = 0.5, unit = "A", src = "S1", fidelity = "datasheet" }  # Idle Current@10v
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }  # test voltage from the 'Idle Current@10v' label
i_peak = { value = 22.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Max Continuous Current 180S
p_max = { value = 495.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Max Power (180S)
configuration = { value = "12N14P", unit = "text", src = "S1", fidelity = "datasheet" }
cells_min = { value = 3, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
diameter = { value = 0.0418, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
length_body = { value = 0.0285, unit = "m", src = "S1", fidelity = "datasheet" }  # Motor Dimensions
stator_diameter = { value = 0.035, unit = "m", src = "S1", fidelity = "datasheet" }
stator_height = { value = 0.01, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
lead_length = { value = 0.6, unit = "m", src = "S1", fidelity = "datasheet" }  # 18# AWG
kt = { value = 0.015158, unit = "N*m/A", fidelity = "derived", derivation = "60 / (2*pi*Kv) with Kv = 630 rpm/V." }

[tables.thrust_test]
# VALIDATION TARGET. Vendor bench test, prop 'T-MOTOR 14*4.8CF', 14.8 V. All printed rows. thrust_N = thrust_g*0.00980665; vendor temp at 100 % throttle: 53 C.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "efficiency_g_per_W"]
rows = [
  [50, 14.8, 4.6, 68.08, 4100, 6.8647, 700, 10.28],
  [65, 14.8, 8.7, 128.76, 5300, 10.8854, 1110, 8.62],
  [75, 14.8, 11.8, 174.64, 5700, 13.337, 1360, 7.79],
  [85, 14.8, 16.4, 242.72, 6300, 16.6713, 1700, 7.00],
  [100, 14.8, 20, 296.00, 6600, 18.1423, 1850, 6.25],
]
prop_label = "T-MOTOR 14*4.8CF"
src = "S1"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.0209, 0.01725]
pos = [0.0, 0.0, 0.01725]   # spans z = 0 .. tip height

[[ports]]
name = "base"
kind = "mech"
type = "bolt-circle.25.4.m3"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
holes = 4

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.4"
gender = "male"
pos = [0.0, 0.0, 0.0345]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "Derived: tip height = 37.1 mm overall drawing length minus 2.6 mm rear stub = 34.5 mm (S2 drawing; inference, the drawing does not say which 2.x label is the rear stub). Shaft dia from S1."

[[ports]]
name = "prop_adapter"
kind = "mech"
type = "shaft.6"
gender = "male"
pos = [0.0, 0.0, 0.0345]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "Derived: supplied M6 prop adapter (S2 drawing); shaft.6 is the library family for it (as tmotor-mn3508-kv700); tip height as port 'shaft'."

[[ports]]
name = "phase"
pins = ["PH.1", "PH.2", "PH.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "sink"
v_max = { value = 16.8, unit = "V", fidelity = "derived", derivation = "4S x 4.2 V/cell = 16.8 V (upper end of the 3-4S range, S1)." }
i_max = { value = 22.0, unit = "A", src = "S1", fidelity = "datasheet" }
note = "i_max is the 180 s current rating ('Max Continuous Current 180S'); cable is part of the motor"

# Pin level: three 18 AWG phase leads, 600 mm (S1 'Cable Length|600mm|AWG|18#'; the listing names no connector, so they are bare / solder ends).
# Lead exit and phase naming are conventions, as for the other outrunners in the library (no drawing carries them).
[[connectors]]
id = "PH"
name = "phase leads (3 x 18 AWG, 600 mm)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.0209, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the cable length and gauge (600mm, 18#), not a connector, lead positions or phase labels: leads drawn side by side at the base, 3 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 22.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 22.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 22.0 },
]

