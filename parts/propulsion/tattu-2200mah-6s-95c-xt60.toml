id = "tattu-2200mah-6s-95c-xt60"
name = "Tattu R-Line 2200mAh 6S 22.2V 95C LiPo pack, XT60"
category = "battery.lipo"
vendor = "Tattu (Grepow)"
part_number = "TAA22006S95X6"
url = "https://rcdrone.top/products/src-taa22006s95x6-tattu-2200mah-6s-95c-22-2v-r-line-lipo-battery-with-xt60-plug-for-7-quad"

# Part frame: origin at the pack centre, x along length (116 mm), y along width (34 mm), z up (38.5 mm). Pack-side connector gender is a
# modelling convention (neutral mates either). Internal resistance not published for this model: pack value estimated.

[params]
capacity_ah     = { value = 2.2, unit = "Ah", src = "S1", fidelity = "datasheet" }
capacity        = { value = 7920.0, unit = "C", fidelity = "derived", derivation = "2.2 Ah x 3600 s/h = 7920 C (coulombs)." }
cells_series    = { value = 6, unit = "1", src = "S1", fidelity = "datasheet" }
cells_parallel  = { value = 1, unit = "1", src = "S1", fidelity = "datasheet" }
v_nominal       = { value = 22.2, unit = "V", src = "S1", fidelity = "datasheet" }
v_full          = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell full-charge LiPo limit = 25.2 V." }
c_rating_cont   = { value = 95, unit = "C", src = "S1", fidelity = "datasheet" }
i_max_continuous = { value = 209.0, unit = "A", fidelity = "derived", derivation = "95 C x 2.2 Ah = 209 A (rating label only; the page lists no burst rating)." }
mass            = { value = 0.321, unit = "kg", src = "S1", fidelity = "datasheet" }          # 321 g (+-20 g)
mass_tol        = { value = 0.020, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.116, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.034, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.0385, unit = "m", src = "S1", fidelity = "datasheet" }
main_connector  = { value = "XT60", unit = "text", src = "S1", fidelity = "datasheet" }
discharge_wire_awg = { value = 12, unit = "AWG", src = "S1", fidelity = "datasheet" }
discharge_wire_length = { value = 0.065, unit = "m", src = "S1", fidelity = "datasheet" }
r_internal_pack = { value = 0.071, unit = "ohm", fidelity = "estimated", rationale = "Tattu publishes no internal resistance for this pack. Per-cell DC resistance scaled inversely with capacity, R_cell = 0.026 ohm*Ah / capacity (anchored to the 4-6 mOhm/cell at ~5 Ah used for the 5200 mAh Tattu in parts/drone/tattu-4s-5200mah-35c.toml): 0.026/2.2 = 11.8 mOhm/cell x 6 cells = 71 mOhm. Plus-or-minus 50%." }

[geometry]
shape = "box"
size = [0.058, 0.017, 0.01925]

[[ports]]
name = "power_out"
kind = "power"
type = "xt60"
gender = "neutral"
role = "source"
pins = ["OUT.1", "OUT.2"]
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell = 25.2 V." }
i_max = { value = 209.0, unit = "A", fidelity = "derived", derivation = "C rating x capacity = 95 C x 2.2 Ah = 209 A (S1 rating label); exceeds the XT60 connector's own continuous rating, which a DRC should flag." }

# Pin level: the main discharge plug, drawn on the +x face. S1 names the XT60 plug but not its polarity or contact spacing: + then -, 7.2 mm of the XT60 family. The balance lead has no published pinout and is not drawn.
[[connectors]]
id = "OUT"
name = "main discharge plug (XT60)"
type = "xt60"
gender = "neutral"
pos = [0.058, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "S1 names the XT60 plug but not its polarity or contact spacing: + then -, 7.2 mm of the XT60 family; pose on the pack's +x face."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "out", v = 25.2, note = "v = the port's full-charge v_max" },
  { number = 2, name = "BAT-", kind = "ground" },
]

# The 65 mm 12 AWG discharge lead itself (S1 'Discharge Wire Length 65 | Wire Gauge 12#'), the same net as the plug: further consumers are
# spliced onto it (the regulators of assemblies/hopper.toml), so its two conductors may carry several wires.
[[connectors]]
id = "LEAD"
name = "discharge lead splice point (12 AWG, 65 mm)"
joinable = true
type = "wire-lead"
gender = "neutral"
pos = [0.039, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the lead's length and gauge, not where a tap would go: any point of the bare lead between pack and plug is the same net as OUT; drawn at the plug end, + then -."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "out", v = 25.2, note = "same net as OUT.1" },
  { number = 2, name = "BAT-", kind = "ground", note = "same net as OUT.2" },
]

