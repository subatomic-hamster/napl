id = "kde-6213xf-185"
name = "KDE Direct KDE6213XF-185 brushless motor"
category = "motor.bldc"
vendor = "KDE Direct"
part_number = "KDE6213XF-185"
url = "https://www.kdedirect.com/products/kde6213xf-185"

# Part frame: origin at the centre of the mounting face, +z along the shaft towards the prop.
# Ports as a top-level inline-table array (TOML requires it before the first [table] header).
ports = [
  { name = "base_30_m4", kind = "mech", type = "bolt-circle.30.4.m4", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 4, note = "Estimated: S1 lists only 'M4 x ф 30 mm'; hole count 4 assumed (same circle on T-Motor drawings)." },
  { name = "base_40_m5", kind = "mech", type = "bolt-circle.40.4.m5", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 4, note = "Estimated: S1 lists only 'M5/M4 x ф 40 mm'; hole count 4 assumed (same circle on T-Motor drawings)." },
  { name = "shaft", kind = "mech", type = "shaft.4", gender = "male", pos = [0.0, 0.0, 0.0475], axis = [0.0, 0.0, 1.0], ref = [1.0, 0.0, 0.0], symmetry = 360, note = "Estimated: tip height = Motor Length 42 mm + Shaft Length 5.5 mm (S1); assumes the listed Motor Length excludes the protruding shaft." },
  { name = "phase", pins = ["PH.1", "PH.2", "PH.3"], kind = "power", type = "motor-3phase", gender = "neutral", role = "sink", v_max = { value = 52.2, unit = "V", fidelity = "derived", derivation = "12S x 4.35 V/cell (LiHV) = 52.2 V from the Voltage Range '22.2 V (6S LiPo) - 52.2 V (12S LiHV)' (S1)." }, i_max = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }, note = "i_max is the 180 s continuous current ('Maximum Continuous Current'); the motor needs 5 mph+ airflow for it (vendor footnote)" },
]

[params]
mass = { value = 0.415, unit = "kg", src = "S1", fidelity = "datasheet" }  # with wires/bullets
mass_no_cable = { value = 0.36, unit = "kg", src = "S1", fidelity = "datasheet" }  # motor only
kv = { value = 185, unit = "rpm/V", src = "S1", fidelity = "datasheet" }
kt = { value = 0.0516, unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # Kt (Motor Torque Constant)
km = { value = 0.1924, unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }  # Km (Motor Constant)
r_winding = { value = 0.072, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Rm phase-to-phase, delta wound
i0 = { value = 0.6, unit = "A", src = "S1", fidelity = "datasheet" }  # Io (@10V)
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Current (180 s)
p_max = { value = 2755.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Power (180 s)
cells_min = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }  # 22.2 V (6S LiPo) - 52.2 V (12S LiHV)
cells_max = { value = 12, unit = "S", src = "S1", fidelity = "datasheet" }
configuration = { value = "24 (24S28P, HE) / 28 (24S28P, HE)", unit = "text", src = "S1", fidelity = "datasheet" }  # stator poles / magnet poles
diameter = { value = 0.07, unit = "m", src = "S1", fidelity = "datasheet" }
length_body = { value = 0.042, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
j_rotor_bell = { value = 9.83e-05, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # Motor Rotor Inertia, kg*cm^2 x 1e-4

[tables.thrust_test]
# VALIDATION TARGET. KDE performance data sheet (xlsx), prop '21.5" x 7.3 TRIPLE-EDN (KDE)', 50.4V supply. All printed rows; thrust 'Thrust Output' columns in g and N as printed.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "torque_Nm", "efficiency_g_per_W"]
rows = [
  [25.0, 50.4, 3.3, 167.0, 2440, 16.93, 1726, 0.45, 10.32],
  [37.5, 50.4, 7.3, 366.0, 3260, 28.87, 2943, 0.82, 8.04],
  [50.0, 50.4, 12.8, 646.0, 4020, 40.39, 4117, 1.19, 6.38],
  [62.5, 50.4, 20.1, 1014.0, 4690, 54.21, 5526, 1.63, 5.45],
  [75.0, 50.4, 29.7, 1497.0, 5320, 69.45, 7079, 2.09, 4.73],
  [87.5, 50.4, 39.9, 2010.0, 5780, 83.46, 8507, 2.52, 4.23],
  [100.0, 50.4, 54.1, 2727.0, 6210, 97.24, 9913, 2.89, 3.64],
]
prop_label = "KDE 21.5 in x 7.3 TRIPLE-EDN (KDE)"
src = "S2"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.035, 0.02375]
pos = [0.0, 0.0, 0.02375]

# Pin level: three phase leads. S1 mentions only 'wires/bullets' in the listing mass: no gauge, length, connector or phase labels.
[[connectors]]
id = "PH"
name = "phase leads (3)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.035, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "S1 only says the listed mass includes 'wires/bullets': no gauge, length, connector or phase labels. Three phase leads drawn side by side at the base, 5 mm apart (large frame), phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 50.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 50.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 50.0 },
]

