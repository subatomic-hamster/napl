id = "kde-4012xf-400"
name = "KDE Direct KDE4012XF-400 brushless motor"
category = "motor.bldc"
vendor = "KDE Direct"
part_number = "KDE4012XF-400"
url = "https://www.kdedirect.com/products/kde4012xf-400"

# Part frame: origin at the centre of the mounting face, +z along the shaft towards the prop.
# Ports as a top-level inline-table array (TOML requires it before the first [table] header).
ports = [
  { name = "base_25_m4", kind = "mech", type = "bolt-circle.25.4.m4", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 4, note = "Estimated: S1 lists only 'M4/3 x ф 25 mm'; hole count 4 assumed (same circle on T-Motor drawings)." },
  { name = "base_32_m3", kind = "mech", type = "bolt-circle.32.3.m3", gender = "female", pos = [0.0, 0.0, 0.0], axis = [0.0, 0.0, -1.0], ref = [1.0, 0.0, 0.0], symmetry = 3, note = "Estimated: S1 lists only 'M3/2.5 x ф 32 mm'; hole count 3 assumed (same circle on T-Motor drawings)." },
  { name = "shaft", kind = "mech", type = "shaft.4", gender = "male", pos = [0.0, 0.0, 0.0355], axis = [0.0, 0.0, 1.0], ref = [1.0, 0.0, 0.0], symmetry = 360, note = "Estimated: tip height = Motor Length 30 mm + Shaft Length 5.5 mm (S1); assumes the listed Motor Length excludes the protruding shaft." },
  { name = "phase", pins = ["PH.1", "PH.2", "PH.3"], kind = "power", type = "motor-3phase", gender = "neutral", role = "sink", v_max = { value = 34.8, unit = "V", fidelity = "derived", derivation = "8S x 4.35 V/cell (LiHV) = 34.8 V from the Voltage Range '14.8 V (4S LiPo) - 34.8 V (8S LiHV)' (S1)." }, i_max = { value = 32.0, unit = "A", src = "S1", fidelity = "datasheet" }, note = "i_max is the 180 s continuous current ('Maximum Continuous Current'); the motor needs 5 mph+ airflow for it (vendor footnote)" },
]

[params]
mass = { value = 0.2, unit = "kg", src = "S1", fidelity = "datasheet" }  # with wires/bullets
mass_no_cable = { value = 0.145, unit = "kg", src = "S1", fidelity = "datasheet" }  # motor only
kv = { value = 400, unit = "rpm/V", src = "S1", fidelity = "datasheet" }
kt = { value = 0.0239, unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # Kt (Motor Torque Constant)
km = { value = 0.0844, unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }  # Km (Motor Constant)
r_winding = { value = 0.08, unit = "ohm", src = "S1", fidelity = "datasheet" }  # Rm phase-to-phase, delta wound
i0 = { value = 0.5, unit = "A", src = "S1", fidelity = "datasheet" }  # Io (@10V)
i0_voltage = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 32.0, unit = "A", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Current (180 s)
p_max = { value = 945.0, unit = "W", src = "S1", fidelity = "datasheet" }  # Maximum Continuous Power (180 s)
cells_min = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }  # 14.8 V (4S LiPo) - 34.8 V (8S LiHV)
cells_max = { value = 8, unit = "S", src = "S1", fidelity = "datasheet" }
configuration = { value = "18 (18S24P) / 24 (18S24P)", unit = "text", src = "S1", fidelity = "datasheet" }  # stator poles / magnet poles
diameter = { value = 0.0465, unit = "m", src = "S1", fidelity = "datasheet" }
length_body = { value = 0.03, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
j_rotor_bell = { value = 2.1e-05, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # Motor Rotor Inertia, kg*cm^2 x 1e-4

[tables.thrust_test]
# VALIDATION TARGET. KDE performance data sheet (xlsx), prop '15.5" x 5.3 DUAL-EDN (KDE)', 33.6V supply. All printed rows; thrust 'Thrust Output' columns in g and N as printed.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "thrust_N", "thrust_g", "torque_Nm", "efficiency_g_per_W"]
rows = [
  [25.0, 33.6, 2.2, 72.0, 3410, 6.92, 705, 0.14, 9.76],
  [37.5, 33.6, 4.4, 148.0, 4500, 11.64, 1187, 0.23, 8.03],
  [50.0, 33.6, 7.6, 256.0, 5500, 17.24, 1757, 0.31, 6.87],
  [62.5, 33.6, 12.0, 402.0, 6340, 23.18, 2363, 0.45, 5.88],
  [75.0, 33.6, 18.8, 632.0, 7430, 31.51, 3212, 0.6, 5.08],
  [87.5, 33.6, 25.3, 848.0, 8130, 37.88, 3862, 0.74, 4.55],
  [100.0, 33.6, 31.9, 1073.0, 8730, 44.05, 4491, 0.86, 4.19],
]
prop_label = "KDE 15.5 in x 5.3 DUAL-EDN (KDE)"
src = "S2"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.02325, 0.01775]
pos = [0.0, 0.0, 0.01775]

# Pin level: three phase leads. S1 mentions only 'wires/bullets' in the listing mass: no gauge, length, connector or phase labels.
[[connectors]]
id = "PH"
name = "phase leads (3)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.02325, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 only says the listed mass includes 'wires/bullets': no gauge, length, connector or phase labels. Three phase leads drawn side by side at the base, 3 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 32.0 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 32.0 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 32.0 },
]

