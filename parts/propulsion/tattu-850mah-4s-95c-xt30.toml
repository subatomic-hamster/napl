i_max = { value = 80.75, unit = "A", fidelity = "derived", derivation = "C rating x capacity = 95 C x 0.85 Ah = 80.75 A (S1 rating label); exceeds the XT30 connector's own continuous rating, which a DRC should flag." }

# Pin level: the main discharge plug, drawn on the +x face. S1 names the XT30 plug but not its polarity or contact spacing: + then -, 5.0 mm of the XT30 family. The balance lead has no published pinout and is not drawn.
