ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "S1 names the XT30 plug but not its polarity or contact spacing: + then -, 5.0 mm of the XT30 family; pose on the pack's +x face."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "out", v = 16.8, note = "v = the port's full-charge v_max" },
