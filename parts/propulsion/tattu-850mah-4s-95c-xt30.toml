# Part frame: origin at the pack centre, x along length (59 mm), y along width (30 mm), z up (30 mm). Pack-side connector gender is a modelling
# convention (neutral mates either). Internal resistance not published for this model: pack value estimated (rationale on r_internal_pack).

[params]
capacity_ah     = { value = 0.85, unit = "Ah", src = "S1", fidelity = "datasheet" }
capacity        = { value = 3060.0, unit = "C", fidelity = "derived", derivation = "0.85 Ah x 3600 s/h = 3060 C (coulombs)." }
cells_series    = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
cells_parallel  = { value = 1, unit = "1", src = "S1", fidelity = "datasheet" }
v_nominal       = { value = 14.8, unit = "V", src = "S1", fidelity = "datasheet" }
v_full          = { value = 16.8, unit = "V", fidelity = "derived", derivation = "4S x 4.2 V/cell full-charge LiPo limit = 16.8 V." }
c_rating_cont   = { value = 95, unit = "C", src = "S1", fidelity = "datasheet" }
c_rating_burst  = { value = 190, unit = "C", src = "S1", fidelity = "datasheet" }
i_max_continuous = { value = 80.75, unit = "A", fidelity = "derived", derivation = "95 C x 0.85 Ah = 80.75 A (rating label only)." }
mass            = { value = 0.104, unit = "kg", src = "S1", fidelity = "datasheet" }          # 104 g (+-20 g)
mass_tol        = { value = 0.020, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.059, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.030, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.030, unit = "m", src = "S1", fidelity = "datasheet" }
main_connector  = { value = "XT30", unit = "text", src = "S1", fidelity = "datasheet" }
discharge_wire_awg = { value = 16, unit = "AWG", src = "S1", fidelity = "datasheet" }
discharge_wire_length = { value = 0.045, unit = "m", src = "S1", fidelity = "datasheet" }
r_internal_pack = { value = 0.122, unit = "ohm", fidelity = "estimated", rationale = "Tattu publishes no internal resistance for this pack (the page only says R-Line has 'lower internal resistance'). Per-cell DC resistance scaled inversely with capacity, R_cell = 0.026 ohm*Ah / capacity (anchored to the 4-6 mOhm/cell at ~5 Ah used for the 5200 mAh Tattu in parts/drone/tattu-4s-5200mah-35c.toml): 0.026/0.85 = 30.6 mOhm/cell x 4 cells = 122 mOhm. Plus-or-minus 50%; racing-grade 95C cells probably sit below this." }

[geometry]
