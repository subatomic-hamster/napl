# Literature reference for C_T(J)/C_P(J) shape of an 8 in slow-flyer prop (pitch/D = 0.475; closest UIUC match to small 3-5 inch-class and
# ~8 in 2-blade plastic props). Tables transcribed from the UIUC .txt data files: static (J = 0, all 16 rows) and one advancing run at
# about 6018 rpm (all 17 rows). Shape reference only. No ports (reference data only).

