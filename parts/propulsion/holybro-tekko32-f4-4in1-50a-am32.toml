id = "holybro-tekko32-f4-4in1-50a-am32"
name = "Holybro Tekko32 F4 4-in-1 50A ESC (AM32), 30.5x30.5 stack"
category = "esc"
vendor = "Holybro"
part_number = "Tekko32 F4 4in1 50A (AM32)"
url = "https://www.readymaderc.com/products/details/87187-holybro-tekko32-f4-4in1-50a-esc-am32"

# Part frame: origin at the centre of the board underside, z up, +x toward the signal-connector edge (assumed). Mount pattern 30.5 x 30.5 mm.
# Retailer text calls the holes "M4 Holes with M3 Grommets" (4 mm PCB hole, M3 screw); the bolt-pattern type uses m3 to match flight controllers
# in parts/electronics. Motor pad / battery pad positions are not published, so those ports carry no pos.
# Burst duration is not stated by the retailer.

[params]
mass            = { value = 0.0138, unit = "kg", src = "S1", fidelity = "datasheet" }         # "Net Weight 13.8 grams"
length          = { value = 0.048, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.037, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.006, unit = "m", src = "S1", fidelity = "datasheet" }
cells_min       = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
v_min           = { value = 14.8, unit = "V", src = "S1", fidelity = "datasheet" }
v_max           = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_cont_per_ch   = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst_per_ch  = { value = 60.0, unit = "A", src = "S1", fidelity = "datasheet" }
channels        = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
mcu_clock       = { value = 1.5e8, unit = "Hz", src = "S1", fidelity = "datasheet" }
pwm_freq_min    = { value = 16000, unit = "Hz", src = "S1", fidelity = "datasheet" }
pwm_freq_max    = { value = 96000, unit = "Hz", src = "S1", fidelity = "datasheet" }
current_scale   = { value = 120, unit = "1", src = "S1", fidelity = "datasheet" }             # "Amperage Meter Scale Ratio: 120"
bec             = { value = "none", unit = "text", src = "S1", fidelity = "datasheet" }
firmware        = { value = "AM32", unit = "text", src = "S1", fidelity = "datasheet" }
cap_included    = { value = 1000e-6, unit = "F", src = "S1", fidelity = "datasheet" }         # 1000 uF 35 V low-ESR capacitor

[geometry]
shape = "box"
size = [0.024, 0.0185, 0.003]

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "30.5 x 30.5 mm per S1; 4 mm PCB hole, M3 screw with grommet"

[[ports]]
name = "power_in"
pins = ["BAT.1", "BAT.2"]
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 200.0, unit = "A", fidelity = "derived", derivation = "4 channels x 50 A continuous per channel (S1) = 200 A if all four run flat out; no total-input rating is published." }

[[ports]]
name = "motor_out_1"
pins = ["M1.1", "M1.2", "M1.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_2"
pins = ["M2.1", "M2.2", "M2.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_3"
pins = ["M3.1", "M3.2", "M3.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_4"
pins = ["M4.1", "M4.2", "M4.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 50.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "signal"
pins = ["SIG.5", "SIG.6", "SIG.7", "SIG.8", "SIG.4", "SIG.3"]   # M1 .. M4 DShot, CURRENT, GND
kind = "signal"
type = "dshot"
gender = "neutral"

# ---- Connectors (pin level). P2 (retailer page) lists the 8-pin 1 mm-pitch cables, a telemetry output pad, an analog current sensor and 'Solder/DIY'
# battery connection; it does not give the 8 pin functions. Their order is taken from the Holybro flight controller the ESC is sold with (P1:
# Kakute ESC port = B+, R7 (telemetry), GND, CURRENT, M1-M4), because the supplied cable is 8-pin to 8-pin. Pad positions are estimates.
[[connectors]]
id = "SIG"
name = "ESC signal port (8-pin, 1.0 mm)"
type = "jst-sh-8"
gender = "male"
pos = [0.0, 0.0145, 0.006]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 8
pitch = 0.001
src = "P1"
fidelity = "estimated"
rationale = "P2 gives an 8-pin, 1 mm pitch connector carrying M1-M4, current, ground, telemetry and VBAT but no order; the order is the Holybro Kakute ESC-port table (P1) that the supplied 8-pin to 8-pin cable mates to. Housing type (JST-SH) and position are assumed."
pins = [
  { number = 1, name = "B+", kind = "power", dir = "out", v_max = 25.2, note = "battery voltage to the FC (P1: 'Battery positive voltage (2S-8S)'); v_max 6S x 4.2 V (P2 4S-6S input)" },
  { number = 2, name = "TLM", kind = "signal", dir = "out", note = "ESC telemetry output (P2: 'Telemetry Output Pad'); the FC side is R7 (UART7 RX)" },
  { number = 3, name = "GND", kind = "ground" },
  { number = 4, name = "CURRENT", kind = "signal", dir = "out", note = "analog current sensor (P2), scale ratio 120" },
  { number = 5, name = "M1", kind = "signal", dir = "in", note = "motor 1 DShot input" },
  { number = 6, name = "M2", kind = "signal", dir = "in", note = "motor 2 DShot input" },
  { number = 7, name = "M3", kind = "signal", dir = "in", note = "motor 3 DShot input" },
  { number = 8, name = "M4", kind = "signal", dir = "in", note = "motor 4 DShot input" },
]

[[connectors]]
id = "BAT"
name = "battery solder pads (BAT+ / BAT-)"
type = "solder-pad-1x2"
gender = "neutral"
joinable = true
pos = [0.0, -0.0185, 0.003]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.008
src = "P2"
fidelity = "estimated"
rationale = "P2 says the battery connection is 'Solder/DIY' (no connector fitted); pad count is two, the layout (+ then -, 8 mm apart on the edge opposite the signal port) is assumed."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", v_max = 25.2, i_max = 200.0, fidelity = "derived", derivation = "v_max 6S x 4.2 V (S1 'Input Voltage Range 4S - 6S'); i_max 4 x 50 A continuous (S1)." },
  { number = 2, name = "BAT-", kind = "ground", i_max = 200.0, fidelity = "derived", derivation = "4 x 50 A continuous (S1)." },
]

[[connectors]]
id = "M1"
name = "motor 1 solder pads"
type = "solder-pad-1x3"
gender = "neutral"
joinable = true
pos = [0.017, -0.013, 0.003]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 gives 50 A continuous / 60 A burst per channel; the pad positions, the corner of motor 1 and the A B C labels are not published (conventions: swapping two phases reverses the motor)."
pins = [
  { number = 1, name = "A", kind = "power", dir = "out", i_max = 50.0 },
  { number = 2, name = "B", kind = "power", dir = "out", i_max = 50.0 },
  { number = 3, name = "C", kind = "power", dir = "out", i_max = 50.0 },
]

