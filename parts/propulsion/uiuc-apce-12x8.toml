cp_static_at_max_rpm = { value = 0.0447, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.746, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.473 in the 4991 rpm run

