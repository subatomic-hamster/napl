id = "tmotor-mn4004-kv300"
name = "T-Motor MN4004 KV300 Antigravity multirotor motor"
category = "motor.bldc"
vendor = "T-Motor"
part_number = "MN4004 KV300"
url = "https://store.tmotor.com/product/mn4004-kv300-motor-antigravity-type.html"

# Part frame: origin at the centre of the stator mounting face, z up toward the prop; body length 19 mm along +z.
# NOTE: S1 text prints "Shaft Diameter 40mm"; the S2 drawing shows O4 -> 4 mm used (same typo as the MN4006 page).
# The S1 spec table lists two variants (KV300 / KV400) with the same mass and size; KV300 values used here.

[params]
mass            = { value = 0.053, unit = "kg", src = "S1", fidelity = "datasheet" }          # 53 g incl. cable
kv              = { value = 300, unit = "rpm/V", src = "S1", fidelity = "datasheet" }
r_winding       = { value = 0.452, unit = "ohm", src = "S1", fidelity = "datasheet" }         # 452 mOhm
i0              = { value = 0.2, unit = "A", src = "S1", fidelity = "datasheet" }             # idle current at 22 V
i0_voltage      = { value = 22.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak          = { value = 9.0, unit = "A", src = "S1", fidelity = "datasheet" }             # 180 s
p_max           = { value = 216.0, unit = "W", src = "S1", fidelity = "datasheet" }           # 180 s
cells_min       = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
configuration   = { value = "18N24P", unit = "text", src = "S1", fidelity = "datasheet" }
diameter        = { value = 0.04435, unit = "m", src = "S1", fidelity = "datasheet" }         # Motor Dimensions 44.35 x 19 mm
length_body     = { value = 0.019, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter  = { value = 0.004, unit = "m", src = "S2", fidelity = "datasheet" }
mount_circle    = { value = 0.025, unit = "m", src = "S2", fidelity = "datasheet" }           # drawing "4-M3, O25"
mount_screw     = { value = "M3", unit = "thread", src = "S2", fidelity = "datasheet" }
prop_adapter_thread = { value = "M6", unit = "thread", src = "S2", fidelity = "datasheet" }
lead_length     = { value = 0.05, unit = "m", src = "S1", fidelity = "datasheet" }
kt              = { value = 0.031831, unit = "N*m/A", fidelity = "derived", derivation = "Kt = 60 / (2*pi*Kv) = 60 / (2*pi*300) = 0.031831 N*m/A." }

[tables.thrust_test]
# VALIDATION TARGET. Vendor bench test, T-MOTOR "15*5 CF" prop, 24 V (table header voltage). Rows 50-100 % throttle as printed.
# Vendor columns: Current(A), Power(W), RPM, Torque(N*m), Thrust(g), Efficiency(g/W); thrust_N = thrust_g * 0.00980665. Temperature 56 C.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "torque_Nm", "thrust_N", "thrust_g", "efficiency_g_per_W"]
rows = [
  [50, 24, 1.4, 34, 2860, 0.09, 4.6484, 474, 14.11],
  [55, 24, 1.9, 46, 3108, 0.11, 5.5015, 561, 12.3],
  [60, 24, 2.3, 55, 3336, 0.12, 6.3351, 646, 11.7],
  [65, 24, 2.8, 67, 3540, 0.14, 7.1294, 727, 10.82],
  [75, 24, 4, 96, 3966, 0.17, 9.0025, 918, 9.56],
  [85, 24, 5.6, 134, 4383, 0.2, 10.8854, 1110, 8.26],
  [100, 24, 7.5, 180, 4711, 0.24, 12.8565, 1311, 7.28],
]
prop_label = "T-MOTOR 15*5 CF"
prop = "tmotor-ns15x5"
src = "S1"
fidelity = "datasheet"

