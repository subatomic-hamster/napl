# Literature reference for C_T(J)/C_P(J) of a 13 in x 6.5 in APC Thin Electric prop (pitch/D = 0.50). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 14 rows) and one advancing run at about 4988 rpm (all 16 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

