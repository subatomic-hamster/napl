# Literature reference for C_T(J)/C_P(J) of a 14 in x 7 in APC Thin Electric prop (pitch/D = 0.50). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 14 rows) and one advancing run at about 5015 rpm (all 16 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

[params]
diameter  = { value = 0.3556, unit = "m", src = "S1", fidelity = "literature" }      # 14 in (list value)
pitch     = { value = 0.1778, unit = "m", src = "S1", fidelity = "literature" }      # 7 in per revolution
rpm_static_min = { value = 980, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 7480, unit = "rpm", src = "S2", fidelity = "literature" }
ct_static_at_max_rpm = { value = 0.1003, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_max_rpm = { value = 0.0312, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.719, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.430 in the 5015 rpm run

