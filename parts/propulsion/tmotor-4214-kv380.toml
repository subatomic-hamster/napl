id = "tmotor-4214-kv380"
name = "T-Motor 4214 KV380 heavy-lift multirotor motor (15-inch class)"
category = "motor.bldc"
vendor = "T-Motor"
part_number = "4214 KV380"
url = "https://uav-en.tmotor.com/2026/Motor_0126/1339.html"

# Part frame: origin at the centre of the stator mounting face, z up toward the prop. "Motor Dimension 49 x 58.95 mm" is used as
# diameter x length; the source does not say whether the 58.95 mm includes the shaft stub (inference - verify before stack-up use).
# The page covers KV380 and KV400 (separate tables); KV380 values and the C15*8*3 table used here.
# Source page is T-Motor's UAV motor spec sheet (title "Technical Drawing"); the test uses T-Motor C15*8*3 (3-blade 15-inch).

[params]
mass            = { value = 0.2112, unit = "kg", src = "S1", fidelity = "datasheet" }         # 211.2 g incl. cable
kv              = { value = 380, unit = "rpm/V", src = "S1", fidelity = "datasheet" }
r_winding       = { value = 0.0633, unit = "ohm", src = "S1", fidelity = "datasheet" }        # 63.3 mOhm
i0              = { value = 1.3, unit = "A", src = "S1", fidelity = "datasheet" }             # Idle Current (10V)
i0_voltage      = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak          = { value = 48.74, unit = "A", src = "S1", fidelity = "datasheet" }
p_max           = { value = 1058.0, unit = "W", src = "S1", fidelity = "datasheet" }
thrust_max      = { value = 55.31, unit = "N", src = "S1", fidelity = "datasheet" }           # "Max Thrust 5.64kg" x 9.80665
cells_min       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 12, unit = "S", src = "S1", fidelity = "datasheet" }
configuration   = { value = "12N14P", unit = "text", src = "S1", fidelity = "datasheet" }
diameter        = { value = 0.049, unit = "m", src = "S1", fidelity = "datasheet" }
length_body     = { value = 0.05895, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_diameter  = { value = 0.006, unit = "m", src = "S1", fidelity = "datasheet" }
mount_circle    = { value = 0.030, unit = "m", src = "S1", fidelity = "datasheet" }           # "Screw Diameter Φ30-M4-4"
mount_screw     = { value = "M4", unit = "thread", src = "S1", fidelity = "datasheet" }
prop_adapter_thread = { value = "M6", unit = "thread", src = "S1", fidelity = "datasheet" }
lead_length     = { value = 0.4, unit = "m", src = "S1", fidelity = "datasheet" }             # 14AWG x 400 mm
kt              = { value = 0.025130, unit = "N*m/A", fidelity = "derived", derivation = "Kt = 60 / (2*pi*Kv) = 60 / (2*pi*380) = 0.025130 N*m/A." }

[tables.thrust_test]
# VALIDATION TARGET. Vendor bench test, T-MOTOR C15*8*3 prop, ~29 V (per-row voltage as printed). All 10 printed rows (10-100 %).
# Operating temperature 35 C. Vendor columns: Current(A), RPM, Thrust(g), Power(W), Efficiency(g/W), Torque(N*m); thrust_N = thrust_g * 0.00980665.
columns = ["throttle_pct", "voltage_V", "current_A", "power_W", "rpm", "torque_Nm", "thrust_N", "thrust_g", "efficiency_g_per_W"]
rows = [
  [10, 29.63, 0.17, 2, 894, 0.02, 0.5688, 58, 34.38],
  [20, 29.62, 0.81, 15, 1846, 0.08, 2.7655, 282, 18.5],
  [30, 29.6, 2.25, 50, 2751, 0.17, 6.7077, 684, 13.64],
  [40, 29.55, 4.79, 111, 3598, 0.3, 11.8562, 1209, 10.85],
  [50, 29.48, 8.55, 200, 4383, 0.44, 17.8089, 1816, 9.07],
  [60, 29.39, 13.63, 318, 5109, 0.59, 24.497, 2498, 7.86],
  [70, 29.27, 20.13, 466, 5791, 0.77, 31.7735, 3240, 6.95],
  [80, 29.13, 27.82, 635, 6403, 0.95, 39.2266, 4000, 6.3],
  [90, 28.96, 37.31, 834, 6990, 1.14, 47.1308, 4806, 5.76],
  [100, 28.75, 48.74, 1058, 7538, 1.34, 55.3193, 5641, 5.33],
]
prop_label = "T-MOTOR C15*8*3"
src = "S1"
fidelity = "datasheet"

[geometry]
shape = "cylinder"
size = [0.0245, 0.029475]

[[ports]]
name = "base"
kind = "mech"
type = "bolt-circle.30.4.m4"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4

[[ports]]
name = "shaft"
kind = "mech"
ref = [1.0, 0.0, 0.0]  # any unit vector perpendicular to the axis (+z)
symmetry = 360  # round shaft: axisymmetric, as holybro-2216-kv920
type = "shaft.6"
gender = "male"
pos = [0.0, 0.0, 0.05895]
axis = [0.0, 0.0, 1.0]

[[ports]]
name = "phase"
pins = ["PH.1", "PH.2", "PH.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "sink"
v_max = { value = 50.4, unit = "V", fidelity = "derived", derivation = "12S x 4.2 V/cell = 50.4 V (upper end of the 6-12S rated range, S1)." }
i_max = { value = 48.74, unit = "A", src = "S1", fidelity = "datasheet" }

# Pin level: three 14 AWG phase leads, 400 mm (S1 'Lead|14AWG*400mm'; the listing names no connector, so they are bare / solder ends).
# Lead exit and phase naming are conventions, as for the other outrunners in the library (no drawing carries them).
[[connectors]]
id = "PH"
name = "phase leads (3 x 14 AWG, 400 mm)"
type = "wire-lead"
port_type = "motor-3phase"
gender = "neutral"
joinable = true
pos = [0.0, -0.0245, 0.004]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the lead gauge and length (14AWG*400mm), not a connector, lead positions or phase labels: leads drawn side by side at the base, 3 mm apart, phases A B C by convention."
pins = [
  { number = 1, name = "A", kind = "power", dir = "in", i_max = 48.74 },
  { number = 2, name = "B", kind = "power", dir = "in", i_max = 48.74 },
  { number = 3, name = "C", kind = "power", dir = "in", i_max = 48.74 },
]

