cp_static_at_max_rpm = { value = 0.0364, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.787, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.446 in the 2953 rpm run

