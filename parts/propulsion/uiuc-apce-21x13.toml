# Literature reference for C_T(J)/C_P(J) of a 21 in x 13 in APC Thin Electric prop (pitch/D = 0.62). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 7 rows) and one advancing run at about 2953 rpm (all 14 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only). UIUC volume 4 notes that coefficients use the true prop diameter, which can differ from the list value.

[params]
diameter  = { value = 0.5334, unit = "m", src = "S1", fidelity = "literature" }      # 21 in (list value)
pitch     = { value = 0.3302, unit = "m", src = "S1", fidelity = "literature" }      # 13 in per revolution
rpm_static_min = { value = 1053, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 3940, unit = "rpm", src = "S2", fidelity = "literature" }
