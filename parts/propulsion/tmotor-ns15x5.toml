id = "tmotor-ns15x5"
name = "T-Motor NS15x5 carbon-fibre propeller (15x5 in, 2-blade)"
category = "prop"
vendor = "T-Motor"
part_number = "NS15*5"
url = "https://store.tmotor.com/product/ns15x5-prop-uav-carbon-fiber.html"

# Part frame: origin at the hub centre on the blade mid-plane, z up (thrust direction). The bore faces down (-z) toward the motor.
# Mass: the spec table labels the weight "Weight(Single Blade) 13g" while the model is "2blades integrated"; it is read here as the
# weight of one propeller (inference - if it is per blade the true prop mass is double). No C_T/C_P curve is published by T-Motor;
# T-Motor's motor test tables use props labelled "15*5 CF"/"P15*5 CF" (matched to this NS15*5 by size - naming is an inference);
# for J-shape use the uiuc-apce-* reference parts.

[params]
diameter    = { value = 0.3811, unit = "m", src = "S1", fidelity = "datasheet" }
pitch       = { value = 0.127, unit = "m", src = "S1", fidelity = "datasheet" }              # 5 in
blade_count = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }                  # "2blades integrated"
mass        = { value = 0.013, unit = "kg", src = "S1", fidelity = "datasheet" }
material    = { value = "CF+Epoxy", unit = "text", src = "S1", fidelity = "datasheet" }
bore_diameter = { value = 0.006, unit = "m", src = "S2", fidelity = "datasheet" }            # drawing O6 centre hole
thrust_rec_min = { value = 7.845, unit = "N", src = "S1", fidelity = "datasheet" }          # 0.8 kg x 9.80665
thrust_rec_max = { value = 17.652, unit = "N", src = "S1", fidelity = "datasheet" }         # 1.8 kg x 9.80665
rpm_rec_min = { value = 4000, unit = "rpm", src = "S1", fidelity = "datasheet" }
rpm_rec_max = { value = 5900, unit = "rpm", src = "S1", fidelity = "datasheet" }
thrust_limit = { value = 39.227, unit = "N", src = "S1", fidelity = "datasheet" }           # "Recommended Max Thrust 4kg" x 9.80665
rpm_limit   = { value = 8750, unit = "rpm", src = "S1", fidelity = "datasheet" }
j_prop      = { value = 1.573e-4, unit = "kg*m^2", fidelity = "derived", derivation = "Slender uniform rod about its midpoint: J = m*L^2/12 = 0.013*0.3811^2/12 = 1.573e-4 kg*m^2. Mass is concentrated nearer the hub in real blades, so the true J is likely lower; treat as an upper bound." }

[geometry]
shape = "cylinder"
size = [0.19055, 0.0059]       # disc envelope: radius D/2, half of the 11.8 mm drawing height

[[ports]]
name = "hub"
kind = "mech"
ref = [1.0, 0.0, 0.0]  # along a blade (+x), as holybro-1045-prop
symmetry = 1  # a blade direction, but the prop spins freely about z (builder uses a hinge, not k), as holybro-1045-prop
type = "bore.6"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]

