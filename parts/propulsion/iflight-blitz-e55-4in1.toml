id = "iflight-blitz-e55-4in1"
name = "iFlight BLITZ E55 4-in-1 2-6S ESC (G2), 30.5x30.5 stack"
category = "esc"
vendor = "iFlight"
part_number = "BLITZ E55 4-IN-1 (G2)"
url = "https://rcdrone.top/products/iflight-blitz-e55-4-in-1-2-6s-esc"

# Part frame: origin at the centre of the board underside, z up, +x toward the signal-connector edge (assumed). Mount pattern 30.5 x 30.5 mm,
# listed as "Φ4mm" holes; bolt-pattern type uses m3 (standard M3 screw + grommet) to match flight controllers in parts/electronics.
# Listing gives "Size 30.5*30.5mm" only (no thickness), so the box geometry uses an assumed 6 mm height. Pad positions unpublished: no pos on power ports.
# "Current rate: 200" is iFlight's current-sensor scale entry; its unit is not stated, kept as a bare number.

[params]
mass            = { value = 0.0153, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.0305, unit = "m", src = "S1", fidelity = "datasheet" }          # "Size 30.5*30.5mm"
width           = { value = 0.0305, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.006, unit = "m", fidelity = "estimated", rationale = "Listing publishes no board thickness; ~6 mm assumed from the stated 4-in-1 30.5 mm ESC class (Tekko32 4-in-1 is 6 mm, parts/propulsion/holybro-tekko32-f4-4in1-50a-am32.toml S1)." }
cells_min       = { value = 2, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
i_cont_per_ch   = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst_per_ch  = { value = 65.0, unit = "A", src = "S1", fidelity = "datasheet" }
channels        = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
mcu             = { value = "G071", unit = "text", src = "S1", fidelity = "datasheet" }
bec             = { value = "none", unit = "text", src = "S1", fidelity = "datasheet" }
current_rate    = { value = 200, unit = "1", src = "S1", fidelity = "datasheet" }

[geometry]
shape = "box"
size = [0.01525, 0.01525, 0.003]
pos = [0.0, 0.0, 0.003]   # box centre 3 mm above the base plane: the board spans z = 0 .. 0.006 (origin = underside, header)

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "30.5 x 30.5 mm per S1; 4 mm hole, M3 screw with grommet assumed (inference)"

[[ports]]
name = "stack_top"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.006]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "Seat for the next board of the stack (flight controller) on the same 30.5 x 30.5 pattern, at the board top face (height 0.006 m, estimated above). A real stack separates boards with ~20 mm standoffs that this model does not carry: the gap and the standoff mass are not modelled (added so a FC can be mated to an ESC at all; the part had a bottom seat only)."

[[ports]]
name = "power_in"
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "6S x 4.2 V/cell = 25.2 V (upper end of 'Supports 2-6S lipo input', S1)." }
i_max = { value = 220.0, unit = "A", fidelity = "derived", derivation = "4 channels x 55 A constant per channel (S1) = 220 A; no total-input rating is published." }
pins = ["BAT.1", "BAT.2"]

[[ports]]
name = "motor_out_1"
pins = ["M1.1", "M1.2", "M1.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_2"
pins = ["M2.1", "M2.2", "M2.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_3"
pins = ["M3.1", "M3.2", "M3.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out_4"
pins = ["M4.1", "M4.2", "M4.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "Output follows battery input, 6S x 4.2 V = 25.2 V." }
i_max = { value = 55.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "signal"
pins = ["FC.5", "FC.6", "FC.7", "FC.8", "FC.9", "FC.1"]   # M1 .. M4 DShot, CUR current sense, GND
kind = "signal"
type = "dshot"
gender = "neutral"

# ---- Connectors (pin level). The FC connector's ten positions are the only pinout published for this ESC (S2, a hands-on review quoting the
# board: 'GND, GND, VBAT, VBAT, M1, M2, M3, M4, CUR, and NC'; iFlight's own wiring-diagram PDF could not be retrieved). The review says
# 'motor pads on each corner'; the battery pads and the order of the three pads per motor are not published, so they are estimates
# (S1 only states the 'Power cables & ESC signal wires' in the box). Poses are on the 30.5 mm hole pattern.
[[connectors]]
id = "FC"
name = "FC connector (10 positions)"
type = "header-1x10"
gender = "male"
pos = [0.0, 0.0125, 0.006]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 10
pitch = 0.00125
src = "S2"
fidelity = "literature"
pose_rationale = "Estimated: S2 puts the connector on the side with the 470 uF capacitor, left to right; the housing type and pitch are not stated (1.25 mm assumed)."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "GND", kind = "ground" },
  { number = 3, name = "VBAT", kind = "power", dir = "out", v_max = 25.2, note = "battery rail passed to the FC; 2-6S (S1)" },
  { number = 4, name = "VBAT", kind = "power", dir = "out", v_max = 25.2 },
  { number = 5, name = "M1", kind = "signal", dir = "in", note = "DShot150/300/600 motor 1 signal (S1)" },
  { number = 6, name = "M2", kind = "signal", dir = "in" },
  { number = 7, name = "M3", kind = "signal", dir = "in" },
  { number = 8, name = "M4", kind = "signal", dir = "in" },
  { number = 9, name = "CUR", kind = "signal", dir = "out", note = "current sensor output ('Current sensor: Yes', S1)" },
  { number = 10, name = "NC", kind = "nc" },
]

[[connectors]]
id = "BAT"
name = "battery solder pads (BAT+ / BAT-)"
type = "solder-pad-1x2"
gender = "neutral"
pos = [0.0, -0.0125, 0.003]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.006
src = "S1"
fidelity = "estimated"
rationale = "S1 states the supply range and that power cables are included, nothing on the pad layout: two pads, + then -, on the edge opposite the FC connector, 6 mm apart."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", v_max = 25.2, i_max = 220.0, note = "2-6S LiPo (S1)" },
  { number = 2, name = "BAT-", kind = "ground", i_max = 220.0 },
]

