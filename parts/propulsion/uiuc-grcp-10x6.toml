id = "uiuc-grcp-10x6"
name = "Graupner CAM Prop 10x6 propeller - UIUC wind-tunnel C_T/C_P data (reference)"
category = "prop.reference"
vendor = "Graupner (propeller); data: UIUC Propeller Data Site (Selig et al.)"
part_number = "grcp_10x6"
url = "https://m-selig.ae.illinois.edu/props/volume-1/propDB-volume-1.html"

# Literature reference for C_T(J)/C_P(J) of a 10 in x 6 in Graupner CAM Prop prop (pitch/D = 0.60). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 16 rows) and one advancing run at about 4999 rpm (all 10 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only).

[params]
diameter  = { value = 0.254, unit = "m", src = "S1", fidelity = "literature" }      # 10 in (list value)
pitch     = { value = 0.1524, unit = "m", src = "S1", fidelity = "literature" }      # 6 in per revolution
rpm_static_min = { value = 1987, unit = "rpm", src = "S2", fidelity = "literature" }
