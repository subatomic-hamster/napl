cp_static_at_max_rpm = { value = 0.0404, unit = "1", src = "S2", fidelity = "literature" }
eta_max_approx = { value = 0.604, unit = "1", src = "S3", fidelity = "literature" }   # at J = 0.488 in the 4999 rpm run

