url = "https://www.qx-motor.com/products/80mm-ducted-fan-edf-jet-12-blade-cw-ccw-with-qx-motor-6s-12s-motor-engine-power-120a-esc-for-fms-freewing-rc-airplane-model"

# The motor of the 80 mm 12-blade ducted fan sold as one set (parts/propulsion/qx-80mm-12-blade-edf-fan, -duct). Part frame: origin at the centre of the
# rear mounting face, +z along the shaft towards the fan; the can spans z = 0 .. 0.038 (the '3538' length by naming convention, estimated), the shaft
# stub ends at 0.043. Only kv, mass, diameter, shaft, configuration and the maximum current / power are published by the vendor; the winding
# resistance, no-load current and rotor inertia are estimates (tagged below). The vendor's throttle table (qx-80mm-12-blade-edf-fan) constrains
# them together with the fan.

[visual]
rationale = "Inrunner can inside the duct (hidden when the duct is opaque); the generic brushless-motor family is drawn at the part's diameter and length."

[[visual.elements]]
gen = "bldc_outrunner"

[params]
mass          = { value = 0.335, unit = "kg", src = "S1", fidelity = "datasheet" }        # "Weight 335g"
kv            = { value = 2000, unit = "rpm/V", src = "S1", fidelity = "datasheet" }       # "KV (rpm) 2000KV"
diameter      = { value = 0.035, unit = "m", src = "S1", fidelity = "datasheet" }          # "Motor diameter 35mm"
length_body   = { value = 0.038, unit = "m", fidelity = "estimated", rationale = "The vendor lists no motor length. '3538' follows the usual stator diameter x length naming of hobby motors (35 mm x 38 mm); the can may be a little longer than the stator. Not verified against a teardown." }
shaft_diameter = { value = 0.005, unit = "m", src = "S1", fidelity = "datasheet" }         # "Shaft diameter 5.0mm"
poles_config  = { value = "12N10P", unit = "text", src = "S1", fidelity = "datasheet" }
p_max_cont    = { value = 2800.0, unit = "W", src = "S1", fidelity = "datasheet" }         # "Max continuous power/10S 2800W" (the column header is the vendor's, see the note on S1)
i_max_cont    = { value = 112.0, unit = "A", src = "S1", fidelity = "datasheet" }          # "Max continuous current/10S 112A"
esc_recommended = { value = 120.0, unit = "A", src = "S1", fidelity = "datasheet" }        # "Recommended ESC 120A"
kt            = { value = 0.0047746, unit = "N*m/A", fidelity = "derived", derivation = "Kt = 60 / (2 pi Kv) = 60 / (2 pi 2000) = 0.0047746 N*m/A (SI torque constant equals 1/Kv with Kv in rad/s per V)." }
r_winding     = { value = 0.010, unit = "ohm", fidelity = "estimated", rationale = "Not published. 10 mOhm line-to-line (the DC-equivalent winding resistance of the device model) is the order of 35 mm 12N10P 2000 KV inrunners; it is the one free parameter of the vendor's throttle table, because at 105 A the I R drop of 1.05 V moves the fan speed 4.6 % and so the derived C_T by 9 % (qx-80mm-12-blade-edf-fan, derivation of ct_static). +-30 %." }
i0            = { value = 2.0, unit = "A", fidelity = "estimated", rationale = "Not published. Bearing and iron loss of a 35 mm inrunner at 24 V: 1.5-3 A (the fan's windage is in the fan's C_Q, not here). Unverified; 2 A x 22 V = 44 W is 1.8 % of the 2.5 kW full-throttle input, so the throttle table cannot resolve it." }
j_rotor_bell  = { value = 4.0e-6, unit = "kg*m^2", fidelity = "estimated", rationale = "Not published. Inrunner rotor (magnet sleeve + shaft, ~55 g at an effective radius of 8.5 mm: 1/2 m r^2 = 2.0e-6, doubled for the sleeve and balancing disc). The fan carries ten times this inertia (qx-80mm-12-blade-edf-fan)." }

