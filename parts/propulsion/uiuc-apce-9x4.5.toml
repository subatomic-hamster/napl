# Literature reference for C_T(J)/C_P(J) shape of a 9 in thin-electric prop (pitch/D = 0.5). Tables transcribed from the UIUC .txt data files:
# static (J = 0, C_T and C_P vs rpm, all 16 rows) and one advancing run at about 6018 rpm (all 17 rows). Use only as a shape reference
# for similar mass-produced props; it is not a measurement of any specific part. No ports (reference data only).

