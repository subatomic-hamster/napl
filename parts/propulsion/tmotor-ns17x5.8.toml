id = "tmotor-ns17x5.8"
name = "T-Motor NS17x5.8 carbon-fibre propeller (17x5.8 in, 2-blade)"
category = "prop"
vendor = "T-Motor"
part_number = "NS17*5.8"
url = "https://store.tmotor.com/product/ns17x5_8-prop-uav-carbon-fiber.html"

# Part frame: origin at the hub centre on the blade mid-plane, z up (thrust direction). The bore faces down (-z) toward the motor.
# Mass: the spec table labels the weight "Weight(Single Blade) 16.5g" while the model is "2blades integrated"; it is read here as the
# weight of one propeller (inference - if it is per blade the true prop mass is double). No C_T/C_P curve is published by T-Motor;
# T-Motor's motor test tables use props labelled "P17*5.8 CF"/"17*5.8 CF" (matched to this NS17*5.8 by size - naming is an inference);
# for J-shape use the uiuc-apce-* reference parts.

[params]
diameter    = { value = 0.432, unit = "m", src = "S1", fidelity = "datasheet" }
pitch       = { value = 0.1473, unit = "m", src = "S1", fidelity = "datasheet" }             # 5.8 in
blade_count = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }                  # "2blades integrated"
mass        = { value = 0.0165, unit = "kg", src = "S1", fidelity = "datasheet" }
material    = { value = "CF+Epoxy", unit = "text", src = "S1", fidelity = "datasheet" }
bore_diameter = { value = 0.006, unit = "m", src = "S2", fidelity = "datasheet" }            # drawing O6 centre hole
thrust_rec_min = { value = 10.787, unit = "N", src = "S1", fidelity = "datasheet" }         # 1.1 kg x 9.80665
thrust_rec_max = { value = 29.420, unit = "N", src = "S1", fidelity = "datasheet" }         # 3.0 kg x 9.80665
rpm_rec_min = { value = 3800, unit = "rpm", src = "S1", fidelity = "datasheet" }
rpm_rec_max = { value = 6500, unit = "rpm", src = "S1", fidelity = "datasheet" }
thrust_limit = { value = 58.840, unit = "N", src = "S1", fidelity = "datasheet" }           # "Recommended Max Thrust 6.0kg" x 9.80665
rpm_limit   = { value = 8600, unit = "rpm", src = "S1", fidelity = "datasheet" }
j_prop      = { value = 2.566e-4, unit = "kg*m^2", fidelity = "derived", derivation = "Slender uniform rod about its midpoint: J = m*L^2/12 = 0.0165*0.432^2/12 = 2.566e-4 kg*m^2. Mass is concentrated nearer the hub in real blades, so the true J is likely lower; treat as an upper bound." }

[geometry]
shape = "cylinder"
size = [0.216, 0.00685]        # disc envelope: radius D/2, half of the 13.7 mm drawing height

[[ports]]
name = "hub"
kind = "mech"
ref = [1.0, 0.0, 0.0]  # along a blade (+x), as holybro-1045-prop
symmetry = 1  # a blade direction, but the prop spins freely about z (builder uses a hinge, not k), as holybro-1045-prop
type = "bore.6"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]

