# ---- Connectors (pin level). S1: 'Plug: Φ3.5mmx3' (three 3.5 mm bullets on the motor side) and 'BEC: None'; the battery side is bare leads (long
# cable, gauge unstated) and the throttle lead is not described. Leads are drawn at the ends (battery in on -x, motor and throttle out on +x).
[[connectors]]
id = "IN"
name = "battery leads"
type = "wire-lead"
gender = "neutral"
joinable = true
pos = [-0.034, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.008
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the 2-6S range and 'Plug' only; two leads (+, -) are implied by a DC supply input, gauge and exit end are not published."
pins = [
  { number = 1, name = "BAT+ (red)", kind = "power", dir = "in", v_max = 25.2, i_max = 40.0, fidelity = "derived", derivation = "v_max 6S x 4.2 V (S1 'Lipo 2-6S'); i_max the 40 A continuous rating (S1)." },
  { number = 2, name = "BAT- (black)", kind = "ground", i_max = 40.0, fidelity = "derived", derivation = "The 40 A continuous rating (S1)." },
]

[[connectors]]
id = "MOT"
name = "3.5 mm bullet plugs x3"
type = "bullet-3.5mm-x3"
port_type = "motor-3phase"
gender = "male"
pos = [0.034, 0.0, 0.0]
