# Single-motor multicopter ESC. Part frame: origin at the body centre, x along length (68 mm), z up. No mounting holes (zip-tie / adhesive fitted on an
# arm), so no mech port. Listing is the APAC version, resold on AliExpress via rcdrone.top; specs below are the manufacturer lines on that page.
# Motor connector: three 3.5 mm bullets. Battery input is bare wires on the listing ("long cable").

