rows = 1
cols = 2
pitch = 0.0025
src = "S1"
fidelity = "estimated"
rationale = "S1 describes no throttle lead. A throttle signal + ground pair is the minimum a PWM input needs; with 'BEC: None' (S1) there is no +5 V conductor to list."
