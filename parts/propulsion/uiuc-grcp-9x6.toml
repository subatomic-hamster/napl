# Literature reference for C_T(J)/C_P(J) of a 9 in x 6 in Graupner CAM Prop prop (pitch/D = 0.67). Tables transcribed from the UIUC .txt files, rounded to 4 decimals (3 for J, eta):
# static (J = 0, C_T and C_P vs rpm, all 16 rows) and one advancing run at about 5002 rpm (all 9 rows). Shape reference for similar mass-produced props, not a measurement of any specific
# part. No mass or ports (reference data only).

