c_rating_cont   = { value = 75, unit = "C", src = "S1", fidelity = "datasheet" }
c_rating_burst  = { value = 150, unit = "C", src = "S1", fidelity = "datasheet" }
i_max_continuous = { value = 135.0, unit = "A", fidelity = "derived", derivation = "75 C x 1.8 Ah = 135 A (rating label only)." }
