# ---- Connectors (pin level). S1: 12 AWG x 130 mm red/black input wires with an XT60 soldered on, 'No wires but solder tabs' for the outputs, a
# 5 V / 0.6 A BEC. The signal harness is not documented for this board; the pin names and order are those of the sibling XRotor Micro 45A
# manual (P1: GND, BAT, CRT, GND, 5V, S1-S4, minus the 10 V BEC pin). Positions are estimates.
[[connectors]]
id = "BAT"
name = "XT60 on 12 AWG x 130 mm input wires"
type = "xt60"
gender = "male"
pos = [0.0, -0.021, 0.0033]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "datasheet"
pose_rationale = "S1 states the XT60 with wires soldered on and the wire gauge/length; the exit edge is estimated, the XT60 contact pitch (7.2 mm) is the family's. The listing does not state the plug gender: male (the load side of the XT60 pair) is assumed."
pins = [
  { number = 1, name = "BAT+ (red)", kind = "power", dir = "in", v_max = 25.2, i_max = 260.0, fidelity = "derived", derivation = "v_max: 6S x 4.2 V (S1 'LiPo power input 3S-6S'); i_max: 4 x 65 A continuous (S1) if all four run flat out." },
  { number = 2, name = "BAT- (black)", kind = "ground", i_max = 260.0, fidelity = "derived", derivation = "4 x 65 A continuous (S1)." },
]

