# Part frame: origin at the centre of the ESC body's underside, z up; body 43.5 x 20 x 8.5 mm (L along x, W along y). Single-channel board
# with solder pads (no mounting holes in the spec); pad positions unpublished, so ports carry no pos.
# NOTE: the older iFlight listing (iflight-blitz-e80) gives Size 40*17mm; the newer spec table (S1, used here) gives 43.5*20*8.5mm.

[params]
