id = "tmotor-air-20a-4s"
name = "T-Motor AIR 20A 3-4S multirotor ESC (AIR Gear 355 set)"
category = "esc"
vendor = "T-Motor"
part_number = "AIR 20A"
url = "https://store.tmotor.com/product/air-20a-4s-esc.html"

# Part frame: origin at the centre of the ESC body's underside, z up; body 53 x 22 x 7 mm (L along x, W along y). Single-channel ESC with
# wire leads (no mounting holes): power in on the -x end, motor out (3.5 mm banana plugs) and signal on the +x end - positions not published,
# so ports carry no pos. Specs are read from the AIR Gear 355 combo page (the standalone product page lists no spec table in its text).
# Firmware/protocol name is not stated; "Throttle Signal Frequency 50Hz-600Hz" is a PWM-type throttle input.

[params]
mass            = { value = 0.021, unit = "kg", src = "S1", fidelity = "datasheet" }          # incl. cable
length          = { value = 0.053, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.022, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.007, unit = "m", src = "S1", fidelity = "datasheet" }
cells_min       = { value = 3, unit = "S", src = "S1", fidelity = "datasheet" }
cells_max       = { value = 4, unit = "S", src = "S1", fidelity = "datasheet" }
i_cont          = { value = 20.0, unit = "A", src = "S1", fidelity = "datasheet" }
i_burst         = { value = 30.0, unit = "A", src = "S1", fidelity = "datasheet" }            # peak, 10 s
burst_duration  = { value = 10.0, unit = "s", src = "S1", fidelity = "datasheet" }
bec             = { value = "none", unit = "text", src = "S1", fidelity = "datasheet" }       # BEC "/"
throttle_freq_min = { value = 50, unit = "Hz", src = "S1", fidelity = "datasheet" }
throttle_freq_max = { value = 600, unit = "Hz", src = "S1", fidelity = "datasheet" }
firmware_protocol = { value = "PWM throttle, 50-600 Hz", unit = "text", src = "S1", fidelity = "datasheet" }

[geometry]
shape = "box"
size = [0.0265, 0.011, 0.0035]

[[ports]]
name = "power_in"
pins = ["IN.1", "IN.2"]
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 16.8, unit = "V", fidelity = "derived", derivation = "4S x 4.2 V/cell = 16.8 V (rated 3-4s, S1)." }
i_max = { value = 20.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "motor_out"
pins = ["MOT.1", "MOT.2", "MOT.3"]
kind = "power"
type = "motor-3phase"
gender = "neutral"
role = "source"
v_max = { value = 16.8, unit = "V", fidelity = "derived", derivation = "Output follows the battery input: 4S x 4.2 V = 16.8 V." }
i_max = { value = 20.0, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "signal"
pins = ["SIG.1", "SIG.2"]
kind = "signal"
type = "pwm"
gender = "neutral"

# ---- Connectors (pin level). S1: 'Weight (Incl. Cable)', 'Banana Plug 3.5mm', 'BEC /' (none), 'Throttle Signal Frequency 50Hz-600Hz'. Power in on the -x
# end, motor plugs and throttle lead on the +x end (the part's own layout note); the cable gauge, length and throttle-lead pinout are not published.
[[connectors]]
id = "IN"
name = "battery cable"
type = "wire-lead"
gender = "neutral"
joinable = true
pos = [-0.0265, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.006
src = "S1"
fidelity = "estimated"
rationale = "S1 mentions a cable ('Weight (Incl. Cable)') and the 3-4s rating but not its gauge, length or connector; two leads (+, -) are implied by a DC supply input."
pins = [
  { number = 1, name = "BAT+ (red)", kind = "power", dir = "in", v_max = 16.8, i_max = 20.0, fidelity = "derived", derivation = "v_max 4S x 4.2 V (S1 'Rated Voltage 3-4s'); i_max the 20 A continuous rating (S1)." },
  { number = 2, name = "BAT- (black)", kind = "ground", i_max = 20.0, fidelity = "derived", derivation = "The 20 A continuous rating (S1)." },
]

[[connectors]]
id = "MOT"
name = "3.5 mm banana plugs x3"
type = "bullet-3.5mm-x3"
port_type = "motor-3phase"
gender = "male"
pos = [0.0265, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.006
src = "S1"
fidelity = "datasheet"
pose_rationale = "S1: 'Banana Plug 3.5mm' (three, one per phase). The listing does not state gender (male plugs assumed, as the ESC output) or spacing; the A B C labels are a convention (swapping two phases reverses the motor)."
pins = [
  { number = 1, name = "A", kind = "power", dir = "out", i_max = 20.0 },
  { number = 2, name = "B", kind = "power", dir = "out", i_max = 20.0 },
  { number = 3, name = "C", kind = "power", dir = "out", i_max = 20.0 },
]

[[connectors]]
id = "SIG"
name = "throttle signal lead"
type = "servo-lead-2"
gender = "neutral"
pos = [0.0265, 0.008, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0025
src = "S1"
fidelity = "estimated"
rationale = "S1 gives the throttle frequency only and lists no BEC; a throttle signal + ground pair is the minimum a PWM input needs."
pins = [
  { number = 1, name = "SIGNAL", kind = "signal", dir = "in" },
  { number = 2, name = "GND", kind = "ground" },
]

