id = "dog-side-plate-l"
name = "Dog chassis side plate, left (3D printed PLA, 4 mm, 290 x 120 mm, two hip windows)"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "side_plate (left)"
url = "cad/dog/parts.py"

# cad/dog/parts.py side_plate(). Frame: origin at the plate centre, +x forward, plate normal along y, inboard flange toward +y for the left plate. Hip windows at x = +-100 mm.

[mirror]
opposite = "dog-side-plate-r"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.1026, unit = "kg", fidelity = "derived", derivation = "Mesh volume 108.1 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-side-plate-l.stl"
material = "pla"
bbox_min = [-0.145, -0.002, -0.06]
bbox_max = [0.145, 0.014, 0.06]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Plate centre, inboard face; the hip housings bolt on the outboard face at x = +-0.1 m."
