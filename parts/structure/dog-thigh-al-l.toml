# cad/dog/parts.py thigh_al(); mesh by cad/dog/build.py. Frame: origin on the hip pitch axis at the hip actuator output face; the tube lies at y in [0, 12.7] (outboard), hangs along -z.
# Tube z from -40 to -232.7 (12.7 mm below the knee), CNC hip fitting = 5 mm disc (6 x M3 on the 50 mm circle) + boss z [-40, -10] + 25 mm plug in the bore, 25 mm knee-end plug with the 8.1 mm pin bore at z = -220.
# The shank head sits outboard of the tube (y in [13, 33]): the knee axis is the line y = 23 mm. Same joint axes, rod port and knee range as dog-thigh-bracket-l. Twin: dog-thigh-al-r.

[mirror]
opposite = "dog-thigh-al-r"

