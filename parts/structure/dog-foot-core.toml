id = "dog-foot-core"
name = "Dog foot core (3D printed PLA): 35 mm rubber-ball socket on a 46 mm cup"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "foot_core"
url = "cad/dog/parts.py"

# cad/dog/parts.py foot_core(). Frame: origin at the rubber ball centre, the shank stub enters from +z. Axisymmetric: its own mirror. Holds the mcmaster-natural-rubber-ball-1-3-8in.

[mirror]
symmetry = "xz"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.0221, unit = "kg", fidelity = "derived", derivation = "Mesh volume 33.3 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py." }
price           = { value = 0.44, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0221 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-foot-core.stl"
material = "pla"
bbox_min = [-0.023, -0.023, -0.005]
bbox_max = [0.023, 0.023, 0.025]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Ball centre; the ball seat is a sphere of 35.2 mm."

[[ports]]
name = "shank"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.025]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "Top face: 8.4 mm stud bore for the shank socket."

[[ports]]
name = "ball"
kind = "mech"
type = "sphere-seat.35"
gender = "neutral"
pos = [0.0, 0.0, 0.0174625]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "Top of the 35.2 mm spherical socket: the rubber ball seat port (ball radius 17.4625 mm) mates here so the ball centre sits on the core origin."
