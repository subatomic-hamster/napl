id = "dog-knee-rod-250"
name = "Dog knee push rod for the 250 mm leg: 186 mm of 10 x 8 mm carbon tube with a bonded M5 stud at each end (pin centres 239.8 mm with PHS5 rod ends)"
category = "structure.rod"
vendor = "napl dog (own design: Easy Composites tube cut to length, bonded M5 studs)"
part_number = "knee_rod 250"
url = "docs/dog/actuator-study.md"

# As dog-knee-rod-220, cut for the 250 mm leg of the speed sweep. Frame: origin at the rod centre, z along the rod, end_b at +z. Symmetric about XZ.

[mirror]
symmetry = "xz"

[params]
pin_length            = { value = 0.2398, unit = "m", fidelity = "derived", derivation = "cad/dog/params.py linkage(0.25)['ell'] = 239.811 mm (crank pin to lug pin, same crank and lug as the 220 mm leg)." }
tube_length           = { value = 0.1858, unit = "m", fidelity = "derived", derivation = "pin_length 0.2398 m - 2 x 0.027 m (PHS5 ball centre to shoulder)." }
outer_diameter        = { value = 0.010, unit = "m", fidelity = "datasheet", src = "S1" }
inner_diameter        = { value = 0.008, unit = "m", fidelity = "datasheet", src = "S1" }
youngs_modulus_axial  = { value = 64e9, unit = "Pa", fidelity = "datasheet", src = "S1" }

[params.buckling_load]
value = 3183.4
unit = "N"
fidelity = "derived"
derivation = "Euler pinned-pinned over the pin length: pi^2 x 64 GPa x 2.898e-10 m^4 / 0.2398^2 = 3183 N (2.9 x the 1.1 kN rod force)."

[params.mass]
value = 0.01347
unit = "kg"
fidelity = "derived"
derivation = "0.1858 m x 45.6 g/m = 8.47 g + 2 x 2 g steel studs (estimated) + 1 g adhesive (estimated) = 13.47 g."

[params.price]
value = 3.53
unit = "USD"
fidelity = "derived"
derivation = "0.1858 m x 13.64 USD/m (cf-tube-10x8 price_per_m) = 2.53 USD + 1.00 USD for two M5 studs and adhesive (estimated)."

