id = "ruland-fhd-mcl-12-f"
name = "Ruland FHD-MCL-12-F face-mount clamp shaft collar, drilled holes, 12 mm bore, 28 mm OD, 11 mm wide"
category = "structure.shaft-collar"
vendor = "Ruland Manufacturing"
part_number = "FHD-MCL-12-F"
url = "https://docs.rs-online.com/6d59/A700000013979746.pdf"

# Frame: origin on the bore axis at the bore-end face, +z along the axis through the width. The two drilled face holes lie on a line
# through the bore centre, 10 mm each side (Hole to Center 10.00, Hole to Hole 20.00); their face (+z or -z) and angular position
# relative to the clamp screw are not stated in the text, so +x is assumed to be the hole line.
