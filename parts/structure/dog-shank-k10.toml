id = "dog-shank-k10"
name = "Dog shank, knee linkage ratio 1.0 (3D printed PLA, L = 220 mm): 20 mm lug radius, otherwise as dog-shank"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "shank (ratio 1.0)"
url = "cad/dog/parts.py"

# cad/dog/parts.py shank() built with DOG_KNEE_RATIO = 1.0 (leg study, docs/dog/leg-study.md): the lug pin is at R2 = KNEE_R1 x 1.0 = 20 mm, 115 deg from the knee axis, so the lug block is
# lower (z up to 25 mm instead of 34 mm). Frame, beam and foot socket as dog-shank. Symmetric solid; the right-hand twin is dog-shank-k10-r.
# Pairs with dog-thigh-bracket-l-k10 / -r-k10 (knee range) and dog-knee-rod-220-k10 (rod pin length 218.6 mm).

[mirror]
opposite = "dog-shank-k10-r"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_SHANK (cad/dog/params.py)." }
lug_radius      = { value = 0.02, unit = "m", fidelity = "estimated", rationale = "Leg-study design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 1.0 (cad/dog/params.py, DOG_KNEE_RATIO=1.0)." }
mass            = { value = 0.0487, unit = "kg", fidelity = "derived", derivation = "Mesh volume 58.4 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py." }
price           = { value = 0.97, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0487 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

