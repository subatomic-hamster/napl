mass            = { value = 0.0381, unit = "kg", fidelity = "derived", derivation = "Same mesh as dog-thigh-bracket-l: volume 45.1 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py." }
