# Leg study (docs/dog/leg-study.md). Same printed solid as dog-thigh-bracket-l (the bracket geometry does not depend on the knee ratio; mesh shared, byte-identical to the
# DOG_KNEE_RATIO=1.0 build); only the knee range and the rod port (crank pin / lug pin geometry of the ratio 1.0 four-bar) differ. Twin: dog-thigh-bracket-r-k10.

[mirror]
opposite = "dog-thigh-bracket-r-k10"

