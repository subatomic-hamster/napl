id = "dog-deck-bottom-cf3"
name = "CUSTOM: dog bottom deck, 3 mm carbon-fibre sheet, 420 x 210 mm with an e-stop lip (not a purchased part; cut it from stock)"
category = "plate"
vendor = "custom (made to this drawing)"
part_number = "none: custom part, see assemblies/dog/dog.toml"

# CUSTOM PART, labelled as such. Frame: origin at the centre of the TOP face, +x forward, z up; the sheet spans x in [-0.21, 0.21], y in [-0.105, 0.105], z in [-0.003, 0]. It lies on the
# bulkhead bottom flanges and carries the two battery trays (front), the two BMS (behind them), the contactor, the PDB and the two DC-DCs (rear), and the e-stop on a small bonded
# carbon lip on its left edge (a 60 x 50 mm strip standing at y = 0.102..0.105 m, the e-stop's 22 mm hole through it at x = -0.14 m, z = 0.035 m, head pointing outboard).
# 0/90 twill sheet as parts/structure/cf-plate-3mm.toml.

[params]
thickness = { value = 0.003, unit = "m", fidelity = "estimated", rationale = "Design choice: the 3 mm sheet of cf-plate-3mm (actual 2.8 mm)." }
length    = { value = 0.42, unit = "m", fidelity = "estimated", rationale = "Design choice: the inner length between the two bulkheads (cad/dog/params.py BODY_L)." }
width     = { value = 0.21, unit = "m", fidelity = "estimated", rationale = "Design choice: the two 93 mm battery trays side by side with a 3 mm gap, plus edges." }

[params.mass]
value = 0.375
unit = "kg"
fidelity = "derived"
derivation = "Areal mass 4.11 kg/m2 (cf-plate-3mm, S1 of that part) x (0.42 m x 0.21 m deck + 0.06 m x 0.05 m lip = 0.0912 m2) = 0.375 kg; holes neglected (an upper bound by a few percent)."

[params.price]
value = 89.4
unit = "USD"
fidelity = "derived"
derivation = "Elevated Materials 3 mm twill carbon sheet 300 x 600 mm = 176.54 USD (product page, seen 2026-10-16) = 980.8 USD/m2; x 0.0912 m2 = 89.4 USD. LOWER BOUND: sheet granularity (a second 300 x 600 sheet for this deck) and waterjet cutting are not priced."

