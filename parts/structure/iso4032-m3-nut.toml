id = "iso4032-m3-nut"
name = "Hexagon nut ISO 4032 M3, steel"
category = "fastener"
vendor = "generic (ISO 4032 / DIN 934)"
part_number = "ISO 4032 M3"
url = "https://fasten.it/norms/norm/din_en_iso_4032"

[params]
thread_diameter = { value = 3e-3, unit = "m", src = "S1", fidelity = "datasheet" }
thread_pitch    = { value = 0.5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 2.4e-3, unit = "m", src = "S1", fidelity = "datasheet" }
across_flats    = { value = 5.5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
steel_density   = { value = 7850, unit = "kg/m3", src = "S2", fidelity = "datasheet" }

[params.mass]
value = 3.60e-4
unit = "kg"
fidelity = "derived"
derivation = "Hex prism minus bore, chamfers ignored: (sqrt(3)/2 x s^2 - pi/4 x d^2) x m x rho = (0.8660 x 30.25 - 0.7854 x 9) mm2 x 2.4 mm x 7850 kg/m3 = 3.60e-4 kg, using s = 5.5 mm, d = 3 mm, m = 2.4 mm (S1) and rho = 7850 (S2). The fasten.it ISO 4032 page lists no mass table; chamfer-free estimate runs slightly high."

