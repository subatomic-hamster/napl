bore_diameter    = { value = 12e-3, unit = "m", src = "S1", fidelity = "datasheet" }
outer_diameter   = { value = 28e-3, unit = "m", src = "S1", fidelity = "datasheet" }
width            = { value = 11e-3, unit = "m", src = "S1", fidelity = "datasheet" }
hole_to_hole     = { value = 20e-3, unit = "m", src = "S1", fidelity = "datasheet" }
clamp_screw      = { value = "M4 x 12", unit = "-", src = "S1", fidelity = "datasheet" }
seating_torque   = { value = 4.6, unit = "N*m", src = "S1", fidelity = "datasheet" }
mass             = { value = 0.038421, unit = "kg", src = "S1", fidelity = "datasheet" }

