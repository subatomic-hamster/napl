# Frame: origin on the bore axis at the bore-end face, +z along the axis through the width. Two tapped M4 face holes on a line through the
# bore centre, 10 mm each side (Hole to Center 10.00, Hole to Hole 20.00); face and angular position vs the clamp screw are not in the
# text, so +z face and +x hole line are assumed.
