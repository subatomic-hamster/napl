id = "dog-shank-k10-r"
name = "Dog shank, knee linkage ratio 1.0, right-hand twin of dog-shank-k10 (3D printed PLA, L = 220 mm)"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "shank (ratio 1.0, right)"
url = "cad/dog/parts.py"

# Same geometry and mesh as dog-shank-k10: the shank is symmetric about its XZ plane, so its mirror image IS the same solid. Only the knee port differs: its axis
# is the reflection of dog-shank-k10's (+y instead of -y), which a mirrored sub-assembly needs.

[mirror]
opposite = "dog-shank-k10"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_SHANK (cad/dog/params.py)." }
lug_radius      = { value = 0.02, unit = "m", fidelity = "estimated", rationale = "Leg-study design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 1.0 (cad/dog/params.py, DOG_KNEE_RATIO=1.0)." }
mass            = { value = 0.0487, unit = "kg", fidelity = "derived", derivation = "Identical to dog-shank-k10 (same solid): mesh volume 58.4 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py." }
price           = { value = 0.97, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0487 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-shank-k10.stl"
material = "pla"
bbox_min = [-0.017, -0.017, -0.224]
bbox_max = [0.017, 0.017, 0.02513]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Knee axis, beam mid-plane. Mates the thigh knee port of the right leg (the thigh plate is on the +y side)."

[[ports]]
name = "foot"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, -0.22]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Foot socket stub, 8.4 mm stud bore for the foot core."
