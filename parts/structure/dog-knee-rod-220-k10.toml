# Leg study (docs/dog/leg-study.md). As dog-knee-rod-220 with the pin length of the ratio 1.0 four-bar (lug pin 20 mm from the knee, crank pin 20 mm from the hip). Frame: origin at the
# rod centre, z along the rod, end_b at +z. pin_length = tube length + 2 x 27 mm. Symmetric about XZ.

[mirror]
symmetry = "xz"

[params]
pin_length            = { value = 0.2186, unit = "m", fidelity = "derived", derivation = "cad/dog/params.py linkage(0.22) with DOG_KNEE_RATIO = 1.0 (R1 = R2 = 20 mm): 'ell' = 218.6 mm." }
tube_length           = { value = 0.1646, unit = "m", fidelity = "derived", derivation = "pin_length 0.2186 m - 2 x 0.027 m (PHS5 ball centre to shoulder, generic-phs5-rod-end-m5.centre_to_shoulder)." }
outer_diameter        = { value = 0.010, unit = "m", fidelity = "datasheet", src = "S1" }
inner_diameter        = { value = 0.008, unit = "m", fidelity = "datasheet", src = "S1" }
youngs_modulus_axial  = { value = 64e9, unit = "Pa", fidelity = "datasheet", src = "S1" }

[params.buckling_load]
value = 3832.0
unit = "N"
fidelity = "derived"
derivation = "Euler, pinned-pinned over the full pin length: P = pi^2 E I / pin_length^2 with E = 64 GPa, I = 2.898e-10 m^4 (cf-tube-10x8) and pin_length 0.2186 m: 3832 N."

[params.mass]
value = 0.01250
unit = "kg"
fidelity = "derived"
derivation = "0.1646 m x 45.6 g/m (cf-tube-10x8) = 7.51 g + 2 x 2 g steel studs (estimated) + 1 g adhesive (estimated) = 12.50 g. The two rod ends (18 g each) are separate parts."

[params.price]
value = 3.24
unit = "USD"
fidelity = "derived"
derivation = "0.1646 m x 13.64 USD/m (cf-tube-10x8 price_per_m) = 2.24 USD + 1.00 USD for two M5 studs and adhesive (estimated)."

