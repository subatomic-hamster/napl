id = "dog-thigh-bracket-r-k20"
name = "Dog thigh bracket, right, knee linkage ratio 2.0 (3D printed PLA, L = 220 mm): mirror of dog-thigh-bracket-l-k20"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "thigh_bracket (right, ratio 2.0)"
url = "cad/dog/parts.py"

# Mirror image (XZ plane) of dog-thigh-bracket-l-k20, L_THIGH = 220 mm; same solid as dog-thigh-bracket-r. -y outboard (right).

[mirror]
opposite = "dog-thigh-bracket-l-k20"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
