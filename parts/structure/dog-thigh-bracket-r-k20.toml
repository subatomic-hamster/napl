length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_THIGH (cad/dog/params.py)." }
knee_range      = { value = [0.0, 1.02], unit = "rad", fidelity = "derived", derivation = "As dog-thigh-bracket-l-k20 (same linkage, mirrored): NEGATED and swapped, because a mirrored hinge turns the other way for the same mirror-image motion (report mirror_signs -1), so the right leg's flexion is positive about its reflected axis." }
mass            = { value = 0.0381, unit = "kg", fidelity = "derived", derivation = "Same mesh as dog-thigh-bracket-r: volume 45.1 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py; identical to the left twin." }
price           = { value = 0.76, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0381 kg x 20 USD/kg (PLA spool); print time, failed prints and inserts not priced." }

[geometry]
