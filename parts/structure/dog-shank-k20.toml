length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_SHANK (cad/dog/params.py)." }
lug_radius      = { value = 0.04, unit = "m", fidelity = "estimated", rationale = "Leg-study design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 2.0 (cad/dog/params.py, DOG_KNEE_RATIO=2.0)." }
mass            = { value = 0.0523, unit = "kg", fidelity = "derived", derivation = "Mesh volume 63.6 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py." }
price           = { value = 1.05, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0523 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

