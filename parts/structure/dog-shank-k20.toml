id = "dog-shank-k20"
name = "Dog shank, knee linkage ratio 2.0 (3D printed PLA, L = 220 mm): 40 mm lug radius, otherwise as dog-shank"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "shank (ratio 2.0)"
url = "cad/dog/parts.py"

# cad/dog/parts.py shank() built with DOG_KNEE_RATIO = 2.0 (leg study, docs/dog/leg-study.md): the lug pin is at R2 = KNEE_R1 x 2.0 = 40 mm, 115 deg from the knee axis, so the lug block is
# taller (z up to 43 mm instead of 34 mm) and reaches 23.9 mm behind the knee axis. Frame, beam and foot socket as dog-shank. Symmetric solid; the right-hand twin is dog-shank-k20-r.
# Pairs with dog-thigh-bracket-l-k20 / -r-k20 (knee range) and dog-knee-rod-220-k20 (rod pin length 201.6 mm).

[mirror]
opposite = "dog-shank-k20-r"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
