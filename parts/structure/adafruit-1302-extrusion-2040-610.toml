rationale = "Adafruit publishes no mass. The sibling 20x20 profile is taken as 0.50 kg/m (haluminium datasheet). A 20x40 profile is two 20x20 cells that share one 1.5 mm-class wall and lose one pair of outer slots' worth of web, so slightly under 2 x 0.50 = 1.0 kg/m; 0.90 kg/m is used. The wall design is unknown: +-25 %."

