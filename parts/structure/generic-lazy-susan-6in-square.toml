id = "generic-lazy-susan-6in-square"
name = "6 in square lazy-susan ball-bearing turntable, 5/16 in thick, 350 lb (turret azimuth bearing, RF Parts 'LAZY SUSAN Mounting plate, 6 Square')"
category = "structure.bearing"
vendor = "RF Parts (price, stock); mass and pitch circle from a Simply Bearings LAZY/6 listing of the same size class"
part_number = "RF Parts 6 in square lazy susan (no SKU listed)"
url = "https://www.rfparts.com/lazy-susan.html"

# Buyable for the turret's azimuth axis. NO vendor publishes the fixing-hole pattern of a 6 in square lazy susan (RF Parts: dimensions, 'INSIDE HOLE DIAMETER 4 5/8"', capacity; Simply Bearings LAZY/6: pitch circle
# 121 mm, inner diameter 119.1 mm, 'fixing holes in both upper and lower plates', no count or diameter; Hardware Tree: nothing). The 121 mm 'pitch circle' is the closest published figure and is NOT a bolt circle
# (a hole circle of radius 60.5 mm would cut into the 119.1 mm opening). The cad/cuas-lite parameter LS_BOLT_R stays an estimate until the delivered bearing is measured (see docs/cuas-lite/bom.md).
# Mass is NOT from the RF Parts page: it is the 0.21825 kg of Simply Bearings LAZY/6 (a 6 in x 5/16 in bearing of the same class, literature).
# Part frame: origin at the centre of the bottom face, +z up the rotation axis. Drawn and collided as the 6 in square plate.

