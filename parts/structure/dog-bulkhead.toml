id = "dog-bulkhead"
name = "Dog bulkhead (3D printed PLA, 6 mm, 224 x 120 mm): two abad windows, deck flanges"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "bulkhead"
url = "cad/dog/parts.py"

# cad/dog/parts.py bulkhead(); mesh by cad/dog/build.py. Frame: origin at the plate centre, plate in the YZ plane (x in [-3, 3] mm), the deck flanges (14 x 184 x 4 mm, x in [-17, -3]) point to
# the INSIDE (-x) at z = +-58 mm. Two 101.4 mm windows at y = +-60 mm take the abad cups; 4 x M3 at (+-40, +-45) mm around each. The front bulkhead is this part as printed (hip ports
# at x = +9 mm); the rear one is the same part turned 180 deg about z. Symmetric about the XZ plane.

[mirror]
symmetry = "xz"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.0729, unit = "kg", fidelity = "derived", derivation = "Mesh volume 84.2 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-bulkhead.stl"
material = "pla"
bbox_min = [-0.017, -0.112, -0.06]
bbox_max = [0.003, 0.112, 0.06]

[[ports]]
name = "hip_l"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.009, 0.06, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
note = "Left abduction axis, 6 mm outside the plate's outer face (the abad mount flange thickness): the abad mount chassis port mates here."

[[ports]]
name = "hip_r"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.009, -0.06, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
note = "Right abduction axis."

[[ports]]
name = "deck_top"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [-0.003, 0.0, 0.06]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
note = "Top deck seat: the deck's underside lies on the top flange (z = 60 mm) and ends at the plate's inner face (x = -3 mm)."

[[ports]]
name = "deck_bottom"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [-0.003, 0.0, -0.056]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
note = "Bottom deck seat: the deck's underside lies on the top face of the bottom flange (z = -56 mm) and ends at the plate's inner face."
