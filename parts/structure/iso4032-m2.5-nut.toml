[params.mass]
value = 2.63e-4
unit = "kg"
fidelity = "derived"
derivation = "Hex prism minus bore, chamfers ignored: (sqrt(3)/2 x s^2 - pi/4 x d^2) x m x rho = (0.8660 x 25 - 0.7854 x 6.25) mm2 x 2.0 mm x 7850 kg/m3 = 2.63e-4 kg, using s = 5 mm, d = 2.5 mm, m = 2.0 mm (S1) and rho = 7850 (S2). The fasten.it ISO 4032 page lists no mass table; chamfer-free estimate runs slightly high."

