gender = "neutral"
pos = [0.0, 0.003, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.0
note = "Three tapped M3 holes on the bottom (S1); their spacing is not in the retrieved text, so no bolt pattern is recorded."

