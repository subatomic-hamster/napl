id = "dog-shank-250"
name = "Dog shank, L = 250 mm (3D printed PLA)"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "shank (L = 250)"
url = "cad/dog/parts.py"

# cad/dog/parts.py shank() built with DOG_L_SHANK = 250; length variant of dog-shank (speed sweep). Symmetric about the XZ plane: its own mirror.

[mirror]
symmetry = "xz"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.25, unit = "m", fidelity = "estimated", rationale = "Sweep variant L_SHANK = 250 mm (cad/dog/params.py)." }
lug_radius      = { value = 0.03, unit = "m", fidelity = "estimated", rationale = "Design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 1.5 (cad/dog/params.py)." }
mass            = { value = 0.0553, unit = "kg", fidelity = "derived", derivation = "Mesh volume 65.5 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-shank-250.stl"
material = "pla"
bbox_min = [-0.01968, -0.017, -0.254]
bbox_max = [0.017, 0.017, 0.03419]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Knee axis, beam mid-plane."

[[ports]]
name = "foot"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, -0.25]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Foot socket stub, 8.4 mm stud bore for the foot core."
