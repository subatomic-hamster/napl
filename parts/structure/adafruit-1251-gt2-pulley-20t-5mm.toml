id = "adafruit-1251-gt2-pulley-20t-5mm"
name = "Aluminium GT2 timing pulley, 20 teeth, 5 mm bore, for 6 mm belt (Adafruit 1251)"
category = "structure.pulley"
vendor = "Adafruit"
part_number = "1251"
url = "https://www.adafruit.com/product/1251"

# Frame: origin on the bore axis at the flange-side end, +z along the axis through the 16 mm length. The belt seat is mid-way along the toothed section.
[params]
teeth           = { value = 20, unit = "1", src = "S1", fidelity = "datasheet" }
bore_diameter   = { value = 5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
length          = { value = 16e-3, unit = "m", src = "S1", fidelity = "datasheet" }
flange_diameter = { value = 16e-3, unit = "m", src = "S1", fidelity = "datasheet" }
tooth_tip_diameter = { value = 12.2e-3, unit = "m", src = "S1", fidelity = "datasheet" }
belt_width_max  = { value = 6e-3, unit = "m", src = "S1", fidelity = "datasheet" }
mass            = { value = 0.006, unit = "kg", src = "S1", fidelity = "datasheet" }
belt_pitch      = { value = 2e-3, unit = "m", src = "S2", fidelity = "datasheet" }

[params.pitch_diameter]
value = 12.73e-3
unit = "m"
fidelity = "derived"
derivation = "teeth x belt pitch / pi = 20 x 2 mm / pi = 12.73 mm; the 2GT catalogue table (S2) prints 12.73 mm for 20 teeth."

[[ports]]
name = "bore"
kind = "mech"
type = "bore.5"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
length = 0.016
note = "5 mm bore, 'two set screws can be used to attach it firmly to any 5mm diameter shaft' (S1); '5mm inner diameter on both ends'."

[[ports]]
name = "belt"
kind = "mech"
type = "belt.gt2.6"
gender = "neutral"
pos = [0.0, 0.0, 0.008]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
fidelity = "estimated"
rationale = "Axial position of the belt seat taken as mid-length (8 mm) of the 16 mm part; the datasheet text gives no tooth-section offset."
note = "GT2 (2 mm pitch) belt, 6 mm wide; 'MXL belts will slip due to the different tooth profile' (S1)."

