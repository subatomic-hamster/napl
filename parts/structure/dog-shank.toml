id = "dog-shank"
name = "Dog shank (3D printed PLA, L = 220 mm): knee eye, 22 x 10 mm beam with lightening slot, lug block, foot socket"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "shank"
url = "cad/dog/parts.py"

# cad/dog/parts.py shank(), L_SHANK = 220 mm; mesh by cad/dog/build.py. Frame: origin on the knee axis at the beam's mid-plane (y), hangs along -z to the foot socket at z = -L_SHANK.
# A 14 x 16 mm lug block above the knee (x = -12.68, z up to 34 mm) carries the rod-end pin (M5 bore) at R2 = 30 mm, 115 deg: it lies on BOTH faces' envelope, so the
# solid is its own mirror image (symmetric about the XZ plane). The knee port axis is normal to that plane, so a mirrored leg needs the twin dog-shank-r (same mesh,
# port axis +y). Length variants: dog-shank-200, dog-shank-250 (twins -200-r, -250-r).

[mirror]
opposite = "dog-shank-r"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_SHANK (cad/dog/params.py); the speed study sweeps 0.20-0.25 m." }
lug_radius      = { value = 0.03, unit = "m", fidelity = "estimated", rationale = "Design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 1.5 (cad/dog/params.py): study candidate 1 (docs/dog/actuator-study.md)." }
mass            = { value = 0.0505, unit = "kg", fidelity = "derived", derivation = "Mesh volume 61.1 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py." }
price           = { value = 1.01, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0505 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-shank.stl"
material = "pla"
bbox_min = [-0.01968, -0.017, -0.224]
bbox_max = [0.017, 0.017, 0.03419]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Knee axis (5.3 mm pin bore through the eye), beam mid-plane. Mates the thigh knee port (the thigh plate is on the -y side for the left leg)."

[[ports]]
