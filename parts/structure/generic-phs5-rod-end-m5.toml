# Knee push-rod end of the dog (docs/superpowers/plans/2026-10-16-sp3b-dog-assembly.md Task 3). The plan wrote this part with a MALE thread; the PHS series is the FEMALE-thread
# rod end, so the thread here is female and the rod carries male M5 studs (dog-knee-rod-*): a gender flip, the mate is the same.
# Part frame: origin at the ball centre (the pin hole), +z along the thread axis toward the rod; the pin (M5 shoulder bolt) runs along x. Symmetric about the XZ plane.
# Matara row "PHS 5-M5x0.8" (columns d 5, ... F 27, H 35, thread M5x0.8, weight 18 g): F = 27 mm is taken as ball centre to the end face of the body (the shoulder the rod butts on).

