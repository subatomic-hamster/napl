id = "adafruit-1254-gt2-pulley-36t-8mm"
name = "Aluminium GT2 timing pulley, 36 teeth, 8 mm bore, for 6 mm belt (Adafruit 1254)"
category = "structure.pulley"
vendor = "Adafruit"
part_number = "1254"
url = "https://www.adafruit.com/product/1254"

# Frame: origin on the bore axis at one end, +z along the axis. Overall length is not stated as such: '25.5mm x 16mm' is read as 25.5 mm outer
# diameter by 16 mm length.
[params]
price = { value = 11.95, unit = "USD", src = "S1", fidelity = "datasheet" }  # Adafruit page, quantity 1-9, seen 2026-10-16; page marks the item 'No longer stocked'
teeth           = { value = 36, unit = "1", src = "S1", fidelity = "datasheet" }
bore_diameter   = { value = 8e-3, unit = "m", src = "S1", fidelity = "datasheet" }
outer_diameter  = { value = 25.5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
belt_width_max  = { value = 6e-3, unit = "m", src = "S1", fidelity = "datasheet" }
mass            = { value = 0.013, unit = "kg", src = "S1", fidelity = "datasheet" }
belt_pitch      = { value = 2e-3, unit = "m", src = "S2", fidelity = "datasheet" }

[params.length]
value = 16e-3
unit = "m"
src = "S1"
fidelity = "estimated"
rationale = "Page lists 'Outer Diameter: 25.5mm x 16mm / 1\" x 0.6\"' without saying which is the length; 25.5 mm is the toothed-section diameter and 16 mm the flange / length, as for the 20-tooth siblings (16 mm long, 16 mm flange)."

[params.pitch_diameter]
value = 22.92e-3
unit = "m"
fidelity = "derived"
derivation = "teeth x belt pitch / pi = 36 x 2 mm / pi = 22.92 mm; the 2GT catalogue table (S2) prints 22.92 mm for 36 teeth."

