id = "dog-compute-tray"
name = "Dog compute tray (3D printed PLA, 250 x 160 mm): Jetson, RTK board, antenna, IMU and four CAN adapters"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "compute_tray"
url = "cad/dog/parts.py"

# cad/dog/parts.py compute_tray(); mesh by cad/dog/build.py. Frame: origin at the floor underside centre (floor z in [0, 3] mm), +x forward; 12 mm side walls at y = +-78.5 mm. Board seats sit on the
# floor top (z = 3 mm): Jetson devkit (-58, 0), antenna (80, 0), RTK board (16, -48), MinIMU (12, 20), four CANables along y = +60 (x = -95, -50, -5, 40). Symmetric about the XZ plane.

[mirror]
symmetry = "xz"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.145, unit = "kg", fidelity = "derived", derivation = "Mesh volume 133.5 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py (thin 3 mm floor: the shell model prints it solid)." }
price           = { value = 2.9, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.145 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

