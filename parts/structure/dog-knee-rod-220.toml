id = "dog-knee-rod-220"
name = "Dog knee push rod for the 220 mm leg: 156 mm of 10 x 8 mm carbon tube with a bonded M5 stud at each end (pin centres 210.0 mm with PHS5 rod ends)"
category = "structure.rod"
vendor = "napl dog (own design: Easy Composites tube cut to length, bonded M5 studs)"
part_number = "knee_rod 220"
url = "docs/dog/actuator-study.md"

# Custom assembly of bought stock: cf-tube-10x8 cut to 156 mm, an M5x0.8 steel stud bonded into each end (the studs screw into generic-phs5-rod-end-m5, female thread). Frame: origin at the
# rod centre, z along the rod, end_b at +z. pin_length is the distance between the rod-end pin centres = tube length + 2 x 27 mm (rod end centre to shoulder). Symmetric about XZ.
# The plan set pin_length = L; the real four-bar (cad/dog/params.py linkage) needs a rod pin length of 210.0 mm for the 220 mm leg (the lug is 30 mm from the knee, the crank pin 20 mm from the hip).

[mirror]
symmetry = "xz"

[params]
pin_length            = { value = 0.2100, unit = "m", fidelity = "derived", derivation = "Distance from the crank pin (R1 = 20 mm at 51.65 deg about the hip) to the lug pin (R2 = 30 mm at 115 deg about the knee, 220 mm below): cad/dog/params.py linkage(0.22)['ell'] = 209.999 mm." }
tube_length           = { value = 0.1560, unit = "m", fidelity = "derived", derivation = "pin_length 0.2100 m - 2 x 0.027 m (PHS5 ball centre to shoulder, generic-phs5-rod-end-m5.centre_to_shoulder)." }
outer_diameter        = { value = 0.010, unit = "m", fidelity = "datasheet", src = "S1" }
inner_diameter        = { value = 0.008, unit = "m", fidelity = "datasheet", src = "S1" }
youngs_modulus_axial  = { value = 64e9, unit = "Pa", fidelity = "datasheet", src = "S1" }

[params.buckling_load]
value = 4151.0
unit = "N"
fidelity = "derived"
derivation = "Euler, pinned-pinned over the full pin length (conservative: the studs and rod ends are stiffer than the tube): P = pi^2 E I / pin_length^2 with E = 64 GPa, I = pi/64 (OD^4 - ID^4) = 2.898e-10 m^4 (cf-tube-10x8): 4151 N, 3.8 x the 1.1 kN rod force (22 N*m stall torque / 20 mm crank)."

[params.mass]
value = 0.01211
unit = "kg"
fidelity = "derived"
derivation = "0.1560 m x 45.6 g/m (cf-tube-10x8) = 7.11 g + 2 x 2 g steel studs (estimated) + 1 g adhesive (estimated) = 12.11 g. The two rod ends (18 g each) are separate parts."

[params.price]
value = 3.13
unit = "USD"
fidelity = "derived"
derivation = "0.1560 m x 13.64 USD/m (cf-tube-10x8 price_per_m) = 2.13 USD + 1.00 USD for two M5 studs and adhesive (estimated)."

