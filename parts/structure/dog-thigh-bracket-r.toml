id = "dog-thigh-bracket-r"
name = "Dog thigh bracket, right (3D printed PLA, L = 220 mm): 5 mm plate on the hip output, rib, knee hinge, push-rod seat"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "thigh_bracket (right)"
url = "cad/dog/parts.py"

# Mirror image (XZ plane) of dog-thigh-bracket-l, L_THIGH = 220 mm. Frame: origin on the hip pitch axis at the hip actuator output face, hangs along -z; -y outboard (right).

[mirror]
opposite = "dog-thigh-bracket-l"

[params]
