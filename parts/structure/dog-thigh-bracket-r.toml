nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_THIGH (cad/dog/params.py); the speed study sweeps 0.20-0.25 m." }
knee_range      = { value = [-1.32, 0.02], unit = "rad", fidelity = "derived", derivation = "As dog-thigh-bracket-l (same linkage, mirrored): cad/dog/params.py linkage(0.22), both transmission angles in [30, 150] deg." }
mass            = { value = 0.0381, unit = "kg", fidelity = "derived", derivation = "Mesh volume 45.1 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py; identical to the left twin." }
price           = { value = 0.76, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0381 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

