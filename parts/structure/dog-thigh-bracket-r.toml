id = "dog-thigh-bracket-r"
name = "Dog thigh bracket, right (3D printed PLA): hip-pitch disc, thigh bar, knee bearing seat"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "thigh_bracket (right)"
url = "cad/dog/parts.py"

# Mirror image (XZ plane) of dog-thigh-bracket-l, L_THIGH = 220 mm. Frame: origin on the hip pitch axis, hangs along -z; -y outboard (right).

[mirror]
opposite = "dog-thigh-bracket-l"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_THIGH (cad/dog/params.py); the speed study sweeps 0.20-0.25 m." }
mass            = { value = 0.0628, unit = "kg", fidelity = "derived", derivation = "Mesh volume 95.7 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py; identical to the left twin." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-thigh-bracket-r.stl"
material = "pla"
bbox_min = [-0.03, -0.017, -0.24]
bbox_max = [0.03, -0.002, 0.03]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Hip pitch axis, inboard face of the disc (6 x M3 on a 50 mm circle for the pitch actuator output)."

[[ports]]
name = "knee"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, -0.011, -0.22]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Knee axis: 30.4 mm bearing seat (6903 class) on the outboard side."
