# CUSTOM PART, labelled as such: the one non-catalogue item of the rover (docs/research/rover.md). Frame: origin on the midpoint of the wheel axle
# line, at the plate's mid-plane; x = forward, y = left, z = up. The plate outline spans x in [-0.13, +0.09], y in [-0.095, +0.095], z in
# [-0.0015, +0.0015]. Every seat below is a flat mount (no hole pattern is defined for a custom plate: the holes are drilled to match the parts).

[params]
thickness = { value = 0.003, unit = "m", fidelity = "estimated", rationale = "Design choice of this custom part (3 mm: a common aluminium plate gauge); the wheel / caster / bracket heights in assemblies/rover.toml are solved for it." }
