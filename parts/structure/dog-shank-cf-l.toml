id = "dog-shank-cf-l"
name = "Dog shank, left (20 x 18 mm carbon tube bonded into a 6061 CNC head with knee boss and rod-pin ear, L = 220 mm): the light distal link of the '-al' leg"
category = "frame.machined"
vendor = "napl dog (own design: Easy Composites cf-tube-20x18 cut to length + CNC 6061 head)"
part_number = "shank_cf (left)"
url = "docs/dog/leg-survey.md"

# cad/dog/parts.py shank_cf(); mesh by cad/dog/build.py. Frame: origin on the knee axis, y = 0 on the tube centre line (y = 23 mm in the thigh frame), hangs along -z to the foot plane z = -220 mm.
# Head: 26 mm knee boss (8.1 mm pin bore, y +-10), 24 mm tube socket 40 mm long (bore = tube OD 20 mm, tube bonded from z = -8), rod-pin ear on the inboard half (y in [-10, -2], M5 bore at R2 = 30 mm, 115 deg);
# the rod end sits outside it at y in [-2, 6] (thigh y 21-29). The tube ends at z = -220: the foot core (dog-foot-core-cf) has a spigot bonded into its bore. NOT symmetric about the XZ plane: twin dog-shank-cf-r is the true mirror image.

[mirror]
opposite = "dog-shank-cf-r"

[params]
length          = { value = 0.22, unit = "m", fidelity = "estimated", rationale = "Design value L_SHANK (cad/dog/params.py), the same as the printed shank." }
lug_radius      = { value = 0.03, unit = "m", fidelity = "estimated", rationale = "Design value KNEE_R2 = KNEE_R1 x KNEE_RATIO = 20 mm x 1.5 (cad/dog/params.py), unchanged: the knee drive ratio stays 1.5." }
tube_outer_diameter = { value = 0.020, unit = "m", src = "S1", fidelity = "datasheet" }
tube_inner_diameter = { value = 0.018, unit = "m", src = "S1", fidelity = "datasheet" }
tube_youngs_modulus = { value = 64e9, unit = "Pa", src = "S1", fidelity = "datasheet" }
tube_tensile_strength = { value = 650e6, unit = "Pa", src = "S2", fidelity = "datasheet" }
mass            = { value = 0.0646, unit = "kg", fidelity = "derived", derivation = "Head: solid volume (cad/dog/parts.py _shank_cf_head) x 6061 2.70 g/cm3 = 43.3 g; tube: 212 mm x 86.5 g/m (cf-tube-20x18, S1) = 18.3 g; epoxy 3.0 g (estimated). Sum 64.6 g; shank_cf_mass_g() in cad/dog/parts.py, run by cad/dog/build.py." }

[params.price]
value = 31.0
unit = "USD"
fidelity = "estimated"
rationale = "CNC 6061 head about 25 USD at a quantity of 8 (no quote obtained; benchmark in dog-thigh-al-l) + 212 mm of 20 x 18 tube at about 26 USD/m (Easy Composites prices the 16 x 14 tube at EUR 19.95/m, scaled by mass per metre 86.5 / 74.2) = 5.5 USD + adhesive; +-50 %."

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-shank-cf-l.stl"
material = "aluminium-6061"
bbox_min = [-0.01968, -0.012, -0.22]
bbox_max = [0.013, 0.012, 0.03419]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Knee axis (8.1 mm bore through the boss), tube centre line. Mates the thigh knee port (the thigh tube is on the -y side for the left leg)."

[[ports]]
name = "foot"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, -0.22]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Tube end face; the foot core's spigot (17.8 mm) goes into the tube bore."

