id = "dog-side-plate-r"
name = "Dog chassis side plate, right (3D printed PLA, 4 mm, 420 x 120 mm, inboard top flange, service hole)"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "side_plate (right)"
url = "cad/dog/parts.py"

# Mirror image (XZ plane) of dog-side-plate-l: the inboard top flange points +y (y in [2, 14] mm).

[mirror]
opposite = "dog-side-plate-l"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.1933, unit = "kg", fidelity = "derived", derivation = "Mesh volume 210.5 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py; identical to the left twin." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-side-plate-r.stl"
material = "pla"
bbox_min = [-0.21, -0.002, -0.06]
bbox_max = [0.21, 0.014, 0.06]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Plate centre, outer face."

[[ports]]
name = "top"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.008, 0.06]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Top face of the inboard flange: lies against the underside of the top deck."
