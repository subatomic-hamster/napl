id = "dog-knee-crank-r"
name = "Dog knee crank, right (3D printed PLA): 7 mm plate on the knee actuator output, arm to the 20 mm rod-end pin"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "knee_crank (right)"
url = "cad/dog/parts.py"

# Mirror image (XZ plane) of dog-knee-crank-l: the plate lies at y in [0, 7] mm.

[mirror]
