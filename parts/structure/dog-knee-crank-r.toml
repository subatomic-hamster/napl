nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
crank_radius    = { value = 0.02, unit = "m", fidelity = "estimated", rationale = "Design value KNEE_R1 (cad/dog/params.py): rod force = 22 N*m / 0.020 m = 1.1 kN at the actuator's stall torque." }
mass            = { value = 0.0148, unit = "kg", fidelity = "derived", derivation = "Mesh volume 19.2 cm3 x PLA 1.24 g/cm3, shell + 30 % infill model, by cad/dog/build.py; identical to the left twin." }
price           = { value = 0.3, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.0148 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-knee-crank-r.stl"
material = "pla"
bbox_min = [-0.03, 0.0, -0.03]
bbox_max = [0.03, 0.007, 0.03]

[[ports]]
name = "motor"
kind = "mech"
