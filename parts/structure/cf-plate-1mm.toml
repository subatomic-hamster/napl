id = "cf-plate-1mm"
name = "Carbon fibre sheet 1 mm nominal (0.9 mm actual), high-strength 0/90 twill (Easy Composites)"
category = "structure.plate"
vendor = "Easy Composites"
part_number = "High Strength Carbon Fibre Sheet, 1mm"
url = "https://www.easycomposites.eu/high-strength-carbon-fibre-sheet"

# Sold as stock sheets (up to 2 sqm); holes and outlines are cut by the user, so no fixed port pattern is declared.
# Modulus figures are listed once for the sheet range on the vendor page, not per thickness.
[params]
thickness_nominal = { value = 0.001, unit = "m", src = "S1", fidelity = "datasheet" }
thickness_actual  = { value = 0.0009, unit = "m", src = "S1", fidelity = "datasheet" }
thickness_tolerance = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
areal_mass        = { value = 1.32, unit = "kg/m^2", src = "S1", fidelity = "datasheet" }
youngs_modulus_inplane_tension = { value = 31.6e9, unit = "Pa", src = "S2", fidelity = "datasheet" }
youngs_modulus_inplane_compression = { value = 32.4e9, unit = "Pa", src = "S2", fidelity = "datasheet" }

[params.density_effective]
value = 1467
unit = "kg/m3"
fidelity = "derived"
derivation = "areal mass 1.32 kg/m2 divided by actual thickness 0.0009 m (S1 table row '1mm | 0.9mm +/-0.2mm | 1.32'). Sensitive to the +/-0.2 mm thickness tolerance."

