url = "https://www.easycomposites.eu/high-strength-carbon-fibre-sheet"

# Stock sheet; holes and outlines are cut by the user, so no fixed port pattern is declared.
[params]
thickness_nominal = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
thickness_actual  = { value = 0.0040, unit = "m", src = "S1", fidelity = "datasheet" }
thickness_tolerance = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
areal_mass        = { value = 5.84, unit = "kg/m^2", src = "S1", fidelity = "datasheet" }
youngs_modulus_inplane_tension = { value = 31.6e9, unit = "Pa", src = "S2", fidelity = "datasheet" }
youngs_modulus_inplane_compression = { value = 32.4e9, unit = "Pa", src = "S2", fidelity = "datasheet" }

[params.density_effective]
value = 1460
unit = "kg/m3"
fidelity = "derived"
derivation = "areal mass 5.84 kg/m2 divided by actual thickness 0.0040 m (S1 table row '4mm | 4.0mm +/-0.2mm | 5.84')."

