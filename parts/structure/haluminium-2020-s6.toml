slot_depth       = { value = 0.0061, unit = "m", src = "S1", fidelity = "datasheet" }
center_hole_diameter = { value = 0.005, unit = "m", src = "S1", fidelity = "datasheet" }
mass_per_m       = { value = 0.50, unit = "kg/m", src = "S1", fidelity = "datasheet" }
second_moment_area_x = { value = 7.2e-9, unit = "m^4", src = "S1", fidelity = "datasheet" }
second_moment_area_y = { value = 7.2e-9, unit = "m^4", src = "S1", fidelity = "datasheet" }
section_modulus_x = { value = 7.2e-7, unit = "m^3", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "center_bore"
