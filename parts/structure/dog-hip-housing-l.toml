id = "dog-hip-housing-l"
name = "Dog hip housing, left (3D printed PLA): abduction actuator clamp, outboard boss for the hip pitch actuator"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "hip_housing (left, +y outboard)"
url = "cad/dog/parts.py"

# Printed from cad/dog/parts.py hip_housing(); mesh generated by cad/dog/build.py (227.5 g filament model). Frame: origin on the abduction axis at the chassis-side face (x = 0), body toward +x, +y outboard (left), z up.
# Bore 92.4 mm for the GIM8108-8 (92 x 55 mm). Twin: dog-hip-housing-r (mirror image about the XZ plane).

[mirror]
opposite = "dog-hip-housing-r"

[params]
infill_fraction = { value = 0.3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py, 30 % for load-bearing leg parts." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
wall_count      = { value = 3, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/dog/params.py." }
mass            = { value = 0.2275, unit = "kg", fidelity = "derived", derivation = "Mesh volume 410.8 cm3 x PLA 1.24 g/cm3, shell = min(V, area x 3 walls x 0.4 mm), 30 % infill elsewhere (assemblies/README.md 'Mass properties'), by cad/dog/build.py." }

[geometry]
shape = "mesh"
mesh = "meshes/dog/dog-hip-housing-l.stl"
material = "pla"
bbox_min = [0.0, -0.05, -0.055]
bbox_max = [0.07, 0.08, 0.055]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
note = "Chassis-side face on the abduction axis: mates the side plate hip window pattern (4 x M3, 80 x 90 mm)."

[[ports]]
name = "pitch_seat"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.035, 0.08, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Outboard boss face for the hip pitch actuator mount."
