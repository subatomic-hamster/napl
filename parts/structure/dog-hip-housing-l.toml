price           = { value = 3.33, unit = "USD", fidelity = "estimated", rationale = "Filament only: 0.1663 kg x 20 USD/kg (PLA spool; docs/dog/actuator-study.md prices the printed parts at 45 USD for 2.239 kg); print time, failed prints and inserts not priced." }

