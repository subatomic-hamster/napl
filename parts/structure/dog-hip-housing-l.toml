id = "dog-hip-housing-l"
name = "Dog hip housing, left (3D printed PLA): abad output flange, web, hip and knee actuator sleeves face to face, bridge"
category = "frame.printed"
vendor = "napl dog (own design)"
part_number = "hip_housing (left, +y outboard)"
url = "cad/dog/parts.py"

# cad/dog/parts.py hip_housing(); mesh by cad/dog/build.py. Leg frame: origin on the abduction axis at the abad actuator OUTPUT face, +x outward, +y outboard (left), z up.
# The hip pitch axis is at x = 60 mm. The hip actuator (92 x 55 mm) sits in the inboard sleeve with its output face at y = 95 mm pointing outboard; the knee actuator sits in the
# outboard sleeve with its output face at y = 132 mm pointing INBOARD. The thigh plate, push rod and crank live in the 37 mm slab between the two output faces; a bridge
# over the top (z in [44, 54]) ties the sleeves. Twin: dog-hip-housing-r (mirror image about the XZ plane).

[mirror]
opposite = "dog-hip-housing-r"

