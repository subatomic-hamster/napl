id = "iso4032-m2-nut"
name = "Hexagon nut ISO 4032 M2, steel"
category = "fastener"
vendor = "generic (ISO 4032 / DIN 934)"
part_number = "ISO 4032 M2"
url = "https://fasten.it/norms/norm/din_en_iso_4032"

[params]
thread_diameter = { value = 2e-3, unit = "m", src = "S1", fidelity = "datasheet" }
thread_pitch    = { value = 0.4e-3, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 1.6e-3, unit = "m", src = "S1", fidelity = "datasheet" }
across_flats    = { value = 4e-3, unit = "m", src = "S1", fidelity = "datasheet" }
steel_density   = { value = 7850, unit = "kg/m3", src = "S2", fidelity = "datasheet" }

[params.mass]
value = 1.35e-4
unit = "kg"
fidelity = "derived"
derivation = "Hex prism minus bore, chamfers ignored: (sqrt(3)/2 x s^2 - pi/4 x d^2) x m x rho = (0.8660 x 16 - 0.7854 x 4) mm2 x 1.6 mm x 7850 kg/m3 = 1.35e-4 kg, using s = 4 mm, d = 2 mm, m = 1.6 mm (S1) and rho = 7850 (S2). The fasten.it ISO 4032 page lists no mass table; chamfer-free estimate runs slightly high."

[[ports]]
name = "thread"
kind = "mech"
type = "thread.m2"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
length = 0.0016
note = "Through-threaded bore, axis normal to the nut faces; length = nut height"

