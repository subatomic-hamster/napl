ref = [0.0, 0.0, 1.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Aft face of the lower V (section 2 ends at x = -5.3 m) 0.9 m to port, 0.32 m above the keel plane: the 0.55 m propeller (hub 0.32 m high, disc from 0.045 m to 0.595 m above the keel plane, so the blades stay above the lowest point of the vessel as the design rule PROP_CLEARANCE wants) has its hub 0.38 m under the 0.70 m waterline: immersion factor 1 (the rotor device) at rest, the disc top 0.1 m under the surface, so it loses thrust in a wave trough, as a real stern drive ventilates."

