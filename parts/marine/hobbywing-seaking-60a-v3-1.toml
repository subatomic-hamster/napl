# ---- Connectors (pin level). S2 lists the wires: two 14 AWG 150 mm battery leads (no connector), three 14 AWG 100 mm motor leads with 4.0 mm
# gold female plugs, a throttle / program wire (no colours, no connector) and the 6 V / 3 A switch-mode BEC. Poses are estimates on the
# 60.5 x 38.5 x 25.6 mm sealed case (the leads leave the case ends); the throttle plug is not documented, so its pins follow the RC servo
# plug convention (S3: signal, +V, ground): estimated.
[[connectors]]
id = "IN"
name = "battery input leads (red / black 14 AWG, 150 mm, bare)"
type = "wire-lead"
gender = "neutral"
pos = [-0.03025, 0.0, 0.0128]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.006
src = "S2"
fidelity = "datasheet"
pose_rationale = "Estimated: leads leave the rear end of the case; lead spacing assumed."
pins = [
  { number = 1, name = "BAT+ (red)", kind = "power", dir = "in", v_min = 5.0, v_max = 12.6, i_max = 60.0, note = "'Red-14AWG-150mm*1' (S2); 2-3S LiPo (S1)" },
  { number = 2, name = "BAT- (black)", kind = "ground", i_max = 60.0, note = "'Black-14AWG-150mm*1' (S2)" },
]

[[connectors]]
id = "MOT"
name = "motor leads (3 x 14 AWG, 4.0 mm gold female plugs)"
type = "bullet-4.0mm-x3"
gender = "female"
pos = [0.03025, 0.0, 0.0128]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.006
src = "S2"
fidelity = "datasheet"
pose_rationale = "Estimated: leads leave the front end of the case; lead spacing assumed."
pins = [
  { number = 1, name = "A", kind = "power", dir = "out", i_max = 60.0, note = "'Black-14AWG-100mm*3' ... '4.0mm golden female plug' (S2): the three phase leads are identical" },
  { number = 2, name = "B", kind = "power", dir = "out", i_max = 60.0 },
  { number = 3, name = "C", kind = "power", dir = "out", i_max = 60.0 },
]

[[connectors]]
id = "SIG"
name = "throttle / BEC signal lead"
type = "servo-lead-3"
gender = "female"
pos = [0.0, 0.01925, 0.0128]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S2"
fidelity = "estimated"
rationale = "S2 states a throttle / program wire and a 6 V / 3 A switch-mode BEC but not the plug, its colours or its pin order: the RC servo lead (S3) of signal, +V (here the BEC), ground is assumed."
pins = [
  { number = 1, name = "THR", kind = "signal", dir = "in", note = "throttle signal; frequency and pulse range not stated (S1)" },
  { number = 2, name = "BEC 6V", kind = "power", dir = "out", v = 6.0, i_max = 3.0, note = "'Switch Mode: 6V/3A' (S1)" },
  { number = 3, name = "GND", kind = "ground" },
]

