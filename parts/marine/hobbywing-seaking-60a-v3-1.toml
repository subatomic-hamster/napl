id = "hobbywing-seaking-60a-v3-1"
name = "Hobbywing SeaKing 60A V3.1 waterproof brushless marine ESC (2-3S)"
category = "esc"
vendor = "Hobbywing"
part_number = "30302200"
url = "https://www.hobbywing.com/en/products/seaking-v3-series75"

# Waterproof marine ESC (water-cooled, 100 % waterproof per the maker). The device model is the same ESC chain as the multirotor ESCs; the
# vendor publishes no FET resistance, switching loss or quiescent current, so those are ESTIMATES. FORWARD ONLY in this simulator: the Esc throttle is 0..1,
# the real unit's reverse (brake / reverse) is not modelled.
# Part frame: origin at the centre of the underside (mounting face), x along the 60.5 mm length, z up.
[params]
current_continuous = { value = 60.0, unit = "A", src = "S1", fidelity = "datasheet" }
current_peak       = { value = 360.0, unit = "A", src = "S1", fidelity = "datasheet" }
mass               = { value = 0.095, unit = "kg", src = "S1", fidelity = "datasheet" }
v_cells_min        = { value = 2, unit = "cells", src = "S1", fidelity = "datasheet" }
v_cells_max        = { value = 3, unit = "cells", src = "S1", fidelity = "datasheet" }
bec_voltage        = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
bec_current        = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }
size_length        = { value = 0.0605, unit = "m", src = "S1", fidelity = "datasheet" }
size_width         = { value = 0.0385, unit = "m", src = "S1", fidelity = "datasheet" }
size_height        = { value = 0.0256, unit = "m", src = "S1", fidelity = "datasheet" }
r_on_total         = { value = 0.004, unit = "ohm", fidelity = "estimated", rationale = "ESC FET resistance is unpublished. 4 mOhm total series (two conducting half-bridge FETs ~1.5 mOhm each plus ~1 mOhm traces / solder) is typical of a 60 A continuous / 360 A peak ESC; at the T200's 17 A the loss is 1.2 W (0.6 % of 205 W). Treat as +-50 %." }
switching_loss_fraction = { value = 0.003, unit = "1", fidelity = "estimated", rationale = "Switching + dead-time loss as a fraction of the motor-side power (device field Esc.sw_loss); unpublished, a typical 0.2-0.5 % for a hard-switching brushless ESC at ~16-24 kHz." }
quiescent_current  = { value = 0.02, unit = "A", fidelity = "estimated", rationale = "Bus-side current of the ESC electronics (MCU, gate drivers, switch-mode BEC unloaded), drawn also at zero throttle; unpublished, 20 mA (0.24 W at 12 V). +-3x." }

