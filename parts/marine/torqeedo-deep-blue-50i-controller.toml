id = "torqeedo-deep-blue-50i-controller"
name = "Torqeedo Deep Blue 50i motor controller (352 V traction inverter, bidirectional throttle)"
category = "esc"
vendor = "Torqeedo"
part_number = "Deep Blue 50i (integrated electronics)"
url = "https://www.torqeedo.com/us/products/inboards/deep-blue-50i-1200/3302-00.html"

# The Deep Blue i drive carries its inverter in the 80 kg "motor weight ... including electronics" (S1); Torqeedo publishes neither its interface (the real
# drive is throttled over its own CAN protocol) nor its losses. For the simulator it is the same averaged ESC chain as every other ESC (docs/models.md), commanded by
# the autopilot's PWM-class throttle channel: bidirectional, 0 = stopped. ESTIMATES: the FET resistance, switching and quiescent figures below are chosen so that the
# controller loses ~3 % of the rated 55 kW (typical of a SiC / IGBT traction inverter at 350 V), and the interface is the Pixhawk's PWM channel instead of CAN (the PX4
# `bidirectional` throttle of the marine rotors; no vendor protocol is simulated).
# Part frame: origin at the centre of the underside, x along the length, z up.
[params]
current_continuous = { value = 156.5, unit = "A", fidelity = "derived", derivation = "Continuous input power 55.1 kW / nominal pack voltage 352 V (S1) = 156.5 A." }
current_peak       = { value = 187.5, unit = "A", fidelity = "derived", derivation = "Peak input power 66.0 kW / 352 V (S1) = 187.5 A." }
mass               = { value = 18.0, unit = "kg", fidelity = "estimated", rationale = "S1 gives 80 kg for motor plus electronics; the inverter's share is not published. A 55 kW liquid-cooled traction inverter weighs 10-20 kg (18 kg: the motor part carries 62)." }
v_min              = { value = 250.0, unit = "V", fidelity = "estimated", rationale = "Lowest operating DC voltage of a ~95-cell Li-ion pack (3.0 V/cell cut-off x 95 = 285 V) minus margin. Not published." }
v_max              = { value = 420.0, unit = "V", fidelity = "estimated", rationale = "Fully charged ~95-cell NMC pack 4.2 V/cell = 399 V plus 5 % margin. Not published." }
size_length        = { value = 0.45, unit = "m", fidelity = "estimated", rationale = "Sealed inverter housing; no dimension published. Drawing and collision only." }
size_width         = { value = 0.30, unit = "m", fidelity = "estimated", rationale = "As size_length." }
size_height        = { value = 0.15, unit = "m", fidelity = "estimated", rationale = "As size_length." }
r_on_total         = { value = 0.040, unit = "ohm", fidelity = "estimated", rationale = "Total series conduction resistance of a 3-phase inverter leg pair + bus bars (two FETs/IGBT drops + cabling): 0.04 ohm gives 1.0 kW (1.8 %) at 156.5 A. Not published." }
switching_loss_fraction = { value = 0.015, unit = "1", fidelity = "estimated", rationale = "Switching + dead-time loss as a fraction of the motor-side power (device field Esc.sw_loss): 0.8 kW (1.5 %) at the rated point; with the conduction loss the controller is ~96.7 % efficient (~3 % of 55 kW, as the header)." }
quiescent_current  = { value = 0.10, unit = "A", fidelity = "estimated", rationale = "Bus-side current of the controller electronics, gate drivers and the cooling-pump/CAN interface at zero throttle: 35 W at 352 V. Not published." }
signal_neutral_us  = { value = 1500.0, unit = "us", fidelity = "estimated", rationale = "The simulated throttle channel is the Pixhawk PWM convention of the other marine ESCs (1500 us neutral, 1100-1900 us full range); the real drive takes CAN." }

