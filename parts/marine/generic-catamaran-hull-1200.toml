name = "thruster_port"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [-0.6, 0.38, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Stern face of the port hull at keel level (the real BlueBoat hangs its thrusters under the hulls on brackets; the bracket is not modelled)."

