v_dd_max   = { value = 5.3, unit = "V", fidelity = "estimated", rationale = "WS2812B data sheet maximum 5.3 V (class)." }
i_max_leds = { value = 0.012, unit = "A", fidelity = "estimated", rationale = "Firmware-limited to a dim colour: about 12 mA." }
