# Part frame: origin at the centre of the 5 x 5 mm package underside, z up. 4 signal pins in this model (VDD, DOUT, VSS, DIN); DOUT is not wired (single LED).
# Level note: the data sheet asks for VIH = 0.7 VDD (3.5 V at 5 V). The Pico drives 3.3 V and the LED is powered from the 3V3 pin so VIH = 2.3 V is met, at the cost of running
# VDD at 3.3 V (below the 3.7 V data-sheet minimum; many WS2812B work, some clones do not) [est, bench item]. Colour and brightness are firmware-limited.

