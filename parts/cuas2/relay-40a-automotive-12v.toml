# Part frame: origin at the centre of the relay underside (the spade side), z up, body 28 x 28 x 25 mm (class size, the listing text read gives none).
# Terminals (DIN 72552): 86 coil +, 85 coil -, 30 common, 87 normally open, 87a normally closed (not wired). The key (1 A) and the E-stop carry only the coil current (about 0.13 A).
# The contact feeds both ESCs and the 5 V buck from the 12 V bus (up to about 2 x 12 A peak for the flywheel motors plus the servos).

