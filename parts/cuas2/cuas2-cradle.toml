id = "cuas2-cradle"
name = "cuas2 cradle (3D printed PETG, M2 tilt cradle with the D1 dovetail arms, group tilt, root of the tilt group, frame H)"
category = "frame.printed"
vendor = "napl cuas2 (own design)"
part_number = "cradle"
url = "cad/cuas2/modules/tilt_head.py"

# Mesh in the head frame H = tilt axis origin (x along the barrel, y left, z up at tilt 0). Root of the tilt group: the printed parts of M3/M4/M5 are bolted pairs (identity closure mates), every bought part of the
# group is seated by a `seat_*` port (pose = the child's part frame in H; axis = child +z, ref = child +x). CAD tilt axis in the launcher frame L is (-8, 0, 27) mm, so H = L + (8, 0, -27) mm.

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py INFILL." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py LAYER." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py NOZZLE." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py WALLS." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas2/cradle.stl"
material = "petg"
bbox_min = [-0.02666, -0.059, -0.041]
bbox_max = [0.053, 0.059, 0.02668]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1

[[ports]]
name = "frame_up"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Part frame (= H), axis +z: 'a' side of the mates to the printed parts of the tilt group (identity)."

[[ports]]
name = "hinge"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
fidelity = "derived"
derivation = "Tilt axis H, axis -y_H. With cuas2-yoke-left.tilt_axis (axis +y, ref x) the mated cradle frame equals frame H exactly."

[[ports]]
name = "seat_wheel_top"
kind = "mech"
