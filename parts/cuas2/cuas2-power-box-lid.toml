wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py WALLS." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas2/power_box_lid.stl"
material = "petg"
bbox_min = [-0.097, -0.04, -0.07]
bbox_max = [0.003, 0.04, -0.068]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
