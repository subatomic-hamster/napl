id = "74hct4017"
name = "74HCT4017 decade counter with 10 decoded outputs, DIP-16 (cuas2 hardware shot counter, two cascaded)"
category = "ic.logic"
vendor = "Texas Instruments / Nexperia (CD74HCT4017E class)"
part_number = "CD74HCT4017E"
url = "https://www.digikey.com/en/products/detail/texas-instruments/CD74HC4017E/480317"

# Part frame: origin at the centre of the DIP-16 body underside, z up, body 19.2 x 6.4 x 3.3 mm.
# Use in cuas2 (spec 14 Q6): a CD4017-class decade counter counts rising edges of the muzzle-beam signal (CLK, pin 14). One 4017 stops at 9 because Q0..Q9 repeat, so two are cascaded:
# the units counter's carry-out (pin 12, high for counts 0-4, rises on the wrap 9 -> 0) clocks the tens counter; tens Q1 (pin 2) goes high at the 10th ball and is the TRIP line
# (it inhibits the tens counter through /CE (pin 13) and turns on the NPN that holds the relay driver off). Tens Q2 (pin 4) = 20 balls, Q3 (pin 7) = 30: the DIP/jumper picks N.
# RESET (pin 15) of both is held high for about 0.1 s at power-up by one capacitor / resistor pair (key power cycle is the only reset).

