id = "74hct123"
name = "74HCT123 dual retriggerable monostable multivibrator with clear, DIP-16 (cuas2 shot limiter and kick supervisor)"
category = "ic.logic"
vendor = "Nexperia / Texas Instruments (CD74HCT123E, SN74HCT123N)"
part_number = "74HCT123N"
url = "https://futurlec.com/74HCT/74HCT123pr.shtml"

# Part frame: origin at the centre of the DIP-16 body underside, z up, pin 1 at (-0.0095, +0.00381) (row y = +3.81 mm holds pins 1-8 .. see connector), body 19.2 x 6.4 x 3.3 mm.
# HCT inputs accept 3.3 V from the Pico (TTL thresholds, VIH 2.0 V); outputs swing 0-5 V and drive only the 5 V gates of the limiter MOSFET and the supervisor MOSFET, never a Pico pin.
# Pulse width (data sheet, HC/HCT123): tW = 0.45 x Rext x Cext, so 120 k x 4.7 uF = 254 ms, 75 k x 10 uF = 338 ms, 100 k x 3.3 uF = 149 ms; electrolytic tolerance +-20 % [est].

