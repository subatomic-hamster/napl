id = "l7805-regulator-to220"
name = "L7805CV 5 V 1.5 A linear regulator, TO-220 (cuas2 5 V logic rail for the safety ICs, from the key-switched 12 V)"
category = "pcb.regulator"
vendor = "STMicroelectronics (and clones)"
part_number = "L7805CV"
url = "https://www.digikey.ie/en/products/detail/umw/L7805CV/17635308"

# Part frame: origin at the centre of the body mounting face, z up, pins towards -y (IN, GND, OUT = pins 1, 2, 3), tab = GND.
# cuas2 deviation from spec 9 (which lists only a buck): the 74HCT ICs need a 5 V rail that is alive whenever the key is on, independent of the relay-switched weapon rail, so a
# 5 V linear regulator hangs on the key output. Load: two 74HCT123 and two 74HCT4017, well under 20 mA; dissipation (12 - 5) V x 0.02 A = 0.14 W.

