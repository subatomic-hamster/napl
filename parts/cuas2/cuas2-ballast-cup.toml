id = "cuas2-ballast-cup"
name = "cuas2 ballast_cup (3D printed PETG, M2 optional ballast holder at the tail, group tilt; BALLAST_G = 0 in the nominal build)"
category = "frame.printed"
vendor = "napl cuas2 (own design)"
part_number = "ballast_cup"
url = "cad/cuas2/modules/tilt_head.py"

# Mesh in the head frame H; screwed to the cradle tail, identity transform. The nominal build needs no ballast (C-BAL: CG 3.6 mm from the tilt axis, worst static torque 0.018 N*m).

[params]
infill_fraction = { value = 0.2, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py INFILL." }
layer_height    = { value = 0.0002, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py LAYER." }
nozzle_diameter = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py NOZZLE." }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "Print setting: cad/cuas2/params.py WALLS." }

[geometry]
shape = "mesh"
mesh = "meshes/cuas2/ballast_cup.stl"
material = "petg"
bbox_min = [-0.072, -0.015, -0.065]
bbox_max = [-0.042, 0.015, -0.047]

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
