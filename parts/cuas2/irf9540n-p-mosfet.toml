# High-side switch in the 5 V line to the pusher servo: source on the buck output, drain to the servo V+, gate pulled to the source by 100 k (off), pulled down by the limiter's Q-bar (on, -5 V gate-source).
# VGS(th) is -2..-4 V, so -5 V is a modest enhancement: the load is the servo (about 0.7 A stall), well inside the part. A logic-level P-FET is a drop-in if the bench shows more drop than wanted.
# Part frame: origin at the centre of the body mounting face, z up, leads towards -y (G, D, S = pins 1, 2, 3), as the IRLB8721 in this library.

