part_number = "radial electrolytic 16 V"
url = "https://www.adafruit.com/product/2784"

# As generic-capacitor-radial, but the + lead is a power pin (it sits on the 5 V logic rail) so the DRC pin-kind rules accept a wire from the regulator output.

