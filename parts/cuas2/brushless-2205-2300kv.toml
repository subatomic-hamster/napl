# Part frame: origin at the centre of the stator mounting face, +z towards the shaft tip (body z 0..0.020, shaft to 0.035). Same frame as iflight-xing2-2207-1855kv.
# cuas2 uses it as a 12 V (3S) flywheel motor with a 40 mm printed wheel on the shaft (BOM lever: replaces the 2207 1800 KV; same envelope kept as the CAD figure, real 2205 bodies are shorter). Every electrical figure here is a class value, not a data sheet.
# At 12 V the model reaches the 18144 rpm cap (38 m/s surface) at u = 0.73 and rpm_max 17500 at u = 0.70 (kv 2300, droop 0.10), below throttle_max 0.90. No-load runaway is 2300 x 12.6 = 29.0k rpm (spec 1 failure table row 17).

