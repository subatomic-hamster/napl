id = "liion-cell-ocv-chen2020-lgm50"
ports_note = "Data-only open-circuit-voltage curve for a 21700 NMC811 / graphite-SiOx Li-ion cell; not a physical part, no ports."
name = "Li-ion 21700 cell OCV vs SOC, from the Chen et al. 2020 LG M50 electrode fits"
category = "battery.cell_curve"
vendor = "C.-H. Chen, F. Brosa Planella, K. O'Regan, D. Gastol, W. D. Widanage, E. Kendrick (measured on LG INR21700 M50 cells)"
part_number = "LG INR21700 M50 (5 Ah NMC811 / graphite-SiOx)"
url = "https://doi.org/10.1149/1945-7111/ab9050"

# Chen et al., "Development of Experimental Techniques for Parameterization of Multi-scale Lithium-ion Battery Models", J. Electrochem. Soc. 167 080534 (2020). The paper gives
# the half-cell open-circuit potential fits of the NMC811 positive and the graphite-SiOx negative electrode; the PyBaMM parameter set Chen2020 (v24.1, Chen2020.py) implements them.
# The full-cell OCV(SOC) below is OUR evaluation: U_p(x_p) - U_n(x_n) with the electrode stoichiometries moving linearly with SOC, x_n = xn100 - (1 - SOC) dn, x_p = xp100 +
# (1 - SOC) dn dxp/dxn, where
#   xn100 = 29866 / 33133 = 0.9014 and xp100 = 17038 / 63104 = 0.2700 (maximum concentrations over the Chen2020 electrode capacities: the 100 % state of the cell),
#   dxp/dxn = (0.75 x 85.2e-6 m x 33133 mol/m3) / (0.665 x 75.6e-6 m x 63104 mol/m3) = 0.6674 (active-material fraction x thickness x max concentration: ratio of the electrode capacities),
#   dn solved so that OCV(SOC = 0) = 2.5 V (the M50's end-of-discharge voltage).
# CAVEATS: (1) the top of the curve is 4.181 V, not 4.2 V (the fit window ends where the paper's cell was charged to 4.2 V; our 100 % point is 0.02 V low).
# (2) The Auline S70 21700 pack's cell chemistry is not published: NMC 21700 is ASSUMED, so this is the closest sourced curve (a high-power cell: its true OCV may differ by tens of mV).
# (3) 25 degC, equilibrium: the polarisation is in the pack's r_internal, not here.

[params]
voc_full = { value = 4.181, unit = "V", fidelity = "derived", derivation = "Table value at SOC = 1: U_p(0.2700) - U_n(0.9014) with the Chen2020 OCP fits." }
voc_at_soc0 = { value = 2.5, unit = "V", fidelity = "derived", derivation = "Imposed: the stoichiometric window is solved so that OCV(SOC = 0) = 2.5 V, the LG M50 end-of-discharge voltage." }
xn100 = { value = 0.9014, unit = "1", src = "S1", fidelity = "literature" }
xp100 = { value = 0.2700, unit = "1", src = "S1", fidelity = "literature" }
dxp_dxn = { value = 0.6674, unit = "1", src = "S1", fidelity = "literature" }

[tables.ocv_vs_soc]
# SOC fraction 0..1 (1 = full), step 0.05; ocv_V = full-cell OCV evaluated from the Chen 2020 electrode fits as described above, rounded to 3 decimals. 21 points.
columns = ["soc", "ocv_V"]
rows = [
