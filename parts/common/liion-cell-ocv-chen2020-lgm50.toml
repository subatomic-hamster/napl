  [0.05, 3.107],
  [0.10, 3.292],
  [0.15, 3.431],
  [0.20, 3.484],
  [0.25, 3.526],
  [0.30, 3.578],
  [0.35, 3.626],
  [0.40, 3.664],
  [0.45, 3.702],
  [0.50, 3.746],
  [0.55, 3.793],
  [0.60, 3.835],
  [0.65, 3.882],
  [0.70, 3.941],
  [0.75, 3.987],
  [0.80, 4.034],
  [0.85, 4.076],
  [0.90, 4.095],
  [0.95, 4.114],
  [1.00, 4.181],
