src = "S1"
fidelity = "derived"
derivation = "Table = U_p(x_p) - U_n(x_n) with the Chen 2020 / PyBaMM Chen2020 electrode OCP fits, stoichiometries x_n = 0.9014 - (1 - SOC) dn and x_p = 0.2700 + (1 - SOC) dn x 0.6674, dn solved so that OCV(0) = 2.5 V (header comment); evaluated by hand-written bisection in python, rounded to 3 decimals. The full-cell window is our construction from published electrode data, not a published full-cell table."

