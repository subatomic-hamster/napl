[params]
thread_diameter = { value = 3e-3, unit = "m", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 6.1e-4
unit = "kg"
fidelity = "estimated"
rationale = "Holybro gives no flange-nut standard. The vendor STEP (x500v2-frame.step, measured with OpenCascade) models these nuts as a solid 7.6 mm flange diameter x 4.8 mm tall body of 102 mm3; at 7850 kg/m3 solid = 0.80 g; subtracting a 2.5 mm core bore through 4.8 mm (23.6 mm3 = 0.19 g) gives 0.61 g. Same order as the DIN 985 M3 nut (0.5 g, see din985-m3-locknut) plus a flange. Retail DIN 6923 M3 stainless nuts quote ~0.65 g but that page could not be fetched."

[params.flange_diameter]
value = 7.6e-3
unit = "m"
fidelity = "derived"
derivation = "Bounding-box diameter of the 16 nut solids (7.60 x 4.80 x 7.60 mm, volume 102 mm3 each) in Holybro's x500v2-frame.step, computed with OpenCascade BRepBndLib."

