id = "iso10642-m2.5x6"
name = "Countersunk (sunk) hex socket screw M2.5x6, steel"
category = "fastener"
vendor = "generic (ISO 10642 / DIN 7991)"
part_number = "ISO 10642 M2.5x6"
url = "https://fasten.it/norms/norm/din_7991"

[params]
thread_diameter = { value = 2.5e-3, unit = "m", src = "S3", fidelity = "datasheet" }
length          = { value = 6e-3, unit = "m", src = "S3", fidelity = "datasheet" }
steel_density   = { value = 7850, unit = "kg/m3", src = "S1", fidelity = "datasheet" }
thread_pitch    = { value = 0.45e-3, unit = "m", src = "S4", fidelity = "datasheet" }   # M2.5 coarse pitch (ISO 261), same for every M2.5 screw

[params.mass]
value = 2.34e-4
unit = "kg"
fidelity = "derived"
derivation = "DIN 7991 table (S1) has no M2.5 column; M3x6 = 0.41 kg/1000 pcs. Scaled by the ISO 4762 M2.5x6 / M3x6 mass ratio 0.405 / 0.71 = 0.570 (both from the same ISO 4762 table, see iso4762-m2.5x6 and iso4762-m3x6): 0.41 * 0.570 = 0.234 g."

[params.mass_tol]
value = 4.0e-5
unit = "kg"
fidelity = "estimated"
rationale = "mass (0.234 g) is the DIN 7991 M3x6 table value scaled by an ISO 4762 M2.5/M3 mass ratio (no M2.5 column in the DIN 7991 table), so about +-17% (0.04 g) is carried; negligible against any assembly."

[[ports]]
name = "thread"
kind = "mech"
type = "thread.m2.5"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
length = 0.006
fidelity = "datasheet"
src = "S3"
note = "Shank thread of the countersunk screw; pos at the underside of the (flat) head, axis points out of the shank tip (library screw convention); length 6 mm = params.length (S3, PX4 guide 'Sunk Screw M2.5*6'); pitch in params.thread_pitch (S4)."

