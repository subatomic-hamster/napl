[[sources]]
id = "S1"
url = "https://rincon-mora.gatech.edu/publicat/jrnls/tec05_batt_mdl.pdf"
title = "M. Chen and G. A. Rincon-Mora, Accurate Electrical Battery Model Capable of Predicting Runtime and I-V Performance, IEEE Trans. Energy Conversion 21(2), 504-511, 2006"
accessed = "2026-10-07"
quote = "Ten new 850mAh TCL PL-383562 polymer Li-Ion batteries were tested with suitably-spaced pulse discharge currents (80, 160, 320, and 640 mA in this case) at room temperature. For safety consideration, these batteries were charged with constant currents less than 800mA, 4.1V constant voltage and 10mA end-of-charge current, and discharged with pulse currents aforementioned and 3.0V end-of-discharge voltage. VOC(SOC) = -1.031*e^(-35*SOC) + 3.685 + 0.2156*SOC - 0.1178*SOC^2 + 0.3201*SOC^3, RSeries(SOC) = 0.1562*e^(-24.37*SOC) + 0.07446, RTransient_S(SOC) = 0.3208*e^(-29.14*SOC) + 0.04669, CTransient_S(SOC) = -752.9*e^(-13.51*SOC) + 703.6, RTransient_L(SOC) = 6.603*e^(-155.2*SOC) + 0.04984, CTransient_L(SOC) = -6056*e^(-27.12*SOC) + 4475"
