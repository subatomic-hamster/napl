id = "lipo-cell-ocv-chen2006"
ports_note = "Data-only open-circuit-voltage and Thevenin-parameter curves for a polymer Li-ion (LiPo pouch) cell; not a physical part, no ports."
name = "Polymer Li-ion (LiPo pouch) cell OCV and RC parameters vs SOC, Chen & Rincon-Mora 2006 (TCL PL-383562, 850 mAh)"
category = "battery.cell_curve"
vendor = "G. Chen / G. A. Rincon-Mora, Georgia Tech (measured on TCL PL-383562 cells)"
part_number = "TCL PL-383562 (850 mAh polymer Li-ion)"
url = "https://rincon-mora.gatech.edu/publicat/jrnls/tec05_batt_mdl.pdf"

# Measured pouch-cell fit, peer reviewed (IEEE Trans. Energy Conversion 21(2), 2006). The paper gives the analytic fit Eq. (2)-(7); the
# tables below are those equations evaluated by us at fixed SOC steps (no digitisation involved). The OCV fit was extracted from
# pulse-discharge curves at 80-640 mA at room temperature (temperature value not stated; cooling fan held it constant).
# CAVEATS: (1) these cells were charged to 4.1 V (not 4.2 V), so VOC(SOC=1) = 4.103 V; a 4.2 V LiPo reads ~0.1 V higher at the top.
# (2) 850 mAh energy-type cell, 1C-class; Rseries is several times that of a 35C power pack scaled by capacity (see docs/research/battery-data.md).
# (3) The exponentials make SOC < 0.05 a curve-fit artefact (negative C at SOC 0): trust 0.05..1.

[params]
voc_full = { value = 4.103, unit = "V", fidelity = "derived", derivation = "Eq. (2) at SOC = 1: -1.031 e^-35 + 3.685 + 0.2156 - 0.1178 + 0.3201 = 4.103 V (cells were charged with 4.1 V constant voltage, S1)." }
voc_at_soc0 = { value = 2.654, unit = "V", fidelity = "derived", derivation = "Eq. (2) at SOC = 0: -1.031 + 3.685 = 2.654 V (fit extrapolation; paper discharges to a 3.0 V end-of-discharge)." }
voc_a_exp_coeff = { value = -1.031, unit = "V", src = "S1", fidelity = "literature" }
voc_a_exp_rate = { value = -35, unit = "1", src = "S1", fidelity = "literature" }
voc_c0 = { value = 3.685, unit = "V", src = "S1", fidelity = "literature" }
voc_c1 = { value = 0.2156, unit = "V", src = "S1", fidelity = "literature" }
voc_c2 = { value = -0.1178, unit = "V", src = "S1", fidelity = "literature" }
voc_c3 = { value = 0.3201, unit = "V", src = "S1", fidelity = "literature" }
r_series_plateau = { value = 0.07446, unit = "ohm", src = "S1", fidelity = "literature" }   # Eq. (3) asymptote, whole 850 mAh cell
r_transient_s_plateau = { value = 0.04669, unit = "ohm", src = "S1", fidelity = "literature" }   # Eq. (4)
c_transient_s_plateau = { value = 703.6, unit = "F", src = "S1", fidelity = "literature" }   # Eq. (5)
r_transient_l_plateau = { value = 0.04984, unit = "ohm", src = "S1", fidelity = "literature" }   # Eq. (6)
c_transient_l_plateau = { value = 4475, unit = "F", src = "S1", fidelity = "literature" }   # Eq. (7)
tau_transient_s = { value = 32.9, unit = "s", fidelity = "derived", derivation = "R_Transient_S x C_Transient_S = 0.04669 ohm x 703.6 F = 32.85 s (plateau values, SOC >= 0.2)." }
tau_transient_l = { value = 223.0, unit = "s", fidelity = "derived", derivation = "R_Transient_L x C_Transient_L = 0.04984 ohm x 4475 F = 223.0 s (plateau values)." }
r_series_times_capacity = { value = 0.0633, unit = "ohm*Ah", fidelity = "derived", derivation = "R_Series plateau 0.07446 ohm x 0.850 Ah (nominal capacity, S1) = 0.0633 ohm*Ah; per-cell R scales roughly as 1/capacity for the same cell design, so a 5.2 Ah cell of this design would be ~12 mOhm. Real 35C power cells are lower; use as an upper bound." }

