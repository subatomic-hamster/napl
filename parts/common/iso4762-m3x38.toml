[params.mass]
value = 2.26e-3
unit = "kg"
fidelity = "derived"
derivation = "ISO 4762 M3 table (S1) ends at l=30 (1.86 kg/1000 pcs) and l=25 is 1.61, so the shank adds (1.86-1.61)/5 = 0.05 g per mm; M3x38 = 1.86 + 8 * 0.05 = 2.26 g. Cross-check: pi/4*(3.0 mm)^2*7.85 g/cm3 = 0.055 g/mm, consistent."

