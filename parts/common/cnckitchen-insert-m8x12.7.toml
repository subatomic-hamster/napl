id = "cnckitchen-insert-m8x12.7"
name = "CNC Kitchen M8 heat-set threaded insert, 12.7 mm long, brass"
category = "fastener.insert"
vendor = "CNC Kitchen"
part_number = "M8x12.7"
url = "https://www.3djake.com/cnc-kitchen/threaded-inserts-m3-standard"

# Frame: origin at the open (screw-side) face on the axis, +z out of the face; the insert body extends to z = -L.
[params]
length          = { value = 12.7e-3, unit = "m", src = "S1", fidelity = "datasheet" }
outer_diameter  = { value = 8.7e-3, unit = "m", src = "S1", fidelity = "datasheet" }
centre_diameter = { value = 9.5e-3, unit = "m", src = "S1", fidelity = "datasheet" }
hole_diameter   = { value = 9.7e-3, unit = "m", src = "S1", fidelity = "datasheet" }
min_wall        = { value = 3.3e-3, unit = "m", src = "S1", fidelity = "datasheet" }

# The vendor table lists D1 (insert diameter) 8.7 mm but D2 / D3 (9.5 / 9.7 mm) larger than D1 for M8, which cannot be a plain
# cylinder: the values are filed exactly as printed (a probable typo in the retailer table) and the mass below uses D1.
[params.mass]
value = 0.00267
unit = "kg"
fidelity = "estimated"
rationale = "No mass published, and the M8 row of the vendor table is internally inconsistent (D1 8.7 mm < D2 9.5 mm), so the geometry is uncertain. Brass tube: outer diameter taken as the 8.7 mm D1 as printed, bore = M8 minor diameter 6.65 mm (nominal - 1.082 x 1.25 mm pitch), density 8500 kg/m3 (typical brass, assumed): pi/4*(8.7^2-6.65^2)*12.7 = 314 mm3 -> 2.67 g. Treat as +-50 %."

[[ports]]
name = "thread"
kind = "mech"
type = "thread.m8"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
length = 0.0127
note = "Internal M8 thread over the full 12.7 mm length (assumed through-threaded). Hole diameter 9.7 mm as printed in S1."

