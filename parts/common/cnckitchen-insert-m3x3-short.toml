rationale = "No mass published. Brass tube of the stated outer diameter (4.6 mm) and length, bore = M3 minor diameter 2.4 mm (nominal - 1.082 x 0.5 mm pitch), density 8500 kg/m3 (typical brass, assumed): pi/4*(4.6^2-2.4^2)*3.0 = 36.3 mm3 -> 0.31 g, knurl and flange ignored; about +-30 %."

