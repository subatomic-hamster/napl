id = "so101-base"
name = "SO-101 base (3D printed, follower)"
category = "frame.printed"
vendor = "TheRobotStudio (open design, Apache-2.0)"
part_number = "Base_SO101.stl (sim mesh base_so101_v2.stl)"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/STL/SO101/Individual/Base_SO101.stl"

[params]
volume_solid = { value = 1.2271e-4, unit = "m^3", fidelity = "derived", derivation ="Signed-volume (divergence theorem) integral over the 9430 triangles of meshes/so101/base_so101_v2.stl (binary STL, units metres) = 122.71 cm^3. Solid; excludes infill/shell split." }
infill_fraction = { value = 0.15, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale ="Repo README gives only material, nozzle/layer height and 15% infill, no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile). Needed only to split the mass into shell and infill." }

[geometry]
shape = "mesh"
mesh = "meshes/so101/base_so101_v2.stl"
material = "pla"
urdf_link = "base_link"
origin_xyz = [-0.00636471, 0.0, -0.0024]
origin_rpy = [1.5708, 0.0, 1.5708]
bbox_min = [-0.0555, 0.0, -0.016]
bbox_max = [0.0555, 0.072, 0.071]
# mesh units metres; origin = visual/collision pose of the mesh in the URDF link frame (tiny values like 1e-15 rounded to 0)

[[sources]]
id = "S1"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/README.md"
title = "SO-ARM100 README, Printing the Parts, Step 1 (commit a758567)"
accessed = "2026-10-06"
quote = "Material: PLA+ || Nozzle Diameter and Precision: 0.4mm nozzle diameter at 0.2mm layer height or 0.6mm nozzle at 0.4mm layer height. || Infill Density: 15%"
license = "Apache-2.0"

