id = "so101-base"
name = "SO-101 base (3D printed, follower)"
category = "frame.printed"
vendor = "TheRobotStudio (open design, Apache-2.0)"
part_number = "Base_SO101.stl (sim mesh base_so101_v2.stl)"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/STL/SO101/Individual/Base_SO101.stl"

[params]
volume_solid = { value = 1.2271e-4, unit = "m^3", fidelity = "derived", derivation ="Signed-volume (divergence theorem) integral over the 9430 triangles of meshes/so101/base_so101_v2.stl (binary STL, units metres) = 122.71 cm^3. Solid; excludes infill/shell split." }
infill_fraction = { value = 0.15, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale ="Repo README gives only material, nozzle/layer height and 15% infill, no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile). Needed only to split the mass into shell and infill." }

[geometry]
shape = "mesh"
mesh = "meshes/so101/base_so101_v2.stl"
material = "pla"
urdf_link = "base_link"
origin_xyz = [-0.00636471, -8.97657e-09, -0.0024]
origin_rpy = [1.5708, 0.0, 1.5708]
bbox_min = [-0.0555, 0.0, -0.016]
bbox_max = [0.0555, 0.072, 0.071]
# mesh units metres; origin = visual/collision pose of the mesh in the URDF link frame (tiny values like 1e-15 rounded to 0)

# Ports derived by tools/so101_ports.py (closure check: python tools/so101_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame.
[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.feetech-sts3215-base"
gender = "neutral"
pos = [-1.20114e-07, 0.062000120113, 0.032699782261]
axis = [0.0, -0.999999999993, 3.673205e-06]
ref = [-3.673205e-06, 3.673205e-06, 0.999999999987]
symmetry = 2
thread = "m2"
hole_pos = [[0.0196, 0.00935], [-0.0196, 0.00935], [-0.0196, -0.00935], [0.0196, -0.00935]]
hole_pos_rationale = "Estimated placeholder (not a measured pattern): 4 holes at the corners of the 45.2 x 24.7 mm servo case footprint (datasheet size) inset 3 mm; screws are the 'PA2.0 self-tapping' M2 of the servo kit. Only places the 0.28 g screw masses of the builder's fastener model (CoM shift well under 1 mm); no kinematic role."
thickness = 0.003
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): F = inv(T_part) @ T_servo_shoulder_pan @ P_base @ Rx(pi); the servo holding part is chosen by mesh contact (tools/so101_ports.py --evidence)"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin). Estimated."
servo_joint = "shoulder_pan"

[[ports]]
name = "motor_holder_seat"
kind = "mech"
type = "bolt-pattern.so101-base-motor-holder"
gender = "neutral"
pos = [0.00137419422, 0.053800008326, 0.021699861918]
axis = [0.0, 0.999999999993, -3.673205e-06]
ref = [-3.673205e-06, 3.673205e-06, 0.999999999987]
symmetry = 1
thickness = 0.004
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): mate frame M at the centre of the bbox overlap of the two parts (mid-plane of the gap where the bboxes only touch), axis along the thinnest overlap dimension from so101-base towards so101-base-motor-holder; port = inv(T_part) @ M (a) or inv(T_part) @ M @ Rx(pi) (b)"
thickness_rationale = "No published or measurable value; 4 mm placeholder = two 2 mm printed walls clamped by M3 screws. Estimated."

[[ports]]
name = "plate_seat"
kind = "mech"
type = "bolt-pattern.so101-base-waveshare-plate"
gender = "neutral"
pos = [-0.000199364036, 0.049799932012, -0.016509216068]
axis = [3.673205e-06, -3.673205e-06, -0.999999999987]
ref = [0.999999999993, 1.3e-11, 3.673205e-06]
symmetry = 1
thickness = 0.004
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): mate frame M at the centre of the bbox overlap of the two parts (mid-plane of the gap where the bboxes only touch), axis along the thinnest overlap dimension from so101-base towards so101-waveshare-mounting-plate; port = inv(T_part) @ M (a) or inv(T_part) @ M @ Rx(pi) (b)"
thickness_rationale = "No published or measurable value; 4 mm placeholder = two 2 mm printed walls clamped by M3 screws. Estimated."

