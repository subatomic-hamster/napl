id = "koch-shoulder-to-elbow"
name = "Koch v1.1 follower shoulder-to-elbow arm (3D printed, link_2)"
category = "frame.printed"
vendor = "Jess Moss / Hugging Face (Koch v1.1, Apache-2.0); original design Alexander Koch"
part_number = "Follower_Shoulder_To_Elbow.STL (sim mesh link_2.STL)"
url = "https://github.com/jess-moss/koch-v1-1/blob/1a553e1fa7d5404b51bbd83b99b0f7eba54888e0/hardware/follower/STL/Follower_Shoulder_To_Elbow.STL"

[params]
volume_solid = { value = 3.4361e-5, unit = "m^3", fidelity = "derived", derivation = "Signed-volume (divergence theorem) integral over the 1382 triangles of meshes/koch/link_2.STL (binary STL, metres) = 34.361 cm^3. Solid; excludes infill. The upstream hardware/follower/STL/Follower_Shoulder_To_Elbow.STL (mm) integrates to 34356.3 mm^3 (same solid, 0.01 % apart, re-tessellated)." }
infill_fraction = { value = 0.30, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "The Koch v1.1 README gives material, layer height, maximum nozzle diameter and ~30 % infill (its author used 37 %), no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
shoulder_lift_range = { value = [-1.57, 0.6], unit = "rad", fidelity = "estimated", rationale = "No published limit (the URDF of S2 has a placeholder -3.14 .. 3.14). MuJoCo Menagerie low_cost_robot_arm (S3) sets 'approximate joint limits' of -1.57 .. 0.6 for joint pitch, same axis (0 1 0) as URDF joint_2." }

[geometry]
shape = "mesh"
mesh = "meshes/koch/link_2.STL"
material = "pla"
urdf_link = "link_2"
origin_xyz = [0.0, 0.0, 0.0]
origin_rpy = [0.0, 0.0, 0.0]
bbox_min = [-0.013, -0.0011, -0.0129]
bbox_max = [0.013, 0.0429, 0.119]
# mesh units metres; the mesh is already in the URDF link frame (visual origin identity). Link frame origin = shoulder_lift joint origin (the horn outer face).

# Ports derived by tools/koch_ports.py (closure check: python tools/koch_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame = URDF link frame.
# horn_seat: mate with robotis-xl430-w250-t `output` (k = 0) with reverse = true (URDF joint_2 axis is +y, the output axis is -y); q = 0 is the URDF zero of shoulder_lift, limits in shoulder_lift_range.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.dynamixel-xl430"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = inv(J_joint_2) @ S_joint_2 @ Rx(pi) with J the URDF joint frame (joint_2 = shoulder_lift) and S the servo frame in the parent link; mating robotis-xl430-w250-t.output (k = 0) reproduces the URDF. The URDF joint axis is the INVERSE of the output axis, so the mate needs reverse = true to get the URDF sign"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
joint = "shoulder_lift"
joint_reverse = true

# servo_seat: seat of the elbow_flex servo (Dynamixel XL330-M288-T) in this arm.
[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [-0.007300002035, 0.03240000084, 0.108300000429]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = S_joint_3 @ P_base @ Rx(pi) (printed part frame = parent link frame); the holder is the printed part of the link whose *_motor mesh contains the servo"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
servo_joint = "elbow_flex"

