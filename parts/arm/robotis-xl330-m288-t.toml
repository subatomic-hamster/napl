id = "robotis-xl330-m288-t"
name = "ROBOTIS DYNAMIXEL XL330-M288-T 288.4:1 TTL smart servo (Koch v1.1 follower elbow/wrist/gripper)"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XL330-M288-T"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl330-m288/"

# Used 4x on the Koch v1.1 follower (elbow_flex id 3, wrist_flex 4, wrist_roll 5, gripper 6 in LeRobot), fed 5 V through the follower's voltage reducer (S3, S6).
# Same file pattern as parts/arm/feetech-sts3215-c001.toml. Evidence chain: docs/research/dynamixel.md.
# A library entry for the same servo exists in parts/actuators/robotis-dynamixel-xl330-m288.toml (datasheet only, I0 neglected); this arm part adds registers, loss law, gains.

[params]
mass            = { value = 0.018,   unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.020,   unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.026,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 288.4,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "engineering plastic gears and case; cored motor", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute encoder, ams AS5601
position_range  = { value = 6.28319, unit = "rad", src = "S1", fidelity = "datasheet" }        # Position Control Mode 0~360 deg (modes 4 and 5: +-256 rev)
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
protocol        = { value = "DYNAMIXEL Protocol 2.0, TTL half-duplex asynchronous serial 8N1, 3.3 V logic (5 V compatible), IDs 0-252, broadcast 254", unit = "-", src = "S1", fidelity = "datasheet" }
model_number    = { value = 1200,    unit = "1",   src = "S2", fidelity = "datasheet" }        # control table address 0
operating_modes_supported = { value = "0 current, 1 velocity, 3 position, 4 extended position, 5 current-based position, 16 PWM", unit = "-", src = "S2", fidelity = "datasheet" }
connector       = { value = "JST EHR-03 housing, JST B3B-EH-A PCB header, pins 1 GND / 2 VDD / 3 DATA, 21 AWG", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 70, unit = "degC", src = "S1", fidelity = "datasheet" }
idle_current    = { value = 0.017,   unit = "A",   src = "S1", fidelity = "datasheet" }        # "Standby Current"
firmware_hz     = { value = 1000,    unit = "Hz",  fidelity = "estimated", rationale = "The control loop rate is not published in the e-Manual (grepped the XL330-M288 and XL430-W250 pages: no sample time / kHz figure). Estimate: 1 kHz. Basis: Realtime Tick (addr 120) has a 1 ms unit (S2), the MCU is a 64 MHz Cortex-M0+ (S1), and the older e-Manual states the PID constants 'include sampling time' (docs/research/dynamixel.md 5.3). Rhoban BAM measured a 5.9-10.6 ms command-to-motion delay on this servo (S4), which does not bound the loop rate. Unverified; the sim needs 1/(firmware_hz*dt) to be an integer." }

# --- electrical / performance at the three published voltages (datasheet; rev/min converted to rad/s with 2*pi/60) ---
v_nominal           = { value = 5.0,    unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 5.0 [V]"
v_operating_min     = { value = 3.7,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 6.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_3v7    = { value = 0.42,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_3v7   = { value = 1.11,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_3v7   = { value = 7.9587, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 76 rev/min
stall_torque_5v     = { value = 0.52,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_5v    = { value = 1.47,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_5v    = { value = 10.7861, unit = "rad/s", src = "S1", fidelity = "datasheet" } # 103 rev/min
stall_torque_6v     = { value = 0.60,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_6v    = { value = 1.74,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 12.8805, unit = "rad/s", src = "S1", fidelity = "datasheet" } # 123 rev/min
kt_output_datasheet = { value = 0.354,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # stall torque / stall current at the output shaft, 5 V point

# --- DC-motor equivalent model (motor-side), derived. ROBOTIS publishes NO no-load current, so I0 is an estimate (below) and Ke is refitted with it ---
r_effective = { value = 3.42, unit = "ohm", fidelity = "derived", derivation = "Stall points: V/I_stall = 3.7/1.11 = 3.333, 5.0/1.47 = 3.401, 6.0/1.74 = 3.448 ohm; mean of the 5 V and 6 V points = 3.42 ohm (the library convention of parts/actuators/robotis-dynamixel-xl330-m288). Includes H-bridge and lead resistance. Caveat (S2 NOTE): the XL330 measures current at its input supply, which equals the motor current only at 100 % duty; a locked-rotor test at full duty is assumed." }
no_load_current_5v = { value = 0.088, unit = "A", fidelity = "estimated", rationale = "Not published. 0.06 x I_stall(5 V) = 0.06 x 1.46 A = 0.088 A, the I0/I_stall ratio of the STS3215 (0.15/2.5 = 0.060 at 7.4 V, 0.13/2.0 = 0.065 at 6 V, feetech-sts3215-c001). Rhoban BAM's identified XL330-M288 friction (S4 m1.json: friction_base 0.01909 N*m, friction_viscous 0.003924 N*m*s/rad at the OUTPUT) converts to ~0.13-0.15 A at the 5 V no-load speed (Coulomb 0.019/(288.4*Ke) = 0.04 A + viscous 0.003924*10.786/(288.4*Ke) = 0.09 A, Ke = 1.5e-3), so 0.088 A is the low end of the plausible range. Unverified." }
omega_noload_motor_5v = { value = 3110.7, unit = "rad/s", fidelity = "derived", derivation = "Motor-side no-load speed at 5 V = N * omega_out = 288.4 * 10.7861 rad/s (103 rev/min) = 3110.7 rad/s = 29706 rpm; the w0 of the loss law (docs/models.md) for the 5 V no-load current." }
ke = { value = 0.001515, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R_eff)/(N*omega_out) with I0 = 0.06*I_stall(V) (estimate above), so I0*R_eff = 0.06 V: 3.7 V 3.478/(288.4*7.9587) = 1.5153e-3; 5 V 4.70/(288.4*10.7861) = 1.5109e-3; 6 V 5.64/(288.4*12.8805) = 1.5183e-3; mean 1.5148e-3 -> 1.515e-3 V*s/rad (three voltages agree to 0.5 %). Neglecting I0 (as parts/actuators/robotis-dynamixel-xl330-m288 does) gives 1.611e-3, 6 % higher." }
kt_motor = { value = 0.001515, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke for an ideal DC motor; motor-side torque constant." }
kv_equivalent = { value = 6304.9, unit = "rpm/V", fidelity = "derived", derivation = "Kv = 60/(2*pi*ke) = 9.5493/1.5148e-3 = 6304.9 rpm/V, motor side (before the 288.4:1 gear)." }
gear_efficiency = { value = 0.851, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) with I0 = 0.06*I_stall: 5 V 0.52/(288.4*1.5109e-3*(1.47-0.0882)) = 0.863; 6 V 0.60/(288.4*1.5183e-3*(1.74-0.1044)) = 0.838; mean 0.851 (plastic 288:1 train at stall). Cross-check: eta*N*Ke = 0.851*288.4*1.5148e-3 = 0.372 N*m/A vs datasheet output Kt 0.354 (5 V) and Rhoban BAM's identified kt 0.346-0.371 (S4)." }
i0_visc = { value = 0.69, unit = "1", fidelity = "estimated", rationale = "Viscous share of the no-load loss torque (schema i0_visc, docs/models.md). No two no-load currents are published (the STS3215 recipe needs them), so the split is borrowed: Rhoban BAM m1.json for this servo gives Coulomb 0.01909 N*m and viscous 0.003924*10.786 = 0.0423 N*m at the 5 V no-load output speed, a viscous share of 0.0423/(0.0191+0.0423) = 0.69; coincidentally the same as the STS3215's 0.6916. Unverified." }
rotor_inertia_motor = { value = 1.89e-8, unit = "kg*m^2", fidelity = "derived", derivation = "Rhoban BAM identified armature of this exact servo, 0.0015732 kg*m^2 (m6.json; m1 0.0016091), reflected at the output; divided by N^2 = 288.4^2 = 83175 gives 1.89e-8 kg*m^2 at the motor. It is an apparent inertia (includes gear-train inertia), so an upper bound for the rotor alone. The ROBOTIS 'Moment of Inertia' download (XL330/XC330) redirected to an unrelated host and could not be fetched." }
stall_torque_5v_model = { value = 0.5107, unit = "N*m", fidelity = "derived", derivation = "Model check: eta*N*Ke*(V/R_eff - I0) = 0.851*288.4*1.5148e-3*(5/3.42 - 0.088) = 0.511 N*m vs datasheet 0.52 (-1.8 %)." }

# --- servo-loop scaling for the napl servo device (docs/research/dynamixel.md section 10) ---
pwm_full_scale = { value = 885, unit = "counts", src = "S2", fidelity = "datasheet" }  # PWM Limit(36) range "0(0 [%]) ~ 885(100 [%] )"; 1 count = 0.113 %
pid_scale = { value = 113280, unit = "1", fidelity = "derived", derivation = "duty = PWM/885 with PWM = KPP*e = (P/128)*e (S2: 'KPP = KPP(TBL) / 128'; error in encoder counts and PWM output units are inferences, the e-Manual does not state them) -> duty = P*e/(128*885) -> pid_scale = 113,280. Rhoban BAM measured an XL330 divisor of 256 instead of 128 ('Empirically observed for XL330 (manual mentions 128)', S4), i.e. pid_scale 226,560; unresolved, plausible range 113,280-226,560." }
d_scale = { value = 14160, unit = "1", fidelity = "derived", derivation = "KPD = D/16 (S2) acting on the per-sample error change: duty_D = D*de/(16*885) -> d_scale = 14,160 (8x smaller than pid_scale: D weighs 8x more per register unit than P). Valid when the sim firmware step equals the real control period (the older e-Manual says the constants include sampling time); otherwise scale by Ts_sim/Ts_real." }
i_per_reg_i = { value = 0.001953125, unit = "1", fidelity = "derived", derivation = "The schema has no i_scale. KPI = I/65536 (S2) per sample: duty_I = I*sum(e)/(65536*885) = i*sum(e)/pid_scale -> device i = I_reg*pid_scale/(65536*885) = I_reg/512 for pid_scale 113,280 (general form I_reg*pid_scale/57,999,360). Convert in the port/assembly; the register default I = 0 maps to 0." }
# Device-schema views of the registers below (units the servo device field table expects: p / i / d "count", max_torque "0.1 %"); values = the e-Manual defaults, bound by assemblies/koch.toml [device_maps.xl330_m288].
device_p_default = { value = 400, unit = "count", src = "S2", fidelity = "datasheet" }    # = reg_position_p_gain_default (addr 84)
device_i_default = { value = 0, unit = "count", src = "S2", fidelity = "datasheet" }      # = reg_position_i_gain_default (addr 82); device i = I_reg * i_per_reg_i, inert at 0
device_d_default = { value = 0, unit = "count", src = "S2", fidelity = "datasheet" }      # = reg_position_d_gain_default (addr 80)
device_max_torque_default = { value = 1000, unit = "0.1 %", fidelity = "derived", derivation = "PWM Limit(36) default 885 = 100 % duty (S2): max_torque = 1000 x 885 / 885 = 1000 (docs/research/dynamixel.md section 10.1 item 6)." }
dead_zone_default = { value = 0, unit = "count", fidelity = "estimated", rationale = "The control table has no dead-band register (S2 table checked); 0 counts assumed. The In-Position bit of Moving Status uses an unpublished threshold." }

# --- registers (e-Manual control table, S2). Physical units where the sim device expects them; raw register value in the comment ---
reg_return_delay_time_default = { value = 250, unit = "2 us", src = "S2", fidelity = "datasheet" }  # addr 9; 250 = 500 us
reg_baud_rate_default         = { value = 1,   unit = "index", src = "S2", fidelity = "datasheet" } # addr 8; 1 = 57,600 bps (3 = 1 Mbps, what LeRobot sets, S6)
reg_id_default                = { value = 1,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 7
reg_secondary_id_default      = { value = 255, unit = "1", src = "S2", fidelity = "datasheet" }    # addr 12 (253-255 = off)
reg_drive_mode_default        = { value = 0,   unit = "bitmask", src = "S2", fidelity = "datasheet" } # addr 10
reg_operating_mode_default    = { value = 3,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 11 = Position Control Mode
reg_protocol_type_default     = { value = 2,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 13
reg_homing_offset_default     = { value = 0,   unit = "count", src = "S2", fidelity = "datasheet" } # addr 20, range -1,044,479 ~ 1,044,479; Present = Actual + Homing Offset
reg_moving_threshold_default  = { value = 10,  unit = "0.229 rev/min", src = "S2", fidelity = "datasheet" } # addr 24
reg_temperature_limit_default = { value = 70,  unit = "degC", src = "S2", fidelity = "datasheet" } # addr 31
reg_max_voltage_limit_default = { value = 7.0, unit = "V", src = "S2", fidelity = "datasheet" }    # addr 32, raw 70 * 0.1 V
reg_min_voltage_limit_default = { value = 3.5, unit = "V", src = "S2", fidelity = "datasheet" }    # addr 34, raw 35 * 0.1 V
reg_pwm_limit_default         = { value = 885, unit = "0.113 %", src = "S2", fidelity = "datasheet" } # addr 36 (= 100 %, device max_torque 1000)
reg_current_limit_default     = { value = 1750, unit = "mA", src = "S2", fidelity = "datasheet" }  # addr 38
reg_velocity_limit_default    = { value = 445, unit = "0.229 rev/min", src = "S2", fidelity = "datasheet" } # addr 44 = 101.9 rev/min
reg_max_position_limit_default = { value = 4095, unit = "count", src = "S2", fidelity = "datasheet" } # addr 48
reg_min_position_limit_default = { value = 0,    unit = "count", src = "S2", fidelity = "datasheet" } # addr 52
reg_startup_configuration_default = { value = 0, unit = "bitmask", src = "S2", fidelity = "datasheet" } # addr 60
reg_pwm_slope_default         = { value = 140, unit = "1.977 mV/ms", src = "S2", fidelity = "datasheet" } # addr 62
