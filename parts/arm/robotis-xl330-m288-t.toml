# --- geometry + mechanical ports: merged from `python tools/koch_ports.py --servo` (stage A3 / S4) ---
[visual]                            # cosmetic only (parts/README.md "Visual layer"); drawn in the Koch servo frame (the mesh's)
src = "V1"
note = "XL330: the X-series shell scaled to 20 x 34 x 23 mm with a 2.9 mm horn hub; black round horn with four holes (ROBOTIS product photo)."

[[visual.elements]]
gen = "dxl_servo"
params = { off = 0.0095, hub = 0.0029, depth = 0.023 }
colors = { horn = "plastic-dark" }

[[sources]]
id = "V1"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl330-m288/"
title = "ROBOTIS e-Manual XL330-M288, product photo (xl330-series_product.png)"
accessed = "2026-10-08"
quote = "[image] DYNAMIXEL XL330 X-Series: small black shell, round black horn with four holes and a centre hub, four corner screws, X-Series label under the horn"

[geometry]
shape = "mesh"
mesh = "meshes/koch/xl330_m288_t.stl"
bbox_min = [-0.0095, -0.01, -0.0259]
bbox_max = [0.0245, 0.01, -0.0029]
# units metres; solid mesh volume 1.5590e-05 m^3. Servo frame (tools/koch_ports.py): origin on the horn axis at the outer face of the horn hub,
# z = outward horn normal, x = along the body's long axis towards the body centre, y = z x x. The body is cut out of the Koch v1.1
# *_motor.STL link meshes (Apache-2.0, meshes/koch/NOTICE) and replaced by its convex hull (136 triangles; the cut-out body is not
# manifold, MuJoCo rejects it with inertia=exact); hub/horn pieces of the XL330 and screws/idler frames are not included.

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dynamixel-xl330"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): servo frame S = [origin = joint origin (on the horn axis, at the outer face of the horn hub), z = outward horn normal = -(joint axis), x = in-plane direction from the horn axis to the body centre (the body's long axis)]; the body is the largest component of the link's *_motor.STL (plus the cover shell for XL330) expressed in S; this port is S itself"
thickness_rationale = "Horn hub height beyond the body face read from the mesh: 2.9 mm between the body's output face and the joint (horn outer face) plane for XL330, measured on all four servos."

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [0.007499997965, 4.29e-10, -0.02590000084]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "estimated"
rationale = "Frame convention, not a measured hole pattern (same approach as the SO-101 servo base port): centre of the body face opposite the output (z = -0.025900 in the servo frame, centre x 0.007500, y 0.000000), axis out of that face (-z), ref along the long (x) side. The Koch parts hold the servos in pockets by several faces; the printed seats are derived so that this port reproduces the URDF placement."
thickness_rationale = "No published wall / ear thickness; 3 mm placeholder. Estimated."

# Electrical ports: two daisy-chain connectors on the same net (wiring diagram S3 shows Plug 1 / Plug 2 on every servo; pins 1 GND, 2 VDD, 3 DATA per S1).
[[ports]]
name = "port_a"
pins = ["J1.1", "J1.2", "J1.3"]
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "passthrough"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.7, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.74, unit = "A", src = "S1", fidelity = "datasheet" }   # stall current at 6 V; no continuous rating is published
note = "Plug 1 of the daisy chain (S3). JST EHR-03 housing, pin order 1 GND / 2 VDD / 3 DATA (S1). Connector current rating not published; i_peak is the servo's own stall draw, the downstream chain current is up to the DRC."

[[ports]]
name = "port_b"
pins = ["J2.1", "J2.2", "J2.3"]
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "passthrough"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.7, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.74, unit = "A", src = "S1", fidelity = "datasheet" }
note = "Plug 2 of the daisy chain (S3), same net as port_a."

[[ports]]
name = "bus"
pins = ["J1.3"]
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
level = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Single-wire half-duplex TTL on the DATA pin (3) of port_a / port_b; Protocol 2.0 (docs/research/dynamixel.md section 6); 3.3 V logic, 5 V compatible (S1); factory baud index 1 = 57,600 bps, LeRobot sets 1 Mbps (S7)."

# Connectors: the two daisy-chain sockets (Plug 1 / Plug 2, same net). Pin table: S1 Connector Information '1 GND | 2 VDD | 3 DATA', housing
# JST EHR-03, PCB header JST B3B-EH-A (2.5 mm pitch of the EH family). Pose (side wall, servo frame of the ports above) estimated: the
# e-Manual publishes no socket position.
[[connectors]]
id = "J1"
name = "TTL plug 1"
type = "jst-eh-3"
