count_follower_arm = { value = 24, unit = "1", fidelity = "derived", derivation ="Sum of M2x6 counts in the LeRobot follower assembly steps (S1): joint 1 motor 4 + motor holder 2; joint 2 motor 4; joint 3 motor 4; joint 4 motor 4; joint 5 motor 2 ('2 M2x6mm front screws'); gripper motor 2 on each side = 4. 6+4+4+4+2+4 = 24." }
mass = { value = 0.00028, unit = "kg", fidelity = "estimated", rationale ="No published mass. Pan head M2x6 steel: shank 2 mm x 6 mm = 19 mm^3 plus head ~4 mm dia x 1.6 mm (~17 mm^3) = ~36 mm^3 * 7.85 g/cm^3 = 0.28 g." }
material_density = { value = 7850, unit = "kg/m^3", fidelity = "estimated", rationale ="Screw material not stated; carbon steel density used." }
thread_pitch = { value = 0.0004, unit = "m", fidelity = "estimated", rationale = "The part is a PA2.0 self-tapping screw (S1); its pitch is not published. 0.4 mm is the ISO metric coarse pitch of nominal M2 (S2, ISO 4762 table row 'M 2 0.4'), used as a placeholder; a self-tapping thread is normally coarser." }

[geometry]
shape = "cylinder"
size = [0.001, 0.003]
