id = "waveshare-bus-servo-adapter-a"
name = "Waveshare Bus Servo Adapter (A) serial bus servo driver board (SO-101 motor control board)"
category = "pcb.servo_driver"
vendor = "Waveshare"
part_number = "Bus Servo Adapter (A)"
url = "https://www.waveshare.com/bus-servo-adapter-a.htm"

# The SO-ARM100 BOM lists "Motor Control Board" with Amazon link B0CTMM4LWK ("Waveshare ... Integrates ... Control Circuit ...");
# LeRobot docs: "If you are using a Waveshare controller board, make sure that the two jumpers are set on the `B` channel (USB)."

[params]
mass            = { value = 0.016, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.042, unit = "m",  src = "S2", fidelity = "datasheet" }
width           = { value = 0.033, unit = "m",  src = "S2", fidelity = "datasheet" }
input_voltage_min = { value = 9.0,  unit = "V", src = "S2", fidelity = "datasheet" }
input_voltage_max = { value = 12.6, unit = "V", src = "S2", fidelity = "datasheet" }
mounting_hole_diameter = { value = 0.0025, unit = "m", src = "S2", fidelity = "datasheet" }
mounting_hole_spacing_x = { value = 0.037, unit = "m", src = "S3", fidelity = "datasheet" }
mounting_hole_spacing_y = { value = 0.028, unit = "m", src = "S3", fidelity = "datasheet" }
max_servos      = { value = 253, unit = "1", src = "S2", fidelity = "datasheet" }
host_interface  = { value = "USB Type-C (jumper B) or UART (jumper A), bridged to the 1 Mbps half-duplex servo bus", unit = "-", src = "S2", fidelity = "datasheet" }
power_connector = { value = "5.5 x 2.1 mm DC jack or screw terminal", unit = "-", src = "S2", fidelity = "datasheet" }
max_continuous_current = { value = 5.0, unit = "A", fidelity = "estimated", rationale ="Waveshare publishes no current rating. Six follower servos stall at 2.0-2.5 A each (datasheet); the SO-101 BOM notes a 12V '5A+' supply for the 12V variant (README) and ships a 5V 4A supply for the 7.4V variant, so the board is operated up to ~4 A in the BOM. 5 A is only a placeholder bound for a simulator current limit, not a vendor figure." }
bus_forward_drop = { value = 0.0, unit = "V", fidelity = "estimated", rationale ="Servo power passes from the DC jack/terminal to the servo ports; no published series resistance or diode drop. Taken as 0 V; set a value if bench data appears." }

[geometry]
shape = "box"
size = [0.021, 0.0165, 0.006]
# size = half extents (m): length/2, width/2, height/2. Height 12 mm is estimated (USB-C + DC jack tall parts), board thickness not published.

[[ports]]
name = "mount"
kind = "mech"
type = "bolt-pattern.37x28.m2.5"
gender = "neutral"
pos = [0.0, 0.0, -0.006]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.0016
fidelity = "estimated"
rationale = "Hole spacing 37.00 x 28.00 mm from S3 (the pattern itself is datasheet); the frame is a convention: board geometry is a box centred on the part frame; the mount pattern is taken on the underside (box bottom, assuming the tall connectors are on top), axis -z, ref along the 42 mm side."
thickness_rationale = "PCB thickness not published; 1.6 mm standard; estimated."

[[ports]]
name = "power_in"
kind = "power"
type = "dc-barrel.5.5x2.1"
gender = "female"
role = "sink"
v_max = { value = 12.6, unit = "V", src = "S2", fidelity = "datasheet" }
v_min = { value = 9.0, unit = "V", src = "S2", fidelity = "datasheet" }
i_max = { value = 5.0, unit = "A", fidelity = "estimated", rationale = "Waveshare publishes no current rating; placeholder bound, see param max_continuous_current." }
note = "5.5 x 2.1 mm DC jack (S2). Note the SO-101 BOM feeds it 5 V, below the published 9 V minimum (see the voltage-limit mismatch recorded in docs/research/so101.md)."

[[ports]]
name = "servo_bus"
kind = "power"
type = "5264-3p"
gender = "female"
role = "source"
v_max = { value = 12.6, unit = "V", src = "S2", fidelity = "datasheet" }
fidelity = "estimated"
rationale = "The product page lists the compatible ST/SC servos but not the servo-port connector model or the number of ports, so this port is an assumption: 5264-3P because the STS3215 servo connector is 5264/2.54 3P (see feetech-sts3215-c001 S9) and the servo cable mates to it. The builder should treat all servo ports as one daisy-chain net carrying the DC input to the servos."
note = "Servo-side supply output: the DC input passes to the servo ports (no series drop published, see param bus_forward_drop)."

[[ports]]
name = "bus"
kind = "signal"
type = "feetech-ttl"
gender = "female"
note = "UART / USB-C (jumper B) to the half-duplex servo bus bridge (S2); host side not modelled."

