id = "koch-elbow-to-wrist-extension"
name = "Koch v1.1 follower elbow-to-wrist extension (3D printed, link_3)"
category = "frame.printed"
vendor = "Jess Moss / Hugging Face (Koch v1.1, Apache-2.0); original design Alexander Koch"
part_number = "Follower_Elbow_To_Wrist_Extension.STL (sim mesh link_3.STL)"
url = "https://github.com/jess-moss/koch-v1-1/blob/1a553e1fa7d5404b51bbd83b99b0f7eba54888e0/hardware/follower/STL/Follower_Elbow_To_Wrist_Extension.STL"

[params]
volume_solid = { value = 4.7983e-5, unit = "m^3", fidelity = "derived", derivation = "Signed-volume (divergence theorem) integral over the 1112 triangles of meshes/koch/link_3.STL (binary STL, metres) = 47.983 cm^3. Solid; excludes infill. The upstream hardware/follower/STL/Follower_Elbow_To_Wrist_Extension.STL (mm) integrates to 47962 mm^3 (same solid, 0.04 % apart, re-tessellated)." }
infill_fraction = { value = 0.30, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "The Koch v1.1 README gives material, layer height, maximum nozzle diameter and ~30 % infill (its author used 37 %), no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
elbow_flex_range = { value = [-1.45, 1.57], unit = "rad", fidelity = "estimated", rationale = "No published limit (the URDF of S2 has a placeholder -3.14 .. 3.14). MuJoCo Menagerie low_cost_robot_arm (S3) sets 'approximate joint limits' of -1.57 .. 1.45 for joint elbow, whose axis is (0 -1 0), the opposite of URDF joint_3 (0 1 0); negated and swapped here to the URDF axis: [-1.45, 1.57]." }

[geometry]
shape = "mesh"
mesh = "meshes/koch/link_3.STL"
material = "pla"
urdf_link = "link_3"
origin_xyz = [0.0, 0.0, 0.0]
origin_rpy = [0.0, 0.0, 0.0]
bbox_min = [-0.0817, -0.0031, -0.0085]
bbox_max = [0.0084, 0.032, 0.0145]
# mesh units metres; the mesh is already in the URDF link frame (visual origin identity). Link frame origin = elbow_flex joint origin (the horn outer face).

# Ports derived by tools/koch_ports.py (closure check: python tools/koch_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame = URDF link frame.
# horn_seat: mate with robotis-xl330-m288-t `output` (k = 0) with reverse = true (URDF joint_3 axis is +y, the output axis is -y); q = 0 is the URDF zero of elbow_flex, limits in elbow_flex_range.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.dynamixel-xl330"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = inv(J_joint_3) @ S_joint_3 @ Rx(pi) with J the URDF joint frame (joint_3 = elbow_flex) and S the servo frame in the parent link; mating robotis-xl330-m288-t.output (k = 0) reproduces the URDF. The URDF joint axis is the INVERSE of the output axis, so the mate needs reverse = true to get the URDF sign"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
joint = "elbow_flex"
joint_reverse = true

# servo_seat: seat of the wrist_flex servo (Dynamixel XL330-M288-T) in this extension.
[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [-0.092980002035, 0.02595000084, 0.002699900429]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = S_joint_4 @ P_base @ Rx(pi) (printed part frame = parent link frame); the holder is the printed part of the link whose *_motor mesh contains the servo"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
servo_joint = "wrist_flex"

