src = "S1"
fidelity = "datasheet"

# --- geometry + mechanical ports: same as robotis-xl330-m288-t (stage A3 / S4). INFERENCE: the e-Manual gives M077 and M288 the identical
# 20 x 34 x 26 mm envelope and 18 g (docs/research/dynamixel.md section 0 table), the leader frame is the same FPX330 set; no CAD comparison was made.
# The mesh is the Koch follower's XL330-M288-T body hull (tools/koch_ports.py --servo), which is the body shared by both models. ---
[geometry]
shape = "mesh"
mesh = "meshes/koch/xl330_m288_t.stl"
bbox_min = [-0.0095, -0.01, -0.0259]
bbox_max = [0.0245, 0.01, -0.0029]

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dynamixel-xl330"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "As robotis-xl330-m288-t (tools/koch_ports.py from meshes/koch/follower.urdf, servo frame S = origin on the horn axis at the outer face of the horn hub, z = outward horn normal, x = the body's long axis); valid for the M077 only to the extent its case equals the M288's (identical e-Manual envelope and mass)."
thickness_rationale = "As robotis-xl330-m288-t: 2.9 mm hub height measured on the Koch XL330-M288 meshes."

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [0.007499997965, 4.29e-10, -0.02590000084]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "estimated"
rationale = "Frame convention, not a measured hole pattern; as robotis-xl330-m288-t (centre of the body face opposite the output, axis out of that face, ref along the long side)."
thickness_rationale = "No published wall / ear thickness; 3 mm placeholder. Estimated."

# Electrical ports: two daisy-chain connectors on the same net (wiring diagram S3 shows Plug 1 / Plug 2 on every leader servo; pins 1 GND, 2 VDD, 3 DATA per S1).
[[ports]]
name = "port_a"
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "passthrough"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.7, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.74, unit = "A", src = "S1", fidelity = "datasheet" }   # stall current at 6 V; no continuous rating is published
note = "Plug 1 of the daisy chain (S3). JST EHR-03 housing, pin order 1 GND / 2 VDD / 3 DATA (S1). Connector current rating not published."

[[ports]]
name = "port_b"
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "passthrough"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.7, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.74, unit = "A", src = "S1", fidelity = "datasheet" }
note = "Plug 2 of the daisy chain (S3), same net as port_a."

[[ports]]
name = "bus"
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
level = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Single-wire half-duplex TTL on the DATA pin (3); Protocol 2.0; 3.3 V logic, 5 V compatible (S1); factory baud index 1 = 57,600 bps."

[visual]                            # cosmetic only; drawn in the Koch servo frame (the mesh's)
rationale = "Same case as robotis-xl330-m288-t (identical e-Manual envelope and mass): the X-series shell scaled to 20 x 34 x 23 mm with a 2.9 mm horn hub, same generator and parameters as that part."

[[visual.elements]]
gen = "dxl_servo"
params = { off = 0.0095, hub = 0.0029, depth = 0.023 }
colors = { horn = "plastic-dark" }

