id = "robotis-xl330-m077-t"
name = "ROBOTIS DYNAMIXEL XL330-M077-T 77.5:1 TTL smart servo (Koch v1.1 leader arm servo)"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XL330-M077-T"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl330-m077/"

# Used 6x on the Koch v1.1 LEADER arm (5 V supply, S3, S5); the follower uses the XL330-M288-T and XL430-W250-T instead. Included because the XL330 pair shares one motor and register map.
# Same file pattern as parts/arm/feetech-sts3215-c001.toml. Evidence chain: docs/research/dynamixel.md. Library entry (datasheet only): parts/actuators/robotis-dynamixel-xl330-m077.toml.
# Stall torque is NOT consistent with the no-load speed: same motor as the M288 (motor-side no-load speed 3108 vs 3111 rad/s at 5 V) but the 77.5:1 stall torque implies an efficiency above 1 (gear_efficiency_raw below).

[params]
mass            = { value = 0.018,   unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.020,   unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.026,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 77.5,    unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "engineering plastic gears and case; cored motor", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute encoder, ams AS5601
position_range  = { value = 6.28319, unit = "rad", src = "S1", fidelity = "datasheet" }        # Position Control Mode 0~360 deg (modes 4 and 5: +-256 rev)
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
protocol        = { value = "DYNAMIXEL Protocol 2.0, TTL half-duplex asynchronous serial 8N1, 3.3 V logic (5 V compatible), IDs 0-252, broadcast 254", unit = "-", src = "S1", fidelity = "datasheet" }
model_number    = { value = 1190,    unit = "1",   src = "S2", fidelity = "datasheet" }        # control table address 0
operating_modes_supported = { value = "0 current, 1 velocity, 3 position, 4 extended position, 5 current-based position, 16 PWM", unit = "-", src = "S2", fidelity = "datasheet" }
connector       = { value = "JST EHR-03 housing, JST B3B-EH-A PCB header, pins 1 GND / 2 VDD / 3 DATA", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 70, unit = "degC", src = "S1", fidelity = "datasheet" }
idle_current    = { value = 0.017,   unit = "A",   src = "S1", fidelity = "datasheet" }        # "Standby Current"
firmware_hz     = { value = 1000,    unit = "Hz",  fidelity = "estimated", rationale = "Not published (see robotis-xl330-m288-t firmware_hz: same MCU and firmware family, 64 MHz Cortex-M0+ per S1; Realtime Tick unit 1 ms per S2). Estimate 1 kHz; unverified." }

# --- electrical / performance at the three published voltages (datasheet; rev/min converted to rad/s with 2*pi/60) ---
v_nominal           = { value = 5.0,    unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended: 5.0 [V]"
v_operating_min     = { value = 3.7,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 6.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_3v7    = { value = 0.180,  unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_3v7   = { value = 1.11,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_3v7   = { value = 29.1121, unit = "rad/s", src = "S1", fidelity = "datasheet" } # 278 rev/min
stall_torque_5v     = { value = 0.215,  unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_5v    = { value = 1.47,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_5v    = { value = 40.1077, unit = "rad/s", src = "S1", fidelity = "datasheet" } # 383 rev/min
stall_torque_6v     = { value = 0.228,  unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_6v    = { value = 1.74,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 47.7522, unit = "rad/s", src = "S1", fidelity = "datasheet" } # 456 rev/min
kt_output_datasheet = { value = 0.146,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # stall torque / stall current at the output shaft, 5 V point

# --- DC-motor equivalent model (motor-side), derived. No published no-load current: I0 is estimated and Ke refitted with it ---
r_effective = { value = 3.42, unit = "ohm", fidelity = "derived", derivation = "Stall points: V/I_stall = 3.7/1.11 = 3.333, 5.0/1.47 = 3.401, 6.0/1.74 = 3.448 ohm (identical currents to the XL330-M288: same motor and drive); mean of the 5 V and 6 V points = 3.42 ohm. Includes H-bridge and lead resistance. The XL330 measures current at its input supply (S2 NOTE), equal to the motor current only at 100 % duty." }
no_load_current_5v = { value = 0.088, unit = "A", fidelity = "estimated", rationale = "Not published. 0.06 x I_stall(5 V) = 0.088 A, the STS3215 I0/I_stall ratio (feetech-sts3215-c001); same motor as the XL330-M288 for which Rhoban BAM's identified friction implies ~0.13-0.15 A (see robotis-xl330-m288-t no_load_current_5v), so this is the low end. The 77.5:1 train adds less gear friction than the 288.4:1 train. Unverified." }
omega_noload_motor_5v = { value = 3108.3, unit = "rad/s", fidelity = "derived", derivation = "Motor-side no-load speed at 5 V = N * omega_out = 77.5 * 40.1077 rad/s (383 rev/min) = 3108.3 rad/s = 29682 rpm; the w0 of the loss law. Differs from the M288's 3110.7 rad/s by 0.08 %: the same motor." }
ke = { value = 0.001518, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R_eff)/(N*omega_out) with I0 = 0.06*I_stall(V), so I0*R_eff = 0.06 V: 5 V 4.70/(77.5*40.1077) = 1.5121e-3; 6 V 5.64/(77.5*47.7522) = 1.5240e-3; mean 1.518e-3 V*s/rad, within 0.2 % of the XL330-M288's 1.515e-3 (same motor, consistency check)." }
kt_motor = { value = 0.001518, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke; motor-side torque constant." }
kv_equivalent = { value = 6290.6, unit = "rpm/V", fidelity = "derived", derivation = "Kv = 60/(2*pi*ke) = 9.5493/1.518e-3 = 6290.6 rpm/V, motor side." }
gear_efficiency_raw = { value = 1.254, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)): 5 V 0.215/(77.5*1.5121e-3*(1.47-0.0882)) = 1.327; 6 V 0.228/(77.5*1.5240e-3*(1.74-0.1044)) = 1.181; mean 1.254. Above 1 is impossible (parts/actuators/robotis-dynamixel-xl330-m077 finds 1.108 with I0 neglected): the published 77.5:1 stall torque cannot be produced by this motor at the published stall current. DO NOT use as a physical efficiency." }
gear_efficiency = { value = 1.0, unit = "1", fidelity = "estimated", rationale = "The schema requires efficiency in (0, 1]; the datasheet stall torque would need 1.254 (gear_efficiency_raw). 1.0 is the largest legal value, chosen to stay as close to the published stall torque as the model allows (model stall torque at 5 V 0.1616 N*m vs 0.215 published, -25 %); the M288 sibling on the same motor derives 0.851. The leader arm is hand-driven so the low back-drive friction implied by a high efficiency is also the right direction. Unverified." }
i0_visc = { value = 0.69, unit = "1", fidelity = "estimated", rationale = "Borrowed viscous share of the no-load loss from Rhoban BAM's identified XL330-M288 model (0.69, see robotis-xl330-m288-t i0_visc); same motor. Unverified for this gear ratio." }
rotor_inertia_motor = { value = 1.89e-8, unit = "kg*m^2", fidelity = "estimated", rationale = "Same motor as the XL330-M288 (equal motor-side no-load speed and stall current): 1.89e-8 kg*m^2 from Rhoban BAM's identified armature of the M288 (0.0015732 kg*m^2 at the output / 288.4^2), an apparent inertia incl. its gear train, so an upper bound for the rotor alone. The ROBOTIS 'Moment of Inertia' download could not be fetched." }
stall_torque_5v_model = { value = 0.1616, unit = "N*m", fidelity = "derived", derivation = "Model check with gear_efficiency 1.0: 1.0*77.5*1.518e-3*(5/3.42 - 0.088) = 0.162 N*m vs datasheet 0.215 (-25 %); see gear_efficiency." }

# --- servo-loop scaling for the napl servo device (docs/research/dynamixel.md section 10) ---
pwm_full_scale = { value = 885, unit = "counts", src = "S2", fidelity = "datasheet" }  # PWM Limit(36) range "0(0 [%]) ~ 885(100 [%] )"; 1 count = 0.113 %
pid_scale = { value = 113280, unit = "1", fidelity = "derived", derivation = "duty = PWM/885 with PWM = KPP*e = (P/128)*e (S2: 'KPP = KPP(TBL) / 128'; counts and PWM units are inferences, see robotis-xl330-m288-t pid_scale) -> pid_scale = 128*885 = 113,280; Rhoban BAM measured a divisor of 256 on the XL330-M288 (pid_scale 226,560), unresolved." }
d_scale = { value = 14160, unit = "1", fidelity = "derived", derivation = "KPD = D/16 (S2): duty_D = D*de/(16*885) -> d_scale = 14,160 (assumes the sim firmware step equals the real control period)." }
i_per_reg_i = { value = 0.001953125, unit = "1", fidelity = "derived", derivation = "Device i = I_reg*pid_scale/(65536*885) = I_reg/512 (KPI = I/65536 per sample, S2); convert in the port/assembly, the schema has no i_scale." }
dead_zone_default = { value = 0, unit = "count", fidelity = "estimated", rationale = "The control table has no dead-band register (S2 table checked); 0 counts assumed." }

# --- registers (e-Manual control table, S2). Physical units where the sim device expects them; raw register value in the comment ---
