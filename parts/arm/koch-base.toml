url = "https://github.com/s1lent4gnt/koch-v1-1/blob/cc1a4eb9b27978b6bc3bb34f12fa5a7d229f1fde/simulation/follower.urdf"
title = "s1lent4gnt/koch-v1-1 simulation/follower.urdf (commit cc1a4eb, a fork of jess-moss/koch-v1-1), link base_link and joint_1"
