id = "robotis-u2d2"
name = "ROBOTIS U2D2 USB to DYNAMIXEL (TTL / RS-485 / UART) communication converter"
category = "pcb.servo_driver"
vendor = "ROBOTIS"
part_number = "U2D2"
url = "https://emanual.robotis.com/docs/en/parts/interface/u2d2/"

# NOT in the Koch v1.1 BOM: the Koch arms use the Waveshare Bus Servo Adapter (waveshare-bus-servo-adapter-a) as controller board (Koch README and wiring diagram, docs/research/dynamixel.md section 8). Provided as the reference ROBOTIS host adapter.
# The U2D2 does not power the servos ("U2D2 does not supply power to DYNAMIXEL"); the optional U2D2 Power Hub (3.5-24 V, 10 A, S3) supplies them and is not modelled as a part (not used by Koch).

[params]
mass            = { value = 0.009, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.048, unit = "m",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.018, unit = "m",  src = "S1", fidelity = "datasheet" }
height          = { value = 0.0149, unit = "m", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 6000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
host_interface  = { value = "USB Type-C (Micro-B before August 2025), FTDI virtual COM port; set the USB latency timer to 1 ms for reliable high-speed operation", unit = "-", src = "S1", fidelity = "datasheet" }
ports_summary   = { value = "3-pin TTL (JST EHR-03), 4-pin RS-485 (JST EHR-04), 4-pin UART", unit = "-", src = "S1", fidelity = "datasheet" }
max_servos      = { value = 253, unit = "1", src = "S4", fidelity = "datasheet" }   # IDs 0-252 (XL330/XL430 e-Manual); the broadcast ID 254 is not a device
supplies_servo_power = { value = 0, unit = "1", src = "S1", fidelity = "datasheet" } # 0 = no: "U2D2 does not supply power to DYNAMIXEL"

# Electrical / signal only; the board is not part of any mechanical assembly in the Koch build.
[[ports]]
name = "ttl"
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
note = "3-pin TTL connector, JST EHR-03 pinout 1 GND / 2 VDD / 3 DATA (S1). The VDD pin is not fed by the U2D2 (external supply). Level not stated on the page (XL330 3.3 V / XL430 5 V per their e-Manuals)."

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "female"
note = "USB Type-C (S1); host side not modelled."

