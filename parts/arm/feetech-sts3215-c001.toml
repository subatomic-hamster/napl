id = "feetech-sts3215-c001"
name = "Feetech STS3215 7.4V 1/345 serial bus servo (C001), SO-101 follower joint servo"
category = "motor.servo"
vendor = "Feetech (Shenzhen Feite Model Co., Ltd.)"
part_number = "STS3215-C001"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/README.md#sourcing-parts"

# Used 6x on the SO-101 follower (all six joints). The 12V variants (C018/C047) are an optional upgrade, not the BOM default.
# Datasheet numbers below are for the 7.4V 1/345 STS3215 (Feetech spec "7.4V 19KG.CM plastic shell metal tooth magnetic coding dual-axis TTL serial servo").

