# --- electrical / performance, 7.4 V point (datasheet; kg.cm converted with g = 9.80665) ---
v_nominal       = { value = 7.4,     unit = "V",   src = "S1", fidelity = "datasheet" }
v_operating_min = { value = 4.0,     unit = "V",   src = "S1", fidelity = "datasheet" }
v_operating_max = { value = 7.4,     unit = "V",   src = "S1", fidelity = "datasheet" }
