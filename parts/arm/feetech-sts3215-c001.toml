# --- DC-motor equivalent model (motor-side), derived ---
r_effective = { value = 2.98, unit = "ohm", fidelity = "derived", derivation ="Stall points give V/I_stall = 6 V/2.0 A = 3.00 ohm and 7.4 V/2.5 A = 2.96 ohm; mean = 2.98 ohm. This is the datasheet terminal resistance (2.5 ohm) plus ~0.48 ohm of H-bridge, connector and lead resistance seen at stall." }
r_driver_extra = { value = 0.48, unit = "ohm", fidelity = "derived", derivation ="r_effective - r_terminal = 2.98 - 2.5 ohm (series H-bridge + wiring inside the servo)." }
omega_noload_motor_7v4 = { value = 1881.68, unit = "rad/s", fidelity = "derived", derivation ="Motor-side speed = N * omega_out = 345 * 5.4542 rad/s (0.192 s per 60 deg) = 1881.7 rad/s = 17969 RPM." }
ke = { value = 0.003695, unit = "V*s/rad", fidelity = "derived", derivation ="Back-EMF constant from the no-load point: Ke = (V - I0*R_eff)/(N*omega_out) = (7.4 - 0.15*2.98)/(345*5.4542) = 3.695e-3 V*s/rad. The 6 V point gives (6 - 0.13*2.98)/(345*4.400) = 3.697e-3, i.e. the two voltages agree to 0.06%." }
kt_motor = { value = 0.003695, unit = "N*m/A", fidelity = "derived", derivation ="SI identity Kt = Ke (V*s/rad = N*m/A) for an ideal DC motor; motor-side torque constant." }
kv_equivalent = { value = 2584.38, unit = "rpm/V", fidelity = "derived", derivation ="Kv = 60/(2*pi*ke) = 60/(2*pi*0.003695 V*s/rad) = 2584.38 rpm/V, motor side (before the 345:1 gear); tracks the ke estimate above (tools/so101_ports.py prints the same number)." }
gear_efficiency = { value = 0.658, unit = "1", fidelity = "derived", derivation ="eta = tau_stall_out / (N * Kt * (I_stall - I0)). 7.4 V: 1.9123/(345*0.003695*(2.5-0.15)) = 0.638; 6 V: 1.6181/(345*0.003695*(2.0-0.13)) = 0.678; mean = 0.658 (stall efficiency of the 345:1 train). Cross-check: datasheet Kt 8 kg.cm/A = 0.7845 N*m/A at the output implies eta = 0.7845/(345*0.003695) = 0.615." }
friction_torque_motor_noload = { value = 0.000554, unit = "N*m", fidelity = "derived", derivation ="Total no-load loss reflected to the motor shaft = Kt * I0 = 0.003695 * 0.15 A = 5.54e-4 N*m (rotor + gear friction at 17969 RPM motor speed)." }
i0_visc = { value = 0.6916, unit = "1", fidelity = "derived", derivation ="Viscous share of the no-load loss torque (schema MotorParams i0_visc, docs/models.md loss law tau_f = Kt i0 [(1 - v - q) tanh(w/w_s) + v w/w0 + q w|w|/w0^2], w0 = omega_noload_motor_7v4 = 1881.7 rad/s, the motor speed at which the 7.4 V i0 = 0.15 A was measured), from the TWO datasheet no-load currents. At no load the motor torque equals the loss, so i(V) = i0 [(1 - v - q) + v x + q x^2] with x = w(V)/w0 and w(V) = (V - R i)/Ke (R = r_effective 2.98 ohm, Ke = 3.695e-3). The 7.4 V point is x = 1 (it only defines i0), the 6 V point (0.13 A) gives ONE equation: x(6 V) = 0.8072 self-consistently, 0.13/0.15 = 1 - v (1 - 0.8072) - q (1 - 0.8072^2) -> 0.1928 v + 0.3484 q = 0.1333. Two points identify one number, not the split: v alone = 0.6916 (q = 0), q alone = 0.3827 (v = 0), any mix in between fits both points equally (5 V prediction 0.1157 A vs 0.1182 A, 2 % apart: not distinguishable by the datasheet). v-only is chosen (q = 0): a grease-lubricated gear train + coreless motor is Coulomb + viscous (BAM's identified STS3215 friction law has exactly friction_base + friction_viscous terms, no w|w| term), and the cross-check below discriminates the two ends (q-only would leave a Coulomb share of 0.617, an output-side 0.118 N*m, 2.3x BAM's 0.0515). Residual Coulomb share 1 - v = 0.3084. Consequence: standstill friction drops to 31 % of the old constant-i0 model, so holding torque costs more duty (SO-101 zero-pose shoulder_lift sag 4.4 -> 6.5 deg at LeRobot gains). Cross-check, NOT an input (BAM bam/params/feetech_sts3215_7_4V/m1.json, https://github.com/Rhoban/bam, 2026-10-07): output-side Coulomb friction here = n Kt i0 (1 - v) = 345 * 3.695e-3 * 0.15 * 0.3084 = 0.059 N*m vs BAM friction_base 0.0515 (+15 %); viscous output coefficient n^2 Kt i0 v / w0 = 0.0242 N*m*s/rad vs BAM friction_viscous 0.0599 (BAM fits kt, R and friction jointly, see docs/research/sts3215-calibration.md 1.2, so this is only an order-of-magnitude agreement). The 5 V arm no-load current under this law is 0.1157 A (the part's older linear scaling said 0.101 A)." }
d_scale = { value = 8000, unit = "1", fidelity = "derived", derivation ="Register units -> duty for the D term: official Feetech memory table (S10) addr 22 'Position loop D (derivative) coefficient ... Derivative coefficient controlling the motor (1/8)' against addr 21 P '(1/4)', output unit 0.1 % duty (addr 16 max torque 0..1000 = 0.1 %, addr 60 present load 0.1 % duty): output = (D/8) de_counts in 0.1 % units -> duty = D de / (8 * 1000) -> d_scale = 8 * 1000 = 8000 (pid_scale = 4 * 1000 = 4000 for P, docs/research/sts3215-calibration.md 1.4). Inference, not measured: the time base of de (per firmware step in the sim) is unpublished, so the D term's absolute size is as uncertain as that; only the 2:1 ratio to the P scale is documented. Before this param the sim used pid_scale (4000) for D too, i.e. a D twice the table's." }
stall_torque_5v = { value = 1.323, unit = "N*m", fidelity = "derived", derivation ="Model prediction at the 5 V supply the SO-101 BOM actually uses: I_stall = 5/2.98 = 1.678 A; I0 scaled with V = 0.15*5/7.4 = 0.101 A; tau = eta*N*Kt*(I_stall - I0) = 0.658*345*0.003695*(1.678-0.101) = 1.32 N*m (13.5 kg.cm). The same model reproduces the datasheet 6 V stall torque to -1.9% and the 7.4 V value to +2.4%; no published 5 V torque exists (README only says 'likely slightly less')." }
no_load_speed_5v = { value = 3.685, unit = "rad/s", fidelity = "derived", derivation ="omega_out = (V - I0*R_eff)/(N*Ke) = (5 - 0.101*2.98)/(345*0.003695) = 3.685 rad/s = 35.2 RPM (0.284 s/60deg). No published 5 V figure." }
rotor_inertia_motor = { value = 2.35e-7, unit = "kg*m^2", fidelity = "estimated", rationale ="Not published. SO-ARM100 MJCF joints_properties.xml uses armature=0.028 kg*m^2 (reflected, joint side; adapted from Open Duck Mini, gear variant not stated); divided by N^2 = 345^2 gives 2.35e-7 kg*m^2 at the motor. Order of magnitude plausible for a 24 mm-class coreless motor but unverified. Independent support: Rhoban BAM's identified STS3215 armature (bam/params/feetech_sts3215_7_4V/m1.json, \"armature\": 0.02608291141307205 kg*m^2, reflected; https://github.com/Rhoban/bam, accessed 2026-10-07, docs/research/sts3215-calibration.md 1.2) is 7 % below the 0.028 used. Value unchanged." }
joint_damping_mjcf = { value = 0.60, unit = "N*m*s/rad", src = "S7", fidelity = "literature" }
joint_frictionloss_mjcf = { value = 0.052, unit = "N*m", src = "S7", fidelity = "literature" }
joint_armature_mjcf = { value = 0.028, unit = "kg*m^2", src = "S7", fidelity = "literature" }

