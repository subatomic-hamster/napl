gear_ratio      = { value = 345,     unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "copper (metal gear train)", unit = "-", src = "S8", fidelity = "datasheet" }
backlash        = { value = 0.0087266, unit = "rad", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }
position_range  = { value = 6.28319, unit = "rad", src = "S1", fidelity = "datasheet" }
baud_default    = { value = 1000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
