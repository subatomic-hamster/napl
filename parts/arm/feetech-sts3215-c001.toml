no_load_current_7v4 = { value = 0.15,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_7v4    = { value = 1.9123, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 19.5 kg.cm
stall_current_7v4   = { value = 2.5,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_7v4    = { value = 0.4903, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 5 kg.cm
rated_current_7v4   = { value = 0.65,   unit = "A",     src = "S1", fidelity = "datasheet" }
# 6 V point
no_load_speed_6v    = { value = 4.4000, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.238 s/60deg (42 RPM)
no_load_current_6v  = { value = 0.13,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_6v     = { value = 1.6181, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 16.5 kg.cm
stall_current_6v    = { value = 2.0,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_6v     = { value = 0.3923, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 4 kg.cm
