[[sources]]
id = "V1"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/README.md"
title = "SO-ARM100 / SO-101 README (build photos of the STS3215 servos in the arm)"
accessed = "2026-10-08"
quote = "[image] SO-101 arm assembled from STS3215 servos: black rectangular case with a round silver horn"

[geometry]
shape = "mesh"
mesh = "meshes/so101/sts3215_03a_v1.stl"
mesh_no_horn = "meshes/so101/sts3215_03a_no_horn_v1.stl"
# mesh units: metres. bbox x[-0.0227,0.0227] y[-0.0124,0.0124] z[-0.0194,0.0202]; solid mesh volume 3.622e-5 m^3 (no_horn 3.566e-5)
# Mesh frame: output shaft line at x = 0.0125, y = 0 (parallel to z). The 20 mm horn disc (vertices only in the horn mesh) is on the -z side, outer face z = -0.0177;
# the other end of the (dual-axis) shaft is a short spline stub at z = +0.0202. The 6 servos of the arm all use this one mesh frame; the wrist_roll servo is drawn with mesh_no_horn.

# Ports. output/base derived or chosen by tools/so101_ports.py (closure check: python tools/so101_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame.
# output: same frame for all 6 joints of the arm (spread: origin 1.1e-7 m, axis 6.7e-6 rad, both URDF rounding); the child horn seats absorb the per-joint rotation about z. Mate k = 0, no reverse needed.
[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.25t"
gender = "male"
pos = [0.012500022257, 6.4538e-08, -0.0177]
axis = [6.11468e-07, 6.41993e-07, -1.0]
ref = [1.0, 0.0, 6.11468e-07]
symmetry = 25
thickness = 0.0021
thread = "m3"
tapped = true
thread_note = "Fastener tags added by the SO-101 assembly stage (not read from the mesh): the horn is fixed by the single M3x6 'top horn' screw of the LeRobot assembly (S1 of so101-screw-m3x6), modelled as threading into the output shaft (tapped, depth = the builder's 1.5 d rule), which is an assumption."
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): P_out = frame at the mean over the 6 joints of inv(T_servo_i) @ J_i (servo mesh frame), moved along the axis to the outer face of the horn disc (z = -0.0177 in the servo mesh; horn disc = vertices only in sts3215_03a_v1.stl and not in sts3215_03a_no_horn_v1.stl); axis = outward horn normal = joint z axis here (the horn lies on the -z side of the servo mesh)"
thickness_rationale = "Horn disc thickness read from the servo mesh (horn-only vertices span 2.1 mm in z). No published value; estimated as the clamped stack."

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.feetech-sts3215-base"
gender = "neutral"
pos = [0.0, 0.0, 0.0159]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.0015
thread = "m2"
tapped = true
thread_note = "Tags added by the SO-101 assembly stage: the datasheet lists '8-PA2.0 self-tapping' mounting screws (S1 as summarised in docs/research/so101.md), so the servo case is the tapped side of the M2 mounting joint (screw length vs the printed seat thickness is then checked by the builder)."
fidelity = "estimated"
rationale = "Frame convention, not a measured hole pattern: centre of the outer case plane opposite the horn (z = +0.0159 in the servo mesh; the horn disc is on the -z side), axis out of that face (+z), ref along the long (x) side. The matching seats on the printed parts are derived so that this port reproduces the URDF placement."
thickness_rationale = "No published ear/lid thickness. The servo mesh shows a 1.5 mm slab between z = 0.0144 and 0.0159 spanning the case outline; estimated."

