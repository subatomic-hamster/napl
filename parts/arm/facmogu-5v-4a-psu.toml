id = "facmogu-5v-4a-psu"
name = "Facmogu 5V 4A AC-DC power supply adapter (SO-101 BOM power supply)"
category = "psu"
vendor = "Facmogu"
part_number = "B087LY41PV (Amazon ASIN)"
url = "https://www.amazon.com/Facmogu-Switching-Transformer-Compatible-5-5x2-1mm/dp/B087LY41PV/"

# SO-ARM100 README BOM row "Power Supply" (US) links this product; the same BOM says a 12V 5A+ supply is needed instead if the 12V servos are used.
# Seeed Studio's SO-ARM101 kit page lists the standard-kit supply as "5.5 mm × 2.1 mm DC 5 V 4 A".

[params]
v_out_nominal = { value = 5.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_out_rated   = { value = 4.0, unit = "A", src = "S1", fidelity = "datasheet" }
v_in_min      = { value = 100.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_in_max      = { value = 240.0, unit = "V", src = "S1", fidelity = "datasheet" }
connector     = { value = "DC barrel 5.5x2.1 mm (also supplied with a 5.5x2.5 mm tip)", unit = "-", src = "S1", fidelity = "datasheet" }
mass          = { value = 0.12, unit = "kg", fidelity = "estimated", rationale ="Product page text retrieved lists no weight. Typical 20 W wall-mount switching adapters are of the order of 100-150 g; 0.12 kg taken. Does not enter the arm's moving mass." }
r_out         = { value = 0.03, unit = "ohm", fidelity = "estimated", rationale ="No published output impedance or load regulation. A 1-3 % regulation at 4 A on 5 V (0.05-0.15 V) corresponds to 0.012-0.04 ohm; 0.03 ohm taken. Excludes the output cable." }
current_limit = { value = 4.5, unit = "A", fidelity = "estimated", rationale ="No published over-current threshold. Small adapters typically trip/hiccup at 110-150 % of rating; 4.5 A (112 %) is a conservative placeholder for a simulator limit." }

