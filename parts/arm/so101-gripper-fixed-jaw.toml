id = "so101-gripper-fixed-jaw"
name = "SO-101 follower gripper body / fixed jaw (wrist roll follower, 3D printed, gripper_link)"
category = "frame.printed"
vendor = "TheRobotStudio (open design, Apache-2.0)"
part_number = "Wrist_Roll_Follower_SO101.stl (sim mesh wrist_roll_follower_so101_v1.stl)"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/STL/SO101/Individual/Wrist_Roll_Follower_SO101.stl"

[params]
volume_solid = { value = 5.664e-5, unit = "m^3", fidelity = "derived", derivation ="Signed-volume integral over the 28796 triangles of meshes/so101/wrist_roll_follower_so101_v1.stl (binary STL, metres) = 56.64 cm^3. Solid." }
infill_fraction = { value = 0.15, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale ="Repo README gives only material, nozzle/layer height and 15% infill, no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
wrist_roll_range = { value = [-2.74385, 2.84121], unit = "rad", src = "S3", fidelity = "datasheet" }

[geometry]
shape = "mesh"
mesh = "meshes/so101/wrist_roll_follower_so101_v1.stl"
material = "pla"
urdf_link = "gripper_link"
origin_xyz = [0.0, -0.000218214, 0.000949706]
origin_rpy = [-3.14159, 0.0, 0.0]
bbox_min = [-0.0352, -0.0242, -0.0001]
bbox_max = [0.03, 0.0278, 0.1054]

# Ports derived by tools/so101_ports.py (closure check: python tools/so101_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame.
# horn_seat: mate with feetech-sts3215-c001 `output` (k = 0, no reverse needed) to reproduce the URDF; q = 0 is the URDF zero of joint wrist_roll, limits in wrist_roll_range.
# The driving servo (wrist_roll) is the no-horn mesh instance in the wrist link; the URDF zero includes a 0.0486795 rad (2.79 deg) yaw offset that is absorbed in this seat.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.25t"
gender = "female"
pos = [1.402e-08, -0.000218420174, -0.03545029342]
axis = [1.629883e-06, 5.635181e-06, 0.999999999983]
ref = [0.048663945214, 0.998815208336, -5.707821e-06]
symmetry = 25
thickness = 0.003
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): F = inv(T_part) @ inv(J_wrist_roll) @ T_servo_wrist_roll @ P_out @ Rx(pi); mating servo.output (k=0) reproduces the URDF; absorbs the 87.210660 deg rotation about z of joint wrist_roll relative to the canonical output frame"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin). Estimated."
joint = "wrist_roll"
joint_reverse = false

[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.feetech-sts3215-base"
gender = "neutral"
pos = [0.0077, -0.016218149386, 0.02434980744]
axis = [0.0, 0.99999999998, -6.326795e-06]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thread = "m2"
hole_pos = [[0.0196, 0.00935], [-0.0196, 0.00935], [-0.0196, -0.00935], [0.0196, -0.00935]]
hole_pos_rationale = "Estimated placeholder (not a measured pattern): 4 holes at the corners of the 45.2 x 24.7 mm servo case footprint (datasheet size) inset 3 mm; screws are the 'PA2.0 self-tapping' M2 of the servo kit. Only places the 0.28 g screw masses of the builder's fastener model (CoM shift well under 1 mm); no kinematic role."
thickness = 0.003
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): F = inv(T_part) @ T_servo_gripper @ P_base @ Rx(pi); the servo holding part is chosen by mesh contact (tools/so101_ports.py --evidence)"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin). Estimated."
servo_joint = "gripper"

