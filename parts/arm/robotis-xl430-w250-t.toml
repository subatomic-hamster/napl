id = "robotis-xl430-w250-t"
name = "ROBOTIS DYNAMIXEL XL430-W250-T 258.5:1 TTL smart servo (Koch v1.1 follower shoulder pan / shoulder lift)"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XL430-W250-T"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl430-w250/"

# Used 2x on the Koch v1.1 follower (shoulder_pan id 1, shoulder_lift id 2 in LeRobot), fed 12 V straight from the 12 V supply through the Waveshare board (S3, S5).
# 12.0 V is the TOP of the published 6.5-12.0 V range (recommended 11.1 V): a 12 V nominal adapter that sits above 12.0 V unloaded is out of spec (v_max port rating).
# Same file pattern as parts/arm/feetech-sts3215-c001.toml. Evidence chain: docs/research/dynamixel.md. Library entry (datasheet only): parts/actuators/robotis-dynamixel-xl430-w250.toml.
# The e-Manual page covers both the 2018 'New' and the discontinued 'Old' XL430-W250; the numbers below are the page's single spec table.

[params]
mass            = { value = 0.0572,  unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.0285,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.0465,  unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 258.5,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "engineering plastic gears and case; cored motor", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute encoder, ams AS5601
position_range  = { value = 6.28319, unit = "rad", src = "S1", fidelity = "datasheet" }        # Position Control Mode 0~360 deg (mode 4: +-256 rev)
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4500000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
protocol        = { value = "DYNAMIXEL Protocol 2.0 (Protocol 1.0 selectable), TTL half-duplex asynchronous serial 8N1, 5 V logic, IDs 0-252, broadcast 254", unit = "-", src = "S1", fidelity = "datasheet" }
model_number    = { value = 1060,    unit = "1",   src = "S2", fidelity = "datasheet" }        # control table address 0
operating_modes_supported = { value = "1 velocity, 3 position, 4 extended position, 16 PWM (no current / current-based modes)", unit = "-", src = "S2", fidelity = "datasheet" }
connector       = { value = "JST EHR-03 housing, JST B3B-EH-A PCB header, pins 1 GND / 2 VDD / 3 DATA", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 72, unit = "degC", src = "S1", fidelity = "datasheet" }
idle_current    = { value = 0.052,   unit = "A",   src = "S1", fidelity = "datasheet" }        # "Standby Current"
firmware_hz     = { value = 1000,    unit = "Hz",  fidelity = "estimated", rationale = "The control loop rate is not published (the e-Manual has no sample time / kHz figure). Estimate 1 kHz: Realtime Tick has a 1 ms unit (S2), the MCU is a 72 MHz Cortex-M3 (S1), and an older copy of the manual states that the PID constants include the sampling time (S8). Unverified; the sim needs 1/(firmware_hz*dt) to be an integer." }

# --- electrical / performance at the three published voltages (datasheet; rev/min converted to rad/s with 2*pi/60) ---
v_nominal           = { value = 11.1,   unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 11.1 [V]"; the Koch follower supplies 12 V
v_operating_min     = { value = 6.5,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 12.0,   unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_9v     = { value = 1.0,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_9v    = { value = 1.0,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_9v    = { value = 4.9218, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 47 rev/min
stall_torque_11v1   = { value = 1.4,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_11v1  = { value = 1.3,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_11v1  = { value = 5.9690, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 57 rev/min
stall_torque_12v    = { value = 1.5,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_12v   = { value = 1.4,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_12v   = { value = 6.3879, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 61 rev/min
kt_output_datasheet = { value = 1.077,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }  # stated at the recommended 11.1 V point (1.000 at 9 V, 1.071 at 12 V)

# --- DC-motor equivalent model (motor-side), derived. No published no-load current: I0 is estimated and Ke refitted with it ---
r_effective = { value = 8.55, unit = "ohm", fidelity = "derived", derivation = "Stall points: V/I_stall = 11.1/1.3 = 8.538, 12.0/1.4 = 8.571 ohm; mean 8.55 ohm. The 9 V point (9.0/1.0 = 9.0 ohm) is excluded: its current is quoted to one digit (+-5 %). Includes H-bridge and lead resistance (library convention of parts/actuators/robotis-dynamixel-xl430-w250)." }
no_load_current_12v = { value = 0.084, unit = "A", fidelity = "estimated", rationale = "Not published (only the 52 mA standby current, which is the electronics at rest). 0.06 x I_stall(12 V) = 0.06 x 1.4 A = 0.084 A, the STS3215 I0/I_stall ratio (0.15/2.5 at 7.4 V, feetech-sts3215-c001). Rhoban BAM's identified friction for the smaller XL330-M288 implies a ratio up to ~0.10 (robotis-xl330-m288-t), so this may be low. The published no-load speeds per volt (5.22, 5.14, 5.08 rev/min per V at 9, 11.1, 12 V) fall with voltage, the opposite of an I0*R offset, so I0 cannot be identified from them (they are rounded to integer rev/min). Unverified." }
omega_noload_motor_12v = { value = 1651.3, unit = "rad/s", fidelity = "derived", derivation = "Motor-side no-load speed at 12 V = N * omega_out = 258.5 * 6.3879 rad/s (61 rev/min) = 1651.3 rad/s = 15769 rpm; the w0 of the loss law for the 12 V no-load current (the Koch supply)." }
ke = { value = 0.0068, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R_eff)/(N*omega_out) with I0 = 0.06*I_stall(V), so I0*R_eff = 0.06 V: 11.1 V 10.434/(258.5*5.9690) = 6.762e-3; 12 V 11.28/(258.5*6.3879) = 6.831e-3; mean 6.797e-3 -> 6.8e-3 V*s/rad (the 9 V point gives 6.649e-3, 2 % lower, rounding of the one-digit current/speed). Neglecting I0 (parts/actuators/robotis-dynamixel-xl430-w250) gives 7.23e-3." }
kt_motor = { value = 0.0068, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke; motor-side torque constant." }
kv_equivalent = { value = 1405.0, unit = "rpm/V", fidelity = "derived", derivation = "Kv = 60/(2*pi*ke) = 9.5493/6.797e-3 = 1405.0 rpm/V, motor side (before the 258.5:1 gear)." }
gear_efficiency = { value = 0.650, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) with I0 = 0.06*I_stall: 11.1 V 1.4/(258.5*6.762e-3*(1.3-0.0779)) = 0.655; 12 V 1.5/(258.5*6.831e-3*(1.4-0.0842)) = 0.646; mean 0.650 (plastic 258.5:1 train at stall). Cross-check: eta*N*Ke = 0.650*258.5*6.797e-3 = 1.142 N*m/A vs datasheet output Kt 1.071-1.077 (+6 %)." }
i0_visc = { value = 0.69, unit = "1", fidelity = "estimated", rationale = "No no-load data. Borrowed viscous share from Rhoban BAM's identified XL330-M288 friction (0.69, robotis-xl330-m288-t) and equal to the STS3215's derived 0.6916; both small plastic-gear servos. Unverified for the XL430." }
rotor_inertia_motor = { value = 1.3e-7, unit = "kg*m^2", fidelity = "estimated", rationale = "Not published; the ROBOTIS 'Moment of Inertia' download (XL430/XC430) redirected to an unrelated host and could not be fetched. Scaled from the XL330-M288's 1.89e-8 kg*m^2 (Rhoban BAM identified armature 0.0015732 kg*m^2 / 288.4^2) by (57.2 g / 18 g)^(5/3) = 6.9 (geometric similarity: J ~ m r^2 ~ m^(5/3)) = 1.3e-7. Order-of-magnitude only (STS3215 estimate is 2.35e-7)." }
stall_torque_12v_model = { value = 1.507, unit = "N*m", fidelity = "derived", derivation = "Model check: eta*N*Ke*(V/R_eff - I0) = 0.650*258.5*6.797e-3*(12/8.55 - 0.084) = 1.507 N*m vs datasheet 1.5 (+0.5 %)." }

# --- servo-loop scaling for the napl servo device (docs/research/dynamixel.md section 10) ---
pwm_full_scale = { value = 885, unit = "counts", src = "S2", fidelity = "datasheet" }  # PWM Limit(36) range "0(0 [%]) ~ 885(100 [%] )"; 1 count = 0.113 %
pid_scale = { value = 113280, unit = "1", fidelity = "derived", derivation = "duty = PWM/885 with PWM = KPP*e = (P/128)*e (S2: 'KPP = KPP(TBL) / 128'; error in encoder counts and PWM output units are inferences, the e-Manual does not state them) -> duty = P*e/(128*885) -> pid_scale = 113,280. No independent measurement exists for the XL430 (Rhoban BAM measured an XL330 divisor of 256 vs the manual's 128, robotis-xl330-m288-t); plausible range 113,280-226,560." }
d_scale = { value = 14160, unit = "1", fidelity = "derived", derivation = "KPD = D/16 (S2): duty_D = D*de/(16*885) -> d_scale = 14,160 (assumes the sim firmware step equals the real control period, the older e-Manual says the constants include sampling time, S8)." }
i_per_reg_i = { value = 0.001953125, unit = "1", fidelity = "derived", derivation = "Device i = I_reg*pid_scale/(65536*885) = I_reg/512 (KPI = I/65536 per sample, S2); convert in the port/assembly, the schema has no i_scale. Register default I = 0 maps to 0." }
# Device-schema views of the registers below (units the servo device field table expects: p / i / d "count", max_torque "0.1 %"); values = the e-Manual defaults, bound by assemblies/koch.toml [device_maps.xl430_w250].
device_p_default = { value = 640, unit = "count", src = "S2", fidelity = "datasheet" }    # = reg_position_p_gain_default (addr 84)
device_i_default = { value = 0, unit = "count", src = "S2", fidelity = "datasheet" }      # = reg_position_i_gain_default (addr 82); device i = I_reg * i_per_reg_i, inert at 0
device_d_default = { value = 4000, unit = "count", src = "S2", fidelity = "datasheet" }   # = reg_position_d_gain_default (addr 80)
device_max_torque_default = { value = 1000, unit = "0.1 %", fidelity = "derived", derivation = "PWM Limit(36) default 885 = 100 % duty (S2): max_torque = 1000 x 885 / 885 = 1000 (docs/research/dynamixel.md section 10.1 item 6)." }
dead_zone_default = { value = 0, unit = "count", fidelity = "estimated", rationale = "The control table has no dead-band register (S2 table checked); 0 counts assumed." }

# --- registers (e-Manual control table, S2). Physical units where the sim device expects them; raw register value in the comment ---
reg_return_delay_time_default = { value = 250, unit = "2 us", src = "S2", fidelity = "datasheet" }  # addr 9; 250 = 500 us
reg_baud_rate_default         = { value = 1,   unit = "index", src = "S2", fidelity = "datasheet" } # addr 8; 1 = 57,600 bps (3 = 1 Mbps, 7 = 4.5 Mbps)
reg_id_default                = { value = 1,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 7
reg_secondary_id_default      = { value = 255, unit = "1", src = "S2", fidelity = "datasheet" }    # addr 12 (253-255 = off)
reg_drive_mode_default        = { value = 0,   unit = "bitmask", src = "S2", fidelity = "datasheet" } # addr 10
reg_operating_mode_default    = { value = 3,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 11 = Position Control Mode
reg_protocol_type_default     = { value = 2,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 13 (range 1 ~ 2)
reg_homing_offset_default     = { value = 0,   unit = "count", src = "S2", fidelity = "datasheet" } # addr 20; Present = Actual + Homing Offset
reg_moving_threshold_default  = { value = 10,  unit = "0.229 rev/min", src = "S2", fidelity = "datasheet" } # addr 24
reg_temperature_limit_default = { value = 72,  unit = "degC", src = "S2", fidelity = "datasheet" } # addr 31
reg_max_voltage_limit_default = { value = 14.0, unit = "V", src = "S2", fidelity = "datasheet" }   # addr 32, raw 140 * 0.1 V (above the 12.0 V spec maximum)
reg_min_voltage_limit_default = { value = 6.0, unit = "V", src = "S2", fidelity = "datasheet" }    # addr 34, raw 60 * 0.1 V (the description section says range 65 ~ 140, the table 60 ~ 140)
reg_pwm_limit_default         = { value = 885, unit = "0.113 %", src = "S2", fidelity = "datasheet" } # addr 36 (= 100 %, device max_torque 1000)
reg_velocity_limit_default    = { value = 265, unit = "0.229 rev/min", src = "S2", fidelity = "datasheet" } # addr 44 = 60.7 rev/min
reg_max_position_limit_default = { value = 4095, unit = "count", src = "S2", fidelity = "datasheet" } # addr 48
reg_min_position_limit_default = { value = 0,    unit = "count", src = "S2", fidelity = "datasheet" } # addr 52
reg_startup_configuration_default = { value = 0, unit = "bitmask", src = "S2", fidelity = "datasheet" } # addr 60
reg_shutdown_default          = { value = 52,  unit = "bitmask", src = "S2", fidelity = "datasheet" } # addr 63; 0x34 = overheating + electrical shock + overload (input voltage NOT enabled)
reg_torque_enable_default     = { value = 0,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 64
reg_led_default               = { value = 0,   unit = "1", src = "S2", fidelity = "datasheet" }    # addr 65
reg_status_return_level_default = { value = 2, unit = "1", src = "S2", fidelity = "datasheet" }    # addr 68
reg_velocity_i_gain_default   = { value = 1000, unit = "1", src = "S2", fidelity = "datasheet" }   # addr 76, KVI = value/65536
reg_velocity_p_gain_default   = { value = 100,  unit = "1", src = "S2", fidelity = "datasheet" }   # addr 78, KVP = value/128
reg_position_d_gain_default   = { value = 4000, unit = "1", src = "S2", fidelity = "datasheet" }   # addr 80, KPD = value/16
reg_position_i_gain_default   = { value = 0,    unit = "1", src = "S2", fidelity = "datasheet" }   # addr 82, KPI = value/65536
reg_position_p_gain_default   = { value = 640,  unit = "1", src = "S2", fidelity = "datasheet" }   # addr 84, KPP = value/128
reg_feedforward_2nd_gain_default = { value = 0, unit = "1", src = "S2", fidelity = "datasheet" }   # addr 88, value/4
reg_feedforward_1st_gain_default = { value = 0, unit = "1", src = "S2", fidelity = "datasheet" }   # addr 90, value/4
reg_bus_watchdog_default      = { value = 0,    unit = "20 ms", src = "S2", fidelity = "datasheet" } # addr 98 (0 = off)
reg_profile_acceleration_default = { value = 0, unit = "214.577 rev/min^2", src = "S2", fidelity = "datasheet" } # addr 108 (0 = infinite)
