[geometry]
shape = "mesh"
mesh = "meshes/koch/xl430_w250_t.stl"
bbox_min = [-0.01125, -0.01425, -0.0379]
bbox_max = [0.03525, 0.01425, -0.0]
# units metres; solid mesh volume 4.6658e-05 m^3. Servo frame (tools/koch_ports.py): origin on the horn axis at the outer face of the horn hub,
# z = outward horn normal, x = along the body's long axis towards the body centre, y = z x x. The body is cut out of the Koch v1.1
# *_motor.STL link meshes (Apache-2.0, meshes/koch/NOTICE) and replaced by its convex hull (192 triangles; the cut-out body is not
# manifold, MuJoCo rejects it with inertia=exact); hub/horn pieces of the XL330 and screws/idler frames are not included.

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dynamixel-xl430"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): servo frame S = [origin = joint origin (on the horn axis, at the outer face of the horn hub), z = outward horn normal = -(joint axis), x = in-plane direction from the horn axis to the body centre (the body's long axis)]; the body is the largest component of the link's *_motor.STL (plus the cover shell for XL330) expressed in S; this port is S itself"
thickness_rationale = "Horn hub height beyond the body face read from the mesh: 0.0 mm between the body's output face and the joint (horn outer face) plane for XL330; for XL430 the hub is part of the body mesh (height 37.9 mm vs the 34 mm datasheet height, 3.9 mm difference), estimated 3 mm clamped."

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-xl430-base"
gender = "neutral"
pos = [0.011999997386, 0.0, -0.037899999741]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "estimated"
rationale = "Frame convention, not a measured hole pattern (same approach as the SO-101 servo base port): centre of the body face opposite the output (z = -0.037900 in the servo frame, centre x 0.012000, y 0.000000), axis out of that face (-z), ref along the long (x) side. The Koch parts hold the servos in pockets by several faces; the printed seats are derived so that this port reproduces the URDF placement."
thickness_rationale = "No published wall / ear thickness; 3 mm placeholder. Estimated."

