id = "so101-rotation-pitch"
name = "SO-101 rotation/pitch shoulder bracket (3D printed, shoulder_link)"
category = "frame.printed"
vendor = "TheRobotStudio (open design, Apache-2.0)"
part_number = "Rotation_Pitch_SO101.stl (sim mesh rotation_pitch_so101_v1.stl)"
url = "https://github.com/TheRobotStudio/SO-ARM100/blob/a758567c3978dfeefe282ede0500085a48fe8f78/STL/SO101/Individual/Rotation_Pitch_SO101.stl"

[params]
volume_solid = { value = 6.88e-5, unit = "m^3", fidelity = "derived", derivation ="Signed-volume integral over the 17672 triangles of meshes/so101/rotation_pitch_so101_v1.stl (binary STL, metres) = 68.80 cm^3. Solid." }
infill_fraction = { value = 0.15, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale ="Repo README gives only material, nozzle/layer height and 15% infill, no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
shoulder_pan_range = { value = [-1.91986, 1.91986], unit = "rad", src = "S3", fidelity = "datasheet" }

[geometry]
shape = "mesh"
mesh = "meshes/so101/rotation_pitch_so101_v1.stl"
material = "pla"
urdf_link = "shoulder_link"
origin_xyz = [0.0122008, 2.22413e-05, 0.0464]
origin_rpy = [-1.5708, 0.0, 0.0]
bbox_min = [-0.0598, 0.0002, -0.023]
bbox_max = [0.0, 0.0844, 0.023]

# Ports derived by tools/so101_ports.py (closure check: python tools/so101_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame.
# horn_seat: mate with feetech-sts3215-c001 `output` (k = 0, no reverse needed) to reproduce the URDF; q = 0 is the URDF zero of joint shoulder_pan, limits in shoulder_pan_range.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.25t"
gender = "female"
pos = [-0.012200822257, 0.010000000082, -2.2236621e-05]
axis = [6.1147e-07, 0.999999999984, 5.684804e-06]
ref = [-0.999999999996, 6.11485e-07, -2.653586e-06]
symmetry = 25
thickness = 0.003
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): F = inv(T_part) @ inv(J_shoulder_pan) @ T_servo_shoulder_pan @ P_out @ Rx(pi); mating servo.output (k=0) reproduces the URDF; absorbs the 179.999848 deg rotation about z of joint shoulder_pan relative to the canonical output frame"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin). Estimated."
joint = "shoulder_pan"
joint_reverse = false

[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.feetech-sts3215-base"
gender = "neutral"
pos = [-0.042600058404, 0.088100056934, -0.01549967669]
axis = [3.673205e-06, -3.673192e-06, 0.999999999987]
ref = [-3.673205e-06, 0.999999999987, 3.673205e-06]
symmetry = 2
thread = "m2"
hole_pos = [[0.0196, 0.00935], [-0.0196, 0.00935], [-0.0196, -0.00935], [0.0196, -0.00935]]
hole_pos_rationale = "Estimated placeholder (not a measured pattern): 4 holes at the corners of the 45.2 x 24.7 mm servo case footprint (datasheet size) inset 3 mm; screws are the 'PA2.0 self-tapping' M2 of the servo kit. Only places the 0.28 g screw masses of the builder's fastener model (CoM shift well under 1 mm); no kinematic role."
thickness = 0.003
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): F = inv(T_part) @ T_servo_shoulder_lift @ P_base @ Rx(pi); the servo holding part is chosen by mesh contact (tools/so101_ports.py --evidence)"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin). Estimated."
servo_joint = "shoulder_lift"

[[ports]]
name = "holder_seat"
kind = "mech"
type = "bolt-pattern.so101-rotation-pitch-motor-holder"
gender = "neutral"
pos = [-0.042251423179, 0.070399878401, -9.183e-09]
axis = [0.0, 0.999999999993, 3.673205e-06]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.004
fidelity = "derived"
derivation = "tools/so101_ports.py from meshes/so101/so101_new_calib.urdf (SO-ARM100 a758567): mate frame M at the centre of the bbox overlap of the two parts (mid-plane of the gap where the bboxes only touch), axis along the thinnest overlap dimension from so101-rotation-pitch towards so101-motor-holder-shoulder; port = inv(T_part) @ M (a) or inv(T_part) @ M @ Rx(pi) (b)"
thickness_rationale = "No published or measurable value; 4 mm placeholder = two 2 mm printed walls clamped by M3 screws. Estimated."

