id = "koch-shoulder-rotation"
name = "Koch v1.1 follower shoulder rotation bracket (3D printed, link_1)"
category = "frame.printed"
vendor = "Jess Moss / Hugging Face (Koch v1.1, Apache-2.0); original design Alexander Koch"
part_number = "Follower_Shoulder_Rotation.STL (sim mesh link_1.STL)"
url = "https://github.com/jess-moss/koch-v1-1/blob/1a553e1fa7d5404b51bbd83b99b0f7eba54888e0/hardware/follower/STL/Follower_Shoulder_Rotation.STL"

[params]
volume_solid = { value = 6.8943e-6, unit = "m^3", fidelity = "derived", derivation = "Signed-volume (divergence theorem) integral over the 832 triangles of meshes/koch/link_1.STL (binary STL, metres) = 6.894 cm^3. Solid; excludes infill. The upstream hardware/follower/STL/Follower_Shoulder_Rotation.STL (mm) integrates to 6893.43 mm^3 (same solid, 0.01 % apart, re-tessellated)." }
infill_fraction = { value = 0.30, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "The Koch v1.1 README gives material, layer height, maximum nozzle diameter and ~30 % infill (its author used 37 %), no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
shoulder_pan_range = { value = [-2.2, 2.2], unit = "rad", fidelity = "estimated", rationale = "No published limit (the URDF of S2 has a placeholder -3.14 .. 3.14). MuJoCo Menagerie low_cost_robot_arm (S3) sets 'approximate joint limits' of -2.2 .. 2.2 for base_rotation, same axis (0 0 -1) as URDF joint_1. The XL430 itself turns a full revolution (LeRobot lists shoulder_pan as a full-turn motor)." }

[geometry]
shape = "mesh"
mesh = "meshes/koch/link_1.STL"
material = "pla"
urdf_link = "link_1"
origin_xyz = [0.0, 0.0, 0.0]
origin_rpy = [0.0, 0.0, 0.0]
bbox_min = [-0.0143, -0.02, -0.0019]
bbox_max = [0.0383, 0.02, 0.009]
# mesh units metres; the mesh is already in the URDF link frame (visual origin identity). Link frame origin = shoulder_pan joint origin (the horn outer face).

# Ports derived by tools/koch_ports.py (closure check: python tools/koch_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame = URDF link frame.
# horn_seat: mate with robotis-xl430-w250-t `output` (k = 0) with reverse = true (URDF joint_1 axis is -z, the output axis is +z); q = 0 is the URDF zero of shoulder_pan, limits in shoulder_pan_range.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.dynamixel-xl430"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = inv(J_joint_1) @ S_joint_1 @ Rx(pi) with J the URDF joint frame (joint_1 = shoulder_pan) and S the servo frame in the parent link; mating robotis-xl430-w250-t.output (k = 0) reproduces the URDF. The URDF joint axis is the INVERSE of the output axis, so the mate needs reverse = true to get the URDF sign"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
joint = "shoulder_pan"
joint_reverse = true

# servo_seat: seat of the shoulder_lift servo (Dynamixel XL430-W250-T) in this bracket.
[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.dynamixel-xl430-base"
gender = "neutral"
pos = [0.011999997386, 0.016999999741, 0.0154]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = S_joint_2 @ P_base @ Rx(pi) (printed part frame = parent link frame); the holder is the printed part of the link whose *_motor mesh contains the servo"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
servo_joint = "shoulder_lift"

