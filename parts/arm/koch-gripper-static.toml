id = "koch-gripper-static"
name = "Koch v1.1 follower gripper static part (3D printed, link_5)"
category = "frame.printed"
vendor = "Jess Moss / Hugging Face (Koch v1.1, Apache-2.0); original design Alexander Koch"
part_number = "Follower_Gripper_Static_Part.STL (sim mesh link_5.STL)"
url = "https://github.com/jess-moss/koch-v1-1/blob/1a553e1fa7d5404b51bbd83b99b0f7eba54888e0/hardware/follower/STL/Follower_Gripper_Static_Part.STL"

[params]
volume_solid = { value = 1.3421e-5, unit = "m^3", fidelity = "derived", derivation = "Signed-volume (divergence theorem) integral over the 1458 triangles of meshes/koch/link_5.STL (binary STL, metres) = 13.421 cm^3. Solid; excludes infill. The upstream hardware/follower/STL/Follower_Gripper_Static_Part.STL (mm) integrates to 13418.8 mm^3 (same solid, 0.01 % apart, re-tessellated)." }
infill_fraction = { value = 0.30, unit = "1", src = "S1", fidelity = "datasheet" }
layer_height    = { value = 0.0002, unit = "m", src = "S1", fidelity = "datasheet" }
nozzle_diameter = { value = 0.0004, unit = "m", src = "S1", fidelity = "datasheet" }
wall_count      = { value = 2, unit = "1", fidelity = "estimated", rationale = "The Koch v1.1 README gives material, layer height, maximum nozzle diameter and ~30 % infill (its author used 37 %), no perimeter count; 2 perimeters is a common slicer default (not verified against a specific slicer profile)." }
wrist_roll_range = { value = [-3.14, 3.14], unit = "rad", fidelity = "estimated", rationale = "No published limit. The URDF of S2 (-3.14 .. 3.14) and MuJoCo Menagerie low_cost_robot_arm (S3, 'approximate joint limits', joint wrist_roll, same axis (1 0 0) as URDF joint_5) agree; the XL330 itself turns a full revolution (LeRobot lists wrist_roll as a full-turn motor)." }

[geometry]
shape = "mesh"
mesh = "meshes/koch/link_5.STL"
material = "pla"
urdf_link = "link_5"
origin_xyz = [0.0, 0.0, 0.0]
origin_rpy = [0.0, 0.0, 0.0]
bbox_min = [-0.0689, -0.0175, -0.0148]
bbox_max = [0.0, 0.0202, 0.0148]
# mesh units metres; the mesh is already in the URDF link frame (visual origin identity). Link frame origin = wrist_roll joint origin (the horn outer face).

# Ports derived by tools/koch_ports.py (closure check: python tools/koch_ports.py --check). Port frame: z = axis (outward), x = ref, y = z x x; part frame = mesh frame = URDF link frame.
# horn_seat: mate with robotis-xl330-m288-t `output` (k = 0) with reverse = true (URDF joint_5 axis is +x, the output axis is -x); q = 0 is the URDF zero of wrist_roll, limits in wrist_roll_range.
[[ports]]
name = "horn_seat"
kind = "mech"
type = "servo-horn.dynamixel-xl330"
gender = "female"
pos = [0.0, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
symmetry = 1
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = inv(J_joint_5) @ S_joint_5 @ Rx(pi) with J the URDF joint frame (joint_5 = wrist_roll) and S the servo frame in the parent link; mating robotis-xl330-m288-t.output (k = 0) reproduces the URDF. The URDF joint axis is the INVERSE of the output axis, so the mate needs reverse = true to get the URDF sign"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
joint = "wrist_roll"
joint_reverse = true

# servo_seat: seat of the gripper servo (Dynamixel XL330-M288-T) in this part.
[[ports]]
name = "servo_seat"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-base"
gender = "neutral"
pos = [-0.013150000429, -2.035e-09, -0.01140000084]
axis = [0.0, 0.0, 1.0]
ref = [0.0, 1.0, 0.0]
symmetry = 2
thickness = 0.003
fidelity = "derived"
derivation = "tools/koch_ports.py from meshes/koch/follower.urdf (s1lent4gnt/koch-v1-1 cc1a4eb): F = S_joint_6 @ P_base @ Rx(pi) (printed part frame = parent link frame); the holder is the printed part of the link whose *_motor mesh contains the servo"
thickness_rationale = "No published or measurable value (exported mesh, no screw-boss data); 3 mm placeholder (2 mm printed wall plus boss margin), the value used by the SO-101 parts. Estimated."
servo_joint = "gripper"

