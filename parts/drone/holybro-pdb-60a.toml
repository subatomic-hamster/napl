# Kit PDB: XT60 in from the PM02 module/battery side, XT30 plugs out to the four ESCs and peripherals.
# Copper resistance and dimensions are not published numerically (a dimensions drawing exists only as an image).

[params]
current_rated  = { value = 60.0, unit = "A", src = "S1", fidelity = "datasheet" }
current_max    = { value = 120.0, unit = "A", src = "S1", fidelity = "datasheet" }    # < 60 s
mount_pattern  = { value = 0.045, unit = "m", src = "S1", fidelity = "datasheet" }    # 45x45 mm mounting holes
mass           = { value = 0.015, unit = "kg", fidelity = "estimated", rationale = "No bare-board mass published (Holybro shipping weights are packaged: 40-50 g). Assumed ~15 g for a ~50 mm 2-layer heavy-copper PCB with XT60 and 4-5 XT30 plugs soldered; unverified." }
r_path         = { value = 0.0005, unit = "ohm", fidelity = "estimated", rationale = "Board copper path resistance unpublished. A 60 A continuous board needs well under 1 mOhm from XT60 pad to each XT30 pad; 0.5 mOhm assumed (loss at 60 A would be 1.8 W). Plug contact resistance modelled separately via amass-xt60." }

