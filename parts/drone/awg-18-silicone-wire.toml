id = "awg-18-silicone-wire"
name = "18 AWG silicone-insulated stranded copper wire"
category = "wire"
vendor = "generic"
part_number = "18 AWG"
url = "https://en.wikipedia.org/wiki/American_wire_gauge"

# Not confirmed as present in the X500 V2 kit (motor and ESC lead gauges are unpublished); provided as a table entry for wiring graphs.

[params]
awg                = { value = 18, unit = "AWG", src = "S1", fidelity = "literature" }
resistance_per_m   = { value = 0.02095, unit = "ohm/m", src = "S1", fidelity = "literature" }    # 20.95 mOhm/m at 20 C
conductor_area     = { value = 0.823e-6, unit = "m^2", src = "S1", fidelity = "literature" }
conductor_diameter = { value = 0.001024, unit = "m", src = "S1", fidelity = "literature" }
mass_per_m_copper  = { value = 0.007353, unit = "kg/m", fidelity = "derived", derivation = "Conductor area x copper density: 0.823e-6 m^2 x 8935 kg/m^3 (S2) = 0.007353 kg/m." }
mass_per_m         = { value = 0.01030, unit = "kg/m", fidelity = "estimated", rationale = "Copper 7.35 g/m (derived) x 1.4 for silicone insulation (factor from the 12 AWG case, see awg-12-silicone-wire). Not weighed; +-20%." }

# Two end ports of family wire-lead (the family the other wire files in parts/connectors use; solder cups and pads join them).
# Per-instance mass = mass_per_m * length, resistance = resistance_per_m * length; the part has no fixed length or geometry.
# No i_max: the ampacity columns of the AWG table are not in the recorded S1 quote for 18 AWG.
[[ports]]
name = "end_a"
kind = "power"
type = "wire-lead"
gender = "neutral"
role = "passthrough"

[[ports]]
name = "end_b"
kind = "power"
type = "wire-lead"
gender = "neutral"
role = "passthrough"

