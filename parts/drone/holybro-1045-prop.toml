id = "holybro-1045-prop"
name = "Holybro 1045 propeller (T1045II, 10x4.5, X500 V2 kit)"
category = "prop"
vendor = "Holybro"
part_number = "530084 (Propeller1045, 2 pair)"
url = "https://holybro.com/products/spare-parts-x500-v2-kit"

# Kit ships 6 props (CW + CCW pairs). The Holybro motor spec image lists them as "T1045II".
# No measured C_T/C_P curve exists for this exact prop. Static C_T/C_Q below are DERIVED from the vendor thrust-stand
# table of holybro-2216-kv920 (J = 0 only). For the advance-ratio (J) shape, the closest published reference is
# parts/drone/uiuc-apc-sf-10x4.7.toml (APC Slow Flyer 10x4.7, UIUC wind-tunnel data): same diameter, similar pitch (4.7 vs 4.5).

[params]
diameter   = { value = 0.254, unit = "m", src = "S1", fidelity = "datasheet" }     # 10 in
pitch      = { value = 0.1143, unit = "m", src = "S1", fidelity = "datasheet" }    # 4.5 in
mass       = { value = 0.0125, unit = "kg", src = "S1", fidelity = "datasheet" }   # "Weight (Single Propeller) 12.5g"
blade_count = { value = 2, unit = "1", fidelity = "estimated", rationale = "Holybro sells '1045 Propellers (6 pcs)' / 'Propeller1045(2pair)', i.e. CW/CCW pairs of the standard 2-blade 10x4.5 plastic prop; blade count is not written in the spec table." }
material   = { value = "Nylon+Glass fiber", unit = "text", src = "S1", fidelity = "datasheet" }
optimum_rpm_min = { value = 6000, unit = "rpm", src = "S1", fidelity = "datasheet" }
optimum_rpm_max = { value = 7000, unit = "rpm", src = "S1", fidelity = "datasheet" }
thrust_limit = { value = 11.768, unit = "N", src = "S1", fidelity = "datasheet" }  # "Thrust Limitation 1.2kg" -> 1.2 kg x 9.80665
j_prop     = { value = 6.72e-5, unit = "kg*m^2", fidelity = "derived", derivation = "Slender uniform rod about its midpoint: J = m*L^2/12 = 0.0125*0.254^2/12 = 6.72e-5 kg*m^2. Real blades carry mass nearer the hub and have a hub boss, so true J is likely 20-40% lower; mass distribution is not published. Treat as an upper bound." }
ct_static  = { value = 0.095, unit = "1", fidelity = "derived", derivation = "Mean of derived C_T over the 55-100% throttle rows of [tables.ct_cq_static_derived] (range 0.0936-0.0962), C_T = T/(rho*n^2*D^4), rho = 1.225 kg/m^3 assumed (vendor does not state air density), D = 0.254 m. Uncertainty from rho and thrust-stand conditions is a few percent." }
cq_static  = { value = 0.0053, unit = "1", fidelity = "derived", derivation = "Mean of derived C_Q over the rows of [tables.ct_cq_static_derived]; C_Q = Q/(rho*n^2*D^5) with vendor torque rounded to 0.01 N*m, so each row carries up to +-10% rounding error at low throttle (+-3% at 100%)." }
ct_borrowed_from = { value = "uiuc-apc-sf-10x4.7", unit = "part id", fidelity = "estimated", rationale = "J-dependence of C_T and C_P should be scaled from the UIUC APC Slow Flyer 10x4.7 curves (same D, pitch/D 0.45 vs 0.47): use C_T(J) = C_T,static(this prop) * [C_T(J)/C_T(0)]_APC-SF. Quantitative accuracy at J > 0 is unvalidated for this prop." }

[tables.ct_cq_static_derived]
# Derived from holybro-2216-kv920 [tables.thrust_test]: columns rpm, thrust, torque as printed there.
# C_T = T/(rho n^2 D^4), C_Q = Q/(rho n^2 D^5), n = rpm/60, rho = 1.225 kg/m^3, D = 0.254 m. (J = 0, sea-level static.)
columns = ["rpm", "J", "C_T", "C_Q"]
rows = [
  [4042, 0.0, 0.0890, 0.00510],
  [4469, 0.0, 0.0898, 0.00557],
  [4855, 0.0, 0.0908, 0.00590],
  [5301, 0.0, 0.0919, 0.00495],
  [5780, 0.0, 0.0926, 0.00499],
  [6298, 0.0, 0.0936, 0.00561],
  [6800, 0.0, 0.0940, 0.00541],
  [7281, 0.0, 0.0952, 0.00524],
  [7679, 0.0, 0.0956, 0.00519],
  [8096, 0.0, 0.0957, 0.00509],
  [8468, 0.0, 0.0959, 0.00543],
  [8867, 0.0, 0.0957, 0.00530],
  [9257, 0.0, 0.0962, 0.00519],
  [9675, 0.0, 0.0953, 0.00535],
  [9857, 0.0, 0.0949, 0.00515],
]
fidelity = "derived"
derivation = "From the vendor thrust-stand table (src S2 of holybro-2216-kv920): C_T = T/(rho*n^2*D^4), C_Q = Q/(rho*n^2*D^5), n = rpm/60, rho = 1.225 kg/m^3 assumed, D = 0.254 m, T = thrust_g*0.00980665."

[geometry]
shape = "cylinder"
size = [0.127, 0.002]       # disc envelope: radius 0.127 m, half-thickness 2 mm (approximate, thin blade); not a mesh

