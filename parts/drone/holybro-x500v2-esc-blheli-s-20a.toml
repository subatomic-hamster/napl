title = "Operation manual for BLHeli_S SiLabs Rev16.x (firmware family of this ESC)"
accessed = "2026-10-07"
quote = "All codes use damped light mode. Damped light does regenerative braking, causing very fast motor retardation, and inherently also does active freewheeling. ... The two numbers denote the FET switching deadtime. The unit is 20.4ns."
