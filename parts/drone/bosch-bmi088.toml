id = "bosch-bmi088"
ports_note = "Data-only sensor chip that lives inside the Pixhawk 6C (holybro-pixhawk-6c); it is never mounted or wired on its own, so it has no ports. Noise/bias numbers feed the IMU model of the flight controller."
name = "Bosch BMI088 6-axis IMU (Pixhawk 6C secondary IMU, replaces discontinued BMI055)"
category = "sensor.imu"
vendor = "Bosch Sensortec"
part_number = "BMI088"
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmi088-ds001.pdf"

# Conversions from datasheet units: 1 deg/s = 0.0174533 rad/s; 1 g = 9.80665 m/s2; 1 ug = 9.80665e-6 m/s2.
[params]
gyro_noise_density     = { value = 2.4435e-4, unit = "rad/s/sqrt(Hz)", src = "S1", fidelity = "datasheet" }
gyro_rms_noise_47hz    = { value = 1.7453e-3, unit = "rad/s", src = "S1", fidelity = "datasheet" }
gyro_zro_initial       = { value = 0.017453, unit = "rad/s", src = "S1", fidelity = "datasheet" }
gyro_zro_tempco        = { value = 2.618e-4, unit = "rad/s/K", src = "S1", fidelity = "datasheet" }
gyro_fs_max            = { value = 34.907, unit = "rad/s", src = "S1", fidelity = "datasheet" }
gyro_resolution_at_2000dps = { value = 1.0647e-3, unit = "rad/s/LSB", src = "S1", fidelity = "datasheet" }
gyro_odr_max           = { value = 2000, unit = "Hz", src = "S1", fidelity = "datasheet" }
gyro_odr_min           = { value = 100, unit = "Hz", src = "S1", fidelity = "datasheet" }
gyro_sensitivity_tolerance = { value = 1.0, unit = "%", src = "S1", fidelity = "datasheet" }
accel_noise_density_xy = { value = 1.569e-3, unit = "m/s2/sqrt(Hz)", src = "S1", fidelity = "datasheet" }
accel_noise_density_z  = { value = 1.863e-3, unit = "m/s2/sqrt(Hz)", src = "S1", fidelity = "datasheet" }
accel_zero_g_offset    = { value = 0.19613, unit = "m/s2", src = "S1", fidelity = "datasheet" }
accel_zero_g_tempco    = { value = 1.961e-3, unit = "m/s2/K", src = "S1", fidelity = "datasheet" }
accel_fs_max           = { value = 235.36, unit = "m/s2", src = "S1", fidelity = "datasheet" }
accel_fs_min           = { value = 29.42, unit = "m/s2", src = "S1", fidelity = "datasheet" }
accel_sensitivity_at_3g = { value = 10920, unit = "LSB/g", src = "S1", fidelity = "datasheet" }
accel_odr_max          = { value = 1600, unit = "Hz", src = "S1", fidelity = "datasheet" }
accel_odr_min          = { value = 12.5, unit = "Hz", src = "S1", fidelity = "datasheet" }

