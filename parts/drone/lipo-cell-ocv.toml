rationale = "Normalized OCV/OCVmax table from the Modelica Standard Library example data (generic Li-ion/LiPo-like cell, OCVmax 4.2 V); not measured on a Tattu/Holybro LiPo, and chemistry is not stated by the library. Values multiplied by 4.2 V. Use for sag/endurance simulation only to first order; replace with a measured curve of the chosen pack when available."

