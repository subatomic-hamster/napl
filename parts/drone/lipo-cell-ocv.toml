id = "lipo-cell-ocv"
name = "Generic LiPo/Li-ion cell open-circuit voltage vs state of charge (4.2 V max)"
category = "battery.cell_curve"
vendor = "Modelica Association (Modelica Standard Library 4.0.0 example data)"
part_number = "Modelica.Electrical.Batteries.ParameterRecords.ExampleData"
url = "https://doc.modelica.org/Modelica%204.0.0/Resources/helpWSM/Modelica/Modelica.Electrical.Batteries.ParameterRecords.ExampleData.html"

# GAP: no peer-reviewed open-access numeric LiPo OCV(SoC) table could be fetched (Chen & Rincon-Mora 2006 and the MDPI LiPo UAV
# papers give graphs/paywalled text only; ResearchGate/MDPI returned 403). This curve is the Modelica Standard Library's published
# "example for an OCV versus SOC characteristic" with OCVmax = 4.2 V. It is generic (not a measured Tattu/Holybro cell, chemistry not stated by MSL), so
# fidelity is estimated. The shape is typical of a graphite/LCO or NMC LiPo: steep below 10% SoC, long plateau 3.2-3.9 V, 4.2 V full.
# Rest-voltage knee at 0% = 0.595*4.2 = 2.50 V is the MSL cutoff (OCVmin 2.5 V); the pack should be cut off at ~3.3-3.5 V per cell in flight (PX4/ESC), not at this value.

[params]
ocv_max = { value = 4.2, unit = "V", src = "S1", fidelity = "literature" }
ocv_min = { value = 2.499, unit = "V", fidelity = "derived", derivation = "0.595 (normalized OCV at SOC = 0, from S1 table) x OCVmax 4.2 V = 2.499 V." }
cutoff_cell_v_flight = { value = 3.5, unit = "V", src = "S2", fidelity = "literature" }   # Bauersfeld discharge-curve end criterion for LiPo flights

[tables.ocv_vs_soc]
# SOC as fraction 0..1; ocv_V = normalized value (S1 table second column) x 4.2 V, rounded to 3 decimals. normalized column kept for audit.
columns = ["soc", "ocv_normalized", "ocv_V"]
