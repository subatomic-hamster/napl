id = "awg-10-silicone-wire"
name = "10 AWG silicone-insulated stranded copper wire (Tattu 4S 5200 mAh pack discharge leads)"
category = "wire"
vendor = "generic (Tattu pack lists Wire Gauge 10#)"
part_number = "10 AWG"
url = "https://en.wikipedia.org/wiki/American_wire_gauge"

# Resistance is the AWG-table value for solid copper at 20 C; stranded silicone wire is a few percent higher (not modelled).

[params]
awg                = { value = 10, unit = "AWG", src = "S2", fidelity = "datasheet" }
resistance_per_m   = { value = 0.003277, unit = "ohm/m", src = "S1", fidelity = "literature" }   # 3.277 mOhm/m at 20 C
conductor_area     = { value = 5.26e-6, unit = "m^2", src = "S1", fidelity = "literature" }
conductor_diameter = { value = 0.002588, unit = "m", src = "S1", fidelity = "literature" }
mass_per_m_copper  = { value = 0.04700, unit = "kg/m", fidelity = "derived", derivation = "Conductor area x copper density: 5.26e-6 m^2 x 8935 kg/m^3 (S3) = 0.0470 kg/m." }
mass_per_m         = { value = 0.0658, unit = "kg/m", fidelity = "estimated", rationale = "Copper 47.0 g/m (derived) x 1.4 for silicone insulation; the 1.4 factor comes from the 12 AWG case (copper 29.6 g/m, ~12.7 g/m insulation from a 4.5 mm OD wire; see awg-12-silicone-wire). Not weighed; +-20%." }

# Two end ports of family wire-lead (the family the other wire files in parts/connectors use; solder cups and pads join them).
# Per-instance mass = mass_per_m * length, resistance = resistance_per_m * length; the part has no fixed length or geometry.
# i_max: vendor chart "max continuous amp rating for silicone cable" (S4), stated as a rule of thumb for 200 C silicone insulation, no
# bundling / temperature-rise condition given. The recorded Wikipedia S1 quote has no ampacity columns, S4 is the source of the rating.
[[ports]]
name = "end_a"
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 65, unit = "A", src = "S4", fidelity = "datasheet" }
role = "passthrough"
note = "Flying Tech chart: 10 AWG up to 65 A max continuous; the vendor does not state a temperature rise. A connector (XT90 45 A) normally limits the path first."

[[ports]]
name = "end_b"
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 65, unit = "A", src = "S4", fidelity = "datasheet" }
role = "passthrough"

