id = "holybro-x500v2-rail-rod"
name = "Holybro X500 V2 payload rail rod (dual 10 mm x 250 mm slide bar)"
category = "frame.tube"
vendor = "Holybro"
part_number = ""
url = "https://shop.holybro.com/x500-v2-kit_p1288.html"

# Two rods per vehicle; the battery board and platform board slide on them. The solid used here (STEP name CARBON-FIBER-TUBE300, volume
# 4783 mm3) is identified by POSITION: it lies at y = -13.0 mm, z = +-30 mm, x from -120 to +130 mm in x500v2-frame.step, through the
# centres (y = -13.0) of the 8 hanger rubber rings. (N3' filed it as the landing-gear cross bar and the 7012 mm3 tube as the rail rod;
# see holybro-x500v2-landing-gear for why that was swapped.)
[params]
outer_diameter = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
length         = { value = 0.250, unit = "m", src = "S1", fidelity = "datasheet" }

[params.cad_outer_diameter]
value = 0.0094
unit = "m"
fidelity = "derived"
derivation = "Outer cylinder face radius 4.7 mm of the rail-rod solid (volume 4783 mm3, bbox 250.00 x 9.40 x 9.40 mm) in x500v2-frame.step, OpenCascade. Holybro says 10 mm."

[params.cad_inner_diameter]
value = 0.008
unit = "m"
fidelity = "derived"
derivation = "Inner cylinder face radius 4.0 mm of the same solid."

[params.cad_length]
value = 0.250
unit = "m"
fidelity = "derived"
derivation = "Volume 4783 mm3 = pi*(4.7^2-4.0^2)*L gives L = 250.0 mm = the bbox, and Holybro's '250 mm long'."

[params.mass]
value = 0.007414
unit = "kg"
fidelity = "derived"
derivation = "cad volume 4.783e-6 m3 * carbon-fibre-epoxy-ud estimated density 1550 kg/m3 = 7.41 g per rod. Material of the rod is not stated by Holybro (carbon tube assumed; it could be aluminium)."

[params.mass_tol]
value = 0.0055
unit = "kg"
fidelity = "estimated"
rationale = "Mass is CAD volume times an estimated UD carbon density (1550 kg/m3); Holybro does not state the rod material and an aluminium rod (2700 kg/m3 -> 12.9 g) is possible, i.e. up to +5.5 g, hence 5.5 g rather than +-10%."

[geometry]
# Part frame: origin at the rod centre, z along the rod axis, cylinder [radius, half-length] along local z (CAD length 250 mm).
shape = "cylinder"
size = [0.0047, 0.125]
material = "carbon-fibre-epoxy-ud"

[[ports]]
name = "hanger"
kind = "mech"
type = "tube.10"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
thickness = 0.0
fidelity = "estimated"
rationale = "Seat held under the bottom plate by the hangers (the 8 hangers are modelled as mass-only instances on the bottom plate, see holybro-x500v2-hanger), so one centred port stands for them (mates 'rail_l'/'rail_r' of the bottom plate). Clamp family named by the nominal 10 mm rod (tube.10); CAD OD is 9.4 mm. The STEP rod centre is 5 mm off the plate centre along the rod (x from -120 to +130 mm); ignored here. Axisymmetric: 360 = discrete stand-in for continuous."

[[ports]]
name = "slide"
kind = "mech"
type = "tube.10"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
thickness = 0.0
fidelity = "estimated"
rationale = "Where the battery board's slide-bar clips (clips x2, screwed with M2.5x6 sunk screws, airframe doc) grip the rod; the clips are free to slide along the rod, so the centre is a nominal choice (battery length 133 mm vs rod 250 mm; STEP clips at x = +-35 mm). Same family as 'hanger'; used as a closure mate when the battery is already placed by the other rod."

