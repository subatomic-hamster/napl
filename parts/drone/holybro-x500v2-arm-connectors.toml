id = "holybro-x500v2-arm-connectors"
name = "Holybro X500 V2 fibre-reinforced nylon arm connectors and motor base (#510178 / #510181), per arm"
category = "frame.connector"
vendor = "Holybro"
part_number = "510178 / 510181"
url = "https://cdn.shopifycdn.net/s/files/1/0604/5905/7341/files/X500_V2_Assembly_Guide_en.pdf?v=1720853913"

# Per arm: 1 arm-end (motor side) clamp, 2 body-side clamp halves, 1 motor base plate. The assignment of the
# STEP solids to these roles is inferred from their positions (radial distance from frame centre), not labelled.
[params]
motor_mount_pattern = { value = 0.016, unit = "m", src = "S1", fidelity = "datasheet" }

[params.arm_end_clamp_cad_volume]
value = 1.1984e-5
unit = "m3"
fidelity = "derived"
derivation = "Solid of bbox 72.05 x 22.00 x 72.05 mm centred 224.7 mm from frame centre (4 off) in x500v2-frame.step, OpenCascade BRepGProp. Role (outer arm clamp that holds the motor base) inferred from position."

[params.body_clamp_half_cad_volume]
value = 4.835e-6
unit = "m3"
fidelity = "derived"
derivation = "Solid of bbox 34.07 x 17.90 x 34.07 mm centred 77.8 mm from frame centre at two heights per arm (8 off) in x500v2-frame.step. Role (body-side clamp halves between the plates) inferred from position."

[params.motor_base_cad_volume]
value = 2.171e-6
unit = "m3"
fidelity = "derived"
derivation = "Solid of bbox 53.57 x 2.00 x 53.57 mm centred 248.8 mm from frame centre (4 off) in x500v2-frame.step. Role (#510181 Motor Base plate) inferred from position and the guide's part-list drawing."

[params.density]
value = 1300
unit = "kg/m3"
fidelity = "estimated"
rationale = "Holybro says 'fiber reinforced nylon' without filler grade. PA66 unfilled is 1140 kg/m3 (nylon-pa66); glass-fibre-filled PA66 grades are 1.3-1.4 g/cc, so 1300 is used as a mid estimate."

[params.mass_per_arm]
value = 0.030973
unit = "kg"
fidelity = "derived"
derivation = "(1.1984e-5 + 2*4.835e-6 + 2.171e-6) = 2.3825e-5 m3 per arm, times estimated density 1300 kg/m3 = 0.030973 kg (31.0 g); four arms = 124 g."

[params.mass]
value = 0.030973
unit = "kg"
fidelity = "derived"
derivation = "= mass_per_arm (sum of the four shape masses below: 2 * 0.006286 + 0.015579 + 0.002822 = 0.030973 kg). The builder instantiates this part once per arm (4 off) and reads this key."

[params.mass_tol]
value = 0.004
unit = "kg"
fidelity = "estimated"
rationale = "Mass is CAD volume times an estimated density; 'fiber reinforced nylon' spans unfilled PA66 (1140 kg/m3, nylon-pa66) to heavily glass-filled grades (~1400 kg/m3), i.e. about -12%/+8% around the 1300 kg/m3 used, ~+-3.7 g of the 31.0 g per arm, rounded to 4 g. Not weighed."

[params.mass_body_half]
value = 0.006286
unit = "kg"
fidelity = "derived"
derivation = "body_clamp_half_cad_volume 4.835e-6 m3 * density 1300 kg/m3 (estimated, see density) = 6.286e-3 kg; used by both body-clamp-half shapes."

[params.mass_arm_end_clamp]
value = 0.015579
unit = "kg"
fidelity = "derived"
derivation = "arm_end_clamp_cad_volume 1.1984e-5 m3 * density 1300 kg/m3 = 1.5579e-2 kg."

[params.mass_motor_base]
value = 0.002822
unit = "kg"
fidelity = "derived"
derivation = "motor_base_cad_volume 2.171e-6 m3 * density 1300 kg/m3 = 2.822e-3 kg."

# Part frame (one arm): origin = centre of the lower body-clamp footprint on the TOP face of the bottom plate (radius 77.8 mm
# from the frame centre), x = outward along the arm diagonal, z up. Positions in this frame (derived from the STEP radial
# distances 77.8 / 224.7 / 248.8 mm and plate heights, docs/research/x500v2-airframe.md):
#   arm-end clamp centre x = 0.2247 - 0.0778 = 0.1469;  motor base centre x = 0.2488 - 0.0778 = 0.1710.
# Heights are ESTIMATED (the notes record only the radial distances and the clamp heights, not the heights above the plates):
#   plate gap 28 mm (frame kit) -> the upper plate underside is at z = 0.028, tube axis at mid-gap z = 0.014 (tube symmetric
#   between the plates), arm-end clamp 22.00 mm tall centred on the tube axis (z 0.003 .. 0.025), 2 mm motor base on top
#   (z 0.025 .. 0.027, motors sit on top of the arms), lower body half on the plate (z 0 .. 0.0179), upper half hanging from the
#   upper plate (z 0.0101 .. 0.028). Resolve with the STEP solid centres of mass (y values).
# Footprints are ESTIMATED: the STEP notes give only the axis-aligned bbox of each solid in the frame, which for a solid rotated 45
# deg is (l + w)/sqrt(2). A square footprint is assumed: side = bbox / sqrt(2): body half 34.07/1.4142 = 24.09 mm, arm-end clamp
# 72.05/1.4142 = 50.95 mm, motor base 53.57/1.4142 = 37.88 mm (square). Boxes are solid, so their volume exceeds the CAD volume
# (the real parts are hollow/cut); the masses are carried by the mass_param keys, not by box volume * density.
[geometry]
material = "nylon-pa66"      # nominal; mass is set per shape by mass_param (density 1300 estimated)

[[geometry.shapes]]
shape = "box"
size = [0.012045, 0.012045, 0.00895]      # half-extents: 24.09 x 24.09 x 17.90 mm
pos = [0.0, 0.0, 0.00895]
mass_param = "mass_body_half"
note = "lower body-clamp half, sits on the bottom plate"

[[geometry.shapes]]
shape = "box"
size = [0.012045, 0.012045, 0.00895]
pos = [0.0, 0.0, 0.01905]
mass_param = "mass_body_half"
note = "upper body-clamp half, hangs from the top plate underside (z = 0.028)"

[[geometry.shapes]]
shape = "box"
size = [0.025475, 0.025475, 0.011]        # 50.95 x 50.95 x 22.00 mm
pos = [0.1469, 0.0, 0.014]
mass_param = "mass_arm_end_clamp"
note = "arm-end clamp around the tube tip, holds the motor base"

[[geometry.shapes]]
shape = "box"
size = [0.01894, 0.01894, 0.001]          # 37.88 x 37.88 x 2.00 mm
pos = [0.1710, 0.0, 0.026]
mass_param = "mass_motor_base"
note = "motor base plate (#510181) on top of the arm-end clamp"

# --- Ports (one set per arm) ---
[[ports]]
name = "plate_lo"
hole_pos = [[0.008, 0.010], [-0.008, 0.010], [-0.008, -0.010], [0.008, -0.010]]   # ESTIMATED, see holybro-x500v2-bottom-plate arm1
kind = "mech"
type = "bolt-pattern.x500v2-arm-clamp.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0179
holes = 4
thread = "m3"
fidelity = "derived"
derivation = "Seat on the bottom plate (mates 'armN' of holybro-x500v2-bottom-plate). Frame origin is that seat centre; axis -z faces down onto the plate top face; ref +x = outward along the arm so mate k = 0 puts the arm on its X-frame diagonal. thickness 0.0179 = lower body-half height (STEP bbox 17.90 mm, body_clamp_half_cad_volume). holes = 4 from M3x38 x16 (airframe doc)."

[[ports]]
name = "plate_hi"
hole_pos = [[0.008, 0.010], [-0.008, 0.010], [-0.008, -0.010], [0.008, -0.010]]   # ESTIMATED, see holybro-x500v2-bottom-plate arm1
kind = "mech"
type = "bolt-pattern.x500v2-arm-clamp.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.028]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0179
holes = 4
thread = "m3"
fidelity = "derived"
derivation = "Seat on the top plate underside (mates 'armN' of holybro-x500v2-top-plate): z = 0.028 = plate gap (frame kit S1 'Space between top and bottom plates: 28mm'), axis +z. thickness = upper body-half height 17.90 mm (STEP bbox)."

[[ports]]
name = "tube_body"
kind = "mech"
type = "tube.16"
gender = "female"
pos = [0.0, 0.0, 0.014]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 360
thickness = 0.0
fidelity = "estimated"
rationale = "Tube bore of the body-clamp pair at the footprint centre; axis -x (inward) so the arm tube's +z points outward along +x after the mate, ref +z makes the tube's x axis point up at k = 0. Height z = 0.014 is mid-gap between the plate faces (tube assumed symmetric between the plates; the STEP height of the tube is not recorded). Resolve with the STEP tube centre of mass y."

[[ports]]
name = "tube_end"
kind = "mech"
type = "tube.16"
gender = "female"
pos = [0.1469, 0.0, 0.014]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 0.0, 1.0]
symmetry = 360
thickness = 0.0
fidelity = "estimated"
rationale = "Tube bore of the arm-end clamp: x = 0.2247 - 0.0778 = 0.1469 (STEP radial distances 224.7 and 77.8 mm), height and orientation as tube_body. Closure mate in the assembly (the tube pose is fixed by tube_body)."

[[ports]]
name = "motor"
kind = "mech"
type = "bolt-pattern.16x16.m3"
gender = "neutral"
pos = [0.17266, 0.0, 0.027]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
thickness = 0.002
holes = 4
thread = "m3"
fidelity = "derived"
src = "S1"
derivation = "16x16 mm motor pattern (S1 'Motor mount pattern: 16x16mm'; the 4 M3x6 screws per arm are in the airframe doc fastener table). x = 0.17266 m = the STEP motor solid centre radius 177.1 * sqrt(2) = 250.46 mm minus 77.8 mm, so the mated motor lands at the STEP motor position (+-177.1, +-177.1 mm); the motor-base plate bbox centre is 248.8 mm (1.7 mm inboard), whose hole pattern is probably not centred on its bbox. z = 0.027 = top face of the 2 mm motor base on top of the 22 mm arm-end clamp (estimated heights, see header). thickness 0.002 = motor base plate (STEP bbox 2.00 mm)."

