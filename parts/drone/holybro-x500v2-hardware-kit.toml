id = "holybro-x500v2-hardware-kit"
name = "Holybro X500 V2 kit hardware not tied to a modelled mate (M2.5 screws, GPS-mount M3 hardware, PDB standoffs)"
category = "frame.hardware"
vendor = "Holybro"
part_number = ""
url = "https://cdn.shopifycdn.net/s/files/1/0604/5905/7341/files/X500_V2_Assembly_Guide_en.pdf?v=1720853913"

# Lumped mass of the guide's screws that the assembly does not attach to a mate (the research doc does not tie them to a mate, and
# several fix hangers / clips / motor bases whose mates are mass-only). Counts from docs/research/x500v2-airframe.md (assembly
# guide PDF, per-arm counts of step 1 are inferred x4); per-item masses are the library fastener parts' own `mass` params.
# NOT in this lump: the 16 M3x6 (motor mates), 16 M3x38 + 16 flange locknuts (clamp mates), 4 M3x14 + 4 locknuts (PDB mate) and
# the 8 M3x8 (landing-gear mates), which the builder counts per mate.
[params.mass]
value = 0.02692
unit = "kg"
fidelity = "derived"
derivation = "24 x iso4762-m2.5x6 (0.405 g; guide steps 1 + 3) 9.72 g + 8 x iso4762-m2.5x10 (0.525 g; step 1) 4.20 g + 8 x iso4762-m2.5x12 (0.585 g; step 1) 4.68 g + 12 x iso10642-m2.5x6 (0.234 g; step 2 'Sunk Screw M2.5*6 12pcs') 2.808 g + 4 x iso7045-m3x10 (0.808 g; GPS mount) 3.232 g + 4 x din985-m3-locknut (0.5 g; GPS mount) 2.00 g + 4 x nylon-standoff-m3x5 (0.07 g; step 3, under the PDB) 0.28 g = 26.92 g."

[params.mass_tol]
value = 0.003
unit = "kg"
fidelity = "estimated"
rationale = "About +-11 % of 26.9 g: the per-arm counts of step 1 are an inference from one drawn arm (the optional companion-computer M2.5 hardware is excluded), and the M2.5x6 countersunk and nylon-standoff masses are themselves derived/estimated in their part files."

[geometry]
shape = "box"
size = [0.01, 0.01, 0.002]
pos = [0.0, 0.0, 0.002]
material = "stainless-304"

