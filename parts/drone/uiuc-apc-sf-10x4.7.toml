id = "uiuc-apc-sf-10x4.7"
name = "APC Slow Flyer 10x4.7 propeller - UIUC wind-tunnel C_T/C_P data (reference for X500 V2 1045 prop J-shape)"
category = "prop.reference"
vendor = "APC (propeller); data: UIUC Propeller Data Site (Selig et al.)"
part_number = "apcsf_10x4.7"
url = "https://m-selig.ae.illinois.edu/props/volume-1/propDB-volume-1.html"

# Closest published prop data to the Holybro 1045 (10x4.5 plastic 2-blade). Wind-tunnel and static measurements of the
# off-the-shelf APC SF 10x4.7 (UIUC Propeller Database Volume 1). Tables transcribed from the .txt data files.
# Static: C_T, C_P vs RPM (J = 0). Advancing: C_T, C_P, eta vs J at constant rpm (two runs, about 4014 and 6020 rpm).
# The Holybro prop derives lower static C_T (about 0.095) than this APC SF (about 0.12-0.13 at 4000-6500 rpm); use only the
# SHAPE C_T(J)/C_T(0), C_P(J)/C_P(0) from here, and scale by the 1045's own static values (see holybro-1045-prop).

[params]
diameter  = { value = 0.254, unit = "m", src = "S1", fidelity = "literature" }      # 10 in
pitch     = { value = 0.11938, unit = "m", src = "S1", fidelity = "literature" }    # 4.7 in per revolution
rpm_static_min = { value = 2377, unit = "rpm", src = "S2", fidelity = "literature" }
rpm_static_max = { value = 6528, unit = "rpm", src = "S2", fidelity = "literature" }
ct_static_at_4029rpm = { value = 0.1158, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_4029rpm = { value = 0.0466, unit = "1", src = "S2", fidelity = "literature" }
ct_static_at_6528rpm = { value = 0.1299, unit = "1", src = "S2", fidelity = "literature" }
cp_static_at_6528rpm = { value = 0.0531, unit = "1", src = "S2", fidelity = "literature" }
j_ct_zero_approx = { value = 0.65, unit = "1", src = "S3", fidelity = "literature" }   # C_T crosses 0 near J=0.647 (4014 rpm) / 0.652 (6020 rpm)
eta_max_approx = { value = 0.65, unit = "1", src = "S4", fidelity = "literature" }     # 0.650 at J=0.458, 6020 rpm run

