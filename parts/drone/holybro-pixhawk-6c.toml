id = "holybro-pixhawk-6c"
name = "Holybro Pixhawk 6C flight controller (aluminium case)"
category = "pcb.fc"
vendor = "Holybro"
part_number = "Pixhawk 6C"
url = "https://docs.holybro.com/autopilot/pixhawk-6c/technical-specification.md"

# On-board sensors per Holybro: ICM-42688-P + BMI088 (BMI055 on earlier units, per PX4 docs) IMUs,
# IST8310 magnetometer, MS5611 barometer. See parts tdk-icm-42688-p, bosch-bmi088, isentek-ist8310,
# te-ms5611-01ba03. The IMUs sit on a rubber-isolated board with heater resistors.
[params]
mass_aluminium_case = { value = 0.0593, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_plastic_case   = { value = 0.0346, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.0848, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.044, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.0124, unit = "m", src = "S1", fidelity = "datasheet" }
fmu_clock           = { value = 480e6, unit = "Hz", src = "S1", fidelity = "datasheet" }
max_input_voltage   = { value = 6, unit = "V", src = "S1", fidelity = "datasheet" }
operating_temp_min  = { value = 248.15, unit = "K", src = "S1", fidelity = "datasheet" }
imu_count           = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 0.0593
unit = "kg"
src = "S1"
fidelity = "datasheet"       # "Weight (Aluminum Case): 59.3g" (same as mass_aluminium_case; the builder reads 'mass')

[geometry]
# Part frame: origin at the centre of the underside (mounting face), x = long axis (84.8 mm, vehicle forward), z up.
shape = "box"
size = [0.0424, 0.022, 0.0062]      # half-extents of length 84.8 x width 44 x height 12.4 mm (S1)
pos = [0.0, 0.0, 0.0062]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Underside seat (mates 'fc' of holybro-x500v2-top-plate). The 6C mounting-hole pattern is published only as a drawing image (docs/research/x500v2-airframe.md gap 4), so a flat foam/tape mount is assumed rather than inventing a hole pattern."

[[ports]]
name = "power1"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
pins = ["POWER1.1", "POWER1.2", "POWER1.3", "POWER1.4", "POWER1.5", "POWER1.6"]
note = "POWER1 header (6 pins listed on the Holybro Pixhawk 6C ports page, fetched 2026-10-07); mates the PM02 fc_power cable (female housing). 'max_input_voltage' 6 V per params. The JST-GH family name is the Pixhawk-standard assumption (the page lists pins, not the connector name): estimated."

[[ports]]
name = "gps1"
kind = "signal"
type = "jst-gh.10"
gender = "male"
pins = ["GPS1.1", "GPS1.2", "GPS1.3", "GPS1.4", "GPS1.5", "GPS1.6", "GPS1.7", "GPS1.8", "GPS1.9", "GPS1.10"]
note = "GPS1 header (10 pins listed on the Holybro ports page, 2026-10-07; JST-GH family: literature by DS-009 compliance, S8/S9, see the round-3 note below); mates the M8N GPS cable (female housing, 26 cm, holybro-m8n-gps)."

[[ports]]
name = "telem1"
kind = "signal"
type = "jst-gh.6"
gender = "male"
pins = ["TELEM1.1", "TELEM1.2", "TELEM1.3", "TELEM1.4", "TELEM1.5", "TELEM1.6"]
note = "TELEM1 header (6 pins listed on the Holybro ports page, 2026-10-07; JST-GH family: literature by DS-009 compliance, S8/S9, see the round-3 note below); the SiK radio connects here. The radio cable is not a filed part, so holybro-sik-telemetry-radio-v3 declares its port neutral."

[[ports]]
name = "pwm1"
kind = "signal"
type = "pwm"
gender = "neutral"
pins = ["FMU_PWM.2", "FMU_PWM.10"]   # FMU_CH1 + GND of the breakout lead (the servo lead's black wire)
note = "FMU PWM Out channel 1 (motor 1): the PX4 X500 V2 + Pixhawk 6C airframe is 'preconfigured with the motors on the FMU PWM Out' (S3). Channel-to-motor numbering follows PX4's quad-X motor order and is not quoted here; the breakout cable (10-pin FMU PWM Out header, listed on the ports page) is folded into the port."

[[ports]]
name = "pwm2"
kind = "signal"
type = "pwm"
gender = "neutral"
pins = ["FMU_PWM.3", "FMU_PWM.10"]
note = "FMU PWM Out channel 2 (motor 2); see pwm1."

[[ports]]
name = "pwm3"
kind = "signal"
type = "pwm"
gender = "neutral"
pins = ["FMU_PWM.4", "FMU_PWM.10"]
note = "FMU PWM Out channel 3 (motor 3); see pwm1."

[[ports]]
name = "pwm4"
kind = "signal"
type = "pwm"
gender = "neutral"
pins = ["FMU_PWM.5", "FMU_PWM.10"]
note = "FMU PWM Out channel 4 (motor 4); see pwm1."

# ---- Round 3 interface completeness (Holybro ports page S7, Pixhawk Connector Standard S8, PX4 6C page S9). Pin 1 is the
# "right side" of the controller (S7 hint). The connector family is JST GH: DS-009 (S8) defines the Pixhawk ports in that series and
# PX4 (S9) says the 6C complies with it; the Holybro ports page names only JST-ZH (DSM) and JST-SH (debug), so GH for the rest is
# `literature` by compliance, not a Holybro statement. Per-header 5 V pins are modelled as separate power `source` ports (a source
# is never "floating"); the 5 V rail comes from the board input (POWER1/2 or USB), its regulator is not published.
# POWER2 (S7 'Power1 & 2': same 6-pin pinout as POWER1; S9 '2 Power input ports (Analog)') is NOT a port here: an unwired sink
# power port raises DRC FLOATING_PORT on every design that uses only POWER1, and the port schema has no `optional` flag. Add it as
# a sink port when the schema gets one (see the P2c report).

[[ports]]
name = "telem1_vcc"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "TELEM1 pin 1 VCC +5V (S7); 'TELEM1 Max output current limiter: 1.5A' (S9), its own limiter."

[[ports]]
name = "telem2_vcc"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "TELEM2 pin 1 VCC +5V (S7); 'All other port combined output current limiter: 1.5A' (S9): the 1.5 A is shared with every port except TELEM1, so it is a combined limit, not per port."

[[ports]]
name = "telem3_vcc"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "TELEM3 pin 1 VCC +5V (S7); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "gps1_vcc"
kind = "power"
type = "jst-gh.10"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "GPS1 pin 1 VCC +5V (S7); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "gps2_vcc"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "GPS2 pin 1 VCC +5V (S7); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "can1_vcc"
kind = "power"
type = "jst-gh.4"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "CAN1 pin 1 VCC +5V (S7); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "can2_vcc"
kind = "power"
type = "jst-gh.4"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "CAN2 pin 1 VCC +5V (S7, one table 'CAN1 & CAN2 Port'); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "i2c_vcc"
kind = "power"
type = "jst-gh.4"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
i_max = { value = 1.5, unit = "A", src = "S9", fidelity = "datasheet" }
note = "I2C pin 1 VCC +5V (S7); shares the combined 1.5 A limiter of all non-TELEM1 ports (S9)."

[[ports]]
name = "rc_5v"
kind = "power"
type = "jst-gh.5"
gender = "male"
role = "source"
v_max = { value = 5.0, unit = "V", src = "S7", fidelity = "datasheet" }
fidelity = "estimated"
rationale = "Pin 1 VDD_5V_PPM_SBUS +5V of the PPM/SBUS RC port (S7). No pin current limit is published and neither Holybro nor DS-009 names the 5-pin RC connector family; JST GH 5-pin is assumed from the Pixhawk series (no fetched source says so). v_max is the printed rail voltage."
note = "5 V pin of the RC input header; a CRSF / SBUS receiver is supplied here."

[[ports]]
name = "telem2"
kind = "signal"
type = "jst-gh.6"
gender = "male"
note = "TELEM2 (UART5): pin 1 VCC, 2 TX out, 3 RX in, 4 CTS in, 5 RTS out, 6 GND, 3.3 V logic (S7); full flow control (S9). Same pinout as the DS-009 Telemetry Port (S8). An ELRS receiver wires TX/RX here (CRSF)."

[[ports]]
name = "telem3"
kind = "signal"
type = "jst-gh.6"
gender = "male"
note = "TELEM3 (USART2): pin 2 TX out, 3 RX in, 6 GND; pins 4-5 NOT CONNECTED, or I2C4 SCL/SDA on boards with serial number XXXX 001 XXXXXX where a non-I2C device must not be plugged in (S7). No flow control (S9)."

[[ports]]
name = "gps2"
kind = "signal"
type = "jst-gh.6"
gender = "male"
note = "GPS2 basic GPS port: 2 UART8_TX out, 3 UART8_RX in, 4 I2C2_SCL, 5 I2C2_SDA, 6 GND, 3.3 V logic (S7, S9 'GPS2 - Basic GPS port')."

[[ports]]
name = "can1"
kind = "signal"
type = "jst-gh.4"
gender = "male"
note = "CAN1: pin 2 CAN1_H, 3 CAN1_L, 1 VCC +5V, 4 GND (S7); 'CAN Bus has individual silent controls or ESC RX-MUX control' (S9). DS-009 asks for twisted wires (S8)."

[[ports]]
