id = "holybro-pixhawk-6c"
name = "Holybro Pixhawk 6C flight controller (aluminium case)"
category = "pcb.fc"
vendor = "Holybro"
part_number = "Pixhawk 6C"
url = "https://docs.holybro.com/autopilot/pixhawk-6c/technical-specification.md"

# On-board sensors per Holybro: ICM-42688-P + BMI088 (BMI055 on earlier units, per PX4 docs) IMUs,
# IST8310 magnetometer, MS5611 barometer. See parts tdk-icm-42688-p, bosch-bmi088, isentek-ist8310,
# te-ms5611-01ba03. The IMUs sit on a rubber-isolated board with heater resistors.
[params]
mass_aluminium_case = { value = 0.0593, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_plastic_case   = { value = 0.0346, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.0848, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.044, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.0124, unit = "m", src = "S1", fidelity = "datasheet" }
fmu_clock           = { value = 480e6, unit = "Hz", src = "S1", fidelity = "datasheet" }
max_input_voltage   = { value = 6, unit = "V", src = "S1", fidelity = "datasheet" }
operating_temp_min  = { value = 248.15, unit = "K", src = "S1", fidelity = "datasheet" }
imu_count           = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }

[params.mass]
value = 0.0593
unit = "kg"
src = "S1"
fidelity = "datasheet"       # "Weight (Aluminum Case): 59.3g" (same as mass_aluminium_case; the builder reads 'mass')

[geometry]
# Part frame: origin at the centre of the underside (mounting face), x = long axis (84.8 mm, vehicle forward), z up.
shape = "box"
size = [0.0424, 0.022, 0.0062]      # half-extents of length 84.8 x width 44 x height 12.4 mm (S1)
pos = [0.0, 0.0, 0.0062]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Underside seat (mates 'fc' of holybro-x500v2-top-plate). The 6C mounting-hole pattern is published only as a drawing image (docs/research/x500v2-airframe.md gap 4), so a flat foam/tape mount is assumed rather than inventing a hole pattern."

[[ports]]
name = "power1"
kind = "power"
type = "jst-gh.6"
gender = "male"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
note = "POWER1 header (6 pins listed on the Holybro Pixhawk 6C ports page, fetched 2026-10-07); mates the PM02 fc_power cable (female housing). 'max_input_voltage' 6 V per params. The JST-GH family name is the Pixhawk-standard assumption (the page lists pins, not the connector name): estimated."

[[ports]]
name = "gps1"
kind = "signal"
type = "jst-gh.10"
gender = "male"
note = "GPS1 header (10 pins listed on the Holybro ports page, 2026-10-07; JST-GH family assumed, estimated); mates the M8N GPS cable (female housing, 26 cm, holybro-m8n-gps)."

[[ports]]
name = "telem1"
kind = "signal"
type = "jst-gh.6"
gender = "male"
note = "TELEM1 header (6 pins listed on the Holybro ports page, 2026-10-07; JST-GH family assumed, estimated); the SiK radio connects here. The radio cable is not a filed part, so holybro-sik-telemetry-radio-v3 declares its port neutral."

[[ports]]
name = "pwm1"
kind = "signal"
type = "pwm"
gender = "neutral"
note = "FMU PWM Out channel 1 (motor 1): the PX4 X500 V2 + Pixhawk 6C airframe is 'preconfigured with the motors on the FMU PWM Out' (S3). Channel-to-motor numbering follows PX4's quad-X motor order and is not quoted here; the breakout cable (10-pin FMU PWM Out header, listed on the ports page) is folded into the port."

[[ports]]
name = "pwm2"
kind = "signal"
type = "pwm"
gender = "neutral"
note = "FMU PWM Out channel 2 (motor 2); see pwm1."

[[ports]]
name = "pwm3"
kind = "signal"
type = "pwm"
gender = "neutral"
note = "FMU PWM Out channel 3 (motor 3); see pwm1."

[[ports]]
name = "pwm4"
kind = "signal"
type = "pwm"
gender = "neutral"
note = "FMU PWM Out channel 4 (motor 4); see pwm1."

[params.vibration_isolation_present]
value = 1
unit = "1"
src = "S2"
fidelity = "datasheet"

# ---- Supply current. Holybro publishes NO power consumption for the Pixhawk 6C (technical-specification and overview pages list only
# the 6 V maximum input and the 1.5 A output-port current limiters). A DERIVED sum of the component datasheet currents is recorded
# instead (sources S4-S6 are the chip datasheets). Not included: the IMU heater resistors (power unpublished), LEDs, buzzer / RC / servo
# rail circuitry, regulator quiescent current, and any peripheral the firmware leaves unused.
[params.h743_idd_run_480mhz_all_peripherals]
value = 0.226
unit = "A"
src = "S4"
fidelity = "datasheet"

[params.icm42688_idd_6axis_ln]
value = 0.00088
unit = "A"
src = "S5"
fidelity = "datasheet"

[params.bmi088_idd_gyro_accel_normal]
value = 0.00515
unit = "A"
src = "S6"
fidelity = "datasheet"

[params.f103_io_mcu_idd]
value = 0.030
unit = "A"
fidelity = "estimated"
rationale = "IO co-processor STM32F103 at 72 MHz (Holybro spec: 'IO Processor: STM32F103 ... 72MHz'). The ST datasheet DS5319 could not be fetched in this session (st.com blocks the fetch tool); a search-engine summary of its 'Run mode, code from Flash' table gave about 30 mA at 72 MHz with all peripherals disabled and 45 mA with all enabled (maximum values at 85 degC, not typical). 30 mA is used: an unverified second-hand figure, hence estimated."

[params.supply_current_typ]
value = 0.26203
unit = "A"
fidelity = "derived"
derivation = "Sum at the 3.3 V rail: STM32H743 Run mode at 480 MHz, VOS0, all peripherals enabled, typ 226 mA (h743_idd_run_480mhz_all_peripherals; DS12110 Table 129, a CoreMark workload, supply voltage not printed in the table row, 3.3 V assumed) + F103 30 mA (estimated) + ICM-42688-P 0.88 mA + BMI088 5.15 mA (5 mA gyro + 0.15 mA accel) = 262.0 mA. Taken as the 5 V input current by assuming the 5 V to 3.3 V conversion is a linear regulator (same current in and out; a buck would draw about 3.3/5/eta of it, i.e. 0.7-0.8x): the regulator type of the 6C is not published, so this is the high-side assumption."

[params.supply_current_typ_tol]
value = 0.08
unit = "A"
fidelity = "estimated"
rationale = "Spread of the derivation: the 'all peripherals disabled' typ is 148 mA vs 226 mA enabled (DS12110 Table 129), PX4 workload is not CoreMark, the regulator may be a buck (0.7-0.8x), and unmodelled heater / LED / port loads add. About +-30 %."

