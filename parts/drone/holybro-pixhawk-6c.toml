accessed = "2026-10-08"
quote = "Pin 1 starts from the flight controllers \"right side\" like diagram below. || Power 1 & 2 | 1(red) VDD5V_BRICK1 (in) +5V | 2(black) VDD5V_BRICK1 (in) +5V | 3(black) CURRENT1 +3.3V | 4(black) VOLTAGE1 +3.3V | 5(black) GND | 6(black) GND || GPS 1 | 1(red) VCC +5V | 2(black) TX1 (out) +3.3V | 3(black) RX1 (in) +3.3V | 4(black) SCL1 +3.3V | 5(black) SDA1 +3.3V | 6(black) SAFETY_SWITCH +3.3V | 7(black) SAFETY_SWITCH_LED +3.3V | 8(black) IO_VDD_3V3 +3.3V | 9(black) BUZZER- 0~5V | 10(black) GND || Telem 1 | 1(red) VCC +5V | 2(black) UART7_TX (out) +3.3V | 3(black) UART7_RX (in) +3.3V | 4(black) UART7_CTS (in) +3.3V | 5(black) UART7_RTS (out) +3.3V | 6(black) GND || FMU PWM OUT (AUX OUT) | 1(red) VDD_Servo | 2(black) FMU_CH1 +3.3V | ... | 9(black) FMU_CH8 +3.3V | 10(black) GND || I/O PWM OUT (MAIN OUT) | 1 (Red) VDD_Servo | 2 (Black) IO_CH1 +3.3V ... 9 (Black) IO_CH8 +3.3V | 10(Black) GND"

