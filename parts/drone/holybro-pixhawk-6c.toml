kind = "signal"
type = "jst-gh.4"
gender = "male"
note = "CAN2: same 4-pin pinout as CAN1 (S7 prints one table 'CAN1 & CAN2 Port', signal names CAN1_H / CAN1_L)."

[[ports]]
