kind = "signal"
type = "jst-gh.4"
gender = "male"
note = "I2C: pin 2 I2C2_SCL, 3 I2C2_SDA, 3.3 V logic (S7), 1.5 k pull-ups on the autopilot per DS-009 (S8). Serial numbers up to XXXX XXX 20221100 wire pins 2-3 to I2C4 instead (S7)."

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "male"
note = "USB: pin 1 VBUS +5V, 2 DM, 3 DP, 4 GND (S7), 4-pin JST-GH per the standard family; 'USB Power Input: 4.75~5.25V' (S9). Typed as the protocol (usb) because the host side is a cable to a computer, not a filed part."

[[ports]]
name = "rc_ppm_sbus"
kind = "signal"
type = "jst-gh.5"
gender = "male"
fidelity = "estimated"
rationale = "Pin map from S7 (2 PPM&SBUS_IN +3.3V, 3 RSSI_IN +3.3V, 5 GND, 4 not connected); the 5-pin connector family is not named by Holybro or DS-009, JST GH assumed."
note = "PPM/SBUS RC input; 'Dedicated R/C input for Spektrum / DSM and S.BUS, CPPM, analog / PWM RSSI' (S9). CRSF receivers use a TELEM UART instead."

[[ports]]
