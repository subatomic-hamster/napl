name = "hanger1"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.050, 0.030, -0.001]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "derived"
derivation = "STEP hanger solids (HANGER-ZHU_ASM JIA-GUAN / HUAN-GUIJIAO) at x_s = -50 mm, z_s = +-30 mm; guide part 14 'Hanger 8pcs' (4 here at x = +-50 mm, 4 at x = -81 and -117 mm)."

