id = "holybro-x500v2-landing-gear"
name = "Holybro X500 V2 carbon fibre landing gear leg (#31063, vertical pole + cross bar)"
category = "frame.landing_gear"
vendor = "Holybro"
part_number = "31063"
url = "https://cdn.shopifycdn.net/s/files/1/0604/5905/7341/files/X500_V2_Assembly_Guide_en.pdf?v=1720853913"

# Two legs per vehicle. Dimensions measured on x500v2-frame.step with OpenCascade.
[params]
overall_height = { value = 0.215, unit = "m", src = "S1", fidelity = "datasheet" }
nominal_pole_diameter = { value = 0.016, unit = "m", src = "S1", fidelity = "datasheet" }
nominal_crossbar_diameter = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }

[params.pole_cad_outer_diameter]
value = 0.016
unit = "m"
fidelity = "derived"
derivation = "Outer cylinder face radius 8.0 mm of the vertical-pole solid (volume 9315 mm3, bbox 16.00 x 193.58 x 75.10 mm) in x500v2-frame.step."

[params.pole_cad_inner_diameter]
value = 0.014
unit = "m"
fidelity = "derived"
derivation = "Inner cylinder face radius 7.0 mm of the same solid."

[params.pole_cad_length]
value = 0.1977
unit = "m"
fidelity = "derived"
derivation = "Volume 9315 mm3 = pi*(8^2-7^2)*L gives L = 197.7 mm; cross-check lateral area 9937 mm2 / (2*pi*8) = 197.7 mm. Pole axis direction (0, -0.95, -0.30): leans outward ~17.5 deg from vertical."

[params.crossbar_cad_outer_diameter]
value = 0.0094
unit = "m"
fidelity = "derived"
derivation = "Outer cylinder face radius 4.7 mm of the cross-bar solid (volume 4783 mm3, bbox 250.00 x 9.40 x 9.40 mm) in x500v2-frame.step. Holybro text says 10 mm; CAD is 9.4 mm."

[params.crossbar_cad_inner_diameter]
value = 0.008
unit = "m"
fidelity = "derived"
derivation = "Inner cylinder face radius 4.0 mm of the same solid."

[params.crossbar_cad_length]
value = 0.25
unit = "m"
fidelity = "derived"
derivation = "Volume 4783 mm3 = pi*(4.7^2-4.0^2)*L gives L = 250.0 mm, equal to the bbox 250.00 mm."

[params.pole_mass]
value = 0.01444
unit = "kg"
fidelity = "derived"
derivation = "pole volume 9.315e-6 m3 * carbon-fibre-epoxy-ud estimated density 1550 kg/m3 = 14.4 g per pole; two poles per vehicle. Not weighed."

[params.crossbar_mass]
value = 0.00741
unit = "kg"
fidelity = "derived"
derivation = "cross-bar volume 4.783e-6 m3 * carbon-fibre-epoxy-ud estimated density 1550 kg/m3 = 7.4 g per bar; two bars per vehicle. The rubber foam grips and nylon tee connectors are not included here."

[params.mass]
value = 0.02185
unit = "kg"
fidelity = "derived"
derivation = "pole_mass 0.01444 + crossbar_mass 0.00741 = 0.02185 kg per leg (one pole + one cross bar); the builder instantiates the part twice (2 legs, per the file header and airframe doc: 2 poles + 2 cross bars). Tee connectors, foam grips and mounting hardware are not included."

[params.mass_tol]
value = 0.0022
unit = "kg"
fidelity = "estimated"
rationale = "Both masses are CAD volume times an estimated UD carbon density (1550 kg/m3, itself estimated), so +-10% of 21.85 g is carried; the tubes have not been weighed and the CAD ODs (16.0 / 9.4 mm) differ from the nominal 16 / 10 mm for the bar."

[params.lean_angle]
value = 0.3054
unit = "rad"
fidelity = "derived"
derivation = "Pole axis direction (0, -0.95, -0.30) in the Y-up STEP (pole_cad_length derivation): lean from vertical = atan(0.30/0.95) = 17.5 deg = 0.3054 rad, outward. Pole top end to bar axis: vertical 0.1977*cos(17.5 deg) = 0.18855 m, horizontal 0.1977*sin(17.5 deg) = 0.05945 m."

# Part frame (one leg): origin = the centre of the pole's TOP end on the pole axis, z up when installed, +y = the direction the
# pole leans (outward from the vehicle), x along the cross bar. Pole axis direction (0, sin17.5deg, -cos17.5deg) = (0, 0.30071,
# -0.95372); pole centre = 0.09885 * that = (0, 0.029726, -0.094275). Cross bar (horizontal, along x, 250 mm) is centred on the
# pole's bottom end (0, 0.059452, -0.188551) (a T: STEP says only 'strengthened & improved plastic tee connectors'; where
# along the bar the pole joins is not recorded, so the pole is assumed to meet the bar at its centre: estimated).
# Lowest point of the leg: bar axis z - bar radius = -0.188551 - 0.0047 = -0.193251 m below the pole top.
[geometry]
material = "carbon-fibre-epoxy-ud"

[[geometry.shapes]]
shape = "cylinder"
size = [0.008, 0.09885]                       # radius 8.0 mm, half of the 197.7 mm pole length (pole_cad_length)
pos = [0.0, 0.029726, -0.094275]
zaxis = [0.0, 0.30071, -0.95372]
mass_param = "pole_mass"
note = "vertical pole, leans outward 17.5 deg"

[[geometry.shapes]]
shape = "cylinder"
size = [0.0047, 0.125]                        # radius 4.7 mm, half of the 250.0 mm cross-bar length
pos = [0.0, 0.059452, -0.188551]
zaxis = [1.0, 0.0, 0.0]
mass_param = "crossbar_mass"
note = "foot cross bar (skid), horizontal, along x, centred on the pole bottom end (estimated T joint)"

[[ports]]
name = "plate"
kind = "mech"
type = "mount.x500v2-landing-gear"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Pole top end, facing up to the underside of the bottom plate (mates 'leg_front'/'leg_rear' of holybro-x500v2-bottom-plate). The attachment hardware (tee connectors, clamps, M3 screws) is not recorded or modelled, so the interface family 'mount.x500v2-landing-gear' is a placeholder with no hole pattern. The ~193 mm top-to-foot height (0.18855 vertical pole + 0.0047 bar radius) is 22 mm below the published 215 mm 'landing gear height' (frame kit S1), i.e. that figure is measured from a datum 22 mm above the pole top that the notes do not identify. Resolve with the STEP pole-top height."

[[sources]]
id = "S1"
url = "https://docs.holybro.com/drone-development-kit/px4-development-kit-x500v2.md"
title = "PX4 Development Kit - X500v2 (Holybro docs)"
accessed = "2026-10-06"
quote = "Landing gear - 16mm & 10mm diameter carbon fiber tubes with strengthened & improved plastic tee connectors. ... Landing gear height: 215mm"
