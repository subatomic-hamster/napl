id = "awg-14-silicone-wire"
name = "14 AWG silicone-insulated stranded copper wire"
category = "wire"
vendor = "generic"
part_number = "14 AWG"
url = "https://en.wikipedia.org/wiki/American_wire_gauge"

# Not confirmed as present in the X500 V2 kit (ESC XT30 lead gauge is unpublished); provided as a table entry for wiring graphs.

[params]
awg                = { value = 14, unit = "AWG", src = "S1", fidelity = "literature" }
resistance_per_m   = { value = 0.008286, unit = "ohm/m", src = "S1", fidelity = "literature" }   # 8.286 mOhm/m at 20 C
conductor_area     = { value = 2.08e-6, unit = "m^2", src = "S1", fidelity = "literature" }
conductor_diameter = { value = 0.001628, unit = "m", src = "S1", fidelity = "literature" }
mass_per_m_copper  = { value = 0.01858, unit = "kg/m", fidelity = "derived", derivation = "Conductor area x copper density: 2.08e-6 m^2 x 8935 kg/m^3 (S2) = 0.01858 kg/m." }
mass_per_m         = { value = 0.0260, unit = "kg/m", fidelity = "estimated", rationale = "Copper 18.6 g/m (derived) x 1.4 for silicone insulation (factor from the 12 AWG case, see awg-12-silicone-wire). Not weighed; +-20%." }

# Two end ports of family wire-lead (the family the other wire files in parts/connectors use; solder cups and pads join them).
# Per-instance mass = mass_per_m * length, resistance = resistance_per_m * length; the part has no fixed length or geometry.
# i_max: vendor chart "max continuous amp rating for silicone cable" (S3), stated as a rule of thumb for 200 C silicone insulation, no
# bundling / temperature-rise condition given. The recorded Wikipedia S1 quote has no ampacity columns, S3 is the source of the rating.
[[ports]]
name = "end_a"
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 32, unit = "A", src = "S3", fidelity = "datasheet" }
role = "passthrough"
note = "Flying Tech chart: 14 AWG up to 32 A max continuous; the vendor does not state a temperature rise."

[[ports]]
name = "end_b"
kind = "power"
type = "wire-lead"
gender = "neutral"
i_max = { value = 32, unit = "A", src = "S3", fidelity = "datasheet" }
role = "passthrough"

