id = "benewake-tfmini-s"
name = "Benewake TFmini-S single-point LiDAR (12 m, UART/I2C)"
category = "sensor.rangefinder"
vendor = "Benewake"
part_number = "TFmini-S"
url = "https://cdn.sparkfun.com/assets/1/3/a/3/c/TFmini-S_LiDAR_Module_Datasheet.pdf"

# Datasheet SJ-PM-TFmini-S-01 A01 (SparkFun-hosted copy of the Benewake document).
[params]
mass                = { value = 0.005, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.042, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.015, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.016, unit = "m", src = "S1", fidelity = "datasheet" }
cable_length        = { value = 0.10, unit = "m", src = "S1", fidelity = "datasheet" }
range_max_90pct     = { value = 12, unit = "m", src = "S1", fidelity = "datasheet" }
range_max_10pct     = { value = 7, unit = "m", src = "S1", fidelity = "datasheet" }
range_min           = { value = 0.1, unit = "m", src = "S1", fidelity = "datasheet" }
accuracy_short      = { value = 0.06, unit = "m", src = "S1", fidelity = "datasheet" }
accuracy_long_pct   = { value = 1, unit = "%", src = "S1", fidelity = "datasheet" }
resolution          = { value = 0.01, unit = "m", src = "S1", fidelity = "datasheet" }
frame_rate          = { value = 100, unit = "Hz", src = "S1", fidelity = "datasheet" }
fov                 = { value = 0.0349, unit = "rad", src = "S1", fidelity = "datasheet" }
supply_voltage      = { value = 5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_tolerance = { value = 0.1, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_avg_max = { value = 0.14, unit = "A", src = "S1", fidelity = "datasheet" }
supply_current_peak = { value = 0.2, unit = "A", src = "S1", fidelity = "datasheet" }
power_max           = { value = 0.7, unit = "W", src = "S1", fidelity = "datasheet" }
default_baud        = { value = 115200, unit = "baud", src = "S1", fidelity = "datasheet" }
operating_temp_min  = { value = 273.15, unit = "K", src = "S1", fidelity = "datasheet" }
operating_temp_max  = { value = 333.15, unit = "K", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "power_in"
kind = "power"
type = "wire-lead"
gender = "neutral"
v_max = { value = 5.1, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 0.2, unit = "A", src = "S1", fidelity = "datasheet" }
role = "sink"
note = "Supply voltage 5V±0.1V; i_max is the peak current; connector style not given in the extracted datasheet text"

[[ports]]
name = "uart"
kind = "signal"
type = "uart"
gender = "neutral"
level = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
level = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }

[[sources]]
id = "S1"
url = "https://cdn.sparkfun.com/assets/1/3/a/3/c/TFmini-S_LiDAR_Module_Datasheet.pdf"
title = "TFmini-S LiDAR Module Datasheet SJ-PM-TFmini-S-01 A01 (Benewake; SparkFun-hosted copy)"
accessed = "2026-10-07"
quote = "Operating Range 0.1m~12m@90%Reflectivity 0.1~7m@10% Reflectivity ... Accuracy ±6cm@(0.1-6m) ±1%@(6m-12m) Distance resolution 1cm Frame rate 100Hz ... Operating Temperature 0℃~60℃ ... FOV 2° Supply voltage 5V±0.1V Average current ≤140mA Power consumption ≤0.7W Peak current 200mA Communication level LVTTL（3.3V） Communication interface UART / I2C Dimension 42mm*15mm*16mm(L*W*H) ... Weight 5g±0.3g Cable length 10cm ... Default Baud rate 115200"
