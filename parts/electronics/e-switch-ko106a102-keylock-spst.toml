id = "e-switch-ko106a102-keylock-spst"
name = "E-Switch KO106A102 panel-mount key switch, 2-position SPST (off-on), 12 mm hole"
category = "switch.key"
vendor = "E-Switch"
part_number = "KO106A102 (Digi-Key EG2625-ND)"
url = "https://www.digikey.com/en/products/detail/e-switch/KO106A102/EG2625-ND/502089"

# Arm key of cuas-lite: SPST, closed in the ON position. Rated only 1 A at 125 V AC / DC (S1 title: 'SWITCH KEYLOCK 2POS SPST 1A 125V'): it is a CONTROL switch, in the enable loop with the E-stop (it can switch a MOSFET-gate or relay
# coil line and a Pico GPIO, a few mA), never the 4 A of the flywheel motors. Wired as: arm key -> series with the E-stop NC contact -> enable of the gate-drive supply, and a tap of the net to a Pico input.
# Part frame: origin at the centre of the panel flange face, +z out of the panel towards the key, the solder lugs at -z. The datasheet figures not on the Digi-Key page (key length, flange diameter, lug spacing) are not recorded.

[params]
panel_hole_diameter = { value = 0.012, unit = "m", src = "S1", fidelity = "datasheet" }   # circular, 12.00 mm
depth_behind_flange = { value = 0.0153, unit = "m", src = "S1", fidelity = "datasheet" }
positions           = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
throw_angle         = { value = 1.5708, unit = "rad", src = "S1", fidelity = "datasheet" }   # 90 deg
current_rating      = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }   # AC; the DC rating is not on the page
voltage_rating      = { value = 125.0, unit = "V", src = "S1", fidelity = "datasheet" }   # AC
contact_material    = { value = "silver on copper alloy", unit = "-", src = "S1", fidelity = "datasheet" }
mass                = { value = 0.012, unit = "kg", fidelity = "estimated", rationale = "No weight on the Digi-Key page; a 12 mm brass tubular-key lock with two keys and a nut is of the order of 10-15 g." }
length              = { value = 0.0162, unit = "m", fidelity = "estimated", rationale = "Flange / bezel diameter not on the page; 16 mm is typical for a 12 mm-hole key switch. Used only for drawing." }
width               = { value = 0.0162, unit = "m", fidelity = "estimated", rationale = "As length." }
height              = { value = 0.0153, unit = "m", src = "S1", fidelity = "datasheet" }   # depth behind the flange; the key and bezel above it are not counted
price_usd           = { value = 3.94, unit = "USD", src = "S1", fidelity = "datasheet" }   # quantity 1, Digi-Key, 2026-10-11 (10: 3.398)

# Envelope (collision, wire clearance): the barrel behind the flange (an 11.8 mm cylinder through the 12 mm hole, 15.3 mm deep, S1) and the 16.2 mm bezel / key head 5 mm in front of the flange face (estimated).
