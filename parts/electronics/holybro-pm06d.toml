id = "holybro-pm06d"
name = "Holybro PM06D digital power module with PDB (2-14S, 30.5x30.5 mount)"
category = "pcb.pm"
vendor = "Holybro"
part_number = "PM06D"
url = "https://holybro.com/collections/power-modules-pdbs/products/pm06d-power-module"

# Battery-side connector gender is a modelling convention (loads male, batteries female).
[params]
mass                = { value = 0.024, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.035, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.035, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
input_cells_max     = { value = 14, unit = "S", src = "S1", fidelity = "datasheet" }
pcb_current_cont    = { value = 70, unit = "A", src = "S1", fidelity = "datasheet" }
pcb_current_burst   = { value = 120, unit = "A", src = "S1", fidelity = "datasheet" }
current_sense_max   = { value = 327, unit = "A", src = "S1", fidelity = "datasheet" }
output_voltage      = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
output_current_max  = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "30.5 x 30.5 mm per S1; hole size not stated, M3 assumed (inference)"

[[ports]]
name = "battery_in"
kind = "power"
type = "xt60"
gender = "male"
v_max = { value = 58.8, unit = "V", fidelity = "derived", derivation = "2~14S per S1: 14 cells x 4.2 V full charge = 58.8 V." }
i_max = { value = 70, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
pins = ["BAT.1", "BAT.2"]
note = "PCB 70 A continuous; the stock XT60 plug and 12 AWG lead are only 30 A continuous / 60 A burst (S2)"

[[ports]]
name = "fc_out"
kind = "power"
type = "molex-clik-mate.6"
gender = "female"
pins = ["FC.1", "FC.2", "FC.3", "FC.4", "FC.5", "FC.6"]
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"

[[ports]]
name = "bplus_pads"
kind = "power"
type = "solder-pad"
gender = "neutral"
count = 4
role = "source"

# Pin level. BAT: the XT60 named in S1; polarity and 7.2 mm spacing are the XT60 family's (pin 1 +), which Holybro does not print: estimated.
# FC: the 6-pin Molex CLIK-Mate 2.0 mm cable named in S1. The page prints no module-side table; the pins are derived from the FC side (S3): the
# digital module plugs into POWER1/2 of a Pixhawk 5X/6X, whose pins 1-2 are the 5 V supply, 3 SCL, 4 SDA, 5-6 GND, so the module drives 5 V and shares the I2C.
# The four B+ pads of S1 are not drawn (no GND pad count or positions are published).
[[connectors]]
id = "BAT"
name = "battery XT60"
type = "xt60"
gender = "male"
pos = [-0.0175, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "S1 lists an XT60 port but not its polarity or contact spacing: + then -, 7.2 mm of the XT60 family. Board position estimated."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", i_max = 30.0, note = "XT60 contact rating (S2); the PCB is rated 70 A" },
  { number = 2, name = "BAT-", kind = "ground", i_max = 30.0 },
]

[[connectors]]
id = "FC"
name = "FC power cable (6-pin Molex CLIK-Mate 2.0 mm)"
type = "molex-clik-mate-6"
gender = "female"
pos = [0.0175, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 6
pitch = 0.002
fidelity = "derived"
derivation = "The module-side pin table is not published as text. Derived from the Pixhawk 5X/6X POWER1/2 port table (S3: 1-2 VDD5V_BRICK 5 V, 3 SCL, 4 SDA, 5-6 GND): a straight cable, so the module sources the 5 V and shares the two I2C lines. The 5.2 V / 3 A limits are the S1 output ratings."
pins = [
  { number = 1, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 2, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 3, name = "SCL", kind = "signal", dir = "io", v = 3.3 },
  { number = 4, name = "SDA", kind = "signal", dir = "io", v = 3.3 },
  { number = 5, name = "GND", kind = "ground" },
  { number = 6, name = "GND", kind = "ground" },
]

[[sources]]
id = "S3"
url = "https://docs.holybro.com/llms-full.txt"
title = "Holybro docs, 'Pixhawk Baseboard v1 Ports' - Power1 (Main) & Power2 Port (Backup), 2.00mm Pitch CLIK-Mate (Holybro llms-full.txt text export)"
accessed = "2026-10-09"
quote = "Power1 (Main) & Power2 Port (Backup) (2.00mm Pitch CLIK-Mate) | 1(red) VDD5V_BRICK1/2 +5V | 2(black) VDD5V_BRICK1/2 +5V | 3(black) SCL1/2 +3.3V | 4(black) SDA1/2 +3.3V | 5(black) GND | 6(black) GND"

