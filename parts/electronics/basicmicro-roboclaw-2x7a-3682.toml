rows = 1
cols = 2
pitch = 0.00508
src = "S4"
fidelity = "datasheet"
pose_rationale = "Edge position from the overview drawing; the terminal pitch (5.08 mm) is the blue terminal-block family's, not stated by S4: estimated."
pins = [
  { number = 1, name = "B+", kind = "power", dir = "in", v_min = 6.0, v_max = 34.0, i_max = 15.0, note = "S4: 'The plus (+) symbol marks the positive terminal'; 'Do not reverse main battery wires or damage will occur'; main power 6 to 34 VDC" },
  { number = 2, name = "B-", kind = "ground", i_max = 15.0, note = "S4: 'Do not disconnect the negative wire if other ground sources are connected, such as USB cable'" },
]

