id = "basicmicro-roboclaw-2x7a-3682"
name = "Basicmicro RoboClaw 2x7A Motor Controller (V6B/V6F, Pololu item 3682)"
category = "pcb.motor_controller"
vendor = "Basicmicro"
part_number = "RoboClaw 2x7A (Pololu 3682)"
url = "https://www.pololu.com/product/3682"

# Dual-channel brushed-DC H-bridge with two quadrature decoders and a CRC16 Packet Serial interface (docs/research/rover.md: the protocol is
# python/napl/roboclaw.py). Frame: origin at the board centre, z up, x along the 1.9 inch (48.3 mm) side, y along the 1.7 inch side.
# Modelled in the simulator as the H-bridge + velocity / duty firmware of two `servo` devices (src/mujoco/devices/servo.cpp, mode 1 / 2).
# The main-battery screw terminals, the two motor screw-terminal pairs and the 2x3 encoder headers are separate ports; the 5 V BEC and the
# logic-battery input are not modelled (encoders are powered from the BEC: the encoder Vcc of the gearmotor is within 3.5 - 20 V).

[params]
mass                = { value = 0.020,  unit = "kg",  src = "S1", fidelity = "datasheet" }  # without the optional case
length              = { value = 0.0483, unit = "m",   src = "S2", fidelity = "datasheet" }  # 1.9 inch
width               = { value = 0.0424, unit = "m",   src = "S2", fidelity = "datasheet" }  # 1.67 inch
height              = { value = 0.0178, unit = "m",   src = "S1", fidelity = "datasheet" }  # 0.7 inch
v_min               = { value = 6.0,    unit = "V",   src = "S2", fidelity = "datasheet" }  # main battery
v_max               = { value = 34.0,   unit = "V",   src = "S2", fidelity = "datasheet" }
i_continuous        = { value = 7.5,    unit = "A",   src = "S2", fidelity = "datasheet" }  # per channel
i_peak              = { value = 15.0,   unit = "A",   src = "S2", fidelity = "datasheet" }  # per channel; reduced to the typical limit as the board nears 85 degC
r_on                = { value = 0.008,  unit = "ohm", src = "S2", fidelity = "datasheet" }  # "On Resistance 8 mOhm" (per switch, not stated)
encoder_counter_bits = { value = 32,    unit = "bit", src = "S2", fidelity = "datasheet" }
encoder_max_rate    = { value = 9.8e6,  unit = "counts/s", src = "S2", fidelity = "datasheet" }
serial_baud_max     = { value = 460800, unit = "bit/s", src = "S2", fidelity = "datasheet" }
serial_timeout      = { value = 0.010,  unit = "s",   src = "S2", fidelity = "datasheet" }  # a packet with a > 10 ms gap between bytes is discarded (manual, Packet Timeout)
default_qpps        = { value = 44000,  unit = "counts/s", src = "S3", fidelity = "datasheet" }  # Command 28 defaults: QPPS 44000, P 0x10000, I 0x8000, D 0x4000
firmware_hz         = { value = 333.333333333333, unit = "Hz", fidelity = "estimated", rationale = "The velocity-loop rate is not published. Command 30 (S3) returns 'the pulses counted in that last 300th of a second', so a loop of about 300 Hz is implied; the nearest rate that is a whole number of 1 ms simulation ticks is 1 kHz / 3 = 333.3 Hz." }
max_duty_register   = { value = 1000, unit = "0.1 %", fidelity = "derived", derivation = "Full duty = 1000 in the simulator's 0.1 % duty unit (Command 32 range +-32767 = +-100 % duty, S3)." }
pid_scale           = { value = 1, unit = "1", fidelity = "estimated", rationale = "Unused: the position-loop gains of the simulated servo are 0 in the velocity / duty modes; the device schema only requires a positive number." }
protect_voltage_mask = { value = 1, unit = "bitmask", fidelity = "derived", derivation = "Bit 1 of the device alarm = main battery outside [v_min, v_max]; S2: 'If the maximum voltage is exceed the motors will be disabled' and the Packet Serial manual's main-battery cut-off (command 57, a LiPo cut-off mode): the drive is released while the alarm holds." }

[geometry]
shape = "box"
size = [0.02415, 0.0212, 0.0089]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, -0.0089]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
thickness = 0.0
note = "The data sheet drawing shows 2.89 mm mounting holes on a 1.43 inch (36.32 mm) / 1.63 inch (41.40 mm) pattern, but the drawing gives no unambiguous pair of hole-to-hole distances in text, so no bolt pattern is recorded (flat mount, standoffs / tape)."

[[ports]]
name = "power_in"
pins = ["BAT.1", "BAT.2"]
kind = "power"
type = "screw-terminal"
gender = "neutral"
role = "sink"
v_max = { value = 34.0, unit = "V", src = "S2", fidelity = "datasheet" }
v_min = { value = 6.0, unit = "V", src = "S2", fidelity = "datasheet" }
i_max = { value = 15.0, unit = "A", fidelity = "derived", derivation = "Two channels at 7.5 A continuous each (S2) = 15 A from the main battery terminal (the data sheet gives no separate battery-terminal rating)." }
note = "Main battery + / - screw terminal (S2: 'Do not reverse main battery wires or damage will occur')."

[[ports]]
name = "m1_out"
pins = ["M1.1", "M1.2"]
kind = "power"
type = "screw-terminal"
gender = "neutral"
role = "source"
i_max = { value = 7.5, unit = "A", src = "S2", fidelity = "datasheet" }
i_burst = { value = 15.0, unit = "A", src = "S2", fidelity = "datasheet" }
note = "Motor channel 1 (M1A / M1B). The output voltage is the PWM duty times the main battery voltage, so no v_max is stated here (the 34 V is the supply rating of power_in): the net voltage check of a motor on this port is the user's, see docs/research/rover.md."

[[ports]]
name = "m2_out"
pins = ["M2.1", "M2.2"]
kind = "power"
type = "screw-terminal"
gender = "neutral"
role = "source"
i_max = { value = 7.5, unit = "A", src = "S2", fidelity = "datasheet" }
i_burst = { value = 15.0, unit = "A", src = "S2", fidelity = "datasheet" }
note = "Motor channel 2 (M2A / M2B). As m1_out."

[[ports]]
name = "enc1"
pins = ["EN1.2", "EN1.1", "EN1.3", "EN1.4"]   # GND, +5V, A, B: the order of the gearmotor's encoder leads (green, blue, yellow, white)
kind = "signal"
type = "quadrature-encoder"
gender = "neutral"
level = { value = 5.0, unit = "V", src = "S2", fidelity = "datasheet" }
note = "EN1: 1A / 1B plus the + 5 V encoder supply and ground (S2: 'The pins labeled + and - are the source power pins for encoders ... +5VDC'); 5 V tolerant inputs."

[[ports]]
name = "enc2"
pins = ["EN2.2", "EN2.1", "EN2.3", "EN2.4"]
kind = "signal"
type = "quadrature-encoder"
gender = "neutral"
level = { value = 5.0, unit = "V", src = "S2", fidelity = "datasheet" }
note = "EN2: 2A / 2B, as enc1."

[[ports]]
name = "serial"
pins = ["S1.1", "S2.1", "S1.3"]   # RX, TX, GND
kind = "signal"
type = "uart"
gender = "neutral"
level = { value = 3.3, unit = "V", src = "S2", fidelity = "datasheet" }
note = "S1 = RX, S2 = TX of the TTL UART in Packet Serial mode (S2 control-interface table); non-inverted TTL, 8N1, 2400 - 460800 bit/s (S1: 'Available baud rates range from 2400 to 460800 bps'); the USB port speaks the same packet protocol. 'I/O Output Voltage 3.3 V', inputs 5 V tolerant."

# ---- Connectors (pin level). Names, order and electrical roles are the data sheet's (S4: connector overview, "Control Interface" table, the
# power / encoder / control-input paragraphs); where a pin sits on the board outline is estimated from the overview drawing (poses only).
# Frame: z up, the screw terminals on the -y long edge, the headers on the +y edge, USB on +x.
