id = "holybro-pm07"
name = "Holybro PM07 analog power module with PDB and PWM header (2-14S, 45x45 mount)"
category = "pcb.pm"
vendor = "Holybro"
part_number = "PM07"
url = "https://holybro.com/collections/power-modules-pdbs/products/pixhawk-4-power-module-pm07"

# Eight B+ pads for ESCs, two 6-pin GHR power ports and a PWM header for 8 motors. Battery-side gender is a convention.
[params]
mass                = { value = 0.0438, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.068, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.050, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
input_cells_max     = { value = 14, unit = "S", src = "S1", fidelity = "datasheet" }
pcb_current_cont    = { value = 90, unit = "A", src = "S1", fidelity = "datasheet" }
pcb_current_burst   = { value = 140, unit = "A", src = "S1", fidelity = "datasheet" }
current_sense_max   = { value = 120, unit = "A", src = "S1", fidelity = "datasheet" }
output_voltage      = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
output_current_max_each = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.45x45.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "45 x 45 mm per S1; hole size not stated, M3 assumed (inference)"

[[ports]]
name = "battery_in"
kind = "power"
type = "xt60"
gender = "male"
v_max = { value = 58.8, unit = "V", fidelity = "derived", derivation = "2~14S per S1: 14 cells x 4.2 V full charge = 58.8 V." }
i_max = { value = 90, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
note = "Board is 90 A continuous but the stock XT60 plug and lead are 30 A continuous / 60 A burst (S2); fit XT90 above that"

[[ports]]
name = "fc_out"
kind = "power"
type = "jst-gh.6"
gender = "female"
count = 2
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"
note = "6Pin GHR 1.25mm x2, each 5.2V/3A max"

[[ports]]
name = "bplus_pads"
kind = "power"
type = "solder-pad"
gender = "neutral"
count = 8
role = "source"

[[ports]]
name = "pwm_header"
kind = "signal"
type = "pwm"
gender = "male"

