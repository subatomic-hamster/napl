id = "holybro-pm07"
name = "Holybro PM07 analog power module with PDB and PWM header (2-14S, 45x45 mount)"
category = "pcb.pm"
vendor = "Holybro"
part_number = "PM07"
url = "https://holybro.com/collections/power-modules-pdbs/products/pixhawk-4-power-module-pm07"

# Eight B+ pads for ESCs, two 6-pin GHR power ports and a PWM header for 8 motors. Battery-side gender is a convention.
[params]
mass                = { value = 0.0438, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.068, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.050, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
input_cells_max     = { value = 14, unit = "S", src = "S1", fidelity = "datasheet" }
pcb_current_cont    = { value = 90, unit = "A", src = "S1", fidelity = "datasheet" }
pcb_current_burst   = { value = 140, unit = "A", src = "S1", fidelity = "datasheet" }
current_sense_max   = { value = 120, unit = "A", src = "S1", fidelity = "datasheet" }
output_voltage      = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
output_current_max_each = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.45x45.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "45 x 45 mm per S1; hole size not stated, M3 assumed (inference)"

[[ports]]
name = "battery_in"
kind = "power"
type = "xt60"
gender = "male"
v_max = { value = 58.8, unit = "V", fidelity = "derived", derivation = "2~14S per S1: 14 cells x 4.2 V full charge = 58.8 V." }
i_max = { value = 90, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
pins = ["BAT.1", "BAT.2"]
note = "Board is 90 A continuous but the stock XT60 plug and lead are 30 A continuous / 60 A burst (S2); fit XT90 above that"

[[ports]]
name = "fc_out"
kind = "power"
type = "jst-gh.6"
gender = "female"
count = 2
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"
note = "6Pin GHR 1.25mm x2, each 5.2V/3A max"

[[ports]]
name = "bplus_pads"
kind = "power"
type = "solder-pad"
gender = "neutral"
count = 8
role = "source"

[[ports]]
name = "pwm_header"
kind = "signal"
type = "pwm"
gender = "male"

# Pin level. BAT: the XT60 named in S1; polarity and 7.2 mm spacing are the XT60 family's (pin 1 +), which Holybro does not print: estimated.
# FC1 / FC2: the two 6-pin GHR 1.25 mm analog power cables named in S1 ('GHR 1.25mm *2', two independent 5.2 V / 3 A outputs). The page prints no
# module-side table; the pins are derived from the FC side (S3, the Pixhawk 6C/6C Mini POWER1 port): 1-2 VDD5V_BRICK 5 V, 3 CURRENT, 4 VOLTAGE, 5-6 GND.
# The eight B+ pads, the PWM header and the fc_out port with count 2 are not pinned (no pad or header pin tables are published).
[[connectors]]
id = "BAT"
name = "battery XT60"
type = "xt60"
gender = "male"
pos = [-0.034, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "S1 lists an XT60 port but not its polarity or contact spacing: + then -, 7.2 mm of the XT60 family. Board position estimated."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", i_max = 30.0, note = "XT60 contact rating (S2); the PCB is rated 90 A" },
  { number = 2, name = "BAT-", kind = "ground", i_max = 30.0 },
]

[[connectors]]
id = "FC1"
name = "FC power cable 1 (6-pin GHR 1.25 mm)"
type = "jst-gh-6"
gender = "female"
pos = [0.034, -0.008, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
fidelity = "derived"
derivation = "The module-side pin table is not published as text. Derived from the Pixhawk 6C Mini POWER1 port table (S3: 1-2 VDD5V_BRICK1 5 V, 3 CURRENT1, 4 VOLTAGE1, 5-6 GND): a straight cable, so the module sources the 5 V and drives the two 3.3 V-range sense lines. The 5.2 V / 3 A limits are the S1 output ratings."
pins = [
  { number = 1, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 2, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 3, name = "CURRENT", kind = "signal", dir = "out", v = 3.3 },
  { number = 4, name = "VOLTAGE", kind = "signal", dir = "out", v = 3.3 },
  { number = 5, name = "GND", kind = "ground" },
  { number = 6, name = "GND", kind = "ground" },
]

[[connectors]]
id = "FC2"
name = "FC power cable 2 (6-pin GHR 1.25 mm)"
type = "jst-gh-6"
gender = "female"
pos = [0.034, 0.008, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
fidelity = "derived"
derivation = "As FC1: the same derived table for the second output of S1 ('5.2V/3A Max *2', 'GHR 1.25mm *2'); that the two outputs are electrically independent is not stated for the PM07 on that page."
pins = [
  { number = 1, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 2, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 3, name = "CURRENT", kind = "signal", dir = "out", v = 3.3 },
  { number = 4, name = "VOLTAGE", kind = "signal", dir = "out", v = 3.3 },
  { number = 5, name = "GND", kind = "ground" },
  { number = 6, name = "GND", kind = "ground" },
]

