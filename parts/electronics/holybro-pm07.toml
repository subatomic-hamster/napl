title = "Connector & Wire Rating (Holybro docs)"
accessed = "2026-10-07"
quote = "The XT60 plug and 12AWG wire that are pre-soldered on Holybro Power module are rated for 30A continuous current and 60A instantaneous current (<1 minute)."
