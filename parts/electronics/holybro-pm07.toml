id = "S1"
url = "https://docs.holybro.com/power-module-and-pdb/power-module-comparison.md"
title = "Power Module Comparison (Holybro docs), Analog Power Module table"
accessed = "2026-10-07"
quote = "PM07 ... Input Voltage 2~14S ... PCB Cont./Burst Current Rating 90A/140A ... Max Current Sensing 120A ... Output Voltage 5.2V/3A Max *2 ... Ports XT60 6Pin GHR 1.25mm *2 B+ Pads *8 PWM Header ... Built-in Power Distribution Yes ... PWM Header Yes ... Dimensions 68 x 50 x 10 mm ... Weight 43.8g ... Mounting Hole 45 x 45 mm"

[[sources]]
id = "S2"
