id = "pololu-vl53l5cx-carrier"
name = "Pololu VL53L5CX time-of-flight 8x8-zone distance sensor carrier (400 cm)"
category = "sensor.rangefinder"
vendor = "Pololu (ST VL53L5CX)"
part_number = "Pololu item 3417"
url = "https://www.pololu.com/product/3417"

# Frame: origin at the board centre on the component face; +z out of the sensor window (the sensor looks along +z).
[params]
length              = { value = 0.018, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.013, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.003, unit = "m", src = "S1", fidelity = "datasheet" }
mass                = { value = 0.0005, unit = "kg", src = "S1", fidelity = "datasheet" }  # without header pins
supply_voltage_min  = { value = 2.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max  = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_typ  = { value = 0.100, unit = "A", src = "S1", fidelity = "datasheet" }  # typical active ranging
supply_current_peak = { value = 0.150, unit = "A", src = "S1", fidelity = "datasheet" }
range_max           = { value = 4.0, unit = "m", src = "S1", fidelity = "datasheet" }
range_min           = { value = 0.020, unit = "m", src = "S1", fidelity = "datasheet" }
resolution          = { value = 0.001, unit = "m", src = "S1", fidelity = "datasheet" }  # depth resolution
zones_max           = { value = 64, unit = "1", src = "S1", fidelity = "datasheet" }  # 8x8 (also 4x4)
fov_diagonal        = { value = 1.1345, unit = "rad", src = "S1", fidelity = "datasheet" }  # 65 deg diagonal (45 deg horizontal/vertical)
wavelength          = { value = 940e-9, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.12.7.m2"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Two mounting holes spaced 0.5 in (12.7 mm) apart for #2 or M2 screws; their orientation on the board is not stated on the page."

[[ports]]
name = "power_in"
kind = "power"
type = "header-0.1in"
gender = "neutral"
role = "sink"
pins = ["H.VIN", "H.GND"]
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 2.5, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 0.150, unit = "A", src = "S1", fidelity = "datasheet" }  # peak current
note = "VIN through the on-board regulator."

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
pins = ["H.SDA", "H.SCL"]

# Pin level: the eight-pin 0.1 in header of S2, in the page's table order (the order along the board edge is not in the page text: estimated).
[[connectors]]
id = "H"
name = "8-pin 0.1 in header"
type = "header-1x8-2.54mm"
gender = "neutral"
pos = [0.0, -0.0065, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 8
pitch = 0.00254
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin names and functions from the S2 table; their order along the edge and the edge used are not stated: estimated."
pins = [
  { number = "VDD", name = "VDD", kind = "power", dir = "out", v = 3.3, i_max = 0.1, note = "regulated 3.3 V output, around 100 mA; may instead be a 2.5-3.6 V input with VIN disconnected" },
  { number = "VIN", name = "VIN", kind = "power", dir = "in", v_min = 3.3, v_max = 5.5 },
  { number = "GND", name = "GND", kind = "ground" },
  { number = "SDA", name = "SDA", kind = "signal", dir = "io", note = "level-shifted I2C data: HIGH is VIN" },
  { number = "SCL", name = "SCL", kind = "signal", dir = "in", note = "level-shifted I2C clock: HIGH is VIN" },
  { number = "LPn", name = "LPn", kind = "signal", dir = "in", v = 3.3, note = "active-low I2C disable, pulled up to VDD; not level-shifted, not 5 V tolerant" },
  { number = "INT", name = "INT", kind = "signal", dir = "out", v = 3.3, note = "programmable interrupt, open drain, pulled up to VDD; not level-shifted" },
  { number = "I2C_RST", name = "I2C_RST", kind = "signal", dir = "in", v = 3.3, note = "active-high I2C reset, pulled down to GND; not level-shifted, not 5 V tolerant" },
]

[[sources]]
id = "S2"
url = "https://www.pololu.com/product/3417"
title = "Pololu VL53L5CX time-of-flight multizone distance sensor carrier product page, Connections"
accessed = "2026-10-09"
quote = "Pin Description: VDD Regulated 3.3 V output. Up to around 100 mA is available to power external components. VIN This is the main 3.3 V to 5.5 V power supply connection. GND The ground (0 V) connection for your power supply. SDA Level-shifted I2C data line: HIGH is VIN, LOW is 0 V. SCL Level-shifted I2C clock line. LPn This pin is an active-low I2C disable input; the board pulls it up to VDD. INT Programmable interrupt output (VDD logic level). I2C_RST This pin is an active-high I2C reset input; the board pulls it down to GND by default."

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/3417"
title = "Pololu item 3417 product page (VL53L5CX Time-of-Flight 8×8-Zone Distance Sensor Carrier with Voltage Regulator, 400cm Max)"
accessed = "2026-10-07"
quote = "Dimensions: 0.5″ × 0.7″ × 0.1″ (13 mm × 18 mm × 3 mm) | Weight without header pins: 0.5 g (0.02 oz) | Operating voltage: 2.5 V to 5.5 V | Typical active-ranging supply current: 100 mA | Varies with configuration, target, and environment; peak current can reach 150 mA | Maximum range: 4 m (13 ft) | Resolution: 1 mm depth, 4×4 or 8×8 sensor zones | Minimum range: 20 mm (0.8 in) | Typical full field of view (FoV): 65° diagonal (45° horizontal/vertical) | The board has two mounting holes spaced 0.5″ apart that work with #2 and M2 screws (not included)."
