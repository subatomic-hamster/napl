id = "pololu-vl53l0x-carrier"
name = "Pololu VL53L0X time-of-flight distance sensor carrier with voltage regulator (200 cm)"
category = "sensor.rangefinder"
vendor = "Pololu (ST VL53L0X)"
part_number = "Pololu item 2490"
url = "https://www.pololu.com/product/2490"

# Frame: origin at the board centre on the component face; +z out of the sensor window (the sensor looks along +z).
# The page gives no field of view or sample rate for this sensor, so none is recorded.
[params]
length              = { value = 0.018, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.013, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.002, unit = "m", src = "S1", fidelity = "datasheet" }
mass                = { value = 0.0005, unit = "kg", src = "S1", fidelity = "datasheet" }  # without header pins
supply_voltage_min  = { value = 2.6, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max  = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_typ  = { value = 0.020, unit = "A", src = "S1", fidelity = "datasheet" }  # typical active ranging
supply_current_peak = { value = 0.040, unit = "A", src = "S1", fidelity = "datasheet" }
range_max           = { value = 2.0, unit = "m", src = "S1", fidelity = "datasheet" }  # effective range depends on configuration, target and environment
range_min_effective = { value = 0.03, unit = "m", src = "S1", fidelity = "datasheet" }  # the datasheet gives no minimum; Pololu's experience is about 3 cm

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.12.7.m2"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Two mounting holes spaced 0.5 in (12.7 mm) apart for #2 or M2 screws; their orientation on the board is not stated on the page."

[[ports]]
name = "power_in"
kind = "power"
type = "header-0.1in"
gender = "neutral"
role = "sink"
pins = ["H.VIN", "H.GND"]
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 2.6, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 0.040, unit = "A", src = "S1", fidelity = "datasheet" }  # peak current
note = "VIN through the on-board 2.8 V regulator; the regulator output on VDD can supply around 100 mA to external devices."

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
pins = ["H.SDA", "H.SCL"]

# Pin level: the seven-pin 0.1 in header of S2, in the page's table order (the order along the board edge is not in the page text: estimated).
[[connectors]]
id = "H"
name = "7-pin 0.1 in header"
type = "header-1x7-2.54mm"
gender = "neutral"
pos = [0.0, -0.0065, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 7
pitch = 0.00254
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin names and functions from the S2 table; their order along the edge and the edge used are not stated: estimated."
pins = [
  { number = "VDD", name = "VDD", kind = "power", dir = "out", v = 2.8, i_max = 0.1, note = "regulated 2.8 V output, around 100 mA; may instead be a 2.6-3.5 V input with VIN disconnected" },
  { number = "VIN", name = "VIN", kind = "power", dir = "in", v_min = 2.8, v_max = 5.5 },
  { number = "GND", name = "GND", kind = "ground" },
  { number = "SDA", name = "SDA", kind = "signal", dir = "io", note = "level-shifted I2C data: HIGH is VIN" },
  { number = "SCL", name = "SCL", kind = "signal", dir = "in", note = "level-shifted I2C clock: HIGH is VIN" },
  { number = "XSHUT", name = "XSHUT", kind = "signal", dir = "in", v = 2.8, note = "active-low shutdown, pulled up to VDD; not level-shifted, not 5 V tolerant" },
  { number = "GPIO1", name = "GPIO1", kind = "signal", dir = "out", v = 2.8, note = "programmable interrupt, open drain, pulled up to VDD; not level-shifted" },
]

[[sources]]
id = "S2"
url = "https://www.pololu.com/product/2490"
title = "Pololu VL53L0X time-of-flight distance sensor carrier product page, Connections"
accessed = "2026-10-09"
quote = "Pin Description: VDD Regulated 2.8 V output. Up to around 100 mA is available to power external components. VIN This is the main 2.8 V to 5.5 V power supply connection. GND The ground (0 V) connection for your power supply. SDA Level-shifted I2C data line: HIGH is VIN, LOW is 0 V. SCL Level-shifted I2C clock line. XSHUT This pin is an active-low shutdown input; the board pulls it up to VDD. GPIO1 Programmable interrupt output (VDD logic level)."

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/2490"
title = "Pololu item 2490 product page (VL53L0X Time-of-Flight Distance Sensor Carrier with Voltage Regulator, 200cm Max)"
accessed = "2026-10-07"
quote = "Dimensions: 0.5″ × 0.7″ × 0.085″ (13 mm × 18 mm × 2 mm) | Weight without header pins: 0.5 g (0.02 oz) | Operating voltage: 2.6 V to 5.5 V | Typical active-ranging supply current: 20 mA | Varies with configuration, target, and environment; peak current can reach 40 mA | Distance measuring range: up to 2 m (6.6 ft) | The datasheet does not specify a minimum range, but in our experience, the effective limit is about 3 cm. | The board has two mounting holes spaced 0.5″ apart that work with #2 and M2 screws (not included)."
