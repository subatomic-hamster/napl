id = "songle-srd-12vdc-sl-c-relay"
name = "Songle SRD-12VDC-SL-C power relay, 12 V coil, SPDT, 10 A contacts (the weapon-rail contactor of cuas-lite)"
category = "switch.relay"
vendor = "Ningbo Songle Relay (listing: LCSC C30431)"
part_number = "SRD-12VDC-SL-C"
url = "https://www.lcsc.com/product-detail/C30431.html"

# Why it exists: the arm key switch is rated only 1 A (parts/electronics/e-switch-ko106a102-keylock-spst.toml), so the key and the NC E-stop cannot carry the flywheel current (two 180 motors, 1.88 A stall each,
# plus the servo buck). They sit in series in the 12 V COIL loop of this relay (about 30 mA); the relay's normally-open contact switches the weapon rail. Open key, pressed E-stop or a broken wire de-energise the
# coil and cut the rail whatever the Pico does. Use the normally-open pair (COM / NO); NC is not wired. A flyback diode goes across the coil.
# Part frame: origin at the centre of the underside, z up. Pin positions are NOT in the pages read (only the 19.2 x 15.6 x 15.8 mm outline): the connectors sit on the underside at estimated positions.

