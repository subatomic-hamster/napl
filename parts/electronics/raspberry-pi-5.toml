id = "raspberry-pi-5"
name = "Raspberry Pi 5 (BCM2712, 4GB/8GB)"
category = "computer.sbc"
vendor = "Raspberry Pi Ltd"
part_number = "Raspberry Pi 5"
url = "https://datasheets.raspberrypi.com/rpi5/raspberry-pi-5-product-brief.pdf"

# Mass is not published in the product brief or mechanical drawing, so it is left out rather than guessed.
# Power draw is a public measurement by a third party (S3); the vendor only specifies the supply (S1).
[params]
length              = { value = 0.085, unit = "m", src = "S2", fidelity = "datasheet" }
width               = { value = 0.056, unit = "m", src = "S2", fidelity = "datasheet" }
mount_hole_diameter = { value = 0.0027, unit = "m", src = "S2", fidelity = "datasheet" }
supply_voltage      = { value = 5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_rated = { value = 5, unit = "A", src = "S1", fidelity = "datasheet" }
operating_temp_min  = { value = 273.15, unit = "K", src = "S1", fidelity = "datasheet" }
operating_temp_max  = { value = 343.15, unit = "K", src = "S1", fidelity = "datasheet" }
cpu_clock           = { value = 2.4e9, unit = "Hz", src = "S1", fidelity = "datasheet" }
power_idle_4gb      = { value = 3.3, unit = "W", src = "S3", fidelity = "measured" }
power_idle_8gb      = { value = 3.2, unit = "W", src = "S3", fidelity = "measured" }
power_stress_ng_4gb = { value = 9.8, unit = "W", src = "S3", fidelity = "measured" }
power_stress_ng_8gb = { value = 9.8, unit = "W", src = "S3", fidelity = "measured" }

[params.mount_hole_spacing_long]
value = 0.058
unit = "m"
fidelity = "derived"
derivation = "Read from the S2 drawing: 58 mm label along the 85 mm edge; across the 56 mm edge the 49 mm label equals 56 - 2 x 3.5 (holes 3.5 mm from the edges), consistent with the 3.5 label. Axis assignment (58 along 85) is from the figure layout, not from text."

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.58x49.m2.5"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Four holes of dia 2.7 mm (S2) take M2.5 screws"

[[ports]]
name = "power_in"
kind = "power"
type = "usb-c-pd"
gender = "female"
v_max = { value = 5, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 5, unit = "A", src = "S1", fidelity = "datasheet" }
role = "sink"
pins = ["PWR.A4", "PWR.A1"]   # VBUS, GND of the USB-C power connector (pin pairs of a 2-conductor wire: + then -)
note = "5V/5A DC power via USB-C, with Power Delivery support"

[[ports]]
name = "gpio_uart"
kind = "signal"
type = "uart"
gender = "male"
connector = "Raspberry Pi standard 40-pin GPIO header"
pins = ["J8.8", "J8.10", "J8.6"]   # GPIO14 (UART0 TX), GPIO15 (UART0 RX), GND

[[ports]]
name = "gpio_i2c"
kind = "signal"
type = "i2c"
gender = "male"
connector = "Raspberry Pi standard 40-pin GPIO header"
pins = ["J8.3", "J8.5", "J8.9"]   # GPIO2 (I2C1 SDA), GPIO3 (I2C1 SCL), GND

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "female"
count = 4
connector = "2 x USB 3.0 + 2 x USB 2.0 Type-A"

[[ports]]
name = "csi"
kind = "signal"
type = "csi"
gender = "female"
count = 2
note = "2 x 4-lane MIPI camera/display transceivers (S1); FPC connector pitch not stated in S1"

# ---- Connectors (pin level; parts/README.md "Connectors and pins"). Part frame: origin at the board centre on the underside, +x towards the
# USB / Ethernet end, +y towards the GPIO header edge, z up (the board_sbc visual's frame). The pose of every connector is placed on the
# published board layout (header centred between the 58 mm mounting holes, connectors on the edges as in the product photos); the
# mechanical drawing carries numeric labels only, so poses are estimates, the pin tables are not.
[[connectors]]
id = "J8"
name = "40-pin GPIO header"
type = "header-2x20-2.54mm"
gender = "male"
pos = [-0.0100, 0.0245, 0.0136]   # pin tips: 1.6 mm PCB + 8.5 mm housing + 3.5 mm pin; centred 32.5 mm from the short edge (HAT outline)
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]             # pin 1 at -x; odd pins on the inner row, even pins on the board-edge row
rows = 2
cols = 20
pitch = 0.00254
layout = "dual"
src = "S4"
fidelity = "literature"
note = "Pin names / numbers: S4 (pinout.xyz). Alternate functions a0..a8: Table 4 of the RP1 peripherals datasheet (S5); the header GPIOs are RP1 GPIO0-27. GPIO levels 3.3 V, 16 mA per pad (S6)."
