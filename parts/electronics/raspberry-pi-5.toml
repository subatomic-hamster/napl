url = "https://pinout.xyz/"
title = "Raspberry Pi GPIO Pinout (pinout.xyz), 40-pin header"
accessed = "2026-10-08"
quote = "Orientate your Pi with the GPIO on the right and the HDMI port(s) on the left. || Pin 1 3v3 Power | Pin 2 5v Power | Pin 3 GPIO 2 I2C1 SDA | Pin 4 5v Power | Pin 5 GPIO 3 I2C1 SCL | Pin 6 Ground | Pin 7 GPIO 4 GPCLK0 | Pin 8 GPIO 14 UART0 TX | Pin 9 Ground | Pin 10 GPIO 15 UART0 RX | ... | Pin 27 GPIO 0 EEPROM SDA | Pin 28 GPIO 1 EEPROM SCL | ... | Pin 40 GPIO 21 PCM DOUT (table read through a page summariser)"

[[sources]]
