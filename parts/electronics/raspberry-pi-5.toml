title = "Raspberry Pi RP1 Peripherals datasheet, 3.1 GPIO, Table 4 GPIO function"
accessed = "2026-10-08"
quote = "RP1 has 28 multi-functional General-Purpose Input/Output pins available to implement the standard Raspberry Pi 40-pin GPIO connector. ... GPIO a0 a1 a2 a3 a4 a5 a6 a7 a8 ... 14 PWM0[2] DPI_D[10] UART4_CTS I2C3_SDA UART0_TX SYS_RIO[14] PROC_RIO[14] PIO[14] SPI5_SIO[0] ... 15 PWM0[3] DPI_D[11] UART4_RTS I2C3_SCL UART0_RX SYS_RIO[15] PROC_RIO[15] PIO[15] SPI5_SCLK"

[[sources]]
id = "S6"
url = "https://www.raspberrypi.com/documentation/computers/raspberry-pi.html"
title = "Raspberry Pi documentation: Raspberry Pi hardware, GPIO and the 40-pin header, Raspberry Pi 5 connectors (read through a page summariser)"
accessed = "2026-10-08"
quote = "The GPIO headers on all boards have a 0.1in (2.54 mm) pin pitch. || A GPIO pin designated as an output pin can be set to high (3.3V) or low (0V). || Pins GPIO2 and GPIO3 have fixed pull-up resistors, but for other pins this can be configured in software. || GPIO pins 0 and 1 are present on the board (physical pins 27 and 28), but are reserved for advanced use. || each pin can individually draw up to 16mA || mini 22-pin, 0.5 mm (fine) pitch, 11.5 mm width, combined CSI (camera)/DSI (display) ports || four-pin JST-SH PWM fan connector || The Raspberry Pi 5 fan connector is a 1 mm pitch JST-SH socket containing the following four pins: Pin 1: +5V (red), Pin 2: PWM (blue), Pin 3: GND (black), Pin 4: Tach (yellow) || This can be battery powered through the J5 (BAT) connector on the board. || with a pre-fitted two-pin JST-SH plug and an adhesive mounting pad || single-lane PCIe FFC connector || UART connector || The Ethernet jack on Raspberry Pi 5 is PoE+ capable, supporting the IEEE 802.3at-2009 PoE standard."

