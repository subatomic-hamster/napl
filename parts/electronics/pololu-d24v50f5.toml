  { number = "EN", name = "EN", kind = "signal", dir = "in", note = "enable input; the page gives no threshold, left out" },
  { number = "VIN", name = "VIN", kind = "power", dir = "in", v_min = 6.0, v_max = 38.0 },
  { number = "GND1", name = "GND", kind = "ground", note = "input-side ground pad; the two GND pads are the same net" },
  { number = "GND2", name = "GND", kind = "ground", note = "output-side ground pad" },
  { number = "VOUT", name = "VOUT", kind = "power", dir = "out", v = 5.0, i_max = 5.0 },
]

