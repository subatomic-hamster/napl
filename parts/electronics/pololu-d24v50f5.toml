fidelity = "datasheet"
pose_rationale = "S1 gives the five connection points ('enable (EN), input voltage (VIN), 2x ground (GND), and output voltage (VOUT)') and the 0.1 in grid; the left-to-right order along the board edge is not in the page text: estimated."
