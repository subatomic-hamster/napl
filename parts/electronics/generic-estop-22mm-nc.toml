id = "generic-estop-22mm-nc"
name = "Red mushroom emergency-stop button, 22 mm panel hole, 1 NC contact, push-to-lock / twist-to-release (LA38 / XB2 class)"
category = "switch.estop"
vendor = "generic (listing: VXB)"
part_number = "22 mm NC latching E-stop, 600 V Ui / 10 A Ith"
url = "https://vxb.com/fr/products/red-mushroom-emergency-stop-button-switch-22mm-nc"

# Hardware E-stop of cuas-lite: the NC contact is in series with the flywheel / pusher enable path, so pressing it (or a broken wire) opens the circuit regardless of software; a second read-only tap
# of the same net goes to a Pico GPIO. The NC (normally closed, opens when pressed) contact is the one a safety function must use (a welded NO contact cannot be detected as a failure).
# The listing sells a 2-pack. Its price line is inconsistent (regular 39.99, 'sale' 80.00 USD) and Walmart marketplace listings of similar 22 mm NC latching units were 8-14 USD each in a web search, so the price below is an estimate.
# This is an unbranded part with no certification marks in the listing: for a real firing system a certified E-stop (EN ISO 13850 / positive-opening NC contact) is the right part; the project's own safety layer must not rely on this one alone.
# Part frame: origin at the centre of the panel-side flange face, +z = out of the panel towards the red head, the contact block behind the panel at -z.

[params]
mass                = { value = 0.080, unit = "kg", src = "S1", fidelity = "datasheet" }   # 'weight ~80 g per switch'
head_diameter       = { value = 0.040, unit = "m", src = "S1", fidelity = "datasheet" }   # mushroom head 40 mm
panel_hole_diameter = { value = 0.022, unit = "m", src = "S1", fidelity = "datasheet" }
panel_thickness_max = { value = 0.0085, unit = "m", src = "S1", fidelity = "datasheet" }
contact_form        = { value = "1 NC contact, latching, 2 terminals", unit = "-", src = "S1", fidelity = "datasheet" }
voltage_ui          = { value = 600.0, unit = "V", src = "S1", fidelity = "datasheet" }   # rated insulation voltage
current_ith         = { value = 10.0, unit = "A", src = "S1", fidelity = "datasheet" }   # conventional thermal current
length              = { value = 0.040, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.040, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.055, unit = "m", fidelity = "estimated", rationale = "Head height above the panel plus the contact block behind it: not in the listing (its 'dimensions' line is the shipping box); about 20 mm head + 35 mm block is typical for a 22 mm E-stop unit." }
price_usd           = { value = 11.0, unit = "USD", fidelity = "estimated", rationale = "Not a firm price: the VXB listing (S1) shows 39.99 / 80.00 USD for a 2-pack (inconsistent, 20 USD each at best) while a web search of Walmart marketplace listings of similar 22 mm NC latching E-stops showed 8-14 USD each (e.g. a twist-release unit at 10.99 USD; https://www.walmart.com/c/kp/mushroom-stop-button); 11 USD is taken." }

# Envelope (collision, wire clearance): the contact block behind the panel (a 21 mm cylinder through the 22 mm hole, 35 mm deep, estimated) and the 40 mm mushroom head 20 mm in front of the panel face (estimated;
# 'height' above is their sum).
