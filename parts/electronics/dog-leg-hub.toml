id = "dog-leg-hub"
name = "Dog leg hub (CUSTOM 2 oz PCB, 36 x 50 mm): one XT60 power input and one CAN input fan out to three XT30(2+2) drive outputs, 120 ohm CAN termination"
category = "pcb.hub"
vendor = "napl dog (own design, fabricated by a PCB house)"
part_number = "dog-leg-hub-v1"
url = "docs/dog/actuator-study.md"

# CUSTOM PART, labelled as such: no off-the-shelf board splits one 8S feed and one CAN bus to three XT30(2+2) drives with bus termination. One hub per leg sits on the abad mount's pad
# (behind the actuator cup). Power: XT60 in -> one 2 oz pour -> three XT30PW(2+2) outputs (V+ / GND) with the CAN pair (H / L) routed straight through to the same connectors.
# The CANable terminates the near end of the bus with its own switch; this hub carries the far end's 120 ohm (CAN_H to CAN_L). EVERY VALUE here is an estimate of a design not yet drawn.
# Part frame: origin at the board centre on its underside, z up, +x toward the actuator cup. Connector placement is not mirrored in the right-hand legs (the part is its own mirror).

[mirror]
symmetry = "xz"

[params]
mass            = { value = 0.030, unit = "kg", fidelity = "estimated", rationale = "36 x 50 mm 1.6 mm board with 2 oz copper (~12 g) + XT60PW male (~6.5 g) + 3 x XT30PW(2+2) (~3 g each) + JST-GH + 120 ohm: ~30 g." }
length          = { value = 0.036, unit = "m", fidelity = "estimated", rationale = "Layout not drawn; fits the 39 mm hub pad of dog-abad-mount." }
width           = { value = 0.050, unit = "m", fidelity = "estimated", rationale = "Three XT30PW(2+2) receptacles on three edges plus the XT60 and JST-GH on the fourth." }
height          = { value = 0.012, unit = "m", fidelity = "estimated", rationale = "XT60PW / XT30PW(2+2) receptacle heights above the board." }
can_termination = { value = 120.0, unit = "ohm", fidelity = "estimated", rationale = "Standard CAN bus termination (the nominal 120 ohm characteristic impedance of the twisted pair, ISO 11898); not looked up in a source here." }

[params.r_path]
value = 0.002
unit = "ohm"
fidelity = "derived"
derivation = "Per output, XT60 in to XT30 out: 2 oz copper (70 um), 8 mm pour, ~50 mm: R = 1.72e-8 ohm*m x 0.05 m / (0.008 m x 70e-6 m) = 1.5 mohm + 0.5 mohm for the solder joints (connector contact resistance is not counted: the wire parts do not model it either)."

[params.price]
value = 10.75
unit = "USD"
fidelity = "estimated"
rationale = "Board: OSH Park 2-layer 2 oz service, 5 USD per square inch for 3 copies (docs.oshpark.com/services/two-layer-hhdc, seen 2026-10-16): 36 x 50 mm = 2.79 in2 -> 13.95 USD / 3 = 4.65 USD per board. Connectors (XT60PW ~1 USD, 3 x XT30PW(2+2) ~1.5 USD each, JST-GH, resistor) ~6.1 USD are estimates, no listing fetched."

