# ---- USB: micro-USB B socket overhanging the board edge. S1 says only that VBUS is socket pin 1 and that the port is USB 1.1 with 27 ohm series resistors; the other contacts follow the micro-B standard (estimated).
[[connectors]]
id = "USB"
name = "micro-USB B socket"
type = "usb-micro-b"
port_type = "usb"
gender = "female"
pos = [-0.0275, 0.0, 0.0035]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 5
pitch = 0.0008
src = "S1"
fidelity = "estimated"
rationale = "S1: 'VBUS ... connected to micro-USB port pin 1' and 'brings this interface to a standard micro-USB port'. The contact numbering 2 D-, 3 D+, 4 ID, 5 GND is the micro-B standard (not fetched); the ID pin is not connected on Pico (not stated in S1, assumed)."
pose_rationale = "Overhangs the top edge of the board centred in the width (S1: 'a micro-USB port overhanging the top edge')."
pins = [
  { number = 1, name = "VBUS", kind = "power", dir = "io", v = 5.0, note = "5 V in from the host (S1); fed through Schottky D1 to VSYS" },
  { number = 2, name = "D-", kind = "signal", dir = "io", note = "27 ohm in series to RP2040 USB DM" },
  { number = 3, name = "D+", kind = "signal", dir = "io", note = "27 ohm in series to RP2040 USB DP" },
  { number = 4, name = "ID", kind = "nc", note = "micro-B ID, not used (assumed)" },
  { number = 5, name = "GND", kind = "ground" },
]

# ---- SWD: the 3-pin debug header on the lower edge (S1 Section 4.6 / "SWD port"). The pin order SWCLK, GND, SWDIO is the one printed on the board (not in the fetched text): estimated.
[[connectors]]
id = "SWD"
name = "3-pin SWD debug header"
type = "jst-sh-3"
gender = "male"
pos = [0.0, 0.0105, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 3
pitch = 0.001
src = "S1"
fidelity = "estimated"
rationale = "S1 says the SWD interface is brought to 'a 3 pin debug header on the lower edge of the board' with internal ~60 kohm pull-ups on SWDIO and SWCLK. The pin order (SWCLK, GND, SWDIO) is from the board silkscreen, not from the fetched datasheet text."
pose_rationale = "Lower edge, centred (positional estimate); on the unpopulated Pico it is three through-holes, on the Pico H a JST-SH socket."
pins = [
  { number = 1, name = "SWCLK", kind = "signal", dir = "in", v = 3.3 },
  { number = 2, name = "GND", kind = "ground" },
  { number = 3, name = "SWDIO", kind = "signal", dir = "io", v = 3.3 },
]

