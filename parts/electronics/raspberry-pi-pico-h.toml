quote = "The Raspberry Pi Pico is a single sided 51×21 mm 1 mm thick PCB with a micro-USB port overhanging the top edge and dual castellated/through-hole pins around the remaining edges. ... the 40 main user pins on a 2.54 mm (0.1″) pitch grid with 1 mm holes ... 4× 2.1 mm (± 0.05 mm) drilled mounting holes ... PIN40 VBUS PIN39 VSYS PIN37 3V3_EN PIN36 3V3 PIN35 ADC_VREF PIN33 AGND PIN30 RUN ... VSYS ... the allowed range 1.8 V to 5.5 V ... it is recommended to keep the load on this pin less than 300 mA ... VBUS 5 V ± 10%. ... Operating Temp Max 85°C (including self-heating) Operating Temp Min −20°C ... Dual-core cortex M0+ at up to 133 MHz ... 264 kB multi-bank high performance SRAM ... 2 MB Flash"

