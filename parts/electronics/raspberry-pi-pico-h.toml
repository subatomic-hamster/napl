id = "raspberry-pi-pico-h"
name = "Raspberry Pi Pico H (RP2040, 2 MB flash, headers soldered)"
category = "pcb.mcu"
vendor = "Raspberry Pi Ltd"
part_number = "Raspberry Pi Pico H (SC0917)"
url = "https://www.adafruit.com/product/5525"

# Pico H = Pico with the 2 x 20 male header and the 3-pin SWD header soldered. The cheaper headerless Pico ($4 and up, raspberrypi.com) is the same board. Pico W / WH are not used (no radio wanted).
# Part frame: origin at the board centre on the underside, +x along the 51 mm length from the micro-USB end (x = -25.5 mm) to the far end, +y across the 21 mm width, z up.
# Pins 1-20 run down the y = -8.89 mm edge from the USB end, pins 21-40 back up the y = +8.89 mm edge (the datasheet's pin numbering); the header rows are 0.7 in apart.
# The pinout and function table are from S1/S2; GP23-GP25 and GP29 are used on the board (SMPS mode, VBUS sense, LED, VSYS/3 ADC) and are not on the header.
# GPIO function names a1..a4 are the RP2040 function select F1..F4 (SPI, UART, I2C, PWM); every GPIO is also SIO (F5), PIO0 (F6) and PIO1 (F7), not repeated on each pin.

[params]
length          = { value = 0.051, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.021, unit = "m", src = "S1", fidelity = "datasheet" }
thickness       = { value = 0.001, unit = "m", src = "S1", fidelity = "datasheet" }   # PCB
height          = { value = 0.0126, unit = "m", fidelity = "estimated", rationale = "Not published. 1 mm PCB + a standard 2.54 mm male strip (2.5 mm plastic body + about 6 mm of pin above it, 3 mm below) gives roughly 10.5 mm above the underside; 12.6 mm is only a drawing height with the headers' pin tips, never used for kinematics." }
mass            = { value = 0.004, unit = "kg", fidelity = "estimated", rationale = "No published mass. A 51 x 21 x 1 mm FR4 board is about 2 g (density 1.85 g/cm3), plus the RP2040, flash and the micro-USB socket (about 1 g) and about 1 g for the two 20-pin headers: 4 g; reseller sheets quote 12 g but that is a packed figure." }
mount_hole_diameter = { value = 0.0021, unit = "m", src = "S1", fidelity = "datasheet" }   # 4 drilled holes, 2.1 +-0.05 mm
pin_pitch       = { value = 0.00254, unit = "m", src = "S1", fidelity = "datasheet" }
vbus            = { value = 5.0, unit = "V", src = "S1", fidelity = "datasheet" }   # 5 V +-10 %
vsys_min        = { value = 1.8, unit = "V", src = "S1", fidelity = "datasheet" }
vsys_max        = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
io_voltage      = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }   # fixed on Pico
v3v3_out_max    = { value = 0.3, unit = "A", src = "S1", fidelity = "datasheet" }   # recommended load limit on pin 36
gpio_count      = { value = 26, unit = "1", src = "S1", fidelity = "datasheet" }   # 3 of them ADC capable
cpu_clock       = { value = 133e6, unit = "Hz", src = "S1", fidelity = "datasheet" }   # dual-core Cortex-M0+ "up to 133 MHz"
flash_size      = { value = 2e6, unit = "B", src = "S1", fidelity = "datasheet" }   # on-board QSPI flash, 2 MB
sram_size       = { value = 264e3, unit = "B", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }   # -20 degC
operating_temp_max = { value = 358.15, unit = "K", src = "S1", fidelity = "datasheet" }   # 85 degC including self-heating
price_usd       = { value = 5.0, unit = "USD", src = "S3", fidelity = "datasheet" }   # Pico H, Adafruit, 2026-10-11 (the headerless Pico starts at 4 USD, S4)

# Envelope (collision, wire clearance): 51 x 21 mm board, 12.6 mm drawing height (header pin tips), underside at z = 0.
[[geometry.shapes]]
shape = "box"
size = [0.0255, 0.0105, 0.0063]
pos = [0.0, 0.0, 0.0063]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Board lying on a face. Four 2.1 mm holes (S1) exist, but their positions are only in the datasheet's Figure 3 without a table, so no bolt pattern is declared."

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "female"
pins = ["USB.1", "USB.2", "USB.3", "USB.5"]
note = "Micro-USB B socket, USB 1.1 device or host (S1)."

[[ports]]
name = "vsys_in"
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
pins = ["J.39", "J.38"]
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 1.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "VSYS (pin 39) with a ground (pin 38): the supply when USB is not used."

