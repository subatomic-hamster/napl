id = "matek-m9n-5883"
name = "Matek M9N-5883 GNSS (NEO-M9N) + QMC5883 compass (25x25 patch)"
category = "pcb.gps"
vendor = "Matek Systems"
part_number = "M9N-5883"
url = "https://www.mateksys.com/?portfolio=m9n-5883"

# The vendor page notes the compass changed from QMC5883L to QMC5883P as of January 2026.
[params]
mass                = { value = 0.0145, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.032, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.032, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
antenna_size_xy     = { value = 0.025, unit = "m", src = "S1", fidelity = "datasheet" }
antenna_thickness   = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
supply_voltage_min  = { value = 4, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max  = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current      = { value = 0.05, unit = "A", src = "S1", fidelity = "datasheet" }
default_baud        = { value = 38400, unit = "baud", src = "S1", fidelity = "datasheet" }
operating_temp_min  = { value = 253.15, unit = "K", src = "S1", fidelity = "datasheet" }
operating_temp_max  = { value = 353.15, unit = "K", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "gps_in"
pins = ["J.1", "J.6"]
kind = "power"
type = "jst-gh.6"
gender = "male"
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
note = "JST-GH-6P connector; 5 V pad/pin input 4~5.5 V; header gender assumed"

[[ports]]
name = "uart"
pins = ["J.2", "J.3"]
kind = "signal"
type = "uart"
gender = "neutral"

[[ports]]
name = "i2c"
pins = ["J.4", "J.5"]
kind = "signal"
type = "i2c"
gender = "neutral"
note = "QMC5883L/QMC5883P compass"

# Pin level (estimated): the page lists the six wires in the order 5V, RX, TX, CL, DA, G for a JST-GH-6P cable; the pin-to-position mapping is not stated, so the listed order is taken as pins 1..6.
[[connectors]]
id = "J"
name = "JST-GH-6P"
type = "jst-gh-6"
port_type = "jst-gh.6"
gender = "male"
pos = [0.0, -0.016, 0.003]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
src = "S1"
fidelity = "estimated"
rationale = "Signal names are from S1 (Wiring and settings); the page does not number the pins, so the order in which it lists the wires (5V, RX, TX, CL, DA, G) is assumed to be pin 1..6. Pitch 1.25 mm is the JST-GH family value, not stated on this page."
pose_rationale = "Header location on the board is not documented: placed on the -y edge (positional estimate)."
pins = [
  { number = 1, name = "5V", kind = "power", dir = "in", v_min = 4.0, v_max = 5.5 },
  { number = 2, name = "RX", kind = "signal", dir = "in", note = "module RX, connects to the flight controller UART TX" },
  { number = 3, name = "TX", kind = "signal", dir = "out", note = "module TX, connects to the flight controller UART RX" },
  { number = 4, name = "CL", kind = "signal", dir = "io", note = "I2C SCL for the compass" },
  { number = 5, name = "DA", kind = "signal", dir = "io", note = "I2C SDA for the compass" },
  { number = 6, name = "G", kind = "ground" },
]

[[sources]]
id = "S1"
url = "https://www.mateksys.com/?portfolio=m9n-5883"
title = "GNSS & Compass M9N-5883 (Matek Systems product page)"
accessed = "2026-10-07"
quote = "GNSS NEO-M9N (GPS, GLONASS, Galileo and BeiDou) Magnetic Compass QMC5883L/QMC5883P Patch antenna 25*25*4mm Input voltage range: 4~5.5V (5V pad/pin) Power consumption: 50mA UART baudrate: 38400 default Operating Temperatures: -20~80 °C ... JST-GH-6P connector ... 32mm*32mm*10mm 14.5g"
