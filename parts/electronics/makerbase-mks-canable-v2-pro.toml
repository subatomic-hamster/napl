quote = "STM32G431C8T6; ADM3053BRWZ transceiver on Pro V1.0 with 2.5KV rms signal and power isolation; CAN 2.0A and 2.0B up to 1 Mbps, slcan firmware supports CAN-FD (2M/5M tested); Type-C USB; termination enabled or disabled with a short-circuit cap; candleLight and slcan firmware (page-fetch summary, not verbatim)"
