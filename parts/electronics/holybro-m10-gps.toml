id = "holybro-m10-gps"
name = "Holybro M10 GPS (u-blox M10 + IST8310 compass), V1 and V2 casings"
category = "pcb.gps"
vendor = "Holybro"
part_number = "M10 GPS"
url = "https://docs.holybro.com/gps-and-rtk-system/m8n-m9n-m10-gps/standard-m10-m9n-m8n-gps/overview.md"

# Same page and casing as the M9N variant (parts holybro-m9n-gps); accuracy and update rate differ.
[params]
mass_v1              = { value = 0.032, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_v2              = { value = 0.0368, unit = "kg", src = "S1", fidelity = "datasheet" }
diameter_v1          = { value = 0.050, unit = "m", src = "S1", fidelity = "datasheet" }
height_v1            = { value = 0.0144, unit = "m", src = "S1", fidelity = "datasheet" }
diameter_v2          = { value = 0.051, unit = "m", src = "S1", fidelity = "datasheet" }
height_v2            = { value = 0.0185, unit = "m", src = "S1", fidelity = "datasheet" }
accuracy_cep         = { value = 2.0, unit = "m", src = "S1", fidelity = "datasheet" }
nav_rate_max_single_gnss = { value = 25, unit = "Hz", src = "S1", fidelity = "datasheet" }
nav_rate_max_four_gnss   = { value = 10, unit = "Hz", src = "S1", fidelity = "datasheet" }
supply_voltage_min   = { value = 4.7, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max   = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_max   = { value = 0.2, unit = "A", src = "S1", fidelity = "datasheet" }
default_baud         = { value = 115200, unit = "baud", src = "S1", fidelity = "datasheet" }
cable_length         = { value = 0.26, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "gps_in"
kind = "power"
type = "jst-gh.10"
gender = "male"
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
pins = ["GPS.1", "GPS.2", "GPS.3", "GPS.4", "GPS.5", "GPS.6", "GPS.7", "GPS.8", "GPS.9", "GPS.10"]
note = "Port Type JST-GH-10P; carries 5 V, UART and I2C (compass)"

[[ports]]
name = "uart"
kind = "signal"
type = "uart"
gender = "neutral"

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
note = "IST8310 compass"

# Pin level: S1 gives 'Port Type JST-GH-10P' (the pin table on the Holybro page is an image, not text). The pins are therefore derived the way the
# M8N's are (parts/drone/holybro-m8n-gps.toml): a straight cable to the Pixhawk GPS1 header, TX / RX mirrored. The page notes the pinout is the same for M9N and M10.
[[connectors]]
id = "GPS"
name = "GPS cable plug (JST-GH 10)"
type = "jst-gh-10"
gender = "female"
pos = [-0.025, 0.0, 0.0072]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 10
pitch = 0.00125
fidelity = "derived"
derivation = "S1 names the 10-pin JST-GH port; the pin table is an image. Derived as a straight cable to the Pixhawk 6C GPS1 header (1 VCC +5V, 2 TX1, 3 RX1, 4 SCL1, 5 SDA1, 6 SAFETY_SWITCH, 7 SAFETY_SWITCH_LED, 8 IO_VDD_3V3, 9 BUZZER-, 10 GND, Holybro Pixhawk 6C ports page): the module's pin names are the FC's with TX / RX mirrored. V2 has no safety switch or buzzer, so pins 6-9 are unused there. Unverified against the image."
pins = [
  { number = 1, name = "VCC", kind = "power", dir = "in", v = 5.0, v_min = 4.7, v_max = 5.2 },
  { number = 2, name = "RX", kind = "signal", dir = "in", v = 3.3, alt = ["UART RX"] },
  { number = 3, name = "TX", kind = "signal", dir = "out", v = 3.3, alt = ["UART TX"] },
  { number = 4, name = "SCL", kind = "signal", dir = "io", v = 3.3, alt = ["I2C SCL"] },
  { number = 5, name = "SDA", kind = "signal", dir = "io", v = 3.3, alt = ["I2C SDA"] },
  { number = 6, name = "SAFETY_SWITCH", kind = "signal", dir = "out", v = 3.3 },
  { number = 7, name = "SAFETY_SWITCH_LED", kind = "signal", dir = "in", v = 3.3 },
  { number = 8, name = "IO_VDD_3V3", kind = "power", dir = "in", v = 3.3 },
  { number = 9, name = "BUZZER-", kind = "signal", dir = "in", v = 5.0 },
  { number = 10, name = "GND", kind = "ground" },
]

[[sources]]
id = "S1"
url = "https://docs.holybro.com/gps-and-rtk-system/m8n-m9n-m10-gps/standard-m10-m9n-m8n-gps/overview.md"
title = "Standard M10/M9N/M8N GPS Overview (Holybro docs), specification table, M10 column"
accessed = "2026-10-07"
quote = "Holybro M10 GPS | Ublox M10 ... Accuracy 2.0m CEP ... Nav. Update Rate Up to 25 Hz (single GNSS), Up to 10 Hz (4 concurrent GNSS) ... Default Baud Rate 115200 ... Input Voltage 4.7-5.2V ... Port Type JST-GH-10P ... Power consumption Less than 200mA @ 5V ... Dimension (V1) φ50 x14.4 mm ... Dimension (V2) φ51 x18.5 mm ... Weight (V1) 32g ... Weight (V2) 36.8g ... Cable Length 26cm"
