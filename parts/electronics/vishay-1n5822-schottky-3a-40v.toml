id = "vishay-1n5822-schottky-3a-40v"
name = "Vishay 1N5822 Schottky rectifier, 40 V, 3 A, DO-201AD (flyback diode across a flywheel motor)"
category = "semiconductor.diode"
vendor = "Vishay General Semiconductor"
part_number = "1N5822-E3/54"
url = "https://www.vishay.com/docs/88526/1n5820.pdf"

# Flyback (freewheel) diode spec for the brushed flywheel motors: fit one across each motor, cathode (banded end) to the motor's positive lead, anode to the MOSFET drain / motor negative lead.
# Choice: reverse voltage >= 2 x the highest supply (40 V vs 16.8 V of a charged 4S pack), average forward current >= the motor's 1.88 A stall current (3 A; the smaller 1N5819 is 1 A), fast Schottky recovery.
# Part frame: origin at the body centre, axis along z; leads leave at +-z; the cathode (band) end at +z.

