id = "pololu-lps25hb-carrier"
name = "Pololu LPS25HB pressure/altitude sensor carrier with voltage regulator"
category = "sensor.baro"
vendor = "Pololu (ST LPS25HB)"
part_number = "Pololu item 2867"
url = "https://www.pololu.com/product/2867"

# Frame: origin at the board centre on the component face; +z out of the component face.
# Only the sensitivity range and supply are on the page; noise and ODR need the ST datasheet, which was not read.
[params]
length              = { value = 0.020, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.010, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.003, unit = "m", src = "S1", fidelity = "datasheet" }
mass                = { value = 0.0005, unit = "kg", src = "S1", fidelity = "datasheet" }  # without header pins
supply_voltage_min  = { value = 2.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max  = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current      = { value = 0.002, unit = "A", src = "S1", fidelity = "datasheet" }
pressure_min        = { value = 26000, unit = "Pa", src = "S1", fidelity = "datasheet" }  # 260 mbar
pressure_max        = { value = 126000, unit = "Pa", src = "S1", fidelity = "datasheet" }  # 1260 mbar
pressure_resolution = { value = 2.44, unit = "Pa", src = "S1", fidelity = "derived", derivation = "24-bit pressure reading with 4096 LSb/mbar: 100 Pa / 4096 = 2.44 Pa per LSb (output scaling, not noise)." }

[[ports]]
name = "base"
kind = "mech"
type = "board.20x10-header"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "One mounting hole for #2 or M2 screws exists but its position is not stated on the page; opaque board-outline tag."

[[ports]]
name = "power_in"
kind = "power"
type = "header-0.1in"
gender = "neutral"
role = "sink"
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 2.5, unit = "V", src = "S1", fidelity = "datasheet" }
note = "VIN; supply current 2 mA."

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
note = "The page says the output format is I2C/SPI; I2C is the default mode."

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/2867"
title = "Pololu item 2867 product page (LPS25HB Pressure/Altitude Sensor Carrier with Voltage Regulator), Specifications"
accessed = "2026-10-07"
quote = "Dimensions: 0.4″ × 0.8″ × 0.1″ (10 mm × 20 mm × 3 mm) | Weight without header pins: 0.5 g (0.02 oz) | Operating voltage: 2.5 V to 5.5 V | Supply current: 2 mA | Output format (I²C/SPI): 24-bit pressure reading (4096 LSb/mbar) | Sensitivity range: 260 mbar to 1260 mbar (26 kPa to 126 kPa) | The board has one mounting hole that works with #2 and M2 screws (not included)."
