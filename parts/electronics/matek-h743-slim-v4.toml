quote = "MCU: STM32H743VIH6, 480MHz , 1MB RAM, 2MB Flash IMU: Dual ICM42688P Baro: DPS368 ... 7x Uarts (1,2,3,4,6,7,8) with built-in inversion. 13x PWM outputs(including “LED” pad) 2x I2C 1x CAN ... USB Type-C(USB2.0) 1x JST-SH1.0_8pin connector (Vbat/G/Curr/Rx8/S1/S2/S3/S4) 1x JST-GH1.25_4pin connector (5V/CAN-H/CAN-L/G) ... Vbat Input: 6~36V (2~8S LiPo) with TVS protection BEC: 5V 2.5A cont. (Max.3A) LDO 3.3V: Max.200mA ... Static power: 200mA@5V with Betaflight, 150mA@5V with ArduPilot ... Mounting: 30.5 x 30.5mm, Φ4mm with Grommets Φ3mm Dimensions: 36 x 36 x 5 mm Weight: 7g"
