id = "pololu-d24v22f5"
name = "Pololu 5 V, 2.5 A step-down regulator D24V22F5"
category = "pcb.bec"
vendor = "Pololu"
part_number = "D24V22F5 (item 2858)"
url = "https://www.pololu.com/product/2858"

# Pololu publishes efficiency, dropout and max-current as graphs only (images, no table), so only the headline
# range is recorded. Mass is not stated on the fetched page.
[params]
length              = { value = 0.0178, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.0178, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.008, unit = "m", src = "S1", fidelity = "datasheet" }
input_voltage_min   = { value = 5.3, unit = "V", src = "S1", fidelity = "datasheet" }
input_voltage_max   = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
output_voltage      = { value = 5, unit = "V", src = "S1", fidelity = "datasheet" }
output_current_typ_max = { value = 2.5, unit = "A", src = "S1", fidelity = "datasheet" }
efficiency_min      = { value = 0.85, unit = "1", src = "S1", fidelity = "datasheet" }
efficiency_max      = { value = 0.95, unit = "1", src = "S1", fidelity = "datasheet" }
quiescent_current   = { value = 0.001, unit = "A", src = "S1", fidelity = "datasheet" }
switching_frequency = { value = 400e3, unit = "Hz", src = "S1", fidelity = "datasheet" }
mount_hole_diameter = { value = 0.00218, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.13.21x13.21.m2"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Two holes at opposite corners (a 2-hole diagonal pair), 13.21 mm apart in both directions"

[[ports]]
name = "vin"
kind = "power"
type = "solder-pad"
gender = "neutral"
v_max = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
pins = ["IO.VIN", "IO.GND"]

[[ports]]
name = "vout"
kind = "power"
type = "solder-pad"
gender = "neutral"
v_max = { value = 5, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 2.5, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"
pins = ["IO.VOUT", "IO.GND2"]
note = "2.5 A is the typical maximum at 24 V in; thermally limited, see Pololu graph"

# Pin level: S2 lists five main connection points (PG, EN, VIN, GND, VOUT) plus a second GND pad off the main row; the order along the board edge and the position of the
# second ground are not in the page text, so they are estimated.
[[connectors]]
id = "IO"
name = "5 solder pads on a 0.1 in grid plus a second ground"
type = "pad-1x6-2.54mm"
gender = "neutral"
pos = [0.0, -0.0089, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.00254
src = "S2"
fidelity = "datasheet"
pose_rationale = "S2 gives the five main connections and the second ground; the order along the board edge and the second pad's place are not in the page text: estimated."
pins = [
  { number = "PG", name = "PG", kind = "signal", dir = "out", note = "open-drain power-good, goes low when VOUT is below about 85 % of nominal, high-impedance above about 90 %; needs an external pull-up" },
  { number = "EN", name = "EN", kind = "signal", dir = "in", note = "enable input; the page text gives no threshold here, left out" },
  { number = "VIN", name = "VIN", kind = "power", dir = "in", v_max = 36.0 },
  { number = "GND", name = "GND", kind = "ground", note = "main-row ground pad" },
  { number = "VOUT", name = "VOUT", kind = "power", dir = "out", v = 5.0, i_max = 2.5 },
  { number = "GND2", name = "GND", kind = "ground", note = "second ground pad off the main row, the same net" },
]

[[sources]]
id = "S2"
url = "https://www.pololu.com/product/2858"
title = "Pololu D24V22Fx step-down regulator product page, Connections"
accessed = "2026-10-09"
quote = "These buck regulators have five main connection points for five different electrical nodes: power good (PG), enable (EN), input voltage (VIN), ground (GND), and output voltage (VOUT). The board also features a second ground connection point off the main row of connections that might be convenient for applications where you are soldering wires directly to the board"

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/2858"
title = "Pololu 5V, 2.5A Step-Down Voltage Regulator D24V22F5 (Pololu product page)"
accessed = "2026-10-07"
quote = "Output voltage 5 V Typical max output current 2.5 A Input voltage range 5.3 V – 36 V ... Typical efficiency of 85% to 95%, depending on input voltage, output voltage, and load (see the efficiency graph below) Switching frequency: ~400 kHz ... 1 mA typical no-load quiescent current ... Compact size: 0.7″ × 0.7″ × 0.31″ (17.8 mm × 17.8 mm × 8 mm) Two 0.086″ mounting holes for #2 or M2 screws ... two 0.086″ (2.18 mm) diameter mounting holes ... separated by 0.52″ (13.21 mm) both horizontally and vertically"
