# The cheap 5 V rail of cuas-lite (Pico, servo, hall sensor, stepper-driver logic): 12-17 V in (3S 12.6 V ... charged 4S 16.8 V or the 12 V brick), 5 V out set with the trimmer. The Jetson Orin Nano dev kit
# needs NO converter: its barrel jack takes 9-20 V directly (parts/electronics/nvidia-jetson-orin-nano-devkit-8gb.toml). Spare module / dearer alternative: pololu-d24v10f5 (1 A, 12.95 USD) or pololu-d24v22f5 (2.5 A, 18.95 USD).
# Calibration: the output is set by a multi-turn trimmer; set 5.0 V with a multimeter BEFORE connecting the Pico or the Jetson-side loads (units ship at an arbitrary setting).
# Seller figures vary between listings of this module (input 3-40 V here; 4-35 V and 4.5-40 V in others, seen in a web search): the limits recorded are this listing's, and a 12-17 V input is inside every variant.
# Part frame: origin at the board centre on the underside, +x along the 43.2 mm length, +y along the 21 mm width, z up. Input pads at -x, output pads at +x (positional estimate).

