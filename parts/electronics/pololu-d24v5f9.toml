[[sources]]
id = "S2"
url = "https://www.pololu.com/product/2845"
title = "Pololu D24V5Fx step-down regulator product page, Connections"
accessed = "2026-10-09"
quote = "The buck regulator has four connections: shutdown ( SHDN ), input voltage (VIN), ground (GND), and output voltage (VOUT). The SHDN pin can be driven low (under 0.4 V) to turn off the output and put the board into a low-power state. There is a 100 kohm pull-up resistor between the SHDN pin and VIN"

