id = "bosch-bmi270"
name = "Bosch Sensortec BMI270 6-axis IMU (Kakute H7 v2 / many FPV FCs)"
category = "sensor.imu"
vendor = "Bosch Sensortec"
part_number = "BMI270"
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmi270-ds000.pdf"

# Conversions from datasheet units: 1 deg/s = 0.0174533 rad/s; 1 mg = 9.80665e-3 m/s2; 1 uA = 1e-6 A.
[params]
supply_voltage_min   = { value = 1.71, unit = "V", src = "S1", fidelity = "datasheet" }
