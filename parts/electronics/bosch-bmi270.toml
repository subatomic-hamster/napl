supply_current_normal_mode = { value = 685e-6, unit = "A", src = "S1", fidelity = "datasheet" }
gyro_noise_density   = { value = 1.2217e-4, unit = "rad/s/sqrt(Hz)", src = "S1", fidelity = "datasheet" }
gyro_zro_initial     = { value = 8.727e-3, unit = "rad/s", src = "S1", fidelity = "datasheet" }
gyro_sensitivity_at_2000dps = { value = 16.384, unit = "LSB/(deg/s)", src = "S1", fidelity = "datasheet" }
gyro_odr_max         = { value = 6400, unit = "Hz", src = "S1", fidelity = "datasheet" }
gyro_odr_min         = { value = 25, unit = "Hz", src = "S1", fidelity = "datasheet" }
accel_noise_density  = { value = 1.5691e-3, unit = "m/s2/sqrt(Hz)", src = "S1", fidelity = "datasheet" }
