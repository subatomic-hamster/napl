quote = "compact standard size LGA mold package, 14 pins, footprint 2.5x3.0mm², height 0.83mm ... Output data rates (ODR): 25 Hz … 6.4 kHz (gyroscope) and 0.78 Hz … 1.6 kHz (accelerometer) ... Wide power supply range: Analog VDD 1.71V … 3.6V and independent VDDIO 1.2V…3.6V ... typ. 685 µA ... Sensitivity S2g gFS2g, TA=25°C 16384 ... Output Noise nA,nd ... 0.16 mg/√Hz ... Sensitivity RFS2000 Ta=25°C 16.384 ... Zero-rate Offset TA=25°C, nominal VDD ±0.5 dps ... Output Noise nG,nd Performance mode 0.007 dps /√Hz"
