id = "pololu-d24v22f12"
name = "Pololu 12 V, 2.2 A step-down regulator D24V22F12"
category = "pcb.bec"
vendor = "Pololu"
part_number = "D24V22F12 (item 2855)"
url = "https://www.pololu.com/product/2855"

# Efficiency, dropout and max current versus load are published as graphs only (images), so only the headline numbers are recorded.
# The current is the title/Features figure: 'Maximum output current' for the D24V10/D24V5 families, 'typical maximum continuous' for the rest.
[params]
price = { value = 27.95, unit = "USD", src = "SP", fidelity = "datasheet" }  # Pololu list price for 1 unit seen 2026-10-16 (US, USD)
length = { value = 0.0178, unit = "m", src = "S1", fidelity = "datasheet" }
width = { value = 0.0178, unit = "m", src = "S1", fidelity = "datasheet" }
height = { value = 0.008, unit = "m", src = "S1", fidelity = "datasheet" }
input_voltage_max = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
output_voltage = { value = 12, unit = "V", src = "S1", fidelity = "datasheet" }
output_current_typ_max = { value = 2.2, unit = "A", src = "S1", fidelity = "datasheet" }
efficiency_min = { value = 0.85, unit = "1", src = "S1", fidelity = "datasheet" }
efficiency_max = { value = 0.95, unit = "1", src = "S1", fidelity = "datasheet" }
quiescent_current = { value = 0.001, unit = "A", src = "S1", fidelity = "datasheet" }
switching_frequency = { value = 400000, unit = "Hz", src = "S1", fidelity = "datasheet" }
mount_hole_diameter = { value = 0.00218, unit = "m", src = "S1", fidelity = "datasheet" }
mass = { value = 0.0023, unit = "kg", src = "SW", fidelity = "datasheet" }  # "Weight: 2.3 g" without the included optional headers

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.13.21x13.21.m2"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Two holes at opposite corners (2-hole diagonal pair), 13.21 mm apart horizontally and vertically"

[[ports]]
name = "vin"
kind = "power"
type = "solder-pad"
gender = "neutral"
v_max = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
pins = ["IO.VIN", "IO.GND"]

[[ports]]
name = "vout"
kind = "power"
type = "solder-pad"
gender = "neutral"
v_max = { value = 12, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 2.2, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"
pins = ["IO.VOUT", "IO.GND2"]
note = "Thermally limited; see the Pololu efficiency / maximum-current graphs"

# Pin level: S2 lists five main connection points (PG, EN, VIN, GND, VOUT) plus a second GND pad off the main row; the order along the board edge and the position of the
# second ground are not in the page text, so they are estimated.
[[connectors]]
id = "IO"
name = "5 solder pads on a 0.1 in grid plus a second ground"
type = "pad-1x6-2.54mm"
gender = "neutral"
pos = [0.0, -0.0089, 0.0016]  # on the board's top face: 1.6 mm (standard PCB thickness, an estimate) above the mounting plane, so a lead out of the pad does not graze the deck
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.00254
joinable = true  # solder pads: two wires can be soldered to one pad (VOUT feeds the load and the e-stop loop)
src = "S2"
fidelity = "datasheet"
pose_rationale = "S2 gives the five main connections and the second ground; the order along the board edge and the second pad's place are not in the page text: estimated."
pins = [
  { number = "PG", name = "PG", kind = "signal", dir = "out", note = "open-drain power-good, goes low when VOUT is below about 85 % of nominal, high-impedance above about 90 %; needs an external pull-up" },
  { number = "EN", name = "EN", kind = "signal", dir = "in", note = "enable input; the page text gives no threshold here, left out" },
  { number = "VIN", name = "VIN", kind = "power", dir = "in", v_max = 36.0 },
  { number = "GND", name = "GND", kind = "ground", note = "main-row ground pad" },
  { number = "VOUT", name = "VOUT", kind = "power", dir = "out", v = 12.0, i_max = 2.2 },
  { number = "GND2", name = "GND", kind = "ground", note = "second ground pad off the main row, the same net" },
]

