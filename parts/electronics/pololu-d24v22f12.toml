quote = "These buck regulators have five main connection points for five different electrical nodes: power good (PG), enable (EN), input voltage (VIN), ground (GND), and output voltage (VOUT). The board also features a second ground connection point off the main row of connections that might be convenient for applications where you are soldering wires directly to the board"

