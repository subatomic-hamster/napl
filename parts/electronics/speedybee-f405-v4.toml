id = "speedybee-f405-v4"
name = "SpeedyBee F405 V4 30x30 flight controller"
category = "pcb.fc"
vendor = "SpeedyBee"
part_number = "F405 V4 30x30 FC"
url = "https://www.speedybee.com/speedybee-f405-v4-bls-55a-30x30-fc-esc-stack/"

# IMU: ICM42688P; barometer is built in (chip not named on the page). The stack page also lists the BLS 55A ESC,
# which is a separate part and not recorded here.
[params]
mass            = { value = 0.0105, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.0416, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.0394, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.0078, unit = "m", src = "S1", fidelity = "datasheet" }
mount_hole_diameter = { value = 0.004, unit = "m", src = "S1", fidelity = "datasheet" }
vbat_min_cells  = { value = 3, unit = "S", src = "S1", fidelity = "datasheet" }
vbat_max_cells  = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
out_5v_total_current = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
out_9v_total_current = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
out_3v3_current_max  = { value = 0.5, unit = "A", src = "S1", fidelity = "datasheet" }
out_4v5_current_max  = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }
uart_count      = { value = 6, unit = "1", src = "S1", fidelity = "datasheet" }
esc_signal_outputs = { value = 8, unit = "1", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "30.5 x 30.5 mm with 4 mm hole diameter (S1); M3 screws through grommets assumed as for other 30.5 mm FCs"

[[ports]]
name = "stack_top"
kind = "mech"
type = "bolt-pattern.30.5x30.5.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0078]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "Seat on the board top face (height 0.0078 m, S1) for whatever sits above the FC in the stack (top plate on standoffs). Standoff gap and mass are not modelled."

[[ports]]
name = "vbat_in"
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
note = "3S-6S LiPo through G and BAT pins/pads of the 8-pin connector or 8 pads on the bottom (S1)"

[[ports]]
name = "esc_out"
kind = "signal"
type = "dshot"
gender = "neutral"
count = 8

[[ports]]
name = "serial"
kind = "signal"
type = "uart"
gender = "neutral"
count = 6

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
note = "SDA and SCL pads on front side"

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "neutral"
connector = "Type-C"

[visual]                            # cosmetic only (parts/README.md "Visual layer"); the part has no [geometry], so the board sits on the base port plane (z = 0)
src = "V1"
note = "Black 30.5 mm stack FC board with gold edge pads, USB-C and JST sockets (product render)."

[[visual.elements]]
gen = "board_fc"
colors = { pcb = "soldermask-black" }

