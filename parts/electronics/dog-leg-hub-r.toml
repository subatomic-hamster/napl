id = "dog-leg-hub-r"
name = "Dog leg hub, right-hand twin of dog-leg-hub (CUSTOM 2 oz PCB, 36 x 50 mm): one XT60 power input and one CAN input fan out to three XT30(2+2) drive outputs, 120 ohm CAN termination"
category = "pcb.hub"
vendor = "napl dog (own design, fabricated by a PCB house)"
part_number = "dog-leg-hub-v1 (right)"
url = "docs/dog/actuator-study.md"

# CUSTOM PART, labelled as such. The reflection of dog-leg-hub in its XZ plane: the same board, with the hip and knee outputs on the -y edge, so that the mirrored (right-hand) legs get
# them on the side of the drives. (The left-hand board is not its own mirror: its outputs are on the +y edge, and a right leg that reused it had its leads leave the wrong way and
# cross the board and the deck.) Every value is that of dog-leg-hub.

[mirror]
opposite = "dog-leg-hub"

[params]
mass            = { value = 0.030, unit = "kg", fidelity = "estimated", rationale = "As dog-leg-hub (the same board)." }
length          = { value = 0.036, unit = "m", fidelity = "estimated", rationale = "As dog-leg-hub." }
width           = { value = 0.050, unit = "m", fidelity = "estimated", rationale = "As dog-leg-hub." }
height          = { value = 0.012, unit = "m", fidelity = "estimated", rationale = "As dog-leg-hub." }
can_termination = { value = 120.0, unit = "ohm", fidelity = "estimated", rationale = "As dog-leg-hub (ISO 11898 nominal)." }

[params.r_path]
value = 0.002
unit = "ohm"
fidelity = "derived"
derivation = "As dog-leg-hub: 2 oz copper (70 um), 8 mm pour, ~50 mm: R = 1.72e-8 ohm*m x 0.05 m / (0.008 m x 70e-6 m) = 1.5 mohm + 0.5 mohm for the solder joints."

[params.price]
value = 10.75
unit = "USD"
fidelity = "estimated"
rationale = "As dog-leg-hub: board 4.65 USD (OSH Park 2 oz, 36 x 50 mm, 3 copies) + ~6.1 USD of connectors (estimates)."

