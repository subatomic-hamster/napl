id = "vectornav-vn-100-rugged"
name = "VectorNav VN-100 Rugged IMU/AHRS (3-axis gyro, accelerometer, magnetometer; serial TTL / RS-232)"
category = "sensor.imu"
vendor = "VectorNav"
part_number = "VN-100 Rugged"
url = "https://www.vectornav.com/products/detail/vn-100"

# The deck motion sensor ("MRU") of the vessel. A true marine MRU also outputs heave; the VN-100 is an AHRS (attitude and rates), so in this design heave and the deck
# position come from the RTK base antenna (a 8 Hz RTK fix with 1 cm vertical accuracy, parts/electronics/sparkfun-gps-rtk-sma-16481.toml) and the deck-datalink model
# (napl.cuas.relnav.DeckLink) combines both. S1 gives: "Pitch/Roll accuracy (static) 0.5 deg RMS | (dynamic) 1.0 deg RMS | Heading accuracy (magnetic) 2.0 deg RMS | 400 Hz attitude
# data | Up to 800 Hz IMU Data | Gyro in-run bias stability < 10 deg/hr | Supply voltage Rugged 4.5 to 5.5 V | Current draw Rugged 40 mA @ 5 V | Weight Rugged 15 g | Dimensions Rugged
# 36 x 33 x 9 mm | Digital interface Rugged Serial TTL, RS-232 | Connector Rugged 10-pin Harwin".
# Part frame: origin at the centre of the underside, x along the length, z up.
[params]
mass            = { value = 0.015, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.036, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.033, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.009, unit = "m", src = "S1", fidelity = "datasheet" }
supply_voltage_min = { value = 4.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current  = { value = 0.040, unit = "A", src = "S1", fidelity = "datasheet" }
attitude_rate_hz = { value = 400.0, unit = "Hz", src = "S1", fidelity = "datasheet" }
imu_rate_hz     = { value = 800.0, unit = "Hz", src = "S1", fidelity = "datasheet" }
roll_pitch_static_deg  = { value = 0.5, unit = "deg", src = "S1", fidelity = "datasheet" }
roll_pitch_dynamic_deg = { value = 1.0, unit = "deg", src = "S1", fidelity = "datasheet" }
heading_deg     = { value = 2.0, unit = "deg", src = "S1", fidelity = "datasheet" }
gyro_bias_stability_dph = { value = 10.0, unit = "deg/hr", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 921600, unit = "baud", src = "S1", fidelity = "datasheet" }
gyro_fs_max     = { value = 34.907, unit = "rad/s", src = "S1", fidelity = "datasheet" }   # gyro range +-2000 deg/s (S1)
gyro_noise_density = { value = 6.1e-5, unit = "rad/s/sqrt(Hz)", fidelity = "estimated", rationale = "Not on the product page. The VN-100 datasheet's gyro noise density, recalled as 0.0035 deg/s/sqrt(Hz) = 6.1e-5 rad/s/sqrt(Hz); not re-fetched." }
gyro_adc_bits   = { value = 16, unit = "bit", fidelity = "estimated", rationale = "Not on the product page; a 16-bit digital output is typical of the MEMS class." }
accel_fs_max    = { value = 156.906, unit = "m/s2", fidelity = "estimated", rationale = "Not on the product page; +-16 g, typical of this class (VN-100 datasheet range recalled)." }
accel_noise_density = { value = 1.37e-3, unit = "m/s2/sqrt(Hz)", fidelity = "estimated", rationale = "Not on the product page. Accelerometer noise density recalled as 0.14 mg/sqrt(Hz) = 1.37e-3 m/s2/sqrt(Hz) from the VN-100 datasheet; not re-fetched." }
accel_adc_bits  = { value = 16, unit = "bit", fidelity = "estimated", rationale = "As gyro_adc_bits." }

