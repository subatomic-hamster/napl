size = [0.018, 0.0165, 0.0045]
pos = [0.0, 0.0, 0.0045]
mass_param = "mass"

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
