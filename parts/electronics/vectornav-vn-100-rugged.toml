note = "TTL serial (3.3 V logic): TX (pin 8), RX (pin 9), ground."

# Pin level. S1 lists the connector ("10-pin Harwin") and the interfaces (Serial TTL, RS-232) but NOT the pin table. The pin assignments below are those of the sibling VN-200 Rugged
# drawing (same 10-pin Harwin connector, VectorNav's rugged housing family) as reported by a web search over it (navtechgps.com VN200_Rugged_Dimensions-Pinout.pdf, HTTP 403 on
# fetch, so NOT checked against the VN-100 manual): pin 1 power (5 V nominal), pins 2 and 3 RS-232 serial output and input, pin 4 sync out, pin 5 ground, pin 6 tare / restore (held
# high at power-on restores factory settings), pin 7 sync in, pins 8 and 9 TTL serial output and input at 3.3 V logic, pin 10 not connected. The order of pins 2 / 3 (and 8 / 9) is TX then RX.
[[connectors]]
id = "J1"
name = "10-pin Harwin connector"
type = "harwin-10"
gender = "male"
pos = [0.018, 0.0, 0.0045]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 10
pitch = 0.0015
fidelity = "estimated"
rationale = "Pin function list taken from the VN-200 Rugged drawing (same connector family) via a search summary; unverified for the VN-100 Rugged. Pin pitch and pose are drawing choices."
pins = [
  { number = 1, name = "VCC", kind = "power", dir = "in", v = 5.0, v_min = 4.5, v_max = 5.5 },
  { number = 2, name = "RS232_TX", kind = "signal", dir = "out", v = 5.0, note = "RS-232 levels" },
  { number = 3, name = "RS232_RX", kind = "signal", dir = "in", v = 5.0, note = "RS-232 levels" },
  { number = 4, name = "SYNC_OUT", kind = "signal", dir = "out", v = 3.3 },
  { number = 5, name = "GND", kind = "ground" },
  { number = 6, name = "TARE", kind = "signal", dir = "in", v = 3.3 },
  { number = 7, name = "SYNC_IN", kind = "signal", dir = "in", v = 3.3 },
  { number = 8, name = "TTL_TX", kind = "signal", dir = "out", v = 3.3 },
  { number = 9, name = "TTL_RX", kind = "signal", dir = "in", v = 3.3 },
  { number = 10, name = "NC", kind = "nc" },
]

