id = "S1"
url = "https://www.realsenseai.com/wp-content/uploads/2026/03/RealSense-D400-Series-Datasheet-Mar-2026.pdf"
title = "Intel RealSense D400 Series Product Family Datasheet, 337029-017 (March 2026)"
accessed = "2026-10-08"
