id = "intel-realsense-d435i"
name = "Intel RealSense Depth Camera D435i (active stereo depth + IMU, USB-C)"
category = "sensor.depth_camera"
vendor = "Intel / RealSense"
part_number = "D435i"
url = "https://www.realsenseai.com/products/real-sense-depth-camera-d435i/"

# Intel RealSense D400 series datasheet, document 337029-017 (March 2026 revision); the D435i uses the D430 stereo module (S1 Table 3-11) and the D43x camera body (S1 Table 3-52).
# Part frame: origin at the centre of the rear face, +z out of the front (the direction the depth camera looks), +x image up, y left.
# The rangefinder device reads these: fov_h/fov_v, n_h/n_v, min_range, max_range, sigma (see napl docs/models.md).
[params]
mass            = { value = 0.075, unit = "kg", src = "S1", fidelity = "datasheet" }
width           = { value = 0.090, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.025, unit = "m", src = "S1", fidelity = "datasheet" }
depth           = { value = 0.025, unit = "m", src = "S1", fidelity = "datasheet" }
baseline        = { value = 0.050, unit = "m", src = "S1", fidelity = "datasheet" }
fov_h           = { value = 1.5184, unit = "rad", src = "S1", fidelity = "datasheet" }
fov_v           = { value = 1.0123, unit = "rad", src = "S1", fidelity = "datasheet" }
depth_width_px  = { value = 1280, unit = "px", src = "S1", fidelity = "datasheet" }
depth_height_px = { value = 720, unit = "px", src = "S1", fidelity = "datasheet" }
min_range       = { value = 0.28, unit = "m", src = "S1", fidelity = "datasheet" }
z_accuracy_frac = { value = 0.02, unit = "1", src = "S1", fidelity = "datasheet" }
rms_error_frac  = { value = 0.02, unit = "1", src = "S1", fidelity = "datasheet" }
spec_range      = { value = 2.0, unit = "m", src = "S1", fidelity = "datasheet" }
max_range       = { value = 10.0, unit = "m", fidelity = "estimated", rationale = "The datasheet qualifies accuracy only out to 2 m; beyond it the stereo error grows with Z^2 / (f B). 10 m is the usable-range cut-off used by the simulator (not a datasheet figure); rays that miss within it read 0 (invalid)." }

# The 90 mm width runs along part y (image right-left); +x is image up, so the 25 mm height is along x. (Until 2026-10-08 this box had its long side
# along x, a vertical bar on a level-mounted camera; no assembly depended on it: the depth bench only uses the sensor frame.)
[[geometry.shapes]]
shape = "box"
size = [0.0125, 0.045, 0.0125]
pos = [0.0, 0.0, 0.0125]

[[ports]]
name = "mount"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Rear face seat; the real camera has a 1/4-20 tripod socket and two M3 holes on the back (not stated in the extracted datasheet text), so the exact pattern is not modelled."

[[ports]]
name = "optical"
kind = "mech"
type = "optical-axis"
gender = "neutral"
pos = [0.0, 0.0, 0.025]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Frame of the rangefinder device: origin on the front face (the datasheet's depth start point is the front of the cover glass, S1 section 4.8), +z = the viewing direction, +x = image up. The rangefinder uses one frame for the depth image (the stereo baseline is not modelled)."

[[ports]]
name = "usb"
kind = "signal"
type = "usb-c"
gender = "neutral"
note = "USB-C peripheral connector (S1 section 3.7.5 lists D435i); USB 3.1 Gen 1 or USB 2.0."

[visual]                            # cosmetic only (parts/README.md "Visual layer")
rationale = "Generic camera-module block from the [geometry] bounds (90 x 25 x 25 mm); no product photo was used, the lens windows and IR projector are not drawn."

[[visual.elements]]
gen = "camera_module"

[[sources]]
id = "S1"
url = "https://www.realsenseai.com/wp-content/uploads/2026/03/RealSense-D400-Series-Datasheet-Mar-2026.pdf"
title = "Intel RealSense D400 Series Product Family Datasheet, 337029-017 (March 2026)"
accessed = "2026-10-08"
quote = "Baseline 55 mm 55 mm 50 mm 95 mm 18 mm ... Depth FOV HD (16:9) (degrees) H:87 / V:58 / D:95 (D430 column) ... Table 3-52 D43x Mechanical Dimensions: Width 90, Height 25, Depth 25, Weight 75 ... Min-Z (mm) D430/D43x: 1280x720 280 ... Z-accuracy (or Absolute Error) ± 2% ... RMS Error (or Spatial Noise) ≤ 2% (<= 2 Meters and 80% ROI, HD Resolution)"
