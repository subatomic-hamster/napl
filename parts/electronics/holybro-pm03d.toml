id = "holybro-pm03d"
name = "Holybro PM03D digital power module with distribution board (2-6S, 45x45 mount)"
category = "pcb.pm"
vendor = "Holybro"
part_number = "PM03D"
url = "https://holybro.com/collections/power-modules-pdbs/products/pm03d-power-module"

# Distribution board variant: B+ pads x4 and optional XT30 x6. Battery-side connector gender is a modelling convention.
[params]
mass                = { value = 0.059, unit = "kg", src = "S1", fidelity = "datasheet" }
length              = { value = 0.084, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.078, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.012, unit = "m", src = "S1", fidelity = "datasheet" }
input_cells_max     = { value = 6, unit = "S", src = "S1", fidelity = "datasheet" }
pcb_current_cont    = { value = 60, unit = "A", src = "S1", fidelity = "datasheet" }
pcb_current_burst   = { value = 120, unit = "A", src = "S1", fidelity = "datasheet" }
current_sense_max   = { value = 164, unit = "A", src = "S1", fidelity = "datasheet" }
output_5v_voltage   = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
output_5v_current_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
output_hv_current_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.45x45.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "45 x 45 mm mounting hole spacing per S1; hole size not stated, M3 assumed (inference)"

[[ports]]
name = "battery_in"
kind = "power"
type = "xt60"
gender = "male"
v_max = { value = 25.2, unit = "V", fidelity = "derived", derivation = "2~6S per S1: 6 cells x 4.2 V full charge = 25.2 V." }
i_max = { value = 60, unit = "A", src = "S1", fidelity = "datasheet" }
role = "passthrough"
pins = ["BAT.1", "BAT.2"]

[[ports]]
name = "fc_out"
kind = "power"
type = "molex-clik-mate.6"
gender = "female"
pins = ["FC.1", "FC.2", "FC.3", "FC.4", "FC.5", "FC.6"]
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
role = "source"

[[ports]]
name = "esc_xt30"
kind = "power"
type = "xt30"
gender = "female"
count = 6
role = "source"
note = "XT30 x6 optional; each rated by the XT30 connector, board 60 A continuous total"

[[ports]]
name = "bplus_pads"
kind = "power"
type = "solder-pad"
gender = "neutral"
count = 4
role = "source"

# Pin level. BAT: the XT60 named in S1; polarity and 7.2 mm spacing are the XT60 family's (pin 1 +), which Holybro does not print: estimated.
# FC: the 6-pin Molex CLIK-Mate 2.0 mm cable named in S1. The page prints no module-side table; the pins are derived from the FC side (S2): the
# digital module plugs into POWER1/2 of a Pixhawk 5X/6X, whose pins 1-2 are the 5 V supply, 3 SCL, 4 SDA, 5-6 GND, so the module drives 5 V and shares the I2C.
# X1-X6: the optional XT30 outputs of S1, drawn along the +x edge (positions and polarity estimated). The four B+ pads and the 8/12 V rail are not drawn
# (no pad positions or pin names are published).
[[connectors]]
id = "BAT"
name = "battery XT60"
type = "xt60"
gender = "male"
pos = [-0.042, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.0072
src = "S1"
fidelity = "estimated"
rationale = "S1 lists an XT60 port but not its polarity or contact spacing: + then -, 7.2 mm of the XT60 family. Board position estimated."
pins = [
  { number = 1, name = "BAT+", kind = "power", dir = "in", i_max = 30.0, note = "XT60 contact rating; the PCB is rated 60 A" },
  { number = 2, name = "BAT-", kind = "ground", i_max = 30.0 },
]

[[connectors]]
id = "FC"
name = "FC power cable (6-pin Molex CLIK-Mate 2.0 mm)"
type = "molex-clik-mate-6"
gender = "female"
pos = [-0.030, 0.039, 0.0]
axis = [0.0, 1.0, 0.0]
ref = [-1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.002
fidelity = "derived"
derivation = "The module-side pin table is not published as text. Derived from the Pixhawk 5X/6X POWER1/2 port table (S2: 1-2 VDD5V_BRICK 5 V, 3 SCL, 4 SDA, 5-6 GND): a straight cable, so the module sources the 5 V and shares the two I2C lines. The 5.2 V / 3 A limits are the S1 output ratings."
pins = [
  { number = 1, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 2, name = "VDD5V_BRICK", kind = "power", dir = "out", v = 5.2, i_max = 3.0 },
  { number = 3, name = "SCL", kind = "signal", dir = "io", v = 3.3 },
  { number = 4, name = "SDA", kind = "signal", dir = "io", v = 3.3 },
  { number = 5, name = "GND", kind = "ground" },
  { number = 6, name = "GND", kind = "ground" },
]

[[connectors]]
id = "X1"
name = "XT30 output 1"
type = "xt30"
gender = "female"
pos = [0.042, -0.030, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 2
pitch = 0.005
src = "S1"
fidelity = "estimated"
rationale = "S1 lists 'XT30 *6 (optional)'; polarity and 5 mm spacing assumed from the XT30 family, board layout estimated."
pins = [
  { number = 1, name = "OUT+", kind = "power", dir = "out", i_max = 20.0 },
  { number = 2, name = "OUT-", kind = "ground", i_max = 20.0 },
]

