[[sources]]
id = "S2"
url = "https://www.pololu.com/product/2834"
title = "Pololu D24V10Fx step-down regulator product page, Connections"
accessed = "2026-10-09"
quote = "The buck regulator has five connections: power good (PG). shutdown ( SHDN ), input voltage (VIN), ground (GND), and output voltage (VOUT). The 'power good' indicator, PG, is an open-drain output that drives low when the regulator's output voltage falls below 80% or rises above 120% of its target output voltage. ... The SHDN pin can be driven low (under 0.4 V) to turn off the output ... There is a 100 kohm pull-up resistor between the SHDN pin and VIN"

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/2834"
title = "Pololu 12V, 1A Step-Down Voltage Regulator D24V10F12 (Pololu product page)"
accessed = "2026-10-07"
quote = "Input voltage: [ | output voltage + dropout voltage | ] to 36 V (see below for more information on dropout voltage) | Fixed 3.3 V, 5 V, 6 V, 9 V, or 12 V output (depending on regulator version) with 4% accuracy | Maximum output current: 1 A | Typical efficiency of 80% to 93% | 500 kHz switching frequency (when not in power-save mode) | 2 ms soft-start reduces in-rush current on power-up | 200 μA typical no-load quiescent current | Over-current and short-circuit protection, over-temperature shutoff | Power-good indicator can be used to tell when the regulator has reached and is maintaining its target output voltage | Small size:  0.7″ × 0.5″ × 0.14″ (18 mm × 13 mm × 3.5 mm)"
