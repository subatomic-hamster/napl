quote = "Input voltage: 5 to 38 V (see below for more details on the regulator’s dropout voltage, which affects the low end of the operating range) | Fixed 5 V output (with 4% accuracy); this can be lowered by adding an external resistor between FB and VOUT | Typical maximum continuous output current between 4 A and 8 A | Integrated reverse-voltage protection, over-current and short-circuit protection, over-temperature shutoff, soft-start, and under-voltage lockout | Typical efficiency of 80% to 95%, depending on input voltage and load; the switching frequency automatically changes at light loads to maintain high efficiencies | 800 μA typical no-load quiescent current; can be reduced to 10 µA to 20 µA per volt on VIN by disabling the board | Power-good indicator can be used to tell when the regulator has reached and is maintaining its target output voltage | Compact size:  1.6″ × 0.8″ × 0.3″ (40.6 × 20.3 × 7.6 mm) | Four 0.086″ mounting holes for #2 or M2 | screws | Smaller holes for 0.1″ header pins and larger holes for terminal blocks offer several options for connecting to the board ... .  The mounting holes are in the four corners of the board and are separated by 1.4″ horizontally and 0.6″ vertically."
