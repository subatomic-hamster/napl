url = "https://docs.arducam.com/Raspberry-Pi-Camera/raspberry-pi-camera-pinout/"
title = "Arducam Wiki: Raspberry Pi Camera Pinout, 22-pin MIPI-CSI connector"
accessed = "2026-10-09"
quote = "That of 22-pin is on Raspberry Pi 5, Pi Zero Series and Compute Module IO Board. ... Pi Board (Zero & Zero W & Zero 2 W) WM8828DKR-ND Molex Right Angle 22 0.5mm ... Pin # Name Type Description: 1 GND | 2 CAM_D0_N Output | 3 CAM_D0_P Output | 4 GND | 5 CAM_D1_N | 6 CAM_D1_P | 7 GND | 8 CAM_CK_N | 9 CAM_CK_P | 10 GND | 11 CAM_D2_N | 12 CAM_D2_P | 13 GND | 14 CAM_D3_N | 15 CAM_D3_P | 16 GND | 17 POWER-EN Input | 18 LED-EN I/O | 19 GND | 20 SCL Input | 21 SDA I/O | 22 VCC Power 3.3V Power Supply. The pin definition of the camera board; the signals are input or output type. Vice versa these pins on the RPI board are in reverse direction."

[[sources]]
id = "S1"
url = "https://datasheets.raspberrypi.com/rpizero2/raspberry-pi-zero-2-w-product-brief.pdf"
title = "Raspberry Pi Zero 2 W Product Brief (Raspberry Pi Ltd)"
accessed = "2026-10-07"
quote = "Form factor: 65mm × 30mm Processor: Broadcom BCM2710A1, quad-core 64-bit SoC (Arm Cortex-A53 @ 1GHz) Memory: 512MB LPDDR2 ... 1 × USB 2.0 interface with OTG HAT-compatible 40-pin I/O header footprint ... CSI-2 camera connector ... Input power: 5V DC 2.5A Operating temperature: -20°C to +70°C ... It is powered via a micro USB socket"
