# ---- Connectors (pin level). J8: the 40-pin header footprint (unpopulated, S1), the same Raspberry Pi pinout as every 40-pin board (P1, pinout.xyz;
# P2: 0.1 in pitch on all boards, 16 mA per pin). PWR / USB: the two micro-B sockets (P3, USB micro-B contact assignments). CAM: the 22-pin 0.5 mm
# camera connector (P4, Arducam's table of the 22-pin Raspberry Pi connector, camera-side directions; the Pi side is the reverse). All poses are
# estimated from the board outline (65 x 30 mm, header on the +y long edge, sockets on the -y edge, camera connector on the +x short edge).
