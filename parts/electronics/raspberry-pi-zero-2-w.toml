[[sources]]
id = "P2"
url = "https://www.raspberrypi.com/documentation/computers/raspberry-pi.html"
title = "Raspberry Pi documentation: GPIO and the 40-pin header (read through a page summariser)"
accessed = "2026-10-08"
quote = "The GPIO headers on all boards have a 0.1in (2.54 mm) pin pitch. || Pins GPIO2 and GPIO3 have fixed pull-up resistors, but for other pins this can be configured in software. || GPIO pins 0 and 1 are present on the board (physical pins 27 and 28), but are reserved for advanced use. || each pin can individually draw up to 16mA"

[[sources]]
id = "P3"
url = "https://en.wikipedia.org/wiki/USB_hardware"
title = "USB hardware (Wikipedia), Mini and Micro connector pin assignments"
accessed = "2026-10-09"
quote = "Pin Name Wire color Description: 1 VBUS Red +5 V | 2 D- White Data- | 3 D+ Green Data+ | 4 ID None (only used in plug): When a cable is connected to a Mini- or Micro-AB receptacle, the ID pin indicates to the On-The-Go device whether the plug is the Type-A (host) or Type-B (peripheral device) end of its cable ... Type-A plug (host end): connected to GND; Type-B plug (peripheral device end): not connected | 5 GND Black Signal ground"

[[sources]]
