id = "pololu-vl53l8cx-carrier"
name = "Pololu VL53L8CX time-of-flight 8x8-zone distance sensor carrier (400 cm)"
category = "sensor.rangefinder"
vendor = "Pololu (ST VL53L8CX)"
part_number = "Pololu item 3419"
url = "https://www.pololu.com/product/3419"

# Frame: origin at the board centre on the component face; +z out of the sensor window (the sensor looks along +z).
[params]
length              = { value = 0.023, unit = "m", src = "S1", fidelity = "datasheet" }
width               = { value = 0.013, unit = "m", src = "S1", fidelity = "datasheet" }
height              = { value = 0.003, unit = "m", src = "S1", fidelity = "datasheet" }
mass                = { value = 0.0007, unit = "kg", src = "S1", fidelity = "datasheet" }  # without header pins
supply_voltage_min  = { value = 3.2, unit = "V", src = "S1", fidelity = "datasheet" }
supply_voltage_max  = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
supply_current_typ  = { value = 0.100, unit = "A", src = "S1", fidelity = "datasheet" }  # typical active ranging
supply_current_peak = { value = 0.150, unit = "A", src = "S1", fidelity = "datasheet" }
range_max           = { value = 4.0, unit = "m", src = "S1", fidelity = "datasheet" }
range_min           = { value = 0.020, unit = "m", src = "S1", fidelity = "datasheet" }
resolution          = { value = 0.001, unit = "m", src = "S1", fidelity = "datasheet" }  # depth resolution
zones_max           = { value = 64, unit = "1", src = "S1", fidelity = "datasheet" }  # 8x8 (also 4x4)
fov_diagonal        = { value = 1.1345, unit = "rad", src = "S1", fidelity = "datasheet" }  # 65 deg diagonal (45 deg horizontal/vertical)
wavelength          = { value = 940e-9, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "board.23x13-header"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Two mounting holes for #2 or M2 screws exist but their spacing is not stated on the page; opaque board-outline tag."

[[ports]]
name = "power_in"
kind = "power"
type = "header-0.1in"
gender = "neutral"
role = "sink"
v_max = { value = 5.5, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.2, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 0.150, unit = "A", src = "S1", fidelity = "datasheet" }  # peak current
note = "VIN through the on-board regulators."

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
note = "The page says the output format is I2C/SPI."

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/3419"
title = "Pololu item 3419 product page (VL53L8CX Time-of-Flight 8×8-Zone Distance Sensor Carrier with Voltage Regulators, 400cm Max)"
accessed = "2026-10-07"
quote = "Dimensions: 0.5″ × 0.9″ × 0.1″ (13 mm × 23 mm × 3 mm) | Weight without header pins: 0.7 g (0.03 oz) | Operating voltage: 3.2 V to 5.5 V | Typical active-ranging supply current: 100 mA | Varies with configuration, target, and environment; peak current can reach 150 mA | Maximum range: 4 m (13 ft) | Resolution: 1 mm depth, 4×4 or 8×8 sensor zones | Minimum range: 20 mm (0.8 in) | Typical full field of view (FoV): 65° diagonal (45° horizontal/vertical) | Output format (I²C/SPI): histogram | The board has two mounting holes that work with #2 and M2 screws (not included)."
