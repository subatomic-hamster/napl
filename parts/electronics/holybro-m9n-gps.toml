id = "holybro-m9n-gps"
name = "Holybro M9N GPS (u-blox NEO-M9N + IST8310 compass), V1 and V2 casings"
category = "pcb.gps"
vendor = "Holybro"
part_number = "M9N GPS"
url = "https://docs.holybro.com/gps-and-rtk-system/m8n-m9n-m10-gps/standard-m10-m9n-m8n-gps/overview.md"

# Compass: IST8310 (part isentek-ist8310). V1 casing has buzzer + safety switch; V2 is IP67 without them.
# The related M8N variant is in parts/drone/holybro-m8n-gps.toml; the M10 variant is holybro-m10-gps.
