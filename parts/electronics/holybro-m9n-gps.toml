[[ports]]
name = "gps_in"
kind = "power"
type = "jst-gh.10"
gender = "male"
v_max = { value = 5.2, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
note = "Port Type JST-GH-10P carries 5 V, UART and I2C (compass); gender male assumed (board header) with a cable supplied"

[[ports]]
name = "uart"
kind = "signal"
type = "uart"
gender = "neutral"
level = { value = 3.3, unit = "V", fidelity = "estimated", rationale = "Level not stated on the Holybro page; u-blox M9 UART is 3.3 V class and Pixhawk GPS ports are 3.3 V logic. Treat as unverified." }

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
note = "IST8310 compass"

