id = "livox-mid-360-splitter-cable"
name = "Livox Aviation Connector 1-to-3 splitter cable for Mid-360 (M12 12P female to RJ45 + power + function leads)"
category = "wire"
vendor = "Livox (DJI); retailer MyBotShop"
part_number = "Livox connector cable Mid360/AVIA2 1m (MBS-Z-435-03)"
url = "https://www.mybotshop.de/Livox-connector-cable-Mid360-AVIA2-1m_1"

# Head harness of the dog: sensor end M12 A-code 12-pin female; the other end splits into a power pair (bare wires), a function cable (bare insulated wires: PPS / GPS / reserved IO) and an Ethernet cable ending in an RJ45 plug.
# Pin numbers and colours: Livox Mid-360 User Manual (the sensor's own table, see livox-mid-360.toml). The manual's cable is 1.5 m; the MyBotShop 1 m variant is modelled (page offers 0.15-10 m).

[params]
length = { value = 1.0, unit = "m", src = "S1", fidelity = "datasheet" }
mass   = { value = 0.11, unit = "kg", src = "S1", fidelity = "datasheet" }  # "Item weight 0,11 kg" for the 1 m cable

[params.price]
value = 80.0
unit = "USD"
fidelity = "estimated"
rationale = "MyBotShop (DE) lists EUR 79.95 incl. 19 % VAT, net EUR 67.18, plus shipping, seen 2026-10-16. No exchange rate was looked up: at an assumed 1.1-1.2 USD/EUR the net price is 74-81 USD; 80 USD taken (+-20 %), net of VAT, shipping excluded."

[[ports]]
