id = "S2"
url = "https://docs.holybro.com/autopilot/kakute-h7-v1-v2-mini/kakute-h7-v2/pinout"
title = "Kakute H7 V2 Pinout (Holybro docs; Holybro llms-full.txt text export)"
accessed = "2026-10-09"
quote = "VTX+ | 9V for HD System or other VTX | SDA, SCL | I2C connection (for peripherals) | 5v | 5v output (1.5A max) | 3v3 | 3.3v output (0.25A max) | Vi | Video input from FPV camera | Vo | Video output to video transmitter | R6, T6 | UART6 RX and TX (UART6 RX is located in the GH plug) || ESC Port 1: B+ Battery positive voltage (2S-8S) | R7 UART7 RX | GND | CURRENT | M1 | M2 | M3 | M4 || ESC Port 2: B+ | R7 | GND | CURRENT | M5 | M6 | M7 | M8 || VTX Port: Vtx+ | G | T1 UART1 TX | R1 UART1 RX | G | R6 UART6 RX"

[[sources]]
id = "S1"
url = "https://docs.holybro.com/autopilot/kakute-h7-v1-v2-mini/kakute-h7-v2/overview.md"
title = "Kakute H7 v2 Overview (Holybro docs)"
accessed = "2026-10-07"
quote = "MCU - STM32H743 32-bit processor running at 480 MHz IMU – BMI270 Barometer - BMP280 ... 6x UARTs (1,2,3,4,6,7; UART2 is used for Bluetooth telemetry) 9x PWM Outputs (8 Motor Output, 1 LED) Battery input voltage: 3S-8S BEC 5V 2A Cont. BEC 9V 1.5A Cont. ... Mounting - 30.5 x 30.5mm/Φ4mm hole with Φ3mm Grommets Dimension - 35x35mm Weight - 8g 2x JST-SH1.0_8pin port (4in1 ESCs, x8/Octocopter compatible) 1x JST-GH1.5_6pin port (For HD System like Caddx Vista, Air Unit, or other VTX)"
