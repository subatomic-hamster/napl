id = "altran-alev100-b-dc-contactor-12v"
name = "Altran ALEV100-B high-voltage DC contactor, 100 A carry, 12 V coil, SPST-NO, polarity-free"
category = "switch.contactor"
vendor = "Altran Magnetics"
part_number = "ALEV100-B (12 VDC coil)"
url = "https://www.chiefenterprises.com/alev100-b"

# Replaces the plan's generic ZJW100A-class contactor: that listing has no datasheet and a 12 V DC88-class coil draws 13-18 W (over 1 A); this one has a full datasheet (Rev K, 05-Feb-2025).
# Why it exists: the e-stop must never carry motor current. The 22 mm NC e-stop sits in the 12 V COIL loop (0.46 A); the contactor's normally-open main contact switches the 8S battery bus
# (up to the study's 87 A simultaneous peak). Open e-stop, broken wire or a dead 12 V rail drops the contactor and cuts the legs; the compute / lidar DC-DCs hang on the LINE side and stay up.
# Part frame: origin at the centre of the mounting base, z up. The body outline (about 58 x 52.5 mm, 46 mm high) is taken from the product drawing text; the terminal positions are estimates.
# Coil leads are two white non-polar wires (390 mm, part of the datasheet mass); the two main terminals are M5x0.8 studs.

[params]
i_rated_continuous = { value = 100.0, unit = "A", src = "S1", fidelity = "datasheet" }   # "Continuous (Carry) Current 100A"
i_overload_3min    = { value = 200.0, unit = "A", src = "S1", fidelity = "datasheet" }   # "Short Time Over current 200A (3 minutes)"
v_rated_contact    = { value = 900.0, unit = "V", src = "S1", fidelity = "datasheet" }   # "Rated Operating Voltage 12-900 VDC" (900 V switching option)
voltage_drop_100a  = { value = 0.08, unit = "V", src = "S1", fidelity = "datasheet" }   # "Voltage Drop (@100A) <=80mV"
coil_voltage       = { value = 12.0, unit = "V", src = "S1", fidelity = "datasheet" }
coil_current       = { value = 0.461, unit = "A", src = "S1", fidelity = "datasheet" }   # "Coil current (20 C, voltage rating, nominal) 461mA"
coil_power         = { value = 5.5, unit = "W", src = "S1", fidelity = "datasheet" }
pickup_voltage     = { value = 9.6, unit = "V", src = "S1", fidelity = "datasheet" }
dropout_voltage    = { value = 0.8, unit = "V", src = "S1", fidelity = "datasheet" }
operate_time       = { value = 0.025, unit = "s", src = "S1", fidelity = "datasheet" }   # "Close (includes bounce) 25ms, Max."
release_time      = { value = 0.010, unit = "s", src = "S1", fidelity = "datasheet" }
mass               = { value = 0.19, unit = "kg", src = "S1", fidelity = "datasheet" }   # "Weight 0.42Lb (0.19kg)"
length             = { value = 0.058, unit = "m", fidelity = "estimated", rationale = "Body outline from the product drawing text of the data sheet, read from extracted text without dimension lines: about 58 mm." }
width              = { value = 0.0525, unit = "m", fidelity = "estimated", rationale = "As length: about 52.5 mm." }
height             = { value = 0.0462, unit = "m", fidelity = "estimated", rationale = "As length: 46.2 mm over the terminals is the larger of the two heights in the drawing text." }

[params.r_contact]
value = 0.0008
unit = "ohm"
fidelity = "derived"
derivation = "Voltage drop <= 80 mV at 100 A (S1) gives R <= 0.08 / 100 = 0.8 mohm (an upper bound: the new part is below its limit)."

[params.coil_resistance]
value = 26.0
unit = "ohm"
fidelity = "derived"
derivation = "12 V / 461 mA (S1) = 26.0 ohm."

