  { number = 22, name = "SPI1_MISO", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI1_MISO"], note = "SPI #1 primary in / secondary out, SoC GP37_SPI3_MISO (PY.01)" },
  { number = 23, name = "SPI0_SCK", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI0_SCK"], note = "SPI #0 shift clock, SoC GP47_SPI1_CLK (PZ.03)" },
  { number = 24, name = "SPI0_CS0", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI0_CS0"], note = "SPI #0 chip select 0 (active low), SoC GP50_SPI1_CS0_N" },
  { number = 25, name = "GND", kind = "ground" },
  { number = 26, name = "SPI0_CS1", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI0_CS1"], note = "SPI #0 chip select 1 (active low), SoC GP51_SPI1_CS1_N (PZ.07)" },
  { number = 27, name = "I2C0_SDA", kind = "signal", dir = "io", v = 3.3, i_max = 0.002, alt = ["a0:I2C0_SDA", "a1:GPIO"], note = "I2C #0 data, SoC GP14_I2C2_DAT (PDD.00), open-drain, 1.5 kohm pull-up on the carrier" },
