id = "nvidia-jetson-orin-nano-devkit-8gb"
name = "NVIDIA Jetson Orin Nano Developer Kit (8 GB, Super), module + reference carrier board + heatsink"
category = "computer.sbc"
vendor = "NVIDIA"
part_number = "Jetson Orin Nano 8GB Developer Kit (P3768 carrier + P3767 module)"
url = "https://docs.nvidia.com/jetson/orin-nano-devkit/user-guide/latest/hardware_layout.html"

# The developer kit as bought: the 8 GB module (parts/electronics/nvidia-jetson-orin-nano-8gb-module.toml) on NVIDIA's reference carrier board, with heatsink and fan. Pin tables are the
# carrier-board specification SP-11324-001 v1.0 (S1), Table 3-3 (J12), Tables 2-1 to 2-3 (USB) and section 3.8 (DC jack). Only the connectors a cuas-lite build wires are listed: the 40-pin header J12,
# the DC jack J16, the USB-C port J5 and the two stacked USB-A connectors J6 / J7 (four USB-A ports). Not listed: the two 22-pin MIPI CSI connectors, the 12-pin button header, the fan header,
# the CAN / PoE / RTC headers (the optional CAN header J17 is an unpopulated footprint with 3.3 V CAN_TX / CAN_RX logic, S1 Table 3-5: the dog uses a USB CAN adapter instead), the M.2 slots and DisplayPort. The RJ45 jack J15 (the Mid-360 link) is listed.
# Part frame: origin at the centre of the carrier board's underside, +x along the 100 mm side, +y along the 79 mm side, z up. The connector poses are placed on the product photos (the specification's
# placement figures carry no dimensions), so they are estimates; the pin tables are not.
# Mass: S5 (an NVIDIA forum answer; scope disputed in the thread, see the note on the param). The kit's included 19 V power supply is not part of it.

[params]
length                  = { value = 0.103, unit = "m", src = "S2", fidelity = "datasheet" }   # whole kit, 103.00 +-0.20 mm (S1 Figure 4-2 agrees)
width                   = { value = 0.0905, unit = "m", src = "S2", fidelity = "datasheet" }
height                  = { value = 0.03477, unit = "m", src = "S2", fidelity = "datasheet" }   # includes feet, carrier board, module and thermal solution; +-1.09 mm (S1)
carrier_length          = { value = 0.100, unit = "m", src = "S1", fidelity = "datasheet" }
carrier_width           = { value = 0.079, unit = "m", src = "S1", fidelity = "datasheet" }
carrier_thickness       = { value = 0.00157, unit = "m", src = "S1", fidelity = "datasheet" }
mass                    = { value = 0.174, unit = "kg", src = "S5", fidelity = "literature" }   # 'The Orin nano devkit is 0.174kg' (NVIDIA forum, Feb 2023); a commenter asked whether that is the module only, the answer repeated it is the devkit
dc_input_min            = { value = 9.0, unit = "V", src = "S1", fidelity = "datasheet" }   # DC Jack: 9-20 V (19 V supply provided)
dc_input_max            = { value = 20.0, unit = "V", src = "S1", fidelity = "datasheet" }
dc_input_supplied       = { value = 19.0, unit = "V", src = "S4", fidelity = "datasheet" }
dc_jack_max_current     = { value = 3.5, unit = "A", src = "S1", fidelity = "datasheet" }   # max current supported by the J16 barrel jack
dc_jack_size            = { value = "5.5 mm outer x 2.5 mm pin, 9.5 mm barrel, centre positive", unit = "-", src = "S1", fidelity = "datasheet" }
power_mode_low          = { value = 7, unit = "W", src = "S2", fidelity = "datasheet" }   # the kit's module range is 7 W - 25 W
power_mode_mid          = { value = 15, unit = "W", src = "S3", fidelity = "datasheet" }   # module data sheet: 7 W and 15 W modes
power_mode_super        = { value = 25, unit = "W", src = "S4", fidelity = "datasheet" }   # 25 W default mode / MAXN SUPER of the Super kit
gpio_level              = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }   # 'All signals on the 40-pin header are 3.3V levels'
usb_a_ports             = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }   # USB 3.2 Gen2x1 hub to 4x Type A, host only
usb_a_vbus_limit        = { value = 3.0, unit = "A", src = "S1", fidelity = "datasheet" }   # per stack of two ports
operating_temp_min      = { value = 273.15, unit = "K", src = "S1", fidelity = "datasheet" }   # 0 degC
operating_temp_max      = { value = 308.15, unit = "K", src = "S1", fidelity = "datasheet" }   # 35 degC developer-kit operating range
ai_performance_super    = { value = 67, unit = "TOPS", src = "S2", fidelity = "datasheet" }
price_usd               = { value = 399.0, unit = "USD", src = "S7", fidelity = "datasheet" }   # retailer price on 2026-10-11 (NVIDIA's own page shows none); excluded from the 150 USD budget by the project brief

# Envelope (collision, wire clearance): the whole kit 103 x 90.5 x 34.77 mm (length / width / height above), underside at z = 0.
[[geometry.shapes]]
shape = "box"
size = [0.0515, 0.04525, 0.017385]
pos = [0.0, 0.0, 0.017385]

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Board lying on its four rubber feet; the carrier's mounting-hole pattern is only in a figure without dimensions (S1 Figure 4-1), so no bolt pattern is declared."

[[ports]]
name = "power_in"
kind = "power"
type = "dc-barrel.5.5x2.5"
gender = "female"
role = "sink"
pins = ["J16.1", "J16.2"]
v_max = { value = 20.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_max = { value = 3.5, unit = "A", src = "S1", fidelity = "datasheet" }
note = "9-20 V DC, centre pin positive; the kit ships a 19 V supply (S1, S4)."

# Pin-wire groupings (a pin wire end `jetson.J7.1` is folded into the port that lists the pin).
[[ports]]
name = "header_5v_a"
kind = "power"
type = "wire-lead"
gender = "neutral"
role = "source"
pins = ["J12.2", "J12.6"]
v_max = { value = 5.0, unit = "V", fidelity = "estimated", rationale = "Nominal 5 V of the 40-pin header's 5V0 pins (the pin table names them 5V0); the permitted load per pin is stated in the pin table notes (1 A each)." }
note = "Header 5V0 (pin 2) with ground (pin 6): the Pico's VSYS."

[[ports]]
name = "header_5v_b"
kind = "power"
type = "wire-lead"
gender = "neutral"
role = "source"
pins = ["J12.4", "J12.9"]
v_max = { value = 5.0, unit = "V", fidelity = "estimated", rationale = "As header_5v_a." }
note = "Header 5V0 (pin 4) with ground (pin 9): the two hall sensors."

[[ports]]
name = "usb_j7"
kind = "signal"
type = "usb"
gender = "female"
pins = ["J7.1", "J7.2", "J7.3", "J7.4"]
note = "USB-A socket J7 (the USB 2.0 contact set: VBUS, D-, D+, GND)."

[[ports]]
name = "usb_j6"
kind = "signal"
type = "usb"
gender = "female"
pins = ["J6.1", "J6.2", "J6.3", "J6.4"]
note = "USB-A socket J6 (the USB 2.0 contact set: VBUS, D-, D+, GND)."

# ---- 40-pin expansion header J12 (S1 Table 3-3). Pin names are the module pin names of the specification's Figure 3-1; a trailing * in the table marks an active-low signal and is dropped here.
# alt: a0 = default usage, a1 = the table's alternate functionality. All signals are 3.3 V; pins 3, 5, 27 and 28 are open-drain I2C lines with pull-ups on the carrier (2.2 kohm for 3 / 5, 1.5 kohm for 27 / 28),
# the other signals pass TI TXB0108 level translators with weak output drivers (i_max is the table's pin drive: 2 mA open-drain, 20 uA elsewhere). Power pins carry 1 A each.
# Linux: pins 3 / 5 are I2C bus 7 (SoC GP16_I2C8), pins 27 / 28 are I2C bus 1 (GP14_I2C2); UART1 on pins 8 / 10 is /dev/ttyTHS1 on JetPack 6 (forum, not in the specification).
[[connectors]]
id = "J12"
name = "40-pin expansion header"
type = "header-2x20-2.54mm"
gender = "male"
pos = [-0.020, 0.0295, 0.0105]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 2
cols = 20
pitch = 0.00254
layout = "dual"
src = "S1"
fidelity = "datasheet"
pose_rationale = "Header on the long edge opposite the USB / Ethernet end block, near the module, as in the product photos; the specification's placement figure has no dimensions (positional estimate)."
note = "Pin table: S1 Table 3-3 / Figure 3-1. SoC names and pad numbers (PAC.06 ... PI.00) are in the table; Linux GPIO and PWM chip numbers follow NVIDIA's Jetson.GPIO library (S6): PWM on pin 15 (3280000.pwm), pin 32 (32e0000.pwm), pin 33 (32c0000.pwm)."
pins = [
  { number = 1, name = "3V3", kind = "power", dir = "out", v = 3.3, i_max = 1.0, note = "main 3.3 V supply" },
  { number = 2, name = "5V0", kind = "power", dir = "out", v = 5.0, i_max = 1.0, note = "main 5.0 V supply (input / output)" },
  { number = 3, name = "I2C1_SDA", kind = "signal", dir = "io", v = 3.3, i_max = 0.002, alt = ["a0:I2C1_SDA"], note = "I2C #1 data, SoC GP16_I2C8_DAT (PDD.02), open-drain, 2.2 kohm pull-up on the carrier" },
  { number = 4, name = "5V0", kind = "power", dir = "out", v = 5.0, i_max = 1.0, note = "main 5.0 V supply (input / output)" },
  { number = 5, name = "I2C1_SCL", kind = "signal", dir = "io", v = 3.3, i_max = 0.002, alt = ["a0:I2C1_SCL"], note = "I2C #1 clock, SoC GP15_I2C8_CLK (PDD.01), open-drain, 2.2 kohm pull-up on the carrier" },
  { number = 6, name = "GND", kind = "ground" },
  { number = 7, name = "GPIO09", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:AUD_MCLK"], note = "SoC GP167 (PAC.06); alternate: audio primary clock" },
  { number = 8, name = "UART1_TXD", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:UART1_TXD", "a1:GPIO"], note = "UART #1 transmit, SoC GP70_UART1_TXD_BOOT2_STRAP (PR.02)" },
  { number = 9, name = "GND", kind = "ground" },
  { number = 10, name = "UART1_RXD", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:UART1_RXD", "a1:GPIO"], note = "UART #1 receive, SoC GP71_UART1_RXD (PR.03)" },
  { number = 11, name = "UART1_RTS", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:UART1_RTS", "a1:GPIO"], note = "UART #1 request to send (active low), SoC GP72_UART1_RTS_N (PR.04)" },
  { number = 12, name = "I2S0_SCLK", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:I2S0_SCLK"], note = "SoC GP122 (PH.07); alternate: audio I2S #0 clock" },
  { number = 13, name = "SPI1_SCK", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI1_SCK"], note = "SoC GP36_SPI3_CLK (PY.00); alternate: SPI #1 shift clock" },
  { number = 14, name = "GND", kind = "ground" },
  { number = 15, name = "GPIO12", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:PWM1"], note = "SoC GP88_PWM1 (PN.01); hardware PWM (pwmchip 3280000.pwm)" },
  { number = 16, name = "SPI1_CS1", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI1_CS1"], note = "SPI #1 chip select 1 (active low), SoC GP40_SPI3_CS1_N (PY.04)" },
  { number = 17, name = "3V3", kind = "power", dir = "out", v = 3.3, i_max = 1.0, note = "main 3.3 V supply" },
  { number = 18, name = "SPI1_CS0", kind = "signal", dir = "io", v = 3.3, i_max = 0.00002, alt = ["a0:GPIO", "a1:SPI1_CS0"], note = "SPI #1 chip select 0 (module pin SPI1_CS0, active low; the table's text says 'SPI #0 Chip Select #0'), SoC GP39_SPI3_CS0_N" },
