[[ports]]
name = "power_in"
kind = "power"
type = "jst-gh.6"
gender = "neutral"
v_max = { value = 9, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
note = "Input voltage 4~9V DC @ 5V pad; Matek wiring: 'Receiver 5V - FC 5V, Receiver G - FC GND' (S1). The board has bare pads and Matek ships no cable ('Packing: 1x ELRS-R24-D, 2x IPEX MHF1 Antennas'), so the user's pigtail is the autowire wire: its FC end takes a JST-GH housing, its receiver end is soldered (hence gender neutral, no connector is pinned on this end). Typed jst-gh.6 so autowire can pair it with a Pixhawk-standard TELEM / GPS2 5 V pin; the type names the FC-side connector, not the pad. Previously solder-pad (nothing in the library could source it)."

[[ports]]
name = "crsf"
kind = "signal"
type = "jst-gh.6"
gender = "neutral"
note = "Receiver protocol CRSF on UART: 'Receiver RX - FC UART_TX for Telemetry, Receiver TX - FC UART_RX for Control' (S1); wire to a TELEM UART of the FC. Same pigtail convention as power_in: type is the FC-side JST-GH connector, the receiver end is soldered pads."

[[ports]]
name = "base"
kind = "mech"
type = "flat-mount"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
thickness = 0.0
fidelity = "estimated"
rationale = "Matek publishes no mounting holes or method for the 21 x 15 mm board (S1 lists only PCB size and weight); a 3 g receiver is held by foam tape, a zip tie or heat-shrink in practice, so a flat seat on any face is assumed. Underside seat, ref +x along the 21 mm side."

