id = "holybro-pixhawk-6c-mini"
name = "Holybro Pixhawk 6C Mini flight controller (Model A, current)"
category = "pcb.fc"
vendor = "Holybro"
part_number = "Pixhawk 6C Mini"
url = "https://docs.holybro.com/autopilot/pixhawk-6c-mini/technical-specification.md"

# Sensors: ICM-42688-P + BMI088 IMUs, IST8310 mag, MS5611 baro (see parts tdk-icm-42688-p, bosch-bmi088, isentek-ist8310,
# te-ms5611-01ba03). Three Model variants exist; Model A (Current) is recorded, others differ in size and mass.
[params]
mass_model_a_current = { value = 0.0424, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_model_a_legacy  = { value = 0.0392, unit = "kg", src = "S1", fidelity = "datasheet" }
mass_model_b         = { value = 0.0468, unit = "kg", src = "S1", fidelity = "datasheet" }
length             = { value = 0.0543, unit = "m", src = "S1", fidelity = "datasheet" }
width              = { value = 0.039, unit = "m", src = "S1", fidelity = "datasheet" }
height             = { value = 0.0175, unit = "m", src = "S1", fidelity = "datasheet" }
fmu_clock          = { value = 480e6, unit = "Hz", src = "S1", fidelity = "datasheet" }
max_input_voltage  = { value = 6, unit = "V", src = "S1", fidelity = "datasheet" }
servo_rail_voltage_max = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
imu_count          = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
pwm_outputs        = { value = 14, unit = "1", src = "S1", fidelity = "datasheet" }
uart_count         = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
can_buses          = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = 248.15, unit = "K", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 358.15, unit = "K", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "power_in"
kind = "power"
type = "jst-gh.6"
gender = "male"
v_max = { value = 6, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
pins = ["POWER1.1", "POWER1.2", "POWER1.3", "POWER1.4", "POWER1.5", "POWER1.6"]
note = "1 analog power input port; analog PM02 V3/PM06 V2/PM07 list a 6Pin GHR 1.25mm connector for this FC family (S2)"

[[ports]]
name = "pwm_out"
kind = "signal"
type = "pwm"
gender = "neutral"
count = 14
level_options = "3.3 V or 5 V hardware switchable"

[[ports]]
name = "telem"
kind = "signal"
type = "uart"
gender = "neutral"
count = 2

[[ports]]
name = "can"
kind = "signal"
type = "can"
gender = "neutral"
count = 2

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
count = 1

[visual]                            # cosmetic only (parts/README.md "Visual layer"); the part has no [geometry]
src = "V1"
note = "Black matte aluminium case, connector sockets in the lower step (product photo)."

[[visual.elements]]
gen = "board_fc"
params = { case = true }
colors = { pcb = "plastic-black", label = "plastic-dark" }

# ---- Connectors (pin level). Pin tables: S3 (Holybro Pixhawk 6C Mini ports page: pin number, colour, signal, level); "All connectors are JST GH
# 1.25 mm Pitch unless noted otherwise" (S3), DSM is JST-ZH 1.5 mm, the debug port JST-SH 1 mm. Pin 1 location is a diagram (not text) on the page.
# Poses are estimates on the 54.3 x 39 x 17.5 mm case (no drawing in the page text): GH ports along -y, small ports along +y, the PWM headers on
# the ends. The part frame origin is the case centre.
[[connectors]]
id = "POWER1"
name = "POWER1"
type = "jst-gh-6"
gender = "male"
pos = [-0.020, -0.0195, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
src = "S3"
fidelity = "datasheet"
pose_rationale = "Pin table from S3; position on the case estimated (the ports page gives photos, not a drawing)."
