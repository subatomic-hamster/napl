id = "holybro-pixhawk-6c-mini"
name = "Holybro Pixhawk 6C Mini flight controller (Model A, current)"
category = "pcb.fc"
vendor = "Holybro"
part_number = "Pixhawk 6C Mini"
url = "https://docs.holybro.com/autopilot/pixhawk-6c-mini/technical-specification.md"

# Sensors: ICM-42688-P + BMI088 IMUs, IST8310 mag, MS5611 baro (see parts tdk-icm-42688-p, bosch-bmi088, isentek-ist8310,
# te-ms5611-01ba03). Three Model variants exist; Model A (Current) is recorded, others differ in size and mass.
