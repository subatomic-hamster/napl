id = "generic-resistor-axial-quarter-w-rail"
name = "Axial 1/4 W resistor, rail-side lead on a power port (top resistor of the key / E-stop sense dividers of cuas-lite; value set per instance)"
category = "passive.resistor"
vendor = "generic (resistor assortment)"
part_number = "1/4 W axial resistor"
url = "https://www.adafruit.com/product/2784"

# The same physical resistor as parts/electronics/generic-resistor-axial-quarter-w.toml, with its rail-side lead (pin UP.1) on a POWER-kind port so that it can be wired to a power port (the key switch and E-stop
# contacts, 12 V) while the signal-side lead (UP.2) is a signal port. The design rules join ports of one kind only, and an instance whose power ports are all unwired is an error, so the general resistor keeps
# signal-kind ports and this part carries the two uses that tap a 12 V node. The instance sets `resistance`.
# Part frame: origin at the body centre, axis along z, leads leave at +-z.

[params]
resistance  = { value = 33000.0, unit = "ohm", fidelity = "estimated", rationale = "Default value (33 k, the top resistor of a 33 k / 10 k divider); every instance sets its own." }
power_rating = { value = 0.25, unit = "W", fidelity = "estimated", rationale = "Typical axial through-hole rating (1/4 W); not read from a data sheet." }
mass        = { value = 0.0002, unit = "kg", fidelity = "estimated", rationale = "A 1/4 W axial resistor weighs a few tenths of a gram (typical); not measured." }
length      = { value = 0.0063, unit = "m", fidelity = "estimated", rationale = "Typical body length of a 1/4 W axial resistor." }
width       = { value = 0.0024, unit = "m", fidelity = "estimated", rationale = "Typical body diameter." }
height      = { value = 0.0024, unit = "m", fidelity = "estimated", rationale = "Typical body diameter." }
price   = { value = 0.05, unit = "USD", fidelity = "estimated", rationale = "About 0.05 USD each in a 1/4 W assortment kit or a 100-pack from a hobby vendor; the listing was not fetched." }

[[ports]]
