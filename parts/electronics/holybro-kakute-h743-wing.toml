id = "PADS"
name = "signal and regulator pads"
type = "solder-pad"
gender = "neutral"
pos = [0.0, 0.0, 0.0067]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
rows = 5
cols = 9
pitch = 0.0025
layout = "seq"
src = "S2"
fidelity = "datasheet"
