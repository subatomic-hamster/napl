id = "holybro-kakute-h743-wing"
name = "Holybro Kakute H743-Wing flight controller (25x25 M2, 10-36V PDB, 3x BEC)"
category = "pcb.fc"
vendor = "Holybro"
part_number = "Kakute H743-Wing"
url = "https://docs.holybro.com/autopilot/kakute-h743-wing/overview.md"

# IMU: ICM-42688-P; barometer BMP280; CAN bus; on-board PDB and BECs.
[params]
mass            = { value = 0.028, unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.045, unit = "m", src = "S1", fidelity = "datasheet" }
width           = { value = 0.030, unit = "m", src = "S1", fidelity = "datasheet" }
height          = { value = 0.0135, unit = "m", src = "S1", fidelity = "datasheet" }
vbat_min        = { value = 10, unit = "V", src = "S1", fidelity = "datasheet" }
vbat_max        = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
current_sense_continuous = { value = 90, unit = "A", src = "S1", fidelity = "datasheet" }
current_sense_peak = { value = 220, unit = "A", src = "S1", fidelity = "datasheet" }
bec_5v_current_cont = { value = 2, unit = "A", src = "S1", fidelity = "datasheet" }
bec_5v_current_peak = { value = 3, unit = "A", src = "S1", fidelity = "datasheet" }
bec_9v_12v_current_cont = { value = 2, unit = "A", src = "S1", fidelity = "datasheet" }
bec_vx_current_cont = { value = 6, unit = "A", src = "S1", fidelity = "datasheet" }
bec_vx_current_peak = { value = 8, unit = "A", src = "S1", fidelity = "datasheet" }
ldo_3v3_current_max = { value = 0.2, unit = "A", src = "S1", fidelity = "datasheet" }
static_current_5v = { value = 0.160, unit = "A", src = "S1", fidelity = "datasheet" }
uart_count      = { value = 7, unit = "1", src = "S1", fidelity = "datasheet" }
pwm_outputs     = { value = 14, unit = "1", src = "S1", fidelity = "datasheet" }
i2c_ports_external = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
can_buses       = { value = 1, unit = "1", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.25x25.m2"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4

[[ports]]
name = "vbat_in"
kind = "power"
type = "solder-pad"
gender = "neutral"
v_max = { value = 36, unit = "V", src = "S1", fidelity = "datasheet" }
role = "sink"
note = "Input voltage range 10~36V (3~8S LiPo); also the ESC power pad"
pins = ["PWR.BAT-IN", "PWR.GND"]

[[ports]]
name = "can"
kind = "signal"
type = "can"
gender = "neutral"

[[ports]]
name = "serial"
kind = "signal"
type = "uart"
gender = "neutral"
count = 7

[[ports]]
name = "pwm_out"
kind = "signal"
type = "pwm"
gender = "neutral"
count = 14

[[ports]]
name = "i2c"
kind = "signal"
type = "i2c"
gender = "neutral"
count = 2

[[ports]]
name = "usb"
kind = "signal"
type = "usb"
gender = "neutral"
connector = "USB/DFU Key Extender with USB Type-C"

# ---- Connectors (pin level). Pin tables: S2 (Holybro Kakute H743-Wing "Pinout" page). The JST-GH ports are named (CAN, I2C: "4Pin JST-GH"; GPS: the
# page names no family, 6 pins: the Holybro JST-GH family is assumed). Poses are estimates on the 45 x 30 x 13.5 mm board (the page has a picture,
# no drawing): pin order within each connector is the table's; the part frame origin is the board centre, x along the 45 mm side.
[[connectors]]
id = "CAN"
name = "CAN port (4-pin JST-GH)"
type = "jst-gh-4"
gender = "male"
pos = [0.0, -0.015, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 4
pitch = 0.00125
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin table from S2; position on the board estimated."
pins = [
  { number = 1, name = "5V", kind = "power", dir = "out", v = 5.0, i_max = 1.0, note = "+5V voltage output (1A Max)" },
  { number = 2, name = "CAN1_H", kind = "signal", dir = "io", v = 3.3 },
  { number = 3, name = "CAN1_L", kind = "signal", dir = "io", v = 3.3 },
  { number = 4, name = "GND", kind = "ground" },
]

[[connectors]]
id = "I2C"
name = "I2C port (4-pin JST-GH)"
type = "jst-gh-4"
gender = "male"
pos = [-0.010, -0.015, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 4
pitch = 0.00125
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin table from S2; position on the board estimated."
pins = [
  { number = 1, name = "5V", kind = "power", dir = "out", v = 5.0, i_max = 1.0, note = "+5V voltage output (1A Max)" },
  { number = 2, name = "I2C2_SCL", kind = "signal", dir = "io", v = 3.3 },
  { number = 3, name = "I2C2_SDA", kind = "signal", dir = "io", v = 3.3 },
  { number = 4, name = "GND", kind = "ground" },
]

[[connectors]]
id = "GPS"
name = "GPS port (6-pin)"
type = "jst-gh-6"
gender = "male"
pos = [0.012, -0.015, 0.0]
axis = [0.0, -1.0, 0.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin table from S2; position on the board estimated; the page does not name the connector family (JST-GH assumed, as for the siblings)."
pins = [
  { number = 1, name = "5V", kind = "power", dir = "out", v = 5.0, i_max = 1.0, note = "+5V voltage output (1A Max)" },
  { number = 2, name = "UART1_TXD", kind = "signal", dir = "out", v = 3.3, alt = ["TXD"] },
  { number = 3, name = "UART1_RXD", kind = "signal", dir = "in", v = 3.3, alt = ["RXD"] },
  { number = 4, name = "I2C1_SCL", kind = "signal", dir = "io", v = 3.3, alt = ["SCL"] },
  { number = 5, name = "I2C1_SDA", kind = "signal", dir = "io", v = 3.3, alt = ["SDA"] },
  { number = 6, name = "GND", kind = "ground" },
]

[[connectors]]
id = "USB"
name = "USB port (6-pin, USB/DFU key extender)"
type = "usb-ext-6"
gender = "male"
pos = [0.022, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 6
pitch = 0.00125
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pin table from S2; the 6-pin board connector family and its position are estimated (1.25 mm assumed)."
pins = [
  { number = 1, name = "3v3", kind = "power", dir = "out", v = 3.3, i_max = 0.25, note = "3.3v output (0.25A max)" },
  { number = 2, name = "Boot", kind = "signal", dir = "in", note = "DFU boot signal input" },
  { number = 3, name = "VBUS", kind = "power", dir = "in", v = 5.0, note = "5V USB VBUS input" },
  { number = 4, name = "D-", kind = "signal", dir = "io", note = "USB data-" },
  { number = 5, name = "D+", kind = "signal", dir = "io", note = "USB data+" },
  { number = 6, name = "GND", kind = "ground" },
]

[[connectors]]
id = "PWR"
name = "power board pads"
type = "solder-pad"
gender = "neutral"
pos = [-0.0225, 0.0, 0.0]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.004
src = "S2"
fidelity = "datasheet"
pose_rationale = "Pad names and functions from S2 (Power Board table: BAT-IN battery positive, BAT-OUT to ESC positive, GND); pad pitch and position estimated."
pins = [
  { number = "BAT-IN", name = "BAT-IN", kind = "power", dir = "in", v_min = 10.0, v_max = 36.0, note = "connect to battery positive (10~36V, 3~8S)" },
  { number = "GND", name = "GND", kind = "ground" },
  { number = "BAT-OUT", name = "BAT-OUT", kind = "power", dir = "out", note = "connect to ESC positive: the battery voltage passes through the current sense" },
]

