id = "dog-power-distribution-board"
name = "Dog power distribution board (custom 2 oz PCB: 1 XT90 battery input, 4 XT60 leg outputs, 1 XT30 aux output, bus capacitor bank)"
category = "pcb.pdb"
vendor = "napl dog (own design, fabricated by a PCB house)"
part_number = "dog-pdb-v1"
url = "docs/dog/actuator-study.md"

# No off-the-shelf board covers an 8S (33.6 V) bus with four 50 A-class leg feeds (the Matek PDB-XT60 class stops at 4S, 18 V), so the distribution board is a custom part. EVERYTHING here is an estimate of a design not yet drawn.
# Part frame: origin at the board centre, z up.

[params]
mass         = { value = 0.060, unit = "kg", fidelity = "estimated", rationale = "80 x 60 mm 2 oz board (~25 g) + 5 XT60 + 1 XT30 receptacles (~6 g each) + two 470 uF 50 V electrolytics (~6 g each) ~ 60 g." }
length       = { value = 0.080, unit = "m", fidelity = "estimated", rationale = "Layout not drawn; 80 mm fits four XT60 pairs along the edges." }
width        = { value = 0.060, unit = "m", fidelity = "estimated", rationale = "As length." }
height       = { value = 0.016, unit = "m", fidelity = "estimated", rationale = "XT60PW-M height class and capacitor can height." }
i_bus_max    = { value = 90.0, unit = "A", fidelity = "estimated", rationale = "Sized for the study's 87 A simultaneous peak (two 70 A packs in parallel behind a 100 A contactor): an XT90 input (40 A continuous / 90 A burst class) and a 2 oz, 12 mm-wide pour for ~90 A bursts; IPC-2152 rise not computed." }
v_max        = { value = 42.0, unit = "V", fidelity = "estimated", rationale = "33.6 V full pack plus regenerative bus rise margin; 50 V capacitors and XT60 contacts both allow it." }
c_bus        = { value = 9.4e-4, unit = "F", fidelity = "estimated", rationale = "Two 470 uF / 50 V aluminium capacitors to absorb regenerative current from the 12 actuators; sizing from ripple current not computed." }
r_path       = { value = 0.003, unit = "ohm", fidelity = "estimated", rationale = "Input to one leg output, supply path only: 60 mm x 10 mm trace on 2 oz (70 um) copper = 1.72e-8 ohm m x 0.06 m / (0.01 m x 70e-6 m) = 1.5 mOhm, plus the XT90 and XT60 contact pairs (about 0.5 mOhm each, estimated) = 2.5 mOhm, rounded up to 3 mOhm." }

[params.price]
value = 22.0
unit = "USD"
fidelity = "estimated"
rationale = "No quote taken. 5 prototype boards from a Chinese PCB house cost about 10-20 USD for a 2-layer 80 x 60 mm 2 oz board; connectors and capacitors add about 12 USD. 22 USD per board (+-50 %)."

