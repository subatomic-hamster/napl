i_max = { value = 30.0, unit = "A", fidelity = "estimated", rationale = "Three actuators per leg at a few A each in the foot-force worst case; the study uses 3 x 22 A / 8 duty = ~30 A as the simultaneous-peak feed; XT60 continuous rating is 30 A." }

