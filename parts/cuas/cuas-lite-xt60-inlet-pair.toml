id = "cuas-lite-xt60-inlet-pair"
name = "Amass XT60 pair as the supply inlet of cuas-lite (polarity-marked solder cups: + power, - ground)"
category = "connector"
vendor = "Amass (Changzhou Amass Electronics)"
part_number = "XT60-F / XT60-M"
url = "https://mrsdprojects.ri.cmu.edu/2025teamb/wp-content/uploads/sites/84/2025/05/xt60.pdf"

# The same connector pair as parts/drone/amass-xt60.toml, listed again with pin KINDS (+ = power, - = ground) because the pin rules refuse a conductor between a ground pin (the brick's DC-, the Jetson's DC-) and
# a power-kind pin. Electrically one two-conductor pass-through: the brick's cable ends in the F half (cups WF), the robot's inlet is the M half (cups WM); mated, WF.n and WM.n are the same conductor.
# Polarity: XT60 marks the + contact (the housing is keyed, the + side is the one with the symbol on the housing; not in the Amass datasheet text, so contact 1 = + is a convention of this file).
# Part frame: origin at the M half's mating face centre, +z out of the mating face (as amass-xt60).

[params]
current_rated = { value = 30.0, unit = "A", src = "S1", fidelity = "datasheet" }   # "RC" rated current
voltage_rated = { value = 500.0, unit = "V", src = "S1", fidelity = "datasheet" }  # DC 500 V
mass          = { value = 0.0045, unit = "kg", fidelity = "estimated", rationale = "As parts/drone/amass-xt60.toml: 4.5 g per mated pair, an unverified order-of-magnitude assumption." }
price     = { value = 2.0, unit = "USD", fidelity = "derived", derivation = "KiwiQuads lists one Amass XT60 pair (male + female) at 3.49 NZD (https://www.kiwiquads.co.nz/product/amass-xt60-pair/, seen in a web search 2026-10-11, page not fetched) x an assumed 0.58 USD/NZD = 2.0 USD; exchange rate assumed, not looked up." }

[[ports]]
