part_number = "SG92R"
url = "https://www.adafruit.com/product/169"

# Frame: origin on the output axis at the horn-seat (top) face of the case; +z = output axis out of the case;
# x = long case dimension (23 mm), y = short (11 mm); case height 29 mm taken along z (inference from the 23x11x29 listing), so z in [-0.029, 0].
# The output axis is offset from the case centre along x; the offset is not published as text and is left at the origin.
# No current figures are published, so no electrical DC-motor model (R, Kt, eta) can be derived. Spline tooth count not published on the page.

