id = "towerpro-sg92r"
name = "TowerPro SG92R micro PWM servo (coreless, carbon-fibre POM gears)"
category = "motor.servo"
vendor = "TowerPro (sold by Adafruit as product 169)"
part_number = "SG92R"
url = "https://www.adafruit.com/product/169"

# Frame: origin on the output axis at the horn-seat (top) face of the case; +z = output axis out of the case;
# x = long case dimension (23 mm), y = short (11 mm); case height 29 mm taken along z (inference from the 23x11x29 listing), so z in [-0.029, 0].
# The output axis is offset from the case centre along x; the offset is not published as text and is left at the origin.
# No current figures are published, so no electrical DC-motor model (R, Kt, eta) can be derived. Spline tooth count not published on the page.

[params]
mass            = { value = 0.009,   unit = "kg", src = "S1", fidelity = "datasheet" }
price_usd       = { value = 5.95, unit = "USD", fidelity = "estimated", rationale = "Adafruit product 169 (https://www.adafruit.com/product/169) listed 5.95 USD for one on 2026-10-11; recorded as estimated because the page quote in S1 (taken 2026-10-07) does not contain the price. Alternative: MG90D metal-gear servo, Adafruit 1143, 9.95 USD, 13.4 g (not in the library)." }
length          = { value = 0.023,   unit = "m",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.011,   unit = "m",  src = "S1", fidelity = "datasheet" }
height          = { value = 0.029,   unit = "m",  src = "S1", fidelity = "datasheet" }
gear_material   = { value = "POM with carbon-fibre gear", unit = "-", src = "S1", fidelity = "datasheet" }
protocol        = { value = "PWM, 1 us dead band", unit = "-", src = "S1", fidelity = "datasheet" }
position_range  = { value = 3.1416, unit = "rad", src = "S1", fidelity = "datasheet" }  # "approximately 180 degrees (90 in each direction)"
v_nominal           = { value = 4.8,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_min     = { value = 3.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 6.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_4v8   = { value = 10.472, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 60 deg in 0.1 s
stall_torque        = { value = 0.2452, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 2.5 kg-cm; test voltage not stated (4.8 V nominal)
operating_temp_min  = { value = -30,    unit = "degC",  src = "S1", fidelity = "datasheet" }
operating_temp_max  = { value = 60,     unit = "degC",  src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-micro-ears"
gender = "neutral"
pos = [0.0, 0.0, -0.029]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Micro (9 g class) servo mounting ears; hole spacing not published on the vendor page, opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.micro"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Micro-servo spline; tooth count not published on the retrieved page, opaque family tag."

[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame as a port (output-axis point on the horn-seat face), for seating the part by the pose of its frame."

[[ports]]
name = "power_in"
pins = ["SRV.1", "SRV.2"]
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; no current rating published."

[[ports]]
name = "signal"
pins = ["SRV.3"]
kind = "signal"
type = "pwm"
gender = "female"

# Pin level: the 3-pin servo lead. P1 names only the signal wire (orange); the ground / +V pin order is the RC-servo convention, not stated by the sources.
[[connectors]]
id = "SRV"
name = "servo lead (3-pin JR-style plug)"
type = "servo-lead-3"
port_type = "servo-3pin"
gender = "female"
pos = [-0.012, 0.0, -0.01]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "P1"
fidelity = "estimated"
rationale = "P1 states only that the control wire is orange; the plug style, pin order (ground, +V, signal) and 0.1 in pitch are assumed from the standard RC servo lead."
pose_rationale = "Servo case dimensions are not in the sources, so the lead exit is a positional estimate: at the -x end of a micro-size case, lead pointing out along -x."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "V+", kind = "power", dir = "in" },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "in", note = "orange control wire (P1)" },
]

