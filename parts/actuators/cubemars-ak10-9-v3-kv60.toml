id = "cubemars-ak10-9-v3-kv60"
name = "CubeMars AK10-9 V3.0 KV60 robotic actuator (9:1 QDD-class)"
category = "actuator.bldc.qdd"
vendor = "CubeMars"
part_number = "AK10-9 V3.0 KV60"
url = "https://www.cubemars.com/product/ak10-9-v3-0-kv60-robotic-actuator.html"

# Frame: origin on the output axis at the output face; +z = out of the output face (output axis); cylindrical body, diameter 98 mm, length 61.7 mm, occupies z in [-0.0617, 0].
# Which end carries the output flange, and the flange/mounting hole patterns, are in CubeMars' drawings (not retrieved); ports below are opaque family tags.
# Efficiency is NOT derivable: "Peak current" is DC bus current (ADC) and no gearbox efficiency is published. No back-drive torque is published for this model.

[params]
mass               = { value = 0.940,   unit = "kg",     src = "S1", fidelity = "datasheet" }
body_diameter      = { value = 0.098,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_length        = { value = 0.0617,  unit = "m",      src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 9.0,     unit = "1",      src = "S1", fidelity = "datasheet" }
v_rated            = { value = 48.0,    unit = "V",      src = "S1", fidelity = "datasheet" }
torque_rated       = { value = 18.0,    unit = "N*m",    src = "S1", fidelity = "datasheet" }
torque_peak        = { value = 53.0,    unit = "N*m",    src = "S1", fidelity = "datasheet" }
speed_rated        = { value = 24.609,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 235 rpm
speed_no_load      = { value = 33.510,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 320 rpm, output side
current_rated      = { value = 10.7,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
current_peak       = { value = 31.9,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
power_rated        = { value = 442.0,   unit = "W",      src = "S2", fidelity = "datasheet" }
kv                 = { value = 60.0,    unit = "rpm/V",  src = "S1", fidelity = "datasheet" }
kt_motor_published = { value = 0.16,    unit = "N*m/A",  src = "S1", fidelity = "datasheet" }  # motor side
ke_published       = { value = 16.7,    unit = "V/krpm", src = "S1", fidelity = "datasheet" }
r_phase_to_phase   = { value = 0.248,   unit = "ohm",    src = "S1", fidelity = "datasheet" }
l_phase_to_phase   = { value = 2.13e-4, unit = "H",      src = "S1", fidelity = "datasheet" }
rotor_inertia      = { value = 1.002e-4, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # 1002 g.cm^2, motor-side rotor assumed
motor_constant_km  = { value = 0.32,    unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }
tau_mechanical     = { value = 5.0e-4,  unit = "s",      src = "S1", fidelity = "datasheet" }  # 0.5 ms
tau_electrical     = { value = 9.3e-4,  unit = "s",      src = "S1", fidelity = "datasheet" }  # 0.93 ms
pole_pairs         = { value = 21,      unit = "1",      src = "S1", fidelity = "datasheet" }
slots              = { value = 36,      unit = "1",      src = "S1", fidelity = "datasheet" }
winding            = { value = "star",  unit = "-",      src = "S1", fidelity = "datasheet" }
encoder_inner      = { value = "magnetic, 21 bit", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_outer      = { value = "magnetic, 15 bit", unit = "-", src = "S1", fidelity = "datasheet" }

# --- derived electrical model ---
ke_si = { value = 0.15948, unit = "V*s/rad", fidelity = "derived", derivation = "KE = 16.7 V/krpm = 16.7/104.72 = 0.15948 V*s/rad (line-to-line, motor side). Agrees with KT 0.16 and with 60/(2*pi*KV) = 60/(2*pi*60) = 0.15915." }
r_phase_equivalent_wye = { value = 0.124, unit = "ohm", fidelity = "derived", derivation = "Equivalent-wye phase resistance = R_phase_to_phase / 2 = 0.248/2 = 0.124 ohm (star winding)." }
kt_output_ideal = { value = 1.44, unit = "N*m/A", fidelity = "derived", derivation = "KT_motor * N = 0.16 * 9 = 1.44 N*m per A (lossless gearbox). Check: 31.9 A * 1.44 = 45.9 N*m vs published 53 N*m peak (ratio 1.15; DC-bus current is not phase current, so only an approximate cross-check)." }
j_reflected_output = { value = 8.116e-3, unit = "kg*m^2", fidelity = "estimated", rationale = "J_rotor * N^2 = 1.002e-4 * 81. CubeMars does not state whether the published inertia is rotor-only or reflected; rotor-only is the usual convention for this field." }
noload_speed_check = { value = 320.0, unit = "rpm", fidelity = "derived", derivation = "48 V * KV 60 / 9 = 320 rpm, matching the published no-load speed." }

[[ports]]
name = "mount"
kind = "mech"
type = "bolt-pattern.cubemars-ak10-9-v3-base"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Body mounting pattern is in CubeMars' drawings (not retrieved); opaque family tag. Symmetry 1 is the conservative default."

[[ports]]
name = "output"
kind = "mech"
type = "flange.cubemars-ak10-9-v3-output"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Output flange pattern is in CubeMars' drawings (not retrieved); opaque family tag."

[[ports]]
name = "power"
pins = ["PWR.1", "PWR.2"]
kind = "power"
type = "xt30-2+2"
gender = "male"
role = "sink"
v_max = { value = 48.0, unit = "V", src = "S1", fidelity = "datasheet" }  # rated voltage; absolute maximum not published on the page
i_max = { value = 10.7, unit = "A", src = "S1", fidelity = "datasheet" }  # rated ADC
i_peak = { value = 31.9, unit = "A", src = "S1", fidelity = "datasheet" }  # peak ADC
note = "Black XT30 2+2 connector integrates power and CAN (S2). Minimum operating voltage not published."

[[ports]]
name = "can"
pins = ["PWR.3", "PWR.4"]
kind = "signal"
type = "can"
gender = "male"
note = "CAN is on the same black XT30 2+2 connector as power (S2). Bit rate and logic levels are in the product manual, not retrieved."

[[ports]]
name = "uart"
pins = ["UART.1", "UART.2", "UART.3"]
kind = "signal"
type = "cjt-3pin-serial"
gender = "male"
note = "White CJT-3pin connector for the upper computer and parameter tuning (S2). Levels not retrieved."

# Pin level (literature): pin order and colours are from the CubeMars AK V3 driver-board manual (P1), which lists the same XT30PW(2+2)-M and A1257WR-S-3P onboard connectors as S2; the actuator page itself gives no pin table.
[[connectors]]
id = "PWR"
name = "XT30PW(2+2)-M power + CAN"
type = "xt30-2+2"
port_type = "xt30-2+2"
gender = "male"
pos = [0.03, 0.0, -0.0617]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
src = "P1"
fidelity = "literature"
rows = 1
cols = 4
pitch = 0.0025
rationale = "Pin order is from the AK54 V3 driver-board manual, not this actuator's own sheet; same connector part number. Pin pitch (2.5 mm, in-line) is an estimate; the manual gives no dimensions."
pose_rationale = "Connector location on the rear cover is not documented in retrieved text: placed on the rear face at z = -body_length, offset 30 mm from the axis (positional estimate)."
pins = [
  { number = 1, name = "V+", kind = "power", dir = "in", v_max = 48.0, i_max = 10.7, note = "red" },
  { number = 2, name = "GND", kind = "ground", note = "black" },
  { number = 3, name = "CAN_H", kind = "signal", dir = "io", note = "white" },
  { number = 4, name = "CAN_L", kind = "signal", dir = "io", note = "blue" },
]

[[connectors]]
id = "UART"
name = "A1257WR-S-3P serial"
type = "cjt-3pin-serial"
port_type = "cjt-3pin-serial"
gender = "male"
pos = [-0.03, 0.0, -0.0617]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
src = "P1"
fidelity = "literature"
rows = 1
cols = 3
pitch = 0.00125
rationale = "Pin order is from the AK54 V3 driver-board manual (a second CubeMars manual lists TX and RX swapped); not this actuator's own sheet. Pitch 1.25 mm is inferred from the A1257 series name, not stated."
pose_rationale = "Rear-face placement is a positional estimate; actual location is not in retrieved text."
pins = [
  { number = 1, name = "GND", kind = "ground", note = "black" },
  { number = 2, name = "RX", kind = "signal", dir = "in", note = "serial signal input, yellow" },
  { number = 3, name = "TX", kind = "signal", dir = "out", note = "serial signal output, green" },
]

