id = "cubemars-ak70-9-v3-kv60"
name = "CubeMars AK70-9 V3.0 KV60 robotic actuator (9:1 QDD-class)"
category = "actuator.bldc.qdd"
vendor = "CubeMars"
part_number = "AK70-9 V3.0 KV60"
url = "https://www.cubemars.com/product/ak70-9-v3-0-kv60-robotic-actuator.html"

# Frame: origin on the output axis at the output face; +z = out of the output face (output axis); cylindrical body, diameter 89 mm, length 49 mm, occupies z in [-0.049, 0].
# Which end carries the output flange, and the flange/mounting hole patterns, are in CubeMars' drawings (not retrieved); ports below are opaque family tags.
# Efficiency is NOT derivable: "Peak current" is DC bus current (ADC) and no gearbox efficiency is published.

[mirror]
symmetry = "xz"  # cylindrical body, connectors on the x axis (y = 0): the mirrored copy is the same part

[params]
mass             = { value = 0.540,   unit = "kg",     src = "S1", fidelity = "datasheet" }
body_diameter      = { value = 0.089,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_length        = { value = 0.049,   unit = "m",      src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 9.0,     unit = "1",      src = "S1", fidelity = "datasheet" }
v_rated            = { value = 48.0,    unit = "V",      src = "S1", fidelity = "datasheet" }
torque_rated       = { value = 8.5,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
torque_peak        = { value = 29.2,    unit = "N*m",    src = "S1", fidelity = "datasheet" }
speed_rated        = { value = 27.227,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 260 rpm
speed_no_load      = { value = 33.510,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 320 rpm, output side
current_rated      = { value = 6.25,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
current_peak       = { value = 23.8,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
power_rated        = { value = 231.0,   unit = "W",      src = "S2", fidelity = "datasheet" }
kv                 = { value = 60.0,    unit = "rpm/V",  src = "S1", fidelity = "datasheet" }
kt_motor_published = { value = 0.159,   unit = "N*m/A",  src = "S1", fidelity = "datasheet" }  # motor side
ke_published       = { value = 16.7,    unit = "V/krpm", src = "S1", fidelity = "datasheet" }
r_phase_to_phase   = { value = 0.475,   unit = "ohm",    src = "S1", fidelity = "datasheet" }
l_phase_to_phase   = { value = 4.08e-4, unit = "H",      src = "S1", fidelity = "datasheet" }
rotor_inertia      = { value = 8.66307e-5, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # 866.307 g.cm^2, motor-side rotor assumed
motor_constant_km  = { value = 0.23,    unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }
back_drive_torque  = { value = 0.8,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
backlash           = { value = 5.236e-3, unit = "rad",   src = "S1", fidelity = "datasheet" }  # 18 arcmin
tau_mechanical     = { value = 1.7e-3,  unit = "s",      src = "S1", fidelity = "datasheet" }  # 1.7 ms
pole_pairs         = { value = 21,      unit = "1",      src = "S1", fidelity = "datasheet" }
slots              = { value = 36,      unit = "1",      src = "S1", fidelity = "datasheet" }
winding            = { value = "delta", unit = "-",      src = "S1", fidelity = "datasheet" }
encoder_inner      = { value = "magnetic, 21 bit", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_outer      = { value = "magnetic, 21 bit", unit = "-", src = "S1", fidelity = "datasheet" }
load_rating_dynamic = { value = 1890.0, unit = "N",      src = "S1", fidelity = "datasheet" }  # basic dynamic load rating
load_rating_static  = { value = 2140.0, unit = "N",      src = "S1", fidelity = "datasheet" }  # basic static load rating

# --- derived electrical model ---
ke_si = { value = 0.15948, unit = "V*s/rad", fidelity = "derived", derivation = "KE = 16.7 V/krpm = 16.7/104.72 = 0.15948 V*s/rad (line-to-line, motor side). Agrees with KT 0.159 and with 60/(2*pi*KV) = 0.15915." }
r_phase_equivalent_wye = { value = 0.2375, unit = "ohm", fidelity = "derived", derivation = "Equivalent-wye phase resistance = R_phase_to_phase / 2 = 0.475/2 = 0.2375 ohm (valid for any winding connection when R is measured line-to-line)." }
kt_output_ideal = { value = 1.431, unit = "N*m/A", fidelity = "derived", derivation = "KT_motor * N = 0.159 * 9 = 1.431 N*m per A (lossless gearbox). Check: 23.8 A * 1.431 = 34.1 N*m vs published 29.2 N*m peak (ratio 1.17; DC-bus current is not phase current, so only an approximate cross-check)." }
j_reflected_output = { value = 7.017e-3, unit = "kg*m^2", fidelity = "estimated", rationale = "J_rotor * N^2 = 8.66307e-5 * 81. CubeMars does not state whether the published inertia is rotor-only or reflected; rotor-only is the usual convention for this field." }
noload_speed_check = { value = 320.0, unit = "rpm", fidelity = "derived", derivation = "48 V * KV 60 / 9 = 320 rpm, matching the published no-load speed." }
kv_output = { value = 6.667, unit = "rpm/V", fidelity = "derived", derivation = "KV 60 rpm/V (motor side) / N 9 = 6.667 rpm/V at the output." }
kt_motor = { value = 0.15948, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke (motor side); the published KT 0.159 agrees." }
efficiency = { value = 0.855, unit = "1", fidelity = "derived", derivation = "eta = torque_peak / (kt_motor * N * current_peak) = 29.2 / (0.15948 * 9 * 23.8) = 0.855. Effective figure: gearbox loss lumped with the DC-bus-vs-phase current definition (see kt_output_ideal)." }
price = { value = 398.90, unit = "USD", fidelity = "datasheet", src = "S3" }  # CubeMars product page, seen 2026-10-16 and again 2026-10-18, USD (US storefront), ex shipping; driver board standard

# --- Qdd device params (leg study, docs/dog/leg-study.md; same field names as steadywin-gim8108-8 so a leg's device map reads them) ---
i_limit_phase = { value = 23.8, unit = "A", fidelity = "derived", derivation = "= current_peak 23.8 A (ADC treated as the winding current, as for the GIM8108-8): Kt N eta i_limit = 0.15948 x 9 x 0.855 x 23.8 = 29.2 N*m = torque_peak (efficiency was derived from the same current)." }
c_th_winding = { value = 60.0, unit = "J/K", fidelity = "estimated", rationale = "Not published. Same motor class as the GIM8108-8 (21 pole pairs, 36 slots, 89 mm vs 92 mm): its 60 J/K lumped winding node taken (+-50 %)." }
r_th_winding = { value = 2.40, unit = "K/W", fidelity = "derived", derivation = "current_rated 6.25 A must settle at 80 degC from 25 degC under the Qdd thermal law (docs/models.md 'Qdd'; same method as the GIM8108-8 file): R(80) = 0.475 x 1.236 = 0.587 ohm, P = 6.25^2 x 0.587 = 22.9 W, R_th = 55 K / 22.9 W = 2.40 K/W." }
encoder_cpr = { value = 65536, unit = "1", fidelity = "estimated", rationale = "The MIT-mode position field is 16 bit; the 21 bit magnetic encoders (S1) are finer than the protocol reports." }
can_cmd_hz = { value = 1000.0, unit = "Hz", fidelity = "estimated", rationale = "Driver command processing rate; MIT-mode drivers of this class process CAN frames at 1 kHz or more. The dog sends 500 Hz (spec s6)." }
can_latency = { value = 0.001, unit = "s", fidelity = "estimated", rationale = "One CAN frame at 1 Mbit/s (~0.13 ms) + driver loop; 1 ms (one physics tick) taken." }
mit_kp_max = { value = 500.0, unit = "N*m/rad", fidelity = "estimated", rationale = "MIT-mode protocol range convention (KP 0..500)." }
mit_kd_max = { value = 5.0, unit = "N*m*s/rad", fidelity = "estimated", rationale = "MIT-mode protocol range convention (KD 0..5)." }
mit_tau_ff_max = { value = 29.2, unit = "N*m", fidelity = "derived", derivation = "= torque_peak (output side): a larger feed-forward is saturated by i_limit_phase anyway." }
can_timeout = { value = 0.1, unit = "s", fidelity = "estimated", rationale = "Command-loss watchdog of the driver; 0.1 s = 50 missed 500 Hz frames." }
kd_timeout = { value = 1.0, unit = "N*m*s/rad", fidelity = "estimated", rationale = "Damping-mode gain on command loss (timeout_mode 0): soft enough not to slam a falling leg." }
temp_fault = { value = 100.0, unit = "degC", fidelity = "estimated", rationale = "Driver over-temperature threshold not retrieved; 100 degC as for the GIM8108-8 file." }
temp_derate_start = { value = 80.0, unit = "degC", fidelity = "estimated", rationale = "20 K below temp_fault (linear current derate, docs/models.md 'Qdd')." }

