title = "Pakronics Feetech SCS0009 product page (gear ratio, rated torque, Amazing Hand use)"
accessed = "2026-10-07"
quote = "SCS0009 is 6V 2.3kg serial bus ultra-compact smart servo, with plastic case, core motor, 1:416 metal gearbox and 10 bit high precision magnetic coding sensor. The stall torque is 2.3 kg. cm and the rated torque is 0.75kg. cm. Because of its compact size, SCS0009 can be used as actuators in dexterous hand or microrobotics, such as Amazing Hand."
