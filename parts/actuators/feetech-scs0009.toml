id = "feetech-scs0009"
name = "Feetech SCS0009 6V 2.3kg.cm 1/416 micro serial bus servo (SC-0090-C001)"
category = "motor.servo"
vendor = "Feetech (Shenzhen Feite Model Co., Ltd.)"
part_number = "SCS0009 / SC-0090-C001"
url = "https://aifitlab.com/products/feetech-scs0009-servo-motor"

# Frame: origin on the output axis at the horn-side (top) face of the case; +z = output axis out of the case;
# x = long case dimension (23.2 mm), y = short (12.1 mm). Case occupies z in [-0.02525, 0].
# Micro servo used in Pollen Robotics' Amazing Hand (S2). Potentiometer-free 10-bit magnetic sensing, 300 deg travel.

[params]
mass            = { value = 0.0132,  unit = "kg",  src = "S1", fidelity = "datasheet" }
length          = { value = 0.0232,  unit = "m",   src = "S1", fidelity = "datasheet" }
width           = { value = 0.0121,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.02525, unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 416,     unit = "1",   src = "S2", fidelity = "datasheet" }
gear_material   = { value = "copper + steel gears, PC case, core motor", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "20T, OD 3.95 mm (POM horn)", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 1024, unit = "counts/300deg", src = "S1", fidelity = "datasheet" }  # "300 deg (when 0~1024)"
position_range  = { value = 5.236, unit = "rad", src = "S1", fidelity = "datasheet" }  # 300 deg
protocol        = { value = "Half-duplex asynchronous serial, ID 0-253", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 38400,   unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 1000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -15, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 70,  unit = "degC", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at 6 V (kg.cm converted with g = 9.80665) ---
v_operating_min     = { value = 4.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 7.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 10.472, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.1 s/60deg
no_load_current_6v  = { value = 0.15,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_6v     = { value = 0.2255, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 2.3 kg.cm
stall_current_6v    = { value = 1.0,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_6v     = { value = 0.0687, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 0.7 kg.cm (S2 says 0.75 kg.cm)

# --- DC-motor equivalent (motor side), derived from the 6 V point ---
r_effective = { value = 6.0, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 6 V / 1.0 A = 6.0 ohm (includes driver and lead resistance at stall)." }
omega_noload_motor_6v = { value = 4356.4, unit = "rad/s", fidelity = "derived", derivation = "N * omega_out = 416 * (pi/3 rad / 0.1 s = 10.472 rad/s) = 4356.4 rad/s (41600 RPM)." }
ke = { value = 0.001171, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R)/(N*omega_out) = (6 - 0.15*6.0)/(416*10.472) = 5.1/4356.4 = 1.171e-3 V*s/rad." }
kt_motor = { value = 0.001171, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.545, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) = 0.2255/(416*0.001171*(1.0-0.15)) = 0.545 (plausible for a 416:1 multi-stage micro train)." }
friction_torque_motor_noload = { value = 0.000176, unit = "N*m", fidelity = "derived", derivation = "Kt*I0 = 0.001171*0.15 = 1.76e-4 N*m at the motor shaft." }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.feetech-micro-scs0009-base"
gender = "neutral"
pos = [0.0, 0.0, -0.02525]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Hole pattern only in Feetech's drawing / STEP, not retrievable as text; opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.20t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 20
note = "20T spline, OD 3.95 mm."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-bus-3pin"
gender = "female"
role = "sink"
v_max = { value = 7.4, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 6 V
note = "Ships with a JST wire + 3-pin cable (S2 parts list); exact housing not stated."

[[ports]]
name = "bus"
kind = "signal"
type = "feetech-ttl"
gender = "female"

