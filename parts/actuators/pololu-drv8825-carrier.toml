note = "16 header holes (male 0.1 in pins supplied, unsoldered); Pololu lists this in its '16-pin Stepper Motor Drivers' family and calls it a higher-performance drop-in replacement for its A4988 carriers (S2). Exact row spacing not extracted from the page text."

