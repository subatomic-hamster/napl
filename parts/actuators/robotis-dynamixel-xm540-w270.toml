id = "robotis-dynamixel-xm540-w270"
name = "ROBOTIS DYNAMIXEL XM540-W270-T/R 12V 272.5:1 smart servo"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XM540-W270-T (TTL) / XM540-W270-R (RS-485)"
url = "https://emanual.robotis.com/docs/en/dxl/x/xm540-w270/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# Case 33.5 x 58.5 x 44 mm (W x H x D per ROBOTIS); D is taken as the extent along the output axis (inference), so the case occupies z in [-0.044, 0].
# Output axis in-plane offset is only in the drawing PDF/STEP; left at the origin.
# ROBOTIS publishes no no-load current, so Ke is computed with I0*R neglected. Same motor as XM540-W150.

[params]
mass            = { value = 0.165,   unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.0335,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.0585,  unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.044,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 272.5,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "full metal gears; metal front/middle case, plastic back; coreless motor", unit = "-", src = "S1", fidelity = "datasheet" }
backlash        = { value = 0.004363, unit = "rad", src = "S1", fidelity = "datasheet" }  # 15 arcmin (0.25 deg)
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute, ams AS5045
protocol        = { value = "DYNAMIXEL RS-485 or TTL multidrop, half-duplex async serial 8N1 (TTL) / async serial 8N1 (RS-485), IDs 0-252", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4500000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "TTL: JST EHR-03 / B3B-EH-A (GND, VDD, DATA); RS-485: JST EHR-04 / B4B-EH-A (GND, VDD, DATA+, DATA-); plus Molex external-port and dual-joint connectors", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 80, unit = "degC", src = "S1", fidelity = "datasheet" }
standby_current = { value = 0.040, unit = "A", src = "S1", fidelity = "datasheet" }
radial_load_max = { value = 40, unit = "N", src = "S1", fidelity = "datasheet" }  # 10 mm away from the horn
axial_load_max  = { value = 20, unit = "N", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "ROBOTIS X540 horn (spline/bolt circle only in the XM540 drawing PDF/STEP, not retrievable as text)", unit = "-", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at three supply voltages ---
v_nominal           = { value = 12.0,   unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 12.0 [V]"
v_operating_min     = { value = 10.0,   unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 14.8,   unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_11v1   = { value = 10.0,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_11v1  = { value = 4.2,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_11v1  = { value = 2.932,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 28 rev/min
stall_torque_12v    = { value = 10.6,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_12v   = { value = 4.4,    unit = "A",     src = "S1", fidelity = "datasheet" }
kt_output_12v       = { value = 2.409,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }
no_load_speed_12v   = { value = 3.142,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 30 rev/min
stall_torque_14v8   = { value = 12.9,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_14v8  = { value = 5.5,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_14v8  = { value = 3.875,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 37 rev/min

# --- DC-motor equivalent (motor side), derived from the three points (I0 unpublished, neglected) ---
r_effective = { value = 2.69, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall: 11.1 V/4.2 A = 2.643, 12 V/4.4 A = 2.727, 14.8 V/5.5 A = 2.691 ohm; mean 2.69 ohm (includes driver and lead resistance; identical to XM540-W150)." }
ke = { value = 0.013976, unit = "V*s/rad", fidelity = "derived", derivation = "Ke ~ V/(N*omega_out) with I0*R neglected: 11.1 V -> 13.892e-3, 12 V -> 14.017e-3, 14.8 V -> 14.017e-3 (omega_out = 28/30/37 rev/min * 2*pi/60, N = 272.5); mean 13.976e-3 V*s/rad (0.6% from XM540-W150)." }
kt_motor = { value = 0.013976, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.625, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Ke*I_stall): 11.1 V 0.629, 12 V 0.631, 14.8 V 0.614; mean 0.625." }

[tables.datasheet_points]
columns = ["voltage_V", "stall_torque_Nm", "stall_current_A", "kt_output_Nm_per_A", "no_load_rpm"]
rows = [[11.1, 10.0, 4.2, 2.381, 28], [12.0, 10.6, 4.4, 2.409, 30], [14.8, 12.9, 5.5, 2.345, 37]]
src = "S1"
fidelity = "datasheet"

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-x540-frame"
gender = "neutral"
pos = [0.0, 0.0, -0.044]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Frame/side mounting points per ROBOTIS drawing (not retrievable as text); opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dxl-x540"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "ROBOTIS X540 output horn interface; spline/bolt circle not published as text."

[[ports]]
name = "power_in"
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "sink"
v_max = { value = 14.8, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 5.5, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 14.8 V; no continuous rating published
note = "TTL connector (JST EHR-03); the RS-485 connector (JST EHR-04) carries the same VDD/GND daisy-chain."

[[ports]]
name = "bus_ttl"
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
note = "TTL half-duplex multidrop on JST EHR-03; ROBOTIS notes the reference circuit targets 5 V or 5 V-tolerant MCUs."

[[ports]]
name = "bus_rs485"
kind = "signal"
type = "rs485"
gender = "female"
note = "RS-485 on JST EHR-04 (DATA+/DATA-); same bus as TTL, alternative physical layer."

