id = "hitec-hs-5585mh"
name = "Hitec HS-5585MH standard-size hobby servo"
category = "motor.servo"
vendor = "Hitec RCD (via ServoCity)"
part_number = "HS-5585MH"
url = "https://www.servocity.com/hs-5585mh-servo/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The ServoCity Specs tab gives no case dimensions, so no height param; the base port sits at z=0 and is positional only.

[params]
mass = { value = 0.0600, unit = "kg", src = "S1", fidelity = "datasheet" }  # 2.10oz (60g)
servo_size_class = { value = "Standard", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline = { value = "C24T Spline", unit = "-", src = "S1", fidelity = "datasheet" }
gear_material = { value = "Metal", unit = "-", src = "S1", fidelity = "datasheet" }
motor_type = { value = "Coreless", unit = "-", src = "S1", fidelity = "datasheet" }
output_shaft_support = { value = "Dual Ball Bearings", unit = "-", src = "S1", fidelity = "datasheet" }
protocol = { value = "PWM 750-2250us, pulse amplitude 3-5V, deadband 2us", unit = "-", src = "S1", fidelity = "datasheet" }
position_range_reprogrammed = { value = 3.4907, unit = "rad", src = "S1", fidelity = "datasheet" }  # 200°
position_range = { value = 2.0595, unit = "rad", src = "S1", fidelity = "datasheet" }  # 118°
v_operating_min = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage; page Voltage Range: 6.0V - 7.4V
v_operating_max = { value = 7.4, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage; page Voltage Range: 6.0V - 7.4V
no_load_speed_7v4 = { value = 7.480, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.14sec/60°
no_load_speed_6v0 = { value = 6.160, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.17sec/60°
stall_torque_6v0 = { value = 1.3699, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 194 oz-in (14 kg.cm)
stall_torque_7v4 = { value = 1.6665, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 236 oz-in (17 kg.cm)
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60, unit = "degC", src = "S1", fidelity = "datasheet" }
feedback = { value = "5KΩ Potentiometer", unit = "-", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-standard-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Standard-size hobby servo mounting ears; hole spacing and case height not on the page, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.c24t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 24
note = "Hitec C24T output spline (24 teeth); horns are not interchangeable across spline families."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 7.4, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; i_max not stated unless a stall current is tabulated."

[[ports]]
name = "signal"
kind = "signal"
type = "pwm"
gender = "female"
level = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lower end of the 3-5V pulse amplitude

