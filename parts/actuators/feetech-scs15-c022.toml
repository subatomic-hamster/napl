id = "feetech-scs15-c022"
name = "Feetech SCS15-C022 7.4V 15.6kg.cm serial bus servo"
category = "motor.servo"
vendor = "Feetech (Shenzhen Feite Model Co., Ltd.)"
part_number = "SCS15-C022"
url = "https://aifitlab.com/products/feetech-scs15-servo-motor"

# Frame: origin on the output axis at the horn-side (top) face of the case; +z = output axis out of the case;
# x = long case dimension (40.2 mm), y = short (20.2 mm). Case occupies z in [-0.040, 0].
# Potentiometer-class SCS series (220 deg travel). Gear ratio not published on the retrieved page: output-referred model only.

[params]
mass            = { value = 0.0582,  unit = "kg",  src = "S1", fidelity = "datasheet" }
length          = { value = 0.0402,  unit = "m",   src = "S1", fidelity = "datasheet" }
width           = { value = 0.0202,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.040,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "copper gears, PA case, core motor, ball bearings", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "25T, OD 5.9 mm", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 1023, unit = "counts/220deg", src = "S1", fidelity = "datasheet" }  # "220 deg (when 0~1023)", 0.215 deg/pulse
position_range  = { value = 3.840, unit = "rad", src = "S1", fidelity = "datasheet" }  # 220 deg
protocol        = { value = "Half-duplex asynchronous serial, ID 0-253", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 38400,   unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 1000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -10, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60,  unit = "degC", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at 7.4 V (kg.cm converted with g = 9.80665) ---
v_nominal           = { value = 7.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_min     = { value = 4.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 8.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_7v4   = { value = 6.7128, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.156 s/60deg
no_load_current_7v4 = { value = 0.27,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_7v4    = { value = 1.5298, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 15.6 kg.cm
stall_current_7v4   = { value = 2.5,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_7v4    = { value = 0.5099, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 5.2 kg.cm

# --- DC-motor equivalent, derived (output-referred) ---
r_effective = { value = 2.96, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 7.4 V / 2.5 A = 2.96 ohm (includes driver and lead resistance at stall)." }
ke_out = { value = 0.9833, unit = "V*s/rad", fidelity = "derived", derivation = "Output-referred N*Ke = (V - I0*R)/omega_out = (7.4 - 0.27*2.96)/(pi/3 / 0.156 = 6.7128 rad/s) = 0.9833 V*s/rad. Motor-side Ke needs the unpublished gear ratio." }
gear_efficiency = { value = 0.698, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(ke_out*(I_stall - I0)) = 1.5298/(0.9833*(2.5-0.27)) = 0.698; the gear ratio cancels." }
friction_torque_out_noload = { value = 0.2655, unit = "N*m", fidelity = "derived", derivation = "ke_out*I0 = 0.9833*0.27 = 0.2655 N*m of no-load loss referred to the output shaft." }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.feetech-scs15-base"
gender = "neutral"
pos = [0.0, 0.0, -0.040]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Hole pattern only in Feetech's drawing PDF / STEP (links on the vendor page), not retrievable as text; opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.25t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 25
note = "25T spline, OD 5.9 mm."

[[ports]]
name = "power_in"
pins = ["BUS.1", "BUS.2"]
kind = "power"
type = "servo-bus-3pin"
gender = "female"
role = "sink"
v_max = { value = 8.4, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 2.5, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 7.4 V
note = "Connector housing not stated on the vendor page (15 cm lead)."

[[ports]]
name = "bus"
pins = ["BUS.3"]
kind = "signal"
type = "feetech-ttl"
gender = "female"

# Pin level: the 3-pin TTL bus lead (15 cm lead). The vendor page gives no housing, pitch or pin order; GND / VCC / signal is the Feetech bus-servo order seen on the STS3215 page.
[[connectors]]
id = "BUS"
name = "bus lead (3-pin, 150 mm)"
type = "servo-bus-3pin"
port_type = "servo-bus-3pin"
gender = "female"
pos = [-0.02, 0.0, -0.012]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S1"
fidelity = "estimated"
rationale = "The vendor page gives the lead length but no housing, pitch or pin order: GND, VCC, signal at 2.54 mm is assumed from the STS3215 listing of the same vendor."
pose_rationale = "Case dimensions are not in the sources, so the connector position is a positional estimate (end of the case, near the base)."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "VCC", kind = "power", dir = "in" },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "io", note = "TTL serial bus" },
]

