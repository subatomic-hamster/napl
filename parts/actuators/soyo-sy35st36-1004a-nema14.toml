id = "soyo-sy35st36-1004a-nema14"
name = "SOYO SY35ST36-1004A NEMA 14 bipolar stepper motor, 35x36 mm, 1.0 A (Pololu 1209)"
category = "motor.stepper"
vendor = "SOYO / Changzhou Songyang Machinery & Electronics (Pololu item 1209)"
part_number = "SY35ST36-1004A"
url = "https://www.pololu.com/product/1209"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.036, 0]. The manufacturer PDF linked from Pololu has an unusable text layer (garbled), so only the Pololu page is used.

[params]
mass               = { value = 0.180,   unit = "kg",    src = "S1", fidelity = "datasheet" }
flange_size        = { value = 0.035,   unit = "m",     src = "S1", fidelity = "datasheet" }  # 35 mm square
body_length        = { value = 0.036,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S1", fidelity = "datasheet" }  # 200 steps/rev = 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
leads              = { value = 4,       unit = "1",     src = "S1", fidelity = "datasheet" }
rated_current      = { value = 1.0,     unit = "A",     src = "S1", fidelity = "datasheet" }  # per coil
rated_voltage      = { value = 2.7,     unit = "V",     src = "S1", fidelity = "datasheet" }
phase_resistance   = { value = 2.7,     unit = "ohm",   src = "S1", fidelity = "datasheet" }  # per coil
phase_inductance   = { value = 0.0043,  unit = "H",     src = "S1", fidelity = "datasheet" }  # per coil
holding_torque     = { value = 0.14123, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 20 oz.in (Pololu text also says 1.4 kg-cm)
shaft_diameter     = { value = 0.005,   unit = "m",     src = "S1", fidelity = "datasheet" }
shaft_type         = { value = "5 mm D-shaft (0.5 mm flat), 21 mm long, 2 ball bearings", unit = "-", src = "S2", fidelity = "datasheet" }
kt_equiv_phase = { value = 0.0999, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.14123 N*m / (1.4142 * 1.0 A) = 0.0999 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }

[[ports]]
name = "face"
kind = "mech"
type = "bolt-pattern.nema14"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "NEMA 14 square flange; hole spacing/thread not retrievable as text, opaque family tag."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.5d"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "5 mm D-shaft, 21 mm long."

[[ports]]
name = "phases"
kind = "power"
type = "stepper-bipolar-4wire"
gender = "neutral"
role = "sink"
i_max = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }  # rated current per phase
note = "Bare 30 cm leads; drive with a chopper (current-limited) driver. Rotor inertia is not published for this part."

