id = "generic-17hs4401s-nema17-42x40"
name = "17HS4401S NEMA 17 bipolar stepper, 42x40 mm, 1.7 A, 43 N*cm (generic 17HS4401 class, as sold by Handson Technology and HANPOSE)"
category = "motor.stepper"
vendor = "generic (17HS4401S; datasheet by Handson Technology, also sold as HANPOSE 17HS4401S)"
part_number = "17HS4401S"
url = "https://www.handsontec.com/dataspecs/17HS4401S.pdf"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides. Body occupies z in [-0.040, 0]. Same frame as parts/actuators/soyo-sy42sth47-1206a-nema17.toml.
# The common cheap 42x40 NEMA 17: 200 steps/rev, 1.7 A per phase, 43 N*cm. The datasheet (S1) gives no shaft length, flange size or wire colours; the flange (42.3 mm) is the NEMA 17 standard and is quoted by S3, the shaft length by S2.
# The 31 mm M3 hole pattern and the 22 mm pilot are NEMA 17 standard dimensions, adopted as in the SOYO NEMA 17 files of this library (inference); they are not printed in S1's text (only in its drawing).
# Several resellers copy this motor with slightly different electrical figures (S2: 1.5 A, 1.8 ohm, 3.8 mH for the HANPOSE; S3: 1.7 A, 1.5 ohm, 2.8 mH): the values here are the Handson datasheet's.

[params]
mass               = { value = 0.280, unit = "kg", src = "S1", fidelity = "datasheet" }
flange_size        = { value = 0.0423, unit = "m", src = "S3", fidelity = "literature" }   # 42.3 mm, the NEMA 17 square
body_length        = { value = 0.040, unit = "m", src = "S1", fidelity = "datasheet" }   # 'Motor Length: 40mm', without the shaft
step_angle         = { value = 0.031416, unit = "rad", src = "S1", fidelity = "datasheet" }   # 1.8 deg
steps_per_rev      = { value = 200, unit = "1", src = "S1", fidelity = "datasheet" }
leads              = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
rated_current      = { value = 1.7, unit = "A", src = "S1", fidelity = "datasheet" }   # per phase
rated_voltage      = { value = 2.6, unit = "V", src = "S1", fidelity = "datasheet" }   # per phase
phase_resistance   = { value = 1.5, unit = "ohm", src = "S1", fidelity = "datasheet" }   # +-10 %
phase_inductance   = { value = 0.0028, unit = "H", src = "S1", fidelity = "datasheet" }   # 2.8 mH +-20 % at 1 kHz
holding_torque     = { value = 0.43, unit = "N*m", src = "S1", fidelity = "datasheet" }   # 43 N*cm
rotor_inertia      = { value = 5.4e-6, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }   # 54 g*cm^2
shaft_diameter     = { value = 0.005, unit = "m", src = "S1", fidelity = "datasheet" }
shaft_length       = { value = 0.025, unit = "m", src = "S2", fidelity = "datasheet" }   # exposed shaft 25 +-1 mm (HANPOSE listing of the same motor)
insulation_class   = { value = "B", unit = "-", src = "S1", fidelity = "datasheet" }
temp_rise_max      = { value = 80, unit = "K", src = "S1", fidelity = "datasheet" }
lead_length        = { value = 1.0, unit = "m", src = "S1", fidelity = "datasheet" }   # 'Number of Wire: 4 (100cm Length)'; the same sheet's intro text says a 50 cm cable with a Harwin plug is supplied
price_eur          = { value = 7.05, unit = "EUR", src = "S2", fidelity = "datasheet" }   # incl. VAT, 2026-10-11
price          = { value = 8.11, unit = "USD", fidelity = "derived", derivation = "7.05 EUR (S2, HANPOSE 17HS4401S, VAT included) x an assumed 1.15 USD/EUR = 8.11 USD; exchange rate assumed, not looked up. A US listing of the same class (StepperOnline / Amazon) was not retrievable (bot-blocked)." }
kv_equivalent = { value = 53.38, unit = "rpm/V", fidelity = "derived", derivation = "Equivalent brushed-DC speed constant of the stepper used as a position-servo plant in the simulator: kv = 60 / (2 pi Ke) with Ke = kt_equiv_phase = 0.1789 V*s/rad -> 53.38 rpm/V. The simulator treats the stepper as a DC motor with this constant, the 1.5 ohm winding resistance and a current limit of sqrt(2) x 1.7 A = 2.40 A, which reproduces the 0.43 N*m holding torque as the torque ceiling; the stepper's speed-torque roll-off and step loss are not modelled by the kernel (the SimRP2040 twin models lost steps)." }
current_limit_equivalent = { value = 2.404, unit = "A", fidelity = "derived", derivation = "sqrt(2) x 1.7 A (both phases at rated current, as the holding torque is quoted) = 2.404 A; T = kt_equiv_phase x 2.404 A = 0.43 N*m." }
kt_equiv_phase = { value = 0.1789, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.43 N*m / (1.4142 * 1.7 A) = 0.1789 N*m/A; equals the back-EMF constant Ke (V*s/rad) per phase of an ideal motor. The holding torque of a 2-phase stepper is quoted with both phases on (the usual convention)." }

# Envelope (collision, wire clearance): the 42.3 mm square body, z in [-0.040, 0] (shaft not included).
[[geometry.shapes]]
shape = "box"
size = [0.02115, 0.02115, 0.02]
pos = [0.0, 0.0, -0.02]

[[ports]]
name = "face"
kind = "mech"
type = "bolt-pattern.31x31.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
thickness = 0.0045
note = "NEMA 17 flange; pattern, M3 thread and hole depth taken from the SOYO SY42STH38-1684A drawing used throughout this library (inference for this model)."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.5"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "5 mm shaft (S1); the D-flat is shown by the sellers' photos (S2: '5 mm D-shaft'). Type shaft.5 (not shaft.5d) so that it mates the bore.5 of the GT2 pulleys."

# Whole-part frame port: the instance frame itself as a port, for assemblies that seat the part by the pose of its frame (axis -z so that
# mating it to a seat port puts the part frame ON the seat port frame).
[[ports]]
name = "origin"
kind = "mech"
type = "frame.origin"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "The part frame (flange-face centre, +z the shaft)."

[[ports]]
name = "phases"
pins = ["PH.1", "PH.2", "PH.3", "PH.4"]
kind = "power"
type = "stepper-bipolar-4wire"
gender = "neutral"
role = "sink"
i_max = { value = 1.7, unit = "A", src = "S1", fidelity = "datasheet" }
note = "Four leads, coil A = PH.1/PH.2, coil B = PH.3/PH.4."

# Pin level: four bare / plugged leads. Colours differ between resellers of this motor (S2: red A+, green A-, yellow B+, blue B-; S3: black+green one coil, red+blue the other): identify the coils with a multimeter (about 1.5 ohm between a coil's ends).
[[connectors]]
id = "PH"
name = "phase leads (4)"
type = "wire-lead"
port_type = "stepper-bipolar-4wire"
gender = "neutral"
joinable = true
pos = [0.0, 0.0, -0.040]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 4
pitch = 0.003
src = "S1"
fidelity = "estimated"
rationale = "S1 states four wires of 100 cm but the wire colours and coil pairing are only in its connection drawing (image) and differ between sellers (S2 vs S3): the pins are named by coil (A1/A2 = coil A, B1/B2 = coil B), not by colour."
pose_rationale = "S1 does not say where the leads leave the body: drawn at the centre of the rear face (positional estimate)."
pins = [
  { number = 1, name = "A1", kind = "power", dir = "in", i_max = 1.7, note = "coil A end 1 (HANPOSE red, A+, S2)" },
  { number = 2, name = "A2", kind = "power", dir = "in", i_max = 1.7, note = "coil A end 2 (HANPOSE green, A-, S2)" },
  { number = 3, name = "B1", kind = "power", dir = "in", i_max = 1.7, note = "coil B end 1 (HANPOSE yellow, B+, S2)" },
  { number = 4, name = "B2", kind = "power", dir = "in", i_max = 1.7, note = "coil B end 2 (HANPOSE blue, B-, S2)" },
]

