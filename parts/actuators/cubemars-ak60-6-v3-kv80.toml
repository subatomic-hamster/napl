id = "cubemars-ak60-6-v3-kv80"
name = "CubeMars AK60-6 V3.0 KV80 robotic actuator (6:1 QDD-class)"
category = "actuator.bldc.qdd"
vendor = "CubeMars"
part_number = "AK60-6 V3.0 KV80"
url = "https://www.cubemars.com/product/ak60-6-v3-0-kv80-robotic-actuator.html"

# Frame: origin on the output axis at the output face; +z = out of the output face (output axis); cylindrical body, diameter 79 mm, length 43 mm, occupies z in [-0.043, 0].
# Which end carries the output flange, and the flange/mounting hole patterns, are in CubeMars' drawings (not retrieved); ports below are opaque family tags.
# Two supply variants are listed as "24/48": values given with a slash are stored for the 48 V variant where a single number is needed, with the 24 V value in a comment.
# Efficiency is NOT derivable: "Peak current" is DC bus current (ADC) and no gearbox efficiency is published.

[params]
mass               = { value = 0.380,   unit = "kg",     src = "S1", fidelity = "datasheet" }
body_diameter      = { value = 0.079,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_length        = { value = 0.043,   unit = "m",      src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 6.0,     unit = "1",      src = "S1", fidelity = "datasheet" }
v_rated_low        = { value = 24.0,    unit = "V",      src = "S1", fidelity = "datasheet" }  # "24/48"
v_rated_high       = { value = 48.0,    unit = "V",      src = "S1", fidelity = "datasheet" }
torque_rated       = { value = 3.0,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
torque_peak        = { value = 9.0,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
speed_rated_48v    = { value = 51.313,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 490 rpm; 233 rpm (24.40 rad/s) at 24 V
speed_no_load_48v  = { value = 67.021,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 640 rpm; 320 rpm (33.510 rad/s) at 24 V, output side
current_rated      = { value = 3.8,     unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
current_peak_48v   = { value = 11.2,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC; 10.3 A at 24 V (slash order assumed 24/48)
power_rated_48v    = { value = 125.0,   unit = "W",      src = "S1", fidelity = "datasheet" }  # 60 W at 24 V
kv                 = { value = 80.0,    unit = "rpm/V",  src = "S1", fidelity = "datasheet" }
kt_motor_published = { value = 0.135,   unit = "N*m/A",  src = "S1", fidelity = "datasheet" }  # motor side
ke_published       = { value = 12.5,    unit = "V/krpm", src = "S1", fidelity = "datasheet" }
r_phase_to_phase   = { value = 0.595,   unit = "ohm",    src = "S1", fidelity = "datasheet" }
l_phase_to_phase   = { value = 6.76e-4, unit = "H",      src = "S1", fidelity = "datasheet" }
rotor_inertia      = { value = 2.435e-5, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # 243.5 g.cm^2, motor-side rotor assumed
motor_constant_km  = { value = 0.15,    unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }
back_drive_torque  = { value = 0.2,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
tau_mechanical     = { value = 8.1e-4,  unit = "s",      src = "S1", fidelity = "datasheet" }  # 0.81 ms
tau_electrical     = { value = 6.9e-4,  unit = "s",      src = "S1", fidelity = "datasheet" }  # 0.69 ms
pole_pairs         = { value = 14,      unit = "1",      src = "S1", fidelity = "datasheet" }
slots              = { value = 24,      unit = "1",      src = "S1", fidelity = "datasheet" }
winding            = { value = "star",  unit = "-",      src = "S1", fidelity = "datasheet" }
encoder_inner      = { value = "magnetic, 21 bit", unit = "-", src = "S1", fidelity = "datasheet" }

# --- derived electrical model ---
ke_si = { value = 0.11937, unit = "V*s/rad", fidelity = "derived", derivation = "KE = 12.5 V/krpm = 12.5/104.72 = 0.11937 V*s/rad (line-to-line, motor side), equal to 60/(2*pi*KV) = 60/(2*pi*80) = 0.11937. NOTE: published KT is 0.135 N*m/A, 13 % above KE in SI; the two should be equal, so the source is inconsistent. Both are kept; use ke_si for back-EMF and kt_motor_published for torque only if matching CubeMars' own numbers." }
r_phase_equivalent_wye = { value = 0.2975, unit = "ohm", fidelity = "derived", derivation = "Equivalent-wye phase resistance = R_phase_to_phase / 2 = 0.595/2 = 0.2975 ohm (star winding)." }
kt_output_ideal = { value = 0.810, unit = "N*m/A", fidelity = "derived", derivation = "KT_motor_published * N = 0.135 * 6 = 0.81 N*m per A (lossless gearbox). Check: 11.2 A * 0.81 = 9.07 N*m vs published 9 N*m peak (ratio 1.01; this agreement supports the published KT over KE)." }
j_reflected_output = { value = 8.766e-4, unit = "kg*m^2", fidelity = "estimated", rationale = "J_rotor * N^2 = 2.435e-5 * 36. CubeMars does not state whether the published inertia is rotor-only or reflected; rotor-only is the usual convention for this field." }
noload_speed_check = { value = 640.0, unit = "rpm", fidelity = "derived", derivation = "48 V * KV 80 / 6 = 640 rpm (and 24 V gives 320 rpm), matching the published 320/640 no-load speeds." }

