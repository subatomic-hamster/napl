pins = ["PWR.1", "PWR.2"]
kind = "power"
type = "power-can-cable"
gender = "male"
role = "sink"
v_max = { value = 48.0, unit = "V", src = "S1", fidelity = "datasheet" }  # highest listed rated voltage ("24/48"); absolute maximum not published on the page
v_min = { value = 24.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest listed rated voltage; not a documented minimum operating voltage
i_max = { value = 3.8, unit = "A", src = "S1", fidelity = "datasheet" }  # rated ADC
i_peak = { value = 11.2, unit = "A", src = "S1", fidelity = "datasheet" }  # peak ADC (48 V variant)
