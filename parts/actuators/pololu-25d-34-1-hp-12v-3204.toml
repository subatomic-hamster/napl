[[sources]]
id = "S2"
url = "https://www.pololu.com/product/3204"
title = "Pololu item 3204 product page (description, mounting, load limits)"
accessed = "2026-10-07"
quote = "The gearmotor is cylindrical, with a diameter just under 25 mm, and the D-shaped output shaft is 4 mm in diameter and extends 12.5 mm from the face plate of the gearbox. || The face plate has two mounting holes threaded for M3 screws. || We recommend screwing no further than 6 mm (0.24″) into the screw hole. || The recommended upper limit for continuously applied loads is 4 kg⋅cm (55 oz⋅in), and the recommended upper limit for intermittently permissible torque is 8 kg⋅cm (110 oz⋅in). || a general recommendation for brushed DC motor operation is 25% or less of the stall current."
