id = "pololu-25d-34-1-hp-12v-3204"
name = "Pololu 34:1 Metal Gearmotor 25Dx52L mm HP 12V (item 3204)"
category = "motor.dc.gearmotor"
vendor = "Pololu"
part_number = "Pololu 3204"
url = "https://www.pololu.com/product/3204"

# Frame: origin on the output-shaft axis at the gearbox face plate; +z = shaft direction (out of the face plate); cylindrical body (diameter just under 25 mm) occupies z in [-0.052, 0];
# the 4 mm D-shaft extends 12.5 mm to z = +0.0125. Length is measured from the face plate to the back of the motor (excludes shaft and terminals).
# Full DC-motor model derivable at 12 V. NOTE: stall torque 11 kg.cm exceeds Pololu's recommended limits (4 kg.cm continuous, 8 kg.cm intermittent); DRC should use the limits, not stall.

[params]
mass               = { value = 0.088,   unit = "kg",     src = "S1", fidelity = "datasheet" }
body_diameter      = { value = 0.025,   unit = "m",      src = "S1", fidelity = "datasheet" }  # nominal 25D; case is "just under 25 mm" (S2)
body_length        = { value = 0.052,   unit = "m",      src = "S1", fidelity = "datasheet" }
shaft_diameter     = { value = 0.004,   unit = "m",      src = "S1", fidelity = "datasheet" }
shaft_length       = { value = 0.0125,  unit = "m",      src = "S2", fidelity = "datasheet" }
shaft_type         = { value = "4 mm D-shaft", unit = "-", src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 34.014,  unit = "1",      src = "S1", fidelity = "datasheet" }
v_nominal          = { value = 12.0,    unit = "V",      src = "S1", fidelity = "datasheet" }
no_load_speed_12v  = { value = 31.416,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 300 rpm
no_load_current_12v = { value = 0.25,   unit = "A",      src = "S1", fidelity = "datasheet" }  # typical, +/-50 %
stall_torque_12v   = { value = 1.0787,  unit = "N*m",    src = "S1", fidelity = "datasheet" }  # 11 kg.cm, extrapolated
stall_current_12v  = { value = 5.0,     unit = "A",      src = "S1", fidelity = "datasheet" }  # extrapolated
no_load_speed_6v   = { value = 15.708,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 150 rpm
stall_torque_6v    = { value = 0.53937, unit = "N*m",    src = "S1", fidelity = "datasheet" }  # 5.5 kg.cm
stall_current_6v   = { value = 2.5,     unit = "A",      src = "S1", fidelity = "datasheet" }
max_output_power_12v = { value = 8.9,   unit = "W",      src = "S1", fidelity = "datasheet" }
max_efficiency_12v = { value = 0.44,    unit = "1",      src = "S1", fidelity = "datasheet" }
speed_at_max_eff   = { value = 27.227,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 260 rpm
torque_at_max_eff  = { value = 0.15691, unit = "N*m",    src = "S1", fidelity = "datasheet" }  # 1.6 kg.cm
current_at_max_eff = { value = 0.82,    unit = "A",      src = "S1", fidelity = "datasheet" }
torque_limit_continuous = { value = 0.3923, unit = "N*m", src = "S2", fidelity = "datasheet" }  # 4 kg.cm
torque_limit_intermittent = { value = 0.7845, unit = "N*m", src = "S2", fidelity = "datasheet" }  # 8 kg.cm
mount_screw_max_engagement = { value = 0.006, unit = "m", src = "S2", fidelity = "datasheet" }

# --- DC-motor equivalent (motor side), derived at 12 V ---
r_effective = { value = 2.4, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 12 V / 5.0 A = 2.4 ohm (Pololu stall values are theoretical extrapolations). Cross-check at 6 V: 6/2.5 = 2.4 ohm." }
omega_noload_motor_12v = { value = 1068.6, unit = "rad/s", fidelity = "derived", derivation = "N * omega_out = 34.014 * 31.416 rad/s = 1068.6 rad/s (10205 RPM)." }
ke = { value = 0.010668, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R)/(N*omega_out) = (12 - 0.25*2.4)/(34.014*31.416) = 11.4/1068.6 = 1.0668e-2 V*s/rad." }
kt_motor = { value = 0.010668, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.626, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) = 1.0787/(34.014*0.010668*(5.0-0.25)) = 1.0787/1.7236 = 0.626. (Pololu's separate 'max efficiency' of 44 % is the overall motor+gearbox peak.)" }
friction_torque_motor_noload = { value = 0.002667, unit = "N*m", fidelity = "derived", derivation = "Kt*I0 = 0.010668*0.25 = 2.67e-3 N*m at the motor shaft (no-load current is typical +/-50 %)." }

[[ports]]
name = "mount"
kind = "mech"
type = "bolt-pattern.pololu-25d-2hole.m3"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Two M3-threaded holes in the face plate, max 6 mm screw engagement (S2). Hole spacing is in Pololu's dimension diagram, not in the retrieved text; the pattern is an opaque family tag. Symmetry 2 is an assumption of two symmetric holes about the shaft axis (inference)."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.4d"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "4 mm D-shaft extending 12.5 mm from the face plate."

[[ports]]
name = "motor_power"
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 12.0, unit = "V", src = "S1", fidelity = "datasheet" }  # rated (nominal) voltage
i_peak = { value = 5.0, unit = "A", src = "S1", fidelity = "datasheet" }  # extrapolated stall current
i_max = { value = 1.25, unit = "A", fidelity = "derived", derivation = "Pololu's general recommendation for brushed DC motors is 25 % or less of the stall current: 0.25 * 5.0 A = 1.25 A." }
note = "Two motor terminals; terminal style not stated in the retrieved text."

