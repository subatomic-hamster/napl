quote = "Step/Dir Drivers for Two-Phase Bipolar Stepper Motors up to 2.8A peak – StealthChop™ for Quiet Movement – UART Interface Option – Sensorless Stall Detection StallGuard4. || 2-phase stepper motors up to 2.8A coil current (peak), 2A RMS| STEP/DIR Interface with 8, 16, 32 or 64 microstep pin setting| Smooth Running 256 microsteps by MicroPlyer™ interpolation| StealthChop2™ silent motor operation| SpreadCycle™ highly dynamic motor control chopper| StallGuard4™ load and stall detection for StealthChop| CoolStep™ current control for energy savings up to 75%| Low RDSon, Low Heat-Up LS 170mΩ & HS 170mΩ (typ. at 25°C)| Voltage Range 4.75… 29V DC| Low Power Standby to fit standby energy regulations Internal Sense Resistor option (no sense resistors required)| Passive Braking, Freewheeling, and automatic power down …"
