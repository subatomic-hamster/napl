quote = "Position Sensor| Contactless absolute encoder (12Bit, 360 [°])| Maker : ams(www.ams.com), Part No : AS5601 || Motor| Cored || Baud Rate| 9,600 [bps] ~ 4.5 [Mbps] || Resolution| 4096 [pulse/rev] || Weight| 57.2 [g] || Dimensions (W x H x D)| 28.5 x 46.5 x 34 [mm] || Gear Ratio| 258.5 : 1 || Stall Torque| 1.0 [N.m] (at 9.0 [V], 1.0 [A], 1.000 [Nm/A])| 1.4 [N.m] (at 11.1 [V], 1.3 [A], 1.077 [Nm/A])| 1.5 [N.m] (at 12.0 [V], 1.4 [A], 1.071 [Nm/A]) || No Load Speed| 47 [rev/min] (at 9.0 [V])| 57 [rev/min] (at 11.1 [V])| 61 [rev/min] (at 12.0 [V]) || Operating Temperature| -5 ~ +72 [°C] || Input Voltage| 6.5 ~ 12.0 [V] (Recommended : 11.1 [V]) (lithium-ion battery 3 Cell) || Physical Connection| TTL Multidrop Bus (5V Logic) | TTL Half Duplex Asynchronous Serial Communication (8bit, 1stop, No Parity) || ID| 253 ID (0 ~ 252) || Case Material| Engineering Plastic || Gear Material| Engineering Plastic || Standby Current| 52 [mA] || Connector Information: Housing| JST EHR-03| PCB Header| JST B3B-EH-A"
