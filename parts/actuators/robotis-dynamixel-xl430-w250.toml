id = "robotis-dynamixel-xl430-w250"
name = "ROBOTIS DYNAMIXEL XL430-W250-T 11.1V 258.5:1 smart servo"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XL430-W250-T"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl430-w250/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# Case 28.5 x 46.5 x 34 mm (W x H x D per ROBOTIS); D is taken as the extent along the output axis (inference), so the case occupies z in [-0.034, 0].
# Output axis in-plane offset is only in the drawing (XL430_new.pdf/.stp); left at the origin.
# ROBOTIS publishes no no-load current, so Ke is computed with I0*R neglected (Ke slightly over-estimated, efficiency under-estimated).
# Frame-hole family 'dynamixel-x430-frame' is shared with XC430/XM430 because ROBOTIS lists the same FR12 hinge/side frames on all of their pages (inference).

[params]
mass            = { value = 0.0572,  unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.0285,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.0465,  unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 258.5,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "engineering plastic gears and case; cored motor", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute, ams AS5601
protocol        = { value = "DYNAMIXEL TTL half-duplex asynchronous serial, 8N1, 5 V logic, IDs 0-252", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4500000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "JST EHR-03 housing / JST B3B-EH-A header, pins GND-VDD-DATA", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 72, unit = "degC", src = "S1", fidelity = "datasheet" }
standby_current = { value = 0.052, unit = "A", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "ROBOTIS XL430 horn (spline/bolt circle only in the XL430_new.pdf/.stp drawing, not retrievable as text)", unit = "-", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at three supply voltages ---
v_nominal           = { value = 11.1,   unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 11.1 [V]"
v_operating_min     = { value = 6.5,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 12.0,   unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_11v1   = { value = 1.4,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_11v1  = { value = 1.3,    unit = "A",     src = "S1", fidelity = "datasheet" }
kt_output_11v1      = { value = 1.077,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }
no_load_speed_11v1  = { value = 5.969,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 57 rev/min
stall_torque_12v    = { value = 1.5,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_12v   = { value = 1.4,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_12v   = { value = 6.388,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 61 rev/min
stall_torque_9v     = { value = 1.0,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_9v    = { value = 1.0,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_9v    = { value = 4.922,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 47 rev/min

# --- DC-motor equivalent (motor side), derived from the 11.1 V and 12 V points (I0 unpublished, neglected) ---
r_effective = { value = 8.55, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall: 11.1 V/1.3 A = 8.538 ohm, 12 V/1.4 A = 8.571 ohm; mean 8.55 ohm (the 9 V point gives 9.0 ohm from a 1-digit current, so is excluded). Includes driver and lead resistance." }
ke = { value = 0.00723, unit = "V*s/rad", fidelity = "derived", derivation = "Ke ~ V/(N*omega_out) with I0*R neglected: 11.1 V/(258.5*5.969 rad/s) = 7.194e-3; 12 V/(258.5*6.388) = 7.267e-3; mean 7.23e-3 V*s/rad." }
kt_motor = { value = 0.00723, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.575, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Ke*I_stall): 11.1 V 1.4/(258.5*0.007194*1.3) = 0.579; 12 V 1.5/(258.5*0.007267*1.4) = 0.570; mean 0.575 (lower bound since I0 is neglected; plastic gear train)." }

[tables.datasheet_points]
columns = ["voltage_V", "stall_torque_Nm", "stall_current_A", "kt_output_Nm_per_A", "no_load_rpm"]
rows = [[9.0, 1.0, 1.0, 1.000, 47], [11.1, 1.4, 1.3, 1.077, 57], [12.0, 1.5, 1.4, 1.071, 61]]
src = "S1"
fidelity = "datasheet"

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-x430-frame"
gender = "neutral"
pos = [0.0, 0.0, -0.034]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Frame/side mounting points per ROBOTIS drawing (XL430_new.pdf/.dwg/.stp, not retrievable as text); opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dxl-x430"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "ROBOTIS X430 output horn interface; spline/bolt circle not published as text."

[[ports]]
name = "power_in"
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "sink"
v_max = { value = 12.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 6.5, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.4, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 12 V; no continuous rating published

[[ports]]
name = "bus"
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
level = { value = 5.0, unit = "V", src = "S1", fidelity = "datasheet" }

