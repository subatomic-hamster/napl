id = "pololu-1206-nema11-28x45"
name = "Pololu 1206 NEMA 11 bipolar stepper motor, 28x45 mm, 0.67 A, 4.5 V"
category = "motor.stepper"
vendor = "Pololu (item 1206)"
part_number = "Pololu item 1206"
url = "https://www.pololu.com/product/1206"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.045, 0]. Bipolar (4-lead) winding; electrical figures are 'per coil'. Pololu item 1206 page text only (the datasheet PDF was not read).

[params]
mass               = { value = 0.140,   unit = "kg",    src = "S1", fidelity = "datasheet" }  # 140 g (5 oz)
flange_size        = { value = 0.028,   unit = "m",     src = "S1", fidelity = "datasheet" }  # 28 mm square
body_length        = { value = 0.045,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S1", fidelity = "datasheet" }  # 200 steps/rev = 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
rated_current      = { value = 0.67,    unit = "A",     src = "S1", fidelity = "datasheet" }  # 670 mA per coil
rated_voltage      = { value = 4.5,     unit = "V",     src = "S1", fidelity = "datasheet" }
phase_resistance   = { value = 6.8,     unit = "ohm",   src = "S1", fidelity = "datasheet" }  # per coil
phase_inductance   = { value = 0.0049,  unit = "H",     src = "S1", fidelity = "datasheet" }  # 4.9 mH per coil
holding_torque     = { value = 0.093163, unit = "N*m",  src = "S1", fidelity = "datasheet" }  # 950 g-cm (13 oz-in)
shaft_diameter     = { value = 0.005,   unit = "m",     src = "S1", fidelity = "datasheet" }
shaft_type         = { value = "5 mm D-shaft, 2 ball bearings", unit = "-", src = "S1", fidelity = "datasheet" }
kt_equiv_phase = { value = 0.0983, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.093163 N*m / (1.4142 * 0.67 A) = 0.0983 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }

[[ports]]
name = "face"
kind = "mech"
type = "bolt-pattern.nema11.m2.5"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "NEMA 11 flange (page says NEMA 11); hole spacing and thread are not on the page, family tag shared with the SOYO NEMA 11 part (inference that the flange pattern is the same)."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.5d"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "5 mm D-shaft; length not on the page text."

[[ports]]
name = "phases"
kind = "power"
type = "stepper-bipolar-4wire"
gender = "neutral"
role = "sink"
i_max = { value = 0.67, unit = "A", src = "S1", fidelity = "datasheet" }  # rated current per coil
note = "Bare 30 cm leads; drive with a chopper driver. Rotor inertia is not published on the page."

