title = "Pololu item 4751 Specs tab (19:1 Metal Gearmotor 37Dx68L mm 12V with 64 CPR Encoder, Helical Pinion)"
accessed = "2026-10-07"
quote = "Size: 37D × 68L mm|1| Weight: 200 g Shaft diameter: 6 mm|2| General specifications Gear ratio: 18.75:1 No-load speed @ 12V: 530 rpm No-load current @ 12V: 0.2 A Stall current @ 12V: 5.5 A|3| Stall torque @ 12V: 8.5 kg·cm|3| Max output power @ 12V: 12 W No-load speed @ 6V: 270 rpm No-load current @ 6V: 0.15 A|4| Stall current @ 6V: 3.0 A|4| Stall torque @ 6V: 5.0 kg·cm|4| Motor type: 12V Performance at maximum efficiency Max efficiency @ 12V: 55 % Speed at max efficiency: 470 rpm Torque at max efficiency: 1.0 kg·cm Current at max efficiency: 0.76 A Output power at max efficiency: 5.0 W General specifications Lead length: 20 cm|5| Encoders?: Y Encoder resolution: 64 CPR Notes:|1|Length measurement is from gearbox face plate to back of encoder cap (it does not include the output shaft). See dimension diagram for details.|2|D shaft.|3|Stalling is likely to damage the gearmotor. Stall parameters come from a theoretical extrapolation of performance at loads far from stall. As the motor heats up, as happens as it approaches an actual stall, the stall torque and current decrease.|4|This motor will run at 6 V but is intended for operation at 12 V.|5|May vary by a few centimeters."

[[sources]]
id = "S2"
url = "https://www.pololu.com/product/4751"
title = "Pololu item 4751 product page (description, Exact gear ratio, Using the Encoder)"
accessed = "2026-10-07"
quote = "This gearmotor is a powerful 12V brushed DC motor with a 18.75:1 metal gearbox and an integrated quadrature encoder with a resolution of 64 counts per revolution (CPR) of the motor shaft and 1200 CPR of the gearbox’s output shaft. || These units have a 16 mm-long, 6 mm-diameter D-shaped output shaft. || Exact gear ratio: (25×30×30) / (10×10×12) = 18.75:1 || The quadrature encoder provides a resolution of 64 counts per revolution of the motor shaft when counting both edges of both channels. To compute the counts per revolution of the gearbox output, multiply the gear ratio by 64. The motor/encoder has six color-coded, 8″ (20 cm) leads terminated by a 1×6 female header with a 0.1″ pitch || Red motor power (connects to one motor terminal) Black motor power (connects to the other motor terminal) Green encoder GND Blue encoder Vcc (3.5 – 20 V) Yellow encoder A output White encoder B output The Hall sensor requires an input voltage, Vcc, between 3.5 and 20 V and draws a maximum of 10 mA."

[[sources]]
id = "S3"
url = "https://www.pololu.com/product/4751"
title = "Pololu item 4751 product page (Note on stall extrapolations and load limits; Gearmotor accessories: mounting holes; dimension-diagram warning)"
accessed = "2026-10-07"
quote = "The recommended upper limit for continuously applied loads is 10 kg-cm (150 oz-in), and the recommended upper limit for instantaneous torque is 25 kg-cm (350 oz-in). Stalls can also result in rapid (potentially on the order of seconds) thermal damage to the motor windings and brushes; a general recommendation for brushed DC motor operation is 25% or less of the stall current. || The face plate has six mounting holes evenly spaced around the outer edge threaded for M3 screws. These mounting holes form a regular hexagon and the centers of neighboring holes are 15.5 mm apart. || Warning: Do not screw too far into the mounting holes as the screws can hit the gears. We recommend screwing no more than 3mm (0.12″) into the screw hole."
