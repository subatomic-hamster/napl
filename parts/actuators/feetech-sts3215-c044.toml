id = "feetech-sts3215-c044"
name = "Feetech STS3215-C044 7.4V 1/191 serial bus servo"
category = "motor.servo"
vendor = "Feetech (Shenzhen Feite Model Co., Ltd.)"
part_number = "STS3215-C044"
url = "https://openelab.io/products/feetech-sts3215-c044-servo-7"

# Frame: origin on the output axis at the horn-side (top) face of the case; +z = output axis out of the case;
# x = long case dimension (45.2 mm), y = short (24.7 mm). Case occupies z in [-0.035, 0].
# Same case family as STS3215-C001; 191:1 train gives ~1.6x speed of C001 at lower torque multiplication.

[params]
mass            = { value = 0.055,   unit = "kg",  src = "S1", fidelity = "datasheet" }
length          = { value = 0.0452,  unit = "m",   src = "S1", fidelity = "datasheet" }
width           = { value = 0.0247,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.035,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 191,     unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "copper (metal gear train), PA+GF case", unit = "-", src = "S1", fidelity = "datasheet" }
backlash        = { value = 0.0087266, unit = "rad", src = "S1", fidelity = "datasheet" }  # <=0.5 deg
horn_spline     = { value = "25T, OD 5.9 mm", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }
protocol        = { value = "Half-duplex asynchronous TTL serial, 8N1, ID 0-253", unit = "-", src = "S1", fidelity = "datasheet" }
baud_default    = { value = 1000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 38400,   unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "5264-3P (GND, VCC, TTL signal)", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60,  unit = "degC", src = "S1", fidelity = "datasheet" }

# --- datasheet performance (kg.cm converted with g = 9.80665) ---
v_nominal           = { value = 7.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_min     = { value = 5.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 8.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_7v4   = { value = 9.0276, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.116 s/60deg (86 RPM)
no_load_current_7v4 = { value = 0.42,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_7v4    = { value = 2.6870, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 27.4 kg.cm
stall_current_7v4   = { value = 3.8,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_7v4    = { value = 0.8826, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 9 kg.cm
rated_current_7v4   = { value = 1.2,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 7.6440, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.137 s/60deg
stall_torque_6v     = { value = 2.3829, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 24.3 kg.cm
rated_torque_6v     = { value = 0.7845, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 8 kg.cm

# --- DC-motor equivalent (motor side), derived from the 7.4 V point ---
r_effective = { value = 1.947, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 7.4 V / 3.8 A = 1.947 ohm (includes H-bridge and lead resistance at stall). Lower than C001 (2.98 ohm): this winding is a different, higher-current motor." }
omega_noload_motor_7v4 = { value = 1724.2, unit = "rad/s", fidelity = "derived", derivation = "N * omega_out = 191 * (pi/3 rad / 0.116 s = 9.0276 rad/s) = 1724.2 rad/s (16465 RPM)." }
ke = { value = 0.003817, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R)/(N*omega_out) = (7.4 - 0.42*1.947)/(191*9.0276) = 6.582/1724.2 = 3.817e-3 V*s/rad." }
kt_motor = { value = 0.003817, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency_raw = { value = 1.090, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) = 2.687/(191*0.003817*(3.8-0.42)) = 1.090. A value above 1 is physically impossible: the published stall torque, stall current, no-load speed and no-load current are not mutually consistent (stall torque is probably quoted at a lower current than 3.8 A, or the no-load current at a different load). Do NOT use as a physical efficiency; clamp to the 0.6-0.7 seen on C001 if a model needs one." }
friction_torque_motor_noload = { value = 0.001603, unit = "N*m", fidelity = "derived", derivation = "Kt*I0 = 0.003817*0.42 = 1.603e-3 N*m at the motor shaft (high: 0.42 A no-load current published)." }
rotor_inertia_motor = { value = 2.35e-7, unit = "kg*m^2", fidelity = "estimated", rationale = "Not published. Borrowed from the STS3215-C001 estimate (parts/arm/feetech-sts3215-c001.toml, MJCF armature / N^2) as same-size motor; unverified." }

