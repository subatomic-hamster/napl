id = "savox-sb-2290sg"
name = "Savox SB-2290SG HV brushless digital steel-gear servo"
category = "motor.servo"
vendor = "Savox"
part_number = "SB-2290SG"
url = "https://rc-modelshop.com/product/savox-sb-2290sg-hv-bl-digital-servo-0-11s-70kg-8-4v/"

# Frame: origin on the output axis at the horn-seat (top) face of the case; +z = output axis out of the case;
# x = 40.3 mm, y = 20.2 mm footprint, 38.7 mm height along z (inference from the L x W x H listing), z in [-0.0387, 0].
# Output-axis offset along x is not published and is left at the origin.
# No current figures on the retrieved pages, so no electrical DC-motor model can be derived.
# Source discrepancy: the retailer page used here (S1) lists 45/55/70 kg-cm at 6.0/7.4/8.4 V; an rcvisions.com listing of the 'Black Edition'
# (S2) lists 40/50/65 kg-cm. Edition/version differences are not explained by either page; S1 values are used, S2 kept as the lower bound.

[params]
mass            = { value = 0.081,   unit = "kg", src = "S1", fidelity = "datasheet" }
length          = { value = 0.0403,  unit = "m",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.0202,  unit = "m",  src = "S1", fidelity = "datasheet" }
height          = { value = 0.0387,  unit = "m",  src = "S1", fidelity = "datasheet" }
gear_material   = { value = "hardened steel gears, full aluminium case, 3 ball bearings, brushless motor", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "25T", unit = "-", src = "S1", fidelity = "datasheet" }
protocol        = { value = "PWM digital servo (HV)", unit = "-", src = "S1", fidelity = "datasheet" }
v_operating_min     = { value = 6.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 8.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 6.545,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.16 s/60deg
no_load_speed_7v4   = { value = 8.055,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.13 s/60deg
no_load_speed_8v4   = { value = 9.520,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.11 s/60deg
stall_torque_6v     = { value = 4.4130, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 45 kg-cm
stall_torque_7v4    = { value = 5.3937, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 55 kg-cm
stall_torque_8v4    = { value = 6.8647, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 70 kg-cm
stall_torque_8v4_black_edition = { value = 6.3743, unit = "N*m", src = "S2", fidelity = "datasheet" }  # 65 kg-cm per the Black Edition listing

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-standard-ears"
gender = "neutral"
pos = [0.0, 0.0, -0.0387]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Standard-size hobby servo mounting ears; hole spacing not published on the listing, opaque family tag shared with other standard-size servos."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.25t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 25
note = "25T spline; OD not stated."

[[ports]]
name = "power_in"
pins = ["SRV.1", "SRV.2"]
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 8.4, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; no current rating published."

[[ports]]
name = "signal"
pins = ["SRV.3"]
kind = "signal"
type = "pwm"
gender = "female"

# Pin level: the 3-pin servo lead. S1 does not describe the lead, so the layout is the RC-servo convention.
[[connectors]]
id = "SRV"
name = "servo lead (3-pin JR-style plug)"
type = "servo-lead-3"
port_type = "servo-3pin"
gender = "female"
pos = [-0.02, 0.0, -0.02]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "S1"
fidelity = "estimated"
rationale = "S1 gives no wire colours, plug style or pin order: the port type servo-3pin and the standard RC servo lead (ground, +V, signal at 0.1 in pitch) are assumed."
pose_rationale = "Servo case dimensions are not in the sources, so the lead exit is a positional estimate: at the -x end of a standard-size case, lead pointing out along -x."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "V+", kind = "power", dir = "in" },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "in" },
]

