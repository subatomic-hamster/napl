id = "cubemars-ak80-9-v3-kv100"
name = "CubeMars AK80-9 V3.0 KV100 robotic actuator (9:1 QDD-class)"
category = "actuator.bldc.qdd"
vendor = "CubeMars"
part_number = "AK80-9 V3.0 KV100"
url = "https://www.cubemars.com/product/ak80-9-v3-0-robotic-actuator.html"

# Frame: origin on the output axis at the output face; +z = out of the output face (output axis); cylindrical body, diameter 98 mm, length 38.5 mm, occupies z in [-0.0385, 0].
# Which end of the 38.5 mm body carries the output flange, and the flange/mounting hole patterns, are in CubeMars' 2D/3D drawings (PDF/STEP), which were not retrieved; ports below are opaque family tags.
# Motor-side constants (KT, KE, R, L, inertia) are published for the BLDC motor; ratio 9:1 is published. Efficiency is NOT derivable: "Peak current" is DC bus current (ADC) and no gearbox efficiency is published.

[params]
mass               = { value = 0.490,   unit = "kg",     src = "S1", fidelity = "datasheet" }
body_diameter      = { value = 0.098,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_length        = { value = 0.0385,  unit = "m",      src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 9.0,     unit = "1",      src = "S1", fidelity = "datasheet" }
v_rated            = { value = 48.0,    unit = "V",      src = "S1", fidelity = "datasheet" }
torque_rated       = { value = 9.0,     unit = "N*m",    src = "S1", fidelity = "datasheet" }
torque_peak        = { value = 22.0,    unit = "N*m",    src = "S1", fidelity = "datasheet" }
speed_rated        = { value = 40.841,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 390 rpm
speed_no_load      = { value = 59.690,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 570 rpm, output side
current_rated      = { value = 12.0,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
current_peak       = { value = 28.0,    unit = "A",      src = "S1", fidelity = "datasheet" }  # ADC
power_rated        = { value = 368.0,   unit = "W",      src = "S2", fidelity = "datasheet" }
kv                 = { value = 100.0,   unit = "rpm/V",  src = "S1", fidelity = "datasheet" }
kt_motor_published = { value = 0.095,   unit = "N*m/A",  src = "S1", fidelity = "datasheet" }  # motor side
ke_published       = { value = 10.0,    unit = "V/krpm", src = "S1", fidelity = "datasheet" }
r_phase_to_phase   = { value = 0.160,   unit = "ohm",    src = "S1", fidelity = "datasheet" }
l_phase_to_phase   = { value = 1.16e-4, unit = "H",      src = "S1", fidelity = "datasheet" }
rotor_inertia      = { value = 1.1183238e-4, unit = "kg*m^2", src = "S1", fidelity = "datasheet" }  # 1118.3238 g.cm^2, motor-side rotor assumed
motor_constant_km  = { value = 0.2387,  unit = "N*m/sqrt(W)", src = "S1", fidelity = "datasheet" }
back_drive_torque  = { value = 0.51,    unit = "N*m",    src = "S1", fidelity = "datasheet" }
backlash           = { value = 4.363e-3, unit = "rad",   src = "S1", fidelity = "datasheet" }  # 15 arcmin
tau_mechanical     = { value = 7.25e-4, unit = "s",      src = "S1", fidelity = "datasheet" }  # 0.725 ms
pole_pairs         = { value = 21,      unit = "1",      src = "S1", fidelity = "datasheet" }
slots              = { value = 36,      unit = "1",      src = "S1", fidelity = "datasheet" }
winding            = { value = "delta", unit = "-",      src = "S1", fidelity = "datasheet" }
encoder_inner      = { value = "magnetic, 16 bit, single encoder", unit = "-", src = "S1", fidelity = "datasheet" }
load_rating_dynamic = { value = 2760.0, unit = "N",      src = "S1", fidelity = "datasheet" }  # basic dynamic load rating Cr
load_rating_static  = { value = 2810.0, unit = "N",      src = "S1", fidelity = "datasheet" }  # basic static load rating Cor

# --- derived electrical model ---
ke_si = { value = 0.09549, unit = "V*s/rad", fidelity = "derived", derivation = "KE = 10 V/krpm = 10 V / (1000 rpm * 2*pi/60 rad/s per rpm) = 10/104.72 = 0.09549 V*s/rad (line-to-line, motor side). Agrees with KT 0.095 and with 60/(2*pi*KV) = 60/(2*pi*100) = 0.09549." }
r_phase_equivalent_wye = { value = 0.080, unit = "ohm", fidelity = "derived", derivation = "Equivalent-wye phase resistance = R_phase_to_phase / 2 = 0.160/2 = 0.080 ohm (valid for any winding connection when R is measured line-to-line)." }
kt_output_ideal = { value = 0.855, unit = "N*m/A", fidelity = "derived", derivation = "KT_motor * N = 0.095 * 9 = 0.855 N*m per A (phase-current torque constant at the output, lossless gearbox). Check: 28 A peak * 0.855 = 23.9 N*m vs published 22 N*m peak (ratio 0.92; DC-bus current is not phase current, so only an approximate cross-check)." }
j_reflected_output = { value = 9.058e-3, unit = "kg*m^2", fidelity = "estimated", rationale = "J_rotor * N^2 = 1.1183e-4 * 81. CubeMars does not state whether the published inertia is rotor-only or reflected; rotor-only is the usual convention for this field and the value is consistent in size with a 98 mm rotor." }
noload_speed_check = { value = 533.3, unit = "rpm", fidelity = "derived", derivation = "48 V * KV 100 / 9 = 533 rpm vs published 570 rpm no-load; the published figure is 7 % higher (source inconsistency, published value used)." }

