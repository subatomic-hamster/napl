id = "pololu-2299-sanyo-pancake-50x16"
name = "Sanyo Denki SS2502-5041 pancake stepper, 50 mm square, 50x16 mm, 5.9 V 1 A (Pololu 2299)"
category = "motor.stepper"
vendor = "Pololu / Sanyo Denki"
part_number = "SS2502-5041"
url = "https://www.pololu.com/product/2299"

# Frame: origin on the shaft axis at the front flange face, +z = shaft direction, body in z in [-0.016, 0]. Not NEMA-labelled by Pololu:
# no face pattern is filed (the page gives no hole drawing), so this part cannot be snapped by bolt pattern.
[params]
mass             = { value = 0.150, unit = "kg", src = "S1", fidelity = "datasheet" }
flange_size      = { value = 0.050, unit = "m", src = "S1", fidelity = "datasheet" }
body_length      = { value = 0.016, unit = "m", src = "S1", fidelity = "datasheet" }
steps_per_rev    = { value = 200, unit = "1", src = "S1", fidelity = "datasheet" }
phases           = { value = 2, unit = "1", src = "S1", fidelity = "datasheet" }
leads            = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
rated_current    = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }
rated_voltage    = { value = 5.9, unit = "V", src = "S1", fidelity = "datasheet" }
phase_resistance = { value = 5.9, unit = "ohm", src = "S1", fidelity = "datasheet" }
phase_inductance = { value = 0.0032, unit = "H", src = "S1", fidelity = "datasheet" }
holding_torque   = { value = 0.2149, unit = "N*m", src = "S1", fidelity = "datasheet" }
shaft_diameter   = { value = 0.005, unit = "m", src = "S1", fidelity = "datasheet" }
lead_length      = { value = 0.30, unit = "m", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.5"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 360
note = "5 mm output shaft (S1); no D-flat stated, treated as round."

[[ports]]
name = "phases"
pins = ["PH.1", "PH.2", "PH.3", "PH.4"]
kind = "power"
type = "stepper-bipolar-4wire"
gender = "neutral"
role = "sink"
i_max = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }
note = "Four 30 cm bare leads; current is per coil."

# Pin level: four colour-coded bare leads, 30 cm (P1: red + yellow = one coil, orange + blue = the other). P1 does not give the polarity within a coil.
[[connectors]]
id = "PH"
name = "phase leads (4, bare, 300 mm)"
type = "wire-lead"
port_type = "stepper-bipolar-4wire"
gender = "neutral"
joinable = true
pos = [0.0, 0.0, -0.016]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 4
pitch = 0.003
src = "P1"
fidelity = "datasheet"
pose_rationale = "P1 does not say where the leads leave the body: drawn at the centre of the rear face, 3 mm apart (positional estimate)."
pins = [
  { number = 1, name = "A1", kind = "power", dir = "in", i_max = 1.0, note = "red wire, coil A (P1)" },
  { number = 2, name = "A2", kind = "power", dir = "in", i_max = 1.0, note = "yellow wire, coil A (P1)" },
  { number = 3, name = "B1", kind = "power", dir = "in", i_max = 1.0, note = "orange wire, coil B (P1)" },
  { number = 4, name = "B2", kind = "power", dir = "in", i_max = 1.0, note = "blue wire, coil B (P1)" },
]

