# Pin level: TTL (JST EHR-03), RS-485 (JST EHR-04), External Port (Molex 51021-0500) and Dual Joint (Molex 51021-0300) connectors from the e-Manual Connector
# Information table (P1). RS485.1 / RS485.2 (GND, VDD) are the same daisy-chain nets as TTL.1 / TTL.2 and stay in the connector's own synthetic port; EXT and DJ
# have no port in this part and form synthetic ports named after the connector.
[[connectors]]
id = "TTL"
name = "TTL connector (JST EHR-03)"
type = "jst-eh-3"
port_type = "jst-eh.3"
gender = "female"
pos = [-0.01675, 0.0, -0.015]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.0025
src = "P1"
fidelity = "datasheet"
rationale = "P1 gives the housing (JST EHR-03) and the pin functions; the 2.5 mm pitch is the JST EH-series pitch, not stated in P1."
pose_rationale = "The e-Manual drawing is not machine-readable, so the connector position on the case is a positional estimate (side of the case, near the base)."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "VDD", kind = "power", dir = "in" },
  { number = 3, name = "DATA", kind = "signal", dir = "io", note = "half-duplex TTL (P1)" },
]

[[connectors]]
