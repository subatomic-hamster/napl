leads            = { value = 4, unit = "1", src = "S1", fidelity = "datasheet" }
rated_current    = { value = 1.0, unit = "A", src = "S1", fidelity = "datasheet" }
rated_voltage    = { value = 3.5, unit = "V", src = "S1", fidelity = "datasheet" }
phase_resistance = { value = 3.5, unit = "ohm", src = "S1", fidelity = "datasheet" }
