v_max = { value = 40.0, unit = "V", src = "S1", fidelity = "datasheet" }
note = "4-wire connection; 'Rated phase current 1.0 A'; 'up to 40V operating voltage'."

# Pin level: the 4-wire connection of the datasheet; its text gives no connector, wire colours or coil pairing (those are in the drawing, not retrievable as text).
[[connectors]]
