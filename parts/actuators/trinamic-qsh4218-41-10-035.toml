axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
fidelity = "estimated"
rationale = "Datasheet says 'NEMA 17 mounting configuration' and 'flange max. 42.2 mm * 42.2 mm' but has no hole drawing in its text; the NEMA 17 31 mm square M3 pattern of soyo-sy42sth38-1684a-nema17 (manufacturer drawing) is assumed."
note = "NEMA 17 front face."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.5"
gender = "male"
pos = [0.0, 0.0, 0.0]
