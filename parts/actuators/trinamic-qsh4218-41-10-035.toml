src = "S1"
fidelity = "estimated"
rationale = "S1 says only '4 wire connection': four leads in two coils (A1 A2 / B1 B2, first two = one coil) are assumed; wire colours, connector and lead length are not in the retrievable text."
pose_rationale = "Lead exit is not in the retrievable text: drawn at the centre of the rear face, 3 mm apart (positional estimate); motor length 38 mm from the datasheet table."
pins = [
  { number = 1, name = "A1", kind = "power", dir = "in", i_max = 1.0 },
  { number = 2, name = "A2", kind = "power", dir = "in", i_max = 1.0 },
