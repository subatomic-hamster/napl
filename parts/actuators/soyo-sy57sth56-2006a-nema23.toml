id = "soyo-sy57sth56-2006a-nema23"
name = "SOYO SY57STH56-2006A NEMA 23 6-lead stepper motor, 56.4x56 mm, 2.0 A (Pololu 1473)"
category = "motor.stepper"
vendor = "SOYO / Changzhou Songyang Machinery & Electronics (Pololu item 1473)"
part_number = "SY57STH56-2006A"
url = "https://www.pololu.com/product/1473"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.056, 0]. Six leads, centre-tapped coils; electrical figures are 'per coil'.
# Hole pattern (NEMA 23) is only in the drawing, not retrievable as text, so the family tag is opaque. Rotor inertia not published.

[params]
mass               = { value = 0.700,   unit = "kg",    src = "S1", fidelity = "datasheet" }
flange_size        = { value = 0.0564,  unit = "m",     src = "S1", fidelity = "datasheet" }  # 56.4 mm square
body_length        = { value = 0.056,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S2", fidelity = "datasheet" }  # 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
phases             = { value = 2,       unit = "1",     src = "S2", fidelity = "datasheet" }
leads              = { value = 6,       unit = "1",     src = "S1", fidelity = "datasheet" }
rated_current      = { value = 2.0,     unit = "A",     src = "S2", fidelity = "datasheet" }  # per coil
rated_voltage      = { value = 3.6,     unit = "V",     src = "S2", fidelity = "datasheet" }
phase_resistance   = { value = 1.8,     unit = "ohm",   src = "S2", fidelity = "datasheet" }  # per coil, +/-10 % at 25 degC
phase_inductance   = { value = 0.0025,  unit = "H",     src = "S2", fidelity = "datasheet" }  # per coil, +/-20 %
holding_torque     = { value = 0.90,    unit = "N*m",   src = "S2", fidelity = "datasheet" }  # 90 N.cm (Pololu: 125 oz.in = 0.883 N*m)
shaft_diameter     = { value = 0.00635, unit = "m",     src = "S1", fidelity = "datasheet" }
shaft_type         = { value = "1/4 inch (6.35 mm) D-shaft, 0.5 mm flat, 2 ball bearings", unit = "-", src = "S3", fidelity = "datasheet" }
radial_force_max   = { value = 28, unit = "N", src = "S2", fidelity = "datasheet" }  # 20 mm from the flange
axial_force_max    = { value = 10, unit = "N", src = "S2", fidelity = "datasheet" }
temp_rise_max      = { value = 80, unit = "degC", src = "S2", fidelity = "datasheet" }  # at rated current, 2 phases on
kt_equiv_phase = { value = 0.3182, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.90 N*m / (1.4142 * 2.0 A) = 0.3182 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }

[[ports]]
name = "face"
kind = "mech"
