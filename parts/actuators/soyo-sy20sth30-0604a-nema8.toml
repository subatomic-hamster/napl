id = "soyo-sy20sth30-0604a-nema8"
name = "SOYO SY20STH30-0604A NEMA 8 bipolar stepper motor, 20x30 mm, 0.6 A (Pololu 1204)"
category = "motor.stepper"
vendor = "SOYO / Changzhou Songyang Machinery & Electronics (Pololu item 1204)"
part_number = "SY20STH30-0604A"
url = "https://www.pololu.com/product/1204"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.030, 0]. Mounting port 'face' is on the flange (axis +z, the outward normal that mates with a bracket plate).

[params]
mass               = { value = 0.060,   unit = "kg",    src = "S1", fidelity = "datasheet" }
flange_size        = { value = 0.020,   unit = "m",     src = "S1", fidelity = "datasheet" }  # 20 mm square
body_length        = { value = 0.030,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S2", fidelity = "datasheet" }  # 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
phases             = { value = 2,       unit = "1",     src = "S2", fidelity = "datasheet" }
leads              = { value = 4,       unit = "1",     src = "S1", fidelity = "datasheet" }  # bipolar, 30 cm leads
rated_current      = { value = 0.6,     unit = "A",     src = "S1", fidelity = "datasheet" }  # per coil
rated_voltage      = { value = 3.9,     unit = "V",     src = "S1", fidelity = "datasheet" }  # DC across a coil at rated current
phase_resistance   = { value = 6.5,     unit = "ohm",   src = "S1", fidelity = "datasheet" }  # per coil, +/-10 % at 25 degC per S2
phase_inductance   = { value = 0.0017,  unit = "H",     src = "S1", fidelity = "datasheet" }  # per coil, +/-20 % per S2
holding_torque     = { value = 0.017652, unit = "N*m",  src = "S2", fidelity = "datasheet" }  # 180 g.cm
rotor_inertia      = { value = 2.0e-7,  unit = "kg*m^2", src = "S2", fidelity = "datasheet" }  # "Rotor Torque (g.cm2) 2.0" is the rotor inertia, 2.0 g.cm^2
shaft_diameter     = { value = 0.004,   unit = "m",     src = "S1", fidelity = "datasheet" }
shaft_type         = { value = "4 mm D-shaft (0.5 mm flat), 15 mm long, 2 ball bearings", unit = "-", src = "S3", fidelity = "datasheet" }
radial_force_max   = { value = 28, unit = "N", src = "S2", fidelity = "datasheet" }  # 20 mm from the flange
axial_force_max    = { value = 10, unit = "N", src = "S2", fidelity = "datasheet" }
temp_rise_max      = { value = 80, unit = "degC", src = "S2", fidelity = "datasheet" }  # at rated current, 2 phases on
kt_equiv_phase = { value = 0.0208, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.017652 N*m / (1.4142 * 0.6 A) = 0.0208 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }
rated_power_check = { value = 3.9, unit = "V", fidelity = "derived", derivation = "I*R = 0.6 A * 6.5 ohm = 3.9 V, matching the published rated voltage (consistency check)." }

[[ports]]
name = "face"
kind = "mech"
type = "bolt-pattern.nema8"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 4
note = "NEMA 8 square flange; hole spacing/thread not in the retrieved datasheet text (only in the drawing), opaque family tag."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.4d"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "4 mm D-shaft, 15 mm long."

[[ports]]
name = "phases"
kind = "power"
type = "stepper-bipolar-4wire"
gender = "neutral"
role = "sink"
i_max = { value = 0.6, unit = "A", src = "S1", fidelity = "datasheet" }  # rated current per phase
note = "Bare 30 cm leads (AWG 28 per datasheet drawing); drive with a chopper driver, supply voltage far above the 3.9 V rated coil voltage."

