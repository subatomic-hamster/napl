# Pin level: four colour-coded leads ending in a JST XHP-4 housing at 0.1 in spacing (P1: black + green = one coil, red + blue = the other). P1 gives the colour pairing, not the order in the housing.
[[connectors]]
id = "PH"
name = "phase leads (JST XHP-4)"
type = "jst-xh-4"
port_type = "stepper-bipolar-4wire"
gender = "female"
pos = [0.0, 0.0, -0.038]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 4
pitch = 0.00254
src = "P1"
fidelity = "estimated"
rationale = "P1 states the JST XHP-4 housing with 0.1 in spacing and the colour pairing of the coils; the position of each colour in the housing is not stated: black, green, red, blue is assumed."
pose_rationale = "P1 does not say where the leads leave the body: drawn at the centre of the rear face (positional estimate)."
pins = [
  { number = 1, name = "A1", kind = "power", dir = "in", i_max = 1.68, note = "black wire, coil A (P1)" },
  { number = 2, name = "A2", kind = "power", dir = "in", i_max = 1.68, note = "green wire, coil A (P1)" },
  { number = 3, name = "B1", kind = "power", dir = "in", i_max = 1.68, note = "red wire, coil B (P1)" },
  { number = 4, name = "B2", kind = "power", dir = "in", i_max = 1.68, note = "blue wire, coil B (P1)" },
]

