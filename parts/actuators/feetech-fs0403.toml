id = "feetech-fs0403"
name = "FEETECH FS0403 sub-micro analog hobby servo (Pololu 3421)"
category = "motor.servo"
vendor = "FEETECH (via Pololu item 3421)"
part_number = "FS0403"
url = "https://www.pololu.com/product/3421"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The Pololu specs give the case envelope 20.0 x 8.3 x 19.3 mm only; the horn spline and mounting-ear hole spacing are not on the pages, so the ports are opaque family tags.

[params]
mass            = { value = 0.005,   unit = "kg",   src = "S1", fidelity = "datasheet" }
envelope_length = { value = 0.020,   unit = "m",    src = "S1", fidelity = "datasheet" }
envelope_width  = { value = 0.0083,  unit = "m",    src = "S1", fidelity = "datasheet" }
envelope_height = { value = 0.0193,  unit = "m",    src = "S1", fidelity = "datasheet" }
protocol        = { value = "analog PWM servo pulses 900-2100 us, about 120 deg operating angle", unit = "-", src = "S2", fidelity = "datasheet" }
position_range  = { value = 2.0944,  unit = "rad",  src = "S2", fidelity = "datasheet" }  # approximate 120 deg
v_operating_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage
v_operating_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage
no_load_speed_4v8 = { value = 11.636, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.09 sec/60 deg
no_load_speed_6v0 = { value = 13.090, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.08 sec/60 deg
stall_torque_4v8  = { value = 0.05884, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 0.6 kg.cm
stall_torque_6v0  = { value = 0.06865, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 0.7 kg.cm
lead_length     = { value = 0.1524, unit = "m", src = "S1", fidelity = "datasheet" }  # 6 in

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-sub-micro-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Sub-micro hobby servo mounting ears; hole spacing and case height not on the pages, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.feetech-sub-micro"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "Output spline not stated on the pages (additional horns are included); opaque tag, symmetry 1 as a placeholder."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-3pin"
gender = "male"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "JR-style (Futaba-compatible) connector on a 6 in cable; no current rating on the pages."

[[ports]]
name = "signal"
kind = "signal"
type = "pwm"
gender = "male"
note = "Pulse range 900-2100 us (S2); signal level not on the pages."

[[sources]]
id = "S1"
url = "https://www.pololu.com/product/3421/specs"
title = "Pololu item 3421 Specs tab (FEETECH Sub-Micro Servo FS0403)"
accessed = "2026-10-07"
quote = "Size: | 20.0 × 8.3 × 19.3 mm | Weight: | 5 g | General specifications | Digital?: | N | Speed @ 6V: | 0.08 sec/60° | Stall torque @ 6V: | 0.7 kg·cm | Speed @ 4.8V: | 0.09 sec/60° | Stall torque @ 4.8V: | 0.6 kg·cm | Hardware included?: | Y | Lead length: | 6 in"

[[sources]]
id = "S2"
url = "https://www.pololu.com/product/3421"
title = "Pololu item 3421 product page (FEETECH Sub-Micro Servo FS0403)"
accessed = "2026-10-07"
quote = "The FS0403 is a very small 5 g analog servo from FEETECH (formerly known as Fitec) that offers position control over an approximate 120° operating angle for servo pulses between 900 µs and 2100 µs. | The servo has a 6″ (15 cm) cable that is terminated with a standard JR-style connector, which is Futaba-compatible"
