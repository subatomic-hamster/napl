part_number = "SY57STH41-1006A"
url = "https://www.pololu.com/product/1476"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.041, 0]. Six leads, centre-tapped coils; electrical figures are 'per coil'.
# Hole pattern (NEMA 23) is only in the drawing; the PDF text layer shows '4-' and a number but not the spacing, so the family tag is opaque.

[params]
mass               = { value = 0.450,   unit = "kg",    src = "S2", fidelity = "datasheet" }
