body_length        = { value = 0.041,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S2", fidelity = "datasheet" }  # 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
phases             = { value = 2,       unit = "1",     src = "S2", fidelity = "datasheet" }
leads              = { value = 6,       unit = "1",     src = "S1", fidelity = "datasheet" }
rated_current      = { value = 1.0,     unit = "A",     src = "S2", fidelity = "datasheet" }  # per coil
rated_voltage      = { value = 5.7,     unit = "V",     src = "S2", fidelity = "datasheet" }
phase_resistance   = { value = 5.7,     unit = "ohm",   src = "S2", fidelity = "datasheet" }  # per coil, +/-10 % at 25 degC
phase_inductance   = { value = 0.0054,  unit = "H",     src = "S2", fidelity = "datasheet" }  # per coil, +/-20 %
holding_torque     = { value = 0.39,    unit = "N*m",   src = "S2", fidelity = "datasheet" }  # 39 N.cm
detent_torque      = { value = 0.0206,  unit = "N*m",   src = "S2", fidelity = "datasheet" }  # 0.21 kg.cm
rotor_inertia      = { value = 1.2e-5,  unit = "kg*m^2", src = "S2", fidelity = "datasheet" }  # "Rotor Torque (g.cm2) 120" is the rotor inertia, 120 g.cm^2
shaft_diameter     = { value = 0.00635, unit = "m",     src = "S1", fidelity = "datasheet" }
shaft_type         = { value = "1/4 inch (6.35 mm) D-shaft, 0.5 mm flat, 2 ball bearings", unit = "-", src = "S3", fidelity = "datasheet" }
radial_force_max   = { value = 75, unit = "N", src = "S2", fidelity = "datasheet" }  # 20 mm from the flange
axial_force_max    = { value = 15, unit = "N", src = "S2", fidelity = "datasheet" }
temp_rise_max      = { value = 80, unit = "degC", src = "S2", fidelity = "datasheet" }  # at rated current, 2 phases on
kt_equiv_phase = { value = 0.2758, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.39 N*m / (1.4142 * 1.0 A) = 0.2758 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }

