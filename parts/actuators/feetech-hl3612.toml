id = "feetech-hl3612"
name = "Feetech HL-3612 7.4V 15kg.cm 1/405 coreless magnetic-encoder serial bus servo (HL-3612-C001)"
category = "motor.servo"
vendor = "Feetech (Shenzhen Feite Model Co., Ltd.)"
part_number = "HL-3612-C001"
url = "https://openelab.io/products/feetech-hl3612-ttl-servo-motor"

# Frame: origin on the output axis at the horn-side (top) face of the case; +z = output axis out of the case;
# x = long case dimension (36 mm), y = short (15 mm). Case occupies z in [-0.0292, 0].

[params]
mass            = { value = 0.0382,  unit = "kg",  src = "S1", fidelity = "datasheet" }
length          = { value = 0.036,   unit = "m",   src = "S1", fidelity = "datasheet" }
width           = { value = 0.015,   unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.0292,  unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 405,     unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "metal gears, aluminium case, coreless motor, ball bearings", unit = "-", src = "S1", fidelity = "datasheet" }
backlash        = { value = 0.0087266, unit = "rad", src = "S1", fidelity = "datasheet" }  # <=0.5 deg
horn_spline     = { value = "25T, OD 5.95 mm", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit, ~0.088 deg
protocol        = { value = "Half-duplex TTL digital packets, 8N1, ID 0-253", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 38400,   unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 1000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "5264-3P (GND, VCC, TTL signal)", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60,  unit = "degC", src = "S1", fidelity = "datasheet" }

# --- datasheet performance (kg.cm converted with g = 9.80665) ---
v_nominal           = { value = 7.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_min     = { value = 5.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 8.4,    unit = "V",     src = "S1", fidelity = "datasheet" }
no_load_speed_7v4   = { value = 7.1238, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.147 s/60deg (68 RPM)
no_load_current_7v4 = { value = 0.18,   unit = "A",     src = "S1", fidelity = "datasheet" }
stall_torque_7v4    = { value = 1.4710, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 15 kg.cm
stall_current_7v4   = { value = 1.6,    unit = "A",     src = "S1", fidelity = "datasheet" }
rated_torque_7v4    = { value = 0.3678, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 3.75 kg.cm
rated_current_7v4   = { value = 0.4,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 5.7540, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.182 s/60deg
stall_torque_6v     = { value = 1.1768, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 12 kg.cm
rated_torque_6v     = { value = 0.2942, unit = "N*m",   src = "S1", fidelity = "datasheet" }  # 3 kg.cm

# --- DC-motor equivalent (motor side), derived from the 7.4 V point ---
r_effective = { value = 4.625, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 7.4 V / 1.6 A = 4.625 ohm (includes driver and lead resistance at stall)." }
omega_noload_motor_7v4 = { value = 2885.2, unit = "rad/s", fidelity = "derived", derivation = "N * omega_out = 405 * (pi/3 rad / 0.147 s = 7.1238 rad/s) = 2885.2 rad/s (27553 RPM)." }
ke = { value = 0.002276, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R)/(N*omega_out) = (7.4 - 0.18*4.625)/(405*7.1238) = 6.5675/2885.2 = 2.276e-3 V*s/rad. Agrees with HL-3606 (2.225e-3) to 2%, i.e. the same motor family." }
kt_motor = { value = 0.002276, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency_raw = { value = 1.124, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) = 1.4710/(405*0.002276*(1.6-0.18)) = 1.124. Above 1 is impossible: published stall torque/current and no-load values are mutually inconsistent. Do NOT use as a physical efficiency." }
friction_torque_motor_noload = { value = 0.000410, unit = "N*m", fidelity = "derived", derivation = "Kt*I0 = 0.002276*0.18 = 4.10e-4 N*m at the motor shaft." }

