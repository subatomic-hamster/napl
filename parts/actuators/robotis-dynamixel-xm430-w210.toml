id = "robotis-dynamixel-xm430-w210"
name = "ROBOTIS DYNAMIXEL XM430-W210-T/R 12V 212.6:1 smart servo"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XM430-W210-T (TTL) / XM430-W210-R (RS-485)"
url = "https://emanual.robotis.com/docs/en/dxl/x/xm430-w210/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# Case 28.5 x 46.5 x 34 mm (W x H x D per ROBOTIS); D is taken as the extent along the output axis (inference), so the case occupies z in [-0.034, 0].
# Output axis in-plane offset is only in the drawing PDF/STEP; left at the origin.
# ROBOTIS publishes no no-load current, so Ke is computed with I0*R neglected. Same motor as XM430-W350 (Ke agrees to 0.4%).
# Frame-hole family 'dynamixel-x430-frame' shared with XL430/XC430 (ROBOTIS lists the same FR12 frames on all their pages; inference).

[params]
mass            = { value = 0.082,   unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.0285,  unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.0465,  unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 212.6,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "full metal gears; metal front/middle case, plastic back; coreless motor", unit = "-", src = "S1", fidelity = "datasheet" }
backlash        = { value = 0.004363, unit = "rad", src = "S1", fidelity = "datasheet" }  # 15 arcmin (0.25 deg)
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute, ams AS5045
protocol        = { value = "DYNAMIXEL RS-485 or TTL multidrop, half-duplex async serial 8N1 (TTL) / async serial 8N1 (RS-485), IDs 0-252", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4500000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "TTL: JST EHR-03 / B3B-EH-A (GND, VDD, DATA); RS-485: JST EHR-04 / B4B-EH-A (GND, VDD, DATA+, DATA-)", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 80, unit = "degC", src = "S1", fidelity = "datasheet" }
standby_current = { value = 0.040, unit = "A", src = "S1", fidelity = "datasheet" }
radial_load_max = { value = 40, unit = "N", src = "S1", fidelity = "datasheet" }  # 10 mm away from the horn
axial_load_max  = { value = 20, unit = "N", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "ROBOTIS X430 horn (spline/bolt circle only in the XM430 drawing PDF/STEP, not retrievable as text)", unit = "-", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at three supply voltages ---
v_nominal           = { value = 12.0,   unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 12.0 [V]"
v_operating_min     = { value = 10.0,   unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 14.8,   unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_11v1   = { value = 2.7,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_11v1  = { value = 2.1,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_11v1  = { value = 7.330,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 70 rev/min
stall_torque_12v    = { value = 3.0,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_12v   = { value = 2.3,    unit = "A",     src = "S1", fidelity = "datasheet" }
kt_output_12v       = { value = 1.304,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }
no_load_speed_12v   = { value = 8.063,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 77 rev/min
stall_torque_14v8   = { value = 3.7,    unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_14v8  = { value = 2.7,    unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_14v8  = { value = 9.948,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 95 rev/min

# --- DC-motor equivalent (motor side), derived from the three points (I0 unpublished, neglected) ---
r_effective = { value = 5.33, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall: 11.1 V/2.1 A = 5.286, 12 V/2.3 A = 5.217, 14.8 V/2.7 A = 5.481 ohm; mean 5.33 ohm (includes driver and lead resistance; identical to XM430-W350)." }
ke = { value = 0.00704, unit = "V*s/rad", fidelity = "derived", derivation = "Ke ~ V/(N*omega_out) with I0*R neglected: 11.1 V -> 7.123e-3, 12 V -> 7.000e-3, 14.8 V -> 6.998e-3 (omega_out = 70/77/95 rev/min * 2*pi/60, N = 212.6); mean 7.04e-3 V*s/rad." }
kt_motor = { value = 0.00704, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.882, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Ke*I_stall): 11.1 V 0.849, 12 V 0.876, 14.8 V 0.921; mean 0.882 (published 1-decimal stall current is +/-4%, so +/-0.04)." }

[tables.datasheet_points]
columns = ["voltage_V", "stall_torque_Nm", "stall_current_A", "kt_output_Nm_per_A", "no_load_rpm"]
rows = [[11.1, 2.7, 2.1, 1.286, 70], [12.0, 3.0, 2.3, 1.304, 77], [14.8, 3.7, 2.7, 1.370, 95]]
src = "S1"
fidelity = "datasheet"

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-x430-frame"
gender = "neutral"
pos = [0.0, 0.0, -0.034]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Frame/side mounting points per ROBOTIS drawing (not retrievable as text); opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dxl-x430"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "ROBOTIS X430 output horn interface; spline/bolt circle not published as text."

[[ports]]
name = "power_in"
pins = ["TTL.1", "TTL.2"]
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "sink"
v_max = { value = 14.8, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 10.0, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 2.7, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 14.8 V; no continuous rating published
note = "TTL connector (JST EHR-03); the RS-485 connector (JST EHR-04) carries the same VDD/GND daisy-chain."

[[ports]]
name = "bus_ttl"
pins = ["TTL.3"]
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
note = "TTL half-duplex multidrop on JST EHR-03; ROBOTIS notes the reference circuit targets 5 V or 5 V-tolerant MCUs."

[[ports]]
name = "bus_rs485"
pins = ["RS485.3", "RS485.4"]
kind = "signal"
type = "rs485"
gender = "female"
note = "RS-485 on JST EHR-04 (DATA+/DATA-); same bus as TTL, alternative physical layer."

# Pin level: the TTL (JST EHR-03) and RS-485 (JST EHR-04) connectors from the e-Manual Connector Information table (P1). RS485.1 / RS485.2 (GND, VDD) are the
# same daisy-chain nets as TTL.1 / TTL.2 (see the power_in note) and stay in the connector's own synthetic port.
[[connectors]]
id = "TTL"
name = "TTL connector (JST EHR-03)"
type = "jst-eh-3"
port_type = "jst-eh.3"
gender = "female"
pos = [-0.01425, 0.0, -0.012]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.0025
src = "P1"
fidelity = "datasheet"
rationale = "P1 gives the housing (JST EHR-03) and the pin functions; the 2.5 mm pitch is the JST EH-series pitch, not stated in P1."
pose_rationale = "The e-Manual drawing is not machine-readable, so the connector position on the case is a positional estimate (side of the case, near the base)."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "VDD", kind = "power", dir = "in" },
  { number = 3, name = "DATA", kind = "signal", dir = "io", note = "half-duplex TTL (P1)" },
]

[[connectors]]
id = "RS485"
name = "RS-485 connector (JST EHR-04)"
type = "jst-eh-4"
port_type = "rs485"
gender = "female"
pos = [0.01425, 0.0, -0.012]
axis = [1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 4
pitch = 0.0025
src = "P1"
fidelity = "datasheet"
rationale = "P1 gives the housing (JST EHR-04) and the pin functions; the 2.5 mm pitch is the JST EH-series pitch, not stated in P1."
pose_rationale = "The e-Manual drawing is not machine-readable, so the connector position on the case is a positional estimate (opposite side from the TTL connector)."
pins = [
  { number = 1, name = "GND", kind = "ground" },
  { number = 2, name = "VDD", kind = "power", dir = "in" },
  { number = 3, name = "DATA+", kind = "signal", dir = "io" },
  { number = 4, name = "DATA-", kind = "signal", dir = "io" },
]

