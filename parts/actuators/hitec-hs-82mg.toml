id = "hitec-hs-82mg"
name = "Hitec HS-82MG micro-size hobby servo"
category = "motor.servo"
vendor = "Hitec RCD (via ServoCity)"
part_number = "HS-82MG"
url = "https://www.servocity.com/hs-82mg-servo/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The ServoCity Specs tab gives no case dimensions, so no height param; the base port sits at z=0 and is positional only.

[params]
mass = { value = 0.0190, unit = "kg", src = "S1", fidelity = "datasheet" }  # 0.66oz (19g)
servo_size_class = { value = "Micro", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline = { value = "C24T Spline", unit = "-", src = "S1", fidelity = "datasheet" }
gear_material = { value = "4 Metal and 1 Nylon", unit = "-", src = "S1", fidelity = "datasheet" }
motor_type = { value = "3 Pole Ferrite", unit = "-", src = "S1", fidelity = "datasheet" }
output_shaft_support = { value = "Outer case serves as bearing", unit = "-", src = "S1", fidelity = "datasheet" }
protocol = { value = "PWM 600-2200us, pulse amplitude 3-5V, deadband 8us", unit = "-", src = "S1", fidelity = "datasheet" }
position_range = { value = 2.8798, unit = "rad", src = "S1", fidelity = "datasheet" }  # 165°
v_operating_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage; page Voltage Range: 4.8V - 6.0V
v_operating_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage; page Voltage Range: 4.8V - 6.0V
no_load_speed_4v8 = { value = 8.727, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.12sec/60°
no_load_speed_6v0 = { value = 10.472, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.10sec/60°
stall_torque_4v8 = { value = 0.2740, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 38.8 oz-in (2.8 kg.cm)
stall_torque_6v0 = { value = 0.3333, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 47.2 oz-in (3.4 kg.cm)
idle_current_4v8 = { value = 0.0088, unit = "A", src = "S1", fidelity = "datasheet" }  # 8.8mA
idle_current_6v0 = { value = 0.0091, unit = "A", src = "S1", fidelity = "datasheet" }  # 9.1mA
no_load_current_4v8 = { value = 0.2200, unit = "A", src = "S1", fidelity = "datasheet" }  # 220mA
no_load_current_6v0 = { value = 0.2800, unit = "A", src = "S1", fidelity = "datasheet" }  # 280mA
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60, unit = "degC", src = "S1", fidelity = "datasheet" }
feedback = { value = "5KΩ Potentiometer", unit = "-", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-micro-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Micro-size hobby servo mounting ears; hole spacing and case height not on the page, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.c24t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 24
note = "Hitec C24T output spline (24 teeth); horns are not interchangeable across spline families."

[[ports]]
name = "power_in"
pins = ["SRV.1", "SRV.2"]
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; i_max not stated unless a stall current is tabulated."

[[ports]]
name = "signal"
pins = ["SRV.3"]
kind = "signal"
type = "pwm"
gender = "female"
level = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lower end of the 3-5V pulse amplitude

# Pin level: the 3-pin servo lead. Wire colours and order from P1 (a Hitec retailer's description covering all Hitec servos); S1 does not describe the lead.
[[connectors]]
id = "SRV"
name = "servo lead (3-pin Hitec/JR plug)"
type = "servo-lead-3"
port_type = "servo-3pin"
gender = "female"
pos = [-0.012, 0.0, -0.01]
axis = [-1.0, 0.0, 0.0]
ref = [0.0, 1.0, 0.0]
rows = 1
cols = 3
pitch = 0.00254
src = "P1"
fidelity = "literature"
pose_rationale = "Servo case dimensions are not in the sources, so the lead exit is a positional estimate: at the -x end of a micro-size case, lead pointing out along -x."
pins = [
  { number = 1, name = "GND", kind = "ground", note = "black wire (P1)" },
  { number = 2, name = "V+", kind = "power", dir = "in", note = "red, centre wire (P1)" },
  { number = 3, name = "SIGNAL", kind = "signal", dir = "in", note = "yellow, third wire (P1)" },
]

[[sources]]
id = "P1"
url = "https://www.superdroidrobots.com/shop/item.aspx/hs-422-servo/184"
title = "SuperDroid Robots - HS-422 Servo (Hitec), product description"
accessed = "2026-10-09"
quote = "On all Hitec servos the Black wire is 'ground', the Red wire (center wire) is 'power', and the yellow (third) wire is 'signal'. This servo has a Hitec/JR connector which mates directly with a 0.1\" 3-pin header."

