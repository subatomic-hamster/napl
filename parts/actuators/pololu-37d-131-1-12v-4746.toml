id = "S2"
url = "https://www.pololu.com/product/4742"
title = "Pololu item 4742 product page (37D family mounting holes and load limits; item 4746 shares the 37D face plate, an inference from the shared 37D family and same-page naming)"
accessed = "2026-10-07"
quote = "The face plate has six mounting holes evenly spaced around the outer edge threaded for M3 screws. These mounting holes form a regular hexagon and the centers of neighboring holes are 15.5 mm apart. || We recommend screwing no more than 3mm (0.12″) into the screw hole. || The recommended upper limit for continuously applied loads is 10 kg-cm (150 oz-in), and the recommended upper limit for instantaneous torque is 25 kg-cm (350 oz-in). || a general recommendation for brushed DC motor operation is 25% or less of the stall current."
