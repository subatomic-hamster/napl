id = "hitec-hs-311"
name = "Hitec HS-311 standard-size hobby servo"
category = "motor.servo"
vendor = "Hitec RCD (via ServoCity)"
part_number = "HS-311"
url = "https://www.servocity.com/hs-311/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The ServoCity Specs tab gives no case dimensions, so no height param; the base port sits at z=0 and is positional only.

[params]
mass = { value = 0.0430, unit = "kg", src = "S1", fidelity = "datasheet" }  # 1.52oz (43g)
servo_size_class = { value = "Standard", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline = { value = "C24T Spline", unit = "-", src = "S1", fidelity = "datasheet" }
gear_material = { value = "Nylon", unit = "-", src = "S1", fidelity = "datasheet" }
motor_type = { value = "Cored", unit = "-", src = "S1", fidelity = "datasheet" }
output_shaft_support = { value = "Top Resin Bushing", unit = "-", src = "S1", fidelity = "datasheet" }
protocol = { value = "PWM 575-2460us, pulse amplitude 3-5V, deadband 5us", unit = "-", src = "S1", fidelity = "datasheet" }
position_range = { value = 3.5256, unit = "rad", src = "S1", fidelity = "datasheet" }  # 202°
v_operating_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage; page Voltage Range: 4.8V - 6.0V
v_operating_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage; page Voltage Range: 4.8V - 6.0V
no_load_speed_4v8 = { value = 5.512, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.19sec/60°
no_load_speed_6v0 = { value = 6.981, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.15sec/60°
stall_torque_4v8 = { value = 0.2966, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 42 oz-in (3.0 kg/cm)
stall_torque_6v0 = { value = 0.3601, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 51 oz-in (3.7 kg/cm)
idle_current_4v8 = { value = 0.0074, unit = "A", src = "S1", fidelity = "datasheet" }  # 7.4mA
idle_current_6v0 = { value = 0.0077, unit = "A", src = "S1", fidelity = "datasheet" }  # 7.7mA
no_load_current_4v8 = { value = 0.1600, unit = "A", src = "S1", fidelity = "datasheet" }  # 160mA
no_load_current_6v0 = { value = 0.1800, unit = "A", src = "S1", fidelity = "datasheet" }  # 180mA
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60, unit = "degC", src = "S1", fidelity = "datasheet" }
feedback = { value = "5KΩ Potentiometer", unit = "-", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-standard-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Standard-size hobby servo mounting ears; hole spacing and case height not on the page, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.c24t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 24
note = "Hitec C24T output spline (24 teeth); horns are not interchangeable across spline families."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; i_max not stated unless a stall current is tabulated."

[[ports]]
name = "signal"
kind = "signal"
type = "pwm"
gender = "female"
level = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lower end of the 3-5V pulse amplitude

