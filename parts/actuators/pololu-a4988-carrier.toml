i_per_vref = { value = 1.838, unit = "A/V", fidelity = "derived", derivation = "From VREF = 8*I_max*R_CS with R_CS = 0.068 ohm: I_max = VREF/(8*0.068) = VREF/0.544 = 1.838 A per volt (Pololu's own example: 1 A needs VREF = 540 mV, i.e. 1.85 A/V)." }

