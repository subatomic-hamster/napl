id = "soyo-sy42sth38-1684a-nema17"
name = "SOYO SY42STH38-1684A NEMA 17 bipolar stepper motor, 42x38 mm, 1.68 A (Pololu 2267)"
category = "motor.stepper"
vendor = "SOYO / Changzhou Songyang Machinery & Electronics (Pololu item 2267)"
part_number = "SY42STH38-1684A"
url = "https://www.pololu.com/product/2267"

# Frame: origin on the shaft axis at the front mounting-flange face; +z = shaft direction (out of the motor); x/y along the square flange sides.
# Body occupies z in [-0.038, 0]. Mounting: 4 x M3 (4.5 mm deep) on a 31 mm square pattern with a 22 mm pilot boss, per the manufacturer drawing text.

[params]
mass               = { value = 0.285,   unit = "kg",    src = "S1", fidelity = "datasheet" }
flange_size        = { value = 0.0423,  unit = "m",     src = "S1", fidelity = "datasheet" }  # 42.3 mm square
body_length        = { value = 0.038,   unit = "m",     src = "S1", fidelity = "datasheet" }  # not including the shaft
step_angle         = { value = 0.031416, unit = "rad",  src = "S2", fidelity = "datasheet" }  # 1.8 deg
steps_per_rev      = { value = 200,     unit = "1",     src = "S1", fidelity = "datasheet" }
phases             = { value = 2,       unit = "1",     src = "S2", fidelity = "datasheet" }
leads              = { value = 4,       unit = "1",     src = "S1", fidelity = "datasheet" }
rated_current      = { value = 1.68,    unit = "A",     src = "S2", fidelity = "datasheet" }  # per coil
rated_voltage      = { value = 2.8,     unit = "V",     src = "S2", fidelity = "datasheet" }
phase_resistance   = { value = 1.65,    unit = "ohm",   src = "S2", fidelity = "datasheet" }  # per coil, +/-10 % at 25 degC
phase_inductance   = { value = 0.0032,  unit = "H",     src = "S2", fidelity = "datasheet" }  # per coil, +/-20 %
holding_torque     = { value = 0.36,    unit = "N*m",   src = "S2", fidelity = "datasheet" }  # 36 N.cm
shaft_diameter     = { value = 0.005,   unit = "m",     src = "S2", fidelity = "datasheet" }
shaft_type         = { value = "5 mm D-shaft (0.5 mm flat), 24 +/-1 mm long, 2 ball bearings", unit = "-", src = "S2", fidelity = "datasheet" }
pilot_diameter     = { value = 0.022,   unit = "m",     src = "S2", fidelity = "datasheet" }
mount_pattern      = { value = "31 +/-0.2 mm square, 4 x M3, 4.5 mm deep", unit = "-", src = "S2", fidelity = "datasheet" }
radial_force_max   = { value = 28, unit = "N", src = "S2", fidelity = "datasheet" }  # 20 mm from the flange
axial_force_max    = { value = 10, unit = "N", src = "S2", fidelity = "datasheet" }
temp_rise_max      = { value = 80, unit = "degC", src = "S2", fidelity = "datasheet" }  # at rated current, 2 phases on
kt_equiv_phase = { value = 0.1515, unit = "N*m/A", fidelity = "derived", derivation = "Torque constant per phase from the holding torque with both phases at rated current: T_hold = sqrt(2)*Kt*I  =>  Kt = 0.36 N*m / (1.4142 * 1.68 A) = 0.1515 N*m/A. Equals the back-EMF constant Ke (V*s/rad) per phase for an ideal motor." }

