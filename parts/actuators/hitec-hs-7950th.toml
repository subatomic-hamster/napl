id = "hitec-hs-7950th"
name = "Hitec HS-7950TH standard-size hobby servo"
category = "motor.servo"
vendor = "Hitec RCD (via ServoCity)"
part_number = "HS-7950TH"
url = "https://www.servocity.com/hs-7950th-servo/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The ServoCity Specs tab gives no case dimensions, so no height param; the base port sits at z=0 and is positional only.

[params]
mass = { value = 0.0680, unit = "kg", src = "S1", fidelity = "datasheet" }  # 2.40oz (68g)
servo_size_class = { value = "Standard", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline = { value = "C24T Spline", unit = "-", src = "S1", fidelity = "datasheet" }
gear_material = { value = "Titanium Gears", unit = "-", src = "S1", fidelity = "datasheet" }
motor_type = { value = "Coreless Carbon Brush", unit = "-", src = "S1", fidelity = "datasheet" }
output_shaft_support = { value = "Dual Ball Bearing MR106", unit = "-", src = "S1", fidelity = "datasheet" }
protocol = { value = "PWM 750-2250us, pulse amplitude 3-5V, deadband 1us", unit = "-", src = "S1", fidelity = "datasheet" }
position_range = { value = 2.0944, unit = "rad", src = "S1", fidelity = "datasheet" }  # 120°
position_range_reprogrammed = { value = 3.4558, unit = "rad", src = "S1", fidelity = "datasheet" }  # 198°
v_operating_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage; page Voltage Range: 6.0V - 7.4V
v_operating_max = { value = 7.4, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage; page Voltage Range: 6.0V - 7.4V
no_load_speed_7v4 = { value = 8.055, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.13 sec/60°
no_load_speed_4v8 = { value = 5.818, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.18 sec/60°
no_load_speed_6v0 = { value = 6.981, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.15 sec/60°
stall_torque_4v8 = { value = 2.4292, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 344oz-in. (22kg.cm)
stall_torque_6v0 = { value = 2.8387, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 402oz-in. (29kg.cm)
stall_torque_7v4 = { value = 3.4319, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 486oz-in. (35kg.cm)
idle_current_4v8 = { value = 0.0090, unit = "A", src = "S1", fidelity = "datasheet" }  # 9mA
idle_current_6v0 = { value = 0.0090, unit = "A", src = "S1", fidelity = "datasheet" }  # 9mA
no_load_current_4v8 = { value = 0.2200, unit = "A", src = "S1", fidelity = "datasheet" }  # 220mA
no_load_current_6v0 = { value = 0.3000, unit = "A", src = "S1", fidelity = "datasheet" }  # 300mA
stall_current_4v8 = { value = 3.8000, unit = "A", src = "S1", fidelity = "datasheet" }  # 3.8A
stall_current_6v0 = { value = 4.8000, unit = "A", src = "S1", fidelity = "datasheet" }  # 4.8A
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60, unit = "degC", src = "S1", fidelity = "datasheet" }
feedback = { value = "5KΩ Potentiometer", unit = "-", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-standard-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Standard-size hobby servo mounting ears; hole spacing and case height not on the page, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.c24t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 24
note = "Hitec C24T output spline (24 teeth); horns are not interchangeable across spline families."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 7.4, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; i_max not stated unless a stall current is tabulated."

[[ports]]
name = "signal"
kind = "signal"
type = "pwm"
gender = "female"
level = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lower end of the 3-5V pulse amplitude

