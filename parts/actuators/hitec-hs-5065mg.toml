id = "hitec-hs-5065mg"
name = "Hitec HS-5065MG sub-micro-size hobby servo"
category = "motor.servo"
vendor = "Hitec RCD (via ServoCity)"
part_number = "HS-5065MG"
url = "https://www.servocity.com/hs-5065mg/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# The ServoCity Specs tab gives no case dimensions, so no height param; the base port sits at z=0 and is positional only.

[params]
mass = { value = 0.0119, unit = "kg", src = "S1", fidelity = "datasheet" }  # 0.42oz (11.9g)
servo_size_class = { value = "Sub-Micro", unit = "-", src = "S1", fidelity = "datasheet" }
horn_spline = { value = "B25T Spline", unit = "-", src = "S1", fidelity = "datasheet" }
gear_material = { value = "Metal", unit = "-", src = "S1", fidelity = "datasheet" }
motor_type = { value = "Carbon Brush", unit = "-", src = "S1", fidelity = "datasheet" }
output_shaft_support = { value = "Top Ball Bearing", unit = "-", src = "S1", fidelity = "datasheet" }
protocol = { value = "PWM 750-2250us, pulse amplitude 3-5V, deadband 2us", unit = "-", src = "S1", fidelity = "datasheet" }
position_range = { value = 2.2340, unit = "rad", src = "S1", fidelity = "datasheet" }  # 128°
position_range_reprogrammed = { value = 3.1590, unit = "rad", src = "S1", fidelity = "datasheet" }  # 181°
v_operating_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }  # lowest tabulated voltage; page Voltage Range: 4.8V - 6.0V
v_operating_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # highest tabulated voltage; page Voltage Range: 4.8V - 6.0V
no_load_speed_4v8 = { value = 7.480, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.14 sec/60°
no_load_speed_6v0 = { value = 9.520, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 0.11 sec/60°
stall_torque_4v8 = { value = 0.1765, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 24.99 oz-in (1.8 kg.cm)
stall_torque_6v0 = { value = 0.2157, unit = "N*m", src = "S1", fidelity = "datasheet" }  # 30.55 oz-in (2.2 kg.cm)
idle_current_4v8 = { value = 0.0030, unit = "A", src = "S1", fidelity = "datasheet" }  # 3mA
idle_current_6v0 = { value = 0.0030, unit = "A", src = "S1", fidelity = "datasheet" }  # 3mA
no_load_current_6v0 = { value = 0.2000, unit = "A", src = "S1", fidelity = "datasheet" }  # 200mA
no_load_current_7v4 = { value = 0.2400, unit = "A", src = "S1", fidelity = "datasheet" }  # 240mA
stall_current_4v8 = { value = 2.0000, unit = "A", src = "S1", fidelity = "datasheet" }  # 2A
stall_current_6v0 = { value = 3.0000, unit = "A", src = "S1", fidelity = "datasheet" }  # 3A
operating_temp_min = { value = -20, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 60, unit = "degC", src = "S1", fidelity = "datasheet" }
feedback = { value = "5KΩ Potentiometer", unit = "-", src = "S1", fidelity = "datasheet" }

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.servo-sub-micro-ears"
gender = "neutral"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Sub-Micro-size hobby servo mounting ears; hole spacing and case height not on the page, opaque family tag; z is positional only."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.b25t"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 25
note = "Hitec B25T output spline (25 teeth); horns are not interchangeable across spline families."

[[ports]]
name = "power_in"
kind = "power"
type = "servo-3pin"
gender = "female"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 4.8, unit = "V", src = "S1", fidelity = "datasheet" }
note = "Power shares the 3-pin servo connector with the signal; i_max not stated unless a stall current is tabulated."

[[ports]]
name = "signal"
kind = "signal"
type = "pwm"
gender = "female"
level = { value = 3.0, unit = "V", src = "S1", fidelity = "datasheet" }  # lower end of the 3-5V pulse amplitude

