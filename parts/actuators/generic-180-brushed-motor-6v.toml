# 180-size can (Mabuchi FK-180 / RS-180 style, 15.3 mm x 20 mm flat-sided can). This is a generic, unbranded listing: every figure is the seller's, and the seller contradicts himself on the
# no-load speed (30000 rpm in the spec list, 24000 RPM in the package description); the larger of the two is recorded and the other noted. No Mabuchi datasheet for this size could be fetched.
# Whether a stock Rival blaster uses 130- or 180-size motors was not established (a Nerf-modding forum post, S2, says flywheel blasters in general ship 130-size motors and that 180 is the upgrade size).
# The motor is rated 3.7-6 V. From a 3S / 4S LiPo (11.1-16.8 V) it must be driven by PWM with an average voltage <= 6 V (duty <= 0.5 at 12 V) or from a 6 V regulator: the MOSFET gate sees the PWM,
# the winding sees the peak battery voltage, which the listing does not rate. This is a design choice for the SPEC worker, not a part property.
# Frame: origin on the shaft axis at the front (shaft-end) face of the can; +z = shaft direction (out of the motor); body occupies z in [-0.032, 0]; the 20 mm side along x, the 15.3 mm side along y.

