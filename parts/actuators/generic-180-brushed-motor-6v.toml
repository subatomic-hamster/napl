kt_equiv           = { value = 1.452e-3, unit = "N*m/A", fidelity = "derived", derivation = "Equal to ke_equiv in SI units for an ideal DC motor. Stall torque would be 1.452e-3 * 1.88 A = 2.7 mN*m at 6 V (the listing gives none)." }

