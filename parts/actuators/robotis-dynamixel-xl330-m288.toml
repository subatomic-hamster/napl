id = "robotis-dynamixel-xl330-m288"
name = "ROBOTIS DYNAMIXEL XL330-M288-T 5V 288.4:1 smart servo"
category = "motor.servo"
vendor = "ROBOTIS"
part_number = "XL330-M288-T"
url = "https://emanual.robotis.com/docs/en/dxl/x/xl330-m288/"

# Frame: origin on the output axis at the horn-seat face of the case; +z = output axis out of the case.
# Case 20.0 x 34.0 x 26.0 mm (W x H x D per ROBOTIS); D is taken as the extent along the output axis (inference), so the case occupies z in [-0.026, 0].
# Output axis in-plane offset from the case centre is only in the XL330 drawing (PDF/STEP); left at the origin.
# ROBOTIS publishes no no-load current, so Ke is computed with I0*R neglected (Ke slightly over-estimated, efficiency slightly under-estimated).

[params]
mass            = { value = 0.018,   unit = "kg",  src = "S1", fidelity = "datasheet" }
width           = { value = 0.020,   unit = "m",   src = "S1", fidelity = "datasheet" }
height          = { value = 0.034,   unit = "m",   src = "S1", fidelity = "datasheet" }
depth           = { value = 0.026,   unit = "m",   src = "S1", fidelity = "datasheet" }
gear_ratio      = { value = 288.4,   unit = "1",   src = "S1", fidelity = "datasheet" }
gear_material   = { value = "engineering plastic gears and case; cored motor", unit = "-", src = "S1", fidelity = "datasheet" }
encoder_resolution = { value = 4096, unit = "counts/rev", src = "S1", fidelity = "datasheet" }  # 12-bit contactless absolute, ams AS5601
protocol        = { value = "DYNAMIXEL TTL half-duplex asynchronous serial, 8N1, 3.3 V logic (5 V compatible), IDs 0-252", unit = "-", src = "S1", fidelity = "datasheet" }
baud_min        = { value = 9600,    unit = "bit/s", src = "S1", fidelity = "datasheet" }
baud_max        = { value = 4000000, unit = "bit/s", src = "S1", fidelity = "datasheet" }
connector       = { value = "JST EHR-03 housing / JST B3B-EH-A header, pins GND-VDD-DATA", unit = "-", src = "S1", fidelity = "datasheet" }
operating_temp_min = { value = -5, unit = "degC", src = "S1", fidelity = "datasheet" }
operating_temp_max = { value = 70, unit = "degC", src = "S1", fidelity = "datasheet" }
standby_current = { value = 0.017, unit = "A", src = "S1", fidelity = "datasheet" }
horn_spline     = { value = "ROBOTIS XL330 horn (spline/bolt circle only in the XL330.pdf/.stp drawing, not retrievable as text)", unit = "-", src = "S1", fidelity = "datasheet" }

# --- datasheet performance at three supply voltages ---
v_nominal           = { value = 5.0,    unit = "V",     src = "S1", fidelity = "datasheet" }  # "Recommended : 5.0 [V]"
v_operating_min     = { value = 3.7,    unit = "V",     src = "S1", fidelity = "datasheet" }
v_operating_max     = { value = 6.0,    unit = "V",     src = "S1", fidelity = "datasheet" }
stall_torque_5v     = { value = 0.52,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_5v    = { value = 1.47,   unit = "A",     src = "S1", fidelity = "datasheet" }
kt_output_5v        = { value = 0.354,  unit = "N*m/A", src = "S1", fidelity = "datasheet" }
no_load_speed_5v    = { value = 10.786, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 103 rev/min
stall_torque_6v     = { value = 0.60,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_6v    = { value = 1.74,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_6v    = { value = 12.881, unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 123 rev/min
stall_torque_3v7    = { value = 0.42,   unit = "N*m",   src = "S1", fidelity = "datasheet" }
stall_current_3v7   = { value = 1.11,   unit = "A",     src = "S1", fidelity = "datasheet" }
no_load_speed_3v7   = { value = 7.958,  unit = "rad/s", src = "S1", fidelity = "datasheet" }  # 76 rev/min

# --- DC-motor equivalent (motor side), derived from the 5 V and 6 V points (I0 unpublished, neglected) ---
r_effective = { value = 3.42, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall: 5 V/1.47 A = 3.401 ohm, 6 V/1.74 A = 3.448 ohm; mean 3.42 ohm (includes driver and lead resistance). Identical to XL330-M077: same motor and drive." }
ke = { value = 0.001611, unit = "V*s/rad", fidelity = "derived", derivation = "Ke ~ V/(N*omega_out) with I0*R neglected: 5 V/(288.4*10.786 rad/s) = 1.607e-3; 6 V/(288.4*12.881) = 1.615e-3; mean 1.611e-3 V*s/rad (0.3% from XL330-M077, a consistency check on the same motor)." }
kt_motor = { value = 0.001611, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.752, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Ke*I_stall): 5 V 0.52/(288.4*0.001607*1.47) = 0.763; 6 V 0.60/(288.4*0.001615*1.74) = 0.740; mean 0.752 (a lower bound since I0 is neglected; plastic gear train)." }

[tables.datasheet_points]
columns = ["voltage_V", "stall_torque_Nm", "stall_current_A", "kt_output_Nm_per_A", "no_load_rpm"]
rows = [[3.7, 0.42, 1.11, 0.378, 76], [5.0, 0.52, 1.47, 0.354, 103], [6.0, 0.60, 1.74, 0.345, 123]]
src = "S1"
fidelity = "datasheet"

[[ports]]
name = "base"
kind = "mech"
type = "bolt-pattern.dynamixel-xl330-frame"
gender = "neutral"
pos = [0.0, 0.0, -0.026]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "Frame/side mounting points per ROBOTIS drawing (XL330.pdf/.dwg/.stp, not retrievable as text); opaque family tag."

[[ports]]
name = "output"
kind = "mech"
type = "servo-horn.dxl-xl330"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "ROBOTIS XL330 output horn interface; spline/bolt circle not published as text."

[[ports]]
name = "power_in"
kind = "power"
type = "jst-eh.3"
gender = "female"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }
v_min = { value = 3.7, unit = "V", src = "S1", fidelity = "datasheet" }
i_peak = { value = 1.74, unit = "A", src = "S1", fidelity = "datasheet" }  # stall current at 6 V; no continuous rating published

[[ports]]
name = "bus"
kind = "signal"
type = "dynamixel-ttl"
gender = "female"
level = { value = 3.3, unit = "V", src = "S1", fidelity = "datasheet" }

