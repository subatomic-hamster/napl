id = "pololu-micro-metal-hp-6v-100-1"
name = "Pololu 100:1 Micro Metal Gearmotor HP 6V (item 1101)"
category = "motor.dc.gearmotor"
vendor = "Pololu"
part_number = "Pololu 1101"
url = "https://www.pololu.com/product/1101"

# Frame: origin on the output-shaft axis at the gearbox face plate; +z = shaft direction; body (gearbox cross-section 10 x 12 mm, x = 12 mm, y = 10 mm) occupies z in [-0.025, 0];
# the 3 mm D-shaft extends 9 mm to z = +0.009. The shaft is not centred in the 10 x 12 cross-section (not published numerically); the origin is on the shaft axis.
# Size note: Pololu lists 25 mm body length on the Specs tab but its footnote says the shaft adds 10 mm to a 26 mm length; 25 mm is used.
# Full DC-motor model derivable: published no-load speed/current and extrapolated stall torque/current at 6 V.

[params]
mass               = { value = 0.0095,  unit = "kg",     src = "S1", fidelity = "datasheet" }
body_width         = { value = 0.012,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_height        = { value = 0.010,   unit = "m",      src = "S1", fidelity = "datasheet" }
body_length        = { value = 0.025,   unit = "m",      src = "S1", fidelity = "datasheet" }
shaft_diameter     = { value = 0.003,   unit = "m",      src = "S1", fidelity = "datasheet" }
shaft_length       = { value = 0.009,   unit = "m",      src = "S2", fidelity = "datasheet" }
shaft_type         = { value = "3 mm D-shaft", unit = "-", src = "S1", fidelity = "datasheet" }
gear_ratio         = { value = 100.37,  unit = "1",      src = "S1", fidelity = "datasheet" }
gear_material      = { value = "nitride-hardened martensitic stainless steel gears, brass plates", unit = "-", src = "S3", fidelity = "datasheet" }
v_nominal          = { value = 6.0,     unit = "V",      src = "S1", fidelity = "datasheet" }
no_load_speed_6v   = { value = 32.463,  unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 310 rpm
no_load_current_6v = { value = 0.10,    unit = "A",      src = "S1", fidelity = "datasheet" }  # typical, +/-50 %
stall_torque_6v    = { value = 0.16671, unit = "N*m",    src = "S1", fidelity = "datasheet" }  # 1.7 kg.cm, extrapolated
stall_current_6v   = { value = 1.6,     unit = "A",      src = "S1", fidelity = "datasheet" }  # extrapolated
max_output_power_6v = { value = 1.3,    unit = "W",      src = "S1", fidelity = "datasheet" }
max_efficiency_6v  = { value = 0.37,    unit = "1",      src = "S1", fidelity = "datasheet" }
speed_at_max_eff   = { value = 26.18,   unit = "rad/s",  src = "S1", fidelity = "datasheet" }  # 250 rpm
torque_at_max_eff  = { value = 0.02844, unit = "N*m",    src = "S1", fidelity = "datasheet" }  # 0.29 kg.cm
current_at_max_eff = { value = 0.33,    unit = "A",      src = "S1", fidelity = "datasheet" }
torque_limit_instantaneous = { value = 0.1961, unit = "N*m", src = "S4", fidelity = "datasheet" }  # 2 kg.cm recommended upper limit (all ratios except 380:1 and 1000:1)

# --- DC-motor equivalent (motor side), derived at 6 V ---
r_effective = { value = 3.75, unit = "ohm", fidelity = "derived", derivation = "R = V/I_stall = 6 V / 1.6 A = 3.75 ohm (Pololu stall values are theoretical extrapolations, so this is the winding resistance)." }
omega_noload_motor_6v = { value = 3258.3, unit = "rad/s", fidelity = "derived", derivation = "N * omega_out = 100.37 * 32.463 rad/s = 3258.3 rad/s (31115 RPM)." }
ke = { value = 0.001726, unit = "V*s/rad", fidelity = "derived", derivation = "Ke = (V - I0*R)/(N*omega_out) = (6 - 0.10*3.75)/(100.37*32.463) = 5.625/3258.3 = 1.726e-3 V*s/rad. Same motor as the other HP 6V ratios (1.73e-3 to 1.80e-3)." }
kt_motor = { value = 0.001726, unit = "N*m/A", fidelity = "derived", derivation = "SI identity Kt = Ke." }
gear_efficiency = { value = 0.641, unit = "1", fidelity = "derived", derivation = "eta = tau_stall/(N*Kt*(I_stall - I0)) = 0.16671/(100.37*0.001726*(1.6-0.10)) = 0.641. (Pololu's separate 'max efficiency' of 37 % is the overall motor+gearbox peak, a different quantity.)" }
friction_torque_motor_noload = { value = 0.000173, unit = "N*m", fidelity = "derived", derivation = "Kt*I0 = 0.001726*0.10 = 1.73e-4 N*m at the motor shaft (no-load current is typical +/-50 %)." }

[[ports]]
name = "body"
kind = "mech"
type = "body.10x12"
gender = "neutral"
pos = [0.0, 0.0, -0.0125]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 2
note = "10 x 12 mm gearbox cross-section, clamped by Pololu micro metal gearmotor brackets (S2); no face mounting holes documented in the retrieved text."

[[ports]]
name = "shaft"
kind = "mech"
type = "shaft.3d"
gender = "male"
pos = [0.0, 0.0, 0.0]
axis = [0.0, 0.0, 1.0]
ref = [1.0, 0.0, 0.0]
symmetry = 1
note = "3 mm D-shaft, 9 mm long; matches Pololu 3 mm wheels/hubs."

[[ports]]
name = "motor_power"
pins = ["MOT.1", "MOT.2"]
kind = "power"
type = "solder-pad"
gender = "neutral"
role = "sink"
v_max = { value = 6.0, unit = "V", src = "S1", fidelity = "datasheet" }  # rated (nominal) voltage
i_peak = { value = 1.6, unit = "A", src = "S1", fidelity = "datasheet" }  # extrapolated stall current
i_max = { value = 0.4, unit = "A", fidelity = "derived", derivation = "Pololu's general recommendation for brushed DC motors is 25 % or less of the stall current: 0.25 * 1.6 A = 0.4 A." }
note = "Two motor terminals; terminal style not stated in the retrieved text."

# Pin level: the two solder terminals on the motor end cap; spacing 7 mm for the precious-metal-brush versions (P1). Polarity is not marked (swap to reverse).
[[connectors]]
id = "MOT"
name = "motor terminals (2 solder tabs)"
type = "solder-pad-1x2"
port_type = "solder-pad"
gender = "neutral"
joinable = true
pos = [0.0, 0.0, -0.025]
axis = [0.0, 0.0, -1.0]
ref = [1.0, 0.0, 0.0]
rows = 1
cols = 2
pitch = 0.007
src = "P1"
fidelity = "datasheet"
pose_rationale = "P1 gives the terminal spacing but not their orientation on the end cap: placed on the rear face at z = -body_length, spaced along x (positional estimate)."
pins = [
  { number = 1, name = "M1", kind = "power", dir = "in", v_max = 6.0, i_max = 0.4 },
  { number = 2, name = "M2", kind = "power", dir = "in", v_max = 6.0, i_max = 0.4 },
]

[[sources]]
