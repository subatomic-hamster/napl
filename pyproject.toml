[build-system]
requires = ["scikit-build-core==1.1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "napl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "mcp==2.3.0", "gymnasium==1.4.0"]

# gymnasium: MIT; its own deps cloudpickle (BSD-3), farama-notifications (MIT), typing-extensions (PSF). No extras
# (no PyPI mujoco, box2d, atari). Never depend on PyPI `mujoco` (a second libmujoco in the process; plan Risk 7).
[project.scripts]
napl = "napl.cli:main"

[project.optional-dependencies]
# pytest-xdist (MIT; dep execnet, MIT): `pytest tests/python -n 12` runs the suite in parallel (px4 tests claim distinct instances, see conftest.py).
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "jedi==0.19.2"]
# jedi 0.19.2 (MIT; dep parso, MIT): the PROGRAM page's go to definition / rename / hover for python (python/napl/design/progops.py).
ide = ["jedi==0.19.2"]
# mavsdk (MAVSDK-Python): BSD-3-Clause. Only for the PX4 SITL flight test (tests/python/test_px4_flight.py).
px4 = ["mavsdk==4.0.3"]
# dynamixel-sdk (ROBOTIS DynamixelSDK, PyPI METADATA "License: Apache 2.0", LICENSE.txt = Apache License 2.0; dep: pyserial, BSD-3-Clause).
# Only for the SDK client test of the Dynamixel pty (tests/python/test_dynamixel.py); the port itself needs no SDK.
arm = ["dynamixel-sdk==4.1.0"]
# basicmicro (Basicmicro official RoboClaw library, PyPI METADATA "License :: OSI Approved :: MIT License", LICENSE = MIT; dep: pyserial, BSD-3-Clause).
# Only for the library client tests / example of the RoboClaw pty (tests/python/test_roboclaw.py, examples/rover/); the port needs no library.
rover = ["basicmicro==2.0.10"]
# build123d 0.13.0 (METADATA "License: Apache-2.0") for cad/cuas-lite/ only (parametric printed-part CAD, run on the build host, never imported by napl).
# Its wheels: cadquery-ocp-novtk 8.0.1.1.0 (bindings, Apache-2.0) bundling Open CASCADE (OCCT) as shared libraries: LGPL-2.1 + OCCT exception
# (https://dev.opencascade.org/doc/overview/html/occt_public_license.html), dynamically linked, not modified, not shipped by napl.
# trimesh 5.1.1 MIT. Other transitive deps are MIT/BSD/Apache/ISC/PSF (certifi MPL-2.0). tools/check_licenses.py scans build/_deps only: stays green.
cad = ["build123d==0.13.0", "trimesh==5.1.1"]
# osqp (OSQP, Stellato et al. 2020; PyPI METADATA "License: Apache-2.0"): the convex MPC of the dog's locomotion (examples/dog/loco/mpc.py).
# Transitive (uv resolved 6 packages): scipy 1.18.1 (METADATA license text = BSD-3-Clause, Enthought + SciPy Developers), jinja2 3.1.6 (LICENSE.txt
# BSD-3-Clause), markupsafe 3.0.4 ("License-Expression: BSD-3-Clause"), joblib 1.6.0 ("BSD-3-Clause"), setuptools 84.0.0 ("MIT"). Python only, never linked into napl.
loco = ["osqp==1.1.3"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
cmake.build-type = "RelWithDebInfo"
cmake.define.NAPL_PYTHON = "ON"
# Reuse the dev preset's tree (build/): MuJoCo+FlatBuffers sources and objects (~700 MB) exist exactly once.
build-dir = "build"
wheel.py-api = "cp312"
wheel.packages = ["python/napl"]
install.components = ["napl_python"]  # only _napl + libmujoco.so, not MuJoCo's own headers/cmake files
editable.mode = "redirect"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/lite", "tests/cuas2"]
markers = [
  "gpu: needs a Vulkan 1.3 device (skipped when there is none; set VK_DRIVER_FILES to pick the driver)",
  "px4: flies real PX4 SITL through napl-px4-bridge (needs the PX4 build, the bridge exe and mavsdk; skipped otherwise)",
]
