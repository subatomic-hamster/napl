[build-system]
requires = ["scikit-build-core==1.1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "napl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "mcp==2.3.0", "gymnasium==1.4.0"]

# gymnasium: MIT; its own deps cloudpickle (BSD-3), farama-notifications (MIT), typing-extensions (PSF). No extras
# (no PyPI mujoco, box2d, atari). Never depend on PyPI `mujoco` (a second libmujoco in the process; plan Risk 7).
[project.scripts]
napl = "napl.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# mavsdk (MAVSDK-Python): BSD-3-Clause. Only for the PX4 SITL flight test (tests/python/test_px4_flight.py).
px4 = ["mavsdk==4.0.3"]
# dynamixel-sdk (ROBOTIS DynamixelSDK, PyPI METADATA "License: Apache 2.0", LICENSE.txt = Apache License 2.0; dep: pyserial, BSD-3-Clause).
# Only for the SDK client test of the Dynamixel pty (tests/python/test_dynamixel.py); the port itself needs no SDK.
arm = ["dynamixel-sdk==4.1.0"]
# basicmicro (Basicmicro official RoboClaw library, PyPI METADATA "License :: OSI Approved :: MIT License", LICENSE = MIT; dep: pyserial, BSD-3-Clause).
# Only for the library client tests / example of the RoboClaw pty (tests/python/test_roboclaw.py, examples/rover/); the port needs no library.
rover = ["basicmicro==2.0.10"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
cmake.build-type = "RelWithDebInfo"
cmake.define.NAPL_PYTHON = "ON"
# Reuse the dev preset's tree (build/): MuJoCo+FlatBuffers sources and objects (~700 MB) exist exactly once.
build-dir = "build"
wheel.py-api = "cp312"
wheel.packages = ["python/napl"]
install.components = ["napl_python"]  # only _napl + libmujoco.so, not MuJoCo's own headers/cmake files
editable.mode = "redirect"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
  "gpu: needs a Vulkan 1.3 device (skipped when there is none; set VK_DRIVER_FILES to pick the driver)",
  "px4: flies real PX4 SITL through napl-px4-bridge (needs the PX4 build, the bridge exe and mavsdk; skipped otherwise)",
]
